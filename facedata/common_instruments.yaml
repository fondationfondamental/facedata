# The instruments that two FACE cohorts or more deliver, for work across cohorts.
#
# One entry per instrument. Written by hand after the schemas of the cohorts were
# compared variable by variable and their values compared on the extractions
# (answers of each item, spread of each score, direction of each item, sign of
# each z-score, unit of each measurement). facedata.common.catalogue() reads it,
# and tests/test_common.py checks it against the schemas.
#
#   title    what the instrument is
#   domain   the chapter of the catalogue
#   schemas  the name of its schema in each cohort that has it
#   stack    yes        the same form, coding and scoring: put the cohorts under one another
#            with care  the cohorts can be put together after reading the note
#            no         the same name or the same subject, not the same thing
#   use      the variables to analyse across cohorts (each is delivered by two cohorts at least)
#   note     what differs between the cohorts and what to know first
#
# The details of each cohort are in the notes of its schema and in
# facedata/<cohort>/differences.yaml.

# ---------------------------------------------------------------- Patient and visits

identite:
  title: Patient identity
  domain: Patient and visits
  schemas: {bp: identite, sz: identite, dr: identite, asp: identite}
  stack: "yes"
  use: [sex, birth_date, age_at_inclusion, diagnosis, fondacode]
  note: >
    In the table patients. diagnosis holds the diagnosis of each cohort, so its
    labels are not the same from one cohort to the next (bipolar type; kind of
    schizophrenia; major depressive disorder; autism confirmed or not confirmed).
    The autism cohort has children and a group that was assessed and not
    diagnosed. fondacode is the patient code across the cohorts.

visit_record:
  title: Visit record
  domain: Patient and visits
  schemas: {bp: visit_record, sz: visit_record, dr: visit_record, asp: visit_record}
  stack: "yes"
  use: [entry_date]
  note: The date the visit record was created. The date of the visit itself is the column visit_date of every row.

provenance:
  title: How the patient came to the expert centre
  domain: Patient and visits
  schemas: {bp: provenance, sz: provenance, dr: provenance}
  stack: with care
  use: [referred_by, catchment, heard_of_centre_from, visit_purpose]
  note: >
    In the table patients. referred_by is in the three cohorts. The catchment
    area, how the patient heard of the centre and the purpose of the visit are
    in BP and SZ; in DR the purpose is exported as a code that the dictionary
    does not explain (visit_purpose_code), which cannot be compared.

fin_de_suivi:
  title: End of follow-up
  domain: Patient and visits
  schemas: {bp: fin_de_suivi, sz: fin_de_suivi}
  stack: with care
  use: [followup_end_reason, death_date]
  note: >
    In the table patients. Filled for the few patients whose follow-up was
    closed; an empty cell does not mean that the patient is still followed.

# ---------------------------------------------------------------- Scales rated by the clinician

cgi_egf:
  title: Clinical Global Impression (CGI) and Global Assessment of Functioning (GAF)
  domain: Scales rated by the clinician
  schemas: {bp: cgi_egf, sz: cgi_egf, dr: cgi_egf, asp: cgi_egf}
  stack: "yes"
  use: [cgi_severity, gaf]
  note: >
    The CGI severity (1 to 7) and the GAF (1 to 100) are in the four cohorts.
    The CGI improvement, therapeutic effect, side effects and efficacy index
    are in BP and SZ only: the index is recomputed as 4 x (therapeutic effect
    - 1) + side effects, with the stored value as a check (the application
    computes it only when the side-effects label is clicked, so the stored
    index goes stale). DR has the severity only: the application collects a
    CGI-I that the extraction does not export (R145). SZ and DR keep the digits
    of the GAF only (R138).

madrs:
  title: Montgomery-Asberg Depression Rating Scale (MADRS)
  domain: Scales rated by the clinician
  schemas: {bp: madrs, dr: madrs}
  stack: "yes"
  use: [madrs_total]
  note: >
    Ten items of 0 to 6 and their sum, the same in both cohorts. In DR the
    scale is rated at the screening visit and again at the inclusion visit;
    the baseline row holds the inclusion rating.

ymrs:
  title: Young Mania Rating Scale (YMRS)
  domain: Scales rated by the clinician
  schemas: {bp: ymrs, sz: ymrs, dr: ymrs}
  stack: "yes"
  use: [ymrs_total]
  note: >
    Eleven items; items 5, 6, 8 and 9 count double (0, 2, 4, 6, 8). The SZ
    export maps the letters of items 5, 8 and 9 to levels 0 to 4 where BP and
    DR give points (a mapping slip, R135) and its stored total counts them
    once: the package delivers the three items in points and the published
    total, so that the three cohorts are on one scale. The stored SZ total is
    lower on 776 of 4,538 visits. In DR the scale is not asked on the
    simplified visits of 2018 onward (R139): it is on nine inclusions in ten
    to 2017 and one in two since 2018.

fast:
  title: Functioning Assessment Short Test (FAST)
  domain: Scales rated by the clinician
  schemas: {bp: fast, dr: fast}
  stack: "yes"
  use: [fast_total, fast_autonomy, fast_occupational, fast_cognitive, fast_financial, fast_interpersonal, fast_leisure]
  note: >
    Twenty-four items of 0 to 3, six domains and a total, recomputed from the
    items in both cohorts. Higher is worse. The DR application script empties
    all six domains when one item is blank and the package recomputes a domain
    on a partial visit. In DR the scale is not asked on the simplified visits
    of 2018 onward (R139): it is on nine inclusions in ten to 2017 and one in
    two since 2018.

etat_depressif:
  title: Depressive symptoms present at the visit (DSM-IV criterion A checklist)
  domain: Scales rated by the clinician
  schemas: {bp: etat_depressif, dr: etat_depressif}
  stack: with care
  use: [etatd_total]
  note: >
    Nine symptoms and their count; the form is filled whatever the mood state
    (it is not an episode). The details of a symptom (weight gain or loss,
    insomnia or hypersomnia, agitation or retardation) are not recorded the
    same way in the two cohorts (DR has a list form with an 'unknown' option 3
    and gated details): use the nine symptoms and the count. The DR ninth
    symptom reads 'or a specific plan', the BP one does not: the yes rates are
    not comparable.

etat_maniaque:
  title: Manic symptoms present at the visit (DSM-IV checklist)
  domain: Scales rated by the clinician
  schemas: {bp: etat_maniaque, dr: etat_maniaque}
  stack: "yes"
  use: [etatm_total]
  note: Nine symptoms and their count, the same in both cohorts.

# ---------------------------------------------------------------- Questionnaires filled by the patient

ctq:
  title: Childhood Trauma Questionnaire, short form (CTQ, 28 items)
  domain: Questionnaires filled by the patient
  schemas: {bp: ctq, sz: ctq, dr: ctq, asp: ctq}
  stack: "yes"
  use: [ctq_total, ctq_emotional_abuse, ctq_physical_abuse, ctq_sexual_abuse, ctq_emotional_neglect, ctq_physical_neglect]
  note: >
    The 28 items are delivered on one coding (1 to 5, as asked) and the five
    sub-scores and the total are recomputed from them in the four cohorts. In DR
    seven items are stored reversed and are read back; in DR and ASP several
    stored sub-scores are wrong and are not delivered. The severity classes are
    in BP and SZ only. Filled by adults; in ASP from 2020.

psqi:
  title: Pittsburgh Sleep Quality Index (PSQI)
  domain: Questionnaires filled by the patient
  schemas: {bp: psqi, sz: psqi, dr: psqi, asp: psqi}
  stack: "yes"
  use: [psqi_total, psqi06, psqi_latency_component, psqi_duration, psqi_efficiency, psqi_disturbances, psqi07, psqi_dysfunction]
  note: >
    Seven components of 0 to 3 and their sum, on the same rules in the four
    cohorts; components 1 and 6 are the answers to questions 6 and 7 (psqi06,
    psqi07). In ASP three stored components are wrong and are recomputed. In
    BP, SZ and DR the same three, recomputed with the published rules, equal
    the stored ones (2 of 16,678 BP visits differ, none of 3,107 SZ and 1,031
    DR visits; checked 2026-11-18), so they are delivered as stored.
    Exactly 7 hours of sleep count 0: the application tests "7 hours or more",
    where the published sheet says "more than 7 hours" and leaves 7 hours
    open. It is the same in the four cohorts, so they compare. In ASP the PSQI belongs to the old set of forms (2013 to
    2021, adults). In DR it is on about nine inclusions in ten until 2016 and
    about one in two since 2018.

mars:
  title: Medication Adherence Rating Scale (MARS, 10 items)
  domain: Questionnaires filled by the patient
  schemas: {bp: mars, sz: mars, dr: mars, asp: mars}
  stack: "yes"
  use: [mars_total]
  note: >
    Ten yes/no items and a total of 0 to 10 (higher is better adherence). DR and
    ASP store the answers the other way round; they are read on the BP coding
    and the total is recomputed. In ASP it belongs to the new set of forms (from
    2021, adults). In DR it is on about nine inclusions in ten until 2016 and
    about one in two since 2018.

eq5d:
  title: EQ-5D-5L, health-related quality of life
  domain: Questionnaires filled by the patient
  schemas: {bp: eq5d, sz: eq5d, dr: eq5d, asp: eq5d}
  stack: "yes"
  use: [eq5d0201, eq5d0202, eq5d0203, eq5d0204, eq5d0205, eq5d_vas, eq5d_index]
  note: >
    Five dimensions of 1 to 5 and the visual scale of 0 to 100, in the four
    cohorts. The utility index is the one the database stores, in BP, SZ and
    ASP, and the DR extraction has none. Its value set is not documented, but
    it is one table: each of the 876 BP, 603 SZ and 248 ASP health profiles
    has one index, and the 446 profiles shared by BP and SZ and the 224 shared
    by BP and ASP have the same index in both (checked 2026-11-18). ASP holds
    28 indices above 1, which no value set gives; they are out of range. The index delivered is the table's value, read from the five answers in the four cohorts (BP D133), so it is on one value set everywhere; DR, which stores none, now has it.

fagerstrom:
  title: Fagerström Test for Nicotine Dependence (6 items)
  domain: Questionnaires filled by the patient
  schemas: {bp: fagerstrom, sz: fagerstrom, dr: fagerstrom, asp: fagerstrom}
  stack: "yes"
  use: [fagerstrom_total]
  note: Six items and a total of 0 to 10, recomputed from the items. Filled by smokers only.

stai_ya:
  title: State-Trait Anxiety Inventory, form Y-A (state anxiety, 20 items)
  domain: Questionnaires filled by the patient
  schemas: {bp: stai_ya, dr: stai_ya, asp: stai_ya}
  stack: with care
  use: [staya_total]
  note: >
    Twenty items of 1 to 4 and a total of 20 to 80. DR stores the answers on
    three codings (0 to 3, 1 to 4, 2 to 5) and ASP on 0 to 3: the coding of a
    visit is read from its answers, or from the centre and the year when the
    answers do not tell, and the items are delivered on the BP coding. The total
    does not depend on the coding. Filled by adults; in ASP it belongs to the
    new set of forms (from 2019). In DR it is on about nine inclusions in ten
    until 2016 and about one in two since 2018.

epworth:
  title: Epworth Sleepiness Scale (ESS, 8 items)
  domain: Questionnaires filled by the patient
  schemas: {bp: epworth, dr: epworth, asp: epworth}
  stack: "yes"
  use: [epworth_total]
  note: >
    Eight situations of 0 to 3 and a total of 0 to 24, the same in the three
    cohorts. Filled by adults; in ASP from 2021. In DR it is on about nine
    inclusions in ten until 2016 and about one in two since 2018.

prisem:
  title: PRISE-M, side effects of the treatment (32 items)
  domain: Questionnaires filled by the patient
  schemas: {bp: prisem, dr: prisem, asp: prisem}
  stack: "yes"
  use: [prisem_total]
  note: >
    Thirty-two items and their sum, the same in the three cohorts; the total
    needs 28 items at least. In ASP from 2021 (adults). In DR it is on about
    nine inclusions in ten until 2016 and about one in two since 2018.

asrs:
  title: Adult ADHD Self-Report Scale (ASRS v1.1, 18 items)
  domain: Questionnaires filled by the patient
  schemas: {bp: asrs, asp: asrs}
  stack: "yes"
  use: [asrs_total]
  note: >
    Eighteen items of 0 to 4 and their sum. Added in 2021 in BP and in 2019 in
    ASP (adults). The screening result of the first six items is delivered in BP
    only.

altman:
  title: Altman Self-Rating Mania Scale (ASRM, 5 items)
  domain: Questionnaires filled by the patient
  schemas: {bp: altman, dr: altman}
  stack: "yes"
  use: [altman_total]
  note: >
    Five items of 0 to 4 and their sum. In BP it is also filled at the screening
    visit. In DR it is on about nine inclusions in ten until 2016 and about one
    in two since 2018.

qids_sr16:
  title: Quick Inventory of Depressive Symptomatology, self-report (QIDS-SR16)
  domain: Questionnaires filled by the patient
  schemas: {bp: qids_sr16, dr: qids_sr16}
  stack: "yes"
  use: [qids_total]
  note: >
    Sixteen items and a total of 0 to 27, computed by the same function in both
    cohorts. Filled at the screening visit and at the inclusion visit in both.

mdq:
  title: Mood Disorder Questionnaire (MDQ)
  domain: Questionnaires filled by the patient
  schemas: {bp: mdq, dr: mdq}
  stack: with care
  use: [mdq_total]
  note: >
    Thirteen symptoms and their count. In BP it is filled once, at the screening
    visit, so it is in the baseline row and not in the inclusion row, for the
    patients who had a screening visit. In DR it is filled at the inclusion
    visit and at the yearly visits.

bis10:
  title: Barratt Impulsiveness Scale, BIS-10 (34 items)
  domain: Questionnaires filled by the patient
  schemas: {bp: bis10, dr: bis10}
  stack: with care
  use: [bis10_total, bis10_motor, bis10_attention, bis10_planning]
  note: >
    The same key in both cohorts; in DR eleven items are stored reversed and are
    read back. The key of the French BIS-10 could not be checked against its
    publication (an open question of BP). BP used the BIS-10 until 2022 and the
    BIS-12 afterwards, which is another instrument (bis12). In DR it is on about
    nine inclusions in ten until 2016 and about one in two since 2018.

csm:
  title: Composite Scale of Morningness (CSM, 13 items)
  domain: Questionnaires filled by the patient
  schemas: {bp: csm, dr: csm}
  stack: "yes"
  use: [csm_total]
  note: >
    Thirteen items and a total of 13 to 55, the same in both cohorts. BP fills
    it once, at the inclusion visit. In DR it is on about nine inclusions in ten
    until 2016 and about one in two since 2018.

mathys:
  title: Multidimensional Assessment of Thymic States (MAThyS, 20 items)
  domain: Questionnaires filled by the patient
  schemas: {bp: mathys, dr: mathys}
  stack: with care
  use: [mathys_total, mathys_emotion, mathys_motivation, mathys_perception, mathys_interaction, mathys_cognition]
  note: >
    Twenty visual scales of 0 to 10, five sub-scores and a total, recomputed
    from the items with the same key in both cohorts: the published one, which
    is also that of the application. In BP the form stored the eight reversed
    scales already turned until 2021: they are turned back, and the visits from
    September 2021 to December 2022, when the centres changed form, have no
    total (BP D91). In DR the key holds in every year. In DR it is on
    about nine inclusions in ten until 2016 and about one in two since 2018.

mathys_emotions:
  title: MAThyS, how often seven emotions were felt
  domain: Questionnaires filled by the patient
  schemas: {bp: mathys_emotions, dr: mathys_emotions}
  stack: "yes"
  use: [mathys21, mathys22, mathys23, mathys24, mathys25, mathys26, mathys27]
  note: >
    Seven questions, the same in both cohorts. No score. In DR it is on about
    nine inclusions in ten until 2016 and about one in two since 2018.

physical_activity:
  title: Physical activity over the last seven days
  domain: Questionnaires filled by the patient
  schemas: {sz: physical_activity, dr: physical_activity}
  stack: with care
  use: [vigorous_days, moderate_days, walking_days]
  note: >
    The same fourteen questions in both cohorts (days, hours and minutes of each
    kind of activity over the last seven days). The numbers of days compare. The
    hours and the minutes are typed in several ways and are delivered as typed,
    and a sitting time above 24 hours is not delivered in DR: no total is
    computed, and the durations need a rule of your own.

wurs:
  title: Wender Utah Rating Scale
  domain: Questionnaires filled by the patient
  schemas: {bp: wurs25, sz: wurs}
  stack: "no"
  note: >
    BP has two forms, the 61-item one until 2021 and the 25-item one after, in
    two instruments (wurs61, wurs25). SZ reads the same 25 columns as one
    instrument whatever the year, so a SZ column mixes the two forms, and its
    names (wurs_NN) are not those of BP. Do not stack until the SZ forms are
    told apart (an open question of SZ).

# ---------------------------------------------------------------- Neuropsychology

neuropsy_conditions:
  title: Conditions of the neuropsychological assessment
  domain: Neuropsychology
  schemas: {bp: neuropsy_conditions, sz: neuropsy_conditions, dr: neuropsy_conditions, asp: assessment_conditions}
  stack: with care
  use: [neuropsy_age, neuropsy_age_used, education_years, neuropsy_mood_rating_delay, neuropsy_no_visual_disorder, neuropsy_no_hearing_disorder, neuropsy_french_fluent, neuropsy_state_compatible, neuropsy_psychotropic_treatment, neuropsy_learning_disorder]
  note: >
    The age typed at the testing, its reconciled version neuropsy_age_used (the
    age the norms of the tab are read with) and the years of education are in BP,
    SZ and DR; ASP has neither (its application takes the age at the date of the
    assessment form). The questions with the same names have the same meaning:
    visual and hearing disorder in the four cohorts; sufficient French in BP, SZ
    and ASP (DR asks for the mother tongue); compatible clinical state, treatment
    by psychotropic drugs (1 yes, 0 no, 2 or unknown is missing) and learning
    disorder in SZ, DR and ASP. The handedness is in BP and DR (DR codes 1 = right)
    and in ASP under the name handedness_np (1 = left); SZ has none. Three questions
    are not the same from one cohort to the next (the second box of the form, the
    period of the last episode). The form of SZ covers 3,455 visits to 2026; from
    2022 about half of the BP inclusions hold it.

tmt:
  title: Trail Making Test, parts A and B
  domain: Neuropsychology
  schemas: {bp: tmt, sz: tmt, dr: tmt}
  stack: "yes"
  use: [tmt_a_time, tmt_b_time, tmt_ba_time, tmt_a_errors_z, tmt_b_errors_z, tmt_a_time_z, tmt_b_time_z, tmt_ba_time_z, tmt_a_time_band, tmt_b_time_band]
  note: >
    The times stack as they are. The z-scores and the time bands are computed
    again from the raw scores in the three cohorts with the table of the
    application's script (BP D135): z = (mean - raw) / SD for the age and the
    years of education, so a higher z is a better performance and the sign is
    the same everywhere; the age is the one typed in the form where it is within
    a year of the age at the visit. The stored z-scores are checks: where a centre
    wrote the opposite sign (13% of the BP visits, mostly before 2013, one SZ centre
    in 2011-2012, three z-scores of DR in every year) the cell gets sign_flipped,
    elsewhere a difference is a score_mismatch. A visit with no education has no
    z-score. The z-scores are not clipped (no winsorising). The error bands read the
    checked difference of B and A; the lowest band is never open (BP D138-D143). The raw error counts differ: BP and SZ store the corrected and the
    uncorrected, DR a typed total and four kinds.

verbal_fluency:
  title: Verbal fluency, letter P and animals
  domain: Neuropsychology
  schemas: {bp: verbal_fluency, sz: verbal_fluency, dr: verbal_fluency}
  stack: with care
  use: [fluency_p_words, fluency_animals_words, fluency_p_z, fluency_animals_z]
  note: >
    The number of words, the z-score and the percentile band of each task are in
    the three cohorts. The errors are in BP and SZ. DR has two forms of the test
    and no code that names them: the form with the letter P and animals is told
    from the data, and the second form (the letter R and fruits, as the eCEDR
    form says) is another instrument whose z-score and band are typed by hand.
    One rule for the education below 6 years in the three cohorts (the lowest
    class); the DR application reads the middle class on 16 visits.

cvlt:
  title: California Verbal Learning Test (CVLT)
  domain: Neuropsychology
  schemas: {bp: cvlt, sz: cvlt}
  stack: with care
  use: [cvlt_total_1_5, cvlt_short_free, cvlt_long_free, cvlt_long_cued, cvlt_hits]
  note: >
    The raw scores stack, and so do the z-scores and the bands: in both
    cohorts they are computed again with the regressions of the norms, from
    the raw score, the age, the years of education and the sex. The percentile
    bands of the twelve measures that have a table (serial clustering too,
    since BP D129) are read in the same tables from the raw score and the age,
    with one rule for ties (the lowest band it can be, `_cens` = 1), so a band
    of BP and a band of SZ are on one scale. The semantic clustering index is
    out of range from 8 on in both (a typed count, BP D130); a few counts
    between 4 and 8 cannot be told from an index.

errands_test:
  title: Errands test (Test des commissions)
  domain: Neuropsychology
  schemas: {bp: errands_test, sz: errands_test, asp: executive_functions}
  stack: with care
  use: [errands_errors, errands_detours, errands_late_trips, errands_logic_errors]
  note: >
    The four counts of errors and their sum are in the three cohorts (from 2017
    or 2018; in BP on inclusions from 2021). The time, the z-scores and the
    bands are in BP and SZ and are computed again from the raw counts with the
    same tables in both (BP D135; a higher z-score is better; the age typed in
    the form, 20 to 60 years, and the years of education: 12 years or more is the
    class of the baccalaureate, as for the other tests, whatever the class ticked
    in the form). The z-scores typed in BP mix two sign conventions (BP D126) and
    are only checks. ASP has the counts only, in seconds, with no norm: no z-score,
    no band (the schema executive_functions holds this test only).

wais3_matrices:
  title: WAIS-III matrix reasoning
  domain: Neuropsychology
  schemas: {bp: wais3_matrices, sz: wais3_matrices}
  stack: with care
  use: [wais3_mat_total, wais3_mat_scaled, wais3_mat_z]
  note: >
    The 26 items, the total, the scaled score and the z-score, the same in both
    cohorts. Visits tested with the third edition only (until 2015 or 2016).
    33 SZ visits labelled WAIS-III were given the WAIS-IV (SZ O16): the version
    rule reads them as WAIS-IV from the digit-span sequencing task (flag
    version_overridden), so their cells are in the WAIS-IV schemas.

wais3_memoire_chiffres:
  title: WAIS-III digit span
  domain: Neuropsychology
  schemas: {bp: wais3_memoire_chiffres, sz: wais3_memoire_chiffres}
  stack: "yes"
  use: [wais3_ds_total, wais3_ds_scaled, wais3_ds_z, wais3_ds_forward_span, wais3_ds_backward_span]
  note: The summary scores are in both cohorts; the items are in BP only.

wais3_code_symboles_ivt:
  title: WAIS-III coding
  domain: Neuropsychology
  schemas: {bp: wais3_code_symboles_ivt, sz: wais3_code_symboles_ivt}
  stack: "yes"
  use: [wais3_code_raw, wais3_code_scaled, wais3_code_z]
  note: The coding subtest is in both cohorts; the symbol search and the processing speed index of the third edition are in BP only.

wais4_matrices:
  title: WAIS-IV matrix reasoning
  domain: Neuropsychology
  schemas: {bp: wais4_matrices, sz: wais4_matrices, asp: wais4_matrices}
  stack: "yes"
  use: [wais4_mat_total, wais4_mat_scaled, wais4_mat_z]
  note: >
    The total, the scaled score and the z-score are in the three cohorts. In
    SZ items 25 and 26 are lost by the export, so its total is the stored one.

wais4_similitudes:
  title: WAIS-IV similarities
  domain: Neuropsychology
  schemas: {bp: wais4_similitudes, sz: wais4_similitudes, dr: wais4_similitudes, asp: wais4_similitudes}
  stack: "yes"
  use: [wais4_simil_total, wais4_simil_scaled, wais4_simil_z]
  note: >
    The total, the scaled score and the z-score are in the four cohorts, with the
    same names, ranges and direction: for the same total and the same age the four
    cohorts give one scaled score (0 conflicts). The total is the sum of the items
    in BP and ASP and the stored total in SZ (its export copies one item twice) and
    DR (no items). The stored scaled score is wrong in the application (it read an
    empty age: BP 34% of the visits, SZ 7%, DR 5% typing error in its table):
    the recomputed score is delivered. No score below 16 or from 80 years.
    wais4_simil_not_done is in BP only.

wais4_memoire_chiffres:
  title: WAIS-IV digit span
  domain: Neuropsychology
  schemas: {bp: wais4_memoire_chiffres, sz: wais4_memoire_chiffres, dr: wais4_memoire_chiffres, asp: wais4_memoire_chiffres}
  stack: "yes"
  use: [wais4_ds_total, wais4_ds_scaled, wais4_ds_z, wais4_ds_forward_span, wais4_ds_backward_span, wais4_ds_sequencing_span]
  note: >
    The total, the scaled score and the z-score are in the four cohorts; the
    three spans are in BP, SZ and ASP. In BP the columns of the extraction are
    shifted and are read back in their place.

wais4_code_symboles_ivt:
  title: WAIS-IV coding, symbol search and processing speed index
  domain: Neuropsychology
  schemas: {bp: wais4_code_symboles_ivt, sz: wais4_code_symboles_ivt, dr: wais4_code_symboles_ivt, asp: wais4_code_symboles_ivt}
  stack: "yes"
  use: [wais4_code_raw, wais4_code_scaled, wais4_code_z, wais4_symbol_raw, wais4_symbol_scaled, wais4_ivt_index]
  note: >
    The coding subtest is in the four cohorts; the symbol search is in BP, DR
    and ASP. The raw score of the coding is the boxes filled minus the errors in
    the four cohorts (BP D136: the application stopped taking the errors off in
    2021). The processing speed index of this form is wais4_ivt_index in the four
    cohorts (in SZ an estimate from the coding alone); the clinician's copy of
    ASP is wais4_ivt_index_clinician.

wais4_arithmetique:
  title: WAIS-IV arithmetic
  domain: Neuropsychology
  schemas: {sz: wais4_arithmetique, dr: wais4_arithmetique, asp: wais4_arithmetique}
  stack: "yes"
  use: [wais4_arith_total, wais4_arith_scaled, wais4_arith_z]
  note: The total, the scaled score and the z-score are in the three cohorts; the items in SZ and ASP.

wais4_vocabulaire:
  title: WAIS-IV vocabulary
  domain: Neuropsychology
  schemas: {bp: wais4_vocabulaire, asp: wais4_vocabulaire}
  stack: "yes"
  use: [wais4_vocab_total, wais4_vocab_scaled, wais4_vocab_z]
  note: >
    The 30 items, the total, the scaled score and the z-score, the same in both
    cohorts, read in the same table (the ASP row at 25 to 29 years replaces the BP
    script row, which was not monotone). In BP the subtest was given from 2011 to
    2021, then replaced by the similarities.

wais4_information:
  title: WAIS-IV information
  domain: Neuropsychology
  schemas: {sz: wais4_information, asp: wais4_information}
  stack: "yes"
  use: [wais4_info_total, wais4_info_scaled, wais4_info_z]
  note: The items, the total, the scaled score and the z-score, the same in both cohorts.

wais4_complement_images:
  title: WAIS-IV picture completion
  domain: Neuropsychology
  schemas: {sz: wais4_complement_images, asp: wais4_complement_images}
  stack: with care
  use: [wais4_pc_total, wais4_pc_scaled]
  note: The same schema, but ASP holds the subtest on a handful of visits only.

wais4_efficience:
  title: WAIS-IV indices of the neuropsychology form
  domain: Neuropsychology
  schemas: {sz: wais4_efficience, dr: wais4_efficience, asp: wais4_efficience}
  stack: with care
  use: [wais4_imt_sum_scaled, wais4_imt_index, wais4_imt_percentile, wais4_icv_index, wais4_irp_index, wais4_qit]
  note: >
    The working memory index is in the three cohorts, and the three other
    indices and the full-scale IQ in SZ and ASP, under the same names. The sums of
    the scaled scores are recomputed from the scaled scores that the subtest
    schemas deliver (BP D137), and the indices are read in the table of the
    application from them; the stored sums and indices are checks. SZ stores the
    working memory index 0.7 and the full-scale IQ 2.9 below the table. The sums
    are not the same: SZ and the second set of ASP (_a) use 1.5 x (similarities +
    information) for the verbal comprehension, ASP uses the three subtests. In ASP
    the clinician's copy of the medical evaluation (about five times more visits;
    it equals the form on 83% to 92% of the visits that have both, 76% for the IQ)
    is under the names ending in _clinician. BP delivers the processing speed
    index only (no information, arithmetic or block design in its form).

barona:
  title: Premorbid IQ expected from occupation and education (Barona)
  domain: Neuropsychology
  schemas: {sz: barona, asp: barona}
  stack: with care
  use: [barona_expected_qit, barona_qit_difference, barona_occupation, barona_education]
  note: >
    The expected full-scale IQ and its difference with the measured one are in
    both cohorts; the expected verbal and performance IQ in SZ only. The expected
    IQ is computed from the sex, the diploma, the occupation and the age
    (regression of the application, BP D138-D143): in SZ with the typed age, in ASP
    with the age at the date of the form. In SZ the occupation is not reliable (it
    follows the diploma on 72% of the visits) and the expected IQs keep their value
    with the flag check_failed: read the flags before comparing. The ASP codes 0
    and 8 of the occupation (about 460 expected IQs) are outside the seven ranks of
    the formula; the difference is the stored one (derived_doubt where the expected
    IQ moved).

lis:
  title: Attribution of intentions in six film clips (LIS)
  domain: Neuropsychology
  schemas: {sz: lis, asp: social_cognition}
  stack: with care
  use: [lis_total]
  note: >
    The total is in both cohorts (a distance to reference ratings: lower is
    better); the answers to each clip are in SZ only, where the total is recomputed
    from them (BP D138-D143). In ASP the total is typed by hand, with no ratings
    and a different scale: do not pool the two. Added in 2018 in ASP.

learning_disorders:
  title: History of learning and developmental disorders
  domain: Neuropsychology
  schemas: {bp: learning_disorders, dr: learning_disorders, asp: learning_disorders}
  stack: with care
  use: [trbapp01, trbapp02, trbapp03, trbapp04, trbapp05, trbapp06, trbapp07, trbapp08, trbapp09, trbapp10]
  note: >
    Ten yes/no questions under the same names. DR fills the form on a few dozen
    visits only. In ASP 'not known' is a code read as missing.

# ---------------------------------------------------------------- Diagnosis, comorbidities and substances

anxiety_v0:
  title: Anxiety disorders at inclusion
  domain: Diagnosis, comorbidities and substances
  schemas: {bp: anxiety_v0, sz: anxiety_v0, asp: anxiety_disorders_v0}
  stack: with care
  use: [anxiety_disorder_v0, agoraphobia_v0, social_phobia_v0, specific_phobia_v0, ocd_v0, ptsd_v0, gad_v0]
  note: >
    The diagnoses and "in the last month" are under the same names. The SZ form
    is another one: each disorder comes after a screening question, there is no
    age at onset. The SZ export wires other form fields into some columns, so
    the SZ variables are named for what they hold (R114): its panic_disorder_v0
    is the panic disorder with or without agoraphobia; the panic types of BP
    are not delivered (they hold the social phobia, R113) and BP's
    panic_disorder_v0 is corrected where only an agoraphobia can have ticked
    it. DR assesses the same disorders with the MINI at the screening visit
    (other variables, not stacked). ASP's clinician list (form 202) carries the
    same names for the disorders and their ages at onset (hard limit 0 to 70
    years against 0 to 90 in BP); its remission is 'now', not the last month,
    and its generalised_anxiety_v0 is not the gad_v0 of BP; separation anxiety
    and PTSD are asked from 2021 only.

anxiety_fu:
  title: Anxiety disorders at the yearly visits
  domain: Diagnosis, comorbidities and substances
  schemas: {bp: anxiety_fu, sz: anxiety_fu, asp: anxiety_disorders_fu}
  stack: with care
  use: [anxiety_disorder_fu]
  note: >
    The yearly form is the inclusion form asked again: its answer is a yearly
    update (BP D84), not strictly the time since the last visit. The SZ
    extraction holds the first question only (any anxiety disorder): the
    questions of the yearly form are not exported (R115).

substance_v0:
  title: Substance use disorders at inclusion
  domain: Diagnosis, comorbidities and substances
  schemas: {bp: substance_v0, sz: substance_v0, asp: substance_use}
  stack: with care
  use: [alcohol_disorder_v0, cannabis_disorder_v0, sedative_disorder_v0, opiate_disorder_v0, cocaine_disorder_v0, hallucinogen_disorder_v0, stimulant_disorder_v0, alcohol_onset_age_v0, cannabis_onset_age_v0, cocaine_onset_age_v0, hallucinogen_onset_age_v0, stimulant_onset_age_v0]
  note: >
    The disorder, 'in the last month' and the age at onset of each substance are
    under the same names. In SZ the first question (any substance use disorder)
    is derived by the export, not asked: 'not known' on 975 of 1,583 inclusions,
    it cannot be used (R116); the boxes mean 'a symptom of a use disorder (at
    least one DSM-5 criterion)'; the sedative, opiate, cocaine and hallucinogen
    boxes are 0 after a 'no' to the opening drug question; the module is used
    from 2015. SZ has no type of disorder (abuse or dependence) and no duration,
    and six substances. DR uses the MINI. ASP's substance_use (clinician's
    list, inclusion only, form 202) carries the same names for alcohol,
    cannabis, cocaine, stimulants and hallucinogens: the 0/1 items are 0 after
    a no to the opening question as in BP, and the onset ages are the age at
    onset of the disorder; its benzodiazepines (narrower than the sedatives),
    solvents, tobacco and steroids have names of their own, it has no opiates,
    no 'last month' and no duration (its 'past or current' status is another
    question).

substance_fu:
  title: Substance use disorders at the yearly visits
  domain: Diagnosis, comorbidities and substances
  schemas: {bp: substance_fu, sz: substance_fu}
  stack: with care
  use: [substance_disorder_fu, alcohol_disorder_fu, cannabis_disorder_fu]
  note: >
    As at inclusion, asked again at the yearly visit: an answer is a yearly
    update (BP D84). The first question is the clinician's answer ('Oui' where
    any box is yes). SZ has no type of disorder and no duration.

eating_disorder_v0:
  title: Eating disorders at inclusion
  domain: Diagnosis, comorbidities and substances
  schemas: {bp: eating_disorder_v0, sz: eating_disorder_v0}
  stack: with care
  use: [eating_disorder_v0, eating_disorder_type_v0, eating_disorder_last_month_v0, eating_disorder_onset_age_v0]
  note: >
    Four questions, the same in both cohorts. The onset age is missing from the
    DSM-5 diagnosis forms (BP: filled on 84% of the DSM-4 visits and on 2 of 232
    DSM-5 visits; SZ: to 2019, A57); 'Night eating syndrome' exists in the BP
    DSM-5 form only.

tobacco:
  title: Tobacco
  domain: Diagnosis, comorbidities and substances
  schemas: {bp: tobacco, sz: tobacco, dr: tobacco, asp: tobacco}
  stack: with care
  use: [tobacco_status, pack_years, smoking_start_age, smoking_stop_age]
  note: >
    The status (non-smoker, smoker, ex-smoker), the pack-years and the two ages
    are in the four cohorts, with the same three answers. ASP records tobacco
    from 2020, and its pack-years are doubtful (ASP O10): compare the
    pack-years of BP, SZ and DR only. ASP's clinician list also asks the age at
    the start of smoking (smoking_start_age_clinician, equal on 12 of 13
    visits); SZ's tobacco_first_age is the first cigarette: the three names are
    not joined. 'Non fumeur' is not 'never smoked': a
    patient answers non-smoker at one visit and smoker or ex-smoker at another
    (about 12% of the non-smoker visits of BP follow a visit of a smoker), so
    no pack-year is 0 by derivation. SZ asks five more questions, from 2015.




first_mood_episode:
  title: The first mood episode (DSM-IV form)
  domain: Diagnosis, comorbidities and substances
  schemas: {bp: dsm4_premier_episode, dr: mood_history_v0}
  stack: with care
  use: [dsm4_first_episode_age, dsm4_first_episode_type, dsm4_first_episode_postpartum]
  note: >
    BP's DSM-IV form and DR's form 116 read the same raw columns and carry the
    same names: the age, the type and the postpartum onset of the first mood
    episode. BP delivers the DSM-5 form apart (dsm5_premier_episode, the first
    major depressive episode); DR has one form. The DR age is as declared,
    not corrected. The first psychotic episode of SZ is another question
    (first_psychotic_episode_age) and is not joined.

mood_episodes_lifetime:
  title: Mood episodes over the whole life (DSM-IV form)
  domain: Diagnosis, comorbidities and substances
  schemas: {bp: dsm4_vie_entiere, dr: mood_history_v0}
  stack: with care
  use: [dsm4_lt_n_mde, dsm4_lt_n_mde_psychotic, dsm4_lt_n_hypomania, dsm4_lt_n_mania, dsm4_lt_n_mania_psychotic, dsm4_lt_n_mixed, dsm4_lt_n_mixed_psychotic, dsm4_lt_n_induced, dsm4_lt_full_remission, dsm4_lt_seasonal, dsm4_lt_first_treatment_age]
  note: >
    The counts include the current episode. The hard limit is 20 in BP and 50
    in DR (one DR visit holds 50). BP asks a yes/no before each count of
    episodes with psychotic features; DR has the count only, and gives it 0
    when the number of episodes of the kind is 0.

mood_episodes_since_visit:
  title: Mood episodes since the last visit (DSM-IV form)
  domain: Diagnosis, comorbidities and substances
  schemas: {bp: dsm4_depuis_derniere_visite, dr: mood_course_fu}
  stack: with care
  use: [dsm4_fu_n_mde, dsm4_fu_n_mde_psychotic, dsm4_fu_n_hypomania, dsm4_fu_n_mania_psychotic, dsm4_fu_n_mixed]
  note: >
    DR's section is headed 'since the last visit', with a window of about six
    months at most visits (median gap 190 days); the BP window is six months
    or a year, and the BP DSM-5 edition of 2022 is another schema. Do not
    compare counts across windows.

current_mood_episode:
  title: The current mood episode (DSM-IV form)
  domain: Diagnosis, comorbidities and substances
  schemas: {bp: dsm4_episode_actuel, dr: mood_history_v0}
  stack: with care
  use: [dsm4_current_severity, dsm4_current_chronic, dsm4_current_postpartum]
  note: >
    The severity, the chronic course and the postpartum onset of the current
    episode, read from the same raw columns as in BP.

isf_lifetime_fu:
  title: Suicidal thoughts and acts, the lifetime form asked again at a follow-up visit
  domain: Suicide
  schemas: {dr: isf_lifetime_fu, asp: suicide_and_self_harm_fu}
  stack: with care
  use: [isf05_lifetime_fu]
  note: >
    The form carries no period (LIFETIME wording in ASP, the inclusion form
    asked again in DR): it is not joined with isf_since_visit of BP and SZ.
    A lifetime yes at inclusion becomes a no at follow-up in some patients.

suicide_attempts_fu:
  title: Suicide attempts, the lifetime form asked again at a follow-up visit
  domain: Suicide
  schemas: {dr: suicide_attempts_fu, asp: suicide_and_self_harm_fu}
  stack: with care
  use: [n_attempts_fu]
  note: >
    The number of attempts of the lifetime form asked again at a follow-up
    visit: not the number since the last visit.

# ---------------------------------------------------------------- Suicide

isf_lifetime:
  title: Suicidal thoughts and acts over the whole life (inclusion form)
  domain: Suicide
  schemas: {bp: isf_lifetime, sz: isf_lifetime, dr: isf_lifetime, asp: suicide_and_self_harm_v0}
  stack: with care
  use: [isf01_lifetime, isf02_lifetime, isf03_lifetime, isf04_lifetime, isf05_lifetime]
  note: >
    Five yes/no questions and when (last week, two weeks to a year, over a
    year), the same in the three cohorts. In DR part of the centres fill only
    the Columbia scale from 2018. ASP asks the fifth question only
    (isf05_lifetime, 'conduites suicidaires' in its form): its yes rate is
    11.5% against 38% in BP, so do not compare them before the clinicians say
    what the question means.

isf_since_visit:
  title: Suicidal thoughts and acts since the last visit (follow-up form)
  domain: Suicide
  schemas: {bp: isf_since_visit, sz: isf_since_visit}
  stack: with care
  use: [isf01_since_visit, isf02_since_visit, isf03_since_visit, isf04_since_visit, isf05_since_visit]
  note: >
    The five questions are the same in BP and SZ, asked since the last visit,
    with a 'when' of two answers (last week, since the last visit). BP does not
    deliver the answers of the follow-up visits of November 2021 to 2023, whose
    form also asked about the whole life (period_removed). The DR form has no
    follow-up wording: it is the inclusion form asked again at 24 and 48 months
    (lifetime wording, raters read it both ways), delivered as isf_lifetime_fu
    and not joined with these.

cssrs_v0:
  title: C-SSRS suicidal ideation at the inclusion visit
  domain: Suicide
  schemas: {bp: cssrs_v0, dr: cssrs_v0}
  stack: "no"
  note: >
    The BP inclusion form asks about the past week (some centres answer over
    a longer time), the DR one about the whole life: the same questions over
    different periods, under other names (cssrs01_past_week in BP,
    cssrs01_lifetime in DR). Do not stack.

cssrs_fu:
  title: C-SSRS suicidal ideation since the last visit (follow-up form)
  domain: Suicide
  schemas: {bp: cssrs_fu, dr: cssrs_fu}
  stack: with care
  use: [cssrs01_since_visit, cssrs02_since_visit, cssrs03_since_visit, cssrs04_since_visit, cssrs05_since_visit, cssrs_intensity_since_visit]
  note: >
    The five ideation questions and the five intensity ratings are the same,
    asked since the last visit, with questions 3 to 5 at 0 after a no to
    question 2. DR also has the behaviour section. The inclusion forms
    differ in period (BP the past week, DR the whole life): cssrs_v0 is not
    stacked. About a quarter of the DR visits (from 2018) are simplified
    visits that use a shorter form of ten questions: the extraction does not
    tell them apart (R127).

suicide_attempts:
  title: History of suicide attempts over the whole life (inclusion form)
  domain: Suicide
  schemas: {bp: suicide_attempts, sz: suicide_attempts, dr: suicide_attempts, asp: suicide_and_self_harm_v0}
  stack: with care
  use: [n_attempts, first_attempt_date, violent_attempts, serious_attempts, n_violent_attempts, n_serious_attempts]
  note: >
    The number of attempts, the date of the first one and the violent and
    serious (non-violent, intensive care) attempts. BP and SZ give 0 attempts
    after "never attempted" and 0 violent or serious attempts after 0
    attempts (BP D125); a first attempt dated on the inclusion day or later
    is out of range. The three cohorts deliver it from the inclusion visit
    only, where it is about the whole life; the follow-up visits are in
    suicide_attempts_since_visit in BP and SZ, and in suicide_attempts_fu in
    DR (the lifetime form asked again at 24 and 48 months: not joined). ASP
    gives the number of attempts (n_attempts) and the ages of the first and
    last one (first_attempt_age, last_attempt_age), not a date, and a
    serious_suicide_attempt that is another question than the intensive-care
    attempt.

suicide_attempts_since_visit:
  title: Suicide attempts since the last visit (follow-up form)
  domain: Suicide
  schemas: {bp: suicide_attempts_since_visit, sz: suicide_attempts_since_visit}
  stack: with care
  use: [n_attempts_since_visit, violent_attempts_since_visit, serious_attempts_since_visit, n_violent_attempts_since_visit, n_serious_attempts_since_visit]
  note: >
    The follow-up form of eBipolar and eSchizo asks the same numbers since the
    last visit, after a "yes" to isf05_since_visit, and the numbers of violent
    and serious attempts after a yes to their own question: BP and SZ give 0
    after a no (BP D125). BP does not deliver the visits of November 2021 to
    2023 (period_removed): its follow-up form of that time also asked about
    the whole life. DR's number of attempts since the last visit, read from
    another question (the clinician's summary of the course, mood_course_fu),
    is n_suicide_attempts_since_visit (ASP's follow-up number is n_attempts_fu).

most_serious_attempt:
  title: The most serious suicide attempt
  domain: Suicide
  schemas: {bp: most_serious_attempt, dr: most_serious_attempt}
  stack: with care
  use: [serious_method, serious_sedative_type, serious_non_sedative_type, serious_triggered, serious_trigger]
  note: >
    The method, the lethality and the trigger are labelled lists in BP and,
    since the review of the DR forms, in DR under the same names and labels
    (the DR lists have no 'death' option). BP is filled until 2022; the
    inclusion visit only, its follow-up visits are in
    most_serious_attempt_since_visit (BP D125). DR reads the attempt that
    the inclusion visit describes.

most_violent_attempt:
  title: The most violent suicide attempt
  domain: Suicide
  schemas: {bp: most_violent_attempt, dr: most_violent_attempt}
  stack: with care
  use: [violent_method, violent_jump_height, violent_triggered, violent_trigger]
  note: >
    As for the most serious attempt: labelled lists in BP (filled until 2021;
    the inclusion visit only, its follow-up visits are in
    most_violent_attempt_since_visit), the same names and labels in DR. The
    lethality of another method is one list in BP (violent_other_lethality)
    and five boxes in DR (violent_other_lethality_*).

# ---------------------------------------------------------------- Physical examination and laboratory

parametres_physiques:
  title: Height, weight, body mass index and waist
  domain: Physical examination and laboratory
  schemas: {bp: parametres_physiques, sz: parametres_physiques, dr: parametres_physiques, asp: parametres_physiques}
  stack: with care
  use: [height, weight, bmi, waist]
  note: >
    Centimetres and kilograms in the four cohorts; the body mass index is
    recomputed from them in each. ASP has children: their height, weight and
    body mass index depend on age and sex, and the adult cut-offs of the body
    mass index do not apply to them. Compare adults, or use age- and
    sex-specific references for the children.

pression_arterielle:
  title: Blood pressure and heart rate
  domain: Physical examination and laboratory
  schemas: {bp: pression_arterielle, sz: pression_arterielle, dr: pression_arterielle, asp: pression_arterielle}
  stack: "yes"
  use: [systolic_supine, diastolic_supine, heart_rate_supine, systolic_standing, diastolic_standing]
  note: The lying blood pressure is in the four cohorts, the lying heart rate in BP, DR and ASP, the standing measures in BP and DR.

ecg:
  title: Electrocardiogram
  domain: Physical examination and laboratory
  schemas: {bp: ecg, sz: ecg, dr: ecg, asp: ecg}
  stack: with care
  use: [qtc_stored, qtc_bazett, qt_interval, rr_interval]
  note: >
    The stored corrected QT is in the four cohorts. The intervals, and the QTc
    recomputed with the Bazett formula, are in BP, DR and ASP; SZ holds the
    stored QTc only, with no way to check its formula. ASP has few ECGs.
    Prefer qtc_bazett: in BP and DR it is computed from the heart rate of the
    ECG, because the RR typed in the form does not always fit that heart
    rate, and the stored QTc follows the typed RR.

biochimie:
  title: Blood biochemistry
  domain: Physical examination and laboratory
  schemas: {bp: biochimie, sz: biochimie, dr: biochimie, asp: biochimie}
  stack: "yes"
  use: [glucose, hba1c, crp, uric_acid, creatinine, sodium, potassium, urea, calcium, albumin, chloride, total_protein, phosphate, creatinine_clearance]
  note: >
    Glucose, HbA1c, CRP and uric acid are in the four cohorts; the other
    analytes in BP, DR and ASP (bicarbonate and iron in BP and DR only, ferritin
    in DR and ASP only). Each analyte is delivered in one unit, with the same
    range in every cohort; the levels are compatible (no factor of 10 or of a
    molar mass between cohorts). ASP has no unit column: the unit is read from
    the size of the value, and about 40% of its laboratory visits are of children
    under 18 (ALP, creatinine and phosphate are higher). An HbA1c typed in mmol/mol
    (IFCC) is brought to % with the IFCC-NGSP master equation in every cohort
    (a fraction such as 0.055 is not recovered). A CRP below the detection limit
    of its laboratory keeps the limit as its value (flag censored_left), the limits
    differ between laboratories, and some centres write the limit without its
    sign: treat a CRP of exactly 5 as a limit. ASP's CRP is probably a
    high-sensitivity CRP (median three times lower, 12.6% of zeros removed): do
    not pool it without the censoring column. The 1% and 99% clipping turns
    clinical tails into the cut value in every cohort. A shifted block of results
    (blood-count values typed in the biochemistry fields) is removed in BP and DR
    (visit_removed).

bilan_lipidique:
  title: Blood lipids
  domain: Physical examination and laboratory
  schemas: {bp: bilan_lipidique, sz: bilan_lipidique, dr: bilan_lipidique, asp: bilan_lipidique}
  stack: "yes"
  use: [cholesterol, hdl, ldl, triglycerides, cholesterol_hdl_ratio]
  note: >
    In mmol/L in the four cohorts; the ratio is recomputed in BP, SZ (the EMR
    computes total / HDL on key-up with no unit, so about 4% of its stored ratios
    mix g/L and mmol/L: the delivered ratio is right and the stored one is a
    check). LDL is a calculated value in the four cohorts (Friedewald-like), not
    an independent measure. ASP lipids include children (29% of rows under 18).

bilan_hepatique:
  title: Liver tests
  domain: Physical examination and laboratory
  schemas: {bp: bilan_hepatique, dr: bilan_hepatique, asp: bilan_hepatique}
  stack: "yes"
  use: [ast, alt, ggt, alkaline_phosphatase, bilirubin]
  note: >
    Five analytes in the same units in the three cohorts. About 37% of ASP rows are
    of children under 18, whose ALP is higher.

bilan_thyroidien:
  title: Thyroid tests
  domain: Physical examination and laboratory
  schemas: {bp: bilan_thyroidien, dr: bilan_thyroidien, asp: bilan_thyroidien}
  stack: "yes"
  use: [tsh, free_t3, free_t4]
  note: >
    TSH is in the three cohorts; free T3 and free T4 in BP and DR. The BP form rejects
    a TSH above 10 from 2022, so its upper tail is capped from then. The DR forms offer
    unit choices for TSH, T3 and T4 that the export does not carry (R31).

nfs:
  title: Full blood count
  domain: Physical examination and laboratory
  schemas: {bp: nfs, sz: nfs, dr: nfs, asp: nfs}
  stack: "yes"
  use: [leukocytes, erythrocytes, haemoglobin, platelets, neutrophils, eosinophils, mcv, lymphocytes, monocytes, basophils, haematocrit, mch, mchc]
  note: >
    Seven values are in the four cohorts, in the same units; lymphocytes, monocytes and
    basophils in BP, DR and ASP; haematocrit, MCH and MCHC in BP and DR. The differential
    counts are checked against the leukocytes in BP, DR and ASP (SZ has two kinds only).
    The 1% and 99% clipping turns clinical tails (neutropenia, thrombopenia, anaemia) into
    the cut value.

bhcg_prolactine:
  title: Prolactin and beta-hCG
  domain: Physical examination and laboratory
  schemas: {bp: bhcg_prolactine, sz: bhcg_prolactine, dr: bhcg_prolactine, asp: bhcg_prolactine}
  stack: with care
  use: [prolactin, hcg]
  note: >
    Prolactin is in the four cohorts, in ng/mL (a value typed in mg/L in the default unit of the
    form is read x1000; the unit is unknown on about 3% of the BP and SZ results, which are not
    delivered). In DR the results labelled ng/mL reach 100 or more on 19% of the results of two
    centres in 2013-2015, probably mUI/L: open question. Beta-hCG is in BP and DR, mostly censored at
    the limit of the laboratory in BP: levels are not comparable, and a value in a man or in a
    pregnancy is not handled.

vitamine_d:
  title: Vitamin D
  domain: Physical examination and laboratory
  schemas: {sz: vitamine_d, dr: vitamine_d, asp: vitamine_d}
  stack: with care
  use: [vitamin_d]
  note: >
    vitamin_d is in nmol/L in DR and ASP (DR code 2 read as ng/mL by size, ASP code 64387 read as
    nmol/L). SZ records no unit and one centre writes ng/mL, so its value is delivered under another name
    (vitamin_d_as_written) and must not be stacked.

dosage_psychotropes:
  title: Plasma levels of psychotropic drugs
  domain: Physical examination and laboratory
  schemas: {bp: dosage_psychotropes, sz: dosage_psychotropes, dr: dosage_psychotropes, asp: dosage_psychotropes}
  stack: with care
  use: [lithium, valproate, carbamazepine, clozapine, treatment_taken_before_sampling]
  note: >
    Each cohort measures the drugs of its own treatments: lithium, valproate
    and carbamazepine are in BP and DR (few values in DR), clozapine in BP and
    SZ, and ASP has almost no level. No drug level is in the four cohorts. A level of 0 is a missing code
    (the laboratory writes '<x'). Only 'treatment taken that morning' is recorded, no sampling time and no dose.

# ---------------------------------------------------------------- Medical and family history

neurological_history_v0:
  title: "Medical history at inclusion: neurological diseases"
  domain: Medical and family history
  schemas: {bp: neurological_history_v0, sz: neurological_history_v0, dr: neurological_history_v0}
  stack: with care
  use: [migraine_v0, epilepsy_v0, multiple_sclerosis_v0, meningitis_v0]
  note: &history >
    The question "has the patient had this disease" and "is it treated" are
    under the same names in the three cohorts. The SZ form is shorter: no date
    of onset, no "controlled", and its sections do not hold all the diseases
    of BP and DR. A sub-question (treated, controlled, cause) is asked of the
    patients who have the disease; in DR a box of this kind is written 0 where
    it was not asked (flag derived_doubt): compare among the patients who have
    the disease. From 2022 several sections are answered on a small part of the
    inclusion visits in BP, and three in SZ: an empty section is missing, not
    "no", and the share of "yes" of these years is not a prevalence.

neurological_history_fu:
  title: "Medical history at follow-up: neurological diseases"
  domain: Medical and family history
  schemas: {bp: neurological_history_fu, sz: neurological_history_fu, dr: neurological_history_fu}
  stack: with care
  use: [migraine_fu, epilepsy_fu, multiple_sclerosis_fu, meningitis_fu]
  note: &history_fu >
    The follow-up form is the inclusion form asked again at the yearly visit:
    its questions carry no period, and an answer is a yearly update, neither
    the whole life nor strictly the time since the last visit (a yes of the
    inclusion is often a no a year later). It is delivered in columns of its
    own (_fu) and is not to be added to the inclusion answers. The six-monthly
    and the screening visits hold no cell of these sections, and an empty
    yearly section may mean "no change since the last visit" (the question is
    not exported). The same reserves as at inclusion apply.

cardiovascular_history_v0:
  title: "Medical history at inclusion: cardiovascular diseases"
  domain: Medical and family history
  schemas: {bp: cardiovascular_history_v0, sz: cardiovascular_history_v0, dr: cardiovascular_history_v0}
  stack: with care
  use: [hypertension_v0, coronary_disease_v0, myocardial_infarction_v0, arrhythmia_v0]
  note: *history

cardiovascular_history_fu:
  title: "Medical history at follow-up: cardiovascular diseases"
  domain: Medical and family history
  schemas: {bp: cardiovascular_history_fu, sz: cardiovascular_history_fu, dr: cardiovascular_history_fu}
  stack: with care
  use: [hypertension_fu, coronary_disease_fu, myocardial_infarction_fu, arrhythmia_fu]
  note: *history_fu

endocrine_history_v0:
  title: "Medical history at inclusion: endocrine and metabolic diseases"
  domain: Medical and family history
  schemas: {bp: endocrine_history_v0, sz: endocrine_history_v0, dr: endocrine_history_v0}
  stack: with care
  use: [thyroid_disorder_v0, dyslipidaemia_v0, diabetes_v0]
  note: >
    The same questions as the other history sections (treated, controlled,
    type, date of onset), with the reserves of their notes. Diabetes: BP and DR
    ask one question and its type (diabetes_v0, diabetes_type_v0); the SZ form
    asks type 2 here (diabetes_type2_v0) and type 1 in its auto-immune section
    (diabetes_type1_v0). DR also reads the two kinds of dyslipidaemia
    (cholesterol, triglycerides) as two yes/no boxes where BP has one list.

endocrine_history_fu:
  title: "Medical history at follow-up: endocrine and metabolic diseases"
  domain: Medical and family history
  schemas: {bp: endocrine_history_fu, sz: endocrine_history_fu, dr: endocrine_history_fu}
  stack: with care
  use: [thyroid_disorder_fu, dyslipidaemia_fu, diabetes_fu]
  note: *history_fu

digestive_history_v0:
  title: "Medical history at inclusion: liver and digestive tract"
  domain: Medical and family history
  schemas: {bp: digestive_history_v0, sz: digestive_history_v0, dr: digestive_history_v0}
  stack: with care
  use: [inflammatory_bowel_disease_v0, cirrhosis_v0, peptic_ulcer_v0, drug_hepatitis_v0]
  note: *history

digestive_history_fu:
  title: "Medical history at follow-up: liver and digestive tract"
  domain: Medical and family history
  schemas: {bp: digestive_history_fu, sz: digestive_history_fu, dr: digestive_history_fu}
  stack: with care
  use: [inflammatory_bowel_disease_fu, cirrhosis_fu, peptic_ulcer_fu, drug_hepatitis_fu]
  note: *history_fu

allergic_history_v0:
  title: "Medical history at inclusion: allergic and inflammatory diseases"
  domain: Medical and family history
  schemas: {bp: allergic_history_v0, sz: allergic_history_v0, dr: allergic_history_v0}
  stack: with care
  use: [asthma_v0, allergy_v0]
  note: >
    Asthma and allergy are under the same names in the three cohorts. The first
    question differs: SZ asks about allergic pathologies (allergic_disease_v0,
    yes for 29% of the inclusions) and BP and DR about allergic and
    inflammatory pathologies (allergic_inflammatory_v0, 8.8% in BP): do not
    compare the two gates. The reserves of the other history sections apply.

allergic_history_fu:
  title: "Medical history at follow-up: allergic and inflammatory diseases"
  domain: Medical and family history
  schemas: {bp: allergic_history_fu, sz: allergic_history_fu, dr: allergic_history_fu}
  stack: with care
  use: [asthma_fu, allergy_fu]
  note: *history_fu

autoimmune_history_v0:
  title: "Medical history at inclusion: lupus and rheumatoid arthritis"
  domain: Medical and family history
  schemas: {bp: allergic_history_v0, sz: autoimmune_history_v0, dr: allergic_history_v0}
  stack: with care
  use: [lupus_v0, rheumatoid_arthritis_v0]
  note: >
    Lupus and rheumatoid arthritis are in the allergic section of BP and DR and
    in a section of auto-immune diseases in SZ, under the same names. Psoriasis
    is in the skin section of BP and DR and in the auto-immune section of SZ.
    The reserves of the other history sections apply.

autoimmune_history_fu:
  title: "Medical history at follow-up: lupus and rheumatoid arthritis"
  domain: Medical and family history
  schemas: {bp: allergic_history_fu, sz: autoimmune_history_fu, dr: allergic_history_fu}
  stack: with care
  use: [lupus_fu, rheumatoid_arthritis_fu]
  note: *history_fu

skin_history_v0:
  title: "Medical history at inclusion: skin diseases"
  domain: Medical and family history
  schemas: {bp: skin_history_v0, sz: skin_history_v0, dr: skin_history_v0}
  stack: with care
  use: [acne_v0, psoriasis_v0]
  note: >
    Acne and the drug eruption are in the three cohorts. Psoriasis and the
    triggering by lithium or valproate are in BP and DR only: in SZ psoriasis
    is in the auto-immune section and the form has no lithium sub-question.
    The reserves of the other history sections apply.

skin_history_fu:
  title: "Medical history at follow-up: skin diseases"
  domain: Medical and family history
  schemas: {bp: skin_history_fu, sz: skin_history_fu, dr: skin_history_fu}
  stack: with care
  use: [acne_fu, psoriasis_fu]
  note: *history_fu

gynaecological_history_v0:
  title: "Medical history at inclusion: pregnancies, menopause and gynaecological diseases"
  domain: Medical and family history
  schemas: {bp: gynaecological_history_v0, sz: gynaecological_history_v0, dr: gynaecological_history_v0}
  stack: with care
  use: [n_pregnancies_v0, menopause_v0, menopause_hormone_therapy_v0]
  note: >
    The number of pregnancies, the menopause and its hormone therapy are in the
    three cohorts; live births, miscarriages and terminations in BP and DR.
    The section is shown to everyone: men's rows hold answers in BP and SZ
    (filter on sex). The hormone therapy is a detail of the menopause: it is
    missing, not 0, for a woman who answered no to the menopause in the three
    cohorts. The reserves of the other history sections apply.

gynaecological_history_fu:
  title: "Medical history at follow-up: pregnancies, menopause and gynaecological diseases"
  domain: Medical and family history
  schemas: {bp: gynaecological_history_fu, sz: gynaecological_history_fu, dr: gynaecological_history_fu}
  stack: with care
  use: [n_pregnancies_fu, menopause_fu, menopause_hormone_therapy_fu]
  note: *history_fu

other_history_v0:
  title: "Medical history at inclusion: cancers, infections and other diseases"
  domain: Medical and family history
  schemas: {bp: other_history_v0, sz: other_history_v0, dr: other_history_v0}
  stack: with care
  use: [cancer_v0, hiv_v0, chronic_viral_hepatitis_v0]
  note: *history

other_history_fu:
  title: "Medical history at follow-up: cancers, infections and other diseases"
  domain: Medical and family history
  schemas: {bp: other_history_fu, sz: other_history_fu, dr: other_history_fu}
  stack: with care
  use: [cancer_fu, hiv_fu, chronic_viral_hepatitis_fu]
  note: *history_fu

urinary_history_v0:
  title: "Medical history at inclusion: urinary tract"
  domain: Medical and family history
  schemas: {bp: urinary_history_v0, dr: urinary_history_v0}
  stack: with care
  use: [nephropathy_v0, nephropathy_lithium_v0, prostate_adenoma_v0, urinary_retention_v0]
  note: >
    The three diseases are under the same names, and the nephropathy linked to
    lithium (nephropathy_lithium_v0). The causes of a urinary retention are
    three boxes in BP (read from one list) and in DR: a box is 0 for a patient
    with no retention, missing for a patient who has one and was not asked:
    compare the causes among the patients who have the disease.

urinary_history_fu:
  title: "Medical history at follow-up: urinary tract"
  domain: Medical and family history
  schemas: {bp: urinary_history_fu, dr: urinary_history_fu}
  stack: with care
  use: [nephropathy_fu, nephropathy_lithium_fu, prostate_adenoma_fu, urinary_retention_fu]
  note: *history_fu

perinatal:
  title: The patient's own birth
  domain: Medical and family history
  schemas: {bp: perinatal, sz: perinatal, dr: perinatal, asp: perinatal}
  stack: "yes"
  use: [mother_age_at_birth, father_age_at_birth, gestational_age, birth_weight, neonatal_hospitalisation, birth_term, birth_type]
  note: >
    In the table patients. The ages of the parents, the weeks of pregnancy,
    the birth weight (grams) and the stay in a neonatal unit are in the four
    cohorts. The term as a class and the kind of delivery as one list are in
    BP, SZ and DR; ASP describes the delivery with yes/no questions of its own
    (induced, caesarean, forceps, vacuum), asked only after a delivery that is
    not natural and 0 after a natural one: its caesarean yes is BP's birth_type
    equal to caesarean. The ASP columns of the parents' ages, the term, the
    weight, the length, the head circumference and the stay in a neonatal unit
    hold no 0 or 99 used as not known, so stack "yes" holds.

family_history:
  title: Family history, one row per relative
  domain: Medical and family history
  schemas: {bp: family_history, sz: family_history, dr: family_history}
  stack: with care
  use: [kinship, degree, relative_suicide, relative_alcohol, relative_anxiety, relative_diabetes, relative_hypertension]
  note: >
    In the table relatives. The relatives asked about are not the same: SZ has
    22 of the 26 relatives of BP (no grandparents, no daughters and sons: filter
    degree == 1), and in DR the children and the siblings are one row for the
    group, which holds one arbitrary affected relative (request R110), so they
    do not join to the sisters, brothers, sons and daughters of BP and SZ. The
    psychiatric disorder of a relative is one list in BP and SZ
    (relative_disorder) and separate questions in DR (the suicide has the same
    labels in the three cohorts). BP and DR share the questions on substances,
    anxiety, dementia and cardiovascular risk. In DR many of these boxes are
    written 0 where the question was not asked (flag derived_doubt). A missing
    block under a parent answered no means none: use the per-patient summary.

family_history_per_patient:
  title: Family history summed up per patient
  domain: Medical and family history
  schemas: {bp: family_history_per_patient, sz: family_history_per_patient, dr: family_history_per_patient}
  stack: "yes"
  use: [fdr_bipolar, fdr_depression, fdr_schizophrenia, fdr_suicide, fdr_suicide_attempt]
  note: >
    In the table patients. A first-degree relative with each disorder, computed
    the same way in BP, SZ and DR. In DR fdr_bipolar and fdr_depression are
    missing more often (the kind of mood disorder is asked only after a mood
    disorder yes), and the children and siblings are one relative per group.

family_structure:
  title: Family structure
  domain: Medical and family history
  schemas: {bp: family_structure, sz: family_structure, dr: family_structure}
  stack: with care
  use: [n_brothers, n_sisters, n_sons, n_daughters, mother_affected, father_affected]
  note: >
    In the table patients. The numbers of brothers, sisters, sons and daughters
    and how many are affected are the same in BP and SZ. 'Affected' also covers
    a substance use disorder and a cardiovascular risk factor: a yes is not a
    psychiatric history. DR asks other questions (a psychiatric history of each
    parent, children and siblings counted as groups) under names of its own.

# ---------------------------------------------------------------- Treatments

medications:
  title: Treatments, one row per treatment
  domain: Treatments
  schemas: {bp: medications, sz: medications, dr: medications, asp: medications}
  stack: with care
  use: [medication, molecule, atc, treatment_group, start_date, end_date, daily_dose]
  note: >
    In the table treatments. The name, the molecule, the ATC code and the
    group come from one table of names shared by the cohorts. The lists are
    not the same thing: the treatments of the patient with their dates in BP
    and SZ; the treatments of each visit in ASP; in DR the current and somatic
    lists are per visit but the export crosses the products and the lines of a
    patient (R122), so no dose and no date can be tied to a product of a
    patient who has several (194 patients), and its product is a substance
    name (substance_name), not the typed product name of the other cohorts.
    The daily dose is in mg in the four cohorts: BP and SZ compute it with the
    same rule (the stored strength, else the one written in the name of the
    product: BP decision D124), DR and ASP hold it as typed in mg.

medications_at_visit:
  title: Psychotropic treatments on the day of the visit
  domain: Treatments
  schemas: {bp: medications_at_visit, sz: medications_at_visit, dr: medications_at_visit}
  stack: with care
  use: [on_lithium, on_anticonvulsant, on_antipsychotic_2g, on_antipsychotic_1g, on_antidepressant, on_benzodiazepine]
  note: >
    Sixteen yes/no columns computed from the list of treatments and its dates,
    with the same names and groups in the three cohorts. They are missing for
    the patients who have no list (about a quarter in BP, a sixth in SZ); a
    treatment with no end date counts at every later visit (78%, 88% and 79%
    of the antidepressant, lithium and 2nd-generation antipsychotic yes of the
    follow-up visits rest on treatments with no end date); in DR, whose lists
    the export crossed, they are known on about half of the visits and a 0
    means 'no listed product', not 'no'. ASP has no such columns.

non_drug_lifetime:
  title: Non-drug treatments over the life
  domain: Treatments
  schemas: {bp: non_drug_lifetime, dr: non_drug_lifetime}
  stack: with care
  use: [ever_ect, ever_tms, ect_sessions, tms_sessions]
  note: >
    In the table patients. ECT and TMS (ever, sessions, dates) are under the
    same names. BP asks the form of a part of its patients, from 2013.
    Psychotherapies are asked by kind: three in BP, sixteen in DR (one more
    summary question that disagrees with the kinds), see psychotherapy_lifetime.

non_drug_fu:
  title: Non-drug treatments since the last visit
  domain: Treatments
  schemas: {bp: non_drug_fu, sz: non_drug_fu, dr: non_drug_fu}
  stack: with care
  use: [ect_fu, tms_fu]
  note: >
    ECT and TMS are in the three cohorts: since the last visit in BP and SZ;
    in DR the form prints no period and is asked again at the follow-up visit
    (an update). The therapies asked about are not the same list in each
    cohort (see psychotherapy_fu).

psychotherapy_lifetime:
  title: Psychotherapies over the life
  domain: Treatments
  schemas: {bp: non_drug_lifetime, dr: psychotherapies_v0}
  stack: with care
  use: [ever_cbt]
  note: >
    Only cognitive-behavioural therapy is in both. BP asks three specific
    therapies (CBT, psychoeducation groups, IPSRT) and an 'other' that holds
    other kinds; DR asks sixteen kinds, each with its sessions, dates,
    therapist and result. DR's behavioural-only and cognitive-only boxes are
    separate from CBT. Interpersonal therapy (DR) and IPSRT (BP) are not the
    same, nor DR 'other' and BP 'other'.

psychotherapy_fu:
  title: Psychotherapies at the follow-up visits
  domain: Treatments
  schemas: {bp: non_drug_fu, sz: non_drug_fu, dr: psychotherapies_fu}
  stack: with care
  use: [cbt_fu, other_therapy_fu]
  note: >
    CBT and 'other' are in the three cohorts, since the last visit in BP and
    SZ and asked again at the follow-up visit in DR. SZ also has psychodynamic
    and family therapy (psychodynamic_fu in DR), and its sessions and dates
    are in the application but not exported (R125). 'Other' is the residual of
    different lists: do not compare it.

recommendations:
  title: Following of the recommendations of the first assessment
  domain: Treatments
  schemas: {bp: recommendations, sz: recommendations}
  stack: "yes"
  use: [drug_advice_followed, other_advice_followed]
  note: "A follow-up form: whether the advice on drugs and the other advice were followed, and why not. SZ asks about two more kinds of advice."

# ---------------------------------------------------------------- Social situation and use of care

social:
  title: Social situation
  domain: Social situation and use of care
  schemas: {bp: social, sz: social, dr: social, asp: work}
  stack: with care
  use: [education_level, work_status, living_arrangement, job_full_time, marital_status]
  note: >
    Education, work status and way of living are in BP, SZ and DR with the same
    labels; a full-time job is also in ASP. In SZ the export loses answers: no
    patient is recorded as married or living as a couple, and none with a salary
    or a disability pension (an open question of SZ): do not compare
    marital_status and income_source with SZ (SZ also has a "no income"
    answer that BP has not). In BP the export writes the
    students with 'other' (student_or_other). The other questions differ.

sick_leave_v0:
  title: Sick leave at inclusion
  domain: Social situation and use of care
  schemas: {bp: sick_leave_v0, sz: sick_leave_v0, dr: sick_leave_v0, asp: work}
  stack: with care
  use: [sick_leave_12m, sick_leave_weeks_12m, sick_leave_current]
  note: >
    A sick leave in the last twelve months and its length in weeks are in the
    four cohorts; a sick leave at the visit in BP, SZ and DR. Asked of the
    patients who work. After a no the weeks are 0 in the four cohorts. SZ
    and DR read the past year from the social form ("Arrêt de travail au
    cours de l'année passée"). BP reads it from the diagnosis form of the
    inclusion visit: the DSM-5 form asks the same question, but the DSM-IV
    form, where 3,327 of the 4,057 BP answers come from, has none, and an
    application script wrote the yes/no from the number of sick leaves
    (see the BP schema). When R74 ships, BP also takes the social form's
    answers where the diagnosis forms are empty. ASP asks another question:
    off work during the work contracts of the last 12 months, hospital
    weeks excluded.

sick_leave_fu:
  title: Sick leave since the last visit
  domain: Social situation and use of care
  schemas: {bp: sick_leave_fu, sz: sick_leave_fu, dr: sick_leave_fu}
  stack: with care
  use: [sick_leave_fu, n_sick_leaves_fu]
  note: >
    BP and SZ ask the same question (a sick leave for a psychiatric disorder
    since the last visit), with the number and the length in weeks, under the
    same names; SZ adds the somatic sick leaves of the past 12 months. DR asks
    no yes/no question and does not state the cause: its number and its length
    in days are any-cause sick leave since the last visit
    (n_sick_leaves_any_cause_fu, sick_leave_days_any_cause_fu), not joined.

hospitalisations_v0:
  title: Hospitalisations before inclusion
  domain: Social situation and use of care
  schemas: {bp: hospitalisations_v0, sz: hospitalisations_v0, dr: hospitalisations_v0}
  stack: with care
  use: [n_hospitalisations_v0, hospitalisation_months_v0, first_hospitalisation_age]
  note: >
    The number of hospitalisations over the life, their total length in months
    and the age at the first one are in the three cohorts. A patient who was
    never hospitalised has 0 in SZ (the form hides the count after 'no
    hospitalisation') and, where the form was answered, in the other cohorts.
    The forms stop at 20 times in BP and SZ, and at 20 months in BP and 30 in
    SZ (">20", ">30" are right-censored, with a _cens column); DR has no cap
    (18 durations at or above 20 months). To compare, cut the number at 20 and
    the months at 20 in every cohort. The DR lifetime block is in the mood form
    and is absent where that form is not shown (empty means no form, not 'no').

hospitalisations_12m:
  title: Hospitalisations in the year before the visit
  domain: Social situation and use of care
  schemas: {bp: hospitalisations_v0, sz: hospitalisations_12m}
  stack: with care
  use: [n_hospitalisations_12m, hospitalisation_weeks_12m]
  note: >
    Asked at inclusion in BP and at every visit in SZ. In SZ the number and
    the length follow a yes and are almost always empty after a no (4 of
    3,261). In BP the DSM-IV form asks them only after a mood episode in the
    past year and the DSM-5 form asks every patient; after a no to any mood
    episode in the past year both are 0, and the length is 0 where the
    number is 0 (BP D123). Both cohorts give 0 after a no. The period is
    'since the last visit' in the form of the follow-up visits, 'the past
    year' at inclusion.
