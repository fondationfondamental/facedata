  ptsd_onset_age_fu: "the ASP hard limit is 0 to 70 years (the oldest patient is 65), the BP limit 0 to 90"
  social_phobia_onset_age_v0: "the ASP hard limit is 0 to 70 years (the oldest patient is 65), the BP limit 0 to 90"
  social_phobia_onset_age_fu: "the ASP hard limit is 0 to 70 years (the oldest patient is 65), the BP limit 0 to 90"
  specific_phobia_onset_age_v0: "the ASP hard limit is 0 to 70 years (the oldest patient is 65), the BP limit 0 to 90"
  specific_phobia_onset_age_fu: "the ASP hard limit is 0 to 70 years (the oldest patient is 65), the BP limit 0 to 90"
  diagnosis: "each cohort has its own diagnoses"
  handedness: "the DR form numbers the answers 1 right, 2 left; the ASP form 1 left, 2 right. Both readings are checked on the data: right-handed 92% in DR, 84% in ASP, 89% in BP"
  kinship: "DR describes the siblings and the children as one row each; BP and SZ describe each sister, brother, son and daughter, and BP the grandparents"
  other_therapy_sessions_fu: "the BP follow-up form accepts one or two digits (range 0 to 365), the DR form a typed number (range 0 to 1500)"
  sick_leave_12m: "the answer 2 is 'not applicable' (no job) on the DR form; on the ASP forms 'no' is 2 on the adult form and 0 on the child form, and ASP asks another question (off work during the work contracts of the last 12 months)"
  work_status: "in BP the export writes the students with 'other' (code 6 is student_or_other); SZ and DR have an answer 'other' of their own"
  job_class: "the INSEE level-1 class: codes 1 to 8 carry the same words in DR and ASP; 0 'other' is DR only, 9 'student' is ASP only (10 'not applicable' is missing in ASP)"
  n_gp: "the DR box accepts up to 365 consultations over the year (range 0 to 365), the ASP form blocks above 50 (range 0 to 50) and counts the paediatrician with the general practitioner"
  has_children: "DR asks it once per patient (family structure, level patient), ASP at each visit of the adult medico-economic form (level visit)"
  education_level: "the DR form (168) numbers BAC as 12; the BP and SZ exports write the word 'BAC' and never use code 12 (their forms have no Terminale)"
  age_at_inclusion: "ASP has children: 3 to 100 years; the adult cohorts 15 to 100"
