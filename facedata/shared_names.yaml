# What two cohorts cannot give the same name or the same content, each with the reason.
# The tables of the cohorts are stacked (pd.concat): a column must mean the same thing in each of them.
# tests/test_cohorts.py fails on a difference that is not listed here, and on a line that is no longer true.

# A raw column that two cohorts deliver under different names, because it does not hold the same question.
columns:
  agetrt: "BP and DR deliver the first psychotropic treatment (BP once per DSM edition, dsm4_lt_ and dsm5_lt_; DR dsm4_lt_first_treatment_age); the SZ form asks for the first antipsychotic"
  autre: "two questions that share a column name: another substance of a relative in DR, the other substance used during the pregnancy in ASP"
  biochin: "the number of children in SZ, the dependent children of the adult in ASP"
  cclin05_: "the BP form asks whether the patient is euthymic, the SZ form whether the clinical state is compatible with the tests"
  cclin11_: "no electroconvulsive therapy in the past year in BP, in the last six months in SZ"
  cedecodtrouble_humeur_actuel: "one box (catatonic) in BP (dsm4_current_catatonic), a list of features in DR (dsm4_current_specifier, the question that BP reads from cedecodtrouble_humeur_actuel_type)"
  ceoccuranxietegeneral: "the SZ export wires the screening question (nervous or anxious in the last ten months) into this column (SZ gad_screening, R114); BP reads the generalised anxiety disorder (gad)"
  ceoccurtoc: "the SZ export wires the obsessional disorder into this column (SZ obsessional_disorder, R114); BP reads the obsessive-compulsive disorder (ocd)"
  dysthyro_mhdecod: "'treated' in the shorter history form of SZ; in DR the treatment that induced the disorder (thyroid_disorder_induced_by); BP reads the induced-by from dysthyro_mhmodify_tt"
  gmmaternel_structure: "BP and SZ ask for a disorder or a cardiovascular risk factor of the relative, DR for a history of psychiatric illness"
  gmpaternel_structure: "BP and SZ ask for a disorder or a cardiovascular risk factor of the relative, DR for a history of psychiatric illness"
  gpmaternel_structure: "BP and SZ ask for a disorder or a cardiovascular risk factor of the relative, DR for a history of psychiatric illness"
  gppaternel_structure: "BP and SZ ask for a disorder or a cardiovascular risk factor of the relative, DR for a history of psychiatric illness"
  hvc_mhdecod: "'treated' in the shorter history form of SZ, the virus in DR"
  jobdur: "a class of years in BP and SZ, the months in the present job in DR (job_months, the question SZ reads from actiftps), the weeks under contract in the last 12 months in ASP"
  lvsbjind: "the way of living in BP and DR, the kind of housing in ASP"
  mere_structure: "BP and SZ ask for a disorder or a cardiovascular risk factor of the relative, DR for a history of psychiatric illness"
  migraine_mhoccur: "the SZ export swaps the two migraine columns (R107): migraine_mhdecod holds the migraine itself and this column holds 'treated', where the form and the dictionary have them the other way round"
  pere_structure: "BP and SZ ask for a disorder or a cardiovascular risk factor of the relative, DR for a history of psychiatric illness"
  psqi10e: "the raw column holds the free text of the partner question in SZ (delivered as psqi10f) and an answer from 0 to 3 in DR"
  somat_all: "SZ asks 'Pathologies allergiques'; BP and DR ask 'Pathologies allergiques et inflammatoires' (SZ allergic_disease, BP and DR allergic_inflammatory)"
  trouble: "the disorder of the relative in BP and SZ, the kind of mood disorder in DR"
  vie: "the main housing in BP, the way of living in SZ (BP has the way of living in lvsbjind)"
  vitd: "SZ records no unit and one of its centres looks like ng/mL (vitamin_d_as_written); DR is harmonised to nmol/L (vitamin_d)"

# An output name that two cohorts deliver with labels that are not the same list.
names:
  apgar_1min: "BP and DR read a 0 as 'nothing known' (their forms of 2009-2010 saved a 0, BP D51) and keep 1 to 10; ASP has 3 patients with a 1-minute 0 that no 5-minute 0 accompanies, kept as true values (0 to 10)"
  apgar_5min: "BP and DR read a 0 as 'nothing known' (BP D51) and keep 1 to 10; ASP keeps 0 to 10 (no 5-minute 0 in the data)"
  birth_date: "ASP has children (born up to 2023); the adult cohorts stop in 2012"
  height: "ASP has children: its lower limit is 80 cm, against 100 cm for adults"
  weight: "ASP has children: its lower limit is 10 kg, against 25 kg for adults"
  hospitalisation_months_v0: "the BP form stops at 20 months (\">20\" is read as 20, censored), the SZ form at 30; DR has no cap (up to 72 months seen). Compare after cutting every cohort at 20"
  dsm4_lt_n_mde: "the BP form stops at 20 episodes (range 0 to 20), the DR form accepts up to 50 (range 0 to 50)"
  dsm4_lt_n_mde_psychotic: "the BP form stops at 20 episodes (range 0 to 20), the DR form accepts up to 50 (range 0 to 50)"
  dsm4_lt_n_hypomania: "the BP form stops at 20 episodes (range 0 to 20), the DR form accepts up to 50 (range 0 to 50)"
  dsm4_lt_n_mania: "the BP form stops at 20 episodes (range 0 to 20), the DR form accepts up to 50 (range 0 to 50)"
  dsm4_lt_n_mania_psychotic: "the BP form stops at 20 episodes (range 0 to 20), the DR form accepts up to 50 (range 0 to 50)"
  dsm4_lt_n_mixed: "the BP form stops at 20 episodes (range 0 to 20), the DR form accepts up to 50 (range 0 to 50)"
  dsm4_lt_n_mixed_psychotic: "the BP form stops at 20 episodes (range 0 to 20), the DR form accepts up to 50 (range 0 to 50)"
  dsm4_lt_n_induced: "the BP form stops at 20 episodes (range 0 to 20), the DR form accepts up to 50 (range 0 to 50)"
  agoraphobia_onset_age_v0: "the ASP hard limit is 0 to 70 years (the oldest patient is 65), the BP limit 0 to 90"
  agoraphobia_onset_age_fu: "the ASP hard limit is 0 to 70 years (the oldest patient is 65), the BP limit 0 to 90"
  ocd_onset_age_v0: "the ASP hard limit is 0 to 70 years (the oldest patient is 65), the BP limit 0 to 90"
  ocd_onset_age_fu: "the ASP hard limit is 0 to 70 years (the oldest patient is 65), the BP limit 0 to 90"
