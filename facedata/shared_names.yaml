  height: "ASP has children: its lower limit is 80 cm, against 100 cm for adults"
  weight: "ASP has children: its lower limit is 10 kg, against 25 kg for adults"
  hospitalisation_months_v0: "the BP form stops at 20 months (\">20\" is read as 20, censored), the SZ form at 30; DR has no cap (up to 72 months seen). Compare after cutting every cohort at 20"
