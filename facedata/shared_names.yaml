  income_source: "code 7 is 'no income' on the SZ form and 'other' on the BP form, which has no 'no income' (SZ D37): do not compare code 7 between them"
  isf01_since_visit_when: "the DR form asks how long ago since the last visit (two weeks to a year, over a year); BP and SZ have one answer"
