instrument: mini_p_antisocial
title: "MINI, module P: antisocial personality disorder"
tab: MINI
section: MINI P
status: draft
notes: >
  Module P: antisocial personality disorder, with conduct before and after
  the age of 15.

  The MINI is a structured diagnostic interview; the modules and the
  points of the suicidality score are those of version 6. It is given at
  the screening visit and again at the visits of 2 and 4 years: 583 visits
  of 493 patients answer it (89%, 86% and 82% of the screening visits until
  2020, 57% in 2021 to 2023, 66% since; 35% to 100% by centre; open
  question O24). Not in BP or SZ. The variables keep the number of the
  question (mini_a01a is question A1a); the conclusions have a name that
  says what they are. Answers are 1 for yes and 0 for no. The form follows
  the skips of the interview: a question that comes after a "no" is empty.

  Boxes written by the form. Some columns are boxes that the form sets to 0
  as soon as the interview is opened: they hold 0 on every one of the 630
  rows that have the form, including 47 rows where no question is
  answered. An unticked box is not an answer "no". Such a box is declared
  derived_from the first question of its module, and its 0 is flagged
  derived_doubt where that question is empty.

  The conclusion (p) is yes on 6 visits, and none of them has the criteria
  in its items (two of P1 and three of P2); the questions of P2 are
  answered on 98 visits only. Open question O24.

defaults: {type: item, range: [0, 1]}

variables:
  mini_p01a: {column: p01a, label: "a) Fréquemment fait l’école buissonnière ou passé la nuit en dehors de chez vous ?"}
  mini_p01b: {column: p01b, label: "b) Fréquemment menti, triché, arnaqué les gens ou volé ?"}
  mini_p01c: {column: p01c, label: "c) Brutalisé, menacé ou intimidé les autres ?"}
  mini_p01d: {column: p01d, label: "d) Volontairement détruit ou mis le feu ?"}
  mini_p01e: {column: p01e, label: "e) Volontairement fait souffrir des animaux ou des gens ?"}
  mini_p01f: {column: p01f, label: "f) Contraint quelqu’un à avoir des relations sexuelles avec vous ?"}
  mini_p02a: {column: p02a, label: "a) Eu souvent des comportements que les autres trouvaient irresponsables comme ne pas rembourser des sommes dues, agir impulsivement ou évit"}
  mini_p02b: {column: p02b, label: "b) Fait de choses illégales (même si vous n’aviez pas été pris), comme détruire le bien d’autrui, voler, vendre de la drogue ou commettre un"}
  mini_p02c: {column: p02c, label: "c) Souvent été violent physiquement, y compris avec votre conjoint ou vos enfants ?"}
  mini_p02d: {column: p02d, label: "d) Souvent menti ou arnaqué les autres dans le but d’obtenir de l’argent ou par plaisir, ou menti juste pour vous amuser ?"}
  mini_p02e: {column: p02e, label: "e) Exposé des gens à des dangers sans vous préoccuper d’eux ?"}
  mini_p02f: {column: p02f, label: "f) Ressenti aucune culpabilité après avoir menti, ou blessé, maltraité ou volé quelqu'un ou détruit le bien d’autrui ?"}
  mini_antisocial_lifetime: {column: p, label: "Antisocial lifetime: TROUBLE DE LA PERSONNALITE ANTISOCIALE VIE ENTIERE"}
