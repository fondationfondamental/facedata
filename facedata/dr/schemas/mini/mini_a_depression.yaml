scores:
  mini_mde_symptoms_2_weeks:
    label: "Number of the nine symptoms of a depressive episode present in the last two weeks"
    sum: [mini_a01b, mini_a02b, mini_a03a_p2w, mini_a03b_p2w, mini_a03c_p2w, mini_a03d_p2w, mini_a03e_p2w, mini_a03f_p2w, mini_a03g_p2w]
  mini_mde_symptoms_past:
    label: "Number of the nine symptoms present in the past episode"
    sum: [mini_a01a, mini_a02a, mini_a03a_pe, mini_a03b_pe, mini_a03c_pe, mini_a03d_pe, mini_a03e_pe, mini_a03f_pe, mini_a03g_pe]
    versions: [inclusion]
  mini_mde_symptoms_past_fu:
    label: "Number of the nine symptoms present in the past episode, at a follow-up visit"
    sum: [mini_a01a_fu, mini_a02a_fu, mini_a03a_pe_fu, mini_a03b_pe_fu, mini_a03c_pe_fu, mini_a03d_pe_fu, mini_a03e_pe_fu, mini_a03f_pe_fu, mini_a03g_pe_fu]
    versions: [follow_up]
  mini_mde_current_rule: {custom: mini_mde_current, keep: false, label: "The MINI 6.0.0 rule on the items of the last two weeks (function mini_mde_current)"}
  mini_mde_current_ticked: {custom: mini_mde_current_ticked, keep: false, label: "The box current where it is ticked (a box at 0 is not ticked: missing)"}
  mini_mde_current:
    label: "Major depressive episode current (the last two weeks): 5 or more of A1b, A2b and the seven A3, A1b or A2b among them, and A4 (MINI 6.0.0 rule); the ticked box where the items do not tell"
    sum: [mini_mde_current_rule]
    otherwise: mini_mde_current_ticked
    compare: mini_mde_current_stored
  mini_mde_past_rule: {custom: mini_mde_past, versions: [inclusion], keep: false, label: "The MINI 6.0.0 rule on the items of the past episode (function mini_mde_past)"}
  mini_mde_past_ticked: {custom: mini_mde_past_ticked, versions: [inclusion], keep: false, label: "The box past where it is ticked (a box at 0 is not ticked: missing)"}
  mini_mde_past:
    label: "Major depressive episode past: 5 or more of A1a, A2a and the seven past A3, A1a or A2a among them, and the past A4 (MINI 6.0.0 rule); the ticked box where the items do not tell"
    sum: [mini_mde_past_rule]
    otherwise: mini_mde_past_ticked
    versions: [inclusion]
    compare: mini_mde_past_stored
  mini_mde_past_fu_rule: {custom: mini_mde_past_fu, versions: [follow_up], keep: false, label: "The MINI 6.0.0 rule on the _fu items of the past episode (function mini_mde_past_fu)"}
  mini_mde_past_fu_ticked: {custom: mini_mde_past_ticked, versions: [follow_up], keep: false, label: "The box past at a follow-up visit where it is ticked (a box at 0 is not ticked: missing)"}
  mini_mde_past_fu:
    label: "Major depressive episode past, at a follow-up visit (the _fu twins; lifetime wording, answered as since the last visit: see notes)"
    sum: [mini_mde_past_fu_rule]
    otherwise: mini_mde_past_fu_ticked
    versions: [follow_up]
    compare: mini_mde_past_fu_stored
