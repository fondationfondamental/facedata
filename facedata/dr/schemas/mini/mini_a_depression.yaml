  mini_mde_criteria_fu: {column: a05a, versions: [follow_up], label: "Criteria met for the period explored (current or past): 5 or more of A1 to A3, with A1 or A2, and A4, asked again at a follow-up visit (lifetime wording, answered as since the last visit: see notes)"}
