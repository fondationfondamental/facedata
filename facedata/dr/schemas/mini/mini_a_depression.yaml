instrument: mini_a_depression
title: "MINI, module A: major depressive episode"
tab: MINI
section: MINI A
status: reviewed
notes: >
  Module A: the symptoms of a major depressive episode, over the last two
  weeks (the columns that end in p2w) and in a past episode (pe).

  The MINI is a structured diagnostic interview, here version 6.0.0
  (DSM-IV; the version, its suicidality points and the reading of form 229
  are question M87). It is given at the screening visit (form 142) and
  again at the visits of 2 and 4 years (form 229, the same form; 3 more
  rows at 3 and 5 years): 583 visits of 493 patients answer it (89%, 86%
  and 82% of the screening visits until 2020, 57% in 2021 to 2023, 66%
  since; 35% to 100% by centre; open question O24). Not in BP or SZ. The
  variables keep the number of the question (mini_a01a is question A1a);
  the conclusions have a name that says what they are. Answers are 1 for
  yes and 0 for no.

  Skips. After a "no" to the first questions of a module the page hides
  and clears the later ones, or sets some of them to 0 (A1b, A2b, C1b,
  C2b, D5 to D7, E2 and the conclusion boxes). Module A has no enforced
  skip: the page shows a message only (formulaires.js 946-952), and 16 of
  the 27 visits with A1a and A2a no hold a later answer (14 a yes, 12 of
  them at follow-up). Module C is skipped from 2017 only: 137 of the 506
  visits with C1a and C2a no hold later answers, all dated 2012 to 2017.
  Elsewhere a later answer after the skip is rare (D 20 of 393 visits, E,
  F, G and H 0 or 1).

  Boxes written by the form. Some columns are boxes that the form sets to
  0 as soon as the interview is opened: they hold 0 on every one of the
  630 rows that have the form, including 47 rows where no question is
  answered. An unticked box is not an answer "no". Such a box is declared
  derived_from the question it follows, and its 0 is flagged derived_doubt
  where that question is empty. Request R169 asks the export to leave the
  boxes of an unanswered module empty.

  Follow-up (rule R32). The form of the visits of 2 and 4 years (form 229)
  is the screening form and asks the same lifetime questions, but the
  answers show that the interviewers read them as "since the last visit"
  (question M87): of the yes answers of the screening visit that are
  answered again at the first follow-up, A1a 21 of 73, A2a 23 of 72 and
  a05a 11 of 60 are no. The lifetime and past-episode questions are
  therefore delivered at inclusion (screening visit) only, and at
  follow-up in twins named _fu (versions read from the visit label, block
  visit_form, as in the treatment schemas); the current and past-month
  questions stay one variable. Here A1a, A2a, the past episode (the pe
  items, A4 and A5), a05a, the boxes past and recurrent and the number of
  episodes (16 variables) and the count of the past symptoms; the two-week
  items and the box current are one variable.

  Counts. mini_mde_symptoms_2_weeks and mini_mde_symptoms_past
  (mini_mde_symptoms_past_fu at follow-up) count the nine symptoms (A1, A2
  and the seven of A3) in each period; they need the nine answers.

  Criteria and boxes. The MINI 6.0.0 rule is five symptoms or more, A1 or
  A2 among them, and A4 (local/out/scale_reference_rest.md); form 142 asks
  it in these words: "Y a-t-il au moins 5 oui entre A1 et A3 et A4 est-elle
  cotée oui pour cette période ?" (a05a). mini_mde_criteria (a05a) is the
  interviewer's answer for the period explored, current or past: it
  agrees with the items (the current or the past episode meets the rule)
  on 480 of 526 visits; delivered as stored. The boxes current and past
  (aedm1, aedm2) are shown only after a05a yes and ticked by hand; no
  script fills them (formulaires.js 2553-2576, commented out). They do not
  follow the rule: the box current is ticked on 244 of the 402 visits
  whose items meet it for the last two weeks, on 44 of the 125 that do
  not and on 20 where the items do not tell; the box past (inclusion) on
  93 of 357, 5 of 98 and 1. Decision D85: mini_mde_current, mini_mde_past and
  mini_mde_past_fu are recomputed from the items of their period
  (functions mini_mde_current, mini_mde_past, mini_mde_past_fu of
  custom.py): 1 where the rule is met; 0 where it is not, or where A1 and
  A2 of the period are both no (the form then hides the period); missing
  where the empty answers could change the result. The stored boxes
  (mini_mde_current_stored, mini_mde_past_stored, mini_mde_past_fu_stored,
  not delivered) are their checks. Agreement of the stored box with the
  rule where both exist: current 325 of 527 visits (158 boxes 0 that the
  items give 1, 137 of them with a05a yes; 44 boxes 1 that they give 0: 23
  with A1b and A2b no, 15 with A4 no, 6 with fewer than five symptoms),
  past 186 of 455 (264 and 5), past at follow-up 43 of 89 (44 and 2):
  score_mismatch. The box is ticked on fewer visits that meet the rule
  over the years (current 75%, 64%, 49% in 2013 to 2015, 2016 to 2018 and
  since 2019; past 50%, 16%, 14%). The rule cannot be computed on 103,
  60 and 26 visits that hold a box: the module is not answered (64, 41,
  23; the box is the 0 written when the form is opened, R169), or A1 or A2
  is yes and the symptoms or A4 are empty (39, 19, 3). Where the box is
  ticked there (20, 1 and 1 visits) the ticked box is delivered and
  flagged score_as_stored: the value is the interviewer's box, not the
  rule (each score adds up its hidden rule, mini_mde_*_rule, and names
  the hidden ticked box, mini_mde_*_ticked, in otherwise; functions
  mini_mde_current_ticked and mini_mde_past_ticked). The other 83, 59 and
  25 stay missing: score_not_recomputed.

  The box recurrent is set
  from A5 (formulaires.js 1017-1019): ticked on 350 of the 380 visits with
  A5 yes and on 3 others; 175 visits have it alone. It is delivered as
  stored, derived_from A5: derived_doubt where A5 is empty (48 visits at
  inclusion, 33 at follow-up).

  Years and centres (2026-11-20). The box current is ticked on 75% of the
  visits with five symptoms or more in the last two weeks in 2013 to 2015,
  65% in 2016 to 2018 and 47% to 53% since 2019, while 94% to 100% of the
  answered visits have five symptoms or more; the box past falls from 34%
  of the visits in 2013 to 2015 to 0% to 12% since 2016: a step with no
  known cause (the boxes are written by the form; read the symptoms). In
  one centre (31 visits, 20 of them in 2013 to 2015) the past-episode items
  are yes on 10% to 23% of the visits, against 44% to 100% elsewhere (but
  23% for A3a in one other centre), with one box past ticked and a median
  of 2 past symptoms (8 in the cohort): the past episode was mostly not
  explored there; no known cause.

  Psychotic features. a03ea_actuel and a03ea_pe (examples that match a
  delusion) are answered on 55 and 59 visits. The diagnosis summary of the
  form (module Q) means to read a03ea_actuel, but a typo makes it ignore
  it (attr('cheked'), formulaires.js 2415 and 2447, defect A92).

  The number of episodes of the life (a06a) holds 99 on 6 visits (5 at
  inclusion, 1 at follow-up), read as "not known". One screening visit
  holds a slash instead of a number (unparsed).

version:
  name: visit_form
  column: visit
  codes:
    screening: inclusion
    V0: inclusion
    V6_mois: follow_up
    V1_an: follow_up
    V18_mois: follow_up
    V2_ans: follow_up
    V30_mois: follow_up
    V3_ans: follow_up
    V4_ans: follow_up
    V5_ans: follow_up

defaults: {type: item, range: [0, 1]}

