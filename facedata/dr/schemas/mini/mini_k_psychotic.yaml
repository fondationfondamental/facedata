instrument: mini_k_psychotic
title: "MINI, module K: psychotic disorders"
tab: MINI
section: MINI K
status: reviewed
notes: >
  Module K: psychotic symptoms, current and in the life, and the mood
  disorder with psychotic features.

  The MINI is a structured diagnostic interview; the modules and the
  points of the suicidality score are those of version 6. It is given at
  the screening visit and again at the visits of 2 and 4 years: 630 rows of
  519 patients hold the form (515 screening visits, 77 at 2 years, 35 at 4
  years, 1 at 3 years, 2 at 5 years), and a first question of a module is
  answered on 583 visits of 493 patients (89%, 86% and 82% of the screening visits until
  2020, 57% in 2021 to 2023, 66% since; 35% to 100% by centre; open
  question O24). Not in BP or SZ. The variables keep the number of the
  question (mini_a01a is question A1a); the conclusions have a name that
  says what they are. Answers are 1 for yes and 0 for no. The form follows
  the skips of the interview: a question that comes after a "no" is empty.

  Boxes written by the form. Some columns are boxes that the form sets to 0
  as soon as the interview is opened: they hold 0 on every one of the 630
  rows that have the form, including 47 rows where no question is
  answered. An unticked box is not an answer "no". Such a box is declared
  derived_from the first question of its module, and its 0 is flagged
  derived_doubt where that question is empty.

  Questions K1 to K7 have a third answer, "yes, bizarre", stored 2 (on 10
  cells). The a questions ask about the whole life, the b questions about
  now or the past month.

  Follow-up (rule R32). The form of the visits of 2 and 4 years (form 229)
  is the screening form and asks the same lifetime questions, but the
  answers show that the interviewers read them as "since the last visit"
  (question M87): of the lifetime yes answers of the screening visit that
  are answered again at follow-up, all 14 are no (12 of them in K1a to K7a). The lifetime questions are therefore
  delivered at inclusion (screening visit) only, and at follow-up in twins
  named _fu (versions read from the visit label, block visit_form, as in the
  treatment schemas); the current questions stay one variable.

  Gates (rule R24). K1b to K7b are asked only after a yes or a "yes,
  bizarre" to K1a to K7a: after a no they are 0 (asked_if; the a answer of
  every visit is read once more by a hidden variable, because the a
  answers are split by visit form): 3,708 cells. K6a1 follows K6a,
  K6b1 follows K6b. Four visits hold a K6b after a K6a no: kept as
  written. The form hides the wrong questions after K1b = yes: K7a and K6a1
  instead of K2a to K5b (a list variable reused in formulaires.js; defect
  A97).

  Conclusions. K14 (psychotic syndrome in the life) is yes, the form says,
  when K13 (the current syndrome) is yes: mini_psychotic_syndrome_lifetime
  is the larger of the current syndrome and the stored lifetime
  conclusion, and the stored value is its check (rule R33): 4 screening
  visits have a current syndrome and a stored lifetime no (0 to 1,
  score_mismatch), 11 visits have the lifetime syndrome. Either conclusion
  is enough (min_items 1): where the current one is empty the stored
  lifetime no stays no (2 visits), and where the stored lifetime one is
  empty a current no gives a lifetime no (3 screening visits). A mood disorder with psychotic features in the
  life is stored on 14 visits; the other conclusions are delivered as
  stored. The dictionary sheet does not list the "yes, bizarre" code
  (request R171).

  Centres (2026-11-20). One centre (26 visits, from 2022) rates the current
  disorganised speech, disorganised behaviour and negative symptoms (K8b,
  K9b, K10b) yes on 10, 8 and 6 visits, against 0 to 4 visits of 20 to 63
  in each other centre; this raises the shares of 2024 on to 12% to 18%
  (3% to 5% in the cohort). No known cause.

