instrument: mini_o_organic
title: "MINI, module O: medical, organic or drug causes ruled out"
tab: MINI
section: MINI O
status: reviewed
notes: >
  Module O: were a medication, a drug or a physical illness present just
  before the symptoms, and has an organic cause been ruled out. Three
  answers: yes, no and uncertain.

  The MINI is a structured diagnostic interview; the modules and the
  points of the suicidality score are those of version 6. It is given at
  the screening visit and again at the visits of 2 and 4 years: 630 rows of
  519 patients hold the form (515 screening visits, 77 at 2 years, 35 at 4
  years, 1 at 3 years, 2 at 5 years), and a first question of a module is
  answered on 583 visits of 493 patients (89%, 86% and 82% of the screening visits until
  2020, 57% in 2021 to 2023, 66% since; 35% to 100% by centre; open
  question O24). Not in BP or SZ. The variables keep the number of the
  question (mini_a01a is question A1a); the conclusions have a name that
  says what they are. Answers are 1 for yes and 0 for no. The form follows
  the skips of the interview: a question that comes after a "no" is empty.

  Boxes written by the form. Some columns are boxes that the form sets to 0
  as soon as the interview is opened: they hold 0 on every one of the 630
  rows that have the form, including 47 rows where no question is
  answered. An unticked box is not an answer "no". Such a box is declared
  derived_from the first question of its module, and its 0 is flagged
  derived_doubt where that question is empty.

  The interview asks module O when a disorder is current; the form shows it
  always and has no script for it (answered on 542 of 630 visits). O2 asks
  whether an organic cause has been ruled out: a no means "not ruled out".
  123 visits answer O2 no although O1a and O1b are no (57 of the 62 visits
  of one centre), where yes is expected: some interviewers may have read
  the question the other way round (question M89). Delivered as stored.

defaults: {type: item, range: [0, 1]}

variables:
  mini_o01a: {column: o01a, type: category, codes: {"1": "yes", "0": "no", "2": uncertain}, label: "O1 a) Juste avant que ces symptômes n’aient débuté : Preniez-vous un médicament ou des remèdes quels qu’ils soient ?"}
  mini_o01b: {column: o01b, type: category, codes: {"1": "yes", "0": "no", "2": uncertain}, label: "b) Aviez-vous une maladie physique quelle qu’elle soit ?"}
  mini_o02: {column: o02, type: category, codes: {"1": "yes", "0": "no", "2": uncertain}, label: "O2) FINALEMENT : UNE CAUSE ORGANIQUE A-T-ELLE ÉTÉ ÉCARTÉE ?"}
