instrument: mini_e_agoraphobia
title: "MINI, module E: agoraphobia"
tab: MINI
section: MINI E
status: reviewed
notes: >
  Module E: agoraphobia, and its three conclusions with or without panic
  disorder.

  The MINI is a structured diagnostic interview, here version 6.0.0
  (DSM-IV; the version, its suicidality points and the reading of form 229
  are question M87). It is given at the screening visit (form 142) and
  again at the visits of 2 and 4 years (form 229, the same form; 3 more
  rows at 3 and 5 years): 583 visits of 493 patients answer it (89%, 86%
  and 82% of the screening visits until 2020, 57% in 2021 to 2023, 66%
  since; 35% to 100% by centre; open question O24). Not in BP or SZ. The
  variables keep the number of the question (mini_a01a is question A1a);
  the conclusions have a name that says what they are. Answers are 1 for
  yes and 0 for no.

  Skips. After a "no" to the first questions of a module the page hides
  and clears the later ones, or sets some of them to 0 (A1b, A2b, C1b,
  C2b, D5 to D7, E2 and the conclusion boxes). Module A has no enforced
  skip: the page shows a message only (formulaires.js 946-952), and 16 of
  the 27 visits with A1a and A2a no hold a later answer (14 a yes, 12 of
  them at follow-up). Module C is skipped from 2017 only: 137 of the 506
  visits with C1a and C2a no hold later answers, all dated 2012 to 2017.
  Elsewhere a later answer after the skip is rare (D 20 of 393 visits, E,
  F, G and H 0 or 1).

  Boxes written by the form. Some columns are boxes that the form sets to
  0 as soon as the interview is opened: they hold 0 on every one of the
  630 rows that have the form, including 47 rows where no question is
  answered. An unticked box is not an answer "no". Such a box is declared
  derived_from the question it follows, and its 0 is flagged derived_doubt
  where that question is empty. Request R169 asks the export to leave the
  boxes of an unanswered module empty.

  Follow-up. This module asks about the present or the last month: its
  variables are read at every visit (the lifetime questions of modules A
  to D and H are split by visit, rule R32).

  E2 is set to 0 by the page after an E1 no (not hidden): 0 on 368 of the
  369 visits with E1 no. The dictionary gives no coding for E01 (request
  R171).

  Conclusions (decision D85). The form writes the three conclusions from
  E2 and module D when E2, D5 or D7 is answered (gere_mode,
  formulaires.js 1424-1455), as the MINI 6.0.0 defines them: panic
  disorder current with agoraphobia is E2 yes and D7 (panic disorder
  current) yes; without agoraphobia, E2 no and D7 yes; agoraphobia current
  without a history of panic disorder, E2 yes and D5 (panic disorder
  lifetime) no. The rater can also tick them by hand, and the script does
  not run again when an answer is changed later. They are recomputed with
  these rules (scores min, with reverse for the "no"); D5 and D7 are read
  again here on every visit by hidden variables, and D7 is 0 where D5 is
  no and D7 is empty (34 visits: the current disorder needs the lifetime
  one, as the D schema reads it). A conclusion is missing where E2 or the
  D answer it needs is missing. The stored conclusions (ea, eb, ec, the
  _stored variables, not delivered) are their checks. Agreement before
  (2026-11-20, an empty item read as no): agoraphobia without panic 525 of
  534 visits, panic with agoraphobia 514 of 529, panic without
  agoraphobia 497 of 516. With the rules on the visits where both exist:
  516 of 524, 506 of 513, 490 of 501 (score_mismatch: 7, 6 and 7 stored
  yes that the items give no; 1, 1 and 4 the other way). The rule cannot
  be computed on 10, 16 and 15 visits with a stored conclusion (E2 or the
  D answer is empty; 1, 9 and 4 of them stored yes): score_not_recomputed.
  36, 38 and 50 visits with the answers and no stored conclusion get one.
  The conclusion 'agoraphobia current without a history of panic
  disorder' (ec) is named mini_agoraphobia_without_panic_current (it was
  mini_agoraphobia_current), as the form labels it.

  Centres (2026-11-20). One centre (27 to 29 visits, 2013 to 2022)
  answers yes far less often than the others in the anxiety modules: D1a
  on 2 of 27 visits (31% to 80% elsewhere), N1a on 5 of 29 (46% to 81%),
  generalised anxiety 1 of 29, H1 1 of 27, agoraphobia without panic 0 of
  28; another (20 visits, 2019 to 2022) has H1 yes on 15 of 20 (4% to 44%
  elsewhere) and generalised anxiety on 13 of 21. The answers are coherent
  inside each module, so this is a difference of patients or of
  interviewers, with no known cause.

defaults: {type: item, range: [0, 1]}

variables:
  mini_e01: {column: e01, label: "E1) Etes- vous anxieux(se) ou particulièrement mal à l’aise dans les endroits ou dans des situations dont il est difficile ou gênant de s’éc"}
  mini_e02: {column: e02, label: "E2) Redoutez-vous tellement ces situations qu’en pratique vous les évitez ou bien êtes-vous extrêmement mal à l’aise lorsque vous les affron"}
  mini_panic_lifetime_every_visit: {column: d05, keep: false, label: "D5 (panic disorder lifetime) read on every visit, for the conclusions"}
  mini_d07_every_visit: {column: d07, asked_if: mini_panic_lifetime_every_visit, keep: false, label: "D7 (panic disorder current) read here; 0 where D5 is no, as the disorder needs D5"}
  mini_panic_with_agoraphobia_current_stored: {column: ea, keep: false, label: "Panic with agoraphobia current, as stored: TROUBLE PANIQUE avec Agoraphobie ACTUEL"}
  mini_panic_without_agoraphobia_current_stored: {column: eb, keep: false, label: "Panic without agoraphobia current, as stored: TROUBLE PANIQUE sans Agoraphobie ACTUEL"}
  mini_agoraphobia_without_panic_current_stored: {column: ec, keep: false, label: "Agoraphobia current without a history of panic disorder, as stored: AGORAPHOBIE ACTUELLE sans antécédents de Trouble panique"}

scores:
  mini_panic_with_agoraphobia_current:
    label: "Panic disorder current with agoraphobia: E2 yes and D7 yes (formulaires.js gere_mode)"
    min: [mini_e02, mini_d07_every_visit]
    compare: mini_panic_with_agoraphobia_current_stored
  mini_panic_without_agoraphobia_current:
    label: "Panic disorder current without agoraphobia: E2 no and D7 yes (formulaires.js gere_mode)"
    min: [mini_e02, mini_d07_every_visit]
    reverse: [mini_e02]
    compare: mini_panic_without_agoraphobia_current_stored
  mini_agoraphobia_without_panic_current:
    label: "Agoraphobia current without a history of panic disorder: E2 yes and D5 no (formulaires.js gere_mode)"
    min: [mini_e02, mini_panic_lifetime_every_visit]
    reverse: [mini_panic_lifetime_every_visit]
    compare: mini_agoraphobia_without_panic_current_stored
