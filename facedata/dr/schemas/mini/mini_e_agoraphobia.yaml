  mini_e02: {column: e02, label: "E2) Redoutez-vous tellement ces situations qu’en pratique vous les évitez ou bien êtes-vous extrêmement mal à l’aise lorsque vous les affron"}
  mini_panic_with_agoraphobia_current: {column: ea, label: "Panic with agoraphobia current: TROUBLE PANIQUE avec Agoraphobie ACTUEL"}
  mini_panic_without_agoraphobia_current: {column: eb, label: "Panic without agoraphobia current: TROUBLE PANIQUE sans Agoraphobie ACTUEL"}
  mini_agoraphobia_without_panic_current: {column: ec, label: "Agoraphobia current: AGORAPHOBIE ACTUELLE sans antécédents de Trouble panique"}
