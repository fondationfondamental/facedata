instrument: mini_d_panic
title: "MINI, module D: panic disorder"
tab: MINI
section: MINI D
status: reviewed
notes: >
  Module D: panic disorder (lifetime: the attacks of the life and the
  worst one) and the attacks of the last month (D7).

  The MINI is a structured diagnostic interview, here version 6.0.0
  (DSM-IV; the version, its suicidality points and the reading of form 229
  are question M87). It is given at the screening visit (form 142) and
  again at the visits of 2 and 4 years (form 229, the same form; 3 more
  rows at 3 and 5 years): 583 visits of 493 patients answer it (89%, 86%
  and 82% of the screening visits until 2020, 57% in 2021 to 2023, 66%
  since; 35% to 100% by centre; open question O24). Not in BP or SZ. The
  variables keep the number of the question (mini_a01a is question A1a);
  the conclusions have a name that says what they are. Answers are 1 for
  yes and 0 for no.

  Skips. After a "no" to the first questions of a module the page hides
  and clears the later ones, or sets some of them to 0 (A1b, A2b, C1b,
  C2b, D5 to D7, E2 and the conclusion boxes). Module A has no enforced
  skip: the page shows a message only (formulaires.js 946-952), and 16 of
  the 27 visits with A1a and A2a no hold a later answer (14 a yes, 12 of
  them at follow-up). Module C is skipped from 2017 only: 137 of the 506
  visits with C1a and C2a no hold later answers, all dated 2012 to 2017.
  Elsewhere a later answer after the skip is rare (D 20 of 393 visits, E,
  F, G and H 0 or 1).

  Boxes written by the form. Some columns are boxes that the form sets to
  0 as soon as the interview is opened: they hold 0 on every one of the
  630 rows that have the form, including 47 rows where no question is
  answered. An unticked box is not an answer "no". Such a box is declared
  derived_from the question it follows, and its 0 is flagged derived_doubt
  where that question is empty. Request R169 asks the export to leave the
  boxes of an unanswered module empty.

  Follow-up (rule R32). The form of the visits of 2 and 4 years (form 229)
  is the screening form and asks the same lifetime questions, but the
  answers show that the interviewers read them as "since the last visit"
  (question M87): of the yes answers of the screening visit that are
  answered again at the first follow-up, D1a 26 of 40 and the lifetime
  panic disorder 11 of 14 are no. The lifetime and past-episode questions
  are therefore delivered at inclusion (screening visit) only, and at
  follow-up in twins named _fu (versions read from the visit label, block
  visit_form, as in the treatment schemas); the current and past-month
  questions stay one variable. Here D1a to D3, the thirteen symptoms of
  the worst attack, the lifetime panic disorder and the limited-symptom
  attacks (19 variables) and the symptom count; D7 and the current panic
  disorder are one variable.

  mini_panic_symptoms (mini_panic_symptoms_fu at follow-up) counts the
  thirteen symptoms of the worst attack.

  Skip. After the first no among D1a, D1b and D2 the page hides and clears
  the next questions and sets D5, D7 and the conclusion to 0 (verif_d,
  formulaires.js 1260): D5 is 0 on 391 of the 393 visits screened out, D7
  on 389. 20 of them hold a later answer (6 a yes), scattered over the
  years. D6 is cleared each time a saved interview is opened again where
  D3 is not yes and no D4 symptom is ticked (cacher3(151), formulaires.js
  1303-1310, defect A87): it is 0 on 69 of the 393 visits and empty on
  324; it stays missing where empty.

  Conclusions against the criteria. The lifetime panic disorder (d05) is
  yes on 125 visits (115 at inclusion, 10 at follow-up); 113 of them meet
  the criteria as the items give them (D1a, D1b, D2, D3 and four
  symptoms), 12 do not, and no visit meets them with a no. The current
  panic disorder (d04) is the lifetime disorder with attacks in the last
  month on 526 of 531 visits. The form writes it from D7 (the MINID7
  handler): the check mini_panic_current_check (not delivered) agrees on
  all visits but 1 (D7 yes, conclusion no: score_mismatch). The
  conclusions are delivered as stored.

  Centres (2026-11-20). One centre (27 to 29 visits, 2013 to 2022)
  answers yes far less often than the others in the anxiety modules: D1a
  on 2 of 27 visits (31% to 80% elsewhere), N1a on 5 of 29 (46% to 81%),
  generalised anxiety 1 of 29, H1 1 of 27, agoraphobia without panic 0 of
  28; another (20 visits, 2019 to 2022) has H1 yes on 15 of 20 (4% to 44%
  elsewhere) and generalised anxiety on 13 of 21. The answers are coherent
  inside each module, so this is a difference of patients or of
  interviewers, with no known cause.

version:
  name: visit_form
  column: visit
  codes:
    screening: inclusion
    V0: inclusion
    V6_mois: follow_up
    V1_an: follow_up
    V18_mois: follow_up
    V2_ans: follow_up
    V30_mois: follow_up
    V3_ans: follow_up
    V4_ans: follow_up
    V5_ans: follow_up

defaults: {type: item, range: [0, 1]}

variables:
  mini_d01a: {column: d01a, versions: [inclusion], label: "D1 a)Avez-vous, à plus d’une occasion, eu des périodes ou des crises durant lesquelles vous vous êtes senti(e) subitement très anxieux(se), "}
  mini_d01a_fu: {column: d01a, versions: [follow_up], label: "D1 a)Avez-vous, à plus d’une occasion, eu des périodes ou des crises durant lesquelles vous vous êtes senti(e) subitement très anxieux(se), , asked again at a follow-up visit (lifetime wording, answered as since the last visit: see notes)"}
  mini_d01b: {column: d01b, versions: [inclusion], label: "b) Ces crises atteignaient-elles leur intensité maximale en moins de 10 minutes ?"}
  mini_d01b_fu: {column: d01b, versions: [follow_up], label: "b) Ces crises atteignaient-elles leur intensité maximale en moins de 10 minutes ?, asked again at a follow-up visit (lifetime wording, answered as since the last visit: see notes)"}
  mini_d02: {column: d02, versions: [inclusion], label: "D2) Certaines de ces crises, même il y a longtemps, ont-elles été imprévisibles, ou sont-elles survenues sans que rien ne les provoque ?"}
  mini_d02_fu: {column: d02, versions: [follow_up], label: "D2) Certaines de ces crises, même il y a longtemps, ont-elles été imprévisibles, ou sont-elles survenues sans que rien ne les provoque ?, asked again at a follow-up visit (lifetime wording, answered as since the last visit: see notes)"}
  mini_d03: {column: d03, versions: [inclusion], label: "D3) A la suite de l'une ou plusieurs de ces crises, avez-vous déjà eu une période d'au moins un mois durant laquelle vous redoutiez d'avoir "}
  mini_d03_fu: {column: d03, versions: [follow_up], label: "D3) A la suite de l'une ou plusieurs de ces crises, avez-vous déjà eu une période d'au moins un mois durant laquelle vous redoutiez d'avoir , asked again at a follow-up visit (lifetime wording, answered as since the last visit: see notes)"}
  mini_d04a: {column: d04a, versions: [inclusion], label: "a) Aviez-vous des palpitations votre coeur battait-il très fort ou de façon irrégulière ?"}
