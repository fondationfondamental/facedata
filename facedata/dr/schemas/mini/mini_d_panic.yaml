scores:
  mini_panic_symptoms:
    label: "Number of the thirteen symptoms of the worst panic attack"
    sum: [mini_d04a, mini_d04b, mini_d04c, mini_d04d, mini_d04e, mini_d04f, mini_d04g, mini_d04h, mini_d04i, mini_d04j, mini_d04k, mini_d04l, mini_d04m]
    versions: [inclusion]
  mini_panic_symptoms_fu:
    label: "Number of the thirteen symptoms of the worst panic attack, at a follow-up visit"
    sum: [mini_d04a_fu, mini_d04b_fu, mini_d04c_fu, mini_d04d_fu, mini_d04e_fu, mini_d04f_fu, mini_d04g_fu, mini_d04h_fu, mini_d04i_fu, mini_d04j_fu, mini_d04k_fu, mini_d04l_fu, mini_d04m_fu]
    versions: [follow_up]
  mini_panic_current_check: {sum: [mini_d07], compare: mini_panic_current, keep: false, label: "Check: the form writes the current panic disorder from D7 (formulaires.js MINID7 handler)"}
