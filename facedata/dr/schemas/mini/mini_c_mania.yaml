instrument: mini_c_mania
title: "MINI, module C: manic and hypomanic episodes"
tab: MINI
section: MINI C
status: reviewed
notes: >
  Module C: manic and hypomanic episodes, current (actuel) and past (pe),
  with the family history of bipolar disorder (C0).

  The MINI is a structured diagnostic interview, here version 6.0.0
  (DSM-IV; the version, its suicidality points and the reading of form 229
  are question M87). It is given at the screening visit (form 142) and
  again at the visits of 2 and 4 years (form 229, the same form; 3 more
  rows at 3 and 5 years): 583 visits of 493 patients answer it (89%, 86%
  and 82% of the screening visits until 2020, 57% in 2021 to 2023, 66%
  since; 35% to 100% by centre; open question O24). Not in BP or SZ. The
  variables keep the number of the question (mini_a01a is question A1a);
  the conclusions have a name that says what they are. Answers are 1 for
  yes and 0 for no.

  Skips. After a "no" to the first questions of a module the page hides
  and clears the later ones, or sets some of them to 0 (A1b, A2b, C1b,
  C2b, D5 to D7, E2 and the conclusion boxes). Module A has no enforced
  skip: the page shows a message only (formulaires.js 946-952), and 16 of
  the 27 visits with A1a and A2a no hold a later answer (14 a yes, 12 of
  them at follow-up). Module C is skipped from 2017 only: 137 of the 506
  visits with C1a and C2a no hold later answers, all dated 2012 to 2017.
  Elsewhere a later answer after the skip is rare (D 20 of 393 visits, E,
  F, G and H 0 or 1).

  Boxes written by the form. Some columns are boxes that the form sets to
  0 as soon as the interview is opened: they hold 0 on every one of the
  630 rows that have the form, including 47 rows where no question is
  answered. An unticked box is not an answer "no". Such a box is declared
  derived_from the question it follows, and its 0 is flagged derived_doubt
  where that question is empty. Request R169 asks the export to leave the
  boxes of an unanswered module empty.

  Follow-up (rule R32). The form of the visits of 2 and 4 years (form 229)
  is the screening form and asks the same lifetime questions, but the
  answers show that the interviewers read them as "since the last visit"
  (question M87): of the yes answers of the screening visit that are
  answered again at the first follow-up, C2a 5 of 5 and the family history
  C0 10 of 10 are no (C1a: 2 yes at screening). The lifetime and
  past-episode questions are therefore delivered at inclusion (screening
  visit) only, and at follow-up in twins named _fu (versions read from the
  visit label, block visit_form, as in the treatment schemas); the current
  and past-month questions stay one variable. Here C0 and its text, C1a,
  C2a, the past episode (the pe items), the three conclusions (episode
  current or past), their boxes past and C7a to C7c (25 variables); C1b,
  C2b, the current episode and the boxes current are one variable. C1b and
  the boxes current hang on C1a, C2b on C2a: hidden variables read C1a and
  C2a on every visit for them.

  Few patients of this cohort answer yes: an elated period on 27 visits,
  an irritable one on 37. The conclusions (manic episode, hypomanic
  episode, hypomanic symptoms) are each a yes/no and two boxes current and
  past; the six boxes are written by the form, derived_from C1a
  (derived_doubt where it is empty: 68 visits, and 43 and 25 for the boxes
  past at inclusion and follow-up).

  Skip (form change of 2017). After C1a and C2a no, the page now hides and
  clears module C and sets its conclusions to 0. Until 2017 it did not:
  137 of the 506 visits with C1a and C2a no hold later answers, all dated
  2012 to 2017 (2014: 43, 2015: 45, 2016: 25, 2017: 1 of 54), mostly zeros
  (C7a to C7c: 121 each); 18 hold a yes (C3e past 7, C4 past 7). They are
  delivered as recorded. The OR gate (C1a or C2a) of C3 to C7 is not
  encoded: an empty item after a double no stays missing.

  C1b and C2b (now) are set to 0 by the page after a C1a or C2a no: 0 is
  read where they are empty after that no (asked_if: C1b 9 visits, C2b
  136, 23 of them at follow-up; C1b and C2b hold 2 and 3 yes after a no,
  kept).

  C4 (longest duration): the form prints the first option as '3 jours au
  moins' where the MINI says three days or less (142.php and 229.php, C113
  and C114, defect A88); the codes are 1 three days or less (hypomanic
  symptoms), 2 four to six days, 3 seven days or more. The dictionary
  gives no coding for C02B (request R171).

  Psychotic features. The diagnosis summary of the form (module Q) means
  to read C3a past (c03a_pe), but a typo makes it ignore it
  (attr('cheked'), formulaires.js 2447, defect A92).

  mini_c00a (who in the family) is free text: delivered as type text, its
  values are never printed.

