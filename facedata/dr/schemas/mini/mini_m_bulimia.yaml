  mini_m05: {column: m05, label: "M5) L’opinion ou l’estime que vous avez de vous-même sont-elles largement influencées par votre poids ou vos formes corporelles ?"}
  mini_m06: {column: m06, label: "M6) LE PATIENT PRÉSENTE-T-IL UNE ANOREXIE MENTALE?"}
