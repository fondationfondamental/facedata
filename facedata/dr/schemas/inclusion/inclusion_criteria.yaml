instrument: inclusion_criteria
title: Inclusion and non-inclusion criteria
tab: INCLUSION
section: inclusion
status: draft
notes: >
  Seven yes/no boxes filled at the screening visit, for 633 of the 634
  patients: three inclusion criteria, three exclusion criteria and the
  conclusion "eligible". They are what the clinician ticked, with one
  exception: the box "stage 2 or more" (incl03) is written by the
  application when the form of the Thase and Rush stage (122) is saved, 1 for
  the stages 2 to 5 and 0 for stage 1 (js/DRONE.js, case 122), and it can be
  ticked by hand in the inclusion form 193 where no stage was rated (see
  thase_rush). Almost every patient has the three inclusion criteria and
  none of the exclusion criteria, and fewer than five patients have another
  answer to any box. The MADRS score and the Thase and Rush stage that two
  of the criteria refer to are in the instruments madrs and thase_rush.

  A section of the TRD dictionary only. Yes is 1 and no is 0.

defaults: {type: item, range: [0, 1]}

variables:
  criterion_madrs_above_20: {column: incl01, label: "Inclusion criterion: MADRS score above 20"}
  criterion_depressive_episode: {column: incl02, label: "Inclusion criterion: major depressive episode"}
  criterion_resistance_stage_2: {column: incl03, label: "Inclusion criterion: stage 2 or more of treatment resistance (Thase and Rush)"}
  exclusion_ocd: {column: excl01, label: "Exclusion criterion: obsessive-compulsive disorder"}
  exclusion_eating_disorder: {column: excl02, label: "Exclusion criterion: eating disorder"}
  exclusion_bipolar: {column: excl03, label: "Exclusion criterion: bipolar disorder"}
  eligible: {column: excl04, label: "Patient eligible"}
