instrument: neuropsy_substances
title: Coffee, tea and tobacco before and during the testing
tab: NEUROPSYCHOLOGIE
section: CONSOMMATIONS SUBSTANCES
status: reviewed
notes: >
  Coffee, tea and tobacco before the appointment and during the break of the
  testing. Not in BP or SZ. Filled with the assessment: 723 visits.

  Each "how many" is asked only after a yes: where the answer is no and the
  cell is empty, the number is 0 (asked_if). The two questions on tobacco
  are asked only of smokers (smoker): the 500 non-smokers leave "smoked
  before the appointment" and "smoked during the break" empty, and 207 of
  the 219 smokers answered the second. With asked_if: smoker the 500 empty
  cells are 0 (for smoked_before it was already so), and the number of
  cigarettes of the break, which hangs on it, goes from 194 to 694 visits. A
  "yes" with an empty count stays missing: coffee before 3 visits, coffee at
  the break 1, tea none, the cigarettes of the break 13 of 101. The observed
  maxima, 8 cups and 2 cigarettes, are inside the ranges.

  "How long before" is stored 1, 2 or 3. The dictionary gives no code; the
  form of the application (eCEDR, form 199.php) does: 1 "5 to 30 min"
  (min_5_30), 2 "under 1 hour" (under_1h), 3 "over 1 hour" (over_1h). Coffee
  101, 73 and 195 visits, tea 20, 7 and 51, tobacco 118, 37 and 35.

  The neuropsychological assessment is given at inclusion and at the visits
  of 1, 2 and 4 years: 744 visits of 436 patients. About three inclusions in
  four hold it until 2020 and about one in two since 2021 (open question
  O22).

defaults: {type: item, range: [0, 1]}

variables:
  coffee_before: {column: conso01, label: Drank coffee before coming}
  coffee_before_cups: {column: conso01a, type: number, range: [0, 10], winsor: false, asked_if: coffee_before, label: "Coffee before coming: how many cups"}
  coffee_before_delay: {column: conso01b, type: category, label: "Coffee before coming: how long before", codes: {"1": min_5_30, "2": under_1h, "3": over_1h}}
  tea_before: {column: conso02, label: Drank tea before coming}
  tea_before_cups: {column: conso02a, type: number, range: [0, 10], winsor: false, asked_if: tea_before, label: "Tea before coming: how many cups"}
  tea_before_delay: {column: conso02b, type: category, label: "Tea before coming: how long before", codes: {"1": min_5_30, "2": under_1h, "3": over_1h}}
  smoker: {column: conso03, label: Is a smoker}
  smoked_before: {column: conso03a, asked_if: smoker, label: Smoked before the appointment}
  smoked_before_delay: {column: conso03b, type: category, label: "Smoked before the appointment: how long before", codes: {"1": min_5_30, "2": under_1h, "3": over_1h}}
  coffee_break: {column: conso04, label: Drank coffee during the break}
  coffee_break_cups: {column: conso04a, type: number, range: [0, 10], winsor: false, asked_if: coffee_break, label: "Coffee during the break: how many cups"}
  tea_break: {column: conso05, label: Drank tea during the break}
  tea_break_cups: {column: conso05a, type: number, range: [0, 10], winsor: false, asked_if: tea_break, label: "Tea during the break: how many cups"}
  smoked_break: {column: conso06, asked_if: smoker, label: Smoked during the break}
