instrument: wais4_memoire_chiffres
title: WAIS-IV Digit Span
tab: NEUROPSYCHOLOGIE
section: MÉMOIRE DES CHIFFRES
status: draft
notes: >
  WAIS-IV Digit Span: the raw total, the age-scaled score and its z-score.
  BP also has the trials and the spans; here only the totals are entered.
  669 visits.

  One edition. No column names the edition of the WAIS in this cohort. The
  data show the WAIS-IV in every year: within an age group, a raw score has
  one scaled score, the same before and after 2018, for the five subtests;
  95 digit span totals are above 30, the maximum of the WAIS-III; and the
  processing speed index follows the WAIS-IV table of BP on each of the 35
  sums seen in both cohorts (the WAIS-III table on 21 of 34). The version
  block gives wais_version = wais4 on the 731 visits that hold a subtest,
  so that the column exists as in BP and SZ.

  Scaled score and z-score. They are recomputed and delivered (decision of the
  project lead for the standard scores of the neuropsychological tests): the
  scaled score is read in the WAIS-IV table of the application
  (norms/wais4_digit_span.csv) from the raw total, and the z-score is (scaled
  score - 10) / 3. The plain table that the other cohorts use is used here
  too, not the table of the DR script: where the script has another value (a
  typo), the stored score is flagged. On 2 of the 669 visits the DR script
  differs from that table. The table is read with the age typed in the form
  (cclin01, delivered as neuropsy_age by neuropsy_conditions) where it is
  within 1 year of the age at the visit, and with the age at the visit
  elsewhere (digit span: 626 of the 669 visits use the typed age, 43 have a
  typed age more than 1 year away). The stored scores are
  wais4_ds_scaled_stored and wais4_ds_z_stored, not delivered. Verified: the
  scaled score differs from the stored one on 9 of 669 visits (1.3%,
  score_mismatch, 2013 to 2026), its z-score on 23 of 662, which include the
  14 visits of 2013 to 2015 where the stored z-score is not (scaled score -
  10) / 3. No raw total gives norm_missing.

version:
  name: wais_version
  filled:
    wais4: [similtot, similstd, nbrut, nstand, arithtot, arithstd, imt01, imt02, code01, code03, code04,
            symbol01, symbol03, symbol04, ivt01, ivt04]

defaults: {type: item, versions: [wais4]}

variables:
  wais4_ds_age_entered: {column: cclin01, label: Age typed in the form (the norms were read with it), type: number, range: [15, 100], winsor: false, keep: false}
  wais4_ds_total: {column: nbrut, label: Raw total (forward + backward + sequencing), range: [0, 48]}
  wais4_ds_scaled_stored: {column: nstand, label: Age-scaled score (mean 10 and SD 3) as stored, range: [1, 19], keep: false}
  wais4_ds_z_stored: {column: vstand, label: Scaled score as a z-score as stored, type: number, range: [-3, 3], winsor: false, keep: false}

scores:
  wais4_ds_scaled:
    label: Age-scaled score (mean 10 and SD 3), read in the table of the manual
    lookup: wais4_digit_span
    from: wais4_ds_total
    age: wais4_ds_age_entered
    range: [1, 19]
    compare: wais4_ds_scaled_stored
  wais4_ds_z:
    label: Scaled score as a z-score, (scaled score - 10) / 3
    sum: [wais4_ds_scaled]
    scale: [0.3333333, -3.3333333]
    range: [-3, 3]
    compare: wais4_ds_z_stored
    compare_tolerance: 0.006
