instrument: wais4_code_symboles_ivt
title: WAIS-IV Coding, Symbol Search and processing speed index
tab: NEUROPSYCHOLOGIE
section: VITESSE DE TRAITEMENT
status: reviewed
notes: >
  The BP schema in the columns of this extraction: WAIS-IV Coding, Symbol
  Search and the processing speed index. 726 visits.

  One edition. No column names the edition of the WAIS in this cohort. The
  data show the WAIS-IV in every year. Within a band of the typed age a raw
  score has one stored scaled score for digit span and similarities, and for
  arithmetic, coding and symbol search on every cell but one (2, 3 and 4
  visits). The stored score is the same before and after 2018 on every cell
  seen in both periods but one (symbol search). 95 digit span totals are above
  30, the maximum of the WAIS-III. The processing speed index stored by DR
  follows the WAIS-IV table of BP (norms/wais4_ivt.csv) on each of its 35
  distinct sums, all seen in BP (the WAIS-III table on 21 of 35). The version
  block gives wais_version = wais4 on the 731 visits that hold a subtest, so
  that the column exists as in BP and SZ.

  Coding, raw score. Where a box is filled incorrectly (76 visits), the stored
  raw score is the boxes filled minus the errors on 58 visits and the boxes
  filled alone on 17 (1 has no stored raw score): the centres do not all count the same way. Centre N counts the boxes alone:
  8 of its 9 visits with errors hold the boxes filled alone, which are 8 of
  the 17 raw scores that lose the errors. The DR application script has set the raw score to the boxes
  filled alone only since 2019-08-06, but each centre runs its own copy:
  before that date 47 of the 50 visits with errors follow the boxes minus the
  errors and 2 the boxes alone, from that date 11 of the 26 follow the boxes
  minus the errors and 15 the boxes alone. The clinicians go on typing all the
  boxes, errors included: at the same age and the same symbol search raw
  score, one more error goes with 0.14 fewer boxes in the typed total in DR
  (linear regression, 692 visits). In BP, where the application stored the
  boxes filled alone from 2021, it goes with 0.85 fewer boxes up to 2021 and
  0.21 fewer from 2021, against 1.85 fewer for a count of correct boxes; ASP,
  whose form always had the new wording, gives 0.09 fewer. The stored raw
  score therefore gives credit for the errors where it is the boxes alone; the
  stored value is wais4_code_raw_stored, not delivered (decision D136). The
  coding raw score is computed as the boxes filled minus the errors, with the
  two counts next to it.

  40 raw scores change: 17 lose the errors, 21 have boxes typed and the errors
  blank, and 2 have more errors than boxes (out of range). The last 23 get no
  raw score (score_not_recomputed on the 21, out_of_range on the 2), so no
  scaled score and no z-score. The 21 visits with the errors blank (2018 to
  2026, 8 of them at centre K) have a stored raw score and a stored scaled
  score. Open question: does a blank mean 0 errors? If it does, their stored
  raw score is the right one.

  Symbol search, raw score. The stored raw score is the correct answers minus
  the incorrect ones on every visit that has the three values (704 of 704).
  The DR script does not stop it at 0 (the ASP one does): 5 raw scores are
  negative and 1 is above the maximum of 60, so 6 are out of range; they get
  no scaled score (score_not_recomputed) and stay flagged.

  Scaled scores, z-scores and index. They are recomputed and delivered
  (decision of the project lead for the standard scores of the
  neuropsychological tests). The raw scores stay as delivered, except the
  coding raw score (above). The scaled scores are read in the WAIS-IV tables
  of the application (norms/wais4_code.csv and wais4_symbol.csv) from the raw
  scores, and the z-scores are (scaled score - 10) / 3. The plain table that
  the other cohorts use is used here too, not the table of the DR script
  (norms/wais4_code_dr.csv for coding): where the script has another value (a
  typo), the stored score is flagged. The DR coding script puts the ages 18
  and 19 in the band of 16 and 17 (its condition is age>17 && age>=20; 102
  age-by-raw cells differ from the table): 1 of the 701 visits with a coding
  raw score has a coding score that this changes (the stored one is the
  script's, 1 point above the table's).

  Age. The tables are read with the age typed in the form (cclin01, delivered
  as neuropsy_age by neuropsy_conditions) where it is within 1 year of the age
  at the visit, and with the age at the visit elsewhere: 672 of the 724 visits
  with the coding boxes use the typed age and 52 have a typed age more than 1
  year away (42 typed younger); symbol search 660 of 708 and 48 (40 typed
  younger). The 9 coding and the 9 symbol search mismatches among them equal
  the table at the typed age (see wais4_memoire_chiffres.yaml for the four
  schemas together).

  The sum of the two recomputed scaled scores is delivered as
  wais4_ivt_sum_scaled, and the index and its percentile rank are read from it
  in the index tables (norms/wais4_ivt.csv and wais4_ivt_percentile.csv). A
  percentile of 0.1 or 99.9 is a censored value (wais4_ivt_percentile_cens).
  The stored values are wais4_*_stored, not delivered. The confidence interval
  of the index is a text ("86-104") delivered as stored.

  Verified on the visits that have both. Coding scaled score: 17 of 699 differ
  (9 typed age, 5 change of the raw score, 1 table typo, 2 unexplained) and 23
  are not recomputed (score_not_recomputed, the 23 above); its z-score 17 of
  696. Symbol search scaled score: 10 of 708 differ (9 typed age, 1
  unexplained) and 6 more are not recomputed because the raw score is out of
  range; its z-score 9 of 697. Sum of scaled scores: 20 of 685 differ and 27
  are not recomputed (22 without a coding score, 6 without a symbol search
  score, 1 without either); the index and the percentile rank differ on the
  same 20. The mismatches are spread over 2013 to 2026 (11 before 2019); no
  raw score gives norm_missing.

version:
  name: wais_version
  filled:
    wais4: [similtot, similstd, nbrut, nstand, arithtot, arithstd, imt01, imt02, code01, code03, code04,
            symbol01, symbol03, symbol04, ivt01, ivt04]

defaults: {type: item, versions: [wais4]}

variables:
  wais4_code_age_entered: {column: cclin01, label: Age typed in the form (the norms were read with it), type: number, range: [15, 100], winsor: false, keep: false}

  # Coding (Code)
  wais4_code_filled: {column: code01, label: Coding - boxes filled,             range: [0, 135]}
  wais4_code_errors: {column: code02, label: Coding - boxes filled incorrectly, range: [0, 135]}
  wais4_code_raw_stored: {column: code03, label: "Coding - raw score as stored (the application stopped taking the errors off at some date)", range: [0, 135], keep: false}
  wais4_code_scaled_stored: {column: code04, label: Coding - age-scaled score as stored, range: [1, 19], keep: false}
  wais4_code_z_stored: {column: code05, label: Coding - scaled score as a z-score as stored, type: number, range: [-3, 3], winsor: false, keep: false}

  # Symbol search (Symboles)
  wais4_symbol_correct: {column: symbol01, label: Symbol search - correct answers,   range: [0, 60]}
  wais4_symbol_errors:  {column: symbol02, label: Symbol search - incorrect answers, range: [0, 60]}
  wais4_symbol_raw:     {column: symbol03, label: Symbol search - raw score,         range: [0, 60]}
  wais4_symbol_scaled_stored: {column: symbol04, label: Symbol search - age-scaled score as stored, range: [1, 19], keep: false}
  wais4_symbol_z_stored: {column: symbol05, label: Symbol search - scaled score as a z-score as stored, type: number, range: [-3, 3], winsor: false, keep: false}

  # Processing speed index (IVT)
  wais4_ivt_sum_scaled_stored: {column: ivt04, label: Sum of the two scaled scores as stored, range: [2, 38], keep: false}
  wais4_ivt_index_stored: {column: ivt01, label: Processing speed index as stored, range: [50, 150], keep: false}
  wais4_ivt_percentile_stored: {column: ivt02, label: Percentile rank of the index as stored, type: number, range: [0, 100], winsor: false, keep: false}
  wais4_ivt_interval:   {column: ivt03, label: 95% confidence interval of the index, type: text}

scores:
  # Consistency check only.
  wais4_symbol_raw_check: {sum: [wais4_symbol_correct], minus: [wais4_symbol_errors], compare: wais4_symbol_raw, keep: false, versions: [wais4]}
  wais4_code_raw:
    label: Coding - raw score, the boxes filled minus the boxes filled incorrectly (the boxes filled correctly)
    sum: [wais4_code_filled]
    minus: [wais4_code_errors]
    range: [0, 135]
    compare: wais4_code_raw_stored
    versions: [wais4]
  wais4_code_scaled:
    label: Coding - age-scaled score (mean 10 and SD 3), read in the table of the manual
    lookup: wais4_code
    from: wais4_code_raw
    age: wais4_code_age_entered
    range: [1, 19]
    compare: wais4_code_scaled_stored
  wais4_code_z:
    label: Coding - scaled score as a z-score, (scaled score - 10) / 3
    sum: [wais4_code_scaled]
    scale: [0.3333333, -3.3333333]
    range: [-3, 3]
    compare: wais4_code_z_stored
    compare_tolerance: 0.006
  wais4_symbol_scaled:
    label: Symbol search - age-scaled score (mean 10 and SD 3), read in the table of the manual
    lookup: wais4_symbol
    from: wais4_symbol_raw
    age: wais4_code_age_entered
    range: [1, 19]
    compare: wais4_symbol_scaled_stored
  wais4_symbol_z:
    label: Symbol search - scaled score as a z-score, (scaled score - 10) / 3
    sum: [wais4_symbol_scaled]
    scale: [0.3333333, -3.3333333]
    range: [-3, 3]
    compare: wais4_symbol_z_stored
    compare_tolerance: 0.006
  wais4_ivt_sum_scaled:
    label: Sum of the two scaled scores
    sum: [wais4_code_scaled, wais4_symbol_scaled]
    range: [2, 38]
    compare: wais4_ivt_sum_scaled_stored
    versions: [wais4]
  wais4_ivt_index:
    label: Processing speed index, read in the table of the manual from the sum of the scaled scores
    lookup: wais4_ivt
    from: wais4_ivt_sum_scaled
    range: [50, 150]
    compare: wais4_ivt_index_stored
    versions: [wais4]
  wais4_ivt_percentile:
    label: Percentile rank of the index, read in the table of the manual
    lookup: wais4_ivt_percentile
    from: wais4_ivt_sum_scaled
    range: [0, 100]
    compare: wais4_ivt_percentile_stored
    compare_tolerance: 0.051
    versions: [wais4]
