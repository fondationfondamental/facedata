instrument: wais4_similitudes
title: WAIS-IV Similarities
tab: NEUROPSYCHOLOGIE
section: SIMILITUDES
status: draft
notes: >
  WAIS-IV Similarities: the raw total, the age-scaled score and its
  z-score. BP also has the eighteen items; here only the totals are
  entered. 654 visits.

  One edition. No column names the edition of the WAIS in this cohort. The
  data show the WAIS-IV in every year: within an age group, a raw score has
  one scaled score, the same before and after 2018, for the five subtests;
  95 digit span totals are above 30, the maximum of the WAIS-III; and the
  processing speed index follows the WAIS-IV table of BP on each of the 35
  sums seen in both cohorts (the WAIS-III table on 21 of 34). The version
  block gives wais_version = wais4 on the 731 visits that hold a subtest,
  so that the column exists as in BP and SZ.

  Scaled score and z-score. They are recomputed and delivered (decision of the
  project lead for the standard scores of the neuropsychological tests): the
  scaled score is read in the WAIS-IV table of the application
  (norms/wais4_similarities.csv) from the raw total, and the z-score is
  (scaled score - 10) / 3. The plain table that the other cohorts use is used
  here too, not the table of the DR script: where the script has another value
  (a typo), the stored score is flagged. On 27 of the 654 visits the DR script
  differs from that table, at ages 70 to 74. The table is read with the age
  typed in the form (cclin01, delivered as neuropsy_age by
  neuropsy_conditions) where it is within 1 year of the age at the visit, and
  with the age at the visit elsewhere (digit span: 626 of the 669 visits use
  the typed age, 43 have a typed age more than 1 year away). The stored scores
  are wais4_simil_scaled_stored and wais4_simil_z_stored, not delivered.
  Verified: the scaled score differs from the stored one on 30 of 653 visits
  (4.6%, score_mismatch, 2013 to 2026, 21 of them before 2019), its z-score on
  43 of 643, which include the 16 visits of 2013 to 2015 where the stored
  z-score is not (scaled score - 10) / 3. One visit of a patient of 80 years
  has no value in the table (norm_missing, and the stored score is not
  recomputed).

version:
  name: wais_version
  filled:
    wais4: [similtot, similstd, nbrut, nstand, arithtot, arithstd, imt01, imt02, code01, code03, code04,
            symbol01, symbol03, symbol04, ivt01, ivt04]

defaults: {type: item, versions: [wais4]}

variables:
  wais4_simil_age_entered: {column: cclin01, label: Age typed in the form (the norms were read with it), type: number, range: [15, 100], winsor: false, keep: false}
  wais4_simil_total: {column: similtot, label: Similarities raw total (18 items), range: [0, 36]}
  wais4_simil_scaled_stored: {column: similstd, label: Age-scaled score (mean 10 and SD 3) as stored, range: [1, 19], keep: false}
  wais4_simil_z_stored: {column: similcr, label: Scaled score as a z-score as stored, type: number, range: [-3, 3], winsor: false, keep: false}

scores:
  wais4_simil_scaled:
    label: Age-scaled score (mean 10 and SD 3), read in the table of the manual
    lookup: wais4_similarities
    from: wais4_simil_total
    age: wais4_simil_age_entered
    range: [1, 19]
    compare: wais4_simil_scaled_stored
  wais4_simil_z:
    label: Scaled score as a z-score, (scaled score - 10) / 3
    sum: [wais4_simil_scaled]
    scale: [0.3333333, -3.3333333]
    range: [-3, 3]
    compare: wais4_simil_z_stored
    compare_tolerance: 0.006
