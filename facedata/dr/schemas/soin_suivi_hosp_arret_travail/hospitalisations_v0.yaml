instrument: hospitalisations_v0
title: "Hospitalisations over the whole life, at inclusion"
tab: SOIN SUIVI HOSP ARRET TRAVAIL
section: HOSPITALISATION
status: draft
notes: >
  Hospitalisations over the whole life, at the inclusion visit: 327 visits,
  about half of the inclusions (8% to 83% by centre). The SZ schema of this
  name, with the columns that this cohort has: ever hospitalised (written Y
  and N), the age at the first hospitalisation, their number and their
  total length in months. An age of 0 is "not recorded" (26 visits, all
  with a number of 0). 6 ages are written "00" and are out of range: they
  are on 6 of the 19 inclusions (15 of them from 2024) whose number is
  "00" and whose yes/no is empty, because the export derives the yes/no
  from the number (R73).

variables:
  ever_hospitalised_v0: {column: hooccur_hospitalisation_lt, type: item, range: [0, 1], codes: {Y: 1, N: 0}, label: "Has ever been hospitalised, at inclusion"}
  first_hospitalisation_age: {column: agedebut_hospitalisation_lt, type: number, unit: years, range: [5, 90], missing: {"0": not_recorded}, winsor: false, label: Age at the first hospitalisation}
  n_hospitalisations_v0: {column: nboccur_hospitalisation_lt, type: number, range: [0, 50], winsor: false, label: "Number of hospitalisations over the whole life, at inclusion"}
  hospitalisation_months_v0: {column: hodur_hospitalisation_lt, type: number, unit: months, range: [0, 600], winsor: false, label: "Total length of the hospitalisations over the whole life, at inclusion"}
