instrument: psqi
title: Pittsburgh Sleep Quality Index (PSQI, last 30 days)
tab: AUTO-QUESTIONNAIRES
section: PSQI
status: reviewed
notes: >
  The BP schema, plus the questions on the bed partner. Sleep over the last
  30 days. Four questions ask for a time or a duration, the others are
  rated 0 to 3. Seven component scores of 0 to 3 add up to the total (0 to
  21, higher is worse). Filled at inclusion and at every follow-up visit:
  1,084 visits.

  Times. Bedtime, rising time and hours of sleep are written HH:MM:SS here
  (HH:MM in BP) and delivered in hours (23:30:00 is 23.5). One bedtime cannot
  be read (unparsed). A rising time of 00:00:00 is the default of the time
  widget saved untouched, not an answer: it is a missing code (not_recorded;
  A75) on 39 visits, and the efficiency and the total are then missing on 3
  visits. A bedtime of 00:00:00 is a real answer. A bedtime after midnight is
  a small number (00:30 is 0.5). The delivered bedtime (psqi_bedtime, a
  score of custom.py) is corrected as in BP: the 19 bedtimes typed on a
  12-hour clock get 12 hours (see the efficiency below), and the 7 typed
  24:00:00 become 0, as the BP export writes them (decision of the user,
  2026-11-21). The bedtime as typed is read as psqi_bedtime_typed and not
  delivered (its one unparsed cell is flagged there). The median and the
  year and centre panels of the bedtime still mix bedtimes before and after
  midnight: read the efficiency and the hours of sleep.

  Minutes to fall asleep (psqi02): the BP rule. A value above 240 is the
  minutes multiplied by 60 and is divided by 60 (unit_inferred, 1 visit).
  Not winsorised (the 99th percentile would bring 7 real answers down).

  Components. As in BP: quality is item 6 and medication is item 7, so
  their copies (psqi15, psqi16) are not read (ignored.yaml); the duration
  is delivered as stored; latency, efficiency, disturbances and daytime
  dysfunction are recomputed by the functions of custom.py and compared
  with the stored values. The stored components and the stored total are
  the export's (nucleus psqi.yaml, strict sums).

  Latency (psqi_latency): from the corrected minutes and item 5a; the
  stored component differs on the one visit with the corrected minutes.

  Efficiency (psqi_efficiency): hours of sleep over the hours in bed, counted
  across midnight. A bedtime from 6:00 to 17:00 with more than 16 hours in bed
  is a bedtime typed on a 12-hour clock, and 12 hours are added (19 visits).
  The stored efficiency takes the bedtime as typed: it differs from ours on 17
  of these 19 visits, and the stored total on the same visits (the total
  differs on 17 visits: 16 of these and the visit of the latency). The script
  of the form (192_score.js, lines 165 to 196) takes the absolute difference
  between the two clock times, which is wrong across midnight (16 hours in bed
  from 23:00 to 07:00; A74); the stored values of this extraction are the
  export's, which counts across midnight, so they are not the script's.

  Disturbances (psqi_disturbances): the export needs item 5j ("another
  reason", with its free text 5k) and leaves the component empty when 5j is
  blank, on 19 visits that have 5b to 5i. A blank 5j is far commoner than
  any other blank item and reads as "no other reason": it counts 0 here and
  the component is delivered on those 19 visits (and the total on 18). This
  is the published rule: since 2005 the scoring instructions count 5j as 0
  when its value or its comment is missing (PSQI scoring sheet, University
  of Pittsburgh).

  Daytime dysfunction (psqi_dysfunction): items 8 and 9, as stored.

  More than BP: question 10, on a bed partner or room mate (psqi10, 0 none
  to 3 in the same bed), and what this person noticed (psqi10a to psqi10e,
  each 0 to 3, psqi10f the free text of "other restlessness"). They do not
  enter the total. They are shown only after a bed partner is declared (1
  to 3): the 171 cells of the five ratings filled on the 35 visits that
  answer "none" (34 or 35 per rating) and 3 cells of the text are not shown
  (not_shown); the text 5k is shown only after an answer 1 to 3 to item 5j
  (1 cell). In this extraction psqi10e is the rating of "other
  restlessness" and psqi10f its free text; in FACE SZ the column psqi10e
  holds the free text, delivered under the name psqi10f as here.

  The break of 2018 (open question O1, answered by D55). 96% and 93% of the
  inclusion visits of 2012 to 2014 and of 2015 to 2017 hold the scale, 40%
  to 52% in the three periods since 2018. The form (192) is in none of the
  lists of the simplified visit: an empty scale since 2018 is "not asked"
  on a simplified visit, not "no", and it is missing data here, never 0.
  The extraction has no flag that tells a simplified visit from a full one
  with an empty scale (R127, R139, R155).

defaults: {type: item, range: [0, 3]}

variables:
  psqi_bedtime_typed: {column: psqi01, type: time, label: Usual bedtime as typed (hours), range: [0, 24], keep: false}
  psqi_latency:
    column: psqi02
    type: number
    label: Minutes to fall asleep
    unit: min
    units:
      min: {factor: 1, expect: [0, 240.01]}
      "min x 60": {factor: 0.0166667, expect: [240.01, 1260]}
      "min x 60, long": {factor: 0.0166667, expect: [1440, 4501]}
    range: [0, 240]
    winsor: false
  psqi_rising_time: {column: psqi03, type: time, label: Usual rising time (hours), range: [0, 24], missing: {"00:00:00": not_recorded}}
  psqi_sleep_hours: {column: psqi04, type: time, label: Hours of sleep per night, range: [0, 24]}
  psqi05a: {label: "Vous n’êtes pas arrivé(e) à vous endormir en 30 minutes"}
  psqi05b: {label: "Vous vous êtes réveillé(e) au milieu de la nuit ou plus tôt que..."}
  psqi05c: {label: "Vous avez dû vous lever pour aller aux toilettes"}
  psqi05d: {label: "Vous avez eu du mal à respirer"}
  psqi05e: {label: "Vous avez toussé ou ronflé bruyamment"}
  psqi05f: {label: "Vous avez eu trop froid"}
  psqi05g: {label: "Vous avez eu trop chaud"}
  psqi05h: {label: "Vous avez fait des cauchemars"}
  psqi05i: {label: "Vous avez eu des douleurs"}
  psqi05j: {label: "Combien de fois, au cours des 30 derniers jours, avez-vous eu des..."}
  psqi05k: {type: text, label: "Other reason for troubled sleep, as written", shown_if: {psqi05j: [1, 2, 3]}}
  psqi06: {label: "Comment qualifieriez-vous la qualité de votre sommeil en général au..."}
  psqi07: {label: "Au cours des 30 derniers jours, combien de fois avez-vous pris des..."}
  psqi08: {label: "Au cours des 30 derniers jours, combien de fois avez-vous eu des..."}
  psqi09: {label: "Au cours des 30 derniers jours, combien vous a-t-il été difficile..."}

  # The questions about the bed partner, which the BP extraction does not hold. Not part of the score.
  psqi10: {label: "Has a bed partner or a room mate (0 none to 3 in the same bed)"}
  psqi10a: {label: "As seen by the partner: loud snoring", shown_if: {psqi10: [1, 2, 3]}}
  psqi10b: {label: "As seen by the partner: long pauses between breaths while asleep", shown_if: {psqi10: [1, 2, 3]}}
  psqi10c: {label: "As seen by the partner: legs twitching or jerking while asleep", shown_if: {psqi10: [1, 2, 3]}}
  psqi10d: {label: "As seen by the partner: episodes of disorientation or confusion during sleep", shown_if: {psqi10: [1, 2, 3]}}
  psqi10e: {label: "As seen by the partner: other restlessness", shown_if: {psqi10: [1, 2, 3]}}
  psqi10f: {type: text, label: "As seen by the partner: other restlessness, as written", shown_if: {psqi10e: [1, 2, 3]}}

  # Component scores as stored, 0 to 3.
  psqi_efficiency_stored: {column: psqi11, label: Component 4 as stored (hours in bed from the bedtime typed as written), keep: false}
  psqi_duration: {column: psqi12, label: "Component 3 - sleep duration, as stored (7 hours or more counts 0)"}
  psqi_disturbances_stored: {column: psqi13, label: Component 5 as stored, keep: false}
  psqi_latency_stored: {column: psqi14, label: Component 2 as stored, keep: false}
  psqi_dysfunction_stored: {column: psqi17, label: Component 7 as stored, keep: false}
  psqi_stored: {column: psqi_, label: PSQI total as stored, range: [0, 21], keep: false}

scores:
  psqi_bedtime:
    label: Usual bedtime (hours, 0 to 24; a bedtime typed on a 12-hour clock gets 12 hours)
    custom: psqi_bedtime
  psqi_disturbances:
    label: Component 5 - sleep disturbances
    custom: psqi_disturbances
    compare: psqi_disturbances_stored
  psqi_dysfunction:
    label: Component 7 - daytime dysfunction
    custom: psqi_dysfunction
    compare: psqi_dysfunction_stored
  psqi_latency_component:
    label: Component 2 - sleep latency
    custom: psqi_latency
    compare: psqi_latency_stored
  psqi_efficiency:
    label: Component 4 - habitual sleep efficiency
    custom: psqi_efficiency
    compare: psqi_efficiency_stored
  psqi_total:
    label: PSQI total (0 to 21, higher is worse)
    sum: [psqi06, psqi_latency_component, psqi_duration, psqi_efficiency,
          psqi_disturbances, psqi07, psqi_dysfunction]
    compare: psqi_stored
