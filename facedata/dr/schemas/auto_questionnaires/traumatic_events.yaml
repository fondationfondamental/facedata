instrument: traumatic_events
title: List of traumatic life events
tab: AUTO-QUESTIONNAIRES
section: EVENEMENTS DE VIE TRAUMATIQUES
status: draft
notes: >
  List of seventeen traumatic life events, the first part of the form that
  ends with the PCL-S (pcl_s.yaml). Not in BP or SZ. For each event:
  whether it happened (1 yes, 0 no), the age at the event and whether it
  had a negative impact (1 yes, 0 no). The wording of the events is not in
  the dictionary, so the variables are numbered (open question O20); the
  seventeenth is "another very stressful event", with a free text. Filled
  at inclusion and at the visits of 1, 2 and 4 years: the seventeen
  questions are answered on 544 visits (30% of the inclusions of 2012 to
  2014, 71% in 2015 to 2017, 29% to 43% since).

  Of the 624 events answered yes, 575 have an age, 417 an impact of 1 and
  207 an impact of 0.

  The impact is 0 wherever the form was opened. The form writes 0 in the
  impact of every event that is not answered yes: 10,137 cells. On the
  rows where the event is answered no, this 0 says the same as the answer.
  But on 89 visits the seventeen impacts hold 0 and no event is answered:
  there the 0 is not an answer. These 1,513 cells, and 23 cells of an
  event left empty on other visits, are delivered and flagged
  derived_doubt (the impact is declared derived_from its event). Count the
  visits of this form with the events (trau01 to trau17), not with the
  impacts.

  The number of events answered yes (trauma_events, 0 to 17) needs the
  seventeen answers: 533 visits.

defaults: {type: item, range: [0, 1]}

