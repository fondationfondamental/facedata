instrument: traumatic_events
title: List of traumatic life events
tab: AUTO-QUESTIONNAIRES
section: EVENEMENTS DE VIE TRAUMATIQUES
status: reviewed
notes: >
  List of seventeen traumatic life events (form 208): the events of the
  Life Events Checklist, 16 events and a seventeenth, "another very
  stressful event", with a free text. Not in BP or SZ. The dictionary puts
  this form and the PCL-S (pcl_s.yaml, form 216) under one section header;
  they are two forms of the EMR, and the PCL-S does not say which event of
  the list its items are about. For each event: whether it happened (1 yes,
  0 no), the age at the event and whether it had a negative impact (a box,
  1 ticked). The wording is in the form, not in the dictionary: the
  variable names stay numbered and each label gives a short English version
  of the event. Event 15, "sudden, unexpected death of a close person",
  differs from the published checklist item (a sudden accidental death): to
  verify against the French version used.

  Period. The form prints none; the published checklist asks about the
  whole life and the inclusion answers are read so. At follow-up the
  answers are not cumulative: of the events answered yes at inclusion, 21%,
  17% and 14% are answered yes again at the visits of 1, 2 and 4 years
  (105, 61 and 27 patients with both forms complete), and new events appear
  (29, 21 and 12). Whether the follow-up form asks about the time since the
  previous visit is a question for the data managers (O34, M78).

  Filled at inclusion and at the visits of 1, 2 and 4 years: the seventeen
  questions are answered on 544 visits (30% of the inclusions of 2012 to
  2014, 71% in 2015 to 2017, 29% to 43% since: the form is in none of the
  lists of the simplified visit, D55).

  Of the 624 events answered yes, 575 have an age, 417 an impact of 1 and
  207 an impact of 0.

  The impact is 0 wherever the form was opened. The form writes 0 in the
  impact of every event that is not answered yes: 10,137 cells. On the rows
  where the event is answered no, this 0 says the same as the answer. But
  on 89 visits the seventeen impacts hold 0 and no event is answered: there
  the 0 is not an answer. These 1,513 cells, and 23 cells of an event left
  empty on other visits, are delivered and flagged derived_doubt (the
  impact is declared derived_from its event). The zeros are left as the
  form wrote them. Count the visits of this form with the events (trau01 to
  trau17), not with the impacts.

  The number of events answered yes (trauma_events, 0 to 17) needs the
  seventeen answers: 533 visits.

defaults: {type: item, range: [0, 1]}

