instrument: mars
title: Medication Adherence Rating Scale (MARS, 10 items)
tab: AUTO-QUESTIONNAIRES
section: MARS
status: draft
notes: >
  The BP scale, with the answers turned to the BP coding, and without the
  question added in 2021 (mars11). Ten yes/no questions on taking the
  treatment. Filled at inclusion and at every follow-up visit: 1,036
  visits.

  Coding: the opposite of BP. BP stores 1 = no and 0 = yes (decision D37 of
  the BP progress file). This extraction stores 1 = yes, as the dictionary
  says: on the items that tell, the share of answers 1 is the mirror of BP
  (item 3: 9% against 91%; item 4: 16% against 86%; item 5, "I take my
  medication only when I am sick": 14% against 96%; item 8, "by staying on
  medication I can prevent getting sick": 76% against 9%; item 9: 27%
  against 83%), in every period (item 5: 9% to 15%) and in every centre
  (6% to 31%). The ten items are delivered on the BP coding, 1 = no and 0 =
  yes (written as codes), so that they mean the same in the two cohorts.

  Total: the stored one is wrong, not delivered. The total gives one point
  for "no" to items 1 to 6, 9 and 10 and one point for "yes" to items 7 and
  8: 0 to 10, higher is a better adherence. The EMR applies the BP formula
  to the opposite coding, so the stored total (mars_) counts the answers
  that show poor adherence: its median is 3, against 8 in BP. It is
  reproduced exactly by the twin score mars_total_as_stored (10 minus the
  total; no mismatch on 1,026 visits), which is not delivered. The
  delivered total has a median of 7 (quartiles 6 and 8; BP 8, 6 and 9) and
  falls when depression rises (r = -0.38 with the QIDS). Open question O17.

  The break of 2018 (open question O1). 90% and 87% of the inclusion visits of
  2012 to 2014 and of 2015 to 2017 hold the scale, 40% to 48% in the three
  periods since 2018. It is the same fall in about a dozen
  self-questionnaires, in most centres, and nobody knows its reason: an
  empty scale after 2018 is missing data, not a scale that was not asked.

defaults: {type: item, range: [0, 1]}

variables:
  mars01: {label: "MARS item 1 (1 = no, 0 = yes, as in BP; stored the other way round)", codes: {"1": 0, "0": 1}}
  mars02: {label: "MARS item 2 (1 = no, 0 = yes, as in BP; stored the other way round)", codes: {"1": 0, "0": 1}}
  mars03: {label: "MARS item 3 (1 = no, 0 = yes, as in BP; stored the other way round)", codes: {"1": 0, "0": 1}}
  mars04: {label: "MARS item 4 (1 = no, 0 = yes, as in BP; stored the other way round)", codes: {"1": 0, "0": 1}}
  mars05: {label: "MARS item 5 (1 = no, 0 = yes, as in BP; stored the other way round)", codes: {"1": 0, "0": 1}}
  mars06: {label: "MARS item 6 (1 = no, 0 = yes, as in BP; stored the other way round)", codes: {"1": 0, "0": 1}}
  mars07: {label: "MARS item 7 (1 = no, 0 = yes, as in BP; stored the other way round)", codes: {"1": 0, "0": 1}}
  mars08: {label: "MARS item 8 (1 = no, 0 = yes, as in BP; stored the other way round)", codes: {"1": 0, "0": 1}}
  mars09: {label: "MARS item 9 (1 = no, 0 = yes, as in BP; stored the other way round)", codes: {"1": 0, "0": 1}}
  mars10: {label: "MARS item 10 (1 = no, 0 = yes, as in BP; stored the other way round)", codes: {"1": 0, "0": 1}}
  mars_stored: {column: mars_, label: MARS total as stored, range: [0, 10], keep: false}

scores:
  mars_total:
    label: MARS adherence total (higher is better)
    sum: [mars01, mars02, mars03, mars04, mars05, mars06, mars07, mars08,
          mars09, mars10]
    reverse: [mars07, mars08]
  mars_total_as_stored:
    label: "MARS counted as the EMR does here (the answers that show poor adherence), to check the stored score"
    sum: [mars01, mars02, mars03, mars04, mars05, mars06, mars07, mars08,
          mars09, mars10]
    reverse: [mars01, mars02, mars03, mars04, mars05, mars06, mars09, mars10]
    compare: mars_stored
    keep: false
