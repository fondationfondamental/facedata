instrument: altman
title: Altman Self-Rating Mania Scale (ASRM, 5 items, past week)
tab: AUTO-QUESTIONNAIRES
section: ALTMAN
status: reviewed
notes: >
  The BP schema as it is (the same names as BP and ASP). Five items, 0 to
  4, on the past week (the published scale and the form agree); the total
  is their sum (0 to 20). Filled at inclusion and at every follow-up visit,
  not at screening: 1,071 visits. The stored total (altman_) equals the sum
  on the 1,067 visits where the five items are filled; it is the export's
  (nucleus altman.yaml).

  The break of 2018 (open question O1, answered by D55). 95% and 90% of the
  inclusion visits of 2012 to 2014 and of 2015 to 2017 hold the scale, 42%
  to 47% in the three periods since 2018. The form (132) is in none of the
  lists of the simplified visit: an empty scale since 2018 is "not asked"
  on a simplified visit, not "no", and it is missing data here, never 0.
  The extraction has no flag that tells a simplified visit from a full one
  with an empty scale (R127, R139, R155).

defaults: {type: item, range: [0, 4]}

variables:
  altman01: {label: Cheerfulness}
  altman02: {label: Self-confidence}
  altman03: {label: Reduced need for sleep}
  altman04: {label: Talkativeness}
  altman05: {label: Activity}
  altman_stored: {column: altman_, label: ASRM total as stored, range: [0, 20], keep: false}

scores:
  altman_total:
    label: ASRM total
    sum: [altman01, altman02, altman03, altman04, altman05]
    compare: altman_stored
