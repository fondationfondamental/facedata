instrument: physical_activity
title: Physical activity over the last seven days
tab: AUTO-QUESTIONNAIRES
section: QIAP
status: reviewed
notes: >
  The SZ schema in the columns of this extraction (qiap01a to qiap04bm).
  Physical activity over the last seven days: days of vigorous activity,
  of moderate activity and of walking, the time per day, the walking pace
  and the time spent sitting. Filled at inclusion and at the visits of 1,
  2 and 4 years: 940 visits, 80% or more of the inclusions in every period.
  The break of 2018 does not touch it.

  Each duration has two fields, hours and minutes; both are delivered as
  typed, as in SZ. No total is computed. The form asks for the hours and
  minutes of an activity only when its number of days is 1 or more, and for
  the walking pace after a number of walking days (script of the form, the
  function f_autoq_qiap): the durations and the pace are delivered only
  then (shown_if). 42 typed cells are not delivered (not_shown): 34 under 0
  days, the clear case, and 8 under an empty number of days (the same rule;
  the form hides them too).

  Walking pace. This form stores 1 brisk, 2 moderate and 3 slow (form 217);
  SZ stores 1 slow, 2 moderate and 3 brisk. The pace is turned to the SZ
  order (written as codes), so that the same number means the same pace in
  the two cohorts. As stored it went the wrong way: its rank correlation
  with age was +0.13 and with the days of vigorous activity -0.18, and it
  is -0.13 and +0.18 once turned (older patients walk more slowly, active
  ones more briskly). 347 cells change: every 1 and every 3.

  Hours above 24. The time spent sitting on a weekday is above 24 hours on 75
  visits and on a weekend day on 28 (25 to 99: probably the hours of the whole
  week; 60 of the 75 are multiples of 5), the walking time on 4 and the
  moderate activity on 1: out_of_range, not delivered. The question to the
  centres is O21 (M79).

defaults: {type: number, winsor: false}

variables:
  vigorous_days: {column: qiap01a, type: item, label: Days of vigorous physical activity in the last 7 days, range: [0, 7]}
  vigorous_hours: {column: qiap01bh, shown_if: {vigorous_days: [1, 2, 3, 4, 5, 6, 7]}, label: "Vigorous activity on such a day: the hours typed", range: [0, 24]}
  vigorous_minutes: {column: qiap01bm, shown_if: {vigorous_days: [1, 2, 3, 4, 5, 6, 7]}, label: "Vigorous activity on such a day: the minutes typed", range: [0, 1440]}
  moderate_days: {column: qiap02a, type: item, label: Days of moderate physical activity in the last 7 days, range: [0, 7]}
  moderate_hours: {column: qiap02bh, shown_if: {moderate_days: [1, 2, 3, 4, 5, 6, 7]}, label: "Moderate activity on such a day: the hours typed", range: [0, 24]}
  moderate_minutes: {column: qiap02bm, shown_if: {moderate_days: [1, 2, 3, 4, 5, 6, 7]}, label: "Moderate activity on such a day: the minutes typed", range: [0, 1440]}
  walking_days: {column: qiap03a, type: item, label: Days with a walk of ten minutes or more in the last 7 days, range: [0, 7]}
  walking_hours: {column: qiap03bh, shown_if: {walking_days: [1, 2, 3, 4, 5, 6, 7]}, label: "Walking on such a day: the hours typed", range: [0, 24]}
  walking_minutes: {column: qiap03bm, shown_if: {walking_days: [1, 2, 3, 4, 5, 6, 7]}, label: "Walking on such a day: the minutes typed", range: [0, 1440]}
  walking_pace: {column: qiap03c, type: item, shown_if: {walking_days: [1, 2, 3, 4, 5, 6, 7]}, codes: {"1": 3, "3": 1}, label: "Usual walking pace (1 slow, 2 moderate, 3 brisk; the DR form stores 1 brisk, 3 slow)", range: [1, 3]}
  sitting_weekday_hours: {column: qiap04ah, label: "Time spent sitting on a weekday: the hours typed", range: [0, 24]}
  sitting_weekday_minutes: {column: qiap04am, label: "Time spent sitting on a weekday: the minutes typed", range: [0, 1440]}
  sitting_weekend_hours: {column: qiap04bh, label: "Time spent sitting on a weekend day: the hours typed", range: [0, 24]}
  sitting_weekend_minutes: {column: qiap04bm, label: "Time spent sitting on a weekend day: the minutes typed", range: [0, 1440]}
