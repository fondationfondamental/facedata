instrument: alimentaire
title: Food frequency questionnaire
tab: AUTO-QUESTIONNAIRES
section: ALIMENTAIRE
status: draft
notes: >
  Food frequency questionnaire: 23 questions (question 9 has two parts) on
  how much of each food the patient takes per day, per week or per month.
  Not in BP or SZ. Filled at inclusion and at the visits of 1, 2 and 4
  years: 868 visits, 74% to 86% of the inclusions in every period. The
  break of 2018 does not touch it.

  Each answer is a class of quantity, numbered from 0. The classes are
  those of the dictionary and differ from one question to the other (for
  bread: 0 none, 1 for 30 g, up to 7 for 150 g or more; for wine: glasses,
  then bottles); the number of classes gives the range of each variable.
  The classes are delivered as stored: they are not quantities, and no
  score is computed. No cell is outside its classes.

defaults: {type: item}

