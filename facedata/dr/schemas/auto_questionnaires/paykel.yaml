instrument: paykel
title: Paykel list of life events (64 events, past 12 months, interviewer-rated)
tab: AUTO-QUESTIONNAIRES
section: LISTE PAYKEL Liste de 61 evènements de vie
status: reviewed
notes: >
  Paykel list of life events (form 166). Not in BP or SZ. Interview of the
  last 12 months: the form asks, for each event, whether it happened in the
  year before the visit (a), the month it started (b), how independent of the
  illness it was (c, 1 almost entirely independent to 5 almost entirely
  dependent) and its objective negative impact (d, 1 severe to 5 none); the
  two ratings are the interviewer's (the form carries the instructions of the
  rater). Each visit asks about the year before it, so the answers of two
  visits do not add up; whether the interval since the previous visit was
  meant at the visits of 2 and 4 years is a question for the data managers
  (O34, M78). Filled at inclusion and at the visits of 1, 2 and 4 years: 581
  visits. 81% and 76% of the inclusions of 2012 to 2017 hold it, 19% to 34%
  since: the form is in none of the lists of the simplified visit (the break
  of 2018, D55, open question O1).

  64 events, not 61. The dictionary announces 61 events and lists the
  columns of events 10 to 64; the extraction also holds events 1 to 9. The
  wording is in the form, not in the dictionary: the variable names stay
  numbered and each label gives a short English version of the title (63
  numbered titles, and a 64th for any other event of primary importance
  that fits no earlier category). Events 47 and 48 have the same title, a
  marriage of a child, with and without consent; events 31 to 33 are the
  three moves of house (the form prints the three places and an instruction
  on moves, no heading).

  "Happened" is stored 1 for yes and 2 for no; it is delivered 1 and 0. The
  three details are filled only after a yes: of the 976 events answered
  yes, 898 have a month, 835 an independence and 846 an impact.

  Month of onset. Typed on two digits and printed "from 01 to 12". Of the
  898 months, 894 are from 1 to 12: they peak at 1, 6 and 12 (135, 114 and
  89), as round numbers of months before the visit would and calendar
  months would not. Whether the month is a calendar month or a number of
  months before the visit is not told (O34, M78). The four others (13, 17, 20
  and one above 24) are out of the range.

  Out of the scale. The independence holds 0 on 13 cells and the impact on
  18, 11 other cells hold a value above 5, and four months are above 12: 46
  cells, out_of_range, not delivered. Nothing says what 0 means here.

  The number of events answered yes (paykel_events, 0 to 64) needs the 64
  answers: 530 visits, median 1.

defaults: {type: item}

