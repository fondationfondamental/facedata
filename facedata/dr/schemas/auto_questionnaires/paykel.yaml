instrument: paykel
title: Paykel list of life events
tab: AUTO-QUESTIONNAIRES
section: LISTE PAYKEL Liste de 61 evènements de vie
status: draft
notes: >
  Paykel list of life events. Not in BP or SZ. For each event: whether it
  happened (a), the month it started (b), how independent of the illness
  it was (c, 1 almost entirely independent to 5 almost entirely dependent)
  and its objective negative impact (d, 1 severe to 5 none). Filled at
  inclusion and at the visits of 1, 2 and 4 years: 581 visits. 81% and 76%
  of the inclusions of 2012 to 2017 hold it, 19% to 34% since (the break
  of 2018, open question O1).

  64 events, not 61. The dictionary announces 61 events and lists the
  columns of events 10 to 64; the extraction also holds events 1 to 9. The
  wording of the events is not in the dictionary, so the variables are
  numbered (open question O20).

  "Happened" is stored 1 for yes and 2 for no; it is delivered 1 and 0.
  The three details are filled only after a yes: of the 976 events
  answered yes, 898 have a month, 835 an independence and 846 an impact.

  Out of the scale. The independence holds 0 on 13 cells and the impact on
  18, 11 other cells hold a value above 5, and one month is above 24: 43
  cells, out_of_range, not delivered. Nothing says what 0 means here.

  The number of events answered yes (paykel_events, 0 to 64) needs the 64
  answers: 530 visits, median 1.

defaults: {type: item}

