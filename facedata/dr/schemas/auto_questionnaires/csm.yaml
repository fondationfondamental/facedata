instrument: csm
title: Composite Scale of Morningness (CSM, 13 items)
tab: AUTO-QUESTIONNAIRES
section: CSM
status: reviewed
notes: >
  The BP schema as it is: the Composite Scale of Morningness, thirteen
  items, total 13 to 55 (higher is more of a morning person). Filled at
  inclusion and at the visits of 1, 2 and 4 years: 727 visits. The stored
  total (csm_) equals ours on the 718 visits where the thirteen items are
  filled.

  The break of 2018 (open question O1, answered by the application). 94% and
  89% of the inclusion visits of 2012 to 2014 and of 2015 to 2017 hold the
  scale, 44% to 47% in 2018 to 2020, 2021 to 2023 and 2024 to 2026. The CSM
  (form 143) is one of the forms that the simplified visit leaves out
  (visite.SVUPDES = 1, config/globale2.php, DESTVISIMP; PROGRESS.md D55): an
  empty scale after 2018 is "not asked" on a simplified visit, not "no". The
  extraction does not say which visits were simplified (request R127 and R155:
  the svupdes column; question M69).

  Bands. The script of the form holds the bands of the score (evening type
  up to 30, intermediate 31 to 45, morning type 46 or more); no band is
  stored or delivered, and the published bands are to verify.

defaults: {type: item, range: [1, 4]}

