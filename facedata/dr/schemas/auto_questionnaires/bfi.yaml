scores:
  bfi_extraversion:
    label: "BFI extraversion: mean of 8 items (1 to 5)"
    mean: [bfi01, bfi06, bfi11, bfi16, bfi21, bfi26, bfi31, bfi36]
    reverse: [bfi06, bfi21, bfi31]
    compare: bfi_extraversion_stored
    compare_tolerance: 0.006
  bfi_agreeableness:
    label: "BFI agreeableness: mean of 10 items (1 to 5)"
    mean: [bfi02, bfi07, bfi12, bfi17, bfi22, bfi27, bfi32, bfi37, bfi42, bfi45]
    reverse: [bfi02, bfi12, bfi27, bfi37, bfi45]
    compare: bfi_agreeableness_stored
    compare_tolerance: 0.006
  bfi_conscientiousness:
    label: "BFI conscientiousness: mean of 9 items (1 to 5)"
    mean: [bfi03, bfi08, bfi13, bfi18, bfi23, bfi28, bfi33, bfi38, bfi43]
    reverse: [bfi08, bfi18, bfi23, bfi43]
    compare: bfi_conscientiousness_stored
    compare_tolerance: 0.006
  bfi_neuroticism:
    label: "BFI neuroticism: mean of 8 items (1 to 5)"
    mean: [bfi04, bfi09, bfi14, bfi19, bfi24, bfi29, bfi34, bfi39]
    reverse: [bfi09, bfi24, bfi34]
    compare: bfi_neuroticism_stored
    compare_tolerance: 0.006
  bfi_openness:
    label: "BFI openness: mean of 10 items (1 to 5)"
    mean: [bfi05, bfi10, bfi15, bfi20, bfi25, bfi30, bfi35, bfi40, bfi41, bfi44]
    reverse: [bfi35, bfi41]
    compare: bfi_openness_stored
    compare_tolerance: 0.006
