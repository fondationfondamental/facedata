instrument: bfi
title: Big Five Inventory, French version (BFI-Fr)
tab: AUTO-QUESTIONNAIRES
section: BFI
status: draft
notes: >
  Big Five Inventory, French version: 45 statements, each 1 (strongly
  disagree) to 5 (strongly agree). Not in BP or SZ. Filled at inclusion
  and at the visits of 2 and 4 years: 551 visits.

  Items: stored as points. Some statements describe the opposite pole of
  their dimension and are reversed in the published key. Here every item
  rises with the other items of its dimension (Cronbach's alpha 0.69 to
  0.83 with no item reversed), so the stored values are the points, already
  reversed. No item is reversed here.

  Scores. Five means of items (1 to 5): extraversion (8 items),
  agreeableness (10), conscientiousness (9), neuroticism (8) and openness
  (10). The stored means (bfi_extr, bfi_agre, bfi_cons, bfi_emo, bfi_ouve)
  are written with two decimals and equal ours on every visit for
  extraversion, agreeableness and openness (544 or 545 visits).

  Conscientiousness and neuroticism are swapped on 16 visits. On 16 visits
  of 16 patients, from 2014 to 2018, in four centres, the stored
  conscientiousness is the mean of the neuroticism items, and the stored
  neuroticism is the mean of the conscientiousness items, cut after two
  decimals instead of rounded. On the 507 other visits the two stored
  values equal ours. Ours are delivered; the 32 values carry
  score_mismatch. Open question O19.

  Direction. Neuroticism rises with depression (r = 0.49 with the QIDS);
  the four other dimensions fall.

  The break of 2018 (open question O1). 95% and 88% of the inclusion visits of
  2012 to 2014 and of 2015 to 2017 hold the scale, 43% to 51% in the three
  periods since 2018. It is the same fall in about a dozen
  self-questionnaires, in most centres, and nobody knows its reason: an
  empty scale after 2018 is missing data, not a scale that was not asked.

