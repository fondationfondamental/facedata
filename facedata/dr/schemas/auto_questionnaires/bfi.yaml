instrument: bfi
title: Big Five Inventory, French version (BFI-Fr)
tab: AUTO-QUESTIONNAIRES
section: BFI
status: reviewed
notes: >
  Big Five Inventory, French version: 45 statements, each 1 (strongly
  disagree) to 5 (strongly agree). Not in BP or SZ. Filled at inclusion
  and at the visits of 2 and 4 years: 551 visits.

  Items: read back to the answer as asked. The published key reverses 17
  statements, those that describe the opposite pole of their dimension: 2, 6,
  8, 9, 12, 18, 21, 23, 24, 27, 31, 34, 35, 37, 41, 43 and 45. This form (214)
  stores these 17 already reversed, and its script adds every item as stored:
  on the values as stored every item rises with the other items of its
  dimension (Cronbach's alpha 0.69 to 0.83 with no item reversed). They are
  read back to the answer as asked (6 - value, written as codes), so that
  every item is 1 strongly disagree to 5 strongly agree, and the key is in the
  scores (reverse), as for the other scales that are stored as asked. The
  older form 135, before 214, keyed item 29 from 5 to 1 where form 214 keys it
  1 to 5 (found in two centres, on visits dated 2014 or earlier); which visits
  used it is not known, so item 29 is delivered as stored (A82, M75).

  Scores. Five means of items (1 to 5): extraversion (8 items),
  agreeableness (10), conscientiousness (9), neuroticism (8) and openness
  (10). The stored means (bfi_extr, bfi_agre, bfi_cons, bfi_emo, bfi_ouve)
  are written with two decimals and equal ours on every visit for
  extraversion, agreeableness and openness (544 or 545 visits).

  Conscientiousness and neuroticism are swapped on 16 visits. On 16 visits
  of 16 patients, from 2014 to 2018, in four centres, the stored
  conscientiousness is the mean of the neuroticism items, and the stored
  neuroticism is the mean of the conscientiousness items, cut after two
  decimals instead of rounded. On the 507 other visits the two stored
  values equal ours. Ours are delivered; the 32 values carry
  score_mismatch. Open question O19.

  Direction. Neuroticism rises with depression (r = 0.49 with the QIDS);
  the four other dimensions fall.

  The break of 2018 (open question O1, answered by the application). 95% and
  88% of the inclusion visits of 2012 to 2014 and of 2015 to 2017 hold the
  scale, 44% to 51% in 2018 to 2020, 2021 to 2022 and 2023 to 2026. The BFI
  (form 214) is one of the forms that the simplified visit leaves out
  (visite.SVUPDES = 1, config/globale2.php, DESTVISIMP; PROGRESS.md D55): an
  empty scale after 2018 is "not asked" on a simplified visit, not "no". The
  extraction does not say which visits were simplified (request R127 and R155:
  the svupdes column; question M69).

