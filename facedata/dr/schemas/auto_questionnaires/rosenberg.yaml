instrument: rosenberg
title: Rosenberg self-esteem scale
tab: AUTO-QUESTIONNAIRES
section: ECHELLE DE ROSENBERG
status: reviewed
notes: >
  Rosenberg self-esteem scale (form 134): ten items with four answers (1
  strongly disagree to 4 strongly agree, as asked), about how the patient
  sees himself in general. Not in BP or SZ. Filled at inclusion and at
  every follow-up visit: 947 visits.

  Items: stored as points, read back to the answer as asked. Five items of
  the scale are worded negatively (3, 5, 8, 9 and 10) and are reversed in
  the published key. The form of this cohort stores them already reversed:
  its options for these five items are keyed 1 (strongly agree) to 4
  (strongly disagree), so that every item is stored as points, 1 low
  self-esteem and 4 high. Here every item rises with every other one (the
  45 correlations between two items are between 0.21 and 0.77). The five
  items are read back to the answer as asked (codes 1 to 4, 2 to 3, 3 to 2,
  4 to 1), as for the CTQ and the BIS-10, so that rosenb03 to rosenb10 mean
  the same as the other items of the scale; the total reverses the same
  five items and does not change.

  Total. The sum of the ten items after the reversal of the five negative
  ones (10 to 40, higher is a better self-esteem). The stored total
  (rosenb) equals it on the 946 visits where the ten items are filled. It
  falls when depression rises (r = -0.70 with the QIDS).

  The break of 2018 (open question O1, answered by D55). 95% and 83% of the
  inclusion visits of 2012 to 2014 and of 2015 to 2017 hold the scale, 40%
  to 50% in the three periods since 2018. The form (134) is in none of the
  lists of the simplified visit (its display rule is commented out in the
  application): an empty scale since 2018 is "not asked" on a simplified
  visit, not "no", and it is missing data here, never 0. The extraction has
  no flag that tells a simplified visit from a full one with an empty scale
  (R127, R139, R155).

defaults: {type: item, range: [1, 4]}

variables:
  rosenb01: {label: "Je pense que j'ai autant de valeur que les autres"}
  rosenb02: {label: "Je pense avoir beaucoup de qualités"}
  rosenb03: {label: "Tout compte fait, j'ai tendance à me considérer comme un(e) raté(e) (1 strongly disagree to 4 strongly agree as asked; stored as points here)", codes: {"1": 4, "2": 3, "3": 2, "4": 1}}
  rosenb04: {label: "Je suis aussi capable que la plupart des gens"}
  rosenb05: {label: "Je pense que je n'ai pas grand-chose dont je pourrais être fier(e) (1 strongly disagree to 4 strongly agree as asked; stored as points here)", codes: {"1": 4, "2": 3, "3": 2, "4": 1}}
  rosenb06: {label: "Je me vois de manière positive"}
  rosenb07: {label: "Dans l'ensemble, je suis stisfait(e) de ce que je suis"}
  rosenb08: {label: "Parfois j'ai presque la certitude d'être inutile (1 strongly disagree to 4 strongly agree as asked; stored as points here)", codes: {"1": 4, "2": 3, "3": 2, "4": 1}}
  rosenb09: {label: "J'aimerais pouvoir m'estimer davantage (1 strongly disagree to 4 strongly agree as asked; stored as points here)", codes: {"1": 4, "2": 3, "3": 2, "4": 1}}
  rosenb10: {label: "Parfois, je pense que je ne suis bon(ne) à rien (1 strongly disagree to 4 strongly agree as asked; stored as points here)", codes: {"1": 4, "2": 3, "3": 2, "4": 1}}
  rosenberg_total_stored: {column: rosenb, label: Rosenberg score as stored, range: [10, 40], keep: false}

scores:
  rosenberg_total:
    label: "Rosenberg self-esteem score (10 to 40)"
    sum: [rosenb01, rosenb02, rosenb03, rosenb04, rosenb05, rosenb06, rosenb07, rosenb08, rosenb09, rosenb10]
    reverse: [rosenb03, rosenb05, rosenb08, rosenb09, rosenb10]
    range: [10, 40]
    compare: rosenberg_total_stored
