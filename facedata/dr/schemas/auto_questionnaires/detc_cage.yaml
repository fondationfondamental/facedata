instrument: detc_cage
title: DETC-CAGE cannabis
tab: AUTO-QUESTIONNAIRES
section: DETC CAGE CANNABIS
status: reviewed
notes: >
  DETC-CAGE for cannabis: four yes/no questions (need to cut down, remarks
  of the family, feeling of smoking too much, cannabis in the morning). Not
  in BP or SZ. Filled on 100 visits of 95 patients, nearly all inclusions:
  45% of the inclusions of 2012 to 2014, 19% in 2015 to 2017, 2% to 5%
  since.

  The number of yes (0 to 4) is computed; the extraction stores none. The
  median is 0: most of the patients who fill it answer no four times.

  The fall (45%, 19%, then 2% to 5%) follows a change of form, not of the
  patients. The nurse's record (form 112) shows the four items only after a
  yes to "Consommez-vous du cannabis ?" (DCCAN, instrument cannabis of the
  SUBSTANCES tab). 79 of the 100 visits that hold the items have this question
  empty: 78 are dated 2012 to 2015 and one 2016, and 78 of the 79 have a total
  of 0. The 21 others are under a yes (21 of the 24 yes) and none is under a
  no (0 of 558). The forms 103 and 119, other versions of the nurse's record,
  hold the four items and no opening question: if they are the source of the
  79 (question O31), the total of 2012 to 2015 covers everybody who filled
  that form, and a 0 is mostly a patient who does not use cannabis, whereas
  the total since 2016 covers only the patients who use it now. The two are
  not comparable. A value under an empty question is kept as recorded (R2),
  not turned into missing. Whether the scale is still part of the protocol is
  asked in O21.

defaults: {type: item, range: [0, 1]}

variables:
  detc_cage1: {column: dcc1, label: "Avez-vous déjà ressenti le besoin de diminuer votre consommation de cannabis ?"}
  detc_cage2: {column: dcc2, label: "Votre entourage vous a-t-il déjà fait des remarques au sujet de votre consommation ?"}
  detc_cage3: {column: dcc3, label: "Avez-vous déjà eu l’impression que vous fumiez trop de cannabis ?"}
  detc_cage4: {column: dcc4, label: "Avez-vous déjà eu besoin de fumer du cannabis dès le matin pour vous sentir en forme ?"}

scores:
  detc_cage_total:
    label: "DETC-CAGE cannabis: number of yes (0 to 4)"
    sum: [detc_cage1, detc_cage2, detc_cage3, detc_cage4]
