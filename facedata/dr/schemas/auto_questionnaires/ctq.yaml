instrument: ctq
title: Childhood Trauma Questionnaire, short form (CTQ, 28 items)
tab: AUTO-QUESTIONNAIRES
section: CTQ
status: reviewed
notes: >
  The BP scale, with seven items turned back to the answer as asked, and
  without the five severity classes. Childhood Trauma Questionnaire, 28
  items about childhood and adolescence, coded 1 (never true) to 5 (very
  often true), filled once, at inclusion: 528 patients (95% of the
  inclusions of 2012 to 2014, 69% of those of 2021 to 2023, 79% since). The
  form (167) is on the list of the simplified visit of the inclusion, so
  the break of 2018 does not touch it.

  Seven items are stored reversed here. Items 2, 5, 7, 13, 19, 26 and 28
  describe a good childhood, and the key reverses them (6 - value). The
  form of this cohort keys the answers of these seven items 5 (never true)
  to 1 (very often true) and the 21 others 1 to 5, so its own script
  (167_score.js) adds the 28 values as they are and gets the right
  sub-scores. In BP the seven items are stored as asked: each falls when
  the fifteen abuse items rise (r = -0.30 to -0.57). In this extraction
  each rises with them (+0.17 to +0.56), and their means are far from BP
  (item 2: 2.1 against 4.0; between 1.8 and 2.3 in every period and between
  1.6 and 2.5 in every centre). Items 16 and 22 of the denial scale, which
  nobody reverses, fall with abuse in both cohorts (r = -0.5 to -0.6). So
  the form of this cohort stores the seven items already reversed. They are
  read back to the answer as asked (6 - value, written as codes), so that
  ctq01 to ctq28 mean the same in the two cohorts and the BP key applies.
  After this the item means of the two cohorts agree (r = 0.99 over the 28
  items, 0.76 before). Each item label gives its sub-score, its direction
  and the time frame; the wording of the items is not copied.

  Scores. Five sub-scores of five items (5 to 25): emotional abuse (items
  3, 8, 14, 18, 25), physical abuse (9, 11, 12, 15, 17), sexual abuse (20,
  21, 23, 24, 27), emotional neglect (5, 7, 13, 19, 28) and physical
  neglect (1, 2, 4, 6, 26); the total is their sum (25 to 125).

  Stored neglect scores and stored total: wrong, not delivered. The cause
  is the export, not the EMR: the score definition of the export (nucleus
  ctq.yaml, lines 71 to 126) names the table of this cohort with the BP
  list of reversed items, which is made for answers stored as asked, and
  reverses the seven items a second time. So the stored emotional neglect
  is in fact a score of good childhood: it falls when emotional abuse rises
  (r = -0.61; +0.67 in BP), and its mean is 16.7 where ours is 13.3 (12.4
  in BP). The three stored values (ctq31, ctq33, ctq39) are reproduced
  exactly by adding the items with none reversed: the twin scores named
  _as_stored, read to check the stored values and not delivered (no
  mismatch on 521, 523 and 517 visits). The delivered emotional neglect
  rises with emotional abuse (+0.61); the delivered means are close to BP
  (physical neglect 7.5 against 7.3, total 44.1 against 43.8). The three
  stored abuse scores have no reversed item and equal ours (522 to 525
  visits). Open question O17 (request R146).

  Denial. The number of items 10, 16 and 22 answered 5 (0 to 3), computed here
  from the three items, all three being needed (522 visits). The stored score
  (ctq40) is written by the script of the form, which counts an unanswered
  item as 0 (167_score.js, eval_deni): it exists on 430 visits, equals the
  count on the 429 where the three items are filled, exists on one visit with
  only two items answered (not delivered: the score cannot be recomputed
  there) and is empty on 93 visits that have the three items, most of them
  from 2020 (the script of the form: A73). The stored score is kept as the
  check (ctq_denial_stored).

  Not in this extraction: the five columns of BP that hold the severity
  class of each sub-score (ctq30 to ctq38, even numbers). They are not
  recomputed here: the classes need the limits of the manual, a copyrighted
  table that the package does not hold.

defaults: {type: item, range: [1, 5]}

variables:
  ctq01: {label: "CTQ item 1, physical neglect; 1 never true to 5 very often true; during childhood and adolescence"}
  ctq02: {label: "CTQ item 2, physical neglect: worded as a good childhood, reversed in the score; 1 never true to 5 very often true, as asked; during childhood and adolescence", codes: {"1": 5, "2": 4, "4": 2, "5": 1}}
  ctq03: {label: "CTQ item 3, emotional abuse; 1 never true to 5 very often true; during childhood and adolescence"}
  ctq04: {label: "CTQ item 4, physical neglect; 1 never true to 5 very often true; during childhood and adolescence"}
  ctq05: {label: "CTQ item 5, emotional neglect: worded as a good childhood, reversed in the score; 1 never true to 5 very often true, as asked; during childhood and adolescence", codes: {"1": 5, "2": 4, "4": 2, "5": 1}}
  ctq06: {label: "CTQ item 6, physical neglect; 1 never true to 5 very often true; during childhood and adolescence"}
  ctq07: {label: "CTQ item 7, emotional neglect: worded as a good childhood, reversed in the score; 1 never true to 5 very often true, as asked; during childhood and adolescence", codes: {"1": 5, "2": 4, "4": 2, "5": 1}}
  ctq08: {label: "CTQ item 8, emotional abuse; 1 never true to 5 very often true; during childhood and adolescence"}
  ctq09: {label: "CTQ item 9, physical abuse; 1 never true to 5 very often true; during childhood and adolescence"}
  ctq10: {label: "CTQ item 10, denial; 1 never true to 5 very often true; during childhood and adolescence"}
  ctq11: {label: "CTQ item 11, physical abuse; 1 never true to 5 very often true; during childhood and adolescence"}
  ctq12: {label: "CTQ item 12, physical abuse; 1 never true to 5 very often true; during childhood and adolescence"}
  ctq13: {label: "CTQ item 13, emotional neglect: worded as a good childhood, reversed in the score; 1 never true to 5 very often true, as asked; during childhood and adolescence", codes: {"1": 5, "2": 4, "4": 2, "5": 1}}
  ctq14: {label: "CTQ item 14, emotional abuse; 1 never true to 5 very often true; during childhood and adolescence"}
  ctq15: {label: "CTQ item 15, physical abuse; 1 never true to 5 very often true; during childhood and adolescence"}
  ctq16: {label: "CTQ item 16, denial; 1 never true to 5 very often true; during childhood and adolescence"}
  ctq17: {label: "CTQ item 17, physical abuse; 1 never true to 5 very often true; during childhood and adolescence"}
  ctq18: {label: "CTQ item 18, emotional abuse; 1 never true to 5 very often true; during childhood and adolescence"}
  ctq19: {label: "CTQ item 19, emotional neglect: worded as a good childhood, reversed in the score; 1 never true to 5 very often true, as asked; during childhood and adolescence", codes: {"1": 5, "2": 4, "4": 2, "5": 1}}
  ctq20: {label: "CTQ item 20, sexual abuse; 1 never true to 5 very often true; during childhood and adolescence"}
  ctq21: {label: "CTQ item 21, sexual abuse; 1 never true to 5 very often true; during childhood and adolescence"}
  ctq22: {label: "CTQ item 22, denial; 1 never true to 5 very often true; during childhood and adolescence"}
  ctq23: {label: "CTQ item 23, sexual abuse; 1 never true to 5 very often true; during childhood and adolescence"}
  ctq24: {label: "CTQ item 24, sexual abuse; 1 never true to 5 very often true; during childhood and adolescence"}
  ctq25: {label: "CTQ item 25, emotional abuse; 1 never true to 5 very often true; during childhood and adolescence"}
  ctq26: {label: "CTQ item 26, physical neglect: worded as a good childhood, reversed in the score; 1 never true to 5 very often true, as asked; during childhood and adolescence", codes: {"1": 5, "2": 4, "4": 2, "5": 1}}
  ctq27: {label: "CTQ item 27, sexual abuse; 1 never true to 5 very often true; during childhood and adolescence"}
  ctq28: {label: "CTQ item 28, emotional neglect: worded as a good childhood, reversed in the score; 1 never true to 5 very often true, as asked; during childhood and adolescence", codes: {"1": 5, "2": 4, "4": 2, "5": 1}}

  # Sub-scores and total as stored. Used only to check our own scores.
  ctq_emotional_abuse_stored: {column: ctq37, label: Emotional abuse as stored, range: [5, 25], keep: false}
  ctq_physical_abuse_stored: {column: ctq29, label: Physical abuse as stored, range: [5, 25], keep: false}
  ctq_sexual_abuse_stored: {column: ctq35, label: Sexual abuse as stored, range: [5, 25], keep: false}
  ctq_emotional_neglect_stored: {column: ctq31, label: Emotional neglect as stored, range: [5, 25], keep: false}
  ctq_physical_neglect_stored: {column: ctq33, label: Physical neglect as stored, range: [5, 25], keep: false}
  ctq_total_stored: {column: ctq39, label: CTQ total as stored, range: [25, 125], keep: false}

  # Computed by the form's script from items 10, 16 and 22 (not from the sub-scores). Used only to check our own score.
  ctq_denial_stored: {column: ctq40, label: "Denial score as stored", range: [0, 3], keep: false}

scores:
  ctq_emotional_abuse:
    label: "CTQ emotional abuse"
    sum: [ctq03, ctq08, ctq14, ctq18, ctq25]
    compare: ctq_emotional_abuse_stored
  ctq_physical_abuse:
    label: "CTQ physical abuse"
    sum: [ctq09, ctq11, ctq12, ctq15, ctq17]
    compare: ctq_physical_abuse_stored
  ctq_sexual_abuse:
    label: "CTQ sexual abuse"
    sum: [ctq20, ctq21, ctq23, ctq24, ctq27]
    compare: ctq_sexual_abuse_stored
  ctq_emotional_neglect:
    label: "CTQ emotional neglect"
    sum: [ctq05, ctq07, ctq13, ctq19, ctq28]
    reverse: [ctq05, ctq07, ctq13, ctq19, ctq28]
  ctq_emotional_neglect_as_stored:
    label: "CTQ emotional neglect, with no item reversed: what the export stores here"
    sum: [ctq05, ctq07, ctq13, ctq19, ctq28]
    compare: ctq_emotional_neglect_stored
    keep: false
  ctq_physical_neglect:
    label: "CTQ physical neglect"
    sum: [ctq01, ctq02, ctq04, ctq06, ctq26]
    reverse: [ctq02, ctq26]
  ctq_physical_neglect_as_stored:
    label: "CTQ physical neglect, with no item reversed: what the export stores here"
    sum: [ctq01, ctq02, ctq04, ctq06, ctq26]
    compare: ctq_physical_neglect_stored
    keep: false
  ctq_total:
    label: "CTQ total (25 items)"
    sum: [ctq01, ctq02, ctq03, ctq04, ctq05, ctq06, ctq07, ctq08, ctq09, ctq11,
          ctq12, ctq13, ctq14, ctq15, ctq17, ctq18, ctq19, ctq20, ctq21, ctq23,
          ctq24, ctq25, ctq26, ctq27, ctq28]
    reverse: [ctq02, ctq05, ctq07, ctq13, ctq19, ctq26, ctq28]
  ctq_total_as_stored:
    label: "CTQ total (25 items), with no item reversed: what the export stores here"
    sum: [ctq01, ctq02, ctq03, ctq04, ctq05, ctq06, ctq07, ctq08, ctq09, ctq11,
          ctq12, ctq13, ctq14, ctq15, ctq17, ctq18, ctq19, ctq20, ctq21, ctq23,
          ctq24, ctq25, ctq26, ctq27, ctq28]
    compare: ctq_total_stored
    keep: false
  ctq_denial:
    label: "CTQ denial (minimization) score: number of the items 10, 16 and 22 answered 5 (0 to 3)"
    sum: [ctq10, ctq16, ctq22]
    points: {"1": 0, "2": 0, "3": 0, "4": 0, "5": 1}
    compare: ctq_denial_stored
