instrument: ecg
title: Electrocardiogram
tab: VITAL SIGN et ECG
section: ECG
status: reviewed
notes: >
  Heart rate, QT and RR intervals and the corrected QT that the EMR stores,
  at the inclusion and follow-up visits (about 1,050 visits). The form asks
  whether an ECG was done (js/formulaires.js, lines 2833 to 2840) and the
  clean model of the export reads it, but the TRD extraction does not carry
  it, nor the boxes "sent to" and "read by the cardiologist" (request R158).

  The form asks for seconds. The QT was typed in milliseconds or centiseconds
  on 87 visits and the RR in milliseconds on 61, most of them from 2012 to
  2016 and two thirds in one centre: they are converted (unit_inferred).
  Impossible values are removed (out_of_range): 24 heart rates, 12 QT, 38 RR
  and 15 stored QTc, among them heart rates of 1 and RR intervals of 0;
  one recomputed QTc is out of range too. The
  help text of the RR field says to divide the heart rate by 60, the inverse
  of the right 60 / rate (A84): the typed RR equals the heart rate divided
  by 60 on 51 of the 1,013 visits with both, 0% to 7% of the visits of each
  centre with 20 visits or more but 38% in one centre (10 of 26).

  The corrected QT is recomputed with Bazett's formula on the harmonised QT
  and the heart rate of the ECG (RR = 60 / rate), and on the typed RR only
  where there is no heart rate, as in BP (BP decision D114): in BP the RR
  typed in two centres does not fit the heart rate. Here the two agree
  within 10% on 90% of the visits and differ by more than 30% on 28, which
  get check_failed on the RR. The QTc is computed on 1,009 visits and
  differs from the stored one by more than 0.03 s on 70 (score_mismatch).
  The stored QTc is Bazett's formula on the typed QT and RR: on the numbers
  as typed it agrees within 1.5% on 520 of the 522 visits from 2017 (within
  0.006 s on 502 once the units are harmonised), against 295 of the 435
  visits until 2016 (329 within 0.006 s). The 106 visits of 2012 to 2016
  that do not fit are a median 3% below Bazett; no formula fits them
  (Fridericia and Framingham fit worse in both periods; question M82).

  Centres (2026-11-20). One centre has a faster heart rate on 89 ECGs
  (median 82 against 72 in the cohort) and a shorter RR (0.73 s against
  0.84), and also lying and standing (pression_arterielle: 84 and 95
  against 75 and 82): the three measures agree with each other, so this is
  not a unit or a typing step; its cause (patients, treatments, the time of
  the recording) is not known. The centre medians of the heart rate go
  from 64 to 82, of the QT from 0.36 to 0.41 s and of the stored QTc from
  0.40 to 0.44 s (at most 0.6 of an interquartile range); the years show
  no step above 0.3 of an interquartile range.

  Same instrument as in FACE BP, without the question "ECG done".

defaults: {type: number, unit: s, missing: {0: not_recorded}}

variables:
  ecg_heart_rate: {column: eghrmn, label: Heart rate on the ECG (beats per minute), unit: bpm, range: [30, 220]}
  qt_interval:
    column: qt
    label: QT interval
    units:
      s: {factor: 1, expect: [0.2, 0.7]}
      cs: {factor: 0.01, expect: [20, 70]}
      ms: {factor: 0.001, expect: [200, 700]}
    range: [0.2, 0.7]
  rr_interval:
    column: rr
    label: RR interval
    units:
      s: {factor: 1, expect: [0.3, 2.0]}
      ms: {factor: 0.001, expect: [300, 2000]}
    range: [0.3, 2.0]
  qtc_stored:
    column: qtc
    label: Corrected QT interval as stored by the EMR
    units:
      s: {factor: 1, expect: [0.2, 0.7]}
      cs: {factor: 0.01, expect: [20, 70]}
      ms: {factor: 0.001, expect: [200, 700]}
    range: [0.2, 0.7]

scores:
  qtc_bazett:
    label: "Corrected QT interval (Bazett), from the QT and the heart rate of the ECG, or the RR where there is no rate"
    custom: corrected_qt
    compare: qtc_stored
    compare_tolerance: 0.03
    range: [0.2, 0.7]
    winsor: [0.01, 0.99]

checks:
  rr_interval: rr_differs_from_rate
