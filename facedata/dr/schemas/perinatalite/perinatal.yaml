instrument: perinatal
title: "Birth and perinatal history"
tab: PERINATALITE
section: PERINATALITE
status: reviewed
level: patient
notes: >
  The BP schema with the codes of this extraction. Asked once, at
  inclusion: the form of the history (164) is shown at the inclusion visit
  only (visit type 2, config/global.php): 532 patients.

  Codes, from the form (164.php): the term is 1 preterm, 2 at term, 3
  post-term, 0 "Ne sais pas"; the type of birth is 1 vaginal, 2 caesarean,
  0 "ne sais pas"; the neonatal hospitalisation is 1 yes, 0 no, 2 "Ne sais
  pas" (84%, 4% and 12% of the answers for no, yes and "not known"; 87%, 8%
  and 6% in BP). "Not known" is a missing code (45, 51 and 63 cells). A 0
  in a measure (ages of the parents, weight, length, head circumference,
  gestational age, Apgar scores) is "not recorded", as in BP (8 gestational
  ages). The weight is typed in grams (four digits) and the gestational age
  in weeks (two digits). Out of range: one age of the mother of 86, one
  gestational age of 19 weeks and two birth weights.

  Centres and years (2026-11-20). The term of birth is answered for 58% to
  97% of the patients of each centre but for 8 of the 44 of one centre,
  and for 65% to 86% of the patients of each period from 2013: a fill
  rate, with no known cause.

variables:
  mother_age_at_birth:
    column: agemere
    label: Age of the mother when the patient was born, in years
    type: item
    range: [12, 60]
    missing: {0: not_recorded, 99: unknown}
  father_age_at_birth:
    column: agepere
    label: Age of the father when the patient was born, in years
    type: item
    range: [12, 90]
    missing: {0: not_recorded, 99: unknown}
  birth_term:
    column: prembrth
    label: Term of the birth
    type: category
    codes: {"2": term, "1": preterm, "3": post_term}
    missing: {"0": unknown}
  gestational_age:
    column: gstabrth
    label: Gestational age at birth, in weeks of amenorrhoea
    type: number
    unit: weeks
    units:
      weeks: {factor: 1, expect: [20, 45]}
      months: {factor: 4.345, expect: [5, 10]}
    range: [20, 45]
    missing: {0: not_recorded}
    winsor: false
  birth_type:
    column: naisstyp
    label: Type of birth
    type: category
    codes: {"1": vaginal, "2": caesarean}
    missing: {"0": unknown}
  neonatal_hospitalisation:
    column: honeonat
    label: Was admitted to a neonatal unit
    type: item
    range: [0, 1]
    missing: {"2": unknown}
  birth_weight:
    column: brthwt
    label: Birth weight
    type: number
    unit: g
    range: [400, 6500]
    missing: {0: not_recorded}
    winsor: false
  birth_length:
    column: brthht
    label: Birth length
    type: number
    unit: cm
    range: [25, 60]
    missing: {0: not_recorded}
    winsor: false
  birth_head_circumference:
    column: brthcirc
    label: Head circumference at birth
    type: number
    unit: cm
    range: [20, 42]
    missing: {0: not_recorded}
    winsor: false
  apgar_1min:
    column: apgr0106_1min
    label: Apgar score at 1 minute
    type: item
    range: [1, 10]
    missing: {0: not_recorded}
  apgar_5min:
    column: apgr0106_5min
    label: Apgar score at 5 minutes
    type: item
    range: [1, 10]
    missing: {0: not_recorded}
