instrument: visit_record
title: Visit record
tab: PATIENT
section: ID_VISIT
status: draft
notes: >
  One value per visit. The visit label, its date and the identifiers of this
  dictionary section are key columns, built by the pipeline for every
  instrument. What is left is the date at which the visit record was typed.

  It is the visit date itself for 1,183 of the 2,193 visits. It is before the
  visit date for 263 visits and a year or more after it for 303: it says when
  the form was created, not when the patient came.

  Same instrument as in FACE BP and FACE SZ.

variables:
  entry_date:
    column: date_saisie
    label: Date the visit record was entered
    type: date
    range: [2008-01-01, 2030-12-31]
