instrument: identite
title: Patient identity
tab: PATIENT
section: PATIENT
status: draft
level: patient
notes: >
  One value per patient. The extraction repeats these columns on every visit
  row, and they never change between the visits of a patient.

  Same instrument as in FACE BP and FACE SZ, with the diagnosis of this
  cohort: "Trouble dépressif majeur" on every row.

  The date of birth is exported with the day set to the 15th, as in the other
  cohorts, except for 88 patients of two centres, included from 2014 on, who
  keep another day. Their day is set to the 15th here (day: 15) and the cell
  is flagged date_partial, so that the three cohorts hold the same thing
  (open question O3 in PROGRESS.md).

  The column age, which the dictionary calls "age at inclusion", is not the
  age at inclusion. It equals the age at the inclusion visit for the patients
  who have that visit only (271 of 284; one year less for the 13 others), and
  it is one to five years more for 164 of the 350 patients who came back:
  it was computed at a later date. age_at_inclusion is therefore computed
  from the date of birth and the date of the inclusion visit (decision D4);
  the stored age is read to be compared with it and is not delivered. With a
  tolerance of one year it differs for 71 patients (score_mismatch).

  fondacode (the column subjid) is the patient code of the foundation, the
  same in every extraction and unique across the cohorts: no fondacode of
  FACE DR is in FACE BP or FACE SZ, while 199 usubjid are also BP numbers and
  209 SZ numbers, for other patients. It is a text and never appears in the
  report.

  usubjid and siteid are key columns. Not loaded: armcd, the code 7 on every
  row (ignored.yaml).

variables:
  fondacode:
    column: subjid
    label: Patient code of the foundation, the same in every extraction and unique across the cohorts
    type: text
  sex:
    label: Sex
    type: category
    codes: {Feminin: female, Masculin: male}
  diagnosis:
    column: arm
    label: Diagnosis of the cohort
    type: category
    codes:
      Trouble dépressif majeur: major_depressive_disorder
  birth_date:
    column: brthdtc
    label: Date of birth (the day is the 15th for every patient)
    type: date
    day: 15
    range: [1900-01-01, 2012-12-31]
  age_stored:
    column: age
    label: Age as stored, computed at a date that is not always the inclusion
    type: item
    range: [15, 100]
    keep: false

scores:
  age_at_inclusion:
    custom: age_at_inclusion
    compare: age_stored
    compare_tolerance: 1
    label: Age at the inclusion visit, in years
