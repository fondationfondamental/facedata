instrument: identite
title: Patient identity
tab: PATIENT
section: PATIENT
status: reviewed
level: patient
notes: >
  One value per patient. The extraction repeats these columns on every visit
  row, and they never change between the visits of a patient.

  Same instrument as in FACE BP and FACE SZ, with the diagnosis of this
  cohort: "Trouble dépressif majeur" on every row.

  The date of birth is exported with the day set to the 15th, as in the other
  cohorts, except for 88 patients of two centres, included from 2014 on, who
  keep another day. Their day is set to the 15th here (day: 15) and the cell
  is flagged date_partial, so that the three cohorts hold the same thing
  (open question O3 in PROGRESS.md).

  The column age, which the dictionary calls "age at inclusion", is not the
  age at inclusion: the export computes the calendar age at the date of one
  visit of the patient, taken in no order (face_dr_1_patients.sql, line 32,
  on a join with every visit of the patient, line 47; request R10). It equals
  the age at one of the visits of the patient for all 634 patients, and the
  age at the inclusion visit for 450: for 271 of the 284 patients who never
  came back (one year less for the 13 others, the age at the screening
  visit) and for 179 of the 350 who came back (one to five years more for
  163, one year less for 8). age_at_inclusion is therefore computed from the
  date of birth and the date of the inclusion visit (decision D4); the
  stored age is read to be compared with it and is not delivered. With a
  tolerance of one year it differs for 70 patients (score_mismatch; 71
  before D82). The
  function counts completed calendar years, as the BP, SZ and ASP exports
  store the age: the year of the visit minus the year of birth, one less
  when the birthday has not come yet that year (decision of the user,
  2026-11-21; it counted days / 365.25 before, one year less for 2
  patients). It reads the date of birth as exported (birth_date_stored,
  hidden), with the real day of the 88 patients who keep one.

  fondacode (the column subjid) is the patient code of the foundation, the
  same in every extraction and unique across the cohorts: no fondacode of
  FACE DR is in FACE BP or FACE SZ, while 199 usubjid are also BP numbers and
  209 SZ numbers, for other patients. It is a text and never appears in the
  report.

  usubjid and siteid are key columns. Not loaded: armcd, the code 7 on every
  row (ignored.yaml).

variables:
  fondacode:
    column: subjid
    label: Patient code of the foundation, the same in every extraction and unique across the cohorts
    type: text
  sex:
    label: Sex
    type: category
    codes: {Feminin: female, Masculin: male}
  diagnosis:
    column: arm
    label: Diagnosis of the cohort
    type: category
    codes:
      Trouble dépressif majeur: major_depressive_disorder
  birth_date:
    column: brthdtc
    label: Date of birth (the day is the 15th for every patient)
    type: date
    day: 15
    range: [1900-01-01, 2012-12-31]
  birth_date_stored:
    column: brthdtc
    label: Date of birth as exported (the real day for 88 patients), for the age at inclusion
    type: date
    range: [1900-01-01, 2012-12-31]
    keep: false
  age_stored:
    column: age
    label: Age as stored, computed at a date that is not always the inclusion
    type: item
    range: [15, 100]
    keep: false

scores:
  age_at_inclusion:
    custom: age_at_inclusion
    compare: age_stored
    compare_tolerance: 1
    label: Age at the inclusion visit, in years
