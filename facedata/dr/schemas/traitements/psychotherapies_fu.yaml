instrument: psychotherapies_fu
title: "Psychotherapies since the last visit (follow-up form)"
tab: TRAITEMENTS
section: PTHF
status: draft
notes: >
  At the follow-up visits, since the last visit: 737 visits (77% to 84% of the visits of each kind). A supportive therapy on 241 of 736 visits, a cognitive behavioural therapy on 83.

  The history of psychotherapies (PTHF): for each of fourteen kinds of
  therapy, whether the patient had it, the number of sessions, the dates,
  the expertise of the therapist and the result. Not in BP or SZ.

  Two forms in the same columns: the whole life at the inclusion visit, the
  time since the last visit at follow-up (of the 245 follow-up visits of
  patients who had had a supportive therapy at inclusion, 105 answer no). visit_form says which form a visit uses, and each form has its own
  schema, as in BP.

  The expertise of the therapist and the result are stored as codes (0 to
  5 and 1 to 6) that the dictionary does not explain: they are delivered as
  code_N (open question O28). The number of sessions is 0 after a no
  (asked_if). The result of the behavioural therapy is in a column named
  tcom_result.

version:
  name: visit_form
  column: visit
  codes:
    screening: inclusion
    V0: inclusion
    V6_mois: follow_up
    V1_an: follow_up
    V18_mois: follow_up
    V2_ans: follow_up
    V30_mois: follow_up
    V3_ans: follow_up
    V4_ans: follow_up
    V5_ans: follow_up

defaults: {type: item, range: [0, 1], versions: [follow_up]}

