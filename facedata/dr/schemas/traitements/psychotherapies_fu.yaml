  therapy_supportive_fu_start_date: {column: prstdtc_tsnd, type: date, range: [1950-01-01, 2026-12-31], label: "Supportive or non-directive therapy, asked again at follow-up: start"}
  therapy_supportive_fu_end_date: {column: prendtc_tsnd, type: date, range: [1950-01-01, 2026-12-31], label: "Supportive or non-directive therapy, asked again at follow-up: end"}
  therapy_supportive_fu_therapist: {column: tsnd_et, type: category, codes: {"1": no_specific_qualification, "2": trainee, "3": under_supervision, "4": senior_independent, "5": expert}, missing: {"0": unknown}, label: "Supportive or non-directive therapy, asked again at follow-up: expertise of the therapist"}
