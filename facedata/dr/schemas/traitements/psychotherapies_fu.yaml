instrument: psychotherapies_fu
title: "Psychotherapies, asked again at a follow-up visit (follow-up form)"
tab: TRAITEMENTS
section: PTHF
status: reviewed
notes: >
  The history of psychotherapies (form 155, PTHF) asked again at the
  follow-up visits: 737 visits (77% to 84% of the visits of each kind). A
  supportive therapy on 241 of 736 visits, a cognitive behavioural therapy
  on 83. Another 45 follow-up rows hold only the placeholder dates of the
  form, and no answer.

  The question has no period. Form 155 prints no time frame, at the
  inclusion visit or at follow-up; at follow-up raters read it both ways. An
  answer here is a yearly update (asked again at the follow-up visit), never
  "since the last visit": the suffix is _fu and not since_visit, and the BP
  and SZ questions that carry the same names (cbt_fu, psychodynamic_fu,
  other_therapy_fu) say "since the last visit" (the catalogue notes it). It
  reads the same fourteen kinds as
  psychotherapies_v0.yaml, which gives the codes, the names shared with BP
  and SZ, the two kinds and the reasons for ending that the extraction
  lacks (request R133), and the
  disagreement of the kinds with the question TT_PSYCHO (111 of the 451
  follow-up visits that answer no to it hold a kind yes; 16 of 260 that
  answer yes hold every kind no). Neither reading holds alone, as for
  ECT: not "ever", for 105 of the 245 follow-up visits of patients who had
  had a supportive therapy at inclusion answer no; not "since the last
  visit", for 92 of the 141 supportive therapies with a start date at
  follow-up began more than a year before the visit.

  Two forms in the same columns: the whole life at the inclusion visit, the
  question asked again at follow-up. visit_form says which form a visit
  uses, and each form has its own schema, as in BP.

  The expertise of the therapist and the result are decoded as in
  psychotherapies_v0.yaml (expertise 0 is "not known", missing_code, 36
  cells). The number of sessions is 0 after a no (asked_if). The result of
  the behavioural therapy is in a column named tcom_result.

version:
  name: visit_form
  column: visit
  codes:
    screening: inclusion
    V0: inclusion
    V6_mois: follow_up
    V1_an: follow_up
    V18_mois: follow_up
    V2_ans: follow_up
    V30_mois: follow_up
    V3_ans: follow_up
    V4_ans: follow_up
    V5_ans: follow_up

defaults: {type: item, range: [0, 1], versions: [follow_up]}

