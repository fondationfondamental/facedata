instrument: psychotherapies_v0
title: "History of psychotherapies over the whole life (inclusion form)"
tab: TRAITEMENTS
section: PTHF
status: reviewed
level: patient
notes: >
  The history of psychotherapies (form 155, PTHF) at the inclusion visit,
  over the whole life: 473 visits (58% of the inclusions until 2014, 72% to
  85% since). A supportive therapy for 215 of 471 patients, a cognitive
  behavioural therapy for 80, a psychoanalytic one for 50. A patient form,
  like non_drug_lifetime.yaml (level patient): the answers are in the table
  patients; no patient has the form on both the screening row and the V0
  row (473 rows with an answer, 473 patients). Another 50 inclusion rows
  hold only the 28 dates of the form, all placeholders, and no answer.

  For each of fourteen kinds of therapy the form asks whether the patient had
  it, the number of sessions, the dates, the expertise of the therapist and
  the result. The 14 kinds are radios that are always shown: they are
  answered as a full list on 461 of the 473 visits, so no empty kind is
  read as a no. The number of sessions is 0 after a no (asked_if); the other
  details stay missing after a no. The form has sixteen kinds and a reason for
  ending each therapy: dialectical behavioural therapy (TDIACOM), family
  therapy (TFAMI) and the reason for the end of each therapy (MOT_FIN_THE: 0
  in progress, 1 the patient decided to stop, 2 the therapist recommended to
  stop, 3 joint decision, 4 other) are in form 155 and in the table, not in
  the extraction (request R133).

  The codes are those of the form: expertise of the therapist 0 not known
  (missing_code, 87 cells), 1 no specific qualification, 2 trainee, 3 under
  supervision, 4 senior independent, 5 expert; result 1 no improvement, 2
  minimal, 3 certain, 4 definite, 5 sustained improvement, 6 complete
  remission. The result of the behavioural therapy is in a column named
  tcom_result.

  Names. Three kinds are also asked in BP or SZ and carry their names:
  cognitive behavioural therapy (ever_cbt, cbt_sessions, cbt_start_date,
  cbt_end_date), psychodynamic therapy (ever_psychodynamic; SZ asks it at
  follow-up as psychodynamic_fu) and another therapy (ever_other_therapy,
  other_therapy_name; the BP and SZ question is "another non-drug
  treatment", and the BP free texts hold kinds that DR lists apart). The
  other eleven kinds are DR only. BP's three non-drug therapies (cognitive
  behavioural, psychoeducation groups, interpersonal and social rhythm
  therapy) are specific therapies, not aggregates, so these are not the same
  questions and stay apart: DR interpersonal therapy and BP IPSRT, SZ family
  psychoeducation and BP psychoeducation groups, SZ cognitive remediation
  and DR cognitive therapy, DR "other" and BP "other".

  ever_psychotherapy (TT_PSYCHO, in non_drug_lifetime.yaml) disagrees with
  these kinds: of the 211 inclusion visits that answer no to it and hold
  this form, 85 have at least one kind yes; 12 of the 228 that answer yes
  have every kind no. It is delivered as the stored question, with no
  derived "any psychotherapy".

