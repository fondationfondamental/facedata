instrument: medications_lifetime
title: "Psychotropic treatment of the past, one row per treatment"
tab: TRAITEMENTS
section: PSYCHOTROPE LIFETIME
status: reviewed
level: list
notes: >
  The psychotropic treatment of the past (PSYCHOTROPE LIFETIME), one row
  per treatment in the table treatments, where the column list says
  "medications_lifetime". 406 patients, and one product for 404 of them: the
  file holds a single past treatment per patient in almost every case, which
  the form does not force (a table of rows, shown by patient, with an add
  button and no limit of rows) and the export may cause (one arbitrary row
  per visit is kept, lines 6-8 of face_dr_12_traitements.sql; request R122).
  Most are antidepressants (venlafaxine, fluoxetine, escitalopram,
  clomipramine, mirtazapine).

  The variables keep the names of the BP and SZ lists with one exception:
  substance_name, not medication. The export writes the name of the
  substance of the drug catalogue (nomsubstance): no digit on any of the 408
  rows, a salt in brackets on 12% (49 rows); BP and SZ keep the product as
  typed, with its strength.

  The lists are crossed by the export (request R122), as in medications.yaml
  (which gives the lines of the SQL): the export writes every product of the
  patient next to every prescription line. Only 2 of the 406 patients have
  two products and are affected; the other 404 keep their line. A patient
  with several products keeps one item per product, without form, dose or
  date (list_crossed on these variables, SCHEMA_SPEC section 15). The class
  and catalogue-code columns (cmclas, cmclascd) are lists of another length
  and are not read (ignored.yaml). Six patients have catalogue (CIS) codes
  but no substance row (products with no ATC match).

  The list of a patient is the history of the patient (the form is shown by
  patient), the same on every row of the patient. Dates are written
  day/month/year; 313 treatments have a start and 233 an end. The at-visit
  columns of medications.yaml do not read this list. daily_dose is the daily
  dose in mg as typed (the forms title the field "posologie journalière en
  mg"); units_per_day is derived by the export, as in medications.yaml. No
  treatment ends before it starts (check end_date).

crossed: [psy_lifetime_cmtrt, psy_lifetime_cmdecod, psy_lifetime_cmdose, psy_lifetime_cmdosu]

names:
  column: psy_lifetime_cmdecod
  clean: medication_name
  table: medications.csv
  gives: [molecule, atc, treatment_group]

variables:
  substance_name: {column: psy_lifetime_cmtrt, type: text, label: "Name of the substance, as the drug catalogue writes it (no strength)"}
  generic_name: {column: psy_lifetime_cmdecod, type: text, label: "Generic name, as the drug catalogue writes it"}
  molecule: {column: molecule, type: text, label: Molecule}
  atc: {column: atc, type: text, label: ATC code of the molecule}
  treatment_group:
    column: treatment_group
    label: Group of the medication
    type: category
    codes:
      lithium: lithium
      anticonvulsant: anticonvulsant
      antipsychotic_2g: antipsychotic_2g
      antipsychotic_1g: antipsychotic_1g
      antidepressant: antidepressant
      benzodiazepine: benzodiazepine
      other_anxiolytic_hypnotic: other_anxiolytic_hypnotic
      stimulant: stimulant
      other_nervous_system: other_nervous_system
      non_psychotropic: non_psychotropic
  start_date: {column: psy_lifetime_cmstdtc, type: date, range: [1951-01-01, today+60], missing: {"/": not_recorded}, label: Start of the treatment}
  end_date: {column: psy_lifetime_cmendtc, type: date, range: [1950-01-01, today+60], missing: {"/": not_recorded}, label: End of the treatment}
  strength: {column: psy_lifetime_cmdose, type: text, label: "Strength of one unit, as written"}
  dose_unit: {column: psy_lifetime_cmdosu, type: text, label: "Unit of the strength, as written"}
  form: {column: psy_lifetime_cmdosfrm, type: text, label: "Form, as written"}
  units_per_day: {column: psy_lifetime_cmdosfrq, type: number, range: [0, 100], winsor: false, label: "Number of units a day (derived: the typed dose divided by the number of the strength; wrong for g, µg and UI strengths)"}
  daily_dose: {column: psy_lifetime_cmdostot, type: number, range: [0, 5000], winsor: false, label: "Daily dose in mg, as typed"}

checks:
  end_date: end_before_start
