instrument: non_drug_fu
title: "Non-drug treatments since the last visit (follow-up form)"
tab: TRAITEMENTS
section: TRAITEMENTS NON PHARMACOLOGIQUES
status: draft
notes: >
  The BP schema with the questions of this extraction: electroconvulsive
  therapy, transcranial magnetic stimulation and psychotherapy since the
  last visit, at the follow-up visits: 819 visits (84% to 91% of the visits
  of each kind). Electroconvulsive therapy on 134 of 810 visits, TMS on 64
  of 804.

  Two forms in the same columns: the whole life at the inclusion visit, the
  time since the last visit at follow-up (of the 151 follow-up visits of
  patients who had had electroconvulsive therapy at inclusion, 101 answer
  no). visit_form says which form a visit uses, and each form has its own
  schema, as in BP.

  Answers are 0, 1 and 2: 2 is "not known" (missing_code). The kind of
  stimulation is stored as a code that the dictionary does not explain
  (open question O28).

version:
  name: visit_form
  column: visit
  codes:
    screening: inclusion
    V0: inclusion
    V6_mois: follow_up
    V1_an: follow_up
    V18_mois: follow_up
    V2_ans: follow_up
    V30_mois: follow_up
    V3_ans: follow_up
    V4_ans: follow_up
    V5_ans: follow_up

defaults: {type: item, range: [0, 1], versions: [follow_up]}

variables:
  ect_fu: {column: proccur_ect, missing: {"2": unknown}, label: "Electroconvulsive therapy since the last visit"}
  ect_sessions_fu: {column: ect_procprfn, type: number, range: [0, 1500], winsor: false, asked_if: ect_fu, label: "Electroconvulsive therapy since the last visit: number of sessions"}
  ect_start_date_fu: {column: prstdtc_ect, type: date, range: [1950-01-01, 2026-12-31], label: "Electroconvulsive therapy since the last visit: start"}
  ect_end_date_fu: {column: prendtc_ect, type: date, range: [1950-01-01, 2026-12-31], label: "Electroconvulsive therapy since the last visit: end"}
  ect_stimulation_fu: {column: prlat_ect, type: category, codes: {"1": code_1, "2": code_2}, label: "Electroconvulsive therapy since the last visit: kind of stimulation (code)"}
  ect_seizure_over_25s_fu: {column: prdostxt_ect, type: category, codes: {"0": code_0, "1": code_1, "2": code_2}, label: "Electroconvulsive therapy since the last visit: mean seizure on the EEG longer than 25 seconds (code)"}
  tms_fu: {column: proccur_tms, missing: {"2": unknown}, label: "Transcranial magnetic stimulation since the last visit"}
  tms_sessions_fu: {column: tms_procprfn_nb, type: number, range: [0, 1500], winsor: false, asked_if: tms_fu, label: "Transcranial magnetic stimulation since the last visit: number of sessions"}
  tms_start_date_fu: {column: prstdtc_tms, type: date, range: [1950-01-01, 2026-12-31], label: "Transcranial magnetic stimulation since the last visit: start"}
  tms_end_date_fu: {column: prendtc_tms, type: date, range: [1950-01-01, 2026-12-31], label: "Transcranial magnetic stimulation since the last visit: end"}
  tms_stimulation_fu: {column: prlat_tms, type: category, codes: {"0": code_0, "1": code_1, "2": code_2}, label: "Transcranial magnetic stimulation since the last visit: kind of stimulation (code)"}
  tms_high_frequency_over_30_fu: {column: tms_procprfn_hf, label: "TMS since the last visit, high frequency: more than 30 sessions"}
  tms_low_frequency_over_30_fu: {column: tms_procprfn_bf, label: "TMS since the last visit, low frequency: more than 30 sessions"}
  tms_30000_stimulations_fu: {column: prdostxt_tms, label: "TMS since the last visit: 30,000 stimulations or more delivered"}
  psychotherapy_fu: {column: proccur_trtpsyt, missing: {"2": unknown}, label: "Psychotherapy since the last visit"}
