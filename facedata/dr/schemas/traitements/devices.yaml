instrument: devices
title: "Electronic cigarette, pacemaker, CPAP and deep brain stimulation"
tab: TRAITEMENTS
section: TRAITEMENTS NON PHARMACOLOGIQUES
status: reviewed
notes: >
  Four yes/no questions of the section "Dispositifs médicaux" of form 203,
  asked with the non-drug treatments: electronic cigarette, pacemaker, CPAP
  and deep brain stimulation (columns CI_ELEC, PACE, CPAP, SCP; the target
  and the indication of the stimulation are CIB_STIMU and INDI). The four
  are flat radios with no gate; only the target and the indication are
  hidden behind a yes to deep brain stimulation (f_traitement, SCP1): 0 of
  989 are filled after a no and 3 of 3 after a yes. Not in BP or SZ. The
  question has no period: it is the state at the visit, asked at the
  inclusion visit and at every follow-up visit.

  1,023 visits answer at least one question (1,018 answer all four); every
  one of them also holds a non-drug answer, as do 1,350 visits in all. The
  form was not always shown: of the visits that hold the non-drug part, 0
  of 14 before June 2013 answer the devices, 76 of 349 (22%) from June 2013
  to the end of 2015, and 947 of 987 (96%) from 2016 (V0 93%, follow-up
  98%). So the questions are asked at every visit only since 2016. 2 is
  "not known" (120 cells, missing_code). Seven of the 23 patients with a
  CPAP yes answer no at a later visit.

defaults: {type: item, range: [0, 1], missing: {"2": unknown}}

