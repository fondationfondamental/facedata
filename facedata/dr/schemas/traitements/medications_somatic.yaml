instrument: medications_somatic
title: "Somatic treatments, one row per treatment"
tab: TRAITEMENTS
section: TRAITEMENTS SOMATIQUES ACTUELS
status: draft
level: list
notes: >
  The somatic treatments recorded as current (TRAITEMENTS SOMATIQUES
  ACTUELS), one row per treatment in the table treatments, where the column
  list says "medications_somatic". 273 patients, 408 items delivered. No
  molecule table is used: the generic name of the catalogue is delivered as
  written (esomeprazole, colecalciferol, pantoprazole and levothyroxine are
  the most frequent).

  The lists are crossed by the export. In BP and SZ, item 1 of each list
  describes the same treatment. Here the export writes every product of the
  patient (substance, generic name, strength, unit) next to every
  prescription line (form, daily dose, start, end): a patient with 2
  products and 3 lines has 6 items, the products in blocks and the lines in
  cycles, on each of the patients of the three lists. The products are in
  alphabetical order, and nothing says which line belongs to which product.
  The number of units a day is the daily dose of one line over the strength
  of one product, computed for every pair: most of these numbers mean
  nothing.

  What is delivered (field crossed, SCHEMA_SPEC section 15). A patient with
  one product keeps every line. A patient with several products keeps one
  item per product, without form, dose or date (list_crossed on these
  variables): the molecules are known, their dates are not. The class and
  catalogue-code columns (cmclas, cmclascd) are lists of another length and
  are not read (ignored.yaml). Open question O27, to send first.

  The same list is on every row of a patient: it is the history, not the
  treatment of the visit. Dates are written day/month/year.

crossed: [psycho_som_cmtrt, psycho_som_cmdecod, psycho_som_cmdose, psycho_som_cmdosu]

variables:
  medication: {column: psycho_som_cmtrt, type: text, label: "Substance, as the drug catalogue names it"}
  generic_name: {column: psycho_som_cmdecod, type: text, label: "Generic name, as the drug catalogue writes it"}
  start_date: {column: psycho_som_cmstdtc, type: date, range: [1951-01-01, 2026-12-31], missing: {"/": not_recorded}, label: Start of the treatment}
  end_date: {column: psycho_som_cmendtc, type: date, range: [1950-01-01, 2026-12-31], missing: {"/": not_recorded}, label: End of the treatment}
  strength: {column: psycho_som_cmdose, type: text, label: "Strength of one unit, as written"}
  dose_unit: {column: psycho_som_cmdosu, type: text, label: "Unit of the strength, as written"}
  form: {column: psycho_som_cmdosfrm, type: text, label: "Form, as written"}
  units_per_day: {column: psycho_som_cmdosfrq, type: number, range: [0, 100], winsor: false, label: "Number of units a day (the daily dose over the strength)"}
  daily_dose: {column: psycho_som_cmdostot, type: number, range: [0, 5000], winsor: false, label: Total daily dose (in the unit of the strength)}
