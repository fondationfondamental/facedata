instrument: medications_somatic
title: "Somatic treatments, one row per treatment"
tab: TRAITEMENTS
section: TRAITEMENTS SOMATIQUES ACTUELS
status: reviewed
level: list
notes: >
  The somatic treatments recorded as current (TRAITEMENTS SOMATIQUES
  ACTUELS), one row per treatment in the table treatments, where the column
  list says "medications_somatic". 273 patients, 408 items delivered. No
  molecule table is used: the generic name of the catalogue is delivered as
  written (esomeprazole, colecalciferol, pantoprazole and levothyroxine are
  the most frequent). The table medications.csv is a table of psychotropic
  drugs: it would find 162 of the 408 items and leave the others as
  unknown_code, so it is not used until it has the somatic drugs.

  The variables keep the names of the psychotropic lists with one exception:
  substance_name, not medication (R17). The export writes the name of the
  substance of the drug catalogue (nomsubstance): 4 of the 408 rows hold a
  digit, a salt in brackets on 6% (25 rows).

  The lists are crossed by the export (request R122), as in medications.yaml
  (which gives the lines of the SQL; form 158 is a table of rows that belong
  to the form of the visit, with an add button and no limit of rows). 72 of
  the 273 patients have several products. A patient with one product keeps
  every line. A patient with several products keeps one item per product,
  without form, dose or date (list_crossed on these variables, SCHEMA_SPEC
  section 15): the molecules are known, their dates are not. In the file
  there are 709 items. The class and catalogue-code columns (cmclas,
  cmclascd) are lists of another length and are not read (ignored.yaml).
  Thirty-one patients have catalogue (CIS) codes but no substance row
  (products with no ATC match), and 36 more have fewer substances than
  codes. The raw table also holds three columns that look like the reasons
  for stopping (psy_arret_som_1 to 3; the form has a "Motif" column), which
  the export does not select.

  The list of a patient is the same on every row of the patient, but it is
  not a history of the past: the rows are the somatic treatments of the
  visits, pooled by the export. Dates are written day/month/year.
  daily_dose is the daily dose in mg as typed; units_per_day is derived by
  the export, as in medications.yaml. No treatment ends before it starts
  (check end_date).

crossed: [psycho_som_cmtrt, psycho_som_cmdecod, psycho_som_cmdose, psycho_som_cmdosu]

variables:
  substance_name: {column: psycho_som_cmtrt, type: text, label: "Name of the substance, as the drug catalogue writes it"}
  generic_name: {column: psycho_som_cmdecod, type: text, label: "Generic name, as the drug catalogue writes it"}
  start_date: {column: psycho_som_cmstdtc, type: date, range: [1951-01-01, today+60], missing: {"/": not_recorded}, label: Start of the treatment}
  end_date: {column: psycho_som_cmendtc, type: date, range: [1950-01-01, today+60], missing: {"/": not_recorded}, label: End of the treatment}
  strength: {column: psycho_som_cmdose, type: text, label: "Strength of one unit, as written"}
  dose_unit: {column: psycho_som_cmdosu, type: text, label: "Unit of the strength, as written"}
  form: {column: psycho_som_cmdosfrm, type: text, label: "Form, as written"}
  units_per_day: {column: psycho_som_cmdosfrq, type: number, range: [0, 100], winsor: false, label: "Number of units a day (derived: the typed dose divided by the number of the strength; wrong for g, µg and UI strengths)"}
  daily_dose: {column: psycho_som_cmdostot, type: number, range: [0, 5000], winsor: false, label: "Daily dose in mg, as typed"}

checks:
  end_date: end_before_start
