instrument: nfs
title: Full blood count (NFS)
tab: BILAN BIOLOGIQUE
section: NFS
status: reviewed
implausible_visits: 3
implausible_pool: biology
notes: >
  The blood count: thirteen values on about 1,140 visits.

  For the haematocrit and the MCHC the form has a choice of unit, exported as
  a code: 1 is % and 2 L/L for the haematocrit (205 results converted), 1 is
  g/dL and 2 g/L for the MCHC (287 converted). The other values have the
  default label only: 26 haemoglobins are read as g/L (22 of them on the
  shifted visits below, 4 in one other centre), and 28 neutrophils and 26
  basophils are written as a percentage or per mm3 (unit_inferred).

  In one centre the results of one laboratory block were typed in the wrong
  fields, shifted by seven fields of the eCEDR table, on 30 visits dated up to
  2022 (the unit field of the vitamin results holds a number on 23 of them,
  see vitamines_cortisol). Here they show as a 0 for the MCV, the MCH, the
  MCHC and the platelets (115 cells: 29, 30, 26 and 30), a number other than
  the code 1 or 2 in the unit cell of the MCHC (19 visits), and red cells or
  basophils out of range. Every laboratory schema of DR carries
  `implausible_visits: 3` and `implausible_pool: biology`: the impossible
  values (out_of_range) of the eleven schemas are counted on each visit, and a
  visit with three or more loses all its values in every schema of the pool
  and gets visit_removed, with the number of impossible values as detail
  (section 4 of SCHEMA_SPEC.md). The pool removes 35 visits in all (1,403
  cells): the 30 visits of the block (4 to 18 impossible values each; none
  escapes, and no other visit of that centre holds more than one impossible
  value) and 5 visits of 5 other centres (3 to 10 impossible values, 3 of them
  spread over several schemas and 2 with 3 in the biochemistry alone). This
  schema loses 180 cells on 29 visits: 124 on 24 visits of the block (among
  them 22 of the 26 haemoglobins read as g/L) and 56 on 5 other visits. The
  results of the block that fall inside their range are as wrong as those that
  do not.

  A 0 is not "nothing measured" here, as it is for the prolactin: all 115 are
  on these 30 visits and none is left once they are removed. They stay
  out_of_range because they count towards the rule: read as a missing code
  they would not, and the pool would catch only 23 of the 30 block visits.

  The white-cell differential does not add up to the leukocytes on 22 of 1,113
  visits (2.0%, check_failed); the check is right.

  The 1% and 99% winsorising turns a clinical tail into the cut value, and
  only the hard range removes impossible values.

  Centre step of the basophils: one centre has a median of 0.00 G/L against
  0.04 for all (-1.0 interquartile range, 147 results, groups of 20 results
  or more), which fits a laboratory that writes them with one decimal (13
  distinct values, 92% on a grid of 0.1, 108 results exactly 0); two other
  centres have 26 of 65 and 13 of 55 results exactly 0, and the others 0% to
  3%.

  Same instrument as in FACE BP.

defaults: {type: number}

variables:
  leukocytes:
    label: Leukocytes
    column: wbc
    unit_column: wbc_lborresu
    unit: G/L
    units:
      G/L: {factor: 1, expect: [0.5, 100], aliases: [Giga/L]}
      "/mm3": {factor: 0.001, expect: [500, 100000], aliases: ["/mm"]}
    range: [0.5, 100]

  erythrocytes:
    label: Erythrocytes
    column: rbc
    unit_column: rbc_lborresu
    unit: T/L
    units:
      T/L: {factor: 1, expect: [1.5, 8], aliases: [Tera/L]}
      G/L: {factor: 0.001, expect: [1500, 8000]}
      "/mm3": {factor: 1e-06, expect: [1500000, 8000000], aliases: ["/mm"]}
    range: [1.5, 8]

  haemoglobin:
    label: Haemoglobin
    column: hgb
    unit_column: hgb_lborresu
    unit: g/dL
    units:
      g/dL: {factor: 1, expect: [5, 25]}
      g/L: {factor: 0.1, expect: [50, 250]}
    range: [5, 25]

  haematocrit:
    label: Haematocrit
    column: hct
    unit_column: hct_lborresu
    unit: "%"
    units:
      "%": {factor: 1, expect: [15, 65], aliases: ["1"]}
      L/L: {factor: 100, expect: [0.15, 0.65], aliases: ["2"]}
      "0.1 %": {factor: 0.1, expect: [150, 650]}
    range: [15, 65]

  neutrophils:
    label: Neutrophils
    column: neut
    unit_column: neut_lborresu
    unit: G/L
    units:
      G/L: {factor: 1, expect: [0, 25]}
      "/mm3": {factor: 0.001, expect: [100, 25000], aliases: ["/mm"]}
      "%": {percent_of: leukocytes, expect: [0, 100], aliases: [pour]}
    range: [0, 25]

  basophils:
    label: Basophils
    column: baso
    unit_column: baso_lborresu
    unit: G/L
    units:
      G/L: {factor: 1, expect: [0, 0.3]}
      "/mm3": {factor: 0.001, expect: [5, 300], aliases: ["/mm"]}
      "%": {percent_of: leukocytes, expect: [0, 5], aliases: [pour]}
    range: [0, 0.3]

  eosinophils:
    label: Eosinophils
    column: eos
    unit_column: eos_lborresu
    unit: G/L
    units:
      G/L: {factor: 1, expect: [0, 1.5]}
      "/mm3": {factor: 0.001, expect: [10, 5000], aliases: ["/mm"]}
      "%": {percent_of: leukocytes, expect: [0, 10], aliases: [pour]}
    range: [0, 5]

  lymphocytes:
    label: Lymphocytes
    column: lym
    unit_column: lym_lborresu
    unit: G/L
    units:
      G/L: {factor: 1, expect: [0, 12]}
      "/mm3": {factor: 0.001, expect: [100, 12000], aliases: ["/mm"]}
      "%": {percent_of: leukocytes, expect: [0, 100], aliases: [pour]}
    range: [0, 12]

  monocytes:
    label: Monocytes
    column: mono
    unit_column: mono_lborresu
    unit: G/L
    units:
      G/L: {factor: 1, expect: [0, 2.5]}
      "/mm3": {factor: 0.001, expect: [20, 2500], aliases: ["/mm"]}
      "%": {percent_of: leukocytes, expect: [0, 20], aliases: [pour]}
    range: [0, 2.5]

  mcv:
    label: Mean corpuscular volume (VGM)
    column: mcv
    unit_column: mcv_lborresu
    unit: fL
    units:
      fL: {factor: 1, expect: [50, 130], aliases: [microns, u, µ]}
      "10 fL": {factor: 10, expect: [5, 13]}
    range: [50, 130]

  mch:
    label: Mean corpuscular haemoglobin (TCMH)
    column: mch
    unit_column: mch_lborresu
    unit: pg
    units:
      pg: {factor: 1, expect: [15, 45], aliases: ["%"]}
      fmol: {factor: 16.11, expect: [1.2, 2.5], aliases: [femto]}
    range: [15, 45]

  mchc:
    label: Mean corpuscular haemoglobin concentration (CCMH)
    column: mchc
    unit_column: mchc_lborresu
    unit: g/dL
    units:
      g/dL: {factor: 1, expect: [25, 40], aliases: ["%", "1"]}
      g/L: {factor: 0.1, expect: [250, 400], aliases: ["2"]}
    range: [25, 40]

  platelets:
    label: Platelets
    column: plat
    unit_column: plat_lborresu
    unit: G/L
    units:
      G/L: {factor: 1, expect: [10, 1500], aliases: [Giga/L]}
      "x100 G/L": {factor: 100, expect: [0.5, 10]}      # 2.47 for 247 G/L, as in 2.47 x 10^5 per mm3 (BP D130)
      "/mm3": {factor: 0.001, expect: [10000, 1500000], aliases: ["/mm"]}
    range: [10, 1500]

checks:
  leukocytes: differential_differs
