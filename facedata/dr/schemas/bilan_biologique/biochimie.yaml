instrument: biochimie
title: Blood biochemistry
tab: BILAN BIOLOGIQUE
section: Bilan Biologique
status: reviewed
implausible_visits: 3
implausible_pool: biology
notes: >
  The sixteen analytes of the BP schema, with two more that the TRD form has:
  ferritin (from 2017) and the kind of CRP assay. Blood results exist at the
  inclusion and follow-up visits (about 1,200 visits).

  The unit column of an analyte holds the default label of the form on every
  row that has any result of the tab (1,254 rows) and on no other, so it says
  nothing: the size of the value decides, as in BP and SZ. A 0 typed where
  nothing was measured is out of range.

  59 results were typed on another scale and are brought back (unit_inferred):
  17 phosphates, 10 glucoses in g/L, 7 creatinines, 7 calciums and others; 10
  are kept with a doubt.

  CRP: 80 results are given as "less than" a limit; they keep the limit and
  the mark (crp_cens). The kind of assay is a code, 1 on 740 results and 2 on
  377; the dictionary names the two kinds (CRP, high-sensitivity CRP) without
  saying which code is which (open question O11 in PROGRESS.md).

  The creatinine clearance is typed, not computed: the form only shows the
  Cockcroft-Gault formula as a help text. The typed values agree within 10%
  with the formula (age, weight, sex and creatinine of the visit) on 44% of
  917 visits.

  HbA1c: 22 values are out of range as percentages; 19 have the size of a
  result in mmol/mol (IFCC, 18 to 52) and are converted with the IFCC-NGSP
  master equation, % = 0.09148 x mmol/mol + 2.152 (unit_inferred; 3.8% to
  6.9%), and a 20th, of 18, is kept as a percentage with a doubt (unit_doubt).
  The others (0 and a value of seven digits) stay out of range. 19 of these 20
  values are on the shifted visits of one centre (see the blood-count schema),
  where the HbA1c is 24 at the median against 5.5 elsewhere: it is the block
  typed in the wrong field, not a result in mmol/mol (open question O11 in
  PROGRESS.md). The pool removes these visits and their 19 values: only 1 of
  the 20 is still delivered.

  On the 30 shifted visits the glucose is out of range 13 times (it has the
  size of a platelet count), and nothing else of this schema is impossible: no
  visit holds more than one impossible value here, so this schema alone would
  not remove them. This schema belongs to the pool biology
  (implausible_visits: 3, implausible_pool: biology; see the blood-count
  schema): a visit with three or more impossible values over the eleven
  laboratory schemas of DR loses all its values and gets visit_removed. The
  pool removes 35 visits in all (1,403 cells); this schema loses 407 cells on
  29 visits: 341 on 24 visits of the block and 66 on 5 other visits. The 5
  other visits are of 5 other centres: 4 hold 3 to 5 impossible values in this
  schema (two of them also in the lipid schema) and the fifth holds one in
  each of the biochemistry, the blood count and the vitamins.

  The 1% and 99% winsorising turns a clinical tail into the cut value, and
  only the hard range removes impossible values.

  Steps between centres or years of 0.75 interquartile range or more (groups
  of 20 results or more; the cause is not known, an assay or a population):
  chloride, one centre at 102 mmol/L against 105 for all (-1.0, that is 3
  mmol/L, 72 results); calcium, the year 2013 at 2.235 mmol/L against 2.34
  (-0.75, 44 results) and one centre at 2.44 (0.71, 75 results); albumin,
  two centres at 39 g/L against 43 (-1.0, 49 and 39 results) and the year
  2024 at 40 (-0.75, 30 results), where 53% of the results are those of a
  centre that appears in 2023 and has a median of 39 against 43.5 for the
  others; ferritin, one centre at 105.5 µg/L against 47 (0.81, 38 results).
  CRP: 35 of the 1,140 results are exactly 0 and are delivered as missing
  (BP D101), 27 of them dated 2013 to 2015.

  Same instrument as in FACE BP, with ferritin and the kind of CRP.

defaults: {type: number}

variables:
  sodium:
    label: Sodium
    column: sodium
    unit_column: sodium_lborresu
    unit: mmol/L
    units:
      mmol/L: {factor: 1, expect: [110, 170], aliases: [mEq/l]}
    range: [110, 170]

  potassium:
    label: Potassium
    column: k
    unit_column: k_lborresu
    unit: mmol/L
    units:
      mmol/L: {factor: 1, expect: [2, 8], aliases: [mEq/l]}
    range: [2, 8]

  chloride:
    label: Chloride
    column: cl
    unit_column: cl_lborresu
    unit: mmol/L
    units:
      mmol/L: {factor: 1, expect: [70, 130], aliases: [mEq/l]}
    range: [70, 130]

  bicarbonate:
    label: Bicarbonate
    column: bicarb
    unit_column: bicarb_lborresu
    unit: mmol/L
    units:
      mmol/L: {factor: 1, expect: [5, 50]}
    range: [5, 50]

  total_protein:
    label: Total protein
    column: prot
    unit_column: prot_lborresu
    unit: g/L
    units:
      g/L: {factor: 1, expect: [40, 110]}
    range: [40, 110]

  albumin:
    label: Albumin
    column: alb
    unit_column: alb_lborresu
    unit: g/L
    units:
      g/L: {factor: 1, expect: [15, 65]}
      g/dL: {factor: 10, expect: [2.5, 6.5]}
      "0.1 g/L": {factor: 0.1, expect: [250, 650]}
    range: [15, 65]

  urea:
    label: Urea
    column: urea
    unit_column: urea_lborresu
    unit: mmol/L
    units:
      mmol/L: {factor: 1, expect: [1, 40]}
      g/L: {factor: 16.65, expect: [0.1, 0.9]}
    range: [1, 40]

  uric_acid:
    label: Uric acid
    column: urate
    unit_column: urate_lborresu
    unit: µmol/L
    units:
      µmol/L: {factor: 1, expect: [100, 1000]}
      mg/L: {factor: 5.948, expect: [15, 100]}
      mg/dL: {factor: 59.48, expect: [1, 10]}
      mmol/L: {factor: 1000, expect: [0.1, 1]}
    range: [50, 1000]

  creatinine:
    label: Creatinine
    column: creat
    unit_column: creat_lborresu
    unit: µmol/L
    units:
      µmol/L: {factor: 1, expect: [25, 1000]}
      mg/L: {factor: 8.84, expect: [3, 20]}
      mg/dL: {factor: 88.4, expect: [0.3, 2.5]}
    range: [20, 1000]

  creatinine_clearance:
    label: Creatinine clearance
    column: creatclr
    unit_column: creatclr_lborresu
    unit: mL/min
    units:
      mL/min: {factor: 1, expect: [5, 250], aliases: [cdk, ckd, ck, ml/mi]}
    range: [5, 250]
    missing: {0: not_recorded}
    winsor: [0.01, 1]
    note: Results above the laboratory's ceiling are right-censored, so only the lower tail is winsorised.

  phosphate:
    label: Phosphate
    column: phos
    unit_column: phos_lborresu
    unit: mmol/L
    units:
      mmol/L: {factor: 1, expect: [0.3, 2.5]}
      mg/L: {factor: 0.0323, expect: [15, 80]}
      mg/dL: {factor: 0.323, expect: [2.5, 8]}
    range: [0.3, 3]

  iron:
    label: Serum iron
    column: iron
    unit_column: iron_lborresu
    unit: µmol/L
    units:
      µmol/L: {factor: 1, expect: [2, 50]}
      µg/dL: {factor: 0.1791, expect: [50, 250]}
      µg/L: {factor: 0.01791, expect: [250, 3000], aliases: [ug/l]}
      mg/L: {factor: 17.91, expect: [0.2, 2]}
    range: [1, 60]

  calcium:
    label: Calcium
    column: ca
    unit_column: ca_lborresu
    unit: mmol/L
    units:
      mmol/L: {factor: 1, expect: [1.5, 3.5]}
      mg/L: {factor: 0.02495, expect: [70, 130]}
      mg/dL: {factor: 0.2495, expect: [7, 13]}
      mEq/L: {factor: 0.5, expect: [3.6, 6.5]}
    range: [1.5, 3.5]

  crp:
    missing: {"0": unknown, "0.0": unknown, "00": unknown}      # exactly 0: below a limit that is not written (BP D101)
    label: C-reactive protein
    column: crp
    unit_column: crp_lborresu
    unit: mg/L
    units:
      mg/L: {factor: 1, expect: [0, 400]}
    censor_units: {inf: left, inferieur: left}
    range: [0, 400]
    winsor: [0, 0.99]
    note: The lower tail is censored, so only the upper tail is winsorised.

  glucose:
    label: Fasting glucose
    column: gluc
    unit_column: gluc_lborresu
    unit: mmol/L
    units:
      mmol/L: {factor: 1, expect: [2.5, 40]}
      g/L: {factor: 5.551, expect: [0.3, 2.5]}
    range: [1.5, 40]

  ferritin:
    label: Ferritin
    column: ferritin
    unit_column: ferritin_lborresu
    unit: µg/L
    units:
      µg/L: {factor: 1, expect: [1, 3000], aliases: [ug/L]}
    range: [1, 3000]
  crp_type:
    label: Kind of CRP assay, as a code whose meaning is not documented (CRP or high-sensitivity CRP)
    column: crp_choix
    type: category
    codes: {"1": code_1, "2": code_2}
  hba1c:
    label: Glycated haemoglobin (HbA1c)
    column: hba1c
    unit_column: hba1c_lborresu
    unit: "%"
    units:
      "%": {factor: 1, expect: [3, 18]}
      mmol/mol: {factor: 0.09148, offset: 2.152, expect: [18, 150]}
    range: [3, 18]
