instrument: amiel_lebigre
title: Life events questionnaire (Amiel-Lebigre)
tab: HETERO-QUESTIONNAIRES
section: AMIEL-LEBIGRE (Questionnaire d'évènement de vie, Amiel-Lebigre et al.,2005)
status: draft
notes: >
  53 life events, each answered 1 (yes) or 0 (no), and for a yes a second
  column. Filled at the inclusion visit (354 visits) and at two and four
  years (154), from 2013; 483 of the 511 visits answer the 53 events, with a
  median of 5 events.

  The dictionary names the columns in two lines ("53 items", "if yes, date
  of the event") and gives neither the list of the events nor a coding. The
  second column is not a date: it holds a code from 1 to 4 (4 on half of the
  cells), on 3,518 of the 3,593 events answered yes and never otherwise. It
  is delivered as that code (open question O9 in PROGRESS.md). Event 18 is
  never answered yes.

  amiel_events is the number of events answered yes, when the 53 are
  answered; no score is stored.

  An instrument of the TRD cohort only; the 106 columns are not listed one
  by one in the dictionary.

defaults: {type: item, range: [0, 1]}

