instrument: athf
title: Antidepressant Treatment History Form (ATHF)
tab: HETERO-QUESTIONNAIRES
section: ATHF Criteria for Rating Medication Trials for Antidepressant Failure (2009)
status: draft
notes: >
  The Antidepressant Treatment History Form: one rating per antidepressant,
  per biological therapy, per augmentation agent and per psychotherapy that
  the patient received for the current episode, 42 in all. A rating of 0
  means no prescription. For an antidepressant, 1 and 2 are trials that were
  too short or under the adequate dose, and 3 and more an adequate trial;
  the exact levels of each line are in the dictionary. Filled at the
  inclusion visit (507 visits) and at the follow-up visits (526), at about
  80% of the inclusion visits in every period.

  No score is stored and none is computed here: the ratings are delivered
  as written. The number of adequate trials is the count of the ratings of
  3 or more among the antidepressants.

  Four points that the dictionary does not settle (open question O8 in
  PROGRESS.md). (1) Two columns are called bupropion: athf05e, filled on
  every visit and rarely above 0, and athf05f, filled from 2019 (572 visits)
  and rated 3 or 4 on 149 of them; athf05f is delivered under a neutral
  name. (2) Two columns are called antipsychotics (athf10b, athf10c). (3)
  Lithium alone (athf08a) and carbamazepine (athf08c) hold ratings of 4 to 6
  where the dictionary lists 0 to 3; they are kept. (4) Phenelzine (athf04d)
  is filled from 2019 only.

  An instrument of the TRD cohort only.

