instrument: amiel_lebigre_v0
title: Life events questionnaire (Amiel-Lebigre), inclusion form
tab: HETERO-QUESTIONNAIRES
section: AMIEL-LEBIGRE (Questionnaire d'évènement de vie, Amiel-Lebigre et al.,2005)
status: reviewed
notes: >
  The life-events questionnaire of Amiel-Lebigre at the inclusion visit
  (form 209): 53 events, each answered 1 (yes) or 0 (no), and for a yes a
  second answer, "when", chosen in a list of four (six months, one year, two
  years, whole life). Filled at 354 inclusion visits from 2013 (the share of
  the V0 visits runs from 16% in 2013 to 90% in 2017 and 43% to 72% since);
  330 answer all 53 events, with a median of 8 events (mean 9.2, at most
  39). The follow-up form is another instrument, amiel_lebigre_fu (decision
  D60 in PROGRESS.md).

  The dictionary names the columns in two lines ("53 items", "if yes, date
  of the event") and gives neither the events nor a coding. The 53 texts are
  in the form (the same in forms 209 and 210), and the labels here are their
  English wording; the 53rd is "other events than these in the last two
  years". The second column is not a date: it holds the code of the list, 1
  six months, 2 one year, 3 two years, 4 whole life ("Date :" is the label
  of the form), on 3,209 of the 3,284 events answered yes at inclusion and
  never otherwise. It is delivered as a category (before the review as the
  code: 3,518 cells of the two forms change representation, 3,209 here and
  309 at follow-up). The form does not say whether "one year" means within
  the last year or between six and twelve months ago. 75 events answered yes
  on 12 inclusion visits have no "when": delivered as written, no flag.
  Event 18 (prison sentence) is never answered yes; the most frequent yes is
  event 23 (death in the close family, 192 inclusion visits).

  A step in time with no known cause: the count has a median of 4 or 5
  events a visit in 2015-2018 and 11 to 16 from 2019 (7 of the 8 centres
  with 6 visits or more in each period rise); the events of the last two
  years go from a median of 2 to 4 and those ticked "whole life" from 0 to
  6, with the same four options of the form since 2014 (PROGRESS.md D66,
  QUESTIONS.md DM-11).

  amiel_events is the number of events answered yes, when the 53 are
  answered (330 visits); no score is stored and the instrument has none. No
  published definition matches this form (Amiel-Lebigre and others 1984: a
  53-event schedule with an impact rating of 0 to 100; 1990: 51 events;
  1998: counts of upsetting events; the windows of the form and the "2005"
  of the dictionary have no published counterpart; scale_reference.md,
  section 20, to verify): the count is the package's own and not a published
  score.

  Two forms in the same columns. Form 209 is shown at the initial evaluation
  and form 210 at the evaluations of 24 and 48 months (visit types 2, 6 and
  8; both are on the simplified visit). They read the same raw columns
  (amiel01 to amiel53 and amiel01d to amiel53d); the events are the same,
  and the list of "when" has four options in form 209 and two in form 210.
  The two are never delivered in one column: visit_form says which form a
  visit uses (inclusion for the screening and inclusion visits, follow_up
  for the others), and each form has its own schema and its own variables
  (the C-SSRS and the ISF of this cohort do the same).

  An instrument of the TRD cohort only.

