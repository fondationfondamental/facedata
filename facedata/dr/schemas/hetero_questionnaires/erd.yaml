instrument: erd
title: Depressive Retardation Scale (ERD, Widlöcher)
tab: HETERO-QUESTIONNAIRES
section: ERD (Echelle de Ralentissement Depressif, Widlöcher)
status: reviewed
notes: >
  The Depressive Retardation Scale of Widlocher (ERD; Hardy, Jouvent and
  Widlocher 1984; scale_reference.md, section 16). Fourteen items rated 0
  (normal) to 4 (very severe) and a fifteenth, the general appreciation of
  the retardation, on the same scale. The stored score is the application's
  own (js_scores/228_score.js, which leaves the item of the general
  appreciation out and empties the field when an item is empty): the sum of
  items 1 to 14 (0 to 56), on all 507 visits that have both; the general
  appreciation is not part of it. 11 visits have the fourteen items and no
  stored score, and get the recomputed one (518 visits in all; observed
  maximum 47). Whether the original instruction counts the general item in
  the total was not settled by the literature check of 2026-11-21 (the
  primary papers were not read): secondary sources describe fifteen items
  and a total of 0 to 60 with a retardation cut-off of 20 on that total
  (Bennabi 2013; Robin 2019), which counts the general item; a threshold
  taken from the literature must not be applied to the 0-56 sum without
  adding item 15.

  The items follow the matching MADRS items of the same visit: the
  concentration item with the MADRS "difficulties of concentration" at 0.68,
  the interest item with the MADRS "inability to feel" at 0.60, the
  fatigability item with the MADRS "lassitude" at 0.51 and the rumination
  item with "pessimistic thoughts" at 0.44; the ERD score with the MADRS
  total at 0.62 (507 visits).

  The scale came into use in 2016 (196 inclusion visits, 325 follow-up
  visits): it is on 43% of the V0 visits since 2016 (60% in 2017, 30% to 73%
  since). The ERD is one of the forms that the simplified visit omits
  (PROGRESS.md D55, request R139).

  A step in time with no known cause: the total has a median of 7 and 9 in
  2020 and 2021 (110 visits) against 13 in the other years, and the same
  centres are lower (5 against 14 in the centre with the most visits), all
  fourteen items together (PROGRESS.md D66, QUESTIONS.md DM-11).

  A scale that FACE BP and FACE SZ do not have.

defaults: {type: item, range: [0, 4]}

variables:
  erd01: {label: "ERD 1: Gait, stride"}
  erd02: {label: "ERD 2: Slowness and paucity of movements: trunk"}
  erd03: {label: "ERD 3: Slowness and paucity of movements of the head and neck: facial expression"}
  erd04: {label: "ERD 4: Language and verbal flow"}
  erd05: {label: "ERD 5: Modulation of the voice"}
  erd06: {label: "ERD 6: Brief answers"}
  erd07: {label: "ERD 7: Variety of themes spontaneously approached: ideational initiative"}
  erd08: {label: "ERD 8: Fluency of ideas"}
  erd09: {label: "ERD 9: Subjective experience of rumination"}
  erd10: {label: "ERD 10: Fatigability"}
  erd11: {label: "ERD 11: Interest in usual activities"}
  erd12: {label: "ERD 12: Perception of the flow of time"}
  erd13: {label: "ERD 13: Memory"}
  erd14: {label: "ERD 14: Concentration"}
  erd_general: {column: erd15, label: "ERD 15: general appreciation of the retardation (not in the score)"}
  erd_total_stored: {column: erd_, label: "ERD score as stored", range: [0, 56], keep: false}

scores:
  erd_total:
    label: "ERD score: sum of items 1 to 14 (0 to 56)"
    sum: [erd01, erd02, erd03, erd04, erd05, erd06, erd07, erd08, erd09, erd10, erd11, erd12, erd13, erd14]
    compare: erd_total_stored
