instrument: thase_rush
title: Stage of treatment resistance (Thase and Rush)
tab: HETERO-QUESTIONNAIRES
section: THASE ET RUSH
status: draft
notes: >
  One rating at the screening visit: the stage of resistance of Thase and
  Rush, from 1 (failure of one adequate antidepressant trial) to 5 (failure
  of bilateral electroconvulsive therapy as well). Filled for 517 of the 634
  patients: about 90% of the screening visits until 2019, 53% to 72% since
  2021. Stage 2 for 256 patients, 3 for 211, 4 for 22, 5 for 26.

  The inclusion criterion "stage 2 or more" (inclusion_criteria) is ticked
  for 631 patients: 115 of them have no stage here, and fewer than five have
  a stage 1.

  An instrument of the TRD cohort only.

variables:
  thase_rush_stage:
    column: thase1
    label: "Stage of treatment resistance of Thase and Rush, from 1 to 5"
    type: item
    range: [1, 5]
