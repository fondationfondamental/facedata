instrument: amiel_lebigre_fu
title: Life events questionnaire (Amiel-Lebigre), follow-up form
tab: HETERO-QUESTIONNAIRES
section: AMIEL-LEBIGRE (Questionnaire d'évènement de vie, Amiel-Lebigre et al.,2005)
status: reviewed
notes: >
  The life-events questionnaire of Amiel-Lebigre asked again at follow-up
  (form 210): the 53 events of amiel_lebigre_v0, each answered 1 (yes) or 0
  (no), and for a yes "when", chosen in a list of two (six months, one
  year). Filled at 157 follow-up visits from 2013 (98 of the 146 visits of
  24 months, 56 of the 69 of 48 months, 2 at 36 months and 1 at 60 months);
  153 answer all 53 events, with a median of 1 event (mean 2.0, at most 16).

  It is one form shown at 24 and 48 months (visit types 6 and 8; decision
  D60 in PROGRESS.md) and written in the same columns as the inclusion form:
  see amiel_lebigre_v0 for the wording of the events, the two forms and
  their notes. The second column holds the code of the list, 1 six months or
  2 one year, on all 309 events answered yes at follow-up (delivered as a
  category; no other code is ever found at a follow-up visit). The follow-up
  form has no change gate: an empty form means not done. The median gap to
  the previous visit of the same patient that answered the questionnaire is
  748 days (124 visits), longer than the longest option of the list: the
  options stop at one year, so the answers read as the last year at most and
  not as the whole interval since the previous visit; they are not delivered
  as "since the last visit".

  amiel_events_fu is the number of events answered yes, when the 53 are
  answered (153 visits). The inclusion count (amiel_events, 330 visits)
  covers up to the whole life and cannot be compared with it.

  An instrument of the TRD cohort only.

