instrument: etat_maniaque
title: Manic symptoms present at the visit (DSM-IV checklist)
tab: HETERO-QUESTIONNAIRES
section: Episode maniaque actuel
status: reviewed
notes: >
  A checklist of the nine symptoms of a DSM-IV manic episode (two mood items
  and seven symptoms), filled at the inclusion visit (598 visits) and at the
  follow-up visits (859), and once at screening. The form says to fill it
  whatever the mood state and to tick the symptoms present: it lists the
  symptoms present at the visit, it is not an episode and not a diagnosis
  (the dictionary calls it one: request R144). Nine symptoms, answered 1
  (yes), 0 (no) or 2 ("does not know", a missing code); the extraction of BP
  writes Y, N and U. The block (ETAT20 to ETAT28) is the same in forms 128,
  182 and 183, and the labels here follow the BP wording. No count of
  symptoms is stored here (the BP count is the application's own, computed
  on a button): etatm_total is the number of symptoms present, when the nine
  are answered yes or no (1,432 visits; 19 visits have a "does not know" and
  get no count). Manic symptoms are rare in this cohort, irritable mood
  apart (155 visits; elevated mood on 10).

  The count is the number of symptoms ticked, not a measure of mania: a count
  of 3 or more is met on 23 of the 1,432 counts, and the rule of criterion B
  (a mood item and 3 of the 7 other symptoms, 4 if the mood is only
  irritable; scale_reference.md, section 25, the DSM-IV-TR counts to verify)
  on 8. The duration is not asked.

  Same instrument as in FACE BP, with the coding of the TRD extraction.

defaults: {type: item, range: [0, 1], missing: {"2": unknown}}

variables:
  etatm01: {label: "Humeur élevée, expansive"}
  etatm02: {label: "Humeur irritable"}
  etatm03: {label: "Augmentation de l'estime de soi ou idées de grandeur"}
  etatm04: {label: "Réduction du besoin de sommeil"}
  etatm05: {label: "Plus grande communicabilité que d'habitude ou désir de parler constamment"}
  etatm06: {label: "Fuite des idées ou sensation subjective que les pensées défilent"}
  etatm07: {label: "Distractibilité : l'attention du sujet étant trop facilement attirée par des stimuli extérieurs sans pertinence"}
  etatm08: {label: "Activité dirigée vers un but ou impatience motrice : augmentation de l'activité ou agitation psychomotrice"}
  etatm09: {label: "Implication excessive dans des activités qui ont un potentiel élevé de conséquences dommageables quoique non reconnues par le patient"}

scores:
  etatm_total:
    label: "Number of manic symptoms present (0 to 9)"
    sum: [etatm01, etatm02, etatm03, etatm04, etatm05, etatm06,
          etatm07, etatm08, etatm09]
