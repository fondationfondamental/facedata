instrument: isf_lifetime
title: "Suicidal ideation and attempts over the whole life (inclusion form)"
tab: SUICIDE
section: Intentionnalité suicidaire actuelle
status: reviewed
notes: >
  The BP schema with the codes of this extraction. Five questions on
  suicidal ideation and attempts over the whole life ("have you ever...",
  form 145), each with "when last", at the inclusion visit: 452 visits.
  The form says "ever" and prints no period.

  Share of inclusions that hold it: 96% to 99% in 2013-2016, 73% in 2017,
  then 45% to 72% a year. Since 2018 the Columbia scale replaces it in
  part of the centres (cssrs_v0.yaml, which stays at 75% to 98%): about
  14% of the inclusions of seven centres hold the ISF since 2018, against
  84% at seven others (missing by centre, open question O25).

  The data dictionary says the form is asked at "VISITES v0". It is also
  asked at 24 and 48 months (isf_lifetime_fu.yaml). The inclusion visit and
  the follow-up visits use the same columns, and the two are never
  delivered in one column: visit_form says which form a visit uses
  (inclusion for the screening and inclusion visits, follow_up for the
  others), and each form has its own schema and its own variables. One
  screening row holds the form (9 cells) and repeats the answers of the
  inclusion visit of the same patient: it is delivered as a second
  inclusion visit, because the version block is the same in every schema
  of the cohort and cannot drop the screening visit in this one alone.

  Open question O25(1), what period the answers cover, is answered by the
  form: the wording is "ever" (lifetime). The raters read it both ways at
  follow-up (isf_lifetime_fu.yaml).

  "When last" is stored 0, 1 and 2, as the dictionary says: last week,
  between two weeks and a year ago, more than a year ago. The answers of
  the two cohorts have the same profile (the share of yes on the five
  questions follows BP).

version:
  name: visit_form
  column: visit
  codes:
    screening: inclusion
    V0: inclusion
    V6_mois: follow_up
    V1_an: follow_up
    V18_mois: follow_up
    V2_ans: follow_up
    V30_mois: follow_up
    V3_ans: follow_up
    V4_ans: follow_up
    V5_ans: follow_up

defaults: {type: item, range: [0, 1], versions: [inclusion]}

variables:
  isf01_lifetime: {column: isf01, label: "Felt that life is not worth living - ever"}
  isf01_lifetime_when: {column: isf01a, type: category, label: "Felt that life is not worth living - when last", codes: {"0": last_week, "1": two_weeks_to_a_year, "2": over_a_year}}
  isf02_lifetime: {column: isf02, label: "Wished to be dead - ever"}
  isf02_lifetime_when: {column: isf02a, type: category, label: "Wished to be dead - when last", codes: {"0": last_week, "1": two_weeks_to_a_year, "2": over_a_year}}
  isf03_lifetime: {column: isf03, label: "Thought of taking own life - ever"}
  isf03_lifetime_when: {column: isf03a, type: category, label: "Thought of taking own life - when last", codes: {"0": last_week, "1": two_weeks_to_a_year, "2": over_a_year}}
  isf04_lifetime: {column: isf04, label: "Seriously considered or planned suicide - ever"}
  isf04_lifetime_when: {column: isf04a, type: category, label: "Seriously considered or planned suicide - when last", codes: {"0": last_week, "1": two_weeks_to_a_year, "2": over_a_year}}
  isf05_lifetime: {column: isf05, label: "Attempted suicide - ever"}
  isf05_lifetime_when: {column: isf05a, type: category, label: "Attempted suicide - when last", codes: {"0": last_week, "1": two_weeks_to_a_year, "2": over_a_year}}
