instrument: episode_described
title: "One depressive episode described at inclusion"
tab: EVALUATION MEDICALE
section: Episodes
status: reviewed
notes: >
  One episode described at the inclusion visit: its number, its length, and
  whether it was treated, resistant, hospitalised, with psychotic or mixed
  features, seasonal, followed by a full remission. 221 inclusion visits
  (220 with the number of the episode): 42% to 59% of the inclusion visits
  of each year from 2012 to 2017 (45% in all, 122 of 271) and 18% to 37% of
  those of 2018 to 2026 (27%, 98 of 363). Not in BP or SZ. No rename: the
  table is headed "Episodes" in form 116, not "depressive", and its
  questions (resistant, recurrence under treatment, switch under an
  antidepressant) are those of a depressive episode; which episode a row
  describes is not stated (low confidence, the name stays).

  One row per visit reaches the extraction, although the form is a table
  with an add-row button and no limit (episode numbers 1 to 20: 1 on 102
  visits, 2 on 55, 3 on 36, 4 on 14). The export keeps one arbitrary row
  per visit (face_dr_10 lines 5-7: select distinct on (usubjid, visitnum)
  with no ORDER BY): the number typed on the row kept is 1 on only 102 of
  220 rows, so the pick is not the first episode. The other episodes of the
  form are lost to this extraction, not left out by the raters (the table
  of the application has a row id, EPISODE, that the clean model keeps:
  request R142, all rows). Answers O26(1).

  The counts of episodes of mood_history_v0 include the current episode (a
  single-episode course has a count of 1 on 58 of 70 visits, a recurrent
  course 2 or more on 256 of 270). The number of the episode described is
  above the total counted (depressive, hypomanic, manic and mixed) on 8 of
  213 visits, and the episode is ticked resistant with a resistant count of
  0 on 4 of 117 visits that have the count (123 resistant episodes in all).

  2 is "DM", missing data (29 cells).

defaults: {type: item}

variables:
  episode_number: {column: epi_num_epi, range: [1, 60], label: Number of the episode described}
  episode_months: {column: epi_duree, type: number, unit: months, range: [0, 600], winsor: false, label: Length of the episode}
  episode_hospitalised: {column: epi_hospi, range: [0, 1], missing: {"2": not_recorded}, label: Hospitalised during the episode}
  episode_resistant: {column: epi_resist, range: [0, 1], missing: {"2": not_recorded}, label: Resistant episode}
  episode_mixed: {column: epi_mixt, range: [0, 1], missing: {"2": not_recorded}, label: Mixed features}
  episode_psychotic: {column: epi_car_psycho, range: [0, 1], missing: {"2": not_recorded}, label: Psychotic features}
  episode_seasonal: {column: epi_car_sai, range: [0, 1], missing: {"2": not_recorded}, label: Seasonal pattern}
  episode_full_remission: {column: epi_remi_comp, range: [0, 1], missing: {"2": not_recorded}, label: Full remission}
  episode_treated: {column: epi_traite, range: [0, 1], missing: {"2": not_recorded}, label: Treated}
  episode_treatment_months: {column: duree_glob_trt, type: number, unit: months, range: [0, 600], winsor: false, label: Total length of the treatment}
  episode_recurrence_on_treatment: {column: epi_recur_depress, range: [0, 1], missing: {"2": not_recorded}, label: Depressive recurrence under treatment}
  episode_antidepressant_switch: {column: epi_vir_antid, range: [0, 1], missing: {"2": not_recorded}, label: Switch under an antidepressant}
  episode_months_since_previous: {column: epi_delais_epi_prec, type: number, unit: months, range: [0, 720], winsor: false, label: Time since the previous episode}
