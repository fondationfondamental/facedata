instrument: mood_history_v0
title: "Mood disorder over the whole life and current episode (inclusion form)"
tab: EVALUATION MEDICALE
section: HUMEUR VIE ENTIERE
status: reviewed
notes: >
  The mood disorder over the whole life and the current episode, at the
  inclusion visit: 635 rows (634 inclusion visits and 1 screening visit).
  This cohort has one form (117 for the kind of disorder, 116 for the
  episodes) and no column for the version: not the BP schemas, which are
  split by DSM edition.

  Names. The questions of form 116 on the first episode, the remission, the
  seasonal pattern, the first psychotropic treatment and the current episode
  are the ones of BP's DSM-IV form and are read from the same raw columns
  (agedebutpremier_episode, cetermpremier_episode, ppartpremier_episode,
  remisc, saison, agetrt, cesevtrouble_humeur_actuel,
  chrontrouble_humeur_actuel, pparttrouble_humeur_actuel): they carry BP's
  dsm4_ names. Two labels of form 116 say "selon critère DSM IV" (the mixed
  episodes and the severity of the current episode) and the form counts
  mixed episodes, as DSM-IV does. The counts of episodes are in the columns
  evnum_* here (BP's DSM-IV form reads evnum_*_lt) and take BP's
  dsm4_lt_n_ names. What BP does not have keeps its name (the age at the
  first episode treated or diagnosed, the resistant episodes, the partial
  remission, the delay, the weeks before a treatment). The specifier of the
  current depressive episode (none, melancholic, atypical, catatonic) takes
  BP's name dsm4_current_specifier: the same question and the same four
  answers, which BP reads from another raw column
  (cedecodtrouble_humeur_actuel_type; BP reads cedecodtrouble_humeur_actuel
  as the catatonic box, dsm4_current_catatonic). The hard
  limit of the counts is 50 here (the form takes two digits; the largest
  count of depressive episodes typed is 50, on one visit, then 23, 20 and
  20; the other counts are 10 or less); BP's limit is 20.

  Two forms in the same columns. The inclusion visit asks about the whole
  life; the follow-up visits use the same columns for the time since the
  last visit. The two are never delivered in one column: visit_form says
  which form a visit uses (inclusion for the screening and inclusion
  visits, follow_up for the others), and each form has its own schema and
  its own variables. The follow-up form (183) and form 116 never meet on a
  visit (no follow-up visit holds a cell that only form 116 writes, no
  inclusion visit one that only form 183 writes) although they share the
  evnum_* columns; the export takes the first non-empty of the two and its
  order is not the same for every count (face_dr_10 lines 26-36: form 116
  first for the depressive, resistant and hypomanic counts, form 183 first
  for the manic, mixed and induced ones).

  The visit. The kind of disorder (form 117) is answered on 625 of the 635
  rows (617 known, 8 "Ne sais pas"). Its answer to "specify the type" is
  also the gate of the menu: the page of form 116 is offered for the
  answers 1, 2, 3, 4 and 6 (config/global.php line 271: a gate of the menu,
  not of the questions) and all 625 answers are among them (no patient has
  the substance-induced one), but the page is saved on only 358 of them,
  and on 2 rows with an empty answer (38 cells, kept as recorded): 360 of
  the 635 rows (359 of the 634 inclusion visits). An empty page 116 means
  the page was not saved, not "no episode". No shown_if. armcd (the type of
  disorder of form 117, ignored.yaml) is 7, major depressive disorder, on
  every row: the other branches of form 117 never run in this cohort.

  The numbers of episodes (evnum_edm and the others) are counts over the
  whole life here: median 3 major depressive episodes, of which 1 resistant
  to two treatments or more. They include the current episode: a single
  episode has a count of 1 on 58 of 70 visits and a recurrent course 2 or
  more on 256 of 270 (note: the course says recurrent for 509 and single
  episode for 123 of the 632 visits that answer it). The same columns hold
  the counts since the last visit at follow-up (mood_course_fu.yaml).
  The three numbers with psychotic features (depressive, manic, mixed) have
  no yes/no question here (BP asks one): a number of episodes of the kind
  that is 0 gives 0 for the psychotic ones (asked_if, decision D122: with no
  manic episode no manic episode had psychotic features): 4, 302 and 299
  cells missing become 0. Where the number of episodes of the kind is
  above 0 and the psychotic one is empty it stays missing (49 depressive
  visits). One manic psychotic number is typed under a manic count of 0 and
  stays as typed (flagged check_failed, not_above).

  Codes are those of the form (forms 116 and 117 give the lists). The type
  of the first episode has 0 to 6 and 7, "Ne sais pas", a missing code. The
  extraction also holds 8 and 9 on 21 visits (15 "resistant", 6 "not
  resistant", visits of 2013 to 2017): they are not in the list of the form
  and not the type of an episode, so they are missing here (not_recorded,
  missing_code). The resistance of the first episode is the radio
  TYPE_PREM_EPIR of form 116 (1 resistant, 2 not resistant), in the table
  and the clean model but not in the export: request R142. "Not known" is a
  missing code (62 cells before this change, 83 with the 21 above). The
  current episode is severe on 234 of 342 inclusion visits (217 without,
  15 with congruent and 2 with incongruent psychotic features) and lasts
  for more than two years on 238 of 343.

  The delay. DELAI_CHRONO_EPI is headed "Délai", in weeks, hint "Max 52",
  two characters (ecedr.sql); the form never says a delay of what. It is
  filled on 142 rows and equals the weeks before a treatment of the current
  episode on 52 of the 130 rows that have both. The hard limit is 52, the
  hint: two values (80 and 90) are out of range.

  Ages are numbers of years (whole numbers, two characters in the form),
  never winsorised.

  Consistency (aggregates, inclusion visits). No age is above the age at
  the visit. The first psychotropic treatment comes before the declared
  first episode on 14 of 340 visits (12 by two years or more) and before
  the first episode treated or diagnosed on 21 of 338 (18 by two years or
  more); the treated or diagnosed age is below the declared age on 1 of
  348. A psychotropic can precede the first mood episode: not an error by
  itself. The resistant count is above the depressive count on 2 visits
  (flagged check_failed, not_above; the three ages are checked against the
  age at the visit in the same way).
  The first episode is a major depressive one with a depressive count of 0
  on 4 visits, and of the 18 first episodes with psychotic features 4 have a
  psychotic depressive count of 0. A current postpartum episode is ticked
  yes on 1 of 141 men.

version:
  name: visit_form
  column: visit
  codes:
    screening: inclusion
    V0: inclusion
    V6_mois: follow_up
    V1_an: follow_up
    V18_mois: follow_up
    V2_ans: follow_up
    V30_mois: follow_up
    V3_ans: follow_up
    V4_ans: follow_up
    V5_ans: follow_up

defaults: {type: item, versions: [inclusion]}

variables:
  mdd_course: {column: mhmodify_type_trouble_tdm, type: category, label: Major depressive disorder - single episode or recurrent, codes: {"0": single_episode, "1": recurrent}}
  mood_disorder_type:
    column: mhdecod_type_trouble_tts
    type: category
    label: Kind of mood disorder
    codes: {"1": major_depression_like, "2": depressive_features, "3": manic_features, "4": mixed_features, "5": substance_induced}
    missing: {"6": unknown}
  dsm4_first_episode_type:
    column: cetermpremier_episode
    type: category
    label: Type of the first mood episode (DSM-IV)
    codes: {"0": mde, "1": mde_psychotic, "2": hypomania, "3": mania, "4": mania_psychotic, "5": mixed, "6": mixed_psychotic}
    missing: {"7": unknown, "8": not_recorded, "9": not_recorded}
  dsm4_first_episode_age: {column: agedebutpremier_episode, type: number, unit: years, range: [0, 90], winsor: false, label: Age at the first mood episode (the age declared), not_above: age}
  first_treated_episode_age: {column: agediagpremier_episode, type: number, unit: years, range: [0, 90], winsor: false, label: Age at the first episode treated or diagnosed, not_above: age}
  dsm4_first_episode_postpartum: {column: ppartpremier_episode, range: [0, 1], codes: {"1": 1, "2": 0}, missing: {"3": unknown}, label: First episode in the six months after a birth}
  dsm4_lt_n_mde: {column: evnum_edm, type: number, range: [0, 50], winsor: false, label: Number of major depressive episodes over the whole life}
  dsm4_lt_n_mde_psychotic: {column: evnum_edm_psy, type: number, range: [0, 50], winsor: false, asked_if: dsm4_lt_n_mde, label: Number of major depressive episodes with psychotic features over the whole life, not_above: dsm4_lt_n_mde}
  n_resistant_episodes_lifetime: {column: evnum_edr, type: number, range: [0, 50], winsor: false, label: Number of depressive episodes resistant to two treatments or more over the whole life, not_above: dsm4_lt_n_mde}
  dsm4_lt_n_hypomania: {column: evnum_ehman, type: number, range: [0, 50], winsor: false, label: Number of hypomanic episodes over the whole life}
  dsm4_lt_n_mania: {column: evnum_eman, type: number, range: [0, 50], winsor: false, label: Number of manic episodes over the whole life}
  dsm4_lt_n_mania_psychotic: {column: evnum_eman_psy, type: number, range: [0, 50], winsor: false, asked_if: dsm4_lt_n_mania, label: Number of manic episodes with psychotic features over the whole life, not_above: dsm4_lt_n_mania}
  dsm4_lt_n_mixed: {column: evnum_emixt, type: number, range: [0, 50], winsor: false, label: Number of mixed episodes over the whole life}
  dsm4_lt_n_mixed_psychotic: {column: evnum_emixt_psy, type: number, range: [0, 50], winsor: false, asked_if: dsm4_lt_n_mixed, label: Number of mixed episodes with psychotic features over the whole life, not_above: dsm4_lt_n_mixed}
  dsm4_lt_n_induced: {column: evnum_eind, type: number, range: [0, 50], winsor: false, label: Number of induced episodes over the whole life}
  dsm4_lt_full_remission: {column: remisc, range: [0, 1], missing: {"2": unknown}, label: Full remission between the episodes}
  partial_remission_between_episodes: {column: remisinc, range: [0, 1], missing: {"2": unknown}, label: Partial remission between the episodes}
  dsm4_lt_seasonal: {column: saison, range: [0, 1], missing: {"2": unknown}, label: Seasonal pattern}
  dsm4_lt_first_treatment_age: {column: agetrt, type: number, unit: years, range: [0, 90], winsor: false, label: Age at the first psychotropic treatment, not_above: age}
  treatment_delay_weeks: {column: delai, type: number, unit: weeks, range: [0, 52], winsor: false, label: "Delay, in weeks (the form says only 'Delai', maximum 52: of what is not stated)"}
  current_episode_untreated_weeks: {column: dureetrouble_humeur_actuel, type: number, unit: weeks, range: [0, 1040], winsor: false, label: Length of the current episode before a treatment was started}
  dsm4_current_specifier:
    column: cedecodtrouble_humeur_actuel
    type: category
    label: "Current episode, if depressive: specifier"
    codes: {"0": none, "1": melancholic, "2": atypical, "3": catatonic}
  dsm4_current_severity:
    column: cesevtrouble_humeur_actuel
    type: category
    label: Severity of the current episode (DSM-IV)
    codes: {"0": mild, "1": moderate, "2": severe, "3": severe_psychotic_congruent, "4": severe_psychotic_incongruent}
  dsm4_current_chronic: {column: chrontrouble_humeur_actuel, range: [0, 1], missing: {"2": unknown}, label: Current episode longer than two years}
  dsm4_current_postpartum: {column: pparttrouble_humeur_actuel, range: [0, 1], missing: {"2": unknown}, label: Current episode in the six months after a birth}
