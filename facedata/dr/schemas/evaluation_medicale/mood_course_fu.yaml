instrument: mood_course_fu
title: "Mood episodes since the last visit (follow-up form)"
tab: EVALUATION MEDICALE
section: Caractéristiques
status: draft
notes: >
  The mood episodes since the last visit, at the follow-up visits: 836
  visits (88% to 97% of the visits of each kind).

  Two forms in the same columns. The inclusion visit asks about the whole
  life; the follow-up visits use the same columns for the time since the
  last visit. The two are never delivered in one column: visit_form says
  which form a visit uses (inclusion for the screening and inclusion
  visits, follow_up for the others), and each form has its own schema and
  its own variables.

  A major depressive episode since the last visit on 327 of 809 visits, a
  resistant one on 252 of 796, a suicide attempt on 44 of 796.

  Four columns that the dictionary does not list (etat_epi_maj,
  fetat_epi_edm, etat_epi_depress, etat_sui_nb) are the fields of the
  follow-up form: they equal evnum_edm, evnum_edm_psy, evnum_edr and
  evnum_suicid on every follow-up visit and are not read (ignored.yaml).

version:
  name: visit_form
  column: visit
  codes:
    screening: inclusion
    V0: inclusion
    V6_mois: follow_up
    V1_an: follow_up
    V18_mois: follow_up
    V2_ans: follow_up
    V30_mois: follow_up
    V3_ans: follow_up
    V4_ans: follow_up
    V5_ans: follow_up

defaults: {type: item, versions: [follow_up]}

variables:
  n_mde_since_visit: {column: evnum_edm, type: number, range: [0, 60], winsor: false, label: Number of major depressive episodes since the last visit}
  n_mde_psychotic_since_visit: {column: evnum_edm_psy, type: number, range: [0, 60], winsor: false, label: Number of major depressive episodes with psychotic features since the last visit}
  n_resistant_episodes_since_visit: {column: evnum_edr, type: number, range: [0, 60], winsor: false, label: Number of depressive episodes resistant to two treatments or more since the last visit}
  n_hypomanic_since_visit: {column: evnum_ehman, type: number, range: [0, 60], winsor: false, label: Number of hypomanic episodes since the last visit}
  manic_psychotic_since_visit: {column: mhoccur_eman_psy, range: [0, 1], missing: {"2": unknown}, label: A manic episode with psychotic features since the last visit}
  n_manic_psychotic_since_visit: {column: evnum_eman_psy, type: number, range: [0, 60], winsor: false, label: Number of manic episodes with psychotic features since the last visit}
  n_mixed_since_visit: {column: evnum_emixt, type: number, range: [0, 60], winsor: false, label: Number of mixed episodes since the last visit}
  induced_episode_since_visit: {column: mhoccur_eind, range: [0, 1], missing: {"2": unknown}, label: An induced episode since the last visit}
  n_induced_since_visit: {column: evnum_eind, type: number, range: [0, 60], winsor: false, label: Number of induced episodes since the last visit}
  n_attempts_since_visit: {column: evnum_suicid, type: number, range: [0, 50], winsor: false, label: Number of suicide attempts since the last visit}
