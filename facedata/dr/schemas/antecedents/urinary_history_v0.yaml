instrument: urinary_history_v0
title: "Urinary history, at inclusion"
tab: ANTECEDENTS
section: Pathologies des voies urinaires
status: draft
notes: >
  The BP schema with the columns and the codes of this extraction, at the
  inclusion visit: 589 visits (88% to 96% of the inclusions in every period).

  Two forms in the same columns, as in BP: the inclusion visit, and the
  visits of 2 and 4 years, where the same questions are asked again.
  visit_form says which form a visit uses, and each form has its own schema
  and its own variables (_v0 and _fu). Whether the follow-up answers are
  about the whole life or about the time since the last visit is not
  written anywhere; they are never mixed with the inclusion answers.

  Answers are numbers here (1 yes, 0 no; 2 is "not known" where it occurs),
  where BP has words. "Treated" and "controlled" are in columns named
  _tr_mhdecod and _eq_mhdecod. Dates are whole dates.

  The causes of a urinary retention are three boxes that the form
  sets to 0 on every row: flagged derived_doubt where the question on the
  retention is empty.

version:
  name: visit_form
  column: visit
  codes:
    screening: inclusion
    V0: inclusion
    V6_mois: follow_up
    V1_an: follow_up
    V18_mois: follow_up
    V2_ans: follow_up
    V30_mois: follow_up
    V3_ans: follow_up
    V4_ans: follow_up
    V5_ans: follow_up

defaults: {versions: [inclusion]}

variables:
  nephropathy_v0: {column: nephropat_mhoccur, type: item, range: [0, 1], missing: {"2": unknown}, label: "Nephropathy, at inclusion"}
  nephropathy_start_v0: {column: nephropat_mhstdtc, type: date, range: [1900-01-01, 2026-12-31], label: "Nephropathy: date of onset, at inclusion"}
  nephropathy_treated_v0: {column: nephropat_tr_mhdecod, type: item, range: [0, 1], missing: {"2": unknown}, label: "Nephropathy: treated, at inclusion"}
  nephropathy_controlled_v0: {column: nephropat_eq_mhdecod, type: item, range: [0, 1], missing: {"2": unknown}, label: "Nephropathy: controlled, at inclusion"}
  nephropathy_treatment_related_v0: {column: nephropat_mhmodify, type: item, range: [0, 1], missing: {"2": unknown}, label: "Nephropathy: probably linked to a past or current treatment, at inclusion"}
  prostate_adenoma_v0: {column: adenompro_mhoccur, type: item, range: [0, 1], missing: {"2": unknown}, label: "Prostate adenoma, at inclusion"}
  prostate_adenoma_start_v0: {column: adenompro_mhstdtc, type: date, range: [1900-01-01, 2026-12-31], label: "Prostate adenoma: date of onset, at inclusion"}
  prostate_adenoma_treated_v0: {column: adenompro_tr_mhdecod, type: item, range: [0, 1], missing: {"2": unknown}, label: "Prostate adenoma: treated, at inclusion"}
  prostate_adenoma_controlled_v0: {column: adenompro_eq_mhdecod, type: item, range: [0, 1], missing: {"2": unknown}, label: "Prostate adenoma: controlled, at inclusion"}
  urinary_retention_v0: {column: returin_mhoccur, type: item, range: [0, 1], missing: {"2": unknown}, label: "Acute urinary retention, at inclusion"}
  urinary_retention_start_v0: {column: returin_mhstdtc, type: date, range: [1900-01-01, 2026-12-31], label: "Acute urinary retention: date of onset, at inclusion"}
  urinary_retention_under_treatment_v0: {column: returin_mhmodify, type: item, range: [0, 1], missing: {"2": unknown}, label: "Acute urinary retention: started under a treatment, at inclusion"}
  urinary_retention_neuroleptic_v0: {column: returin_1_mhdecod, type: item, range: [0, 1], missing: {"2": unknown}, derived_from: urinary_retention_v0, label: "Acute urinary retention, the treatment: a neuroleptic, at inclusion"}
  urinary_retention_antidepressant_v0: {column: returin_2_mhdecod, type: item, range: [0, 1], missing: {"2": unknown}, derived_from: urinary_retention_v0, label: "Acute urinary retention, the treatment: an antidepressant, at inclusion"}
  urinary_retention_other_treatment_v0: {column: returin_3_mhdecod, type: item, range: [0, 1], missing: {"2": unknown}, derived_from: urinary_retention_v0, label: "Acute urinary retention, the treatment: another treatment, at inclusion"}
