  n_miscarriages_v0: {column: spabortn_rporres, type: item, range: [0, 30], asked_if: n_pregnancies_v0, label: "Number of miscarriages, at inclusion"}
  n_abortions_v0: {column: nb_ivg_rporres, type: item, range: [0, 30], asked_if: n_pregnancies_v0, label: "Number of voluntary terminations of pregnancy, at inclusion"}
  n_medical_terminations_v0: {column: nb_itg_rporres, type: item, range: [0, 30], asked_if: n_pregnancies_v0, label: "Number of terminations of pregnancy for a medical reason, at inclusion"}
  menopause_v0: {column: menostat_rporres, type: item, range: [0, 1], label: "Menopause, at inclusion"}
  menopause_date_v0: {column: menostat_rpdtc, type: date, range: [1900-01-01, today], label: "Menopause: date, at inclusion"}
  menopause_hormone_therapy_v0: {column: hormonal_rporres, type: item, range: [0, 1], label: "Hormonal treatment (asked whether or not in menopause), at inclusion"}
  menopause_hormone_therapy_start_v0: {column: hormonal_rpdtc, type: date, range: [1900-01-01, today], label: "Menopause: start of the hormone therapy, at inclusion"}
  gynaecological_disease_v0: {column: gyneco_rporres, type: item, range: [0, 1], label: "Gynaecological disease other than a cancer, at inclusion"}
  gynaecological_disease_text_v0: {column: gynecosp_rporres, type: text, label: "Gynaecological disease: which one, as written, at inclusion"}
