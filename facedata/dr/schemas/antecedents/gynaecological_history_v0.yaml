instrument: gynaecological_history_v0
title: "Gynaecological history, at inclusion"
tab: ANTECEDENTS
section: Antécédents gynécologiques
status: draft
notes: >
  The BP schema with the columns and the codes of this extraction, at the
  inclusion visit: 331 visits (45% to 59% of the inclusions in every period).

  Two forms in the same columns, as in BP: the inclusion visit, and the
  visits of 2 and 4 years, where the same questions are asked again.
  visit_form says which form a visit uses, and each form has its own schema
  and its own variables (_v0 and _fu). Whether the follow-up answers are
  about the whole life or about the time since the last visit is not
  written anywhere; they are never mixed with the inclusion answers.

  Answers are numbers here (1 yes, 0 no; 2 is "not known" where it occurs),
  where BP has words. "Treated" and "controlled" are in columns named
  _tr_mhdecod and _eq_mhdecod. Dates are whole dates.

  Asked of women: about half of the inclusions. The numbers of pregnancies, births, miscarriages and terminations are numbers, as in BP.

version:
  name: visit_form
  column: visit
  codes:
    screening: inclusion
    V0: inclusion
    V6_mois: follow_up
    V1_an: follow_up
    V18_mois: follow_up
    V2_ans: follow_up
    V30_mois: follow_up
    V3_ans: follow_up
    V4_ans: follow_up
    V5_ans: follow_up

defaults: {versions: [inclusion]}

variables:
  n_pregnancies_v0: {column: pregnn_rporres, type: item, range: [0, 30], label: "Number of pregnancies, at inclusion"}
  n_live_births_v0: {column: brthlvn_rporres, type: item, range: [0, 30], asked_if: n_pregnancies_v0, label: "Number of children born alive, at inclusion"}
  n_miscarriages_v0: {column: spabortn_rporres, type: item, range: [0, 30], asked_if: n_pregnancies_v0, label: "Number of miscarriages, at inclusion"}
  n_abortions_v0: {column: nb_ivg_rporres, type: item, range: [0, 30], asked_if: n_pregnancies_v0, label: "Number of voluntary terminations of pregnancy, at inclusion"}
  n_medical_terminations_v0: {column: nb_itg_rporres, type: item, range: [0, 30], asked_if: n_pregnancies_v0, label: "Number of terminations of pregnancy for a medical reason, at inclusion"}
  menopause_v0: {column: menostat_rporres, type: item, range: [0, 1], missing: {"2": unknown}, label: "Menopause, at inclusion"}
  menopause_date_v0: {column: menostat_rpdtc, type: date, range: [1900-01-01, 2026-12-31], label: "Menopause: date, at inclusion"}
  menopause_hormone_therapy_v0: {column: hormonal_rporres, type: item, range: [0, 1], missing: {"2": unknown}, asked_if: menopause_v0, label: "Menopause: hormone therapy, at inclusion"}
  menopause_hormone_therapy_start_v0: {column: hormonal_rpdtc, type: date, range: [1900-01-01, 2026-12-31], label: "Menopause: start of the hormone therapy, at inclusion"}
  gynaecological_disease_v0: {column: gyneco_rporres, type: item, range: [0, 1], missing: {"2": unknown}, label: "Gynaecological disease other than a cancer, at inclusion"}
  gynaecological_disease_text_v0: {column: gynecosp_rporres, type: text, label: "Gynaecological disease: which one, as written, at inclusion"}
