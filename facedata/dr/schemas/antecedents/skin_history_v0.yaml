  psoriasis_treated_v0: {column: psoriasis_tr_mhdecod, type: item, range: [0, 1], missing: {"2": unknown}, label: "Psoriasis: treated, at inclusion"}
  psoriasis_controlled_v0: {column: psoriasis_eq_mhdecod, type: item, range: [0, 1], missing: {"2": unknown}, label: "Psoriasis: controlled, at inclusion"}
  psoriasis_triggered_by_lithium_v0: {column: psoriasis_decl_mhmodify, type: item, range: [0, 1], missing: {"2": unknown}, asked_if: psoriasis_lithium_v0, label: "Psoriasis: triggered by lithium, at inclusion"}
