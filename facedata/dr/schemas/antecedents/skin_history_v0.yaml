  hair_loss_triggered_by_valproate_v0: {column: cheveux_decl_mhmodify, type: item, range: [0, 1], missing: {"2": unknown}, asked_if: hair_loss_valproate_v0, label: "Major hair loss: triggered by valproic acid, at inclusion"}
  hair_loss_worsened_by_valproate_v0: {column: cheveux_agg_mhmodify, type: item, range: [0, 1], missing: {"2": unknown}, asked_if: hair_loss_valproate_v0, label: "Major hair loss: worsened by valproic acid, at inclusion"}
