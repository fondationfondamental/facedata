instrument: cardiovascular_history_fu
title: "Cardiovascular history, at follow-up"
tab: ANTECEDENTS
section: Pathologies cardio-vasculaires
status: reviewed
notes: >
  The BP schema with the columns and the codes of this extraction, at the
  visits of 2 and 4 years: 130 visits. The questions and what is specific to
  this cohort are described in cardiovascular_history_v0.yaml.

  Two forms in the same columns, as in BP: the inclusion visit (form 164 of
  the application) and the visits of 2 and 4 years (form 191), where the same
  questions are asked again. visit_form says which form a visit uses, and each
  form has its own schema and its own variables (_v0 and _fu). A follow-up
  answer is a yearly update (BP D84): an answer given at that visit on the
  inclusion form asked again, with no period in the wording of the questions.
  It is neither a history of the whole life nor strictly an answer about the
  time since the last visit, and it is never mixed with the inclusion answers.
  Form 191 has no question "is there a change since the last visit?" (BP and
  SZ have one, which the extraction does not hold): the whole block is asked
  again. The block is filled at 90 of 146 visits of 2 years, 36 of 69 visits
  of 4 years, 3 of 4 of 5 years, 1 of 3 of 3 years and 1 of 298 six-monthly
  visits, and at none of the 253 visits of 1 year and the 150 of 18 months.
  Form 191 is form 164 without the perinatal block and with no period wording.

  Answers are numbers here (1 yes, 0 no), where BP has words. The forms offer
  only Oui and Non: no cell holds "not known" and none is read. "Treated" and
  "controlled" are in columns named _tr_mhdecod and _eq_mhdecod. Dates are
  whole dates.

  Form 191 has a date for another cardiovascular disease (field C44, wired
  under the same question); form 164 has none. The extraction holds no column
  for it: about 4 cells at follow-up (4 yes), a request for the export.

version:
  name: visit_form
  column: visit
  codes:
    screening: inclusion
    V0: inclusion
    V6_mois: follow_up
    V1_an: follow_up
    V18_mois: follow_up
    V2_ans: follow_up
    V30_mois: follow_up
    V3_ans: follow_up
    V4_ans: follow_up
    V5_ans: follow_up

defaults: {versions: [follow_up]}

variables:
  hypertension_fu: {column: hta_mhoccur, type: item, range: [0, 1], label: "Hypertension, at follow-up"}
  hypertension_start_fu: {column: hta_mhstdtc, type: date, range: [1900-01-01, today], label: "Hypertension: date of onset, at follow-up"}
  hypertension_treated_fu: {column: hta_tr_mhdecod, type: item, range: [0, 1], label: "Hypertension: treated, at follow-up"}
  hypertension_controlled_fu: {column: hta_eq_mhdecod, type: item, range: [0, 1], label: "Hypertension: controlled, at follow-up"}
  coronary_disease_fu: {column: coronar_mhoccur, type: item, range: [0, 1], label: "Coronary disease (excluding infarction), at follow-up"}
  coronary_disease_start_fu: {column: coronar_mhstdtc, type: date, range: [1900-01-01, today], label: "Coronary disease (excluding infarction): date of onset, at follow-up"}
  coronary_disease_treated_fu: {column: coronar_tr_mhdecod, type: item, range: [0, 1], label: "Coronary disease (excluding infarction): treated, at follow-up"}
  coronary_disease_controlled_fu: {column: coronar_eq_mhdecod, type: item, range: [0, 1], label: "Coronary disease (excluding infarction): controlled, at follow-up"}
  myocardial_infarction_fu: {column: infarctus_mhoccur, type: item, range: [0, 1], label: "Myocardial infarction, at follow-up"}
  myocardial_infarction_date_fu: {column: infarctus_mhstdtc, type: date, range: [1900-01-01, today], label: "Myocardial infarction: date of the event, at follow-up"}
  arrhythmia_fu: {column: trbrycard_mhoccur, type: item, range: [0, 1], label: "Heart rhythm disorder, at follow-up"}
  arrhythmia_start_fu: {column: trbrycard_mhstdtc, type: date, range: [1900-01-01, today], label: "Heart rhythm disorder: date of onset, at follow-up"}
  arrhythmia_treated_fu: {column: trbrycard_tr_mhdecod, type: item, range: [0, 1], label: "Heart rhythm disorder: treated, at follow-up"}
  arrhythmia_controlled_fu: {column: trbrycard_eq_mhdecod, type: item, range: [0, 1], label: "Heart rhythm disorder: controlled, at follow-up"}
  other_cardiovascular_fu: {column: autcardv_mhoccur, type: item, range: [0, 1], label: "Another cardiovascular disease, at follow-up"}
  other_cardiovascular_text_fu: {column: autcardv_mhmodify, type: text, label: "Another cardiovascular disease: which one, as written, at follow-up"}
