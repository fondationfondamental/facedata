instrument: cardiovascular_history_v0
title: "Cardiovascular history, at inclusion"
tab: ANTECEDENTS
section: Pathologies cardio-vasculaires
status: draft
notes: >
  The BP schema with the columns and the codes of this extraction, at the
  inclusion visit: 574 visits (86% to 93% of the inclusions in every period).

  Two forms in the same columns, as in BP: the inclusion visit, and the
  visits of 2 and 4 years, where the same questions are asked again.
  visit_form says which form a visit uses, and each form has its own schema
  and its own variables (_v0 and _fu). Whether the follow-up answers are
  about the whole life or about the time since the last visit is not
  written anywhere; they are never mixed with the inclusion answers.

  Answers are numbers here (1 yes, 0 no; 2 is "not known" where it occurs),
  where BP has words. "Treated" and "controlled" are in columns named
  _tr_mhdecod and _eq_mhdecod. Dates are whole dates.

  No date for another cardiovascular disease. Of the 20 follow-up visits of patients with hypertension at inclusion, 4 answer no.

version:
  name: visit_form
  column: visit
  codes:
    screening: inclusion
    V0: inclusion
    V6_mois: follow_up
    V1_an: follow_up
    V18_mois: follow_up
    V2_ans: follow_up
    V30_mois: follow_up
    V3_ans: follow_up
    V4_ans: follow_up
    V5_ans: follow_up

defaults: {versions: [inclusion]}

variables:
  hypertension_v0: {column: hta_mhoccur, type: item, range: [0, 1], missing: {"2": unknown}, label: "Hypertension, at inclusion"}
  hypertension_start_v0: {column: hta_mhstdtc, type: date, range: [1900-01-01, 2026-12-31], label: "Hypertension: date of onset, at inclusion"}
  hypertension_treated_v0: {column: hta_tr_mhdecod, type: item, range: [0, 1], missing: {"2": unknown}, label: "Hypertension: treated, at inclusion"}
  hypertension_controlled_v0: {column: hta_eq_mhdecod, type: item, range: [0, 1], missing: {"2": unknown}, label: "Hypertension: controlled, at inclusion"}
  coronary_disease_v0: {column: coronar_mhoccur, type: item, range: [0, 1], missing: {"2": unknown}, label: "Coronary disease, at inclusion"}
  coronary_disease_start_v0: {column: coronar_mhstdtc, type: date, range: [1900-01-01, 2026-12-31], label: "Coronary disease: date of onset, at inclusion"}
  coronary_disease_treated_v0: {column: coronar_tr_mhdecod, type: item, range: [0, 1], missing: {"2": unknown}, label: "Coronary disease: treated, at inclusion"}
  coronary_disease_controlled_v0: {column: coronar_eq_mhdecod, type: item, range: [0, 1], missing: {"2": unknown}, label: "Coronary disease: controlled, at inclusion"}
  myocardial_infarction_v0: {column: infarctus_mhoccur, type: item, range: [0, 1], missing: {"2": unknown}, label: "Myocardial infarction, at inclusion"}
  myocardial_infarction_date_v0: {column: infarctus_mhstdtc, type: date, range: [1900-01-01, 2026-12-31], label: "Myocardial infarction: date of the event, at inclusion"}
  arrhythmia_v0: {column: trbrycard_mhoccur, type: item, range: [0, 1], missing: {"2": unknown}, label: "Heart rhythm disorder, at inclusion"}
  arrhythmia_start_v0: {column: trbrycard_mhstdtc, type: date, range: [1900-01-01, 2026-12-31], label: "Heart rhythm disorder: date of onset, at inclusion"}
  arrhythmia_treated_v0: {column: trbrycard_tr_mhdecod, type: item, range: [0, 1], missing: {"2": unknown}, label: "Heart rhythm disorder: treated, at inclusion"}
  arrhythmia_controlled_v0: {column: trbrycard_eq_mhdecod, type: item, range: [0, 1], missing: {"2": unknown}, label: "Heart rhythm disorder: controlled, at inclusion"}
  other_cardiovascular_v0: {column: autcardv_mhoccur, type: item, range: [0, 1], missing: {"2": unknown}, label: "Another cardiovascular disease, at inclusion"}
  other_cardiovascular_text_v0: {column: autcardv_mhmodify, type: text, label: "Another cardiovascular disease: which one, as written, at inclusion"}
