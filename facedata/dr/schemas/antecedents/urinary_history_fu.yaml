instrument: urinary_history_fu
title: "Urinary history, at follow-up"
tab: ANTECEDENTS
section: Pathologies des voies urinaires
status: reviewed
notes: >
  The BP schema with the columns and the codes of this extraction, at the
  visits of 2 and 4 years: 131 visits. The questions and what is specific to
  this cohort are described in urinary_history_v0.yaml.

  Two forms in the same columns, as in BP: the inclusion visit (form 164 of
  the application) and the visits of 2 and 4 years (form 191), where the same
  questions are asked again. visit_form says which form a visit uses, and each
  form has its own schema and its own variables (_v0 and _fu). A follow-up
  answer is a yearly update (BP D84): an answer given at that visit on the
  inclusion form asked again, with no period in the wording of the questions.
  It is neither a history of the whole life nor strictly an answer about the
  time since the last visit, and it is never mixed with the inclusion answers.
  Form 191 has no question "is there a change since the last visit?" (BP and
  SZ have one, which the extraction does not hold): the whole block is asked
  again. The block is filled at 90 of 146 visits of 2 years, 36 of 69 visits
  of 4 years, 3 of 4 of 5 years, 1 of 3 of 3 years and 1 of 298 six-monthly
  visits, and at none of the 253 visits of 1 year and the 150 of 18 months.
  Form 191 is form 164 without the perinatal block and with no period wording.

  Answers are numbers here (1 yes, 0 no; 2 is "Ne sais pas" on the questions
  that offer it: the question on a nephropathy linked to lithium; no cell
  holds a 2), where BP has words. "Treated" and "controlled" are in columns
  named _tr_mhdecod and _eq_mhdecod. Dates are whole dates.

version:
  name: visit_form
  column: visit
  codes:
    screening: inclusion
    V0: inclusion
    V6_mois: follow_up
    V1_an: follow_up
    V18_mois: follow_up
    V2_ans: follow_up
    V30_mois: follow_up
    V3_ans: follow_up
    V4_ans: follow_up
    V5_ans: follow_up

defaults: {versions: [follow_up]}

variables:
  nephropathy_fu: {column: nephropat_mhoccur, type: item, range: [0, 1], missing: {"2": unknown}, label: "Nephropathy, at follow-up"}
  nephropathy_start_fu: {column: nephropat_mhstdtc, type: date, range: [1900-01-01, today], label: "Nephropathy: date of onset, at follow-up"}
  nephropathy_treated_fu: {column: nephropat_tr_mhdecod, type: item, range: [0, 1], missing: {"2": unknown}, label: "Nephropathy: treated, at follow-up"}
  nephropathy_controlled_fu: {column: nephropat_eq_mhdecod, type: item, range: [0, 1], missing: {"2": unknown}, label: "Nephropathy: controlled, at follow-up"}
  nephropathy_lithium_fu: {column: nephropat_mhmodify, type: item, range: [0, 1], missing: {"2": unknown}, label: "Nephropathy: probably linked to a past or current treatment by lithium, at follow-up"}
  prostate_adenoma_fu: {column: adenompro_mhoccur, type: item, range: [0, 1], missing: {"2": unknown}, label: "Prostate adenoma, at follow-up"}
  prostate_adenoma_start_fu: {column: adenompro_mhstdtc, type: date, range: [1900-01-01, today], label: "Prostate adenoma: date of onset, at follow-up"}
  prostate_adenoma_treated_fu: {column: adenompro_tr_mhdecod, type: item, range: [0, 1], missing: {"2": unknown}, label: "Prostate adenoma: treated, at follow-up"}
  prostate_adenoma_controlled_fu: {column: adenompro_eq_mhdecod, type: item, range: [0, 1], missing: {"2": unknown}, label: "Prostate adenoma: controlled, at follow-up"}
  urinary_retention_fu: {column: returin_mhoccur, type: item, range: [0, 1], missing: {"2": unknown}, label: "Acute urinary retention, at follow-up"}
  urinary_retention_start_fu: {column: returin_mhstdtc, type: date, range: [1900-01-01, today], label: "Acute urinary retention: date of onset, at follow-up"}
  urinary_retention_under_treatment_fu: {column: returin_mhmodify, type: item, range: [0, 1], missing: {"2": unknown}, label: "Acute urinary retention: started under a treatment, at follow-up"}
  urinary_retention_neuroleptic_fu: {column: returin_1_mhdecod, type: item, range: [0, 1], missing: {"2": unknown}, derived_from: urinary_retention_fu, label: "Acute urinary retention, the treatment: a neuroleptic, at follow-up"}
  urinary_retention_antidepressant_fu: {column: returin_2_mhdecod, type: item, range: [0, 1], missing: {"2": unknown}, derived_from: urinary_retention_fu, label: "Acute urinary retention, the treatment: an antidepressant, at follow-up"}
  urinary_retention_other_treatment_fu: {column: returin_3_mhdecod, type: item, range: [0, 1], missing: {"2": unknown}, derived_from: urinary_retention_fu, label: "Acute urinary retention, the treatment: another treatment, at follow-up"}
