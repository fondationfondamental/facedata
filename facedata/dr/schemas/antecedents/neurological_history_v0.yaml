  meningitis_v0: {column: meningite_mhoccur, type: item, range: [0, 1], missing: {"2": unknown}, label: "Meningitis, at inclusion"}
  meningitis_date_v0: {column: meningite_mhstdtc, type: date, range: [1900-01-01, 2026-12-31], label: "Meningitis: date of the event, at inclusion"}
  head_injury_v0: {column: traumacra_mhoccur, type: item, range: [0, 1], missing: {"2": unknown}, label: "Head injury, at inclusion"}
  head_injury_date_v0: {column: traumacra_mhstdtc, type: date, range: [1900-01-01, 2026-12-31], label: "Head injury: date of the event, at inclusion"}
  stroke_v0: {column: avc_mhoccur, type: item, range: [0, 1], missing: {"2": unknown}, label: "Stroke, at inclusion"}
