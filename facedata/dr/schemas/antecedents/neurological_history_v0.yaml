instrument: neurological_history_v0
title: "Neurological history, at inclusion"
tab: ANTECEDENTS
section: Pathologies neurologiques
status: reviewed
notes: >
  The BP schema with the columns and the codes of this extraction, at the
  inclusion visit: 575 visits (86% to 93% of the inclusions in every period).

  Two forms in the same columns, as in BP: the inclusion visit (form 164 of
  the application) and the visits of 2 and 4 years (form 191), where the same
  questions are asked again. visit_form says which form a visit uses, and each
  form has its own schema and its own variables (_v0 and _fu). A follow-up
  answer is a yearly update (BP D84): an answer given at that visit on the
  inclusion form asked again, with no period in the wording of the questions.
  It is neither a history of the whole life nor strictly an answer about the
  time since the last visit, and it is never mixed with the inclusion answers.
  Form 191 has no question "is there a change since the last visit?" (BP and
  SZ have one, which the extraction does not hold): the whole block is asked
  again. The block is filled at 90 of 146 visits of 2 years, 36 of 69 visits
  of 4 years, 3 of 4 of 5 years, 1 of 3 of 3 years and 1 of 298 six-monthly
  visits, and at none of the 253 visits of 1 year and the 150 of 18 months.
  Form 191 is form 164 without the perinatal block and with no period wording.

  Answers are numbers here (1 yes, 0 no), where BP has words. The forms offer
  only Oui and Non: no cell holds "not known" and none is read. "Treated" and
  "controlled" are in columns named _tr_mhdecod and _eq_mhdecod. Dates are
  whole dates.

  Every question of BP is here. A yearly answer updates the inclusion one: of
  the 25 follow-up visits of patients with migraine at inclusion, 16 answer
  no; head injury 9 of 9, epilepsy 3 of 3. Multiple sclerosis has no yes at
  inclusion (573 answers). The stroke question is empty on 14 inclusion forms
  that answer the other questions, 11 of them in 2013-15, where none of the
  153 answers is yes. The date of onset is empty under a yes for 24 of 112
  migraines at inclusion (nothing is required in the form).

  Year and centre (report). Only one centre has 20 answers or more on
  "treated" and on "controlled" of the migraine (110 and 108 answers): the
  centre shift of the report compares that one group with the whole and
  shows no pattern. The share of migraine itself is 3% to 39% by centre
  (14 centres, chi-square p = 0.0001) and 10% to 28% by year with no trend:
  a difference of centres (rater habit or case mix, the data cannot tell),
  not a step in time.

version:
  name: visit_form
  column: visit
  codes:
    screening: inclusion
    V0: inclusion
    V6_mois: follow_up
    V1_an: follow_up
    V18_mois: follow_up
    V2_ans: follow_up
    V30_mois: follow_up
    V3_ans: follow_up
    V4_ans: follow_up
    V5_ans: follow_up

