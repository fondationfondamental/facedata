# Instruments that FACE BP or FACE SZ also has and whose DR schema is not the same, each with the reason.
# tests/test_cohorts.py compares a DR schema with the BP schema of the same name, or with the SZ one
# when BP has none (defaults, variables, scores, version), and fails on a difference that is not listed here.

# PATIENT
identite: the diagnosis is that of the DR cohort; the day of birth is set to the 15th for the patients who keep another one; the stored age is not the age at inclusion, which is computed
provenance: two of the BP questions only; the referrer has other texts and the purpose of the visit is exported as a code that the dictionary does not explain

# HETERO-QUESTIONNAIRES
cgi_egf: the TRD extraction has the CGI severity and the GAF only (no improvement, no side effects, no efficacy index; the CGI-I of form 184 is not exported), the GAF is in the column egf_ and its box takes digits only, so no band is typed and the option bands is not set
etat_depressif: the answers are 1, 0 and 2 where BP writes Y, N and U; no stored count; each detail of reactivity, psychomotor change and thinking speed is two yes/no boxes (0 after a no to the symptom), and the weight and sleep details have a second form with one list whose option 3 is "ne sais pas"; the suicide item adds "or a specific plan" to the BP wording
etat_maniaque: the answers are 1, 0 and 2 where BP writes Y, N and U; no stored count
# fast: the schema is the BP one (a line here would fail test_shared_instruments_are_the_same_in_dr); the script of the DR application
#   (form 130) differs: it empties all six domain scores and the total when one item is blank, where the BP domain scripts sum each
#   domain alone, and the package follows the BP rule (273 domain cells on 59 partial visits that the DR script leaves empty; request A66)

# VITAL SIGN et ECG
ecg: the TRD extraction has no "ECG done" question

# BILAN BIOLOGIQUE
biochimie: the results are in columns named for the analyte; ferritin and the kind of CRP assay are added
bilan_lipidique: the results are in columns named for the analyte; the unit of HDL and LDL is exported as a code; no stored ratio
bilan_hepatique: the results are in columns named for the analyte
bilan_thyroidien: the results are in columns named for the analyte; the unit chosen on the form for the TSH, the free T3 and the free T4 is not exported (request R31), so only the size of a value tells its unit
nfs: the results are in columns named for the analyte; the unit of the haematocrit and of the MCHC is exported as a code
bhcg_prolactine: the results are in columns named for the analyte; the unit of prolactin is exported as a code (1 and 3 are ng/mL, 2 mUI/L, 4 is not in the dictionary), and a result typed in mg/L is found by its size
dosage_psychotropes: the columns and the boxes of the TRD form; five antidepressant levels that BP does not have; no clozapine, lamotrigine or red-cell lithium
vitamine_d: the unit is recorded and the result is delivered in nmol/L, where SZ has no unit; the form's "ng/L" holds values of the size of ng/mL and is read as ng/mL where the value fits that scale; the questions on sun exposure and supplements are not in the TRD extraction

# AUTO-QUESTIONNAIRES
bis10: eleven reverse-keyed items are stored already reversed and are read back to the answer as asked; the stored scores reverse them twice and are checked by twin scores that are not delivered
ctq: seven reverse-keyed items are stored already reversed and are read back to the answer as asked; the stored neglect scores and total reverse them twice and are checked by twin scores; no severity classes in the extraction
epworth: the eight situations are in the columns ess01 to ess08 (delivered under the BP names), the time of day in ess09 and the stored total in ess
eq5d: the extraction has no stored utility index (the index is computed from the answers, as in BP)
fagerstrom: item 3 is stored as the code of the answer (1 the first cigarette, 2 any other), read as 1 and 0 points
mars: the answers are stored 1 = yes, the opposite of BP, and are read on the BP coding; the stored total counts poor adherence and is checked by a twin score; no mars11
mathys: the DR form stored the scales as written in every year, so no item is turned and no period is left out (BP D91); the stored scores are still read to check ours
mathys_emotions: one free text more, "other emotions" (mathys28)
mdq: the extraction stores no count of symptoms to compare with
physical_activity: the columns are named qiap01a to qiap04bm
psqi: the questions on the bed partner (psqi10, psqi10a to psqi10f) are in this extraction and not in BP
stai_ya: the answers are stored on three codings (0 to 3, 1 to 4, 2 to 5); they are read as stored, not delivered, and delivered on the BP coding once the coding of the visit is known

# NEUROPSYCHOLOGIE
neuropsy_conditions: the columns are named cclin01 to cclin16 and hold codes; some questions are other ones (French as mother tongue, state compatible with the tests, number of testing days, a three-code psychotropic treatment)
learning_disorders: the answers are 0, 1 and 2 (not known); three more questions and the free text of the cognitive complaints
tmt: the kinds of errors are in eight columns and the totals are stored (the error z-scores are computed from them); three stored z-scores have the other sign and are only flagged sign_flipped; band labels cut by the export are written out; the B minus A z-score of the errors is computed (nothing is stored)
verbal_fluency: two forms of the test, read from fv01; only the words, the z-score and the band of each task are entered
wais4_similitudes: only the raw total, the scaled score and the z-score are entered; no column names the edition, which is read from the columns that are filled
wais4_memoire_chiffres: only the raw total, the scaled score and the z-score are entered; no column names the edition, which is read from the columns that are filled
wais4_arithmetique: only the raw total, the scaled score and the z-score are entered; no column names the edition, which is read from the columns that are filled
wais4_efficience: the working memory index only (the form has no information, vocabulary, matrices or picture completion, so no other index and no full-scale IQ), read in the table of the application from the sum of the scaled scores that the digit span and arithmetic schemas deliver (uses); the stored index is the table's value (in SZ it is 0.7 too low and is read with an offset); no column names the edition
wais4_code_symboles_ivt: the columns are named code01 to ivt04; no column names the edition, which is read from the columns that are filled

# SUICIDE, SUBSTANCES, PERINATALITE, SOIN SUIVI, MODULE SOCIAL
isf_lifetime: the answers are numbers (1 and 0; 0, 1, 2 for "when") and the visits of this cohort name the two forms
suicide_attempts: the answers are numbers, with 2 for "not known"; two more dates (most violent, most serious attempt); the visits of this cohort name the two forms; the follow-up visits are another schema, suicide_attempts_fu, because the form says "ever" there too
most_violent_attempt: the lists are stored as the numbers of form 152 and read on the BP names (every scale ends one level before death, which this form does not offer); the consequences of another method are five boxes, one per level, shown only for that method; the visits of this cohort name the two forms and this schema reads them all
most_serious_attempt: the lists are stored as the numbers of form 151 and read on the BP names (every scale ends one level before death, which this form does not offer; one more kind of trigger, other specified); the visits of this cohort name the two forms and this schema reads them all
tobacco: the status is stored 1, 2 and 3 and has no "unknown" answer; the form has these four questions only
perinatal: the answers are stored as numbers, with 0 or 2 for "not known"
sick_leave_v0: the answers are 0, 1 and 2 (not applicable); the number of sick leaves is not in the extraction
sick_leave_fu: other columns; the form has no yes/no question and no stated cause, so the names say any cause, the number of sick leaves is the answer and the export computes the yes/no from it (written Y and N); the length is in days
hospitalisations_v0: the columns of this cohort (ever hospitalised, age at the first one, number, months), with no question on the first psychotic episode
social: the time in the job is a number of months; the occupational class is added; the closest person is stored as a code that the dictionary does not explain; no questions on housing, income and debts

# TRAITEMENTS
medications: the lists of this extraction are crossed by the export (a product written next to every prescription line, request R122) and are put back with the field crossed; the name is the substance of the drug catalogue (substance_name), not the typed product; the daily dose is in mg as typed and the number of units a day is computed by the export; the generic name of the catalogue is looked up; no liquid strength; the form is added
non_drug_lifetime: the columns and the questions of this cohort (ECT and TMS with their settings, psychotherapy as one question); the answers are numbers with 2 for "not known"; the settings are decoded from form 203
non_drug_fu: the columns and the questions of this cohort (ECT and TMS with their settings, psychotherapy as one question; the kinds are in psychotherapies_fu); the questions carry no period (asked again at follow-up, a yearly update, where BP and SZ say "since the last visit"); the answers are numbers with 2 for "not known"; the settings are decoded from form 203

# ANTECEDENTS
neurological_history_v0: the answers are numbers; 'treated' and 'controlled' are in columns named _tr_mhdecod and _eq_mhdecod
neurological_history_fu: the answers are numbers; 'treated' and 'controlled' are in columns named _tr_mhdecod and _eq_mhdecod
cardiovascular_history_v0: the answers are numbers; no date for another cardiovascular disease
cardiovascular_history_fu: the answers are numbers; no date for another cardiovascular disease (form 191 has one that the extraction does not hold)
endocrine_history_v0: the answers are numbers; one date for the thyroid disorder; the kind of dyslipidaemia is two yes/no questions (after a no they are 0 here, missing in BP); no text for another endocrine disease; the types are stored as numbers and read on the BP labels, with 0 for "not known"
endocrine_history_fu: the answers are numbers; one date for the thyroid disorder; the kind of dyslipidaemia is two yes/no questions (after a no they are 0 here, missing in BP); no text for another endocrine disease; the types are stored as numbers and read on the BP labels, with 0 for "not known"
skin_history_v0: the answers are numbers; the causes of a drug eruption are four boxes; the type of eruption is stored as a number and read on the BP labels
skin_history_fu: the answers are numbers; the causes of a drug eruption are four boxes; the type of eruption is stored as a number and read on the BP labels
urinary_history_v0: the answers are numbers; the causes of a urinary retention are three boxes
urinary_history_fu: the answers are numbers; the causes of a urinary retention are three boxes
gynaecological_history_v0: the answers are numbers; the section is hidden for men and holds no answer for them (BP holds a cell for 203 of its 2,389 men's inclusion rows); the counts are typed numbers; the hormonal treatment is asked whether or not in menopause (as in BP, no gate on the menopause)
gynaecological_history_fu: the answers are numbers; the section is hidden for men and holds no answer for them (BP holds a cell for 203 of its 2,389 men's inclusion rows); the counts are typed numbers; the hormonal treatment is asked whether or not in menopause (as in BP, no gate on the menopause)
digestive_history_v0: the answers are numbers; the kind of bowel disease and the treatment behind a drug hepatitis are stored as numbers and read on the BP labels
digestive_history_fu: the answers are numbers; the kind of bowel disease and the treatment behind a drug hepatitis are stored as numbers and read on the BP labels
allergic_history_v0: the answers are numbers; the five diseases are boxes in columns of their own
allergic_history_fu: the answers are numbers; the five diseases are boxes in columns of their own
other_history_v0: the answers are numbers; the cancers are boxes in columns of their own, with two more kinds; the virus is coded 1, 2, 3
other_history_fu: the answers are numbers; the cancers are boxes in columns of their own, with two more kinds; the virus is coded 1, 2, 3
family_structure: the psychiatric history and the cardiovascular risk factors are two questions (BP asks one question per relative); children and siblings are counted as groups, with the number affected by each of the two questions
family_history: the children and the siblings are each one arbitrary affected relative of the group (BP has a row per sister, brother, daughter and son); the disorders are separate yes/no questions, the kind of mood disorder and the suicide are read from the form with the labels of BP; the boxes of the parents and grandparents are 0 on every saved form; the per-patient columns fdr_ and gp_ are computed from the counts of the psychiatric history
cssrs_v0: the inclusion form of this cohort asks about the whole life (BP the past week), under other names; the behaviour section, the lethality ratings, the dates and the descriptions are added; the screening visit is an inclusion visit
cssrs_fu: the behaviour section, the lethality ratings, the dates and the descriptions are added; the columns are named cssrs; the screening visit is an inclusion visit
