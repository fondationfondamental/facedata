# Columns of the BP extraction that are deliberately not loaded, each with the reason.
# coverage() lists them with the status "ignored".
cpt_version: filled on every row with WAIS labels; it says nothing about the CPT
nom_centre: empty on every row
subjid: a second patient identifier; usubjid is the key
id_fiche_clinique: identifier of the visit record; (usubjid, visit) is the key

