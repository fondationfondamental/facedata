# Unit chosen on the form for nine analytes. The export copies the choice into the unit
# column of the analyte (<analyte>_lborresu), which is the one the schemas read.
# The tenth, rad_chol_hll, is not copied and is read by the LDL cholesterol variable.
rad_glycemie: unit choice, already in gluc_lborresu
rad_bilirubi: unit choice, already in bili_lborresu
rad_tsh: unit choice, already in tsh_lborresu
rad_hb: unit choice, already in hgb_lborresu
rad_chol_hdl: unit choice, already in hdl_lborresu
rad_ht: unit choice, already in hct_lborresu
rad_tcmh: unit choice, already in mch_lborresu
rad_ccmh: unit choice, already in mchc_lborresu
rad_prolactine: unit choice, already in prolctn_lborresu

# Stored scores that a schema replaces or does not need.
psqi15: PSQI component 1, a copy of item 6 (psqi06)
psqi16: PSQI component 6, a copy of item 7 (psqi07)
ctq41: 1 when the CTQ denial score (ctq40) is 1 or more
apnee08: STOP-BANG criterion "male sex", filled on two visits; the sex is in the PATIENT tab
wais: the WAIS edition again (wais-3, wais-4); the same as wais_version, filled less often

# TMT, percentiles of the errors. The EMR wrote them with three different rules (until 2015,
# 2016 to 2021, from 2022): a patient with no error has ">95", then ">10", then "<5".
# The cell does not tell which rule it follows (decision D42 in docs/bp/PROGRESS.md).
# tmt.yaml reads the four bands again in the norm tables, from the numbers of errors (D43).
tmta02a_: TMT part A, percentile of the errors; three rules over the years
tmtb02a_: TMT part B, percentile of the errors; three rules over the years
tmtb05a_: TMT part B, percentile of the perseverative errors; three rules over the years
tmtba02a_: TMT B minus A, percentile of the errors; three rules over the years

# SUBSTANCES ET COMORBIDITE
rad_tb_subst: a copy of rad_tb_subst_raw written as 0 and 1, in which the "unknown" answers are left empty on purpose

# EVALUATION MEDICALE, lifetime mood episodes. The export writes "Y" where the count of the row is 1 or more
# and "N" everywhere else, also where the count is unknown or empty and on every row of the other visits.
mhoccur_edm_lt: Y where evnum_edm_lt is 1 or more, N everywhere else; N does not mean "none"
mhoccur_ehman_lt: Y where evnum_ehman_lt is 1 or more, N everywhere else; N does not mean "none"
mhoccur_epman_lt: Y where evnum_epman_lt is 1 or more, N everywhere else; N does not mean "none"
mhoccur_epmixt_lt: Y where evnum_epmixt_lt is 1 or more, N everywhere else; N does not mean "none"
mhoccur_edm_psy_spv: a copy of mhoccur_edm_psy_lt, identical on every row
mhoccur_epman_psy_spv: a copy of mhoccur_epman_psy_lt, identical on every row
mhoccur_epmixt_psy_spv: a copy of mhoccur_epmixt_psy_lt, identical on every row

# AUTO-QUESTIONNAIRES, MAThyS (decision D91 in docs/bp/PROGRESS.md)
mathys_: MAThyS total of the data managers' score step; it applies the key to the values as stored, which is wrong for the old form
mathys29: MAThyS emotion sub-score, recalculated by the data managers since 10 November 2026 with one formula for every year (wrong for the old form)
mathys30: MAThyS motivation sub-score, recalculated by the data managers (see mathys29)
mathys31: MAThyS perception sub-score, recalculated by the data managers (see mathys29)
mathys32: MAThyS interaction sub-score, recalculated by the data managers (see mathys29)
mathys33: MAThyS cognition sub-score, recalculated by the data managers (see mathys29)

# SOCIAL
empjob: class of the current job; the export looks the 18 classes of the form up in the nine of the dictionary and keeps two (122 of 2,308 employed patients) (D74, D99, FU-8)
protec: the legal protection measure; not delivered (see social_protec)

