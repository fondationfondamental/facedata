# Columns of the BP extraction that are deliberately not loaded, each with the reason.
# coverage() lists them with the status "ignored".
cpt_version: filled on every row with WAIS labels; it says nothing about the CPT
nom_centre: empty on every row; the application's export to the central database removes it and the export writes it empty (R55); the centre is siteid
id_fiche_clinique: identifier of the visit record; (usubjid, visit) is the key
visit_neuropsychologie: a copy of the visit label, identical on every row

# Administrative columns with no scientific use: not delivered (decision D111 in docs/bp/PROGRESS.md, by the project lead).
formoppos: which non-opposition form was used (adult patient, patient under curatelle); administrative
social_protec: the legal protection measure (curatelle, tutelle); administrative, and its coding is not settled

