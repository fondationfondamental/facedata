instrument: cgi_egf
title: "Clinical Global Impression (CGI) and Global Assessment of Functioning (EGF)"
tab: HETERO-QUESTIONNAIRES
section: Questionnaire CGI-EGF
status: draft
notes: >
  The code 0 means "not assessed" for the severity, the improvement, the
  therapeutic effect and the efficacy index. It is read as a missing code.

  The efficacy index is (therapeutic effect - 1) x 4 + side effects. A schema
  cannot write a product, so the custom check cgi_index_differs compares the
  stored index with that formula: it holds on 8,931 of 9,010 rows, and the
  79 others get check_failed. They differ by a multiple of 4, as if the
  therapeutic effect had been changed after the index was computed.

  The EGF is a number from 1 to 100. 149 cells hold a band of ten points
  instead ("60-51", "90-81"). They are read as the middle of the band (55.5)
  and flagged band_middle (decision D24 in PROGRESS.md). One band is
  impossible and ends out_of_range. Two cells hold 0 (missing code).

defaults: {type: item}

variables:
  cgi_severity:
    column: cgi01
    label: "CGI severity of illness, from 1 (normal) to 7 (among the most ill)"
    range: [1, 7]
    missing: {0: not_recorded}
  cgi_improvement:
    column: cgi02
    label: "CGI global improvement, from 1 (very much improved) to 7 (very much worse)"
    range: [1, 7]
    missing: {0: not_recorded}
  cgi_therapeutic_effect:
    column: cgi03a
    label: "CGI therapeutic effect, from 1 (marked) to 4 (unchanged or worse)"
    range: [1, 4]
    missing: {0: not_recorded}
  cgi_side_effects:
    column: cgi03b
    label: "CGI side effects, from 1 (none) to 4 (outweigh the therapeutic effect)"
    range: [1, 4]
  cgi_efficacy_index:
    column: cgi03
    label: "CGI efficacy index, from 1 to 16"
    range: [1, 16]
    missing: {0: not_recorded}
  gaf:
    column: egf
    label: "Global Assessment of Functioning (EGF), from 1 to 100"
    type: number
    range: [1, 100]
    missing: {0: not_recorded}
    bands: middle
    winsor: false

checks:
  cgi_efficacy_index: cgi_index_differs
