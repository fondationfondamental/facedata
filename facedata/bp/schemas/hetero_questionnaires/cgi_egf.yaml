instrument: cgi_egf
title: "Clinical Global Impression (CGI) and Global Assessment of Functioning (EGF)"
tab: HETERO-QUESTIONNAIRES
section: Questionnaire CGI-EGF
status: reviewed
notes: >
  The code 0 means "not assessed" for the severity, the improvement, the
  therapeutic effect and the efficacy index. It is read as a missing code.

  Three items at the follow-up visits only (decision D113 in PROGRESS.md,
  by the project lead). The form asks the improvement, the therapeutic
  effect with its side effects, and the efficacy index at the follow-up
  visits, and says to tick "not assessed" at the initial evaluation: there
  is no earlier state to compare with. They are nevertheless filled at
  1,068 inclusion visits (19%), 1% to 3% in four centres and 37% to 60% in
  three. These variables are read at the follow-up visits only (visit_form,
  from the visit label); the inclusion values are not delivered. The
  severity and the EGF are delivered at every visit.

  The efficacy index is a score: 4 x (therapeutic effect - 1) + side
  effects, the formula of the scoring script of the application, so it goes
  from 1 to 16 (cgi_te_steps is the first term, not delivered). The stored
  index (cgi_efficacy_index_stored, not delivered) is the check. The
  application computes the index only when a side-effect option is clicked
  (the tooltip of the field says to tick the side effects again after
  changing the effect), so the stored index is stale after an edit of the
  therapeutic effect. On the 7,985 follow-up visits that have the effect,
  the side effects and the stored index, the stored index differs from the
  formula on 74 (score_mismatch): always by a multiple of 4 (the stored one
  is 4 higher on 41, 4 lower on 20, and 8 or 12 away on 13), as if the effect
  had been changed after the index was computed. The recomputed value is
  delivered: 74 values recomputed, 6 visits with an effect and side effects
  and no stored index get the index, and 6 visits hold a stored index with
  the effect or the side effects missing: the index is missing there
  (score_not_recomputed).
  Before this review the stored index was delivered and checked by a custom
  function (check_failed on the same 74 visits).

  The numbers 1 to 16 are the cell labels of the grid of Guy's ECDEU
  Assessment Manual (1976): rows are the therapeutic effect (marked,
  moderate, minimal, unchanged or worse), columns the side effects, numbered
  row by row (6 = moderate effect, side effects that do not interfere
  significantly, the example printed on the form). They are position labels,
  not an ordered score: Guy gives a table from the cell to a ratio of effect
  to side effects (0.25 to 4.00), and the cell number does not rise with that
  ratio (scale_reference.md, section 3: Guy p. 221, read in the OCR text of
  the manual in two agreeing extractions; the page scan itself was not
  checked, literature check 2026-11-21). The side-effect question is shown
  only after a therapeutic effect
  from 1 to 4 (the form hides it after "not assessed"): 1 side-effect value
  sits under "not assessed" and 2 under an empty effect, kept as recorded
  (a rule would mostly blank values under an empty parent), and 107 of the
  9,174 effects from 1 to 4 have no side-effect answer.

  The EGF is a number from 1 to 100, typed in a free text field (no limit in
  the form) under the ten bands of the scale. The form prints the bands from
  100-91 down to 1-10; the five lowest are written from the low number up
  (41-50, 31-40, 21-30, 11-21, 1-10) and "11-21" is a misprint for 11-20, the
  published band. 149 cells hold a band of ten points instead of a number
  ("60-51", "90-81"), 87 of them in one centre: 140 in the wording printed on
  the form (8 of them 100-91), 6 written in rising order (71-80, 51-60, 61-70,
  81-90, 91-100: not the printed wording), 3 with another separator or a
  typing slip. They are read as the middle of the band (55.5) and flagged
  band_middle (decision D24 in PROGRESS.md). One band is impossible and ends
  out_of_range. Two cells hold 0 (missing code: in the published scale 0
  means inadequate information). 81% of the numbers typed are multiples of 5
  (47% of 10).

  The CGI-I at inclusion is not delivered (D113): its 1,068 values at
  inclusion correlate with the severity as strongly as the follow-up ones do,
  so they do not look like a blank form (open question, no change).

version:
  name: visit_form
  column: visit
  codes:
    V0: inclusion
    V1_an: follow_up
    V2_ans: follow_up
    V3_ans: follow_up
    V4_ans: follow_up
    V5_ans: follow_up
    V6_ans: follow_up
    V7_ans: follow_up
    V8_ans: follow_up
    V9_ans: follow_up
    V10_ans: follow_up
    V6_mois: follow_up
    V18_mois: follow_up
    V30_mois: follow_up
    V42_mois: follow_up
    V54_mois: follow_up
    V66_mois: follow_up
    V78_mois: follow_up
    V90_mois: follow_up
    V102_mois: follow_up
    V114_mois: follow_up
    V126_mois: follow_up

defaults: {type: item}

variables:
  cgi_severity:
    column: cgi01
    label: "CGI severity of illness, from 1 (normal) to 7 (among the most ill)"
    range: [1, 7]
    missing: {0: not_recorded}
  cgi_improvement:
    column: cgi02
    versions: [follow_up]
    label: "CGI global improvement, from 1 (very much improved) to 7 (very much worse)"
    range: [1, 7]
    missing: {0: not_recorded}
  cgi_therapeutic_effect:
    column: cgi03a
    versions: [follow_up]
    label: "CGI therapeutic effect, from 1 (marked) to 4 (unchanged or worse)"
    range: [1, 4]
    missing: {0: not_recorded}
  cgi_side_effects:
    column: cgi03b
    versions: [follow_up]
    label: "CGI side effects, from 1 (none) to 4 (outweigh the therapeutic effect)"
    range: [1, 4]
  cgi_efficacy_index_stored:
    column: cgi03
    versions: [follow_up]
    label: "CGI efficacy index as stored, from 1 to 16"
    range: [1, 16]
    missing: {0: not_recorded}
    keep: false
  gaf:
    column: egf
    label: "Global Assessment of Functioning (EGF), from 1 to 100"
    type: number
    range: [1, 100]
    missing: {0: not_recorded}
    bands: middle
    winsor: false

scores:
  cgi_te_steps:
    label: "4 x (therapeutic effect - 1)"
    sum: [cgi_therapeutic_effect]
    scale: [4, -4]
    keep: false
  cgi_efficacy_index:
    label: "CGI efficacy index (cell of Guy's grid, 4 x (effect - 1) + side effects), from 1 to 16"
    sum: [cgi_te_steps, cgi_side_effects]
    range: [1, 16]
    compare: cgi_efficacy_index_stored
