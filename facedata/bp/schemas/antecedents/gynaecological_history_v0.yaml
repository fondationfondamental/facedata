variables:
  n_pregnancies_v0: {column: pregnn_rporres, type: item, range: [0, 30], codes: {Aucune: 0, Aucun: 0}, label: "Number of pregnancies, at inclusion"}
  n_live_births_v0: {column: brthlvn_rporres, type: item, range: [0, 30], codes: {Aucune: 0, Aucun: 0}, asked_if: n_pregnancies_v0, label: "Number of children born alive, at inclusion"}
  n_miscarriages_v0: {column: spabortn_rporres, type: item, range: [0, 30], codes: {Aucune: 0, Aucun: 0}, asked_if: n_pregnancies_v0, label: "Number of miscarriages, at inclusion"}
  n_abortions_v0: {column: nb_ivg_rporres, type: item, range: [0, 30], codes: {Aucune: 0, Aucun: 0}, asked_if: n_pregnancies_v0, label: "Number of voluntary terminations of pregnancy, at inclusion"}
  n_medical_terminations_v0: {column: nb_itg_rporres, type: item, range: [0, 30], codes: {Aucune: 0, Aucun: 0}, asked_if: n_pregnancies_v0, label: "Number of terminations of pregnancy for a medical reason, at inclusion"}
  menopause_v0: {column: menostat_rporres, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Menopause, at inclusion"}
  menopause_date_v0: {column: menostat_rpdtc, type: date, range: [1900-01-01, 2026-12-31], label: "Menopause: date, at inclusion"}
  menopause_hormone_therapy_v0: {column: hormonal_rporres, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Menopause: hormone therapy, at inclusion"}
  menopause_hormone_therapy_start_v0: {column: hormonal_rpdtc, type: date, range: [1900-01-01, 2026-12-31], label: "Menopause: start of the hormone therapy, at inclusion"}
  gynaecological_disease_v0: {column: gyneco_rporres, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Gynaecological disease other than a cancer, at inclusion"}
  gynaecological_disease_text_v0: {column: gynecosp_rporres, type: text, label: "Gynaecological disease: which one, as written, at inclusion"}
