  inflammatory_bowel_disease_treated_fu: {column: inflachro_mhdecod_tt, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Chronic inflammatory bowel disease: treated, at follow-up"}
  inflammatory_bowel_disease_controlled_fu: {column: inflachro_mhdecod_eq, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Chronic inflammatory bowel disease: controlled, at follow-up"}
