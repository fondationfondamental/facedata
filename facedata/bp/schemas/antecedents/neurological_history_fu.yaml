instrument: neurological_history_fu
title: "Medical history: neurological diseases (yearly follow-up visits)"
tab: ANTECEDENTS
section: Pathologies neurologiques
status: reviewed
notes: >
  Migraine, multiple sclerosis, epilepsy, meningitis, head injury, stroke and
  "another neurological disease", which is then named in a free text
  delivered as written. Yes/no answers are delivered as 1 and 0; "unknown" (U, "Ne sais pas") is a
  missing code.

  Two forms in the same columns (decision D59 in PROGRESS.md). The same
  questions are asked at the inclusion visit and at the yearly visits, never
  at the six-monthly ones: the 3,352 six-monthly visits of the follow-up
  version (11,686 visits, of which 8,334 are yearly) and the screening visits
  never hold a cell of this section. At inclusion they are about the whole life. At the
  yearly visits a disease answered "yes" at inclusion is often answered "no":
  236 of the 468 "yes" of this section that are answered again (117 of 234 for migraine, 91 of 167 for a head injury). The
  yearly form is the inclusion form again: the same questions, with no period
  in their wording, after one more question, "is there a change since the
  last visit?", which the extraction does not hold (read in the application
  in November 2026, decision D84 in PROGRESS.md). A yearly answer is an
  update given at that visit: neither a history of the whole life nor
  strictly an answer about the time since the last visit. The two are delivered as separate
  columns, ending in _v0 (inclusion visit) and _fu (yearly visits); visit_form
  says which form a visit used and is read from the visit label. The
  question "is there a change since the last visit?" is shown at the yearly
  visit only and is not exported (rad_pas_dechangement, DM-10): an empty
  yearly section may mean "no change".

  From 2022 the section is mostly left empty (decision D83 in PROGRESS.md). Until 2021
  it is answered at 88% of the inclusion visits, from 2022 at 31%, and the
  answered visits hold more "yes": 0.84 per visit against 0.40. The form has a
  shortcut at the top of the section, "Non pour tous" (no for all) or "Ne
  sais pas pour tous". In eBipolar it leaves each disease unanswered; the
  application saves it and the extraction does not hold it (read in the
  application in November 2026). An empty section is therefore most often a
  "no for all". From 2022 the
  share of "yes" among the answers (13.9% against 5.8%) is therefore not a
  prevalence. The values are delivered as recorded: an empty section is
  missing, not "no". Once the shortcut is exported, a "no for all" will
  give 0 to each disease of the section. The yearly visits answer the section at 31% of the
  visits until 2021 and at 5% from 2022.

  Details. The date of onset, "treated" and "controlled" (équilibrée) are
  asked only after a "yes" and are missing otherwise, except 8 detail cells
  typed after a "no" (kept as recorded). 1000-01-01 is written in a date that
  was not typed, and in every empty date of a form saved from 2025 (in the
  nine sections together, 64% of the inclusion visits and 34% of the yearly
  visits dated 2025 or later hold one; at inclusion 0% to 3% of the visits up
  to 2024Q4, 28% in 2025Q1, 70% in 2025Q4, 94% in 2026Q3): date_placeholder. Hard limits of the dates: 1900 to 2026. One date of onset of epilepsy is in the nineteenth century: out_of_range.

  Dates and the visit. Of the 2,168 delivered dates of the section (both
  forms), 10 are after the visit (2 in the month of the visit, 8 later, by up
  to 7 months), 14 are on the day of the visit and 2 are before the year of
  birth. They stay as recorded: no before_visit (decision D145 in
  PROGRESS.md).

  Years and centres. The report panels show a shift for three migraine items, migraine_treated_v0,
  migraine_controlled_v0 and migraine_controlled_fu. The shift is the distance between the median of
  a year or a centre and the overall median, and the median of a yes/no item is 0 or 1: it reads 1
  as soon as a year or a centre lies on the other side of one half. It is not a mixture of units or
  of forms. "Treated" is 35% yes at inclusion: 21% to 44% in each of 12 centres with 20 answers or
  more (no step) and 24% to 43% in every year but the first (2010: 65% of 23 answers). "Controlled"
  is 58% yes (44% to 68% by centre, 45% to 73% by year) and 56% at the yearly visits (38% to 78% in
  5 centres, 52% to 69% in 5 years).

