  asthma_v0: {column: chk_somat_all_specifier, type: item, range: [0, 1], separator: ",", codes: {"Asthme (allergique ou non)": 1, "Allergies hors asthme": 0, "Lupus": 0, "Polyarthrite rhumatoïde": 0, "Autres maladies auto-immunes": 0}, asked_if: allergic_inflammatory_v0, label: "Allergic or inflammatory disease: asthma, at inclusion"}
  allergy_v0: {column: chk_somat_all_specifier, type: item, range: [0, 1], separator: ",", codes: {"Asthme (allergique ou non)": 0, "Allergies hors asthme": 1, "Lupus": 0, "Polyarthrite rhumatoïde": 0, "Autres maladies auto-immunes": 0}, asked_if: allergic_inflammatory_v0, label: "Allergic or inflammatory disease: an allergy other than asthma, at inclusion"}
  lupus_v0: {column: chk_somat_all_specifier, type: item, range: [0, 1], separator: ",", codes: {"Asthme (allergique ou non)": 0, "Allergies hors asthme": 0, "Lupus": 1, "Polyarthrite rhumatoïde": 0, "Autres maladies auto-immunes": 0}, asked_if: allergic_inflammatory_v0, label: "Allergic or inflammatory disease: lupus, at inclusion"}
  rheumatoid_arthritis_v0: {column: chk_somat_all_specifier, type: item, range: [0, 1], separator: ",", codes: {"Asthme (allergique ou non)": 0, "Allergies hors asthme": 0, "Lupus": 0, "Polyarthrite rhumatoïde": 1, "Autres maladies auto-immunes": 0}, asked_if: allergic_inflammatory_v0, label: "Allergic or inflammatory disease: rheumatoid arthritis, at inclusion"}
