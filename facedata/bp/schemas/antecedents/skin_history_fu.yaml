  psoriasis_lithium_fu: {column: psoriasis_mhmodify_lithium, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Psoriasis: triggered or worsened by lithium, at follow-up"}
  psoriasis_start_fu: {column: psoriasis_mhstdtc, type: date, range: [1900-01-01, today], label: "Psoriasis: date of onset, at follow-up"}
  psoriasis_treated_fu: {column: psoriasis_mhdecod_tt, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Psoriasis: treated, at follow-up"}
  psoriasis_controlled_fu: {column: psoriasis_mhdecod_eq, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Psoriasis: controlled, at follow-up"}
