defaults: {versions: [follow_up]}

variables:
  diabetes_fu: {column: diabete_mhoccur, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Diabetes, at follow-up"}
  diabetes_start_fu: {column: diabete_mhstdtc, type: date, range: [1900-01-01, 2026-12-31], label: "Diabetes: date of onset, at follow-up"}
  diabetes_treated_fu: {column: diabete_mhdecod_tt, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Diabetes: treated, at follow-up"}
  diabetes_controlled_fu: {column: diabete_mhdecod_eq, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Diabetes: controlled, at follow-up"}
  diabetes_type_fu: {column: diabete_mhmodify, type: category, codes: {"Type I": type_1, "Type II": type_2}, label: "Diabetes: type, at follow-up"}
  thyroid_disorder_fu: {column: dysthyro_mhoccur_tt, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Thyroid disorder, at follow-up"}
  thyroid_disorder_type_fu: {column: dysthyro_mhmodify, type: category, codes: {"Hypo-thyroïdie": hypothyroidism, "Hyper-thyroïdie": hyperthyroidism}, label: "Thyroid disorder: type, at follow-up"}
  hyperthyroidism_start_fu: {column: dysthyro_mhstdtc_hyper, type: date, range: [1900-01-01, 2026-12-31], label: "Hyperthyroidism: date of onset, at follow-up"}
  hypothyroidism_start_fu: {column: dysthyro_mhstdtc_hypo, type: date, range: [1900-01-01, 2026-12-31], label: "Hypothyroidism: date of onset, at follow-up"}
  thyroid_disorder_treated_fu: {column: dysthyro_mhdecod_tt, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Thyroid disorder: treated, at follow-up"}
  thyroid_disorder_induced_by_fu: {column: dysthyro_mhmodify_tt, type: category, codes: {"Induite par le Lithium": lithium, "Induite par un autre Traitement": other_treatment}, label: "Thyroid disorder: induced by a treatment, at follow-up"}
  thyroid_disorder_controlled_fu: {column: dysthyro_mhdecod_eq, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Thyroid disorder: controlled, at follow-up"}
  dyslipidaemia_fu: {column: dyslipid_mhoccur, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Dyslipidaemia, at follow-up"}
  dyslipidaemia_start_fu: {column: dyslipid_mhstdtc, type: date, range: [1900-01-01, 2026-12-31], label: "Dyslipidaemia: date of onset, at follow-up"}
  dyslipidaemia_treated_fu: {column: dyslipid_mhdecod_tt, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Dyslipidaemia: treated, at follow-up"}
  dyslipidaemia_controlled_fu: {column: dyslipid_mhdecod_eq, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Dyslipidaemia: controlled, at follow-up"}
  dyslipidaemia_type_fu: {column: dyslipid_mhmodify, type: category, codes: {"Hypercholestérolémie": hypercholesterolaemia, "Hypertriglycéridémie": hypertriglyceridaemia, "Les deux": both}, label: "Dyslipidaemia: type, at follow-up"}
  other_endocrine_fu: {column: autendoc_mhoccur, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Another endocrine disease, at follow-up"}
  other_endocrine_start_fu: {column: autendoc_mhstdtc, type: date, range: [1900-01-01, 2026-12-31], label: "Another endocrine disease: date of onset, at follow-up"}
  other_endocrine_text_fu: {column: autendoc_mhmodify, type: text, label: "Another endocrine disease: which one, as written, at follow-up"}
