instrument: family_structure
title: "Family: number of relatives, and how many have a disorder"
tab: ANTECEDENTS
section: Enfants, Fratrie, Parents, Grands-parents
status: reviewed
level: patient
notes: >
  How many daughters, sons, sisters and brothers the patient has, how many of
  them have something to describe, and whether each parent and grandparent
  has. One value per patient, delivered in the table patients (decision D58
  in PROGRESS.md). The details of each relative are in family_history.

  The question. For the mother, the father and each grandparent the form
  asks whether the relative has "a psychiatric disorder, an abuse of or
  dependence on a substance, a history of suicide attempt or a
  cardiovascular risk factor": yes, no or unknown. For the daughters, the
  sons, the sisters and the brothers it asks how many of them have one of
  these. A yes is therefore not a psychiatric history: it can be
  hypertension alone. The names of the variables say "affected" for short.

  Counts. Numbers go from 0 to 5. The form offers "none", 1 to 5 and "more
  than 5" for each number of relatives, and "none" and 1 to 5 for the number
  of affected ones (read in the application in November 2026; decision D95
  in PROGRESS.md). "More than 5" is lost by the export, not written 5: the
  cell is empty (R34 of EXPORT_REQUESTS.md; DM-14 in QUESTIONS.md). So a 5 is
  exactly five. The trace of the lost answers is a number of relatives that
  is empty next to a filled number of affected ones: on 55 visits of 49
  patients (19 patients for the sisters, 31 for the brothers, 1 for the
  sons). One of the 19 gives the number of sisters at another visit, so the
  table patients holds 50 such cases (18 sisters, 31 brothers, 1 son). The
  number of relatives stays empty: it cannot be told from a count that
  nobody gave, and nothing is written in its place. The number of affected
  sisters is asked only when the patient has sisters: with no sister it is 0
  (asked_if), and the same for the brothers, the daughters and the sons. It
  is left empty for 180 patients with daughters, 210 with sons, 252 with
  sisters and 268 with brothers: unknown. Four rows count more affected
  relatives than relatives; they are kept as recorded.

  Unknown. "Unknown" (U) is the answer for 199 mothers, 348 fathers and
  1,158 to 1,684 of each grandparent: a missing code.

  One value per patient. The family is described at the inclusion visit and
  sometimes again later: 378 patients have these questions answered at two
  or more visits. The first answer is kept, as for family_history, which
  has no yearly twin of its own (D84: a later answer is a yearly update;
  family_history says what changes). 9 to 63 patients per variable give
  another answer later and get patient_value_varies.

  Years and centres. The report panels show a shift of 1 for the answers about the mother (60% yes),
  the father (57%), the maternal grandmother (40%) and the number of daughters (mean 0.49; 35% of
  the patients have at least one), and of 0.5 for the maternal grandfather (34%). The median of such
  an item is 0 or 1 and flips when a year or a centre lies on the other side of one half. By centre
  (14 or 15 centres with 20 answers or more) the mother is 47% to 68% yes, the father 44% to 68%, the
  maternal grandmother 28% to 51%, the maternal grandfather 24% to 50%, and the mean number of
  daughters 0.28 to 0.76; by year (18 years) 53% to 69%, 47% to 64%, 30% to 48%, 24% to 43% and 0.37
  to 0.62. No step, no mixture of units.
