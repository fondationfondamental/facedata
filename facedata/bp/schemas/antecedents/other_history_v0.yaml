instrument: other_history_v0
title: "Medical history: cancers, infections, surgery, eye and other diseases (inclusion visit)"
tab: ANTECEDENTS
section: Autres pathologies
status: draft
notes: >
  Cancer, HIV infection, chronic viral hepatitis and its virus, major
  surgery, genetic disease, "another somatic disease", and the eye diseases.
  Yes/no answers are delivered as 1 and 0; "unknown" (U, "Ne sais pas") is a
  missing code. "Unknown" is frequent for HIV and viral hepatitis (164 and 169
  inclusion visits). The surgery, the genetic disease, the other somatic
  disease and the cancer are named in free texts delivered as written.

  Cancer. The types are boxes ticked in one cell (gynaecological, digestive,
  ear nose and throat, lung, other), delivered as one yes/no variable each.

  Eye diseases. One yes/no question, then angle-closure glaucoma, chronic
  open-angle glaucoma and cataract, which are 0 after a "no" (asked_if). The
  treatment under which an angle-closure glaucoma started is filled in one
  cell and is not read.

  Two forms in the same columns (decision D59 in PROGRESS.md). The same
  questions are asked at the inclusion visit and at the yearly visits, never
  at the six-monthly ones. At inclusion they are about the whole life. At the
  yearly visits a disease answered "yes" at inclusion is often answered "no":
  305 of the 660 "yes" of this section that are answered again (9 of 37 for a cancer, 78 of 130 for a major surgery, 142 of 366 for another somatic disease). The
  yearly form therefore seems to ask about the time since the last visit; this
  is not confirmed (open question O38). The two are delivered as separate
  columns, ending in _v0 (inclusion visit) and _fu (yearly visits); visit_form
  says which form a visit used and is read from the visit label.

  From 2022 the section is mostly left empty (open question O37). Until 2021
  it is answered at 86% of the inclusion visits, from 2022 at 39%, and the
  answered visits hold more "yes": 0.72 per visit against 0.47. The section seems to
  be opened only for a patient who has one of its diseases. From 2022 the
  share of "yes" among the answers (9.0% against 4.8%) is therefore not a
  prevalence. The values are delivered as recorded: an empty section is
  missing, not "no". The yearly visits answer the section at 32% of the
  visits until 2021 and at 11% from 2022.

  Details. The date of onset, "treated" and "controlled" (équilibrée) are
  asked only after a "yes" and are missing otherwise. 1000-01-01 is written
  in a date that was not typed, and from 2025 in every date of the form:
  date_placeholder. Hard limits of the dates: 1900 to 2026.

