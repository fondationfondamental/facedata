  nephropathy_controlled_v0: {column: nephropat_mhdecod_eq, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Nephropathy: controlled, at inclusion"}
