  prostate_adenoma_treated_v0: {column: adenompro_mhdecod_tt, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Prostate adenoma: treated, at inclusion"}
  prostate_adenoma_controlled_v0: {column: adenompro_mhdecod_eq, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Prostate adenoma: controlled, at inclusion"}
