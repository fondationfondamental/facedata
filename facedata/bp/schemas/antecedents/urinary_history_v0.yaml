instrument: urinary_history_v0
title: "Medical history: diseases of the urinary tract (inclusion visit)"
tab: ANTECEDENTS
section: Pathologies des voies urinaires
status: reviewed
notes: >
  Nephropathy, prostate adenoma and acute urinary retention. Yes/no answers are delivered as 1 and 0; "unknown" (U, "Ne sais pas") is a
  missing code.
  The prostate adenoma is answered for women too, always "no" or "unknown".

  Treatments. For a nephropathy the form asks whether it is probably linked
  to a past or current treatment by lithium (nephropathy_lithium). For an
  acute urinary retention it asks whether it started under a treatment
  (urinary_retention_under_treatment, a detail: missing after a "no") and
  shows three boxes, neuroleptic, antidepressant, other, ticked in one cell
  and delivered as one yes/no variable each. The boxes hang on the retention
  itself, not on the answer "under a treatment": they are 0 after a "no" to
  the retention (asked_if), and a retention "yes" with no box ticked stays
  missing (31 of the 76 "yes" at inclusion, 8 of 19 at the yearly visits;
  27 of these 39 answered "no" to "under a treatment"). A box ticked next
  to "no" to "under a treatment" is kept as written (3 of 25 at inclusion).

  Two forms in the same columns (decision D59 in PROGRESS.md). The same
  questions are asked at the inclusion visit and at the yearly visits, never
  at the six-monthly ones: the 3,352 six-monthly visits of the follow-up
  version (11,686 visits, of which 8,334 are yearly) and the screening visits
  never hold a cell of this section. At inclusion they are about the whole life. At the
  yearly visits a disease answered "yes" at inclusion is often answered "no":
  33 of the 55 "yes" of this section that are answered again. The
  yearly form is the inclusion form again: the same questions, with no period
  in their wording, after one more question, "is there a change since the
  last visit?", which the extraction does not hold (read in the application
  in November 2026, decision D84 in PROGRESS.md). A yearly answer is an
  update given at that visit: neither a history of the whole life nor
  strictly an answer about the time since the last visit. The two are delivered as separate
  columns, ending in _v0 (inclusion visit) and _fu (yearly visits); visit_form
  says which form a visit used and is read from the visit label. The
  question "is there a change since the last visit?" is shown at the yearly
  visit only and is not exported (rad_pas_dechangement, DM-10): an empty
  yearly section may mean "no change".

  From 2022 the section is mostly left empty (decision D83 in PROGRESS.md). Until 2021
  it is answered at 87% of the inclusion visits, from 2022 at 14%, and the
  answered visits hold more "yes": 0.21 per visit against 0.04. The form has a
  shortcut at the top of the section, "Non pour tous" (no for all) or "Ne
  sais pas pour tous". In eBipolar it leaves each disease unanswered; the
  application saves it and the extraction does not hold it (read in the
  application in November 2026). An empty section is therefore most often a
  "no for all". From 2022 the
  share of "yes" among the answers (7.6% against 1.5%) is therefore not a
  prevalence. The values are delivered as recorded: an empty section is
  missing, not "no". Once the shortcut is exported, a "no for all" will
  give 0 to each disease of the section. The yearly visits answer the section at 31% of the
  visits until 2021 and at 3% from 2022.

  Details. The date of onset, "treated" and "controlled" (équilibrée) are
  asked only after a "yes" and are missing otherwise. 1000-01-01 is written in
  a date that was not typed, and in every empty date of a form saved from 2025
  (in the nine sections together, 64% of the inclusion visits and 34% of the
  yearly visits dated 2025 or later hold one; at inclusion 0% to 3% of the
  visits up to 2024Q4, 28% in 2025Q1, 70% in 2025Q4, 94% in 2026Q3):
  date_placeholder. Hard limits of the dates: 1900 to 2026.

  Dates and the visit. Of the 246 delivered dates of the section (both forms),
  3 are after the visit (2 in the month of the visit, 1 later, by 3 months)
  and 2 are on the day of the visit. They stay as recorded: no before_visit
  (decision D145 in PROGRESS.md).

