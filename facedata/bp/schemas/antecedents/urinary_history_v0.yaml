  urinary_retention_other_treatment_v0: {column: returin_mhdecod, type: item, range: [0, 1], separator: ",", codes: {"Neuroleptiques": 0, "Antidépresseurs": 0, "Autres traitements": 1}, asked_if: urinary_retention_v0, label: "Acute urinary retention, the treatment: another treatment, at inclusion"}
