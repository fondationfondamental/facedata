instrument: dsm5_annee_ecoulee
title: Mood episodes of the year before inclusion, DSM-5 criteria
tab: EVALUATION MEDICALE
section: Caractéristique du trouble au cours de l'année ecoulée
status: reviewed
notes: >
  The mood episodes of the year before the inclusion visit: one yes/no
  question (at least one episode), then the number of depressive, hypomanic
  and manic episodes, and for depressive and manic episodes a yes/no and a
  number for those with psychotic features. Asked at the inclusion visit
  only. Yes/no answers are delivered as 1 and 0; "Ne sais pas" is a missing
  code.

  DSM-IV and DSM-5 are two editions (decision D9 in PROGRESS.md), asked on
  two inclusion forms and exported in the same columns. The application
  stores no edition: the export writes dsm_criteria on the inclusion row,
  DSM5 where the DSM-5 form holds one of five answers on the mood history,
  else DSM4 where the DSM-IV form does (DEV-11). The label is DSM-IV until
  2019 (7 DSM-5 exceptions), DSM-5 on 24 of 380 labelled inclusions in
  2020, 44 of 425 in 2021 and 203 of 238 in 2022 (the 35 DSM-IV ones of
  2022 are dated January to May), and DSM-5 on all from 2023. This schema
  reads the DSM-5 visits; dsm4_annee_ecoulee.yaml reads the others. Both
  carry the version block of the follow-up schemas (D12, D14, D15): an
  inclusion with no label is read by the date of the patient's first visit
  (the screening, where there is one), DSM-IV before 2020 and DSM-5 from
  2023 (version_inferred), and has no version from 2020 to 2022
  (version_unknown, not delivered). Why labels are missing: see
  dsm5_depuis_derniere_visite.yaml. In this section 12 unlabelled
  inclusions are read by date (9 DSM-IV, 3 DSM-5) and 4 of 2020 and 2021
  are not delivered (R69 would label them).

  The DSM-5 form has no mixed episode: the four mixed-episode columns are
  not read here. It asks instead about depressive and manic episodes with
  mixed features in the year (two yes/no and two numbers), which the
  extraction does not hold. 9 inclusions labelled DSM-5 (2018 to 2022) also
  hold a DSM-IV record (a lifetime number of mixed episodes). The export
  takes each cell of this section from the DSM-IV record first, so their
  answers here may be those of the DSM-IV form; 5 of them hold
  mixed-episode cells, which are not read. They are delivered (R70).

  The numbers. The form asks a number for each kind of episode, 0 to 20 or
  ">20" (read as 20 and censored_right: 2 hypomanic), only after a yes to
  the first question (asked_if). Where the first answer is no they are
  empty in the extraction and are read as 0: with no mood episode in the
  year, there was no depressive episode. Where the first answer is unknown
  or empty they stay missing.

  The boxes. The form has no box per kind of episode: the export writes the
  three boxes (mhoccur_edm_ly, mhoccur_ehman_ly, mhoccur_epman_ly) from the
  number, 1 where it is 1 or more (">20" included), 0 where it is 0, empty
  where it is "Ne sais pas" or empty (803, 780 and 824 boxes). After a no
  they are read as 0 like the numbers (186 visits). They add nothing to the
  numbers and are delivered so that this section and the follow-up one have
  the same pair (D53); the export writes the follow-up boxes the same way.

  Psychotic features. The form asks about depressive episodes with
  psychotic features after a yes to the first question, and about manic
  ones only after 1 to 15 manic episodes in the year (no inclusion has
  more). Each answer is 0 where the number of that kind of episode is 0
  (asked_if on the box, D122): for manic episodes because the form did not
  ask (718 zeros), for depressive ones because there was none to have
  psychotic features (10 zeros). So 68 of the 1,007 answers on manic
  episodes are yes, a share comparable with the DSM-IV form. The number
  with psychotic features is 0 where the yes/no is 0.

  Answers that contradict each other are delivered as typed: 6 inclusions
  say yes and then give 0 for every kind of episode; 1 gives a number after
  a no and 1 gives numbers with no first answer; 1 says yes to a depressive
  episode with psychotic features after 0 depressive episodes; 4 give more
  depressive episodes with psychotic features than depressive episodes, and
  1 more manic ones than manic episodes.

  Centres. Centre A fills this section for 4 of its 145 DSM-5 inclusions
  (O40) and centre C for none of its 119 (R20); in the other centres the
  first answer is filled for 88% of the DSM-5 inclusions, as with the
  DSM-IV form. Centre B leaves it empty for 65 of its 164 inclusions of
  2022 to 2024. Centres B and E report a manic episode in the year more
  often (24% and 19%, against 6% in the other centres), as they did with
  the DSM-IV form (23% each in 2016-2021, against 12%). 22 of the 59
  unknown numbers of hypomanic episodes come from centre F.

version:
  name: dsm_version
  column: dsm_criteria
  codes: {DSM4: dsm4, DSM5: dsm5}
  level: patient
  follow_up: {dsm5: 2022-01-01}
  by_inclusion_date:
    dsm4: [1900-01-01, 2019-12-31]
    dsm5: [2023-01-01, 2100-12-31]

defaults: {versions: [dsm5]}

variables:
  dsm5_ly_any_episode: {column: rad_tb_hum_epthyman, type: item, range: [0, 1], codes: {Oui: 1, Non: 0}, label: "At least one mood episode in the past year"}

  dsm5_ly_mde: {column: mhoccur_edm_ly, type: item, range: [0, 1], asked_if: dsm5_ly_any_episode, label: "At least one major depressive episode in the past year"}
  dsm5_ly_n_mde: {column: evnum_edm_ly, type: number, range: [0, 20], winsor: false, asked_if: dsm5_ly_any_episode, label: "Number of major depressive episodes in the past year"}
  dsm5_ly_mde_psychotic: {column: mhoccur_edmpsy_ly, type: item, range: [0, 1], codes: {Oui: 1, Non: 0}, asked_if: dsm5_ly_mde, label: "At least one major depressive episode with psychotic features in the past year"}
  dsm5_ly_n_mde_psychotic: {column: evnum_edmpsy_ly, type: number, range: [0, 20], winsor: false, asked_if: dsm5_ly_mde_psychotic, label: "Number of major depressive episodes with psychotic features in the past year"}
  dsm5_ly_hypomania: {column: mhoccur_ehman_ly, type: item, range: [0, 1], asked_if: dsm5_ly_any_episode, label: "At least one hypomanic episode in the past year"}
  dsm5_ly_n_hypomania: {column: evnum_ehman_ly, type: number, range: [0, 20], winsor: false, asked_if: dsm5_ly_any_episode, label: "Number of hypomanic episodes in the past year"}
  dsm5_ly_mania: {column: mhoccur_epman_ly, type: item, range: [0, 1], asked_if: dsm5_ly_any_episode, label: "At least one manic episode in the past year"}
  dsm5_ly_n_mania: {column: evnum_epman_ly, type: number, range: [0, 20], winsor: false, asked_if: dsm5_ly_any_episode, label: "Number of manic episodes in the past year"}
  dsm5_ly_mania_psychotic: {column: mhoccur_epman_psy_ly, type: item, range: [0, 1], codes: {Oui: 1, Non: 0}, asked_if: dsm5_ly_mania, label: "At least one manic episode with psychotic features in the past year"}
  dsm5_ly_n_mania_psychotic: {column: evnum_epman_psy_ly, type: number, range: [0, 20], winsor: false, asked_if: dsm5_ly_mania_psychotic, label: "Number of manic episodes with psychotic features in the past year"}
