instrument: dsm5_episode_recent
title: Most recent mood episode at inclusion, DSM-5 criteria
tab: EVALUATION MEDICALE
section: Caractéristique  de l'EPISODE LE PLUS RECENT
status: reviewed
notes: >
  The most recent mood episode before the inclusion visit: its dates, type,
  specifier, chronicity, severity and whether it followed a birth. Filled
  once, at the inclusion visit. Yes/no answers are delivered as 1 and 0; "Ne
  sais pas" is a missing code.

  DSM-IV and DSM-5 are two editions (decision D9 in PROGRESS.md), asked on
  two inclusion forms and exported in the same columns. The application
  stores no edition: the export writes dsm_criteria on the inclusion row,
  DSM5 where the DSM-5 form holds one of five answers on the mood history,
  else DSM4 where the DSM-IV form does (DEV-11). The label is DSM-IV until
  2019 (7 DSM-5 exceptions), DSM-5 on 24 of 380 labelled inclusions in
  2020, 44 of 425 in 2021 and 203 of 238 in 2022 (the 35 DSM-IV ones of
  2022 are dated January to May), and DSM-5 on all from 2023. This schema
  reads the DSM-5 visits; dsm4_episode_recent.yaml reads the others. Both
  carry the version block of the follow-up schemas (D12, D14, D15): an
  inclusion with no label is read by the date of the patient's first visit
  (the screening, where there is one), DSM-IV before 2020 and DSM-5 from
  2023 (version_inferred), and has no version from 2020 to 2022
  (version_unknown, not delivered). Why labels are missing: see
  dsm5_depuis_derniere_visite.yaml. In this section 6 unlabelled
  inclusions are read by date (5 DSM-IV, 1 DSM-5) and 3 of 2020 and 2021
  are not delivered (R69 would label them).

  The DSM-5 form has no mixed type of episode. The specifier of a
  depressive episode is melancholic, atypical, catatonic, mixed (44 visits)
  or none of these. 9 inclusions labelled DSM-5 (2018 to 2022) also hold a
  DSM-IV record (a lifetime number of mixed episodes), and the export takes
  their answers here from the DSM-IV record first; 8 of them hold a most
  recent episode, and 6 carry the DSM-IV wording of "none" (read as none).
  The two forms ask the same questions here except the mixed type and the
  mixed specifier, which none of the 8 holds. They are delivered (R70).

  Each detail is asked for some types only: the specifier and the
  chronicity for a depressive episode, the severity for a depressive, manic
  or unspecified one, the postpartum onset for every type. The DSM-5 form
  keeps the answer rules of the DSM-IV form, where the fourth type was the
  mixed one, so unlike the DSM-IV form it asks the severity and the
  postpartum onset of an unspecified episode (21 of 21 answered).

  The most recent episode or the current one. Where the patient is in an
  episode at inclusion, the clinicians often described that episode here:
  of the 374 such visits with a type, 272 give the type of the current
  episode and 187 have no end date (with no current episode, 79 of 622 have
  none). The share with an end date goes from 20% to 88% between centres.
  Use dsm5_current_* for the episode of the day.

  Dates. Of the 935 start dates, 19 are after the visit; of the 749 end
  dates, 14 are more than a month after the visit and 14 are before the
  start. They are delivered as written. 1000-01-01 is the placeholder that
  the application writes into empty dates since its version of 2024-07-25
  (D98): 50 start and 93 end dates (date_placeholder), 105 of them on
  visits of 2025 and 2026. 11 dates have the year 0000 with a month or a
  day (2 start, 9 end): out_of_range, not delivered. 41 dates have no day or
  no month and are read as the middle of the period (date_partial).

  Centres. There is no answer from centre C (R20), nor from centre A for
  its 141 inclusions from 2023 (O40). Centre B leaves this section empty
  for 66 of its 164 inclusions of 2022 to 2024, against 32 of 382 in 2016
  to 2021.

  The type of the most recent episode recorded at the follow-up visits is
  another column, read by the schemas of the follow-up form. Not in the
  extraction: the DSM-5 form asks whether a manic or unspecified episode is
  catatonic and whether a manic one has mixed features.

version:
  name: dsm_version
  column: dsm_criteria
  codes: {DSM4: dsm4, DSM5: dsm5}
  level: patient
  follow_up: {dsm5: 2022-01-01}
  by_inclusion_date:
    dsm4: [1900-01-01, 2019-12-31]
    dsm5: [2023-01-01, 2100-12-31]

defaults: {versions: [dsm5]}

variables:
  dsm5_recent_start_date: {column: cestdtcepisode_recent, type: date, range: [1950-01-01, 2026-12-31], label: "Start of the most recent episode"}
  dsm5_recent_end_date: {column: ceendtcepisode_recent, type: date, range: [1950-01-01, 2026-12-31], label: "End of the most recent episode"}
  dsm5_recent_type: {column: cetermepisode_recent, type: category, codes: {"Episode Dépressif Majeur": mde, "Hypomanie": hypomania, "Manie": mania, "Episode non spécifié": unspecified}, label: "Type of the most recent episode"}
  dsm5_recent_specifier: {column: cedecodepisode_recent, type: category, codes: {"Sans caractéristique mélancolique atypique ou catatonique": none, "Sans caractéristique mélancolique atypique catatonique ou mixte": none, "Mélancolique": melancholic, "Atypique": atypical, "Catatonique": catatonic, "Mixte": mixed}, label: "Most recent episode, if depressive: specifier"}
  dsm5_recent_chronic: {column: chronepisode_recent, type: item, range: [0, 1], codes: {Oui: 1, Non: 0}, label: "Most recent episode, if depressive: chronic"}
  dsm5_recent_severity: {column: cesevepisode_recent, type: category, codes: {"Léger": mild, "Modéré": moderate, "Sévère sans caractéristiques psychotiques": severe, "Sévère sans caractéristique psychotique": severe, "Sévère avec caractéristiques psychotiques congruentes": severe_psychotic_congruent, "Sévère avec caractéristiques psychotiques non congruentes": severe_psychotic_incongruent}, label: "Severity of the most recent episode (depressive, manic or unspecified)"}
  dsm5_recent_postpartum: {column: ppartepisode_recent, type: item, range: [0, 1], codes: {Oui: 1, Non: 0}, label: "Most recent episode: after a birth"}
