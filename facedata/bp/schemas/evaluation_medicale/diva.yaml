scores:
  diva_adult_a_total:
    label: Number of criteria of attention, adult (0 to 9)
    sum: [diva_adult_a1, diva_adult_a2, diva_adult_a3, diva_adult_a4, diva_adult_a5, diva_adult_a6, diva_adult_a7, diva_adult_a8, diva_adult_a9]
    compare: diva_adult_a_stored
  diva_child_a_total:
    label: Number of criteria of attention, childhood (0 to 9)
    sum: [diva_child_a1, diva_child_a2, diva_child_a3, diva_child_a4, diva_child_a5, diva_child_a6, diva_child_a7, diva_child_a8, diva_child_a9]
    compare: diva_child_a_stored
  diva_adult_hi_total:
    label: Number of criteria of hyperactivity-impulsivity, adult (0 to 9)
    sum: [diva_adult_hi1, diva_adult_hi2, diva_adult_hi3, diva_adult_hi4, diva_adult_hi5, diva_adult_hi6, diva_adult_hi7, diva_adult_hi8, diva_adult_hi9]
    compare: diva_adult_hi_stored
  diva_child_hi_total:
    label: Number of criteria of hyperactivity-impulsivity, childhood (0 to 9)
    sum: [diva_child_hi1, diva_child_hi2, diva_child_hi3, diva_child_hi4, diva_child_hi5, diva_child_hi6, diva_child_hi7, diva_child_hi8, diva_child_hi9]
    compare: diva_child_hi_stored
