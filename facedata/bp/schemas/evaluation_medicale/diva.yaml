  # Criteria of hyperactivity-impulsivity, childhood
  diva_child_hi1: {column: divaehi1, type: item, range: [0, 1], label: "DIVA criterion H/I1, childhood"}
  diva_child_hi2: {column: divaehi2, type: item, range: [0, 1], label: "DIVA criterion H/I2, childhood"}
