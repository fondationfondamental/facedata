  diva_adult_a2: {column: divaaa2, type: item, range: [0, 1], label: "DIVA criterion A2, adult"}
  diva_adult_a3: {column: divaaa3, type: item, range: [0, 1], label: "DIVA criterion A3, adult"}
  diva_adult_a4: {column: divaaa4, type: item, range: [0, 1], label: "DIVA criterion A4, adult"}
  diva_adult_a5: {column: divaaa5, type: item, range: [0, 1], label: "DIVA criterion A5, adult"}
  diva_adult_a6: {column: divaaa6, type: item, range: [0, 1], label: "DIVA criterion A6, adult"}
  diva_adult_a7: {column: divaaa7, type: item, range: [0, 1], label: "DIVA criterion A7, adult"}
  diva_adult_a8: {column: divaaa8, type: item, range: [0, 1], label: "DIVA criterion A8, adult"}
  diva_adult_a9: {column: divaaa9, type: item, range: [0, 1], label: "DIVA criterion A9, adult"}
  diva_adult_a_stored: {column: divaaa, type: item, range: [0, 9], keep: false, label: "Number of criteria of attention, adult, as stored"}

  # Criteria of attention, childhood
  diva_child_a1: {column: divaea1, type: item, range: [0, 1], label: "DIVA criterion A1, childhood"}
  diva_child_a2: {column: divaea2, type: item, range: [0, 1], label: "DIVA criterion A2, childhood"}
  diva_child_a3: {column: divaea3, type: item, range: [0, 1], label: "DIVA criterion A3, childhood"}
  diva_child_a4: {column: divaea4, type: item, range: [0, 1], label: "DIVA criterion A4, childhood"}
  diva_child_a5: {column: divaea5, type: item, range: [0, 1], label: "DIVA criterion A5, childhood"}
  diva_child_a6: {column: divaea6, type: item, range: [0, 1], label: "DIVA criterion A6, childhood"}
  diva_child_a7: {column: divaea7, type: item, range: [0, 1], label: "DIVA criterion A7, childhood"}
  diva_child_a8: {column: divaea8, type: item, range: [0, 1], label: "DIVA criterion A8, childhood"}
  diva_child_a9: {column: divaea9, type: item, range: [0, 1], label: "DIVA criterion A9, childhood"}
