  diva_adult_a1: {column: divaaa1, type: item, range: [0, 1], label: "DIVA criterion A1, adult"}
  diva_adult_a2: {column: divaaa2, type: item, range: [0, 1], label: "DIVA criterion A2, adult"}
  diva_adult_a3: {column: divaaa3, type: item, range: [0, 1], label: "DIVA criterion A3, adult"}
  diva_adult_a4: {column: divaaa4, type: item, range: [0, 1], label: "DIVA criterion A4, adult"}
