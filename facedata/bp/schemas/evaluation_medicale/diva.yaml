  # Criteria of hyperactivity-impulsivity, adult
  diva_adult_hi1: {column: divaahi1, type: item, range: [0, 1], label: "DIVA criterion H/I1, adult"}
  diva_adult_hi2: {column: divaahi2, type: item, range: [0, 1], label: "DIVA criterion H/I2, adult"}
  diva_adult_hi3: {column: divaahi3, type: item, range: [0, 1], label: "DIVA criterion H/I3, adult"}
  diva_adult_hi4: {column: divaahi4, type: item, range: [0, 1], label: "DIVA criterion H/I4, adult"}
  diva_adult_hi5: {column: divaahi5, type: item, range: [0, 1], label: "DIVA criterion H/I5, adult"}
  diva_adult_hi6: {column: divaahi6, type: item, range: [0, 1], label: "DIVA criterion H/I6, adult"}
  diva_adult_hi7: {column: divaahi7, type: item, range: [0, 1], label: "DIVA criterion H/I7, adult"}
  diva_adult_hi8: {column: divaahi8, type: item, range: [0, 1], label: "DIVA criterion H/I8, adult"}
