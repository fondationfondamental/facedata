  diva_adult_hi1: {column: divaahi1, type: item, range: [0, 1], label: "DIVA criterion H/I1, adult"}
  diva_adult_hi2: {column: divaahi2, type: item, range: [0, 1], label: "DIVA criterion H/I2, adult"}
