instrument: dsm4_vie_entiere
title: Mood disorder over the whole life, DSM-IV criteria
tab: EVALUATION MEDICALE
section: Caractéristique du trouble vie entière
status: reviewed
notes: >
  The mood disorder over the whole life, as recorded at the inclusion visit:
  the number of episodes of each kind, those with psychotic features,
  induced episodes, rapid cycling, remission between episodes, seasonal
  pattern and the age at the first psychotropic treatment. Yes/no answers
  are delivered as 1 and 0; "Ne sais pas" is a missing code.

  DSM-IV and DSM-5 are two editions (decision D9 in PROGRESS.md), asked on
  two inclusion forms and exported in the same columns. The application
  stores no edition: the export writes dsm_criteria on the inclusion row,
  DSM5 where the DSM-5 form holds one of five answers on the mood history,
  else DSM4 where the DSM-IV form does (DEV-11). The label is DSM-IV until
  2019 (7 DSM-5 exceptions), DSM-5 on 24 of 380 labelled inclusions in
  2020, 44 of 425 in 2021 and 203 of 238 in 2022 (the 35 DSM-IV ones of
  2022 are dated January to May), and DSM-5 on all from 2023. This schema
  reads the DSM-IV visits; dsm5_vie_entiere.yaml reads the others. Both
  carry the version block of the follow-up schemas (D12, D14, D15): an
  inclusion with no label is read by the date of the patient's first visit
  (the screening, where there is one), DSM-IV before 2020 and DSM-5 from
  2023 (version_inferred), and has no version from 2020 to 2022
  (version_unknown, not delivered). Why labels are missing: see
  dsm4_depuis_derniere_visite.yaml. In this section 6 unlabelled
  inclusions are read by date (4 DSM-IV, 2 DSM-5) and none is left without
  a version. The DSM-IV form counts mixed episodes; the DSM-5 form has
  none.

  Counts. The form stops at 20: ">20" is read as 20 with a mark in the
  censoring column (this value or more; 236 depressive, 190 hypomanic, 12
  manic, 12 mixed, 4 induced and 3 with psychotic features). The range of
  every lifetime count is 0 to 20, as the form's: no number is out of
  range. "Ne sais pas" is 15% of the numbers of depressive episodes (5% to
  33% by centre), 24% of the hypomanic (9% to 40%), 13% of the mixed and 5%
  of the manic ones.

  Psychotic features and induced episodes. The form asks the yes/no about
  psychotic features of every patient, with or without an episode of that
  kind. The number of episodes with psychotic features, and of induced
  episodes, is asked only after a yes (asked_if): it is 0 where the answer
  to "at least one" is no.
  The yes/no itself is 0 where the number of that kind of episode is 0 and
  the rater left it empty (asked_if on the number, D122, as in the DSM-5
  lifetime schema and in the year and follow-up sections): 19 depressive,
  256 manic and 293 mixed zeros, and the three numbers with psychotic
  features follow with 0 (1,136 cells in all). Where the number of that
  kind is "Ne sais pas" or empty the answer stays missing.

  Answers that contradict each other are delivered as written: 7 numbers
  above 0 are typed after a no (2 depressive and 3 manic with psychotic
  features, 2 induced), and 17 induced numbers "Ne sais pas" after a no
  stay missing; the number with psychotic features is above the number of
  that kind of episode for 15 manic and 8 mixed; a yes to psychotic
  features goes with no episode of that kind for 10 manic and 12 mixed.

  The age at the first psychotropic treatment is a list from "<5" to ">89"
  on the form: "<5" is read as 5 and censored_left (6 patients), ">89" as
  89 and censored_right (none; D122). Delivered as written: 173 of the
  4,053 patients with both ages have a first treatment more than two years
  before their first episode (dsm4_first_episode_age; 4.3%: a psychotropic
  treatment can come before the first mood episode, so this is not an
  error); 21 give an age at the first treatment above their age at
  inclusion (by up to 18.9 years; 8 by more than a year and 7 by two years
  or more, and only a difference above one year is an error). In one centre
  (J, 74 inclusions of 2015 to 2022) the first treatment comes a median 6
  years after the first episode, against 0 to 1 year in the other large
  centres.

  Not loaded (ignored.yaml). mhoccur_edm_lt, mhoccur_ehman_lt,
  mhoccur_epman_lt and mhoccur_epmixt_lt say "Y" where the count of the row
  is 1 or more and "N" everywhere else, also where the count is unknown or
  empty and on every row of the other visits: the export writes them, and
  their "N" does not mean "none" (R71). The three columns
  mhoccur_edm_psy_spv, mhoccur_epman_psy_spv and mhoccur_epmixt_psy_spv are
  copies of the lifetime columns read here, filled at inclusion only (R72).

version:
  name: dsm_version
  column: dsm_criteria
  codes: {DSM4: dsm4, DSM5: dsm5}
  level: patient
  follow_up: {dsm5: 2022-01-01}
  by_inclusion_date:
    dsm4: [1900-01-01, 2019-12-31]
    dsm5: [2023-01-01, 2100-12-31]
  override: {dsm4: [evnum_epmixt_spv, evnum_epmixt_psy_spv, evnum_epthym_spv]}

defaults: {versions: [dsm4]}

variables:
  dsm4_lt_n_mde: {column: evnum_edm_lt, type: number, range: [0, 20], winsor: false, label: "Number of major depressive episodes over the life"}
  dsm4_lt_mde_psychotic: {column: mhoccur_edm_psy_lt, type: item, range: [0, 1], codes: {Oui: 1, Non: 0}, asked_if: dsm4_lt_n_mde, label: "At least one major depressive episode with psychotic features"}
  dsm4_lt_n_mde_psychotic: {column: evnum_edm_psy_lt, type: number, range: [0, 20], winsor: false, asked_if: dsm4_lt_mde_psychotic, label: "Number of major depressive episodes with psychotic features"}
  dsm4_lt_n_hypomania: {column: evnum_ehman_lt, type: number, range: [0, 20], winsor: false, label: "Number of hypomanic episodes over the life"}
  dsm4_lt_n_mania: {column: evnum_epman_lt, type: number, range: [0, 20], winsor: false, label: "Number of manic episodes over the life"}
  dsm4_lt_mania_psychotic: {column: mhoccur_epman_psy_lt, type: item, range: [0, 1], codes: {Oui: 1, Non: 0}, asked_if: dsm4_lt_n_mania, label: "At least one manic episode with psychotic features"}
  dsm4_lt_n_mania_psychotic: {column: evnum_epman_psy_lt, type: number, range: [0, 20], winsor: false, asked_if: dsm4_lt_mania_psychotic, label: "Number of manic episodes with psychotic features"}
  dsm4_lt_n_mixed: {column: evnum_epmixt_lt, type: number, range: [0, 20], winsor: false, label: "Number of mixed episodes over the life"}
  dsm4_lt_mixed_psychotic: {column: mhoccur_epmixt_psy_lt, type: item, range: [0, 1], codes: {Oui: 1, Non: 0}, asked_if: dsm4_lt_n_mixed, label: "At least one mixed episode with psychotic features"}
  dsm4_lt_n_mixed_psychotic: {column: evnum_epmixt_psy_lt, type: number, range: [0, 20], winsor: false, asked_if: dsm4_lt_mixed_psychotic, label: "Number of mixed episodes with psychotic features"}
  dsm4_lt_induced: {column: mhoccur_epind_lt, type: item, range: [0, 1], codes: {Oui: 1, Non: 0}, label: "At least one induced episode (switch under antidepressants or ECT)"}
  dsm4_lt_n_induced: {column: evnum_epind_lt, type: number, range: [0, 20], winsor: false, asked_if: dsm4_lt_induced, label: "Number of induced episodes"}

  dsm4_lt_rapid_cycling: {column: cyclerap, type: item, range: [0, 1], codes: {Oui: 1, Non: 0}, label: "Rapid cycling, now or in the past"}
  dsm4_lt_full_remission: {column: remisc, type: item, range: [0, 1], codes: {Oui: 1, Non: 0}, label: "Full remission between the episodes"}
  dsm4_lt_seasonal: {column: saison, type: item, range: [0, 1], codes: {Oui: 1, Non: 0}, label: "Seasonal pattern"}
  dsm4_lt_first_treatment_age: {column: agetrt, type: number, unit: years, range: [0, 90], winsor: false, label: "Age at the first psychotropic treatment"}
