instrument: trouble_psychotique_v0
title: Psychotic disorder (inclusion visit)
tab: EVALUATION MEDICALE
section: Trouble PSYCHOTIQUE
status: reviewed
notes: >
  Whether the patient has a psychotic disorder, which one, since when and
  whether symptoms were present in the past month. The form asks "Le
  patient a-t-il un trouble psychotique": it does not say "other than the
  mood disorder". Rare in this cohort: 69 of the 5,394 inclusions answer
  yes (1.3%), 12 of them in one centre (F) in 2016 to 2018. Of these 69, 10
  have no type, 15 no answer about the past month and 21 no date of onset.
  Yes/no answers are delivered as 1 and 0; "Ne sais pas" is a missing code
  (70).

  Two periods in the same columns (decision D53 in PROGRESS.md), as for the
  comorbidities (D49, D50): the question is asked at the inclusion visit and
  at every follow-up visit, with the same wording ("does the patient have a
  psychotic disorder"). The follow-up answer is an update given at that
  visit (decision D84 in PROGRESS.md).
  Of the 73 follow-up answers of patients who had a psychotic disorder at
  inclusion, 70 are "no" and 3 are "yes". The two are delivered as separate
  columns, ending in _v0 and _fu; visit_form says which form a visit used
  and is read from the visit label.

  The DSM-IV and the DSM-5 inclusion forms ask the same four questions and
  offer the same nine disorders, so this section is not split by DSM
  version. Two of the nine (shared psychotic disorder, and one due to a
  general medical condition) hold no answer today. 9 inclusions labelled
  DSM-5 also hold a DSM-IV record, and the export takes their answers here
  from the DSM-IV record first (R70).

  The details are shown only after a yes. 2 inclusions answered no keep a
  detail (a type and an answer about the past month on one, a date on the
  other); they are delivered as written, as in D50.

  Date of onset. 1000-01-01 is the placeholder that the application writes
  into empty dates since its version of 2024-07-25 (D98): 319 cells at
  inclusion, 269 of them on visits of 2025 and 2026 and 296 next to a "no":
  date_placeholder. 49 real dates, none after the visit; 1 has no day and
  is read as the 15th of its month (date_partial).

