instrument: trouble_psychotique_v0
title: Psychotic disorder (inclusion visit)
tab: EVALUATION MEDICALE
section: Trouble PSYCHOTIQUE
status: draft
notes: >
  Whether the patient has a psychotic disorder other than the mood disorder,
  which one, since when and whether symptoms were present in the past month.
  Rare in this cohort: 69 patients at inclusion (1.3%). Yes/no answers are
  delivered as 1 and 0; "Ne sais pas" is a missing code.

  Two periods in the same columns (decision D53 in PROGRESS.md), as for the
  comorbidities (D49, D50): the question is asked at the inclusion visit and
  at every follow-up visit, where it is about the time since the last visit.
  Of the 73 follow-up answers of patients who had a psychotic disorder at
  inclusion, 69 are "no". The two are delivered as separate columns, ending
  in _v0 and _fu; visit_form says which form a visit used and is read
  from the visit label.

  Date of onset. 686 cells hold 1000-01-01, the form's placeholder, 611 of
  them in 2025 and 2026 and almost all next to a "no": date_placeholder. 71
  real dates.

  The DSM-IV and the DSM-5 forms offer the same disorders, so this section
  is not split by DSM version.

version:
  name: visit_form
  column: visit
  codes:
    V0: inclusion
    V1_an: follow_up
    V2_ans: follow_up
    V3_ans: follow_up
    V4_ans: follow_up
    V5_ans: follow_up
    V6_ans: follow_up
    V7_ans: follow_up
    V8_ans: follow_up
    V9_ans: follow_up
    V10_ans: follow_up
    V6_mois: follow_up
    V18_mois: follow_up
    V30_mois: follow_up
    V42_mois: follow_up
    V54_mois: follow_up
    V66_mois: follow_up
    V78_mois: follow_up
    V90_mois: follow_up
    V102_mois: follow_up
    V114_mois: follow_up
    V126_mois: follow_up

defaults: {versions: [inclusion]}

variables:
  psychotic_disorder_v0: {column: ceoccurtroubpsy, type: item, range: [0, 1], codes: {Oui: 1, Non: 0}, label: "Has a psychotic disorder, at inclusion"}
  psychotic_onset_date_v0: {column: cestdtctroubpsy, type: date, range: [1920-01-01, 2026-12-31], label: "Psychotic disorder: date of onset, at inclusion"}
  psychotic_type_v0: {column: cedecodtroubpsy, type: category, codes: {"Schizophrénie": schizophrenia, "Trouble schizophréniforme": schizophreniform, "Trouble schizo-affectif": schizoaffective, "Troubles délirants": delusional, "Trouble psychotique bref": brief_psychotic, "Trouble psychotique induit par une substance": substance_induced, "Trouble psychotique non spécifié": unspecified}, label: "Psychotic disorder: which one, at inclusion"}
  psychotic_last_month_v0: {column: occurtroubpsy, type: item, range: [0, 1], codes: {Oui: 1, Non: 0}, label: "Psychotic disorder: symptoms in the past month, at inclusion"}
