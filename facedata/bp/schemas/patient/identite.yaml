instrument: identite
title: Patient identity
tab: PATIENT
section: IDENTIFICATION PATIENT
status: reviewed
level: patient
notes: >
  One value per patient. The extraction repeats these columns on every visit
  row, and they never change between the visits of a patient.

  The date of birth is exported with the day set to the 15th for every
  patient. The stored age is the age at the inclusion visit (V0): it equals
  the age computed from the date of birth and the V0 date for 6,490 of 6,498
  patients, and is one year more for the other 8.

  The type of disorder holds three values, plus the abbreviations BPNOS and
  TBNOS (one patient each), read as "not otherwise specified". In the
  application it is the mood-disorder diagnosis of the DSM form, which the
  clinician fills at every visit; the export gives one value per patient,
  and which visit it comes from is asked in QUESTIONS.md (DM-7). Type 2
  rises from 40% of the patients included until 2012 to about 60% of those
  included from 2022, in most centres, and type 1 falls from 46% to 34%:
  no step at one date in one centre.

  fondacode (the column subjid) is the patient code of the foundation. A
  usubjid is a number given inside the cohort: it can change from one
  extraction to the next for a patient registered in two centres, and 824
  numbers are also used in FACE SZ for other patients. The fondacode does
  neither: it is the key to join two extractions or two cohorts (decision
  D76 in PROGRESS.md). It is a text and never appears in the report.

  Not loaded: nom_centre (empty; in ignored.yaml). usubjid and siteid are
  key columns. The dictionary also lists armcd and ageu, which are not in
  the extraction.

variables:
  fondacode:
    column: subjid
    label: Patient code of the foundation, the same in every extraction and unique across the cohorts
    type: text
  sex:
    label: Sex
    type: category
    codes: {Feminin: female, Masculin: male}
  diagnosis:
    column: arm
    label: Type of bipolar disorder
    type: category
    codes:
      Bipolaire de type 1: bp1
      Bipolaire de type 2: bp2
      Bipolaire non spécifié: bp_nos
      BPNOS: bp_nos
      TBNOS: bp_nos
  birth_date:
    column: brthdtc
    label: Date of birth (the export sets the day to the 15th)
    type: date
    range: [1900-01-01, 2012-12-31]
  age_at_inclusion:
    column: age
    label: Age at the inclusion visit, in years
    type: item
    range: [15, 100]
