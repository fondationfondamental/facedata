instrument: visit_record
title: Visit record
tab: PATIENT
section: visit
status: reviewed
notes: >
  One value per visit. The visit label, its date and the identifiers of this
  dictionary section are key columns, built by the pipeline for every
  instrument. What is left is the date at which the visit record was
  created: in the application it is a time stamp written when the record is
  opened for the first time.

  It is the visit date itself for 63% of the visits and within a month after
  it for 17%. It is before the visit date for 2,661 visits (2% of the visits
  until 2015, 23% from 2022: the records are more and more opened ahead of
  the visit) and more than a year after it for 451. It says when the form
  was created, not when the patient came.

  Not loaded: id_fiche_clinique, the identifier of the record (in
  ignored.yaml).

variables:
  entry_date:
    column: date_saisie
    label: Date the visit record was created
    type: date
    range: [2008-01-01, 2030-12-31]
