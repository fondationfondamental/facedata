instrument: fin_de_suivi
title: End of follow-up
tab: PATIENT
section: Fin de suivi
status: draft
level: patient
notes: >
  One value per patient.

  The extraction holds two generations of the same form. The columns ending
  in _patient (dictionary section "patient") were used until about 2022, the
  columns ending in _stopsuivi (section "Fin de suivi") from 2018 on. The
  questions and the answers are the same, so each variable reads the new
  column first and the old one when the new one is empty (decision D17 in
  PROGRESS.md). Five patients have a reason in both; for two of them the
  two reasons differ (column_conflict, the new one is kept).

  The EMR writes the placeholder 1000-01-01 in the two date columns when
  there is nothing to record: 157 patients who are not recorded as deceased
  have it as their date of death. It becomes missing (date_placeholder).

  22 patients are recorded as deceased and 17 have a date of death (one of
  them a year only); one of these dates belongs to a patient without that
  reason.

  The free-text columns (other reason, new centre, new diagnosis, other
  cause of death) are delivered as text and never appear in the report.
  The new diagnosis of the newer form is in the extraction under the name
  lost_to_follow_up_chgdiag_stopsuivi; the dictionary spells it
  lost_to_follow_up_chdiag_stopsuivi. nom_centre_expert, which the
  dictionary also lists, is not in the extraction.

variables:
  followup_end_reason:
    column: [lost_to_followup_stopsuivi, lost_to_follow_up_patient]
    label: Reason why the patient is no longer followed
    type: category
    codes:
      Refus du patient: patient_refused
      Refus de son médecin: doctor_refused
      Déménagement: moved
      Changement de diagnostic: diagnosis_changed
      Patient décédé: deceased
      Autre: other
  followup_end_reason_detail:
    column: [lost_to_follow_up_autre_stopsuivi, lost_to_follow_up_autre_patient]
    label: Other reason, free text
    type: text
  followup_end_new_centre:
    column: [lost_to_follow_up_demenag_stopsuivi, lost_to_follow_up_demenag_patient]
    label: New expert centre after a move, free text
    type: text
  new_diagnosis:
    column: [lost_to_follow_up_chgdiag_stopsuivi, lost_to_follow_up_chdiag_patient]
    label: New diagnosis, free text
    type: text
  diagnosis_change_date:
    column: [rfpendtc_stopsuivi, rfpendtc_patient]
    label: Date of the change of diagnosis
    type: date
    range: [2008-01-01, 2030-12-31]
  death_date:
    column: [dthdtc_stopsuivi, dthdtc_patient]
    label: Date of death
    type: date
    range: [2008-01-01, 2030-12-31]
  death_cause:
    column: [causedec_stopsuivi, causedec_patient]
    label: Main cause of death
    type: category
    codes: {Suicide: suicide, Somatique: somatic, Autre: other}
  death_cause_detail:
    column: [causedec_autr_stopsuivi, causedec_autre_patient]
    label: Other cause of death, free text
    type: text
