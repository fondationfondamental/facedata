instrument: inclusion
title: Inclusion
tab: PATIENT
section: Inclusion
status: draft
level: patient
notes: >
  One value per patient.

  Open question O16 in PROGRESS.md: the dictionary gives neither a label nor
  a coding for these two columns. Until their meaning is known, the codes
  are delivered as written.

  formoppos (computer name rad_html_formoppos) is filled for 613 patients,
  most of them included from 2021 on: 610 with code 1 and 3 with code 2. If
  it records an opposition to the use of the data, those patients matter.

  social_protec (computer name PROTEC) is the legal protection measure of
  the SOCIAL tab ("7. Mesures de protection": 0 none, 1 curatelle, 2
  tutelle, 3 sauvegarde de justice): the column protec of that tab holds the
  same answer on every inclusion visit (decision D55 in PROGRESS.md). It is
  filled for 4,840 patients: 4,774 with no measure, 62 under curatelle and
  4 under tutelle. protec itself is not loaded.

variables:
  opposition_form:
    column: formoppos
    label: Opposition form (codes not documented)
    type: category
    codes: {1: "1", 2: "2"}
  protection_measure:
    column: social_protec
    label: Legal protection measure
    type: category
    codes: {0: none, 1: curatorship, 2: guardianship, 3: judicial_protection}
