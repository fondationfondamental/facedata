instrument: wurs25
title: Wender Utah Rating Scale, 25 items (WURS-25)
tab: AUTO-QUESTIONNAIRES
section: Questionnaire WURS (version réduite 25 items)
status: reviewed
notes: >
  WURS-61 and WURS-25 are two instruments. The 25-item WURS-25 replaced the
  61-item WURS (confirmed by the developers of the EMR, decision D47 in
  PROGRESS.md). Its 25 questions are 25 of the 61, and the extraction stores
  both in the same columns. This schema reads those columns on the visits
  where the 25-item questionnaire was filled. Nothing in the WURS columns
  says which form a visit used; it is read from the ALS and the BIS of the
  same visit: "wurs25" when the visit holds ALS or BIS answers and nothing
  that only the long questionnaires have. wurs61.yaml reads the other
  visits and explains the rule and its limit. Both files carry the same
  version block.

  Filled once, at the inclusion visit: symptoms of attention deficit and
  hyperactivity in childhood. Each item is 0 (not at all) to 4 (very much).

  Item names. The EMR kept the numbers that the questions have in the
  61-item questionnaire: wurs25_03 is the question numbered 3 there. The
  25-item form shows the questions in the rising order of these numbers
  and prints the numbers themselves (3, 4, 5 ... 59) (read in the
  application in November 2026; decision D97 in PROGRESS.md).

  The stored total (wurs) equals the sum of the 25 items (0 to 100) in all
  6,082 rows where both exist (the export's score step writes it, D120).

  Before 2021. The data managers found no visit with only the reduced
  questionnaires before 2021, and advise not to deliver the questionnaires
  of a visit that looks like one (decision D71 in PROGRESS.md). The version
  block says so (since): a visit dated before 2021 that would be read here
  has no form, gets version_unknown, and its answers are not delivered. 8
  visits, dated 2018 to 2020, each with its 25 answers; als18.yaml says
  what they look like.

