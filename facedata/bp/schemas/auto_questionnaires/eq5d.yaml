instrument: eq5d
title: EQ-5D-5L, health-related quality of life
tab: AUTO-QUESTIONNAIRES
section: Questionnaire EQ5D
status: reviewed
notes: >
  Five dimensions, each rated 1 (no problem) to 5 (extreme problem), and a
  visual scale of today's health from 0 to 100. In the extraction from 2012 (6 visits) and 2013.

  The index (eq5d_) is read in a value set from the five answers; 1 is full
  health and the lowest value in the data is -0.53. The index is a table of
  the 3,125 profiles in the application's script (hetero_eq5d.js; the
  country of the value set is not stated): the stored index equals it on all
  12,668 visits with the five answers, and one index goes with one profile
  in BP, SZ and ASP, the same in the three. Since decision D133 the index
  delivered is the table's value, read from the five answers (the table is
  norms/eq5d_index.csv, outside the repository), and the stored one is a
  check (score_mismatch). The same score is computed in SZ, DR and ASP, so
  the index is the same variable in the four cohorts.

defaults: {type: item, range: [1, 5]}

variables:
  eq5d0201: {label: "Mobilité"}
  eq5d0202: {label: "Autonomie de la personne"}
  eq5d0203: {label: "Activités courantes (exemples : travail, études, travaux domestiques,..."}
  eq5d0204: {label: "Douleurs, gêne"}
  eq5d0205: {label: "Anxiété, dépression"}
  eq5d_vas: {column: eq5d0206, type: number, label: "Health today, visual scale", range: [0, 100], winsor: false}
  eq5d_index_stored: {column: eq5d_, type: number, label: "EQ-5D-5L index as stored", range: [-0.6, 1], winsor: false, keep: false}

scores:
  eq5d_index:
    label: EQ-5D-5L index (the table of the application's script, one value per combination of the five answers)
    profile: eq5d_index
    from: [eq5d0201, eq5d0202, eq5d0203, eq5d0204, eq5d0205]
    compare: eq5d_index_stored
