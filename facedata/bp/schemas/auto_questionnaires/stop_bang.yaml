instrument: stop_bang
title: STOP-BANG, risk of obstructive sleep apnoea
tab: AUTO-QUESTIONNAIRES
section: APNEES DU SOMMEIL
status: reviewed
notes: >
  First filled in November 2020; regular from 2021. Seven yes/no questions (1 = yes): snoring, tiredness,
  observed apnoea, blood pressure, body mass index above 35, age above 50,
  neck size. The eighth criterion is male sex; its column (apnee08) is filled
  on two visits only and is not read (ignored.yaml).

  The risk class is delivered as the EMR wrote it. It is the rule of the
  application, not the published count: the seven questions are added
  without male sex; high from 5 of them, or from 2 of the first 4 with male
  sex, a body mass index above 35 or a large neck; intermediate from 3; low
  below. It differs from the published rule (male sex counted in the total)
  on 182 of 3,939 visits (4.6%), mostly men with 2 criteria shown as low. On
  26 visits the stored class does not follow the application's own rule
  (score computed on a click, D106). stopbang_count7 is the number of the
  seven criteria met (add 1 for male sex for the published total of 0 to 8).

  A few cells hold "d?AOS": the apostrophe was damaged by the export.

defaults: {type: item, range: [0, 1]}

variables:
  apnee01: {label: "Ronflements ? Ronflez-vous fort (suffisamment fort pour qu’on vous..."}
  apnee02: {label: "Fatigue ? Vous sentez-vous souvent fatigué(e), épuisé(e) ou..."}
  apnee03: {label: "Observation ? Quelqu'un a-t-il observé que vous arrêtiez de respirer ou..."}
  apnee04: {label: "Tension ? Êtes-vous atteint(e) d’hypertension artérielle ou êtes-vous..."}
  apnee05: {label: "Indice de Masse Corporelle supérieur à 35 kg/m² ?"}
  apnee06: {label: "Âge supérieur à 50 ans ?"}
  apnee07: {label: "Tour de cou important ? (mesuré au niveau de la pomme d’Adam) Pour les..."}
  stopbang_risk:
    column: apnee_
    type: category
    label: Risk of obstructive sleep apnoea
    codes:
      "Faible risque d’AOS": low
      "Faible risque d'AOS": low
      "Faible risque d?AOS": low
      "Risque moyen d’AOS": intermediate
      "Risque moyen d'AOS": intermediate
      "Risque moyen d?AOS": intermediate
      "Risque élevé d’AOS": high
      "Risque élevé d'AOS": high
      "Risque élevé d?AOS": high

scores:
  stopbang_count7:
    label: STOP-BANG, number of the seven criteria met (0 to 7; add 1 for male sex)
    sum: [apnee01, apnee02, apnee03, apnee04, apnee05, apnee06, apnee07]
