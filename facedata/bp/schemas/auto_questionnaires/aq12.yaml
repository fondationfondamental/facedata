  aq12_verbal: {label: "Short aggression questionnaire, verbal aggression", sum: [aq1202, aq1206, aq1210], compare: aq12_verbal_stored}
  aq12_anger: {label: "Short aggression questionnaire, anger", sum: [aq1203, aq1207, aq1211], compare: aq12_anger_stored}
  aq12_hostility: {label: "Short aggression questionnaire, hostility", sum: [aq1204, aq1208, aq1212], compare: aq12_hostility_stored}
  aq12_total:
    label: Short aggression questionnaire, total (12 items)
    sum: [aq1201, aq1202, aq1203, aq1204, aq1205, aq1206, aq1207, aq1208,
          aq1209, aq1210, aq1211, aq1212]
