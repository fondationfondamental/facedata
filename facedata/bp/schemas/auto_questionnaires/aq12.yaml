instrument: aq12
title: Short aggression questionnaire (12 items, four sub-scores)
tab: AUTO-QUESTIONNAIRES
section: Questionnaire AQ12
status: reviewed
notes: >
  Named AQ12 by the EMR; titled here by its content, a short aggression
  questionnaire. Its four sub-scores are the four factors of the Buss-Perry
  Aggression Questionnaire (physical aggression, verbal aggression, anger,
  hostility). A published 12-item short form with these four factors of
  three items each exists (Bryant and Smith 2001; French version rated 1 to
  6, Genoud and Zimmermann 2009, as cited by later papers); that these twelve
  items are that form, and the published item numbers of each sub-score,
  could not be confirmed (literature check 2026-11-21). It is not the
  Autism-Spectrum Quotient: in the ASP extraction the
  variable aq12 is item 12 of that scale, another instrument, and the two
  are not joined.

  In the extraction from 2021, filled at the inclusion visit; it took the
  place of the BDHI. The dictionary lists it among the questionnaires
  reduced in 2021, but the extraction holds no longer form. Twelve items,
  each 1 (not at all like me) to 6 (completely like me).

  Four sub-scores of three items each (3 to 18): physical aggression (items
  1, 5, 9), verbal aggression (2, 6, 10), anger (3, 7, 11) and hostility
  (4, 8, 12). The stored sub-scores equal these sums on all but one visit of
  1,336 (physical +2, verbal +1). The extraction stores no total; the sum of
  the twelve items is added here (12 to 72).

defaults: {type: item, range: [1, 6]}

variables:
  aq1201: {label: "Short aggression questionnaire item 1"}
  aq1202: {label: "Short aggression questionnaire item 2"}
  aq1203: {label: "Short aggression questionnaire item 3"}
  aq1204: {label: "Short aggression questionnaire item 4"}
  aq1205: {label: "Short aggression questionnaire item 5"}
  aq1206: {label: "Short aggression questionnaire item 6"}
  aq1207: {label: "Short aggression questionnaire item 7"}
  aq1208: {label: "Short aggression questionnaire item 8"}
  aq1209: {label: "Short aggression questionnaire item 9"}
  aq1210: {label: "Short aggression questionnaire item 10"}
  aq1211: {label: "Short aggression questionnaire item 11"}
  aq1212: {label: "Short aggression questionnaire item 12"}
  aq12_physical_stored: {column: aq1213, label: Physical aggression as stored, range: [3, 18], keep: false}
  aq12_verbal_stored: {column: aq1214, label: Verbal aggression as stored, range: [3, 18], keep: false}
  aq12_anger_stored: {column: aq1215, label: Anger as stored, range: [3, 18], keep: false}
  aq12_hostility_stored: {column: aq1216, label: Hostility as stored, range: [3, 18], keep: false}

scores:
