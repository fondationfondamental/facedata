instrument: wurs61
title: Wender Utah Rating Scale, 61 items (WURS-61)
tab: AUTO-QUESTIONNAIRES
section: Questionnaire WURS (version réduite 25 items)
status: reviewed
notes: >
  WURS-61 and WURS-25 are two instruments. The 61-item WURS was filled until
  2021; the 25-item WURS-25 replaced it (confirmed by the developers of the
  EMR, decision D47 in PROGRESS.md). The 25 questions of the WURS-25 are 25
  of the 61, and the extraction stores both in the same columns. The columns
  are therefore split by form: this schema reads the visits where the
  61-item questionnaire was filled, wurs25.yaml reads the others. Both files
  carry the same version block.

  Which form a visit used. Nothing in the WURS columns says it: the 25 items
  and their sum are stored alike in both forms. The form is read from the
  other self-questionnaires of the same visit, because the reduced
  questionnaires replaced the long ones together (99% of the visits that
  have an ALS and a BIS have the two in the same generation). A visit is
  "wurs61" when it holds something that only the long questionnaires have: a
  score of the 54-item ALS (als58 or als60) or one of the 22 items that only
  the 34-item BIS-10 has. It is "wurs25" when it holds ALS or BIS answers
  and none of those. This rests on the WURS having changed at the same
  moment as the ALS and the BIS in each centre, which the WURS columns
  cannot confirm. A visit with a WURS and neither an ALS nor a BIS (49
  visits) has no form: version_unknown, and its answers are not delivered.
  A visit dated before 2021 is never read as the 25-item form (since, in
  the version block): wurs25.yaml says why.

  Filled once, at the inclusion visit: symptoms of attention deficit and
  hyperactivity in childhood. Each item is 0 (not at all) to 4 (very much).

  What the extraction holds. Only the 25 items that the WURS-25 also has,
  out of 61; the 36 others were not exported. wurs61_03 is item 3 of the
  61-item questionnaire. The data managers confirmed in November 2026
  (decision D67 in PROGRESS.md) that the patients filled the 61 items until
  2021 (2022 in two centres), that the 36 other items are still in the
  source database, and that no field records the form of a visit: the rule
  above stays an assumption until the export names the form.

  Bridge to the WURS-25: wurs61_sum25 is the sum of these 25 items (0 to
  100), the score that the WURS has always used. The stored total (wurs)
  equals it in every row where both exist. Whether an answer given inside a
  61-item questionnaire can be compared with the same question asked in a
  25-item one is a scientific choice; the two are delivered as separate
  columns (wurs61_sum25 here, wurs25_total there) so that nobody mixes them
  by accident. From July 2021 to June 2022, when both forms were in use, the
  two sums have the same mean (35.5 and 35.5).

