  name: wurs_form
  filled:
    wurs61: [als58, als60,
             bis1002, bis1003, bis1004, bis1005, bis1007, bis1010, bis1011,
             bis1013, bis1015, bis1016, bis1018, bis1019, bis1022, bis1024,
             bis1026, bis1027, bis1029, bis1030, bis1031, bis1032, bis1033,
             bis1034]
    wurs25: [als05, als08, als12, als14, als16, als17, als20, als21, als23,
             als25, als33, als34, als36, als41, als42, als43, als45, als46,
             bis1001, bis1006, bis1008, bis1009, bis1012, bis1014, bis1017,
             bis1020, bis1021, bis1023, bis1025, bis1028]
  since: {wurs25: 2021-01-01}

