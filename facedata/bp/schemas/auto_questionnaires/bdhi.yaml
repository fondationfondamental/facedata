instrument: bdhi
title: Buss-Durkee Hostility Inventory (BDHI, 75 items)
tab: AUTO-QUESTIONNAIRES
section: Questionnaire BDHI
status: reviewed
notes: >
  Filled once, at the inclusion visit, until 2022; the short aggression
  questionnaire (aq12.yaml) took its place. Seventy-five true/false
  statements.

  Coding. The extraction stores the items already keyed to hostility: 1 is
  the hostile answer, whether that answer is "true" or "false" (the
  dictionary lists the fifteen statements for which it is "false"; the
  script of the form keys them the same way). The items are delivered as
  asked, 1 true and 0 false: the fifteen statements for which false is the
  hostile answer (items 1, 10, 17, 21, 27, 34, 39, 50, 55, 63, 66, 67, 71,
  72 and 74) are read back with a code table, and the sub-scores reverse
  them (1 minus the value). A sub-score is the same number as the stored
  one.

  Eight sub-scores: assault (10 items), indirect hostility (9), irritability
  (11), negativism (5), resentment (8), suspicion (10), verbal hostility
  (13) and guilt (9). Two components: attitudinal (resentment and suspicion)
  and motor (assault, indirect hostility, irritability and verbal
  hostility). The item lists were read from the data: each stored sub-score
  and the attitudinal component equal ours in every row where both exist
  (4,506 to 4,527 rows; 4,474 for the component); the motor component
  differs on 1 of 4,452 rows.

  The extraction stores no total. The usual one is added here: the seven
  hostility sub-scores, guilt left out (66 items).

defaults: {type: item, range: [0, 1]}

