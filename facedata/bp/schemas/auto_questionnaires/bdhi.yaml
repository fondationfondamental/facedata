    label: BDHI assault (10 items)
    sum: [bdhi01, bdhi09, bdhi17, bdhi25, bdhi33, bdhi41, bdhi49, bdhi57,
          bdhi65, bdhi70]
    compare: bdhi_assault_stored
  bdhi_indirect:
    label: BDHI indirect hostility (9 items)
    sum: [bdhi02, bdhi10, bdhi18, bdhi26, bdhi34, bdhi42, bdhi50, bdhi58,
          bdhi75]
    compare: bdhi_indirect_stored
  bdhi_irritability:
    label: BDHI irritability (11 items)
    sum: [bdhi04, bdhi11, bdhi20, bdhi27, bdhi35, bdhi44, bdhi52, bdhi60,
          bdhi66, bdhi71, bdhi73]
    compare: bdhi_irritability_stored
  bdhi_negativism:
    label: BDHI negativism (5 items)
    sum: [bdhi03, bdhi12, bdhi19, bdhi28, bdhi36]
    compare: bdhi_negativism_stored
  bdhi_resentment:
    label: BDHI resentment (8 items)
    sum: [bdhi05, bdhi13, bdhi21, bdhi29, bdhi37, bdhi45, bdhi53, bdhi61]
    compare: bdhi_resentment_stored
  bdhi_suspicion:
    label: BDHI suspicion (10 items)
    sum: [bdhi06, bdhi14, bdhi22, bdhi30, bdhi38, bdhi46, bdhi54, bdhi62,
          bdhi67, bdhi72]
    compare: bdhi_suspicion_stored
  bdhi_verbal:
    label: BDHI verbal hostility (13 items)
    sum: [bdhi07, bdhi15, bdhi23, bdhi31, bdhi39, bdhi43, bdhi47, bdhi51,
          bdhi55, bdhi59, bdhi63, bdhi68, bdhi74]
    compare: bdhi_verbal_stored
  bdhi_guilt:
    label: BDHI guilt (9 items)
    sum: [bdhi08, bdhi16, bdhi24, bdhi32, bdhi40, bdhi48, bdhi56, bdhi64,
          bdhi69]
    compare: bdhi_guilt_stored
  bdhi_attitudinal:
    label: BDHI attitudinal component (resentment and suspicion)
    sum: [bdhi_resentment, bdhi_suspicion]
    compare: bdhi_attitudinal_stored
  bdhi_motor:
    label: BDHI motor component (assault, indirect, irritability, verbal)
    sum: [bdhi_assault, bdhi_indirect, bdhi_irritability, bdhi_verbal]
    compare: bdhi_motor_stored
  bdhi_total:
    label: BDHI total hostility (66 items, guilt left out)
    sum: [bdhi_motor, bdhi_attitudinal, bdhi_negativism]
