instrument: circadian
title: Circadian Type Inventory (CTI, French ITC, 11 items)
tab: AUTO-QUESTIONNAIRES
section: Questionnaire INVENTAIRE DU RYTHME CIRCADIEN
status: reviewed
notes: >
  Habits around sleep. Filled at the inclusion visit and, for part of the
  patients, at the yearly visits. Eleven items, each 1 (almost never) to 5
  (almost always).

  The instrument is the Circadian Type Inventory in its French version, the
  "Inventaire du type circadien" (ITC; the application's table is
  autoq_type_circadien). It has eleven items and two scales, flexibility or
  rigidity of the sleep habits (5 items) and languid or vigorous (6 items,
  the capacity to overcome drowsiness). The original authors are Folkard and
  colleagues (1979); the literature check of 2026-11-21 found no source on
  this instrument, so the exact citation and the French validation are still
  unknown. The form asks for what the patient prefers or is able to do, not
  what work obliges them to do, and to answer quickly; there is no time frame.
  The item labels below are short paraphrases of the French wording, with the
  scale of each item.

  Two scores: flexibility of the sleep habits (items 2, 4, 6, 8, 10; 5 to
  25) and languidness, the difficulty to overcome drowsiness (items 1, 3, 5,
  7, 9, 11; 6 to 30). The item lists were read from the data: the stored flexibility equals ours on all but 3 of 8,311 rows and the stored
  languidness on all but 3 of 8,308; a higher answer is more flexible
  (flexibility) or more languid (languidness) on every item, so nothing is
  reversed.

defaults: {type: item, range: [1, 5]}

variables:
  circad01: {label: "Circadian item 1 (languidness): needs more sleep than other people"}
  circad02: {label: "Circadian item 2 (flexibility): could do a job in the middle of the night almost as easily as at a normal hour"}
  circad03: {label: "Circadian item 3 (languidness): finds it hard to wake up properly when woken at an unusual hour"}
  circad04: {label: "Circadian item 4 (flexibility): likes working at unusual hours of the day or night"}
  circad05: {label: "Circadian item 5 (languidness): after a very late bedtime, needs to sleep later the next morning"}
  circad06: {label: "Circadian item 6 (flexibility): can work late in the evening to finish a task without being too tired"}
  circad07: {label: "Circadian item 7 (languidness): feels sleepy for some time after waking in the morning"}
  circad08: {label: "Circadian item 8 (flexibility): finds it as easy to work late at night as early in the morning"}
  circad09: {label: "Circadian item 9 (languidness): after a very early rising, tends to feel tired all day"}
  circad10: {label: "Circadian item 10 (flexibility): would be as happy to do something in the middle of the night as by day"}
  circad11: {label: "Circadian item 11 (languidness): has to count on an alarm clock or someone else to wake up in the morning"}
  circadian_flexibility_stored: {column: circad12, label: Flexibility as stored, range: [5, 25], keep: false}
  circadian_languidness_stored: {column: circad13, label: Languidness as stored, range: [6, 30], keep: false}

scores:
  circadian_flexibility:
    label: Flexibility of sleep habits (5 items)
    sum: [circad02, circad04, circad06, circad08, circad10]
    compare: circadian_flexibility_stored
  circadian_languidness:
    label: Languidness (6 items)
    sum: [circad01, circad03, circad05, circad07, circad09, circad11]
    compare: circadian_languidness_stored
