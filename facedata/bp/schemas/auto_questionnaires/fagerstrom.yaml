instrument: fagerstrom
title: Fagerström Test for Nicotine Dependence (6 items)
tab: AUTO-QUESTIONNAIRES
section: FAGERSTROM  (SUBSTANCES)
status: draft
notes: >
  Six questions for smokers. Filled at every visit by the patients who
  smoke. Items 1 and 4 are 0 to 3, the others 0 or 1; the total is their sum
  (0 to 10).

  Item 3 ("which cigarette would you hate most to give up?") has two
  answers: the first of the day (1 point) or any other (0).

  History. Until the extraction of November 2026 the answer "any other" was
  lost in the export (its text holds an apostrophe): item 3 was 1 or empty,
  and the stored total was missing for every patient who had given that
  answer. An empty item 3 was then read here as "any other" (decision D33
  in PROGRESS.md). The data managers corrected the export (D64): item 3 is
  now 0 on 2,119 visits, and nothing is assumed any more.

  Total. The stored total (fagers) exists where the six items are filled
  and equals their sum in every row. It is recomputed here with the same
  rule: the six items are needed.

defaults: {type: item, range: [0, 1]}

variables:
  fagers01: {label: "Combien de temps après votre réveil fumez-vous votre première cigarette", range: [0, 3]}
  fagers02: {label: "Trouvez-vous difficile de vous abstenir de fumer dans les endroits où..."}
  fagers03: {label: "A quelle cigarette de la journée vous serait-il le plus difficile de..."}
  fagers04: {label: "Combien de cigarettes fumez-vous par jour", range: [0, 3]}
  fagers05: {label: "Fumez-vous à un rythme plus soutenu le matin que l'après-midi"}
  fagers06: {label: "Fumez-vous lorsque vous êtes si malade que vous devez rester au lit..."}
  fagers_stored: {column: fagers, label: Fagerström total as stored, range: [0, 10], keep: false}

scores:
  fagerstrom_total:
    label: Fagerström total (0 to 10)
    sum: [fagers01, fagers02, fagers03, fagers04, fagers05, fagers06]
    compare: fagers_stored
