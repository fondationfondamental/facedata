instrument: altman
title: Altman Self-Rating Mania Scale (ASRM, 5 items), last week
tab: AUTO-QUESTIONNAIRES
section: Questionnaire ALTMAN
status: reviewed
notes: >
  Five items, each 0 to 4, on the last week. Filled at 95% of the inclusion visits, 89 to 92% of the follow-up visits and
  68% of the screening visits.

  The stored total (altman_) is written again from the five items by the
  score step of the export (D120, strict sum) and equals their sum in every
  row where both exist (19,553, every row that has the five items); no
  score_mismatch is raised. It checks the items and the export's formula.
  DR has the same five items, names and range (altman_total).

defaults: {type: item, range: [0, 4]}

variables:
  altman01: {label: Cheerfulness}
  altman02: {label: Self-confidence}
  altman03: {label: Reduced need for sleep}
  altman04: {label: Talkativeness}
  altman05: {label: Activity}
  altman_stored: {column: altman_, label: ASRM total as stored, range: [0, 20], keep: false}

scores:
  altman_total:
    label: ASRM total
    sum: [altman01, altman02, altman03, altman04, altman05]
    compare: altman_stored
