instrument: aim20
title: Affect Intensity Measure, 20 items (AIM-20)
tab: AUTO-QUESTIONNAIRES
section: Questionnaire AIM (version réduite 20 items)
status: draft
notes: >
  AIM-40 and AIM-20 are two instruments. The 20-item AIM-20 replaced the
  40-item AIM in 2021 and 2022, depending on the centre (answer of the data
  managers in November 2026, decision D66 in PROGRESS.md). Its 20 questions
  are 20 of the 40, and the extraction stores both in the same columns.
  This schema reads those columns on the visits where the 20-item
  questionnaire was filled. Nothing in the AIM columns says which form a
  visit used; it is read from the ALS and the BIS of the same visit:
  "aim20" when the visit holds ALS or BIS answers and nothing that only the
  long questionnaires have. aim40.yaml reads the other visits and explains
  the rule and its limit. Both files carry the same version block.

  Filled once, at the inclusion visit. Each item is 1 (never) to 6 (always).

  Item names. The EMR kept the numbers that the questions have in the
  40-item questionnaire: aim20_02 is the question numbered 2 there. The
  order of the questions on the 20-item form is not known.

  Score. The mean of the 20 items (1 to 6), six of them reversed (7 -
  value): 12, 24, 29, 33, 37 and 40. The stored score (aim_) is exactly this
  mean in every row where both exist.

  Before 2021. The data managers found no visit with only the reduced
  questionnaires before 2021, and advise not to deliver the questionnaires
  of a visit that looks like one (decision D71 in PROGRESS.md). The version
  block says so (since): a visit dated before 2021 that would be read here
  has no form, gets version_unknown, and its answers are not delivered. 8
  visits, dated 2017 to 2020, each with its 20 answers; als18.yaml says
  what they look like.

