instrument: stai_ya
title: State-Trait Anxiety Inventory, form Y-A (state anxiety, 20 items)
tab: AUTO-QUESTIONNAIRES
section: Questionnaire STAI Y_A
status: reviewed
notes: >
  Twenty items on how the patient feels right now. Filled at every visit.

  The items are stored 1 to 4 (1 = no, 4 = yes). The dictionary says 0 to 3;
  no cell holds a 0.

  Ten items describe calm (1, 2, 5, 8, 10, 11, 15, 16, 19 and 20) and are
  reversed in the total (5 - value), so that a higher total is more anxiety.
  The total goes from 20 to 80. The stored total (staya) is exactly this sum
  in every row where both exist (16,678).

defaults: {type: item, range: [1, 4]}

variables:
  staya01: {label: "STAI-YA item 1"}
  staya02: {label: "STAI-YA item 2"}
  staya03: {label: "STAI-YA item 3"}
  staya04: {label: "STAI-YA item 4"}
  staya05: {label: "STAI-YA item 5"}
  staya06: {label: "STAI-YA item 6"}
  staya07: {label: "STAI-YA item 7"}
  staya08: {label: "STAI-YA item 8"}
  staya09: {label: "STAI-YA item 9"}
  staya10: {label: "STAI-YA item 10"}
  staya11: {label: "STAI-YA item 11"}
  staya12: {label: "STAI-YA item 12"}
  staya13: {label: "STAI-YA item 13"}
  staya14: {label: "STAI-YA item 14"}
  staya15: {label: "STAI-YA item 15"}
  staya16: {label: "STAI-YA item 16"}
  staya17: {label: "STAI-YA item 17"}
  staya18: {label: "STAI-YA item 18"}
  staya19: {label: "STAI-YA item 19"}
  staya20: {label: "STAI-YA item 20"}
  staya_stored: {column: staya, label: STAI-YA total as stored, range: [20, 80], keep: false}

scores:
  staya_total:
    label: STAI-YA state anxiety total
    sum: [staya01, staya02, staya03, staya04, staya05, staya06, staya07,
          staya08, staya09, staya10, staya11, staya12, staya13, staya14,
          staya15, staya16, staya17, staya18, staya19, staya20]
    reverse: [staya01, staya02, staya05, staya08, staya10, staya11, staya15,
              staya16, staya19, staya20]
    compare: staya_stored
