instrument: mars
title: Medication Adherence Rating Scale (MARS, 10 items)
tab: AUTO-QUESTIONNAIRES
section: Questionnaire MARS
status: draft
notes: >
  Ten yes/no questions on taking the treatment. Filled at every visit.

  Coding. The dictionary says 1 = yes and 0 = no. The data say the opposite
  for the ten items: 96% of the answers to item 5 ("I take my medication only
  when I am sick") are 1, and 91% of the answers to item 8 ("By staying on
  medication I can prevent getting sick") are 0. The items are therefore read
  as 1 = no and 0 = yes, which the project lead confirmed (decision D37 in
  PROGRESS.md). They are delivered as the numbers stored.

  Total. One point for "no" to items 1 to 6, 9 and 10, and one point for
  "yes" to items 7 and 8: with the coding above, the sum of the ten items
  with items 7 and 8 reversed. A higher total is a better adherence (0 to
  10). The stored total (mars_) is exactly this in every row where both
  exist (15,987).

  mars11 was added in 2021: "do you take a medication at present?". Here 1 is
  yes, as the dictionary says (95% of the answers).

defaults: {type: item, range: [0, 1]}

variables:
  mars01: {label: "MARS item 1 (1 = no, 0 = yes)"}
  mars02: {label: "MARS item 2 (1 = no, 0 = yes)"}
  mars03: {label: "MARS item 3 (1 = no, 0 = yes)"}
  mars04: {label: "MARS item 4 (1 = no, 0 = yes)"}
  mars05: {label: "MARS item 5 (1 = no, 0 = yes)"}
  mars06: {label: "MARS item 6 (1 = no, 0 = yes)"}
  mars07: {label: "MARS item 7 (1 = no, 0 = yes)"}
  mars08: {label: "MARS item 8 (1 = no, 0 = yes)"}
  mars09: {label: "MARS item 9 (1 = no, 0 = yes)"}
  mars10: {label: "MARS item 10 (1 = no, 0 = yes)"}
  mars11: {label: "Takes a medication at present (1 = yes, 0 = no)"}
  mars_stored: {column: mars_, label: MARS total as stored, range: [0, 10], keep: false}

scores:
  mars_total:
    label: MARS adherence total (higher is better)
    sum: [mars01, mars02, mars03, mars04, mars05, mars06, mars07, mars08,
          mars09, mars10]
    reverse: [mars07, mars08]
    compare: mars_stored
