instrument: asrs
title: Adult ADHD Self-Report Scale (ASRS v1.1, 18 items), last 6 months
tab: AUTO-QUESTIONNAIRES
section: Questionnaire ASRS
status: reviewed
notes: >
  Two visits date from 2018 and 2020, 28 from 2021, the rest from 2022; filled
  at the inclusion visit (1,265 of 1,325 visits). Eighteen items, each 0
  (never) to 4 (very often), about the last 6 months (the instruction of
  the form).

  The screening result is computed here from part A, the first six items: an
  item counts when it is 2 or more (items 1 to 3) or 3 or more (items 4 to
  6), and the result is positive (1) from four items on, negative (0) below.
  It exists on every visit that has the six items (1,320). The stored result
  (asrs_) is the check and is not delivered, because the script of the
  application tests the wrong variable for an unanswered item (it tests the
  field and not the count, autoq_asrs.js, lines 20 to 60): an incomplete
  part A gives "negative", and the result stays empty when the score button
  is never clicked. Against the stored result, the rule gives 92 results
  where it was empty (the six items answered, the button not clicked), 2
  positive results where it was negative (count of 4 or 5), and no result on
  6 visits where it was negative with an incomplete part A (score_not_recomputed): 100 cells
  in all. Elsewhere the two agree on all of 1,226 visits. The name asrs_screen
  now holds 1 or 0, not a category. The same part A is in the ASP schema.

  The extraction stores no total. The sum of the eighteen items is added
  here (0 to 72).

defaults: {type: item, range: [0, 4]}

variables:
  asrs01: {label: "ASRS item 1"}
  asrs02: {label: "ASRS item 2"}
  asrs03: {label: "ASRS item 3"}
  asrs04: {label: "ASRS item 4"}
  asrs05: {label: "ASRS item 5"}
  asrs06: {label: "ASRS item 6"}
  asrs07: {label: "ASRS item 7"}
  asrs08: {label: "ASRS item 8"}
  asrs09: {label: "ASRS item 9"}
  asrs10: {label: "ASRS item 10"}
  asrs11: {label: "ASRS item 11"}
  asrs12: {label: "ASRS item 12"}
  asrs13: {label: "ASRS item 13"}
  asrs14: {label: "ASRS item 14"}
  asrs15: {label: "ASRS item 15"}
  asrs16: {label: "ASRS item 16"}
  asrs17: {label: "ASRS item 17"}
  asrs18: {label: "ASRS item 18"}
  asrs_screen_stored:
    column: asrs_
    type: item
    label: ASRS screening result as stored (1 positive, 0 negative)
    range: [0, 1]
    codes: {Positif: 1, Négatif: 0, "N?gatif": 0}
    keep: false

scores:
  asrs_total:
    label: ASRS total (18 items)
    sum: [asrs01, asrs02, asrs03, asrs04, asrs05, asrs06, asrs07, asrs08,
          asrs09, asrs10, asrs11, asrs12, asrs13, asrs14, asrs15, asrs16,
          asrs17, asrs18]

  asrs_a123:
    label: ASRS part A, items 1 to 3 at "sometimes" or more (0 to 3)
    sum: [asrs01, asrs02, asrs03]
    points: {"0": 0, "1": 0, "2": 1, "3": 1, "4": 1}
    keep: false
  asrs_a456:
    label: ASRS part A, items 4 to 6 at "often" or more (0 to 3)
    sum: [asrs04, asrs05, asrs06]
    points: {"0": 0, "1": 0, "2": 0, "3": 1, "4": 1}
    keep: false
  asrs_parta:
    label: ASRS part A, number of items past their threshold (0 to 6; 4 or more is a positive screen)
    sum: [asrs_a123, asrs_a456]
  asrs_screen:
    label: ASRS screen, part A (1 = positive, 4 or more items past their threshold)
    sum: [asrs_parta]
    points: {"0": 0, "1": 0, "2": 0, "3": 0, "4": 1, "5": 1, "6": 1}
    compare: asrs_screen_stored
