instrument: ctq
title: Childhood Trauma Questionnaire, short form (CTQ, 28 items)
tab: AUTO-QUESTIONNAIRES
section: Questionnaire CTQ
status: reviewed
notes: >
  Filled once, at the inclusion visit (93 patients have items on 2 or more visits (90 with a total)).
  Twenty-eight items, each 1 (never true) to 5 (very often true).

  Five sub-scores of five items each (5 to 25): emotional abuse (items 3, 8,
  14, 18, 25), physical abuse (9, 11, 12, 15, 17), sexual abuse (20, 21, 23,
  24, 27), emotional neglect (5, 7, 13, 19, 28) and physical neglect (1, 2,
  4, 6, 26). Seven items describe a good childhood and are reversed (6 -
  value): 2, 5, 7, 13, 19, 26 and 28. The total is the sum of the five
  sub-scores (25 to 125). The stored sub-scores and the stored total equal
  these sums in every row where both exist (6,190 for the total, 6,219 to 6,227 for the sub-scores).

  Severity classes. The EMR cuts each stored sub-score in four classes (1
  none, 2 low, 3 moderate, 4 severe). The limits found in the data are those
  of the manual: 8, 10 and 13 for physical abuse and physical neglect; 9, 13
  and 16 for emotional abuse; 6, 8 and 13 for sexual abuse; 10, 15 and 18
  for emotional neglect. The classes are delivered as stored. They follow
  these limits on the delivered sub-score in every row but four (one in each
  sub-score but sexual abuse, from 2010 to 2021), where the class was not
  updated with its sub-score; those four keep the stored class.

  Denial. Items 10, 16 and 22 do not enter the sub-scores. The denial score
  (ctq40) is the number of them answered 5, exactly, and is delivered as
  stored. ctq41 only says whether it is 1 or more and is not read
  (ignored.yaml).

defaults: {type: item, range: [1, 5]}

variables:
  ctq01: {label: "CTQ item 1"}
  ctq02: {label: "CTQ item 2"}
  ctq03: {label: "CTQ item 3"}
  ctq04: {label: "CTQ item 4"}
  ctq05: {label: "CTQ item 5"}
  ctq06: {label: "CTQ item 6"}
  ctq07: {label: "CTQ item 7"}
  ctq08: {label: "CTQ item 8"}
  ctq09: {label: "CTQ item 9"}
  ctq10: {label: "CTQ item 10"}
  ctq11: {label: "CTQ item 11"}
  ctq12: {label: "CTQ item 12"}
  ctq13: {label: "CTQ item 13"}
  ctq14: {label: "CTQ item 14"}
  ctq15: {label: "CTQ item 15"}
  ctq16: {label: "CTQ item 16"}
  ctq17: {label: "CTQ item 17"}
  ctq18: {label: "CTQ item 18"}
  ctq19: {label: "CTQ item 19"}
  ctq20: {label: "CTQ item 20"}
  ctq21: {label: "CTQ item 21"}
  ctq22: {label: "CTQ item 22"}
  ctq23: {label: "CTQ item 23"}
  ctq24: {label: "CTQ item 24"}
  ctq25: {label: "CTQ item 25"}
  ctq26: {label: "CTQ item 26"}
  ctq27: {label: "CTQ item 27"}
  ctq28: {label: "CTQ item 28"}

  # Sub-scores and total as stored. Used only to check our own scores.
  ctq_emotional_abuse_stored: {column: ctq37, label: Emotional abuse as stored, range: [5, 25], keep: false}
  ctq_physical_abuse_stored: {column: ctq29, label: Physical abuse as stored, range: [5, 25], keep: false}
  ctq_sexual_abuse_stored: {column: ctq35, label: Sexual abuse as stored, range: [5, 25], keep: false}
  ctq_emotional_neglect_stored: {column: ctq31, label: Emotional neglect as stored, range: [5, 25], keep: false}
  ctq_physical_neglect_stored: {column: ctq33, label: Physical neglect as stored, range: [5, 25], keep: false}
  ctq_total_stored: {column: ctq39, label: CTQ total as stored, range: [25, 125], keep: false}

  # Derived by the EMR from the stored sub-scores.
  ctq_emotional_abuse_class: {column: ctq38, label: "Emotional abuse, severity class (1 none to 4 severe)", range: [1, 4], derived_from: ctq_emotional_abuse}
  ctq_physical_abuse_class: {column: ctq30, label: "Physical abuse, severity class (1 none to 4 severe)", range: [1, 4], derived_from: ctq_physical_abuse}
  ctq_sexual_abuse_class: {column: ctq36, label: "Sexual abuse, severity class (1 none to 4 severe)", range: [1, 4], derived_from: ctq_sexual_abuse}
  ctq_emotional_neglect_class: {column: ctq32, label: "Emotional neglect, severity class (1 none to 4 severe)", range: [1, 4], derived_from: ctq_emotional_neglect}
  ctq_physical_neglect_class: {column: ctq34, label: "Physical neglect, severity class (1 none to 4 severe)", range: [1, 4], derived_from: ctq_physical_neglect}
  ctq_denial: {column: ctq40, label: "Denial score (items 10, 16, 22 answered 5)", range: [0, 3]}

scores:
  ctq_emotional_abuse: {label: CTQ emotional abuse, sum: [ctq03, ctq08, ctq14, ctq18, ctq25], compare: ctq_emotional_abuse_stored}
  ctq_physical_abuse: {label: CTQ physical abuse, sum: [ctq09, ctq11, ctq12, ctq15, ctq17], compare: ctq_physical_abuse_stored}
  ctq_sexual_abuse: {label: CTQ sexual abuse, sum: [ctq20, ctq21, ctq23, ctq24, ctq27], compare: ctq_sexual_abuse_stored}
  ctq_emotional_neglect: {label: CTQ emotional neglect, sum: [ctq05, ctq07, ctq13, ctq19, ctq28], reverse: [ctq05, ctq07, ctq13, ctq19, ctq28], compare: ctq_emotional_neglect_stored}
  ctq_physical_neglect: {label: CTQ physical neglect, sum: [ctq01, ctq02, ctq04, ctq06, ctq26], reverse: [ctq02, ctq26], compare: ctq_physical_neglect_stored}
  ctq_total:
    label: CTQ total (25 items)
    sum: [ctq01, ctq02, ctq03, ctq04, ctq05, ctq06, ctq07, ctq08, ctq09, ctq11,
          ctq12, ctq13, ctq14, ctq15, ctq17, ctq18, ctq19, ctq20, ctq21, ctq23,
          ctq24, ctq25, ctq26, ctq27, ctq28]
    reverse: [ctq02, ctq05, ctq07, ctq13, ctq19, ctq26, ctq28]
    compare: ctq_total_stored
