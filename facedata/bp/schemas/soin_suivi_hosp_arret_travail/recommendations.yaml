instrument: recommendations
title: Whether the recommendations of the first evaluation were followed (follow-up visits)
tab: SOIN SUIVI HOSP ARRET TRAVAIL
section: Suivi des Recommandations
status: reviewed
notes: >
  Whether the recommendations made at the first evaluation were followed,
  for the drug treatment and for the other treatments, and why not. A
  follow-up form, asked at every follow-up visit and never at inclusion or
  screening. The question names the first evaluation, not the time since
  the last visit. 9,499 of the 11,686 follow-up visits answer for the drug
  treatment (81%) and 9,322 for the other treatments (80%). Of these, the
  drug recommendations are fully followed on 62% and the others on 53%
  (SZ: 64% and 55%).

  The answer is a judgement made at each visit: 1,446 of the 2,608
  patients who answer at two visits or more give different answers for the
  drug treatment. Centre A stops filling this form from 2019 (80% of its
  follow-up visits in 2016-18, 57% in 2019-21, 20% in 2022-23, 33% from
  2024; O40); without centre A, 84% to 89% of the follow-up visits answer
  in every period. Centre G answers "partly" much more often than the
  others (59% for the drugs and 79% for the other treatments, against 25%
  and 27%).

  The reason is shown only after "partly" or "not followed" (the form
  makes the reason depend on those two answers of the list). It is empty
  on 4% to 5% of those visits (128 of 3,586 for the drugs, 211 of 4,348
  for the others), more often in recent years. 11 reasons stand under
  another answer: 9 after "fully followed" (5 for the drugs, 4 for the
  other treatments, all before 2014) and 2 drug reasons with no answer to
  the first question. They are delivered as recorded, with no shown_if
  (R2). "Other" is the most frequent reason (32% and 38%), and the form
  has no field to say which.

  The date typed on the form (date_traitement_semestriel) is not exported;
  the answers carry the visit date.

variables:
  drug_advice_followed: {column: trtmed_daorres, type: category, codes: {"Complètement suivi": fully, "Partiellement suivi": partly, "Non suivi": not_followed}, label: "Recommendations on the drug treatment: followed"}
  drug_advice_reason: {column: trtmed_reason, type: category, codes: {"Refus du patient": patient_refusal, "Désaccord du médecin pratiquant le suivi": physician_disagreement, "Problème de tolérance": tolerance, "Problème de rechute": relapse, "Autres": other}, label: "Drug recommendations not fully followed: why"}
  other_advice_followed: {column: trtnmed_daorres, type: category, codes: {"Complètement suivi": fully, "Partiellement suivi": partly, "Non suivi": not_followed}, label: "Recommendations on the other treatments: followed"}
  other_advice_reason: {column: trtnmed_reason, type: category, codes: {"Impossible à mettre en place": not_feasible, "Refus du patient": patient_refusal, "Désaccord avec le médecin pratiquant le suivi": physician_disagreement, "Autres": other}, label: "Other recommendations not fully followed: why"}
