defaults: {versions: [inclusion]}

variables:
  first_hospitalisation_age: {column: agedebut_hospitalisation, type: number, range: [0, 90], winsor: false, label: "Age at the first hospitalisation"}
  n_hospitalisations_v0: {column: nboccur_hospitalisation, type: number, range: [0, 50], winsor: false, label: "Number of hospitalisations over the life, at inclusion"}
  hospitalisation_months_v0: {column: hodur_hospitalisation, type: number, unit: months, range: [0, 20], winsor: false, codes: {"1/4": 0.25, "1/2": 0.5, "3/4": 0.75}, label: "Total duration of the hospitalisations over the life, at inclusion"}

  # The 12 months before the inclusion visit.
  n_hospitalisations_12m: {column: nboccur_hospitalisation_ly, type: number, range: [0, 50], winsor: false, label: "Number of hospitalisations in the 12 months before inclusion"}
  hospitalisation_weeks_12m: {column: hodur_hospitalisation_ly, type: number, unit: weeks, range: [0, 52], winsor: false, label: "Total duration of the hospitalisations in the 12 months before inclusion"}
