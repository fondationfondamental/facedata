instrument: hospitalisations_v0
title: Hospitalisations before inclusion (inclusion visit)
tab: SOIN SUIVI HOSP ARRET TRAVAIL
section: VIE ENTIERE / DEPUIS LA DERNIERE VISITE
status: reviewed
notes: >
  Hospitalisations up to the inclusion visit: the age at the first one,
  their number and total duration over the whole life, and their number
  and duration in the 12 months before the visit. The two inclusion
  diagnosis forms (DSM-IV, then DSM-5) ask them in their part on mood
  disorders and do not say for what cause. Filled at the inclusion visit
  only.

  Two periods in the same columns (decision D54 in PROGRESS.md). The number
  of hospitalisations and their total duration are asked at the inclusion
  visit, about the whole life, and at every follow-up visit, about the time
  since the last visit; the dictionary names the section "whole life / since
  the last visit". The patients have 2.5 hospitalisations on average at
  inclusion and 0.17 at a follow-up visit. The two are delivered as separate
  columns, ending in _v0 and _fu; visit_form says which form a visit used
  and is read from the visit label.

  Number. The form stops at 20: ">20" is read as 20 with a mark in the
  censoring column (this value or more; 25 visits). "Ne sais pas" is a
  missing code, here and in the age, the lifetime duration and the number
  for the year.

  Duration, in months. A choice in a list: 0, a quarter, half or three
  quarters of a month, 1 to 20 months, more than 20 (censored at 20; 32
  visits). A duration left empty where the number is 0 is 0 (asked_if on
  the number, D123): 569 visits.

  Age at the first hospitalisation. The form asks it before the number,
  and its list starts with "<5" and has no answer for a patient never
  hospitalised. "<5" is therefore read as unknown, a missing code (D123):
  16 of the 21 patients who chose it have a number of 0 and 3 have none.
  Of the 1,278 patients with a number of 0, the age is empty for 1,076,
  "Ne sais pas" for 176 and a number for 10. 30 patients with a number of
  1 or more give no age, and 24 more answer "Ne sais pas".

  The 12 months before inclusion. The number and the total duration in
  weeks. The DSM-IV form (inclusions up to 2022) shows them only after a
  yes to "at least one mood episode in the past year"; the DSM-5 form
  (from 2020) asks every patient. After a "no" to that question both are 0
  (asked_if, D123; the question is read from rad_tb_hum_epthyman and
  delivered in the DSM schemas): 852 numbers of DSM-IV inclusions and 29
  of DSM-5 inclusions were empty there. A few of these zeros may be wrong:
  on the DSM-5 form, 7 of the 158 patients with no episode who answered
  were hospitalised in the year. The weeks are 0 where the number for the
  year is 0 (1,989 visits: 1,119 after a typed 0, 870 after a 0 given by
  the mood question). 31% of the DSM-IV numbers and 28% of the DSM-5
  numbers are above 0. A duration above 52 weeks is out of range (3 cells,
  all on the DSM-IV form; the DSM-5 form stops at 52).

  The dictionary also lists a yes/no question, hospitalised in the past
  12 months (hooccur_hospitalisation_ly). No form has this field and no
  export model writes it; the dictionary row is to be deleted (R95).

  Centre C holds no answer from 2022: its DSM-5 table is missing from the
  export (R20). Centre A fills the number on 19% of its inclusions in
  2022-23 and on none from 2024 (O40). Where a hospitalisation is counted,
  centre H leaves the lifetime duration empty on 33 of its 68 inclusions
  from 2022, and centre C on 102 of 449 up to 2021 (6% to 10% in the other
  centres).

  Delivered as written, with no flag: 5 ages at the first hospitalisation
  are 2 to 16 years above the age at inclusion (2015 to 2020), and 26 more
  are 1 year above, which fits an age counted by calendar year. 20 patients
  give more hospitalisations in the year than over their whole life (9 of
  them none over the life). 18 durations for the year exceed the lifetime
  duration by more than 2 weeks (5 of them with a lifetime duration of 0).
  21 durations for the year are above 0 with a number for the year of 0,
  and 5 lifetime durations are above 0 with a lifetime number of 0.

  No winsorising (decision D54 in PROGRESS.md). The numbers and durations
  count events, and their rare high values are real. A quarter of the
  lifetime numbers are 0, and 70% of the numbers for the year. The default
  99th percentile would bring 37 lifetime numbers of 16 to 20 down to 15,
  34 numbers of 4 to 8 in the year down to 3, and 50 durations of 23 to 52
  weeks in the year down to 22; for the lifetime duration it is 20, the top
  of the list, and would change nothing. The age at the first
  hospitalisation is not winsorised either, like the other ages at onset:
  the default would raise 17 ages of 9 to 12 to 13 and lower 37 ages of 61
  to 77 to 60.

version:
  name: visit_form
  column: visit
  codes:
    V0: inclusion
    V1_an: follow_up
    V2_ans: follow_up
    V3_ans: follow_up
    V4_ans: follow_up
    V5_ans: follow_up
    V6_ans: follow_up
    V7_ans: follow_up
    V8_ans: follow_up
    V9_ans: follow_up
    V10_ans: follow_up
    V6_mois: follow_up
    V18_mois: follow_up
    V30_mois: follow_up
