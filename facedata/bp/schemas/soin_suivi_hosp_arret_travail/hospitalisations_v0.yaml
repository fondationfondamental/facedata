    V7_ans: follow_up
    V8_ans: follow_up
    V9_ans: follow_up
    V10_ans: follow_up
    V6_mois: follow_up
    V18_mois: follow_up
    V30_mois: follow_up
    V42_mois: follow_up
    V54_mois: follow_up
    V66_mois: follow_up
