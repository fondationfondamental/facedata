instrument: hospitalisations_fu
title: Hospitalisations since the last visit (follow-up visits)
tab: SOIN SUIVI HOSP ARRET TRAVAIL
section: VIE ENTIERE / DEPUIS LA DERNIERE VISITE
status: reviewed
notes: >
  Hospitalisations since the last visit: their number and total duration.
  Asked at every follow-up visit, six-monthly and yearly, in the part of
  the follow-up diagnosis form on mood disorders since the last visit
  ("Troubles de l'humeur depuis la dernière visite"); the form does not say
  for what cause. 87% of the numbers are 0.

  Two periods in the same columns (decision D54 in PROGRESS.md). The number
  of hospitalisations and their total duration are asked at the inclusion
  visit, about the whole life, and at every follow-up visit, about the time
  since the last visit; the dictionary names the section "whole life / since
  the last visit". The patients have 2.5 hospitalisations on average at
  inclusion and 0.17 at a follow-up visit. The two are delivered as separate
  columns, ending in _v0 and _fu; visit_form says which form a visit used
  and is read from the visit label.

  Number. The form stops at 20: ">20" is read as 20 with a mark in the
  censoring column (this value or more; 1 visit). The range is 0 to 20,
  like the form (it was 0 to 50: the largest raw number is 13, so no cell
  changes). "Ne sais pas" is a missing code for the number (29 cells) and
  the duration (60, 29 of them after a number of 0).

  Duration, in months. A choice in a list: 0, a quarter, half or three
  quarters of a month, 1 to 20 months, more than 20 (censored at 20). A
  duration left empty where the number is 0 is 0 (asked_if on the number,
  D123): 978 visits. This happens more often in recent years (6% of the
  numbers of 0 until 2012, 18% from 2024) and in centres E and I (27% and
  25%).

  The time covered. The form words the question "depuis la dernière
  visite" and, unlike the history forms, has no question on a change
  (rad_pas_dechangement is not in the follow-up diagnosis form): the
  answer is about the time since the previous visit, and that time is not
  one window. Over the 11,686 follow-up visits the median gap is 321 days
  (192 at the six-monthly visits, 363 at the yearly ones) and one visit in
  ten comes more than 16 months after the previous one. The numbers rise
  with it: 0.13 hospitalisations on average after 4 to 8 months, 0.44
  after more than 30. Compare visits through the time since the previous
  visit (from visit_date).

  Filled at 72% of the follow-up visits: 84% until 2012 and 57% from 2024.
  The form is missing more often from 2022 (centre A, DM-6 in
  QUESTIONS.md), and where it is filled the number is skipped more often
  (filled on 94% of those visits until 2012, 81% from 2024). The share of
  visits with a hospitalisation stays between 11% and 14% in every period.

  Delivered as written: 20 visits give a number of 0 and a duration above
  0, 36 give a number of 1 or more and a duration of 0 (a stay of less than
  a week fits 0 on this list), and 11 durations are longer than the time
  since the previous visit.

  No winsorising (decision D54 in PROGRESS.md): most answers are 0 (87% of
  the numbers, 88% of the durations), so the 99th percentile would bring
  the rare high values down to it.

  DR has a twin, hospitalisations_since_visit, which counts the stays for
  depression and for another reason (not said to be psychiatric) apart,
  and its durations may reach 60 months; it is not in
  common_instruments.yaml. SZ
  asks the past 12 months at every visit instead (hospitalisations_12m).

