instrument: hospitalisations_fu
title: Hospitalisations since the last visit (follow-up visits)
tab: SOIN SUIVI HOSP ARRET TRAVAIL
section: VIE ENTIERE / DEPUIS LA DERNIERE VISITE
status: draft
notes: >
  Psychiatric hospitalisations since the last visit: their number and total
  duration. Asked at every follow-up visit, six-monthly and yearly; 86% of
  the answers are 0.

  Two periods in the same columns (decision D54 in PROGRESS.md). The number
  of hospitalisations and their total duration are asked at the inclusion
  visit, about the whole life, and at every follow-up visit, about the time
  since the last visit; the dictionary names the section "whole life / since
  the last visit". The patients have 2.5 hospitalisations on average at
  inclusion and 0.17 at a follow-up visit. The two are delivered as separate
  columns, ending in _v0 and _fu; visit_form says which form a visit used
  and is read from the visit label.

  Number. The form stops at 20: ">20" is read as 20 with a mark in the
  censoring column (this value or more). "Ne sais pas" is a missing code.

  Duration, in months. A choice in a list: 0, a quarter, half or three
  quarters of a month, 1 to 20 months, more than 20 (censored at 20).

  No winsorising (decision D54 in PROGRESS.md): most answers are 0, so the
  99th percentile would bring the rare high values down to it, or to 0.

version:
  name: visit_form
  column: visit
  codes:
    V0: inclusion
    V1_an: follow_up
    V2_ans: follow_up
    V3_ans: follow_up
    V4_ans: follow_up
    V5_ans: follow_up
    V6_ans: follow_up
    V7_ans: follow_up
    V8_ans: follow_up
    V9_ans: follow_up
    V10_ans: follow_up
    V6_mois: follow_up
    V18_mois: follow_up
    V30_mois: follow_up
    V42_mois: follow_up
    V54_mois: follow_up
    V66_mois: follow_up
    V78_mois: follow_up
    V90_mois: follow_up
    V102_mois: follow_up
    V114_mois: follow_up
    V126_mois: follow_up

defaults: {versions: [follow_up]}

variables:
  n_hospitalisations_fu: {column: nboccur_hospitalisation, type: number, range: [0, 50], winsor: false, label: "Number of hospitalisations since the last visit"}
  hospitalisation_months_fu: {column: hodur_hospitalisation, type: number, unit: months, range: [0, 20], winsor: false, codes: {"1/4": 0.25, "1/2": 0.5, "3/4": 0.75}, label: "Total duration of the hospitalisations since the last visit"}
