  somatoform_type_fu: {column: cedecodtroubsomato, type: category, codes: {"Trouble de somatisation": somatisation, "Trouble douloureux": pain, "Trouble somatoforme indifférencié": undifferentiated, "Hypocondrie": hypochondriasis, "Peur d'une dysmorphie corporelle": body_dysmorphic}, label: "Somatoform disorder: which one, at follow-up"}
