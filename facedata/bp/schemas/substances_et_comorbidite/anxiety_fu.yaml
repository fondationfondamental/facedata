defaults: {versions: [follow_up]}

variables:
  anxiety_disorder_fu: {column: rad_tb_anx, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Has an anxiety disorder, at follow-up"}

  # Which ones: boxes, filled only after a yes (1 = ticked, 0 = not ticked).
  panic_disorder_stored_fu: {column: ceoccurtrouble_panique, type: item, range: [0, 1], asked_if: anxiety_disorder_fu, keep: false, label: "Panic disorder, as stored by the export, at follow-up"}
  # One set of details for the panic disorder: the form has two, and either one is filled.
  panic_onset_age_fu: {column: [agedebuttroubpanago, agedebuttroubpansago], type: item, range: [0, 90], label: "Panic disorder: age at onset, at follow-up"}
  panic_last_month_fu: {column: [occurtroubpanago, occurtroubpansago], type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Panic disorder: symptoms in the past month, at follow-up"}

  agoraphobia_fu: {column: ceoccuragostroubpan, type: item, range: [0, 1], asked_if: anxiety_disorder_fu, label: "Agoraphobia without panic disorder, at follow-up"}
  agoraphobia_onset_age_fu: {column: agedebutagostroubpan, type: item, range: [0, 90], label: "Agoraphobia: age at onset, at follow-up"}
  agoraphobia_last_month_fu: {column: occuragostroubpan, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Agoraphobia: symptoms in the past month, at follow-up"}
  social_phobia_fu: {column: ceoccurphobiesoc, type: item, range: [0, 1], asked_if: anxiety_disorder_fu, label: "Social phobia, at follow-up"}
  social_phobia_onset_age_fu: {column: agedebutphobiesoc, type: item, range: [0, 90], label: "Social phobia: age at onset, at follow-up"}
  social_phobia_last_month_fu: {column: occurphobiesoc, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Social phobia: symptoms in the past month, at follow-up"}
  specific_phobia_fu: {column: ceoccurphobie_sp_cifi, type: item, range: [0, 1], asked_if: anxiety_disorder_fu, label: "Specific phobia, at follow-up"}
  specific_phobia_onset_age_fu: {column: agedebutphobie_sp_cifi, type: item, range: [0, 90], label: "Specific phobia: age at onset, at follow-up"}
  specific_phobia_last_month_fu: {column: occurphobie_sp_cifi, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Specific phobia: symptoms in the past month, at follow-up"}
  ocd_fu: {column: ceoccurtoc, type: item, range: [0, 1], asked_if: anxiety_disorder_fu, label: "Obsessive-compulsive disorder, at follow-up"}
  ocd_onset_age_fu: {column: agedebuttoc, type: item, range: [0, 90], label: "Obsessive-compulsive disorder: age at onset, at follow-up"}
  ocd_last_month_fu: {column: occurtoc, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Obsessive-compulsive disorder: symptoms in the past month, at follow-up"}
  ptsd_fu: {column: ceoccurspt, type: item, range: [0, 1], asked_if: anxiety_disorder_fu, label: "Post-traumatic stress disorder, at follow-up"}
  ptsd_onset_age_fu: {column: agedebutspt, type: item, range: [0, 90], label: "Post-traumatic stress disorder: age at onset, at follow-up"}
  ptsd_last_month_fu: {column: occurspt, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Post-traumatic stress disorder: symptoms in the past month, at follow-up"}
  gad_fu: {column: ceoccuranxietegeneral, type: item, range: [0, 1], asked_if: anxiety_disorder_fu, label: "Generalised anxiety disorder (current episode only), at follow-up"}
  gad_onset_age_fu: {column: agedebutanxietegeneral, type: item, range: [0, 90], label: "Generalised anxiety disorder: age at onset, at follow-up"}
  gad_last_month_fu: {column: occuranxietegeneral, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Generalised anxiety disorder: symptoms in the past month, at follow-up"}

  anxiety_medical_fu: {column: ceoccurtrouble_anxieux_affection_medicale_generale, type: item, range: [0, 1], asked_if: anxiety_disorder_fu, label: "Anxiety disorder due to a general medical condition, at follow-up"}
  anxiety_medical_condition_fu: {column: cedecodtroubanxaffmed, type: text, label: "Anxiety due to a medical condition: the condition, as written, at follow-up"}
  anxiety_medical_onset_age_fu: {column: agedebuttroubanxaffmed, type: item, range: [0, 90], label: "Anxiety due to a medical condition: age at onset, at follow-up"}
