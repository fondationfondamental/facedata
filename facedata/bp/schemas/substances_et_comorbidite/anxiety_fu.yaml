  anxiety_substance_name_fu: {column: cedecodtroubanxindsub, type: text, label: "Substance-induced anxiety: the substance, as written, at follow-up"}
  anxiety_substance_onset_age_fu: {column: agedebuttroubanxindsub, type: item, range: [0, 90], label: "Substance-induced anxiety: age at onset, at follow-up"}
  anxiety_substance_last_month_fu: {column: occurtroubanxindsub, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Substance-induced anxiety: symptoms in the past month, at follow-up"}
  anxiety_unspecified_fu: {column: ceoccur_trouble_anxieux_non_specifie, type: item, range: [0, 1], asked_if: anxiety_disorder_fu, label: "Anxiety disorder not otherwise specified, at follow-up"}
  anxiety_unspecified_onset_age_fu: {column: agedebuttroubanxnonspe, type: item, range: [0, 90], label: "Anxiety disorder not otherwise specified: age at onset, at follow-up"}
  anxiety_unspecified_last_month_fu: {column: occurtroubanxnonspe, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Anxiety disorder not otherwise specified: symptoms in the past month, at follow-up"}

scores:
  # The stored box, but missing where only the agoraphobia box can have ticked it (D151).
  panic_disorder_fu:
    custom: panic_unless_agoraphobia_only
    label: "Panic disorder, at follow-up"
    range: [0, 1]
    compare: panic_disorder_stored_fu
