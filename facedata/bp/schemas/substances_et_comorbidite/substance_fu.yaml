instrument: substance_fu
title: Substance use disorders (yearly follow-up visits)
tab: SUBSTANCES ET COMORBIDITE
section: Troubles liés à une SUBSTANCE AU COURS DE LA VIE
status: draft
notes: >
  One yes/no question (does the patient have, or have they had, a substance
  use disorder), then for each of eight substances: a box, the type (abuse
  or dependence), whether symptoms were present in the past month, the age
  at onset and the cumulated duration of the disorder over the whole life,
  in months. Yes/no answers are delivered as 1 and 0; "unknown" (U) is a
  missing code.

  Two periods in the same columns (decisions D49 and D50 in PROGRESS.md).
  The same questions are asked at the inclusion visit and at the yearly
  visits, with the same wording: the form asks "does the patient have, or have they had, a substance use disorder", under the title "over the whole life".
  The yearly form is the inclusion form again, shown after one more
  question, "no change since the last visit?", which the extraction does
  not hold (read in the application in November 2026, decision D84 in
  PROGRESS.md). A yearly answer is an update given at that visit; the
  project lead reads it as an answer about the time since the last visit. The data show it: at inclusion the
  question is about the whole life, and of the patients answered "yes" then,
  40% are answered "no" a year or more later, in every centre and every
  period (37% of the patients have a disorder at inclusion, 23% at the
  yearly visits). The details given after a yes still describe the whole
  life at the yearly visits (same ages at onset, same cumulated durations).
  The two are therefore delivered as separate columns, ending in _v0
  (inclusion visit) and _fu (yearly visits);
  visit_form says which form a visit used and is read from the visit
  label.

  The first question is read in rad_tb_subst_raw. The column rad_tb_subst is
  a copy of it written as 0 and 1, in which the "unknown" answers (95
  rows) are left empty on purpose (answer of the data managers, decision
  D74 in PROGRESS.md); it is not loaded.

  The boxes are 0 where the first answer is no: the export writes them. They
  are empty on 29 visits where it is yes.

  Durations. Typed in months; a few cells hold words or a fraction and end
  unparsed. "ne sa" (a cut "ne sais pas") is a missing code. A duration
  above 840 months (70 years) is out of range (2 cells). 40 durations are
  longer than the time between the age at onset and the visit; they are
  delivered as written.

  Abuse and dependence are the DSM-IV names. They are used in every year,
  also for the patients evaluated with DSM-5 criteria.

version:
  name: visit_form
  column: visit
  codes:
    V0: inclusion
    V1_an: follow_up
    V2_ans: follow_up
    V3_ans: follow_up
    V4_ans: follow_up
    V5_ans: follow_up
    V6_ans: follow_up
    V7_ans: follow_up
    V8_ans: follow_up
    V9_ans: follow_up
    V10_ans: follow_up
    V6_mois: follow_up
    V18_mois: follow_up
    V30_mois: follow_up
    V42_mois: follow_up
    V54_mois: follow_up
    V66_mois: follow_up
    V78_mois: follow_up
    V90_mois: follow_up
    V102_mois: follow_up
    V114_mois: follow_up
    V126_mois: follow_up

defaults: {versions: [follow_up]}

variables:
  substance_disorder_fu: {column: rad_tb_subst_raw, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Has or has had a substance use disorder (abuse or dependence), at follow-up"}

  alcohol_disorder_fu: {column: suoccur_alcool, type: item, range: [0, 1], label: "Alcohol: abuse or dependence, at follow-up"}
  alcohol_type_fu: {column: type_alcool, type: category, codes: {Abus: abuse, "Dépendance": dependence}, label: "Alcohol: abuse or dependence, which, at follow-up"}
  alcohol_last_month_fu: {column: abudep_alcool, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Alcohol: symptoms in the past month, at follow-up"}
  alcohol_onset_age_fu: {column: agedebut_alcool, type: item, range: [0, 90], label: "Alcohol: age at onset, at follow-up"}
  alcohol_months_fu: {column: sudur_alcool, type: number, unit: months, range: [0, 840], missing: {"ne sa": unknown}, label: "Alcohol: cumulated duration of the disorder over the life, at follow-up"}

