  substance_disorder_fu: {column: rad_tb_subst_raw, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Has or has had a substance use disorder (abuse or dependence), at follow-up"}

  alcohol_disorder_fu: {column: suoccur_alcool, type: item, range: [0, 1], asked_if: substance_disorder_fu, label: "Alcohol: abuse or dependence, at follow-up"}
