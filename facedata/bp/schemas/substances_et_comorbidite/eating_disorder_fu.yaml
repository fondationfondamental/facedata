instrument: eating_disorder_fu
title: Eating disorders (yearly follow-up visits)
tab: SUBSTANCES ET COMORBIDITE
section: Trouble du COMPORTEMENT ALIMENTAIRE
status: draft
notes: >
  Whether the patient has an eating disorder, which one, whether symptoms
  were present in the past month and the age at onset. Yes/no answers are
  delivered as 1 and 0; "unknown" (U) is a missing code.

  Two periods in the same columns (decisions D49 and D50 in PROGRESS.md).
  The same questions are asked at the inclusion visit and at the yearly
  visits, with the same wording: the form asks "does the patient have an eating disorder", in the present tense.
  The yearly form is the inclusion form again, shown after one more
  question, "no change since the last visit?", which the extraction does
  not hold (read in the application in November 2026, decision D84 in
  PROGRESS.md). A yearly answer is an update given at that visit; the
  project lead reads it as an answer about the time since the last visit. The data show it: 20% of the
  patients have an eating disorder at inclusion, 14% at the yearly visits;
  of the patients who had one at inclusion, half are answered "no" a year or
  more later. The two are therefore delivered as separate columns, ending in
  _v0 (inclusion visit) and _fu (yearly visits);
  visit_form says which form a visit used and is read from the visit
  label.

  "Night eating syndrome" is a choice used on a handful of visits, from
  2024.

