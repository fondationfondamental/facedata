instrument: anxiety_v0
title: Anxiety disorders (inclusion visit)
tab: SUBSTANCES ET COMORBIDITE
section: Troubles ANXIEUX
status: draft
notes: >
  One yes/no question (does the patient have an anxiety disorder), then one
  box per disorder and, for each, the age at onset and whether symptoms were
  present in the past month. Yes/no answers are delivered as 1 and 0;
  "unknown" (U) is a missing code.

  Two periods in the same columns (decisions D49 and D50 in PROGRESS.md).
  The same questions are asked at the inclusion visit and at the yearly
  visits, with the same wording: the form asks "does the patient have an anxiety disorder", in the present tense.
  The yearly form is the inclusion form again, shown after one more
  question, "no change since the last visit?", which the extraction does
  not hold (read in the application in November 2026, decision D84 in
  PROGRESS.md). A yearly answer is an update given at that visit; the
  project lead reads it as an answer about the time since the last visit. The data show it: 48% of the
  patients have an anxiety disorder at inclusion, 35% at the yearly visits;
  of the patients who had one at inclusion, 41% are answered "no" a year or
  more later, in every centre. The two are therefore delivered as separate
  columns, ending in _v0 (inclusion visit) and _fu (yearly visits); visit_form says which form a visit used and is read
  from the visit label.

  The boxes are shown only after a yes to the first question: 0 means "not
  ticked". After a no they are empty in the extraction and are read as 0
  (asked_if, decision D50): a patient with no anxiety disorder has none of
  them. Where the first answer is unknown or empty they stay missing. The
  ages at onset and the "symptoms in the past month" stay missing after a
  no: they have no value.

  Panic disorder. panic_disorder is ticked exactly where one of the two
  boxes (with or without agoraphobia) is. The form has one age at onset and
  one "symptoms in the past month" for each of the two boxes, but the
  clinicians fill either one whatever the box (of the visits with the box
  "without agoraphobia" and an age, 44% have it in the column of "with
  agoraphobia"). The two columns are therefore read as one detail of the
  panic disorder: the first that is filled; column_conflict where both are
  and differ.

  Four columns are not in the dictionary and are read here: the box "panic
  disorder" and the boxes of the last three disorders (the dictionary lists
  one of them as a section title).

  A detail is sometimes filled although its box is not ticked (1 to 17
  visits per disorder), and often empty although it is (the age at onset of
  half of the ticked disorders). Both are delivered as written.

