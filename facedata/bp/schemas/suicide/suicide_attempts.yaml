instrument: suicide_attempts
title: History of suicide attempts over the whole life (inclusion visit)
tab: SUICIDE
section: Histoire des conduites suicidaires
status: draft
notes: >
  Date of the first attempt, number of attempts, and whether some were
  violent (firearm, hanging, jump...) or serious (intensive care), over the
  whole life, as asked at the inclusion visit. Yes/no answers are delivered
  as 1 and 0.

  Two forms in the same columns (decision D86 in PROGRESS.md, was open
  question O47). The inclusion form asks "how many times have you attempted
  suicide" and the date of the first attempt. The follow-up form asks the
  same numbers "since the last visit" and has no date of the first attempt
  (read in the form definitions of the application in November 2026). The
  follow-up visits are therefore another instrument,
  suicide_attempts_since_visit, with its own output columns. visit_form says
  which form a visit used; it is read from the visit label.

  Date of the first attempt. 162 cells hold the placeholder 1000-01-01. 276
  dates are a first of January: only the year was known. The placeholder
  2011-11-11 is written at the follow-up visits only and is read there.

  Number of attempts. One cell holds 99 and ends out_of_range.

  The date of the most violent attempt (isf08_qsdtc) is in the dictionary
  but not in the extraction: the question was removed from the BP form, and
  the source database no longer holds it (answer of the data managers in
  November 2026, decision D69 in PROGRESS.md).

version:
  name: visit_form
  column: visit
  codes:
    V0: inclusion
    V1_an: follow_up
    V2_ans: follow_up
    V3_ans: follow_up
    V4_ans: follow_up
    V5_ans: follow_up
    V6_ans: follow_up
    V7_ans: follow_up
    V8_ans: follow_up
    V9_ans: follow_up
    V10_ans: follow_up
    V6_mois: follow_up
    V18_mois: follow_up
    V30_mois: follow_up
    V42_mois: follow_up
    V54_mois: follow_up
    V66_mois: follow_up
    V78_mois: follow_up
    V90_mois: follow_up
    V102_mois: follow_up
    V114_mois: follow_up
    V126_mois: follow_up

defaults: {type: item, range: [0, 1], versions: [inclusion]}

variables:
  first_attempt_date:
    column: isf05_qsdtc
    type: date
    label: Date of the first suicide attempt
    range: [1920-01-01, 2026-12-31]
  n_attempts: {column: isf07, label: Number of suicide attempts, range: [0, 50]}
  violent_attempts: {column: isf08, label: Has made violent suicide attempts, codes: {Oui: 1, Non: 0}}
  n_violent_attempts: {column: isf08a, label: Number of violent suicide attempts, range: [0, 20]}
  serious_attempts: {column: isf09, label: Has made serious suicide attempts (intensive care), codes: {Oui: 1, Non: 0}}
  n_serious_attempts: {column: isf09a, label: Number of serious suicide attempts, range: [0, 20]}
