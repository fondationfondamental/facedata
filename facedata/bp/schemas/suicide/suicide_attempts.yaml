instrument: suicide_attempts
title: History of suicide attempts over the whole life (inclusion visit)
tab: SUICIDE
section: Histoire des conduites suicidaires
status: reviewed
notes: >
  Date of the first attempt, number of attempts, and whether some were
  violent (firearm, hanging, jump...) or serious without being violent
  (intensive care after drugs or cutting), over the whole life, as asked at
  the inclusion visit. Violent and serious are two separate groups of the
  form. Yes/no answers are delivered as 1 and 0; "Ne sais pas" to the
  violent and serious questions is a missing code (7 and 21 answers).

  Two forms in the same columns (decision D86 in PROGRESS.md, was open
  question O47). The inclusion form asks "how many times have you attempted
  suicide" and the date of the first attempt. The follow-up form asks the
  same numbers "since the last visit" and has no date of the first attempt
  (read in the form definitions of the application in November 2026). The
  follow-up visits are therefore another instrument,
  suicide_attempts_since_visit, with its own output columns. visit_form says
  which form a visit used; it is read from the visit label.

  Time frame of the follow-up form (decision D159, rule R14a). The
  follow-up form asks "depuis la dernière visite" on the attempt question
  and on the three counts: its answers are about the time since the last
  visit, not a yearly update (D84 does not apply to the suicide forms). The
  form has no question "is there a change since the last visit?"
  (rad_pas_dechangement is in other sections), so an empty follow-up form
  means that the form was not done.

  Counts that are 0 by logic (decision D125, as D122). The number of
  attempts is 0 after a no to "have you ever attempted suicide" (isf05,
  read here and delivered as isf05_lifetime): 3,286 inclusions get their 0
  this way. The violent and serious attempts are 0 after 0 attempts, and
  their numbers are 0 after a no. n_attempts is on 5,785 inclusions, 2,142
  of them above 0.

  The history after a no to "attempted". The inclusion form of the
  application today shows the date, the count and the two yes/no questions
  to every patient (no condition on them; the follow-up form shows them
  only after a yes). The data say that a no left them empty until 2020: the
  inclusions that say no and hold a count or one of the two answers are 0%
  to 1% a year from 2011 to 2020 (4 of 2,385), 5% in 2021 (14 of 286: 5 in
  the first quarter and 9 in the last) and 37% to 48% a year from 2022 (382
  of 900). D125 dated the change "from early 2022"; measured in D159, it
  starts at the end of 2021. From the end of 2021 a 0 is typed after a no
  (6 in the last quarter of 2021, 298 of the 900 no from 2022), and 51
  inclusions that say no give a number above 0, 50 of them from 2022; 50
  inclusions that say no carry a real date of the first attempt, 45 of them
  with a number above 0 (2022 to 2026). They are delivered as typed. The
  forms of 2009 and 2010 also typed 0 after a no (37 of the 114 inclusions
  that say no: 26 in 2009, 11 in 2010). 8 inclusions say yes with 0
  attempts. Among the patients with at least one attempt the number is
  steady (mean 2.4 to 2.8 in every period): compare the counts there.

  Date of the first attempt, on 1,790 inclusions. A date on or after the
  inclusion visit is impossible and is delivered as missing (before_visit,
  D125): 306 cells are out_of_range, 229 on the day of the visit and 77
  after it. 297 of them contradict the patient's own answer about when the
  last attempt was. The same-day dates stop in 2022 (4 that year, then 1
  in 2025), as if an older form had filled the field with the day. One
  more date has the year 0000 (out_of_range). 162 cells hold the
  placeholder 1000-01-01 (the default of the column in the inclusion
  table). Dates are often rounded: 276 are a first of January and 629 of
  the 1,751 full dates a 15th, where only the year or the month was known.
  28 dates typed without a month are delivered as 1 July and 11 without a
  day as the 15th (date_partial); 2 cannot be read (unparsed). The
  placeholder 2011-11-11 is written at the follow-up visits
  only and is read there: the date column of the follow-up table is NOT
  NULL with no default and the form does not show it, so the database
  stores 0000-00-00, or 2011-11-11 at one centre (8,073 and 1,142 follow-up
  visits, application defect A20).

  Number of attempts. At inclusion one cell holds 99 and ends
  out_of_range; at follow-up the largest number is 20. The form accepts
  one or two digits for the three counts (0 to 99); the ranges of this
  schema (0 to 50, 0 to 20) are plausible limits, not the form's.

  What follows the history in the form (decision D159). The sections of the
  most violent and of the most serious attempt are no longer displayed (see
  most_violent_attempt and most_serious_attempt, application defect A60),
  whereas this group is. Group 5 of the form, the Suicide Intent Scale of
  the most recent attempt (15 items, rad_SISR01 to 015, shown at follow-up
  after a yes to "attempted since the last visit"), is displayed but none
  of its answers is in the extraction: no export model selects it and the
  V4.34 dictionary does not list it (request R126). The behaviour section
  of the C-SSRS is in the same case (see cssrs_v0).

  The date of the most violent attempt (isf08_qsdtc) is in the dictionary
  but not in the extraction: the question was removed from the BP form, and
  the source database no longer holds it (answer of the data managers in
  November 2026, decision D69 in PROGRESS.md).

version:
  name: visit_form
  column: visit
  codes:
    V0: inclusion
    V1_an: follow_up
    V2_ans: follow_up
    V3_ans: follow_up
    V4_ans: follow_up
    V5_ans: follow_up
    V6_ans: follow_up
    V7_ans: follow_up
    V8_ans: follow_up
    V9_ans: follow_up
    V10_ans: follow_up
    V6_mois: follow_up
    V18_mois: follow_up
    V30_mois: follow_up
    V42_mois: follow_up
    V54_mois: follow_up
    V66_mois: follow_up
    V78_mois: follow_up
    V90_mois: follow_up
    V102_mois: follow_up
    V114_mois: follow_up
    V126_mois: follow_up

defaults: {type: item, range: [0, 1], versions: [inclusion]}

variables:
  attempted_ever: {column: isf05, codes: {Oui: 1, Non: 0}, keep: false, label: "Has ever attempted suicide (delivered as isf05_lifetime)"}
  first_attempt_date:
    column: isf05_qsdtc
    type: date
    label: Date of the first suicide attempt
    range: [1920-01-01, today]
    before_visit: true
  n_attempts: {column: isf07, label: Number of suicide attempts, range: [0, 50], asked_if: attempted_ever}
  violent_attempts: {column: isf08, label: Has made violent suicide attempts, codes: {Oui: 1, Non: 0}, asked_if: n_attempts}
  n_violent_attempts: {column: isf08a, label: Number of violent suicide attempts, range: [0, 20], asked_if: violent_attempts}
  serious_attempts: {column: isf09, label: "Has made serious non-violent suicide attempts (intensive care)", codes: {Oui: 1, Non: 0}, asked_if: n_attempts}
  n_serious_attempts: {column: isf09a, label: "Number of serious non-violent suicide attempts (intensive care)", range: [0, 20], asked_if: serious_attempts}
