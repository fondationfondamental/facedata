    V1_an: follow_up
    V2_ans: follow_up
    V3_ans: follow_up
    V4_ans: follow_up
    V5_ans: follow_up
    V6_ans: follow_up
    V7_ans: follow_up
    V8_ans: follow_up
    V9_ans: follow_up
    V10_ans: follow_up
    V6_mois: follow_up
    V18_mois: follow_up
    V30_mois: follow_up
    V42_mois: follow_up
    V54_mois: follow_up
    V66_mois: follow_up
    V78_mois: follow_up
    V90_mois: follow_up
    V102_mois: follow_up
    V114_mois: follow_up
    V126_mois: follow_up

defaults:
  type: item
  range: [0, 1]
  codes: {Oui: 1, Non: 0}
  versions: [follow_up]
  doubt:
    period: [2022-01-01, 2023-12-31]
    values: [1, last_week, since_last_visit]       # a "yes", and the "when" that goes with it
    note: answers about the whole life entered at part of the follow-up visits of 2022 and 2023

