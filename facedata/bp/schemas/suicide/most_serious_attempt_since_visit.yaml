defaults:
  type: category
  versions: [follow_up]
  doubt:
    period: [2021-11-01, 2023-12-31]
    remove: true                                   # not delivered (decisions D88 and D125)
    note: the follow-up form of 2022 and 2023 also asked about the whole life

variables:
  serious_method_since_visit:
    column: ltsg01
    label: Method of the most serious attempt - since the last visit
    codes:
      "Médicaments (drogues) avec effets sédatifs": sedative_drugs
      "Médicaments (drogues) sans effets sédatifs et pour toutes autres substances ingérées": non_sedative_drugs_or_substances
      "Phlébotomie": cutting
  serious_sedative_type_since_visit:
    shown_if: {serious_method_since_visit: [sedative_drugs]}
    column: ltsg02
    label: Kind of drug with a sedative effect - since the last visit
    missing: {Inconnu: unknown}
    codes:
      "Benzodiazépines / Hypnotique": benzodiazepine_or_hypnotic
      "Antipsychotique": antipsychotic
      "Antidépresseur": antidepressant
      "Anticonvulsivant": anticonvulsant
      "Prescription autre que psychotrope": other_prescription
      "Sédatif en vente libre": over_the_counter_sedative
      "Alcool": alcohol
      "Substances festives": recreational_drug
      "Gaz / Asphyxiant": gas
  serious_non_sedative_type_since_visit:
    shown_if: {serious_method_since_visit: [non_sedative_drugs_or_substances]}
    column: ltsg03
    label: Kind of drug or substance without a sedative effect - since the last visit
    missing: {Inconnu: unknown}
    codes:
      "Prescription autre que psychotrope": other_prescription
      "Lithium": lithium
      "Médicament en vente libre": over_the_counter_drug
      "Autres substances ingérées": other_substance
      "Substances festives": recreational_drug
      "Anticholinergique": anticholinergic
      "Coupe faim": appetite_suppressant
  serious_sedative_lethality_since_visit:
    shown_if: {serious_method_since_visit: [sedative_drugs]}
    column: ltsg04
    label: Consequences of the attempt with sedative drugs - since the last visit
    codes:
      "Complètement conscient et lucide": fully_conscious
      "Conscient mais somnolent / engourdi": conscious_drowsy
      "Léthargique avec diminution des capacités intellectuelles": lethargic
      "Endormi mais facilement réveillé": asleep_easily_roused
      "Comateux - évitement des stimuli douloureux réflexes intacts blessures suffisantes pour l'hospitalisation": coma_withdraws_from_pain
      "Comateux - pas d'évitement des stimuli douloureux la plupart des réflexes intacts pas de défaillance respiratoire ou circulatoire, blessures suffisantes pour surveillance aux Soins Intensifs.": coma_no_withdrawal
      "Comateux - la plupart des réflexes absents, pas de défaillance respiratoire ou circulatoire, Soins Intensifs. et procédures médicales sérieuses": coma_most_reflexes_absent
      "Comateux - tous les réflexes absents défaillance respiratoire avec cyanose ou défaillance circulatoire et choc ou les deux": coma_all_reflexes_absent
      "Mort": death
  serious_non_sedative_lethality_since_visit:
    shown_if: {serious_method_since_visit: [non_sedative_drugs_or_substances]}
    column: ltsg05
    label: Consequences of the attempt with other drugs or substances - since the last visit
    codes:
      "Pas de conséquences médicales ou de traitement, ou minime": none_or_minimal
      "Quelques blessures (ex : bouche brûlée) et traitement en urgence ou en ambulatoire (ex : lavage gastrique)": emergency_or_outpatient_treatment
      "Blessures suffisantes pour l'hospitalisation - signes vitaux et niveau de conscience peuvent être affectés": hospitalisation
      "Effets majeures systématiques - tels que perforation gastro-intestinale, défaillance rénale, hémolyse, ou choc signes vitaux instables": major_systemic_effects
      "Mort": death
  serious_cutting_lethality_since_visit:
    shown_if: {serious_method_since_visit: [cutting]}
    column: ltsg06
    label: Consequences of the cutting - since the last visit
    codes:
      "Surfaces griffées, pas ou peu de saignements, pas ou peu de soins requis pour les blessures": scratches
      "Saignement modéré avec caillot avant qu'il n'y ait perte de sang significative simples soins requis": moderate_bleeding
      "Saignement des veines majeures, danger de perte de sang considérable sans intervention chirurgicale - suture nécessaire mais pas de transfusion, zones vitales intactes et pas de changement dans les signes vitaux, soins en ambulatoire": major_vein_bleeding
      "Perte de sang importante, suture, transfusion nécessaire, réparation de tendons requise, blessures possibles sur la tête, le thorax, ou l'abdomen mais organes vitaux intacts et signes vitaux stables rétablissement attendu après hospitalisation": major_blood_loss
      "Perte de sang très importante avec choc, lésion des zones vitales avec changement dans les signes vitaux rétablissement après hospitalisation peu probable": severe_blood_loss_vital_damage
      "Mort": death
  serious_triggered_since_visit: {column: ltsg07, type: item, range: [0, 1], codes: {Oui: 1, Non: 0}, label: A precise event seems to have triggered the attempt - since the last visit}
  serious_trigger_since_visit:
    shown_if: {serious_triggered_since_visit: [1]}
    column: ltsg08
    label: External trigger of the attempt - since the last visit
    codes:
      "Conjugal": partner
      "Autre facteur interpersonnel": other_interpersonal
      "Professionnel": work
      "Evènement de vie": life_event
      "Santé": health
      "Sévices physiques": physical_abuse
      "Abus sexuel": sexual_abuse
      "Autre": other
      "Ne peut pas être évalué": cannot_be_assessed
