instrument: most_serious_attempt_since_visit
title: The most serious suicide attempt since the last visit (follow-up visits)
tab: SUICIDE
section: Columbia TS la plus grave
status: reviewed
notes: >
  The section on the most serious attempt as the follow-up form asked it:
  the most serious non-violent attempt since the last visit, asked after a
  yes to serious attempts since the last visit
  (serious_attempts_since_visit). Delivered as categories; "triggered" as 1
  (yes) and 0 (no). The inclusion visit, about the whole life, is
  most_serious_attempt (one schema per form, decision D125 in PROGRESS.md,
  as D86 did for the attempt counts).

  24 methods on 27 follow-up visits, from 2010 to September 2020; the
  section left the forms during 2021, at one centre early in 2022. All 27
  follow a yes to serious attempts since the last visit. For 14 of the 24
  patients the inclusion visit counts no serious attempt
  (serious_attempts 0): the answer describes a later attempt. 9 gave a
  method at inclusion too, 6 of them the same one. Drugs with a sedative
  effect are 67% of the methods (81% at inclusion), other drugs or
  substances 29%.

  The period of D88, which starts on 2021-11-01 (D125), holds 1 visit, of
  February 2022: its 4 cells (one method) are delivered as missing with the
  flag period_removed.

  As at inclusion, a drug type and a lethality are read only for their own
  method and the trigger only after a yes to "triggered" (shown_if). The
  forms of 2009-2010 saved the first option of these lists, the hidden ones
  too: on 4 visits of 2010 with no method, 20 cells are delivered as
  missing with the flag not_shown. The code lists are those of
  most_serious_attempt. A drug type "Inconnu" is a missing code (1 cell).

