instrument: most_violent_attempt_since_visit
title: The most violent suicide attempt since the last visit (follow-up visits)
tab: SUICIDE
section: Columbia TS la plus violente
status: reviewed
notes: >
  The section on the most violent attempt as the follow-up form asked it:
  the most violent attempt since the last visit, asked after a yes to
  violent attempts since the last visit (violent_attempts_since_visit),
  itself asked after a yes to "attempted suicide since the last visit".
  Delivered as categories; "triggered" as 1 (yes) and 0 (no). The inclusion
  visit, about the whole life, is most_violent_attempt (one schema per form,
  decision D125 in PROGRESS.md, as D86 did for the attempt counts).

  16 methods on 18 follow-up visits, from 2013 to September 2021; the
  section left the forms during 2021. For 13 of the 16 patients the
  inclusion visit counts no violent attempt (violent_attempts 0): the
  answer describes a later attempt. 2 gave a method at inclusion too, the
  same one.

  The period of D88, which starts on 2021-11-01 (D125), holds 1 visit, of
  December 2021: its 3 cells (one method) are delivered as missing with the
  flag period_removed.

  As at inclusion, a lethality is read only for its own method and the
  trigger only after a yes to "triggered" (shown_if). The forms of 2009-2010
  saved the first option of these lists, the hidden ones too: on 4 visits
  of 2010 with no method, 28 cells are delivered as missing with the flag
  not_shown. The code lists hold the whole scale of the form.

  3 visits of 2018 to 2021 answer the section after a no to "attempted
  suicide since the last visit", where the form does not show it: one gives
  a method, two only whether an event triggered the attempt. Delivered as
  written.

