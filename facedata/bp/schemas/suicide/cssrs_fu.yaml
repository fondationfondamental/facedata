instrument: cssrs_fu
title: "Columbia Suicide Severity Rating Scale, suicidal ideation, since the last visit (follow-up visits)"
tab: SUICIDE
section: Questionnaire C-SSRS Idéation suicidaire
status: reviewed
notes: >
  The ideation part of the Columbia Suicide Severity Rating Scale (C-SSRS)
  at the follow-up visits, about the time since the last visit: five yes/no
  questions of rising severity, delivered as 1 (yes) and 0 (no), the most
  severe ideation as rated (1 to 5) and five ratings of its intensity, with
  their sum. The extraction holds no behaviour section and no stored total.

  One schema per form (decision D125 in PROGRESS.md). The application has
  one C-SSRS form for the inclusion and the follow-up visits; its
  instruction sets the period ("Depuis la semaine dernière pour une
  évaluation initiale ou depuis la dernière visite lors d'un suivi"): the
  past week at an initial evaluation, the time since the last visit at a
  follow-up. The inclusion answers are cssrs_v0 (variables in _past_week,
  decision D158). visit_form says which form a visit used; it is read from
  the visit label. The names are those of the DR follow-up schema, and the
  two are stacked with care (common_instruments.yaml); DR also has the
  behaviour section.

  Time frame (decision D159, rule R14a). The follow-up answers are about
  the time since the last visit, as the instruction says: they are not a
  yearly update (D84 does not apply to the suicide forms). The suicide
  forms have no question "is there a change since the last visit?"
  (rad_pas_dechangement is in other sections), so an empty follow-up form
  means that the form was not done, not "no change".

  2,355 visits answer the first question (2,406 any question): 3 in 2019
  and 2020, 37 in 2021, 471 to 564 a year in 2022 to 2025 and 285 in 2026
  (to November). From 2022 the form is filled at 60% to 78% of the
  follow-up visits. The wish to be dead is answered yes on 680 visits
  (29%), active suicidal thoughts on 425 of 2,374 (18%). The answers are
  about the time since the last visit: from 2024 the wish to be dead agrees
  with isf02_since_visit of the same visit on 804 of 894 visits.

  The years 2022 and 2023 are delivered. Unlike the follow-up suicide
  questions (isf_since_visit, D88), the C-SSRS has no peak in these years:
  the wish to be dead is yes on 25% (2022) and 26% (2023) of the visits,
  against 30% to 35% from 2024.

  The C-SSRS takes the place of the five suicide questions at three centres
  from 2022 (one centre) or 2024 (two). At one more centre the whole tab is
  empty at most visits of 2023: 148 of its 191 follow-up visits hold
  neither the five questions nor the C-SSRS (77%, against 27% to 36% in
  each of 2019 to 2022 and 2024), and 137 of these 148 visits hold a MADRS
  (at the other centres, 35 of the 248 visits that hold neither do): the
  visit took place and the tab was left empty (O40, DM-6).

  Questions 3 to 5 (a method, an intent, a plan) are asked only after a yes
  to question 2. After a no they are 0 (asked_if): 1,949 visits. They were
  asked on 415 to 417 visits.

  The most severe ideation (428 visits; range 1 to 5) and the five
  intensity ratings (598 to 613) are to be rated after a yes to question 1
  or 2 (718 visits). The application does not enforce it: 40 visits rate
  the most severe ideation or an intensity item although both questions
  are no (33 an intensity item), and 23 of them get an intensity sum;
  delivered as rated. After a yes, the most severe ideation is empty on 312
  of the 718 visits and the five ratings on 141. The most severe ideation
  as rated differs from the highest question answered yes on 187 of the 428
  visits that rate it: on 21 every question is no and on 1 none is
  answered, and of the 406 with a yes it is the highest on 241, higher on
  106 and lower on 59; on 33 visits it names a level 3 to 5 although
  question 2 is no. It is delivered as rated.

  Intensity: code 0 of controllability ("does not try to control") and of
  deterrents and reasons ("does not apply") is not the mild end of the
  scale. The sum counts it as 0, the official rule (33, 72 and 84 cells;
  127 of the 588 sums hold one). The sum is given where the five ratings
  are: 588 visits, 2 to 25, median 12.

  What the extraction does not hold (decision D159). After these questions
  the form has a behaviour section: non-suicidal self-injury, interrupted
  and aborted attempts with their counts, preparatory acts, and the
  observed and potential lethality of the most recent, the most lethal and
  the first attempt, with their dates. The application stores it in
  psy_suicide and psy_suicide_semestriel (rad_cssrs15, 16, 18 and 20,
  cssrs17 and 19, the lethality items 22c to 27c); the clean models of the
  export read it, face_bp_5_suicide.sql does not select it and the V4.34
  dictionary does not list it (request R126). The seed of the form has no
  rows for rad_cssrs13 and 14, the parents of the dates: a dangling
  parent. The deterrents item (radhtml_cssrs11) carries the text of the
  controllability question above its options (application defect A59): the
  rating is delivered as rated.

version:
  name: visit_form
  column: visit
  codes:
    V0: inclusion
    V1_an: follow_up
    V2_ans: follow_up
    V3_ans: follow_up
    V4_ans: follow_up
    V5_ans: follow_up
    V6_ans: follow_up
    V7_ans: follow_up
    V8_ans: follow_up
    V9_ans: follow_up
    V10_ans: follow_up
    V6_mois: follow_up
    V18_mois: follow_up
    V30_mois: follow_up
    V42_mois: follow_up
    V54_mois: follow_up
    V66_mois: follow_up
    V78_mois: follow_up
    V90_mois: follow_up
    V102_mois: follow_up
    V114_mois: follow_up
    V126_mois: follow_up


defaults: {type: item, range: [0, 1], versions: [follow_up]}

variables:
  cssrs01_since_visit: {column: css0101, codes: {Oui: 1, Non: 0}, label: "Wish to be dead - since the last visit"}
  cssrs02_since_visit: {column: css0102, codes: {Oui: 1, Non: 0}, label: "Non-specific active suicidal thoughts - since the last visit"}
  cssrs03_since_visit: {column: css0103, codes: {Oui: 1, Non: 0}, label: "Active suicidal ideation with a method, without intent - since the last visit", asked_if: cssrs02_since_visit}
  cssrs04_since_visit: {column: css0104, codes: {Oui: 1, Non: 0}, label: "Active suicidal ideation with some intent to act, without a plan - since the last visit", asked_if: cssrs02_since_visit}
  cssrs05_since_visit: {column: css0105, codes: {Oui: 1, Non: 0}, label: "Active suicidal ideation with a plan and intent - since the last visit", asked_if: cssrs02_since_visit}
  cssrs_most_severe_since_visit: {column: css0106, range: [1, 5], label: "Most severe ideation, as rated (1 to 5) - since the last visit"}
  cssrs_frequency_since_visit: {column: css0108, range: [1, 5], label: "Intensity: frequency (1 less than once a week to 5 many times a day) - since the last visit"}
  cssrs_duration_since_visit: {column: css0109, range: [1, 5], label: "Intensity: duration (1 a few seconds or minutes to 5 more than 8 hours) - since the last visit"}
  cssrs_control_since_visit: {column: css0110, range: [0, 5], label: "Intensity: controllability (1 easily to 5 unable, 0 does not try) - since the last visit"}
  cssrs_deterrents_since_visit: {column: css0111, range: [0, 5], label: "Intensity: deterrents (1 definitely stopped to 5 did not stop at all, 0 does not apply) - since the last visit"}
  cssrs_reasons_since_visit: {column: css0112, range: [0, 5], label: "Intensity: reasons for ideation (1 only to get attention to 5 only to end the pain, 0 does not apply) - since the last visit"}

scores:
  cssrs_intensity_since_visit:
    label: "C-SSRS intensity of ideation: sum of the five ratings - since the last visit"
    sum: [cssrs_frequency_since_visit, cssrs_duration_since_visit, cssrs_control_since_visit, cssrs_deterrents_since_visit, cssrs_reasons_since_visit]
