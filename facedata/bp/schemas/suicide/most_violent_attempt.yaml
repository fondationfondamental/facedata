defaults: {type: category, versions: [inclusion]}

variables:
  violent_method:
    column: ltsv01
    label: Method of the most violent attempt
    codes:
      "Arme à feu": firearm
      "Immolation": immolation
      "Noyade": drowning
      "Pendaison": hanging
      "Saut": jump
      "Autre (précipitation sous métro/voiture/train, armes blanches, autre)": other
  violent_jump_height:
    shown_if: {violent_method: [jump]}
    column: ltsv02
    label: Height of the jump
    codes:
      "Hauteur d'homme": body_height
      "Hauteur modérée": moderate_height
      "D'un endroit élevé": high_place
  violent_jump_lethality:
    shown_if: {violent_method: [jump]}
    column: ltsv03
    label: Consequences of the jump
    codes:
      "Contusions mineures seulement - pas besoin de traitement": minor_bruises
      "Entorse ou blessure mineure - pas de dommage aux os, ligament, tendon, des tissus ou du cerveau, pas d'hémorragie interne": sprain_or_minor_injury
      "Fracture des extrémités - exploration nécessaire mais pas besoin d'une réparation majeure des tendons et rétablissement complet espéré": limb_fracture
      "Dégâts majeurs aux tendons ou aux os à plusieurs endroits - hémorragies internes quelques dommages résiduels prévu mais pas dans les zones vitales": major_damage_non_vital
      "Dégâts majeurs aux zones vitales (crâne, cou, colonne vertébrale) paralysie prévue": major_damage_vital
      "Mort": death
  violent_firearm_lethality:
    shown_if: {violent_method: [firearm]}
    column: ltsv04
    label: Consequences of the firearm attempt
    codes:
      "Pas de dommage": no_damage
      "Blessures avec brûlures de poudre": powder_burns
      "Balle logée dans une extrémité, légères hémorragies": bullet_in_limb
      "Balle dans l'abdomen ou la poitrine, hémorragies importantes, signes vitaux instables": bullet_in_trunk
      "Balle dans la région de la tête": bullet_in_head
      "Mort": death
  violent_immolation_lethality:
    shown_if: {violent_method: [immolation]}
    column: ltsv05
    label: Consequences of the immolation
    codes:
      "Pas de dommage": no_damage
      "Brûlures du premier degré": first_degree_burns
      "Brûlures du second degré": second_degree_burns
      "Brûlures du troisième degré sur 20% de la surface du corps": third_degree_burns
      "Brûlures du troisième degré sur 60% de la surface du corps": third_degree_burns_60
      "Mort": death
  violent_drowning_lethality:
    shown_if: {violent_method: [drowning]}
    column: ltsv06
    label: Consequences of the drowning
    codes:
      "Pas de dommage": no_damage
      "Conscient - légère détresse respiratoire mais sans besoin de réanimation": conscious_mild_distress
      "Conscient - efforts de réanimation minimes à modérés nécessaires": conscious_minor_resuscitation
      "Conscient - efforts de réanimation importants nécessaires": conscious_major_resuscitation
      "Inconscient - efforts de réanimation très importants indispensables pour la survie": unconscious_resuscitation
      "Mort": death
  violent_hanging_lethality:
    shown_if: {violent_method: [hanging]}
    column: ltsv07
    label: Consequences of the hanging
    codes:
      "Pas de dommage": no_damage
      "Simple brûlure de corde": rope_burn
      "Blessures plus importantes avec traitement en ambulatoire": outpatient_treatment
      "Hospitalisation et réanimation nécessaire": hospital_resuscitation
      "Paralysie ou autre blessure de la colonne vertébrale": spinal_injury
      "Mort": death
  violent_other_lethality:
    shown_if: {violent_method: [other]}
    column: ltsv08
    label: Consequences of an attempt by another method
    codes:
      "Pas de dommage ou contusions mineures": none_or_minor_bruises
      "Blessures légères (égratignures, saignements modérés, entorse ou blessure mineure - pas de dommage aux os, ligament, tendon, des tissus ou du cerveau, pas d’hémorragie interne)": light_injuries
      "Blessures moyennes, légères hémorragies. des extrémités - exploration nécessaire mais pas besoin d’une réparation majeure des tendons et rétablissement complet espéré": moderate_injuries
      "Blessures dans l’abdomen, la gorge ou la poitrine, hémorragies importantes, signes vitaux instables. Dégâts majeurs aux tendons ou aux os à plusieurs endroits - hémorragies internes quelques dommages résiduels prévu mais pas dans les zones vitales": severe_injuries
      "Blessures importantes, pronostic vital engagé. Dégâts majeurs aux zones vitales (crâne, cou, colonne vertébrale) paralysie prévue": life_threatening
      "Mort": death
  violent_triggered: {column: ltsv09, type: item, range: [0, 1], codes: {Oui: 1, Non: 0}, label: A precise event seems to have triggered the attempt}
  violent_trigger:
    shown_if: {violent_triggered: [1]}
    column: ltsv10
    label: External trigger of the attempt
    codes:
      "Conjugal": partner
      "Autre facteur interpersonnel": other_interpersonal
      "Professionnel": work
      "Evènement de vie": life_event
      "Santé": health
      "Sévices physiques": physical_abuse
      "Abus sexuel": sexual_abuse
      "Autre": other
      "Ne peut pas être évalué": cannot_be_assessed
