instrument: cssrs_v0
title: "Columbia Suicide Severity Rating Scale, suicidal ideation, at the inclusion visit"
tab: SUICIDE
section: Questionnaire C-SSRS Idéation suicidaire
status: reviewed
notes: >
  The ideation part of the Columbia Suicide Severity Rating Scale (C-SSRS)
  at the inclusion visit: five yes/no questions of rising severity,
  delivered as 1 (yes) and 0 (no), the most severe ideation as rated (1 to
  5) and five ratings of its intensity, with their sum. The extraction
  holds no behaviour section and no stored total.

  One schema per form (decision D125 in PROGRESS.md). The application has
  one C-SSRS form for the inclusion and the follow-up visits; its
  instruction sets the period ("Depuis la semaine dernière pour une
  évaluation initiale ou depuis la dernière visite lors d'un suivi"): the
  past week at an initial evaluation, the time since the last visit at a
  follow-up. The follow-up answers are cssrs_fu. visit_form says which form
  a visit used; it is read from the visit label. The names say the period
  (decision D158): the variables of this schema end in _past_week (they
  ended in _inclusion), those of cssrs_fu in _since_visit, and DR's
  inclusion variables in _lifetime, because the DR inclusion form asks
  about the whole life: the same questions over another period are another
  notion, so the two inclusion schemas are not stacked.

  1,251 visits answer the first question (1,277 any question): 6 in 2019
  and 2020, 34 in 2021, then 168 to 350 a year (2026 to November). From
  2022 the form is filled at 67% (2022) to 96% (2026) of the inclusions.
  The wish to be dead is answered yes on 458 visits (37%), active suicidal
  thoughts on 304 of 1,263 (24%).

  Questions 3 to 5 (a method, an intent, a plan) are asked only after a yes
  to question 2. After a no they are 0 (asked_if): 959 visits. They were
  asked on 297 to 299 visits.

  The period, by centre (open question O52, asked of the centres in DM-6).
  In most centres the answers are about the past week, as asked: the wish
  to be dead is yes on 114 of the 121 inclusions whose last wish to die
  (isf02_lifetime_when) was in the past week, and on 19 of the 194 where it
  was more than a year ago. Two centres answer yes far more often: the wish
  to be dead on 65% and 71% of their inclusions, against 31% in the others;
  46 of 63 where the last wish to die was more than a year ago (two more
  centres 28 of 94); 88 of 140 where MADRS item 10 is 0 at the same visit
  (two more centres 51 of 224, the others 51 of 437). Their patients do not
  report more recent thoughts (last wish to die in the past week on 12% of
  their inclusions, 15% elsewhere). They may rate a longer period than the
  past week. Delivered as rated. Their intensity sum has a median of 17,
  against 13 in the two more centres and 12 in the others. The median at
  inclusion rises from 12 in 2022 to 17 in 2026 as they give 42 of the 63
  sums of 2026 (15 of 80 in 2022); without them it is 11 to 14 in each
  year from 2022.

  The most severe ideation (250 visits; range 1 to 5, the extraction holds
  no 0) and the five intensity ratings (441 to 455) are to be rated after a
  yes to question 1 or 2 (481 visits). The application does not enforce it:
  38 visits rate the most severe ideation or an intensity item although
  both questions are no (34 an intensity item), and 27 of them get an
  intensity sum; delivered as rated. After a yes, the most severe ideation
  is empty on 248 of the 481 visits and the five ratings on 61. The most
  severe ideation as rated differs from the highest question answered yes
  on 108 of the 250 visits that rate it: on 17 every question is no, and of
  the 233 with a yes it is the highest on 142, higher on 60 and lower on
  31; on 27 visits it names a level 3 to 5 although question 2 is no. It
  is delivered as rated.

  Intensity: code 0 of controllability ("does not try to control") and of
  deterrents and reasons ("does not apply") is not the mild end of the
  scale. The sum counts it as 0, the official rule (13, 36 and 37 cells;
  65 of the 434 sums hold one). The sum is given where the five ratings
  are: 434 visits, 3 to 25, median 14.

  What the extraction does not hold (decision D159). After these questions
  the form has a behaviour section: non-suicidal self-injury, interrupted
  and aborted attempts with their counts, preparatory acts, and the
  observed and potential lethality of the most recent, the most lethal and
  the first attempt, with their dates. The application stores it in
  psy_suicide and psy_suicide_semestriel (rad_cssrs15, 16, 18 and 20,
  cssrs17 and 19, the lethality items 22c to 27c); the clean models of the
  export read it, face_bp_5_suicide.sql does not select it and the V4.34
  dictionary does not list it (request R126). The seed of the form has no
  rows for rad_cssrs13 and 14, the parents of the dates: a dangling
  parent. The deterrents item (radhtml_cssrs11) carries the text of the
  controllability question above its options (application defect A59): the
  rating is delivered as rated.

version:
  name: visit_form
  column: visit
  codes:
    V0: inclusion
    V1_an: follow_up
    V2_ans: follow_up
    V3_ans: follow_up
    V4_ans: follow_up
    V5_ans: follow_up
    V6_ans: follow_up
    V7_ans: follow_up
    V8_ans: follow_up
    V9_ans: follow_up
    V10_ans: follow_up
    V6_mois: follow_up
    V18_mois: follow_up
    V30_mois: follow_up
    V42_mois: follow_up
    V54_mois: follow_up
    V66_mois: follow_up
    V78_mois: follow_up
    V90_mois: follow_up
    V102_mois: follow_up
    V114_mois: follow_up
    V126_mois: follow_up


defaults: {type: item, range: [0, 1], versions: [inclusion]}

variables:
  cssrs01_past_week: {column: css0101, codes: {Oui: 1, Non: 0}, label: "Wish to be dead - in the past week"}
  cssrs02_past_week: {column: css0102, codes: {Oui: 1, Non: 0}, label: "Non-specific active suicidal thoughts - in the past week"}
  cssrs03_past_week: {column: css0103, codes: {Oui: 1, Non: 0}, label: "Active suicidal ideation with a method, without intent - in the past week", asked_if: cssrs02_past_week}
  cssrs04_past_week: {column: css0104, codes: {Oui: 1, Non: 0}, label: "Active suicidal ideation with some intent to act, without a plan - in the past week", asked_if: cssrs02_past_week}
  cssrs05_past_week: {column: css0105, codes: {Oui: 1, Non: 0}, label: "Active suicidal ideation with a plan and intent - in the past week", asked_if: cssrs02_past_week}
  cssrs_most_severe_past_week: {column: css0106, range: [1, 5], label: "Most severe ideation, as rated (1 to 5) - in the past week"}
  cssrs_frequency_past_week: {column: css0108, range: [1, 5], label: "Intensity: frequency (1 less than once a week to 5 many times a day) - in the past week"}
  cssrs_duration_past_week: {column: css0109, range: [1, 5], label: "Intensity: duration (1 a few seconds or minutes to 5 more than 8 hours) - in the past week"}
  cssrs_control_past_week: {column: css0110, range: [0, 5], label: "Intensity: controllability (1 easily to 5 unable, 0 does not try) - in the past week"}
  cssrs_deterrents_past_week: {column: css0111, range: [0, 5], label: "Intensity: deterrents (1 definitely stopped to 5 did not stop at all, 0 does not apply) - in the past week"}
  cssrs_reasons_past_week: {column: css0112, range: [0, 5], label: "Intensity: reasons for ideation (1 only to get attention to 5 only to end the pain, 0 does not apply) - in the past week"}

scores:
  cssrs_intensity_past_week:
    label: "C-SSRS intensity of ideation: sum of the five ratings - in the past week"
    sum: [cssrs_frequency_past_week, cssrs_duration_past_week, cssrs_control_past_week, cssrs_deterrents_past_week, cssrs_reasons_past_week]
