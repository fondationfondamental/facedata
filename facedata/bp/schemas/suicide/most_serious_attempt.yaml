instrument: most_serious_attempt
title: The most serious suicide attempt (method and lethality)
tab: SUICIDE
section: Columbia TS la plus grave
status: reviewed
notes: >
  The most serious non-violent suicide attempt of the whole life, as asked
  at the inclusion visit after a yes to serious attempts: its method (drugs
  with or without a sedative effect, or cutting), the kind of drug, its
  medical consequences on a scale that has its own wording for each method,
  and whether an event triggered it, with which one. Delivered as
  categories; "triggered" as 1 (yes) and 0 (no).

  One schema per form (decision D125 in PROGRESS.md, as D86 did for the
  attempt counts). The follow-up form asks the same section about the most
  serious attempt since the last visit: those answers are
  most_serious_attempt_since_visit. visit_form says which form a visit
  used; it is read from the visit label.

  432 methods on 448 inclusion visits, from 2009 to January 2022. The
  section left the forms during 2021, at one centre early in 2022: the last
  inclusion answer of each centre is between December 2020 and November
  2021, except one in 2019 and one in January 2022. 116 of the 117
  inclusions from 2022 that report a serious attempt (serious_attempts)
  have no detail. Until 2021 the method is given on 79% to 97% of the
  inclusions with a serious attempt in each period, less often in the
  later periods (97% to 2012, 79% in 2019-2021). Four centres never give
  it. Drugs with a sedative effect are 79% to 85% of the methods in each
  period. 16 inclusion visits of 2012 to 2021 with a serious attempt
  answer "triggered" with no method.

  The codes are short names; the lethalities follow the order of the scale.
  Every list holds the whole list of the form, also answers that no visit
  holds (death after sedative drugs, the two most severe levels of
  cutting, recreational drugs, anticholinergics and appetite suppressants
  among the drugs without a sedative effect). A drug type "Inconnu" is a missing code (23 sedative, 5 non-sedative). Death is
  given after other drugs or substances on 2 visits (2013, 2018): the
  patient was seen at that inclusion visit, so it cannot describe the
  patient's own attempt. It is delivered as written.

  Lists that the form hid (decision D125, field shown_if). The form shows a
  drug type and a lethality only for their own method, and the trigger only
  after a yes to "triggered". The forms of 2009-2010 saved the first option
  of the lists that start with an empty choice, the hidden ones too
  (antipsychotic, other prescription, fully conscious, scratches,
  "Conjugal"). A filled cell that the form did not show is delivered as
  missing with the flag not_shown; the flag log keeps the text. 80 cells on
  24 visits. 76 are on 20 visits of 2009 and 2010 at four centres, nearly
  all first options: 14 with no method, 6 with another method. The other 4
  are on 4 visits of 2013 to 2020 and are not first options: a drug type or
  a lethality with no method (2), the drug type of another method (1), a
  trigger without a yes (1).

