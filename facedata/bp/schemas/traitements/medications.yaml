instrument: medications
title: Psychotropic treatments, one row per treatment
tab: TRAITEMENTS
section: TRAITEMENTS PSYCHOTROPES
status: reviewed
level: list
notes: >
  The medications of each patient with their dates: 22,758 medications of
  4,779 patients. The extraction writes them as lists in one cell (the name
  of each medication in one column, its start date in another, and so on),
  and every row of a patient holds the same lists: the patient's whole
  history, not the treatment of the visit. The lists are opened into one
  row per patient and medication, delivered in the table treatments
  (decision D56 in PROGRESS.md).

  Lists. 1,719 of the 6,498 patients have no list. The application has no
  answer for "no treatment": a patient without a list is unknown, not
  untreated. A list is held by 83% to 85% of the patients included until
  2015 and by 60% to 63% of those included from 2022. The classes of the
  lifetime form (drug_classes_lifetime.yaml) were typed separately: of the
  patients who answer yes to a class there and have a list, the list holds a
  medication of the class for 40% (first-generation antipsychotics) to 80%
  (anticonvulsants), so neither source is complete.

  Item. The item number is the place of the medication in the exported
  list. Until the export orders the lists (R76 of EXPORT_REQUESTS.md), it
  changes between extractions: join the items of two extractions on their
  content (patient, name and dates), never on item.

  Name, molecule and group. The name is delivered as written: a brand, a
  brand with its dose and form, or a generic with the name of its maker. It
  is looked up in medications.csv, which gives the molecule (one word, with
  underscores for a combination), its ATC code and one of ten groups:
  lithium, anticonvulsant, antipsychotic_2g, antipsychotic_1g,
  antidepressant, benzodiazepine, other_anxiolytic_hypnotic, stimulant,
  other_nervous_system and non_psychotropic (292 names, 156 molecules; the
  ATC code of NOCTRAN has 5 characters, two rows, the homeopathic lithium and
  the trace-element lithium, have none, and the review found eight misspelled
  names: the table is shared by the cohorts, a correction goes through the
  lead). The table was checked against
  the application's own drug list and the ATC codes of the SZ extraction
  (D102); gabapentin and pregabalin are anticonvulsants, as in the
  application (117 medications). A name that is not in the table (173
  medications, 0.8%) keeps what was written, has no molecule and no group,
  and gets unknown_code.

  Dates. The start date is filled for 22,608 medications, most often with
  the day set to 15 (the month is known, not the day). One centre wrote
  1950-01-01 for an unknown start and 1950-01-02 for an unknown end: they
  are missing with the reason unknown (20 starts, 13 ends). The range of
  the start begins in 1951, so two more starts of 1950 are out_of_range;
  three other ends of 1950 are kept. 128 starts are 0000-00-00, the empty
  date of the form (127 of these treatments are running, one has an end
  date): they are missing with the reason not_recorded (they were empty
  with no flag), so the start has 148 missing codes with the 20 of 1950;
  the application shows "Aucune date indiquée" for the 127 and "Terminé
  le" with the end date for the one, and no value changes. The box
  "Traitement en cours" of the
  form hides the end date and writes it 0000-00-15 on today's add page and
  0000-00-00 on the correction page; seven of the sixteen centres have
  0000-00-15, mostly for treatments started from 2016, and the nine others
  only 0000-00-00. The application shows both as running "until today"
  (D96): both are missing with the reason running (11,855 medications:
  8,738 and 3,117). The end date is filled for 10,890 medications. An end
  date before the start (148 medications, 147 of them with no date of 1950)
  is kept and gets check_failed (end_before_start). The add form alerts on
  an end before the start only if the end's year, month and day are each at
  or before the start's, so it catches 19 of the 147; the correction page
  has no check (A58).

  Dose. The form stores no strength since it took its names from the public
  drug list in 2015 (A38 of EXPORT_REQUESTS.md; of the two columns it
  writes empty, only the identifier of the strength, ID_medicament_posologie,
  is an integer and holds 0, while posologie is a varchar(255)): a
  strength is stored for 6,974 medications, 4 of the 11,593 started from
  2016. The strength is in
  the name of the product, and the package reads it there with the rule of
  R54: exactly one amount of a mass, not per volume, not a percentage, not
  in units (UI); a number right after another number and a space is not
  read. Of the 15,784 medications with no stored strength, 14,355 get one
  from the name; 1,284 names hold no amount, 29 several, and 116 one per
  volume, in % or in UI. daily_dose is a score in mg (D124): the stored
  strength where one is stored (its leading number, unit MG; a strength in
  tablets, per volume or in % gives no dose), else the strength in the
  name, times units_per_day. strength_from_name says 1 (name) or 0
  (stored). 19,349 medications have a daily dose, 12,948 of them from the
  name. By start date: 6,283 of the 7,900 started until 2013, 5,281 of the
  6,054 started from 2014 to 2017 and 7,664 of the 8,654 started from 2018;
  2,185 of the 2,225 patients with a medication started from 2018 have a
  dose. The review of the tab compared the doses with the usual maximum of
  each molecule: 46 of 15,562 doses of 24 molecules are above it, one by
  more than twice, so no systematic error shows (the usual maxima are not in
  the package).

  Stored dose. The extracted dose (the export's strength times units) is
  kept as daily_dose_stored, not delivered, and compared: 2 score_mismatch
  (the export reads the units "1/2" as 1 and doubles the dose, R75), 17
  score_not_recomputed (8 whose units the package cannot read, 9 whose
  strength is in tablets; the stored value is in the flag). 3 doses read
  from the name are above 5,000 mg and out_of_range (300 to 500 mg at 50
  to 100 units a day), and strength_from_name is missing there.

  Units a day. The add form offers 0.25 to 100, ">100" and "Si besoin"
  (as needed); the correction page takes free text. ">100" is read as 100
  and censored (7); "Si besoin" and "sb" are a missing code (893); "1/2"
  is read as 0.5 (9); a decimal comma is repaired (22, format_repaired);
  29 texts with words (ranges, counts with their form) are unparsed. A
  long-acting injection has no units a day: the form records ampoules
  every n weeks instead (nb_ampoule, nb_semaine), which the BP export
  computes in its model but does not select, with the date of entry
  (date_saisie): 109 medications of 90 patients have no dose (R123).
  date_saisie is to be exported only once A39 is fixed (a correction sets
  it to a fixed timestamp), which is why R76 orders the lists by start date
  and row identifier, never by date_saisie.

  At a visit. The columns of medications_at_visit say, for each visit,
  whether the patient was on a group or a molecule that day: a medication
  that started on or before the visit date and has no end date, or an end
  date on or after the visit (see their notes).

names:
  column: med_psy_cmtrt
  clean: medication_name
  table: medications.csv
  gives: [molecule, atc, treatment_group]

variables:
  medication: {column: med_psy_cmtrt, type: text, label: Medication as written}
  molecule: {column: molecule, type: text, label: Molecule}
  atc: {column: atc, type: text, label: ATC code of the molecule}
  treatment_group:
    column: treatment_group
    label: Group of the medication
    type: category
    codes:
      lithium: lithium
      anticonvulsant: anticonvulsant
      antipsychotic_2g: antipsychotic_2g
      antipsychotic_1g: antipsychotic_1g
      antidepressant: antidepressant
      benzodiazepine: benzodiazepine
      other_anxiolytic_hypnotic: other_anxiolytic_hypnotic
      stimulant: stimulant
      other_nervous_system: other_nervous_system
      non_psychotropic: non_psychotropic
  start_date: {column: med_psy_cmstdtc, type: date, range: [1951-01-01, today+60], missing: {"1950-01-01": unknown, "0000-00-00": not_recorded}, label: Start of the treatment}
  end_date:
    column: med_psy_cmendtc
    type: date
    range: [1950-01-01, today+60]
    missing: {"0000-00-15": running, "0000-00-00": running, "1950-01-02": unknown}
    label: End of the treatment
  strength: {column: med_psy_cmdose, type: text, label: "Strength and form, as stored (none for the medications typed since the public drug list, 2015)"}
  dose_unit: {column: med_psy_cmdosu, type: text, label: "Unit of the stored strength, read by the export from it"}
  dose_text: {column: med_psy_cmdostxt, type: text, label: "Strength of a liquid form, as written"}
  units_per_day:
    column: med_psy_cmdosfrq
    type: number
    range: [0, 100]
    winsor: false
    codes: {"1/2": 0.5}
    missing: {"si besoin": as_needed, sb: as_needed}
    label: Number of units a day
  daily_dose_stored: {column: med_psy_cmdostot, type: number, range: [0, 5000], winsor: false, keep: false, label: "Total daily dose as extracted (the export's strength x units, in the unit of the strength)"}

scores:
  daily_dose:
    custom: daily_dose
    range: [0, 5000]
    compare: daily_dose_stored
    label: "Total daily dose, mg: the strength (stored, else read from the name of the product) times the units a day"
  strength_from_name:
    custom: strength_from_name
    range: [0, 1]
    label: "The daily dose rests on the strength read from the name of the product (1) or on the stored strength (0)"

checks:
  end_date: end_before_start

at_visit:
  title: Psychotropic treatments on the day of the visit
  notes: >
    For each visit, whether the patient was on a group of medications, or on
    one of seven molecules, that day: 1 or 0. Computed from the rows of the
    table treatments (medications.yaml), with the rule of the application's
    page "Psychotropes présents aux visites" (D124): 1 when a medication of
    the group started on or before the visit date and has no end date, or
    an end date on or after the visit. Missing for the patients who have no
    medication list at all (1,719 of 6,498 patients: unknown, not
    untreated), for a visit without a date (5 visits of patients with a
    list), and where a medication of the group has no start date (150
    medications) and no end before the visit, unless another one gives 1.

    A medication without an end date is taken as still running: an end that
    was never typed keeps the patient "on" the medication at every later
    visit. At the follow-up visits the yes of on_antidepressant,
    on_lithium and on_antipsychotic_2g rests only on medications with no end
    date for 78%, 88% and 79% of the cells (2,305 of 2,954, 3,827 of 4,368
    and 3,138 of 3,984 cells supported by a medication started on or before
    the visit). For a third of the patients with a list and a follow-up visit
    (1,180 of 3,543), no medication starts or ends more than 30 days after
    the inclusion: at their follow-up visits the columns mostly repeat the
    inclusion. A medication that ends before it starts (148) counts at no
    visit. The 13 ends written 1950-01-02 had ended (the box "Traitement en
    cours" was not ticked), but with no start either they give a missing
    value, not a 1. A name that is not in medications.csv belongs to no
    group.

    on_valproate counts valproate and valpromide (Dépamide, which the body
    turns into valproic acid; D124): 617 visit cells of 226 patients went
    from 0 to 1, and 9 from 0 to missing (a valpromide without a start
    date).
  start: start_date
  end: end_date
  columns:
    on_lithium: {where: {treatment_group: lithium}, label: On lithium at the visit}
    on_anticonvulsant: {where: {treatment_group: anticonvulsant}, label: On an anticonvulsant mood stabiliser at the visit}
    on_antipsychotic_2g: {where: {treatment_group: antipsychotic_2g}, label: On a second-generation antipsychotic at the visit}
    on_antipsychotic_1g: {where: {treatment_group: antipsychotic_1g}, label: On a first-generation antipsychotic at the visit}
    on_antidepressant: {where: {treatment_group: antidepressant}, label: On an antidepressant at the visit}
    on_benzodiazepine: {where: {treatment_group: benzodiazepine}, label: On a benzodiazepine at the visit}
    on_other_anxiolytic_hypnotic: {where: {treatment_group: other_anxiolytic_hypnotic}, label: On another anxiolytic or hypnotic at the visit}
    on_stimulant: {where: {treatment_group: stimulant}, label: On a stimulant at the visit}
    on_other_nervous_system: {where: {treatment_group: other_nervous_system}, label: On another medication of the nervous system at the visit}
    on_valproate: {where: {molecule: [valproate, valpromide]}, label: On valproate or valpromide at the visit}
    on_lamotrigine: {where: {molecule: lamotrigine}, label: On lamotrigine at the visit}
    on_carbamazepine: {where: {molecule: carbamazepine}, label: On carbamazepine at the visit}
    on_quetiapine: {where: {molecule: quetiapine}, label: On quetiapine at the visit}
    on_aripiprazole: {where: {molecule: aripiprazole}, label: On aripiprazole at the visit}
    on_olanzapine: {where: {molecule: olanzapine}, label: On olanzapine at the visit}
    on_risperidone: {where: {molecule: risperidone}, label: On risperidone at the visit}
