instrument: non_drug_fu
title: Non-drug treatments since the last visit (follow-up visits)
tab: TRAITEMENTS
section: Traitement non pharmacologique SEMESTRIEL
status: reviewed
notes: >
  Non-drug treatments since the last visit, asked at the follow-up visits
  (six-monthly and yearly), never at the inclusion (0 answers at the
  inclusion and at the screening): one yes/no question, then for each of
  six kinds a box, the number of sessions and the dates.
  9,358 of the 11,686 follow-up visits answer the first question, and a
  third of the answers are yes (3,148 of 9,304; 54 "Ne sais pas"). Yes/no
  answers are delivered as 1 and 0; "Ne sais pas" is a missing code.

  The form also asks the number of sessions of the cognitive behavioural
  therapy and the start date of the psychoeducation groups: the clean model
  ebipolar_trt_sem.sql reads both (lines 37 and 41) and face_bp_12 does not
  select them (R125, which also asks for the SZ columns). The lifetime form
  of the patient has columns of its own, read by non_drug_lifetime.yaml.

  Asked only after a yes (asked_if). The six boxes are shown only after a
  yes to the first question, and a number of sessions only after a yes to
  its box; they are empty otherwise in the extraction and are read as 0. The
  dates stay missing: they are details of a treatment that did not take
  place.

  Boxes of one list (box_list, D124; kept by the project lead when the tab
  was reviewed again, R13). After a yes, some raters tick only the kinds
  received and leave the other boxes empty, more and more often: among the
  yes visits where a box is ticked, one box or more is left empty on 11% in
  2011-2012 and on 35% to 42% in 2022-2025. An empty box beside a ticked box
  of the six is read as no, and its number of sessions as 0: 3,508 boxes on
  880 visits that said yes, and 7 boxes on two visits that tick a box after
  a "no" or no answer. The boxes are Oui/Non radio buttons, so an empty one
  is not certain to be a no: 245 of the 880 visits hold an explicit "Non" on
  another kind, and the 393 empty boxes of those visits (11% of the 3,508
  zeros, 33 to 101 per kind) may be unanswered; on the 635 other visits the
  rater wrote only the "Oui" and the blanks fit a rater who ticked what
  applied. Under a yes the boxes are blank on 356 (another treatment) to 772
  visits (TMS) of the 3,148. Where all six boxes are empty after a yes (34
  visits), they stay missing. 68 visits say yes and then no to all six
  kinds; they are delivered as recorded.

  After a no. The six boxes are empty on all but one of the 6,156 visits
  that answer no, the numbers of sessions on all but 4 cells (1
  psychoeducation, 3 other treatment), and the dates hold only the
  application's 0000-00-00 (read as empty) or 1000-01-01 (below), but for 13
  dates on 8 visits (10 of them ECT dates of 2009-2010). The first question
  is empty on 2,328 visits, with every box empty on all but one of them.

  IPSRT format. A closed list of the form (En groupe, En individuel, several
  allowed), delivered as two yes/no boxes, ipsrt_group_fu and
  ipsrt_individual_fu, 0 after a no to IPSRT (D124). 7 visits give it, all
  in individual sessions.

  Numbers of sessions. They count the sessions since the previous visit, a
  median of 11 months before for the counts above 0: divide by that time
  before comparing visits. Range 0 to 365 (D124); no value is cut, the
  largest is 100. The form checks one or two digits in the browser. 66 cells
  hold words, a rate or other text and end unparsed (57 of them for another
  treatment); they are of visits from 2011 to October 2021, and none of the
  397 numbers typed since 2022 fails the check. One count typed as a minimum
  is censored on the right. They are not winsorised.

  Dates. The application writes 0000-00-00 in a date that was not typed
  (read as empty, 98,722 cells on 9,268 visits) and, since its version of
  2024-07-25, which each centre got at its own date, 1000-01-01
  (date_placeholder, 4,386 cells on 411 visits, 387 of them in 2025-2026),
  also next to a no (80 to 153 placeholder start dates per kind stand next
  to a kind box that is no: CBT and other 80, psychoeducation 98 for the end
  date, TMS 149, ECT 151, IPSRT 153). A date typed with the year 0000 is
  out_of_range (1).
  After a yes, the end date is missing more often than the start date (CBT
  853 against 473 of 1,130 visits, another treatment 1,087 against 571 of
  1,457): the treatment may have been running. 13 visits have an end before
  the start.

  Delivered as recorded: 21 dates on 12 visits stand next to a box that is
  no (16 of them ECT dates on 8 visits of 2009-2010); 4 numbers of sessions
  stand next to a box that is no and 5 next to a missing box; one visit says
  no to the first question and ticks psychoeducation, and one leaves it
  empty and ticks another treatment.

  Completeness. The first question is answered on 88% to 90% of the
  follow-up visits until 2015, 80% to 83% in 2016-2021 and 69% to 70% from
  2022. In one centre it falls to 17% in 2022-2023 and 32% from 2024, with
  the rest of the follow-up care form (O40). Among the answers, the share of
  yes is 36% until 2012 and 29% in 2013-2015, then rises to 41% from 2024;
  it goes from 20% to 49% between the centres with 100 visits or more.

  Kinds. CBT, psychoeducation groups and IPSRT are specific therapies, not
  aggregates of every psychotherapy: a patient in another therapy belongs
  to "another". The kind of "another treatment" is free text, delivered as
  written: the name of a method of therapy, most often. Of the 1,335
  follow-up texts, key words find kinds that DR asks as boxes of its own:
  supportive or unspecified therapy about 28%, psychoanalytic or
  psychodynamic 7%, mindfulness 5% to 7%, family or couple therapy 2% (shares
  only; the texts are not printed).

