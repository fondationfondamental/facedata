  psychoeducation_end_date_fu: {column: prendtc_psychoed_sem, type: date, range: [1950-01-01, 2026-12-31], label: "Psychoeducation group since the last visit: end"}

  ipsrt_fu: {column: proccur_ipsrt_sem, type: item, range: [0, 1], codes: {Oui: 1, Non: 0}, asked_if: non_drug_treatment_fu, label: "Interpersonal and social rhythm therapy since the last visit"}
  ipsrt_format_fu: {column: prdecod_iprst_sem, type: text, label: "IPSRT since the last visit: individual or group, as written"}
