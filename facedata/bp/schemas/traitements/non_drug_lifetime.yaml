instrument: non_drug_lifetime
title: Non-drug treatments over the life
tab: TRAITEMENTS
section: Traitement non pharmacologique LIFETIME
status: reviewed
level: patient
notes: >
  Non-drug treatments over the life, in the second part of the patient's
  lifetime treatment form (drug_classes_lifetime.yaml reads the first): one
  yes/no question, then for each of six kinds (electroconvulsive therapy,
  TMS, cognitive behavioural therapy, psychoeducation groups, IPSRT, other)
  a box, the number of sessions and the start and end dates. Yes/no answers
  are delivered as 1 and 0; "Ne sais pas" is a missing code.

  The application itself words the first question "depuis la dernière
  visite", as on the follow-up form, and the dictionary copies it (D124).
  The answers are about the life: 301 of the 438 patients with a start date
  have one more than a year before their inclusion.

  A form of the patient, not of a visit: it is opened from the medication
  menu, can be saved again later, and its date is not exported (asked of the
  export). 1,271 patients answer the first question (570 yes, 680 no, 21 "Ne
  sais pas"), a fifth of the cohort, and rarely those included before 2013
  (58 of 1,016).

  One value per patient. The extraction repeats these columns on every row
  of the patient. Where a patient has two records of the form, the export
  keeps one of them with no rule (R18 asks for the lowest id) and copies it
  onto every row: that is why the rows never differ.

  Asked only after a yes (asked_if). The six boxes are shown only after a
  yes to the first question, and a number of sessions only after a yes to
  its box; they are empty otherwise in the extraction and are read as 0. The
  dates stay missing: they are details of a treatment that did not take
  place.

  Boxes of one list (box_list, D124; kept by the project lead when the tab
  was reviewed again, R13). After a yes, some raters tick only the kinds
  received and leave the other boxes empty. An empty box beside a ticked box
  of the six is read as no, and its number of sessions as 0: 308 boxes of 96
  patients (95 answered yes to the first question, one left it empty). The
  boxes are Oui/Non radio buttons, so an empty one is not certain to be a
  no: 47 of the 95 patients who answered yes hold an explicit "Non" on
  another kind, and the 71 empty boxes of those patients (23% of the 303
  zeros after a yes) may be unanswered. Where all six boxes are empty after
  a yes (4 patients), they stay missing. 12 patients answer yes and then no
  to all six kinds; they are delivered as recorded.

  IPSRT format. A closed list of the form (En groupe, En individuel, several
  allowed), delivered as two yes/no boxes, ipsrt_group and ipsrt_individual,
  0 after a no to IPSRT (D124). 4 of the 7 patients treated with IPSRT give
  it: all 4 in individual sessions, one also in a group.

  Numbers of sessions are typed freely: the field has no check. 16 cells
  hold a number with words and end unparsed (CBT 2, another treatment 14).
  ">N" and "+ N" are read as N, censored on the right (3 cells). They are
  not winsorised.

  Dates. The application writes 0000-00-00 in a date that was not typed
  (read as empty, 26,754 cells of 2,295 patients) and, since its version of
  2024-07-25, which each centre got at its own date, 1000-01-01
  (date_placeholder, 1,327 cells of 122 patients, 99 of them included in
  2025-2026), also next to a no or an empty box. After a yes, the end date
  is missing more often than the start date (another treatment 227 against
  97 of 353, CBT 96 against 31 of 193): the treatment may have been running.
  4 patients have an end before the start, and 46 have a date after their
  inclusion (69 dates); they are delivered as recorded.

  Completeness. The first question is answered for 6% of the patients
  included until 2012 and 18% to 26% after. Among the 13 centres with 50
  patients or more, four answer it for 41% to 69% of their patients and six
  for fewer than 7%. The share of yes is 23% until 2012, 32% in 2013-2015,
  45% to 52% in 2016-2023 and 59% from 2024; it goes from 23% to 79% between
  the centres with 50 answers or more.

  Kinds. CBT, psychoeducation groups and IPSRT are specific therapies, not
  aggregates of every psychotherapy: a patient in another therapy belongs
  to "another". The kind of "another treatment" is free text, delivered as
  written: the name of a method of therapy, most often (see non_drug_fu.yaml
  for the kinds the follow-up texts name).

