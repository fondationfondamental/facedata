  ect_sessions: {column: prdur_sismo_lt, type: number, range: [0, 1500], winsor: false, asked_if: ever_ect, label: "Electroconvulsive therapy: number of sessions"}
  ect_start_date: {column: prstdtc_sismo_lt, type: date, range: [1950-01-01, today], label: "Electroconvulsive therapy: start"}
  ect_end_date: {column: prendtc_sismo_lt, type: date, range: [1950-01-01, today], label: "Electroconvulsive therapy: end"}

  ever_tms: {column: proccur_tms_lt, type: item, range: [0, 1], codes: {Oui: 1, Non: 0}, asked_if: ever_non_drug_treatment, box_list: non_drug_kinds, label: "Transcranial magnetic stimulation: ever"}
