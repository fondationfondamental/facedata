instrument: drug_classes_lifetime
title: Classes of medication taken over the life
tab: TRAITEMENTS
section: MEDICAMENT LIFETIME
status: draft
level: patient
notes: >
  For each of six classes of medication (antidepressants, first- and second-
  generation antipsychotics, benzodiazepines, hypnotics and anxiolytics,
  lithium, anticonvulsant mood stabilisers): whether the patient has ever
  taken one, the date of the first start and the cumulated months of
  exposure. Asked once, about the whole life, of 2,636 patients. Yes/no
  answers are delivered as 1 and 0; "Ne sais pas" is a missing code.

  One value per patient: the extraction repeats these columns on every row
  of the patient, and they never differ.

  Months. A list that stops at 240: ">240" is read as 240 with a mark in the
  censoring column (this value or more). The months are 0 where the patient
  has never taken the class (asked_if). They are not winsorised.

  Dates. Many are a first of July or a 15th of June: the year was known, not
  the day. 1000-01-01 is the form's placeholder (date_placeholder).

  These are the clinician's summary of the whole life. The table treatments
  (medications.yaml) lists the medications one by one with their dates; the
  two were typed separately and need not agree.

variables:
  ever_antidepressant: {column: cmoccur_antid, type: item, range: [0, 1], codes: {Oui: 1, Non: 0}, label: "Has ever taken an antidepressant"}
  antidepressant_first_date: {column: cmstdtc_antid, type: date, range: [1950-01-01, 2026-12-31], label: "First start of an antidepressant"}
  antidepressant_months: {column: cmdur_antid, type: number, unit: months, range: [0, 240], winsor: false, asked_if: ever_antidepressant, label: "Cumulated months on an antidepressant"}

  ever_antipsychotic_1g: {column: cmoccur_neuro, type: item, range: [0, 1], codes: {Oui: 1, Non: 0}, label: "Has ever taken a first-generation antipsychotic"}
  antipsychotic_1g_first_date: {column: cmstdtc_neuro, type: date, range: [1950-01-01, 2026-12-31], label: "First start of a first-generation antipsychotic"}
  antipsychotic_1g_months: {column: cmdur_neuro, type: number, unit: months, range: [0, 240], winsor: false, asked_if: ever_antipsychotic_1g, label: "Cumulated months on a first-generation antipsychotic"}

  ever_antipsychotic_2g: {column: cmoccur_antip, type: item, range: [0, 1], codes: {Oui: 1, Non: 0}, label: "Has ever taken a second-generation antipsychotic"}
  antipsychotic_2g_first_date: {column: cmstdtc_antip, type: date, range: [1950-01-01, 2026-12-31], label: "First start of a second-generation antipsychotic"}
  antipsychotic_2g_months: {column: cmdur_antip, type: number, unit: months, range: [0, 240], winsor: false, asked_if: ever_antipsychotic_2g, label: "Cumulated months on a second-generation antipsychotic"}

  ever_anxiolytic_hypnotic: {column: cmoccur_benzo, type: item, range: [0, 1], codes: {Oui: 1, Non: 0}, label: "Has ever taken a benzodiazepine, hypnotic or anxiolytic"}
  anxiolytic_hypnotic_first_date: {column: cmstdtc_benzo, type: date, range: [1950-01-01, 2026-12-31], label: "First start of a benzodiazepine, hypnotic or anxiolytic"}
  anxiolytic_hypnotic_months: {column: cmdur_benzo, type: number, unit: months, range: [0, 240], winsor: false, asked_if: ever_anxiolytic_hypnotic, label: "Cumulated months on a benzodiazepine, hypnotic or anxiolytic"}

  ever_lithium: {column: cmoccur_lithi, type: item, range: [0, 1], codes: {Oui: 1, Non: 0}, label: "Has ever taken lithium"}
  lithium_first_date: {column: cmstdtc_lithi, type: date, range: [1950-01-01, 2026-12-31], label: "First start of lithium"}
  lithium_months: {column: cmdur_lithi, type: number, unit: months, range: [0, 240], winsor: false, asked_if: ever_lithium, label: "Cumulated months on lithium"}

  ever_anticonvulsant: {column: cmoccur_thymo, type: item, range: [0, 1], codes: {Oui: 1, Non: 0}, label: "Has ever taken an anticonvulsant mood stabiliser"}
  anticonvulsant_first_date: {column: cmstdtc_thymo, type: date, range: [1950-01-01, 2026-12-31], label: "First start of an anticonvulsant mood stabiliser"}
  anticonvulsant_months: {column: cmdur_thymo, type: number, unit: months, range: [0, 240], winsor: false, asked_if: ever_anticonvulsant, label: "Cumulated months on an anticonvulsant mood stabiliser"}
