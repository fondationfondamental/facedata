  lithium_months: {column: cmdur_lithi, type: number, unit: months, range: [0, 240], winsor: false, asked_if: ever_lithium, label: "Cumulated months on lithium"}

  ever_anticonvulsant: {column: cmoccur_thymo, type: item, range: [0, 1], codes: {Oui: 1, Non: 0}, label: "Has ever taken an anticonvulsant mood stabiliser"}
  anticonvulsant_first_date: {column: cmstdtc_thymo, type: date, range: [1950-01-01, today], label: "First start of an anticonvulsant mood stabiliser"}
  anticonvulsant_months: {column: cmdur_thymo, type: number, unit: months, range: [0, 240], winsor: false, asked_if: ever_anticonvulsant, label: "Cumulated months on an anticonvulsant mood stabiliser"}
