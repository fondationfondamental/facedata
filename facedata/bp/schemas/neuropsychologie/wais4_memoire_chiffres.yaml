  wais4_ds_backward_8a: {column: mcoi0801_w, label: "Backward - item 8, trial 1", range: [0, 1]}
  wais4_ds_backward_8b: {column: mcoi0802_w, label: "Backward - item 8, trial 2", range: [0, 1]}
  wais4_ds_backward_item1: {column: mcoi_1_w, label: "Backward - item 1 score", range: [0, 2], missing: {Na: not_applicable}}
  wais4_ds_backward_item2: {column: mcoi_2_w, label: "Backward - item 2 score", range: [0, 2], missing: {Na: not_applicable}}
