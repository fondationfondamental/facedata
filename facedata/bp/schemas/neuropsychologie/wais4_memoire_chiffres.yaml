  wais4_ds_forward_3b: {column: mcod0302_w, label: "Forward - item 3, trial 2", range: [0, 1]}
  wais4_ds_forward_4a: {column: mcod0401_w, label: "Forward - item 4, trial 1", range: [0, 1]}
  wais4_ds_forward_4b: {column: mcod0402_w, label: "Forward - item 4, trial 2", range: [0, 1]}
