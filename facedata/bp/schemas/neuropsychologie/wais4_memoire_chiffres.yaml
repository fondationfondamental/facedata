scores:
  # Consistency check only: the stored total must equal the sum of its parts.
  wais4_ds_total_check:
    sum: [wais4_ds_forward_raw, wais4_ds_backward_raw, wais4_ds_sequencing_raw]
    compare: wais4_ds_total
    keep: false
  # Consistency check only: the stored raw score must equal the sum of its item scores.
  wais4_ds_forward_check:
    sum: [wais4_ds_forward_item1, wais4_ds_forward_item2, wais4_ds_forward_item3, wais4_ds_forward_item4, wais4_ds_forward_item5, wais4_ds_forward_item6, wais4_ds_forward_item7, wais4_ds_forward_item8]
    min_items: 1
    compare: wais4_ds_forward_raw
    keep: false
  # Consistency check only: the stored raw score must equal the sum of its item scores.
  wais4_ds_backward_check:
    sum: [wais4_ds_backward_item1, wais4_ds_backward_item2, wais4_ds_backward_item3, wais4_ds_backward_item4, wais4_ds_backward_item5, wais4_ds_backward_item6, wais4_ds_backward_item7, wais4_ds_backward_item8]
    min_items: 1
    compare: wais4_ds_backward_raw
    keep: false
  # Consistency check only: the stored raw score must equal the sum of its item scores.
  wais4_ds_sequencing_check:
    sum: [wais4_ds_sequencing_item1, wais4_ds_sequencing_item2, wais4_ds_sequencing_item3, wais4_ds_sequencing_item4, wais4_ds_sequencing_item5, wais4_ds_sequencing_item6, wais4_ds_sequencing_item7, wais4_ds_sequencing_item8]
    min_items: 1
    compare: wais4_ds_sequencing_raw
    keep: false
  wais4_ds_scaled:
    label: Age-scaled score (mean 10 and SD 3), read in the table of the manual
    lookup: wais4_digit_span
    from: wais4_ds_total
    age: wais4_ds_age_entered
    range: [1, 19]
    compare: wais4_ds_scaled_stored
  wais4_ds_z:
    label: Scaled score as a z-score, (scaled score - 10) / 3
    sum: [wais4_ds_scaled]
    scale: [0.3333333, -3.3333333]
    range: [-3, 3]
    compare: wais4_ds_z_stored
    compare_tolerance: 0.006
  wais4_ds_forward_span_z:
    label: Longest forward span as a z-score, computed with the mean and SD of the age group
    regression: wais4_ds_forward_span_z
    from: wais4_ds_forward_span
    age: wais4_ds_age_entered
    range: [-5, 5]
    compare: wais4_ds_forward_span_z_stored
    compare_tolerance: 0.011
  wais4_ds_backward_span_z:
    label: Longest backward span as a z-score, computed with the mean and SD of the age group
    regression: wais4_ds_backward_span_z
    from: wais4_ds_backward_span
    age: wais4_ds_age_entered
    range: [-5, 5]
    compare: wais4_ds_backward_span_z_stored
    compare_tolerance: 0.011
  wais4_ds_sequencing_span_z:
    label: Longest sequencing span as a z-score, computed with the mean and SD of the age group
    regression: wais4_ds_sequencing_span_z
    from: wais4_ds_sequencing_span
    age: wais4_ds_age_entered
    range: [-5, 5]
    compare: wais4_ds_sequencing_span_z_stored
    compare_tolerance: 0.011
