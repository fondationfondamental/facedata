  wais4_ds_forward_6b: {column: mcod0602_w, label: "Forward - item 6, trial 2", range: [0, 1]}
  wais4_ds_forward_7a: {column: mcod0701_w, label: "Forward - item 7, trial 1", range: [0, 1]}
  wais4_ds_forward_7b: {column: mcod0702_w, label: "Forward - item 7, trial 2", range: [0, 1]}
  wais4_ds_forward_8a: {column: mcod0801_w, label: "Forward - item 8, trial 1", range: [0, 1]}
  wais4_ds_forward_8b: {column: mcod0802_w, label: "Forward - item 8, trial 2", range: [0, 1]}
  wais4_ds_forward_item1: {column: mcod_1_w, label: "Forward - item 1 score", range: [0, 2], missing: {Na: not_applicable}}
  wais4_ds_forward_item2: {column: mcod_2_w, label: "Forward - item 2 score", range: [0, 2], missing: {Na: not_applicable}}
