  wais4_ds_backward_8a: {column: mcoi0801_w, label: "Backward - item 8, trial 1", range: [0, 1]}
  wais4_ds_backward_8b: {column: mcoi0802_w, label: "Backward - item 8, trial 2", range: [0, 1]}
  wais4_ds_backward_item1: {column: mcoi_1_w, label: "Backward - item 1 score", range: [0, 2], missing: {Na: not_applicable}}
  wais4_ds_backward_item2: {column: mcoi_2_w, label: "Backward - item 2 score", range: [0, 2], missing: {Na: not_applicable}}
  wais4_ds_backward_item3: {column: mcoi_3_w, label: "Backward - item 3 score", range: [0, 2], missing: {Na: not_applicable}}
  wais4_ds_backward_item4: {column: mcoi_4_w, label: "Backward - item 4 score", range: [0, 2], missing: {Na: not_applicable}}
  wais4_ds_backward_item5: {column: mcoi_5_w, label: "Backward - item 5 score", range: [0, 2], missing: {Na: not_applicable}}
  wais4_ds_backward_item6: {column: mcoi_6_w, label: "Backward - item 6 score", range: [0, 2], missing: {Na: not_applicable}}
  wais4_ds_backward_item7: {column: mcoi_7_w, label: "Backward - item 7 score", range: [0, 2], missing: {Na: not_applicable}}
