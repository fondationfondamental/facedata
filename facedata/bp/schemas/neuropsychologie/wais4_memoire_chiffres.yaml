  wais4_ds_backward_2a: {column: mcoi0201_w, label: "Backward - item 2, trial 1", range: [0, 1]}
  wais4_ds_backward_2b: {column: mcoi0202_w, label: "Backward - item 2, trial 2", range: [0, 1]}
  wais4_ds_backward_3a: {column: mcoi0301_w, label: "Backward - item 3, trial 1", range: [0, 1]}
  wais4_ds_backward_3b: {column: mcoi0302_w, label: "Backward - item 3, trial 2", range: [0, 1]}
  wais4_ds_backward_4a: {column: mcoi0401_w, label: "Backward - item 4, trial 1", range: [0, 1]}
  wais4_ds_backward_4b: {column: mcoi0402_w, label: "Backward - item 4, trial 2", range: [0, 1]}
  wais4_ds_backward_5a: {column: mcoi0501_w, label: "Backward - item 5, trial 1", range: [0, 1]}
  wais4_ds_backward_5b: {column: mcoi0502_w, label: "Backward - item 5, trial 2", range: [0, 1]}
  wais4_ds_backward_6a: {column: mcoi0601_w, label: "Backward - item 6, trial 1", range: [0, 1]}
