instrument: scip
title: Screen for Cognitive Impairment in Psychiatry (SCIP)
tab: NEUROPSYCHOLOGIE
section: SCIP
status: draft
notes: >
  A short battery of five subtests, in the extraction from 2018 (about 220
  visits). The SCIP has three parallel forms; scip_form says which one was
  given.

  Each subtest has a raw score and a z-score from the norms, delivered as
  stored. The limits are those of the test: 30 for verbal learning, 24 for
  working memory, 10 for the delayed recall and 30 for the visuomotor
  task. A few delayed recalls are above 10 and end out_of_range. The
  dictionary writes "/24" for three subtests that have another maximum.

  The hour of the testing (rad_heure_passation_), listed in this section of
  the dictionary, is in neuropsy_conditions.yaml.

defaults: {type: item}

variables:
  scip_form: {column: rad_scipv_, label: Form of the SCIP given (1 to 3), range: [1, 3]}
  scip_verbal_learning: {column: scipv01a_, label: Verbal learning - raw score, range: [0, 30]}
  scip_verbal_learning_z: {column: scipv01b_, type: number, label: Verbal learning - z-score, range: [-10, 10]}
  scip_working_memory: {column: scipv02a_, label: Working memory - raw score, range: [0, 24]}
  scip_working_memory_z: {column: scipv02b_, type: number, label: Working memory - z-score, range: [-10, 10]}
  scip_verbal_fluency: {column: scipv03a_, label: Verbal fluency - raw score, range: [0, 60]}
  scip_verbal_fluency_z: {column: scipv03b_, type: number, label: Verbal fluency - z-score, range: [-10, 10]}
  scip_delayed_recall: {column: scipv04a_, label: Delayed verbal recall - raw score, range: [0, 10]}
  scip_delayed_recall_z: {column: scipv04b_, type: number, label: Delayed verbal recall - z-score, range: [-10, 10]}
  scip_visuomotor: {column: scipv05a_, label: Visuomotor tracking - raw score, range: [0, 30]}
  scip_visuomotor_z: {column: scipv05b_, type: number, label: Visuomotor tracking - z-score, range: [-10, 10]}
