instrument: errands_test
title: Errands test (Test des commissions)
tab: NEUROPSYCHOLOGIE
section: Test des commissions
status: reviewed
notes: >
  A planning test: the patient orders a list of errands under constraints of
  time and place. In the extraction from 2018 (813 visits with a count of
  detours, 781 of them from 2022).

  Raw scores: the time taken in minutes, the useless detours, the trips that
  miss an opening hour, the logical errors, and the total of the three kinds
  of errors. The stored total equals their sum on 98.9% of the visits (799 of
  808); it is recomputed and compared. 37 times of 819 are written as a
  duration (5'30, N min N sec, N:N) and stay unparsed: the time, and what is
  computed from it, is missing there (a reading rule m + s/60 is left for
  later).

  Percentiles. They are typed by hand from the norms, with limits that differ
  from one measure to the next ("20-50", "75-80", ">75"). They are read as
  bands on one list of limits; the value is the lower limit of the band, and a
  band wider than one step has <variable>_cens = +1. 19 to 29 cells per
  measure are a number that is no limit and stay unparsed.

  z-scores are typed on 24 to 30 visits per measure (34 visits in all, 40
  counting "."), from 2022 only; "." is a missing code. They are typed by
  hand, and they mix two sign conventions (decision D126: a third follow one
  straight line of the raw score per level of education, a third follow it
  with the opposite sign, a third follow neither, by centre and in every
  year). They were withdrawn; they are now replaced by the recomputed values
  below, and the typed ones are only a check.

  Recomputed. The percentile bands and the z-scores of the five measures
  (time, detours, late trips, logical errors, total of the three kinds of
  errors) are computed again from the raw counts, as the script of the
  application computes them, with the tables that FACE SZ uses
  (norms/errands_*_band.csv and errands_*_z.csv). The typed bands and z-scores
  are kept only as checks (errands_*_band_stored, errands_*_z_stored, not
  delivered). The band is the lower limit of the band the count falls in, in
  the table of the education of the patient: under 12 years, or 12 years and
  more (the baccalauréat is 12 years); a band wider than one step has
  <variable>_cens = +1. The z-score is (mean - count) / SD in the cell of the
  education and of the age (20 to 40 years, 41 to 60), so that a higher
  z-score is a better performance; the time is cut to whole minutes first, as
  the application does. The age is the one typed in the form (cclin01_) where
  it is within one year of the age at the visit, and the age at the visit
  elsewhere. The application computes nothing under 20 or over 60 years: no
  z-score is delivered there (86 visits with a count of detours, 59 with the
  ticked class; the bands do not depend on the age and are delivered).

  Education. The application's tables are two, below the baccalauréat and from
  it, chosen by the class that the rater ticks (comnsc_, kept as
  errands_education, no longer used). The package reads the years of education
  typed in the form (cclin08_) for every visit, as the other tests do, and the
  tables of norms/ are keyed by years (0 to 11 and 12 and over). Decision of
  the project lead. The ticked class is filled on 592 of the 813 visits with a
  count of detours; the years are filled on every one. Years of 12 or more
  equal the ticked class on 587 of the 596 visits where both exist (the 9 others: 5 at 12 years ticked as below, 1 at 10 years ticked as from,
  3 at 14 to 17 years ticked as below); on these 9 visits 25 bands and 34
  z-scores differ from the ones the class gave (4 more z-scores, at the
  clipped edge of the range, move with the winsorising limits). The 221 visits
  with no ticked class, mostly from 2022, now have their bands (1,091 cells)
  and z-scores (958 cells), where they had norm_missing. The application does
  not take the lowest class when none is ticked: the BP form has no script,
  its values are typed. A stored band on a visit with no ticked class equals
  the recomputed one in 337 of 374 pairs (90%), a typed z-score in 0 of 16 (7
  with the opposite sign).

  Checks. A band that differs from the typed one is flagged score_mismatch: on
  66 of 484 visits for the time (13.6%), 43 of 510 for the detours, 40 of 505
  for the late trips, 83 of 500 for the logical errors (16.6%) and 39 of 504
  for the total (7.7%): the bands are typed by hand, all the differences are
  from 2019 on, nearly all from 2022 (268 of 271). A typed value with no count
  to compute from is flagged score_not_recomputed (33 bands for the time, 0 to
  3 for the other measures). The z-scores are delivered on 695 to 728 visits
  per measure (734 visits in all, from 2018), against 24 to 30 with a typed
  one. Of the 24 to 28 typed ones that can be compared, 4 to 12 are the
  recomputed value with the opposite sign (sign_flipped, compare_turned), 8 to
  17 follow neither (score_mismatch), and the 3 to 11 others agree.

  errands_order is the order in which the patient ran the errands, as typed.

defaults: {type: item, range: [0, 10]}

variables:
  errands_not_done: {column: chk_com_test_non_fait_, type: category, label: Test not done, codes: {Test non fait: not_done}}
  errands_education:
    column: comnsc_
    type: category
    label: Level of education ticked in the form (not used for the norms)
    codes: {">= baccalaureat": baccalaureat_or_more, "< baccalaureat": below_baccalaureat}
  # What the norms need: the years of education typed in the form, 12 or more being the baccalauréat (the norm tables hold two lines of
  # years, 0 to 11 and 12 and over), and the age as typed in the form (the application computes nothing under 20 or over 60);
  # read again here, not delivered
  errands_education_years: {column: cclin08_, type: number, label: "Years of education, as entered (for the norms)", range: [0, 30], winsor: false, keep: false}
  errands_age: {column: cclin01_, type: number, label: "Age at the testing, as entered (years; for the norms)", range: [15, 100], winsor: false, keep: false}
  errands_minutes: {column: com01_, type: number, label: Time taken (minutes), range: [0, 60]}
  errands_minutes_band_stored: {column: com01s1_, type: band, limits: [5, 10, 20, 25, 50, 75, 80, 90, 95], label: "Time taken - percentile band, as stored", keep: false}
  errands_minutes_z_stored: {column: com01s2_, type: number, range: [-10, 10], missing: {".": not_recorded}, winsor: false, label: "Time taken - z-score, as stored", keep: false}
  errands_detours: {column: com02_, label: Useless detours}
  errands_detours_band_stored: {column: com02s1_, type: band, limits: [5, 10, 20, 25, 50, 75, 80, 90, 95], label: "Useless detours - percentile band, as stored", keep: false}
  errands_detours_z_stored: {column: com02s2_, type: number, range: [-10, 10], missing: {".": not_recorded}, winsor: false, label: "Useless detours - z-score, as stored", keep: false}
  errands_late_trips: {column: com03_, label: Trips that miss an opening hour}
  errands_late_trips_band_stored: {column: com03s1_, type: band, limits: [5, 10, 20, 25, 50, 75, 80, 90, 95], label: "Trips that miss an opening hour - percentile band, as stored", keep: false}
  errands_late_trips_z_stored: {column: com03s2_, type: number, range: [-10, 10], missing: {".": not_recorded}, winsor: false, label: "Trips that miss an opening hour - z-score, as stored", keep: false}
  errands_logic_errors: {column: com04_, label: Logical errors}
  errands_logic_errors_band_stored: {column: com04s1_, type: band, limits: [5, 10, 20, 25, 50, 75, 80, 90, 95], label: "Logical errors - percentile band, as stored", keep: false}
  errands_logic_errors_z_stored: {column: com04s2_, type: number, range: [-10, 10], missing: {".": not_recorded}, winsor: false, label: "Logical errors - z-score, as stored", keep: false}
  errands_errors_stored: {column: com04s3_, label: Total errors as stored, range: [0, 30], keep: false}
  errands_errors_band_stored: {column: com04s4_, type: band, limits: [5, 10, 20, 25, 50, 75, 80, 90, 95], label: "Total errors - percentile band, as stored", keep: false}
  errands_errors_z_stored: {column: com04s5_, type: number, range: [-10, 10], missing: {".": not_recorded}, winsor: false, label: "Total errors - z-score, as stored", keep: false}
  errands_order: {column: com05_, type: text, label: "Order of the errands, as typed"}

scores:
  errands_errors:
    label: Total errors (detours, late trips and logical errors)
    sum: [errands_detours, errands_late_trips, errands_logic_errors]
    compare: errands_errors_stored

  # Percentile bands and z-scores, recomputed as the application does (norms/errands_*.csv): the bands from the count or the time and the
  # level of education, the z-scores, (mean - score) / SD, also from the typed age (20 to 40 or 41 to 60 years), so that a higher
  # z-score is a better performance. The total of errors is the one of the three kinds.
  # The application cuts the time to whole minutes before it computes the z-score (5.5 minutes count 5): norms/errands_minutes_whole.csv
  errands_minutes_whole:
    label: Time taken, whole minutes
    lookup: errands_minutes_whole
    from: errands_minutes
    keep: false
  errands_minutes_band:
    label: Time taken - percentile band
    lookup: errands_minutes_band
    from: errands_minutes
    by: errands_education_years
    compare: errands_minutes_band_stored
  errands_minutes_z:
    label: Time taken - z-score (higher is better)
    regression: errands_minutes_z
    from: errands_minutes_whole
    by: errands_education_years
    age: errands_age
    range: [-10, 10]
    winsor: [0.01, 0.99]
    compare: errands_minutes_z_stored
    compare_tolerance: 0.0101
    compare_turned: true
  errands_detours_band:
    label: Useless detours - percentile band
    lookup: errands_detours_band
    from: errands_detours
    by: errands_education_years
    compare: errands_detours_band_stored
  errands_detours_z:
    label: Useless detours - z-score (higher is better)
    regression: errands_detours_z
    from: errands_detours
    by: errands_education_years
    age: errands_age
    range: [-10, 10]
    winsor: [0.01, 0.99]
    compare: errands_detours_z_stored
    compare_tolerance: 0.0101
    compare_turned: true
  errands_late_trips_band:
    label: Trips that miss an opening hour - percentile band
    lookup: errands_late_trips_band
    from: errands_late_trips
    by: errands_education_years
    compare: errands_late_trips_band_stored
  errands_late_trips_z:
    label: Trips that miss an opening hour - z-score (higher is better)
    regression: errands_late_trips_z
    from: errands_late_trips
    by: errands_education_years
    age: errands_age
    range: [-10, 10]
    winsor: [0.01, 0.99]
    compare: errands_late_trips_z_stored
    compare_tolerance: 0.0101
    compare_turned: true
  errands_logic_errors_band:
    label: Logical errors - percentile band
    lookup: errands_logic_errors_band
    from: errands_logic_errors
    by: errands_education_years
    compare: errands_logic_errors_band_stored
  errands_logic_errors_z:
    label: Logical errors - z-score (higher is better)
    regression: errands_logic_errors_z
    from: errands_logic_errors
    by: errands_education_years
    age: errands_age
    range: [-10, 10]
    winsor: [0.01, 0.99]
    compare: errands_logic_errors_z_stored
    compare_tolerance: 0.0101
    compare_turned: true
  errands_errors_band:
    label: Total errors - percentile band
    lookup: errands_errors_band
    from: errands_errors
    by: errands_education_years
    compare: errands_errors_band_stored
  errands_errors_z:
    label: Total errors - z-score (higher is better)
    regression: errands_errors_z
    from: errands_errors
    by: errands_education_years
    age: errands_age
    range: [-10, 10]
    winsor: [0.01, 0.99]
    compare: errands_errors_z_stored
    compare_tolerance: 0.0101
    compare_turned: true
