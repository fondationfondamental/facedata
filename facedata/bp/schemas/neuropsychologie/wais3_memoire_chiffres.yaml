instrument: wais3_memoire_chiffres
title: WAIS-III digit span
tab: NEUROPSYCHOLOGIE
section: Mémoire des chiffres WAIS III
status: reviewed
notes: >
  WAIS-III and WAIS-IV are two instruments stored in the same columns
  (decision D10 in PROGRESS.md). Each has its own schema and reads only its
  own visits, recognised by wais_version: 1,302 WAIS-III visits, mostly 2009
  to 2015, and 5,011 WAIS-IV visits from 2011 on (4,695 with a digit span
  value). Every visit with WAIS data has a version.

  On WAIS-III visits the columns hold what the dictionary says, and the raw
  total equals forward + backward on all 1,249 rows where both exist.

  Trials. Each item has two trials (1 = correct) and an item score, the
  number of trials passed (0 to 2): this holds in all but one or two rows.
  The test stops after two failures on an item, so the last items are often
  empty; "Na" in an item score is a missing code. The stored raw score of
  each order is compared with the sum of its item scores, the items after the
  first one scored 0 not counted (stop_at_zero: the test stops there): they
  agree on 1,249 of 1,249 forward and 1,250 of 1,250 backward visits (without
  the stop rule 3 visits of each order differ).

  Scaled score, z-scores and spans (decision of 18 November 2026). The scaled
  score is recomputed from the stored raw total in the application's own norm
  table (norms/wais3_digit_span.csv, 12 age groups read from the scripts of
  the EMR; not part of the repository) and delivered; the stored scaled score
  and z-score are checks (keep: false) and a difference is score_mismatch on
  the delivered score. The EMR read its tables with the age typed in the form
  (cclin01_); the package uses that age where it is within one year of the age
  at the visit, else the age at the visit (age: wais3_ds_age). The z-score is
  (scaled score - 10) / 3 (tolerance 0.006). The z-scores of the longest spans
  are computed with a mean and a standard deviation per age group and per
  class of years of education typed in the form
  (norms/wais3_span_forward_z.csv and wais3_span_backward_z.csv, by:
  wais3_ds_education), as the scripts of the EMR do; where the years of
  education are missing there is no z-score (4 visits, norm_missing, and
  score_not_recomputed on the 2 of them that have a stored z-score) and where
  the norm has no cell the EMR wrote "Infinity" (1 visit), a missing code of
  the stored value.

  On the 1,249 visits with a stored and a recomputed scaled score, 13 differ
  (9 to 2012, 4 in 2013-2015); on 11 the typed age is more than a year from
  the age at the visit, and read with the typed age as it stands the table
  gives the stored score on all but 3 visits. The z-score differs on 24 of
  1,248 visits: the stored z-score is not (stored scaled score - 10) / 3 on
  13 of them. The z-score of the forward span differs from the stored one on
  32 of 1,228 visits (20 to 2012, 11 in 2013-2015, 1 in 2016-2018) and that
  of the backward span on 32 of 1,228; the typed age is more than a year
  from the age at the visit on 25 of each, and read with the typed age as it
  stands the differences are 10 and 10. The EMR computes these z-scores
  when the button is clicked and does not recompute them after an edit. Of
  the 32 forward differences, 23 used the typed age, 3 the lowest education
  class (education empty at the click), 3 a neighbouring education class or
  the bound read lower, and 3 are not explained (2010 and 2011). Backward:
  23, 3, 4 and 2. 17 visits have a recomputed span z-score and no stored
  one.

  The delivered scaled score equals the stored one on 1,236 of 1,249 visits
  (99.0%), and on 1,172 of 1,174 (99.8%) once the 75 visits whose typed age is
  missing or more than 1 year from the age at the visit are set aside; those
  visits hold 11 of the 13 mismatches (85%). 17 of the 25 visits labelled
  WAIS-III and dated 2016 or later hold a digit span; none holds a column that
  only the WAIS-IV has, so they stay as labelled.

version:
  name: wais_version
  column: wais_version
  codes: {WAIS3: wais3, WAIS4: wais4}

defaults: {type: item, versions: [wais3]}

variables:
  wais3_ds_forward_raw:     {column: mcod_w,    label: Forward raw score (8 items of 2 trials),  range: [0, 16]}
  wais3_ds_backward_raw:    {column: mcoi_w,    label: Backward raw score (7 items of 2 trials), range: [0, 14]}
  wais3_ds_total:           {column: nbrut_w,   label: Raw total (forward + backward),           range: [0, 30]}
  wais3_ds_forward_span:    {column: mcodemp_w, label: Longest forward span,                     range: [0, 9]}
  wais3_ds_backward_span:   {column: mcoiemp_w, label: Longest backward span,                    range: [0, 8]}
  wais3_ds_span_difference: {column: empdid_w,  label: Forward span minus backward span,         range: [-8, 9]}
  # Typed in the form: the age and the years of education that the EMR read its tables with
  wais3_ds_age:       {column: cclin01_, type: number, range: [15, 100], winsor: false, keep: false, label: "Age typed in the form, the age the EMR read its tables with"}
  wais3_ds_education: {column: cclin08_, type: number, range: [0, 30], winsor: false, keep: false, label: "Years of education typed in the form"}
  wais3_ds_scaled_stored: {column: nstand_w, label: Age-scaled score as stored, range: [1, 19], keep: false}
  wais3_ds_z_stored:      {column: vstand_w, label: "Scaled score as a z-score, as stored", type: number, range: [-3, 3], winsor: false, keep: false}
  wais3_ds_forward_span_z_stored:  {column: wais_mc_end_std_w, type: number, range: [-5, 5], missing: {inf: not_recorded}, label: "Longest forward span as a z-score, as stored", keep: false}
  wais3_ds_backward_span_z_stored: {column: wais_mc_env_std_w, type: number, range: [-5, 5], missing: {inf: not_recorded}, label: "Longest backward span as a z-score, as stored", keep: false}
  # Forward: two trials per item (1 = correct), then the item scores
  wais3_ds_forward_1a: {column: mcod0101_w, label: "Forward - item 1, trial 1", range: [0, 1]}
  wais3_ds_forward_1b: {column: mcod0102_w, label: "Forward - item 1, trial 2", range: [0, 1]}
  wais3_ds_forward_2a: {column: mcod0201_w, label: "Forward - item 2, trial 1", range: [0, 1]}
  wais3_ds_forward_2b: {column: mcod0202_w, label: "Forward - item 2, trial 2", range: [0, 1]}
  wais3_ds_forward_3a: {column: mcod0301_w, label: "Forward - item 3, trial 1", range: [0, 1]}
  wais3_ds_forward_3b: {column: mcod0302_w, label: "Forward - item 3, trial 2", range: [0, 1]}
  wais3_ds_forward_4a: {column: mcod0401_w, label: "Forward - item 4, trial 1", range: [0, 1]}
  wais3_ds_forward_4b: {column: mcod0402_w, label: "Forward - item 4, trial 2", range: [0, 1]}
  wais3_ds_forward_5a: {column: mcod0501_w, label: "Forward - item 5, trial 1", range: [0, 1]}
  wais3_ds_forward_5b: {column: mcod0502_w, label: "Forward - item 5, trial 2", range: [0, 1]}
  wais3_ds_forward_6a: {column: mcod0601_w, label: "Forward - item 6, trial 1", range: [0, 1]}
  wais3_ds_forward_6b: {column: mcod0602_w, label: "Forward - item 6, trial 2", range: [0, 1]}
  wais3_ds_forward_7a: {column: mcod0701_w, label: "Forward - item 7, trial 1", range: [0, 1]}
  wais3_ds_forward_7b: {column: mcod0702_w, label: "Forward - item 7, trial 2", range: [0, 1]}
  wais3_ds_forward_8a: {column: mcod0801_w, label: "Forward - item 8, trial 1", range: [0, 1]}
  wais3_ds_forward_8b: {column: mcod0802_w, label: "Forward - item 8, trial 2", range: [0, 1]}
  wais3_ds_forward_item1: {column: mcod_1_w, label: "Forward - item 1 score", range: [0, 2], missing: {Na: not_applicable}}
  wais3_ds_forward_item2: {column: mcod_2_w, label: "Forward - item 2 score", range: [0, 2], missing: {Na: not_applicable}}
  wais3_ds_forward_item3: {column: mcod_3_w, label: "Forward - item 3 score", range: [0, 2], missing: {Na: not_applicable}}
  wais3_ds_forward_item4: {column: mcod_4_w, label: "Forward - item 4 score", range: [0, 2], missing: {Na: not_applicable}}
  wais3_ds_forward_item5: {column: mcod_5_w, label: "Forward - item 5 score", range: [0, 2], missing: {Na: not_applicable}}
  wais3_ds_forward_item6: {column: mcod_6_w, label: "Forward - item 6 score", range: [0, 2], missing: {Na: not_applicable}}
  wais3_ds_forward_item7: {column: mcod_7_w, label: "Forward - item 7 score", range: [0, 2], missing: {Na: not_applicable}}
  wais3_ds_forward_item8: {column: mcod_8_w, label: "Forward - item 8 score", range: [0, 2], missing: {Na: not_applicable}}
  # Backward: two trials per item (1 = correct), then the item scores
  wais3_ds_backward_1a: {column: mcoi0101_w, label: "Backward - item 1, trial 1", range: [0, 1]}
  wais3_ds_backward_1b: {column: mcoi0102_w, label: "Backward - item 1, trial 2", range: [0, 1]}
  wais3_ds_backward_2a: {column: mcoi0201_w, label: "Backward - item 2, trial 1", range: [0, 1]}
  wais3_ds_backward_2b: {column: mcoi0202_w, label: "Backward - item 2, trial 2", range: [0, 1]}
  wais3_ds_backward_3a: {column: mcoi0301_w, label: "Backward - item 3, trial 1", range: [0, 1]}
  wais3_ds_backward_3b: {column: mcoi0302_w, label: "Backward - item 3, trial 2", range: [0, 1]}
  wais3_ds_backward_4a: {column: mcoi0401_w, label: "Backward - item 4, trial 1", range: [0, 1]}
  wais3_ds_backward_4b: {column: mcoi0402_w, label: "Backward - item 4, trial 2", range: [0, 1]}
  wais3_ds_backward_5a: {column: mcoi0501_w, label: "Backward - item 5, trial 1", range: [0, 1]}
  wais3_ds_backward_5b: {column: mcoi0502_w, label: "Backward - item 5, trial 2", range: [0, 1]}
  wais3_ds_backward_6a: {column: mcoi0601_w, label: "Backward - item 6, trial 1", range: [0, 1]}
  wais3_ds_backward_6b: {column: mcoi0602_w, label: "Backward - item 6, trial 2", range: [0, 1]}
  wais3_ds_backward_7a: {column: mcoi0701_w, label: "Backward - item 7, trial 1", range: [0, 1]}
  wais3_ds_backward_7b: {column: mcoi0702_w, label: "Backward - item 7, trial 2", range: [0, 1]}
  wais3_ds_backward_item1: {column: mcoi_1_w, label: "Backward - item 1 score", range: [0, 2], missing: {Na: not_applicable}}
  wais3_ds_backward_item2: {column: mcoi_2_w, label: "Backward - item 2 score", range: [0, 2], missing: {Na: not_applicable}}
  wais3_ds_backward_item3: {column: mcoi_3_w, label: "Backward - item 3 score", range: [0, 2], missing: {Na: not_applicable}}
  wais3_ds_backward_item4: {column: mcoi_4_w, label: "Backward - item 4 score", range: [0, 2], missing: {Na: not_applicable}}
  wais3_ds_backward_item5: {column: mcoi_5_w, label: "Backward - item 5 score", range: [0, 2], missing: {Na: not_applicable}}
  wais3_ds_backward_item6: {column: mcoi_6_w, label: "Backward - item 6 score", range: [0, 2], missing: {Na: not_applicable}}
  wais3_ds_backward_item7: {column: mcoi_7_w, label: "Backward - item 7 score", range: [0, 2], missing: {Na: not_applicable}}

scores:
  # Consistency check only: the stored total must equal the sum of its parts.
  wais3_ds_total_check:
    sum: [wais3_ds_forward_raw, wais3_ds_backward_raw]
    compare: wais3_ds_total
    keep: false
  # Consistency check only: the stored raw score must equal the sum of its item scores.
  wais3_ds_forward_check:
    sum: [wais3_ds_forward_item1, wais3_ds_forward_item2, wais3_ds_forward_item3, wais3_ds_forward_item4, wais3_ds_forward_item5, wais3_ds_forward_item6, wais3_ds_forward_item7, wais3_ds_forward_item8]
    stop_at_zero: true
    min_items: 1
    compare: wais3_ds_forward_raw
    keep: false
  # Consistency check only: the stored raw score must equal the sum of its item scores.
  wais3_ds_backward_check:
    sum: [wais3_ds_backward_item1, wais3_ds_backward_item2, wais3_ds_backward_item3, wais3_ds_backward_item4, wais3_ds_backward_item5, wais3_ds_backward_item6, wais3_ds_backward_item7]
    stop_at_zero: true
    min_items: 1
    compare: wais3_ds_backward_raw
    keep: false

  wais3_ds_scaled:
    label: Age-scaled score (mean 10 and SD 3)
    lookup: wais3_digit_span
    from: wais3_ds_total
    age: wais3_ds_age
    range: [1, 19]
    compare: wais3_ds_scaled_stored
  wais3_ds_z:
    label: Scaled score as a z-score, (scaled score - 10) / 3
    sum: [wais3_ds_scaled]
    scale: [0.3333333, -3.3333333]
    compare: wais3_ds_z_stored
    compare_tolerance: 0.006
  wais3_ds_forward_span_z:
    label: Longest forward span as a z-score
    regression: wais3_span_forward_z
    from: wais3_ds_forward_span
    by: wais3_ds_education
    age: wais3_ds_age
    range: [-5, 5]
    compare: wais3_ds_forward_span_z_stored
    compare_tolerance: 0.011
  wais3_ds_backward_span_z:
    label: Longest backward span as a z-score
    regression: wais3_span_backward_z
    from: wais3_ds_backward_span
    by: wais3_ds_education
    age: wais3_ds_age
    range: [-5, 5]
    compare: wais3_ds_backward_span_z_stored
    compare_tolerance: 0.011
