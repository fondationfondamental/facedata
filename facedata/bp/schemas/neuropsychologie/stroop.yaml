instrument: stroop
title: Stroop Colour and Word Test (Golden)
tab: NEUROPSYCHOLOGIE
section: "Planche A : Nombre total de mots lus en 45 secondes"
status: draft
notes: >
  Three plates of 45 seconds each: reading colour words (plate A), naming
  colours (plate B), naming the ink of colour words (plate C), then the
  interference score. About 5,770 visits. The dictionary gives one section
  per plate; they are one instrument here.

  For each plate the extraction holds the number of items, the same number
  corrected for age, two error counts, a T-score and a z-score. The age
  correction adds a fixed number of items in each of three age classes (the
  data show one value per class); the corrected score is delivered as
  stored. The T-scores come from the norms of the manual and are delivered
  as stored. The z-score is the T-score brought to mean 0 and SD 1, (T - 50)
  / 10, in all but 2 or 3 rows per plate.

  Interference. The colour-word score minus the score predicted from the
  two other plates, A x B / (A + B), all three corrected for age. The stored
  interference is this value on 99.5% of the visits; the function
  stroop_interference of custom.py recomputes it and the difference is
  flagged (score_mismatch).

  One visit has a T-score of 0 on the three plates; it ends out_of_range.

defaults: {type: number}

variables:
  # Word reading
  stroop_word: {column: strooa01_, label: "Word reading - items in 45 seconds", range: [0, 250]}
  stroop_word_corrected: {column: strooa02_, label: "Word reading - score corrected for age", range: [0, 250]}
  stroop_word_errors_corrected: {column: strooa03_, type: item, label: "Word reading - corrected errors", range: [0, 20]}
  stroop_word_errors_uncorrected: {column: strooa04_, type: item, label: "Word reading - uncorrected errors", range: [0, 20]}
  stroop_word_t: {column: strooa05_, label: "Word reading - T-score", range: [20, 80], winsor: false}
  stroop_word_z: {column: strooa06_, label: "Word reading - z-score", range: [-3, 3], winsor: false}
  # Colour naming
  stroop_colour: {column: stroob01_, label: "Colour naming - items in 45 seconds", range: [0, 250]}
  stroop_colour_corrected: {column: stroob02_, label: "Colour naming - score corrected for age", range: [0, 250]}
  stroop_colour_errors_corrected: {column: stroob03_, type: item, label: "Colour naming - corrected errors", range: [0, 20]}
  stroop_colour_errors_uncorrected: {column: stroob04_, type: item, label: "Colour naming - uncorrected errors", range: [0, 20]}
  stroop_colour_t: {column: stroob05_, label: "Colour naming - T-score", range: [20, 80], winsor: false}
  stroop_colour_z: {column: stroob06_, label: "Colour naming - z-score", range: [-3, 3], winsor: false}
  # Colour-word
  stroop_colour_word: {column: strooc01_, label: "Colour-word - items in 45 seconds", range: [0, 250]}
  stroop_colour_word_corrected: {column: strooc02_, label: "Colour-word - score corrected for age", range: [0, 250]}
  stroop_colour_word_errors_corrected: {column: strooc03_, type: item, label: "Colour-word - corrected errors", range: [0, 20]}
  stroop_colour_word_errors_uncorrected: {column: strooc04_, type: item, label: "Colour-word - uncorrected errors", range: [0, 20]}
  stroop_colour_word_t: {column: strooc05_, label: "Colour-word - T-score", range: [20, 80], winsor: false}
  stroop_colour_word_z: {column: strooc06_, label: "Colour-word - z-score", range: [-3, 3], winsor: false}
  # Interference
  stroop_interference_stored: {column: strooi01_, label: Interference as stored, range: [-60, 80], keep: false}
  stroop_interference_t: {column: strooi02_, label: Interference - T-score, range: [20, 80], winsor: false, derived_from: stroop_interference}
  stroop_interference_z: {column: strooi03_, label: Interference - z-score, range: [-3, 3], winsor: false, derived_from: stroop_interference}

scores:
  stroop_interference:
    label: Interference (colour-word minus its predicted value)
    custom: stroop_interference
    compare: stroop_interference_stored
    winsor: [0.01, 0.99]
