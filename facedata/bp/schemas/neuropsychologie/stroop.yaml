instrument: stroop
title: Stroop Colour and Word Test (Golden)
tab: NEUROPSYCHOLOGIE
section: "Planche A : Nombre total de mots lus en 45 secondes"
status: draft
notes: >
  Three plates of 45 seconds each: reading colour words (plate A), naming
  colours (plate B), naming the ink of colour words (plate C), then the
  interference score. About 5,800 visits. The dictionary gives one section
  per plate; they are one instrument here.

  Recomputed. For each plate the extraction holds the number of items, the
  same number corrected for age, two error counts, a T-score and a z-score.
  The score corrected for age, the T-score and the z-score are computed
  again as the application computes them, and the stored values are kept
  only as checks (stroop_*_stored, not delivered). The corrected score is
  the number of items plus a fixed number of items for each of three age
  classes (norms/stroop_age_correction_*.csv), read with the age typed in
  the form (cclin01_) where it is within one year of the age at the visit,
  and with the age at the visit elsewhere (200 of the 5,804 visits have a
  typed age further than a year away, 11 have none). The T-score is read in
  the table of the manual from the corrected score (steps of two points,
  from 20 to 80; norms/stroop_*_t.csv, the same at every age). The z-score
  is the T-score brought to mean 0 and SD 1, (T - 50) / 10.

  Interference. The colour-word score minus the score predicted from the
  two other plates, A x B / (A + B), all three corrected for age (function
  stroop_interference of custom.py). The application rounds it to two
  decimals before it reads its T-score; the table of the interference has
  its limits moved down by half a hundredth, so that it gives the same
  T-score from the value with all its decimals. The T-score and the
  z-score of the interference are read from the recomputed value.

  Checks. A recomputed value that differs from the stored one is flagged
  score_mismatch (the T-score within 0.5, the z-score within 0.0101, the
  items exactly). Of the visits where both exist: the corrected score
  differs on 0.6% (34 to 37 visits for each plate), the T-score on 1.0 to
  1.2% (56 to 68), the z-score on the same visits plus a few (58 to 68),
  the interference on 0.9% (54), its T-score and its z-score on 1.1%
  (64 and 65). About two thirds of the corrected-score differences (22
  to 23 of 34 to 37) are visits whose typed age is more than a year from
  the age at the visit, where the application used the typed age and the
  package the age at the visit; 29 to 31 of them are one age class (a step
  of 4 to 15 items) and 5 to 6 are large gaps (a count typed wrongly). The
  corrected score differs on 1.2% of the visits until 2012, 0.8% in
  2013-15 and 0.4% or less after. The T-score differs more until 2012: on
  24 to 37 of its differences per plate the corrected score is the same,
  all of them before 2013 and mostly (22 to 33) in four centres, and the
  stored T-score is an odd number in 21 to 30 of them (23 to 33 odd
  T-scores per plate, none after 2012): the early application read the
  T-score in another table. The stored
  z-score is (T - 50) / 10 of the stored T-score in all but 2 or 3 rows
  per plate.
  One visit has a T-score of 0 on the three plates; the stored values end
  out_of_range.

defaults: {type: number}

variables:
  # The age as typed in the form: the application reads the age correction with it, not with the age at the visit
  stroop_age: {column: cclin01_, label: "Age at the testing, as entered (years; for the age correction)", range: [15, 100], winsor: false, keep: false}

  # Word reading
  stroop_word: {column: strooa01_, label: "Word reading - items in 45 seconds", range: [0, 250]}
  stroop_word_corrected_stored: {column: strooa02_, label: "Word reading - score corrected for age, as stored", range: [0, 250], winsor: false, keep: false}
  stroop_word_errors_corrected: {column: strooa03_, type: item, label: "Word reading - corrected errors", range: [0, 20]}
  stroop_word_errors_uncorrected: {column: strooa04_, type: item, label: "Word reading - uncorrected errors", range: [0, 20]}
  stroop_word_t_stored: {column: strooa05_, label: "Word reading - T-score, as stored", range: [20, 80], winsor: false, keep: false}
  stroop_word_z_stored: {column: strooa06_, label: "Word reading - z-score, as stored", range: [-3, 3], winsor: false, keep: false}
  # Colour naming
  stroop_colour: {column: stroob01_, label: "Colour naming - items in 45 seconds", range: [0, 250]}
  stroop_colour_corrected_stored: {column: stroob02_, label: "Colour naming - score corrected for age, as stored", range: [0, 250], winsor: false, keep: false}
  stroop_colour_errors_corrected: {column: stroob03_, type: item, label: "Colour naming - corrected errors", range: [0, 20]}
  stroop_colour_errors_uncorrected: {column: stroob04_, type: item, label: "Colour naming - uncorrected errors", range: [0, 20]}
  stroop_colour_t_stored: {column: stroob05_, label: "Colour naming - T-score, as stored", range: [20, 80], winsor: false, keep: false}
  stroop_colour_z_stored: {column: stroob06_, label: "Colour naming - z-score, as stored", range: [-3, 3], winsor: false, keep: false}
  # Colour-word
  stroop_colour_word: {column: strooc01_, label: "Colour-word - items in 45 seconds", range: [0, 250]}
  stroop_colour_word_corrected_stored: {column: strooc02_, label: "Colour-word - score corrected for age, as stored", range: [0, 250], winsor: false, keep: false}
  stroop_colour_word_errors_corrected: {column: strooc03_, type: item, label: "Colour-word - corrected errors", range: [0, 20]}
  stroop_colour_word_errors_uncorrected: {column: strooc04_, type: item, label: "Colour-word - uncorrected errors", range: [0, 20]}
  stroop_colour_word_t_stored: {column: strooc05_, label: "Colour-word - T-score, as stored", range: [20, 80], winsor: false, keep: false}
  stroop_colour_word_z_stored: {column: strooc06_, label: "Colour-word - z-score, as stored", range: [-3, 3], winsor: false, keep: false}
  # Interference
  stroop_interference_stored: {column: strooi01_, label: Interference as stored, range: [-60, 80], winsor: false, keep: false}
  stroop_interference_t_stored: {column: strooi02_, label: "Interference - T-score, as stored", range: [20, 80], winsor: false, keep: false}
  stroop_interference_z_stored: {column: strooi03_, label: "Interference - z-score, as stored", range: [-3, 3], winsor: false, keep: false}

scores:
  # Word reading. Items added for the age (norms/stroop_age_correction_*.csv, three age classes), then the T-score of the
  # corrected score (norms/stroop_*_t.csv, steps of two points, 20 to 80) and the z-score of the T-score, (T - 50) / 10.
  stroop_word_age_items:
    label: Word reading - items added for the age
    lookup: stroop_age_correction_word
    from: stroop_word
    age: stroop_age
    keep: false
  stroop_word_corrected:
    label: Word reading - score corrected for age
    sum: [stroop_word, stroop_word_age_items]
    winsor: [0.01, 0.99]
    compare: stroop_word_corrected_stored
  stroop_word_t:
    label: Word reading - T-score
    lookup: stroop_word_t
    from: stroop_word_corrected
    compare: stroop_word_t_stored
    compare_tolerance: 0.5
  stroop_word_z:
    label: Word reading - z-score, (T - 50) / 10
    sum: [stroop_word_t]
    scale: [0.1, -5]
    compare: stroop_word_z_stored
    compare_tolerance: 0.0101

  # Colour naming
  stroop_colour_age_items:
    label: Colour naming - items added for the age
    lookup: stroop_age_correction_colour
    from: stroop_colour
    age: stroop_age
    keep: false
  stroop_colour_corrected:
    label: Colour naming - score corrected for age
    sum: [stroop_colour, stroop_colour_age_items]
    winsor: [0.01, 0.99]
    compare: stroop_colour_corrected_stored
  stroop_colour_t:
    label: Colour naming - T-score
    lookup: stroop_colour_t
    from: stroop_colour_corrected
    compare: stroop_colour_t_stored
    compare_tolerance: 0.5
  stroop_colour_z:
    label: Colour naming - z-score, (T - 50) / 10
    sum: [stroop_colour_t]
    scale: [0.1, -5]
    compare: stroop_colour_z_stored
    compare_tolerance: 0.0101

  # Colour-word
  stroop_colour_word_age_items:
    label: Colour-word - items added for the age
    lookup: stroop_age_correction_colour_word
    from: stroop_colour_word
    age: stroop_age
    keep: false
  stroop_colour_word_corrected:
    label: Colour-word - score corrected for age
    sum: [stroop_colour_word, stroop_colour_word_age_items]
    winsor: [0.01, 0.99]
    compare: stroop_colour_word_corrected_stored
  stroop_colour_word_t:
    label: Colour-word - T-score
    lookup: stroop_colour_word_t
    from: stroop_colour_word_corrected
    compare: stroop_colour_word_t_stored
    compare_tolerance: 0.5
  stroop_colour_word_z:
    label: Colour-word - z-score, (T - 50) / 10
    sum: [stroop_colour_word_t]
    scale: [0.1, -5]
    compare: stroop_colour_word_z_stored
    compare_tolerance: 0.0101

  # Interference, from the three corrected scores (custom.stroop_interference), then its T-score and its z-score
  stroop_interference:
    label: Interference (colour-word minus its predicted value)
    custom: stroop_interference
    compare: stroop_interference_stored
    winsor: [0.01, 0.99]
  stroop_interference_t:
    label: Interference - T-score
    lookup: stroop_interference_t
    from: stroop_interference
    compare: stroop_interference_t_stored
    compare_tolerance: 0.5
  stroop_interference_z:
    label: Interference - z-score, (T - 50) / 10
    sum: [stroop_interference_t]
    scale: [0.1, -5]
    compare: stroop_interference_z_stored
    compare_tolerance: 0.0101
