instrument: wais3_vocabulaire
title: WAIS-III vocabulary (33 items)
tab: NEUROPSYCHOLOGIE
section: Vocabulaire
status: reviewed
notes: >
  WAIS-III and WAIS-IV are two instruments stored in the same columns
  (decision D10 in PROGRESS.md). The columns vocab01_wais3 to vocab33_wais3
  hold the 33-item WAIS-III vocabulary test on WAIS-III visits (1,219 visits,
  2009 to 2016) and the 30-item WAIS-IV vocabulary test on WAIS-IV visits
  (2,109 visits, 2011 to 2021), in spite of their name. This schema reads the
  WAIS-III visits; wais4_vocabulaire.yaml reads the others.

  Every WAIS-III item is scored 0 to 2, so the raw total goes up to 66.

  The stored raw total is wrong on WAIS-III visits. It is the sum of the 33
  items minus 3 on 1,207 of the 1,210 rows that have one, and it is never
  the sum itself. The total is therefore recomputed here from the items. The
  stored one is still compared with it, with that offset of -3, so that only
  the 3 rows that differ for another reason get score_mismatch.

  The scaled score is read in the application's own norm table (decision
  D19 in PROGRESS.md, which replaces D11). In the EMR the psychologist enters the
  items, and the application reads the scaled score in the table from the
  raw total and the age typed in the form (cclin01_); the field cannot be
  typed in. The table (norms/wais3_vocabulary.csv, not part of the
  repository) applied to the sum of the 33 items gives the stored scaled
  score, so the EMR used the true total and only the total column of the
  extraction is 3 points too low.

  Since the decision of 18 November 2026 the scaled score is recomputed from
  the sum of the 33 items and delivered; the stored scaled score and z-score
  are read as checks (keep: false), and a difference is score_mismatch on the
  delivered score. The table is read with the typed age where it is within one year
  of the age at the visit, else with the age at the visit (age:
  wais3_vocab_age). The z-score is (scaled score - 10) / 3, the stored one
  is rounded to two decimals (tolerance 0.006). The earlier design delivered
  the stored scores, checked them with the table read with the age at the
  visit, and gave derived_doubt to both on the 20 rows where the check
  differed; derived_from is gone. On the 1,210 visits that have a stored
  and a recomputed scaled score, 11 differ (8 to 2012, 3 in 2013-2015); on
  8 of them the typed age is more than a year from the age at the visit,
  and read with the typed age as it stands the table gives the stored
  score on all but 4 visits. The z-score differs on 11 visits.

  The delivered scaled score equals the stored one on 1,199 of 1,210 visits
  (99.1%), and on 1,139 of 1,142 (99.7%) once the 68 visits whose typed age is
  missing or more than 1 year from the age at the visit are set aside; those
  visits hold 8 of the 11 mismatches (73%). 4 of the 25 visits labelled
  WAIS-III and dated 2016 or later hold a vocabulary; none holds a column that
  only the WAIS-IV has, so they stay as labelled.

  The table is the one cited as "Wechsler, 1997"; the spreadsheet of that
  name has the same cells as the scripts of the EMR.

version:
  name: wais_version
  column: wais_version
  codes: {WAIS3: wais3, WAIS4: wais4}

defaults: {type: item, range: [0, 2], versions: [wais3]}

variables:
  wais3_vocab01: {column: vocab01_wais3, label: Vocabulary item 1}
  wais3_vocab02: {column: vocab02_wais3, label: Vocabulary item 2}
  wais3_vocab03: {column: vocab03_wais3, label: Vocabulary item 3}
  wais3_vocab04: {column: vocab04_wais3, label: Vocabulary item 4}
  wais3_vocab05: {column: vocab05_wais3, label: Vocabulary item 5}
  wais3_vocab06: {column: vocab06_wais3, label: Vocabulary item 6}
  wais3_vocab07: {column: vocab07_wais3, label: Vocabulary item 7}
  wais3_vocab08: {column: vocab08_wais3, label: Vocabulary item 8}
  wais3_vocab09: {column: vocab09_wais3, label: Vocabulary item 9}
  wais3_vocab10: {column: vocab10_wais3, label: Vocabulary item 10}
  wais3_vocab11: {column: vocab11_wais3, label: Vocabulary item 11}
  wais3_vocab12: {column: vocab12_wais3, label: Vocabulary item 12}
  wais3_vocab13: {column: vocab13_wais3, label: Vocabulary item 13}
  wais3_vocab14: {column: vocab14_wais3, label: Vocabulary item 14}
  wais3_vocab15: {column: vocab15_wais3, label: Vocabulary item 15}
  wais3_vocab16: {column: vocab16_wais3, label: Vocabulary item 16}
  wais3_vocab17: {column: vocab17_wais3, label: Vocabulary item 17}
  wais3_vocab18: {column: vocab18_wais3, label: Vocabulary item 18}
  wais3_vocab19: {column: vocab19_wais3, label: Vocabulary item 19}
  wais3_vocab20: {column: vocab20_wais3, label: Vocabulary item 20}
  wais3_vocab21: {column: vocab21_wais3, label: Vocabulary item 21}
  wais3_vocab22: {column: vocab22_wais3, label: Vocabulary item 22}
  wais3_vocab23: {column: vocab23_wais3, label: Vocabulary item 23}
  wais3_vocab24: {column: vocab24_wais3, label: Vocabulary item 24}
  wais3_vocab25: {column: vocab25_wais3, label: Vocabulary item 25}
  wais3_vocab26: {column: vocab26_wais3, label: Vocabulary item 26}
  wais3_vocab27: {column: vocab27_wais3, label: Vocabulary item 27}
  wais3_vocab28: {column: vocab28_wais3, label: Vocabulary item 28}
  wais3_vocab29: {column: vocab29_wais3, label: Vocabulary item 29}
  wais3_vocab30: {column: vocab30_wais3, label: Vocabulary item 30}
  wais3_vocab31: {column: vocab31_wais3, label: Vocabulary item 31}
  wais3_vocab32: {column: vocab32_wais3, label: Vocabulary item 32}
  wais3_vocab33: {column: vocab33_wais3, label: Vocabulary item 33}

  wais3_vocab_age:           {column: cclin01_, type: number, range: [15, 100], winsor: false, keep: false, label: "Age typed in the form, the age the EMR read its table with"}
  wais3_vocab_total_stored:  {column: vocabtot_wais3, label: Raw total as stored (wrong), range: [0, 66], keep: false}
  wais3_vocab_scaled_stored: {column: vocabstd_wais3, label: Age-scaled score as stored, range: [1, 19], keep: false}
  wais3_vocab_z_stored:      {column: vocabcr_wais3,  label: "Scaled score as a z-score, as stored", type: number, range: [-3, 3.34], winsor: false, keep: false}

scores:
  wais3_vocab_total:
    label: Vocabulary raw total (33 items)
    sum: [wais3_vocab01, wais3_vocab02, wais3_vocab03, wais3_vocab04, wais3_vocab05,
          wais3_vocab06, wais3_vocab07, wais3_vocab08, wais3_vocab09, wais3_vocab10,
          wais3_vocab11, wais3_vocab12, wais3_vocab13, wais3_vocab14, wais3_vocab15,
          wais3_vocab16, wais3_vocab17, wais3_vocab18, wais3_vocab19, wais3_vocab20,
          wais3_vocab21, wais3_vocab22, wais3_vocab23, wais3_vocab24, wais3_vocab25,
          wais3_vocab26, wais3_vocab27, wais3_vocab28, wais3_vocab29, wais3_vocab30,
          wais3_vocab31, wais3_vocab32, wais3_vocab33]
    compare: wais3_vocab_total_stored
    compare_offset: -3
  wais3_vocab_scaled:
    label: Age-scaled score (mean 10 and SD 3)
    lookup: wais3_vocabulary
    from: wais3_vocab_total
    age: wais3_vocab_age
    range: [1, 19]
    compare: wais3_vocab_scaled_stored
  wais3_vocab_z:
    label: Scaled score as a z-score, (scaled score - 10) / 3
    sum: [wais3_vocab_scaled]
    scale: [0.3333333, -3.3333333]
    compare: wais3_vocab_z_stored
    compare_tolerance: 0.006
