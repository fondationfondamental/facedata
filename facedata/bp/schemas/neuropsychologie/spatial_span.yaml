instrument: spatial_span
title: Spatial span (Wechsler Memory Scale III)
tab: NEUROPSYCHOLOGIE
section: Mémoire spatiale
status: reviewed
notes: >
  The psychologist taps blocks in a sequence that the patient repeats, in
  the same order (forward) and then in reverse (backward). Eight items of
  two trials for each order; the test stops after two failures on an item,
  so the last items are often empty. About 5,235 visits.

  An item score is the number of its trials passed (0 to 2): 4 of the 82,473
  items that have a score and both trials differ. The raw score of an order
  is the sum of its item scores up to the first item scored 0 (stop_at_zero:
  the application does not count what is typed after the first failed item),
  an empty item before it counting 0 (0 to 16). It equals the stored one on
  every visit that has both (5,222 forward, 5,216 backward, 5,200 for the
  total of the two orders, 0 to 32); the plain sum of all the items differed
  on 0.5% of the visits.

  Recomputed. The scaled scores (1 to 19) and their z-scores are computed
  again as the application computes them, and the stored values are kept
  only as checks (*_stored, not delivered). The scaled score is read in the
  table of the manual (norms/spatial_*_scaled.csv, twelve age groups) from
  the raw score and the age typed in the form (cclin01_) where it is within
  one year of the age at the visit, and the age at the visit elsewhere. The
  z-score is the scaled score brought to mean 0 and SD 1, (scaled - 10) / 3.
  A scaled score that differs from the stored one is flagged score_mismatch
  (the z-score within 0.0101), and so is its z-score.

  Checks. The scaled score equals the stored one on 99.16% of the visits for
  the forward order (5,193 of 5,237) and for the backward order (5,189 of
  5,233), and on 98.81% for the total (5,170 of 5,232): 44, 44 and 62 visits
  differ (0.8%, 0.8% and 1.2%), and so does the z-score of the same visits.
  Read with the typed age alone, as the application does, the table gives
  the stored value on 99.56%, 99.54% and 99.27% of the visits that have a
  typed age (5,228, 5,224 and 5,223).

  Of the differences, 24, 23 and 27 are visits whose typed age is more than
  a year from the age at the visit, mostly by one scaled point: the
  application read the table with the typed age and the package with the age
  at the visit. The others have ages that agree. 15, 17 and 32 of them have
  a stored scaled score 2 or more points from the table's value for the
  stored raw score: a stored 1 on 14, 17 and 32, for raw scores of 7 to 12
  forward, 3 to 12 backward and 11 to 23 for the total, where the table
  gives more. 5, 4 and 3 differ by one point. One centre accounts for 30 of
  these 64 differences, and visits with the same raw scores outside them
  equal the table on 99.4% to 99.5% (99.9% where the ages agree). A possible
  cause is a scaled score that was computed while the raw score was still 0
  and never refreshed: a hypothesis, to ask the data managers.

  By period, 0.45% to 1.43% of the visits differ (for each of the three
  scaled scores), and the differences are spread over the centres. One visit
  has a stored scaled score where no raw score can be computed
  (score_not_recomputed).

defaults: {type: item, range: [0, 1]}

variables:
  # Forward: two trials per item (1 = correct), then the item scores
  spatial_forward_1a: {column: msd01a_, label: "Forward - item 1, trial 1"}
  spatial_forward_1b: {column: msd01b_, label: "Forward - item 1, trial 2"}
  spatial_forward_2a: {column: msd02a_, label: "Forward - item 2, trial 1"}
  spatial_forward_2b: {column: msd02b_, label: "Forward - item 2, trial 2"}
  spatial_forward_3a: {column: msd03a_, label: "Forward - item 3, trial 1"}
  spatial_forward_3b: {column: msd03b_, label: "Forward - item 3, trial 2"}
  spatial_forward_4a: {column: msd04a_, label: "Forward - item 4, trial 1"}
  spatial_forward_4b: {column: msd04b_, label: "Forward - item 4, trial 2"}
  spatial_forward_5a: {column: msd05a_, label: "Forward - item 5, trial 1"}
  spatial_forward_5b: {column: msd05b_, label: "Forward - item 5, trial 2"}
  spatial_forward_6a: {column: msd06a_, label: "Forward - item 6, trial 1"}
  spatial_forward_6b: {column: msd06b_, label: "Forward - item 6, trial 2"}
  spatial_forward_7a: {column: msd07a_, label: "Forward - item 7, trial 1"}
  spatial_forward_7b: {column: msd07b_, label: "Forward - item 7, trial 2"}
  spatial_forward_8a: {column: msd08a_, label: "Forward - item 8, trial 1"}
  spatial_forward_8b: {column: msd08b_, label: "Forward - item 8, trial 2"}
  spatial_forward_item1: {column: msd01_, label: "Forward - item 1 score", range: [0, 2]}
  spatial_forward_item2: {column: msd02_, label: "Forward - item 2 score", range: [0, 2]}
  spatial_forward_item3: {column: msd03_, label: "Forward - item 3 score", range: [0, 2]}
  spatial_forward_item4: {column: msd04_, label: "Forward - item 4 score", range: [0, 2]}
  spatial_forward_item5: {column: msd05_, label: "Forward - item 5 score", range: [0, 2]}
  spatial_forward_item6: {column: msd06_, label: "Forward - item 6 score", range: [0, 2]}
  spatial_forward_item7: {column: msd07_, label: "Forward - item 7 score", range: [0, 2]}
  spatial_forward_item8: {column: msd08_, label: "Forward - item 8 score", range: [0, 2]}
  # Backward: two trials per item (1 = correct), then the item scores
  spatial_backward_1a: {column: msi01a_, label: "Backward - item 1, trial 1"}
  spatial_backward_1b: {column: msi01b_, label: "Backward - item 1, trial 2"}
  spatial_backward_2a: {column: msi02a_, label: "Backward - item 2, trial 1"}
  spatial_backward_2b: {column: msi02b_, label: "Backward - item 2, trial 2"}
  spatial_backward_3a: {column: msi03a_, label: "Backward - item 3, trial 1"}
  spatial_backward_3b: {column: msi03b_, label: "Backward - item 3, trial 2"}
  spatial_backward_4a: {column: msi04a_, label: "Backward - item 4, trial 1"}
  spatial_backward_4b: {column: msi04b_, label: "Backward - item 4, trial 2"}
  spatial_backward_5a: {column: msi05a_, label: "Backward - item 5, trial 1"}
  spatial_backward_5b: {column: msi05b_, label: "Backward - item 5, trial 2"}
  spatial_backward_6a: {column: msi06a_, label: "Backward - item 6, trial 1"}
  spatial_backward_6b: {column: msi06b_, label: "Backward - item 6, trial 2"}
  spatial_backward_7a: {column: msi07a_, label: "Backward - item 7, trial 1"}
  spatial_backward_7b: {column: msi07b_, label: "Backward - item 7, trial 2"}
  spatial_backward_8a: {column: msi08a_, label: "Backward - item 8, trial 1"}
  spatial_backward_8b: {column: msi08b_, label: "Backward - item 8, trial 2"}
  spatial_backward_item1: {column: msi01_, label: "Backward - item 1 score", range: [0, 2]}
  spatial_backward_item2: {column: msi02_, label: "Backward - item 2 score", range: [0, 2]}
  spatial_backward_item3: {column: msi03_, label: "Backward - item 3 score", range: [0, 2]}
  spatial_backward_item4: {column: msi04_, label: "Backward - item 4 score", range: [0, 2]}
  spatial_backward_item5: {column: msi05_, label: "Backward - item 5 score", range: [0, 2]}
  spatial_backward_item6: {column: msi06_, label: "Backward - item 6 score", range: [0, 2]}
  spatial_backward_item7: {column: msi07_, label: "Backward - item 7 score", range: [0, 2]}
  spatial_backward_item8: {column: msi08_, label: "Backward - item 8 score", range: [0, 2]}

  # The age as typed in the form: the application reads its scaled scores with it, not with the age at the visit
  spatial_age: {column: cclin01_, type: number, label: "Age at the testing, as entered (years; for the norms)", range: [15, 100], winsor: false, keep: false}

  # Scores as stored: compared with the recomputed ones, not delivered
  spatial_forward_stored: {column: msdtot_, label: Forward raw score as stored, range: [0, 16], keep: false}
  spatial_backward_stored: {column: msitot_, label: Backward raw score as stored, range: [0, 16], keep: false}
  spatial_total_stored: {column: mstbrut_, label: Total raw score as stored, range: [0, 32], keep: false}
  spatial_forward_scaled_stored: {column: msdstd_, label: Forward scaled score as stored, range: [1, 19], keep: false}
  spatial_forward_z_stored: {column: msdcr_, type: number, label: Forward z-score as stored, range: [-3, 3], winsor: false, keep: false}
  spatial_backward_scaled_stored: {column: msistd_, label: Backward scaled score as stored, range: [1, 19], keep: false}
  spatial_backward_z_stored: {column: msicr_, type: number, label: Backward z-score as stored, range: [-3, 3], winsor: false, keep: false}
  spatial_total_scaled_stored: {column: mststd_, label: Total scaled score as stored, range: [1, 19], keep: false}
  spatial_total_z_stored: {column: mstcr_, type: number, label: Total z-score as stored, range: [-3, 3], winsor: false, keep: false}

scores:
  # Raw scores: the items added in the order of the test, up to the first item scored 0 (the test stops there)
  spatial_forward:
    label: Forward raw score (0 to 16)
    sum: [spatial_forward_item1, spatial_forward_item2, spatial_forward_item3, spatial_forward_item4, spatial_forward_item5, spatial_forward_item6, spatial_forward_item7, spatial_forward_item8]
    stop_at_zero: true
    min_items: 1
    compare: spatial_forward_stored
  spatial_backward:
    label: Backward raw score (0 to 16)
    sum: [spatial_backward_item1, spatial_backward_item2, spatial_backward_item3, spatial_backward_item4, spatial_backward_item5, spatial_backward_item6, spatial_backward_item7, spatial_backward_item8]
    stop_at_zero: true
    min_items: 1
    compare: spatial_backward_stored
  spatial_total:
    label: Total raw score (0 to 32)
    sum: [spatial_forward, spatial_backward]
    compare: spatial_total_stored

  # Scaled scores, read in the norm tables of the manual (norms/spatial_*_scaled.csv) from the raw score and the age
  # typed in the form, then the z-score of the scaled score, (scaled - 10) / 3
  spatial_forward_scaled:
    label: Forward scaled score (mean 10 and SD 3)
    lookup: spatial_forward_scaled
    from: spatial_forward
    age: spatial_age
    compare: spatial_forward_scaled_stored
  spatial_forward_z:
    label: Forward scaled score as a z-score
    sum: [spatial_forward_scaled]
    scale: [0.3333333, -3.3333333]
    compare: spatial_forward_z_stored
    compare_tolerance: 0.0101
  spatial_backward_scaled:
    label: Backward scaled score (mean 10 and SD 3)
    lookup: spatial_backward_scaled
    from: spatial_backward
    age: spatial_age
    compare: spatial_backward_scaled_stored
  spatial_backward_z:
    label: Backward scaled score as a z-score
    sum: [spatial_backward_scaled]
    scale: [0.3333333, -3.3333333]
    compare: spatial_backward_z_stored
    compare_tolerance: 0.0101
  spatial_total_scaled:
    label: Total scaled score (mean 10 and SD 3)
    lookup: spatial_total_scaled
    from: spatial_total
    age: spatial_age
    compare: spatial_total_scaled_stored
  spatial_total_z:
    label: Total scaled score as a z-score
    sum: [spatial_total_scaled]
    scale: [0.3333333, -3.3333333]
    compare: spatial_total_z_stored
    compare_tolerance: 0.0101
