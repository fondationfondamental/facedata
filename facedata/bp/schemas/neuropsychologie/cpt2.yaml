  cpt2_hit_rt_t: {column: cpt203b, label: "Hit reaction time (ms) - T-score", range: [0, 1000], winsor: false}
  cpt2_hit_rt_percentile: {column: cpt203c, label: "Hit reaction time (ms) - percentile", range: [0, 100], winsor: false}
