instrument: cpt2
title: Conners' Continuous Performance Test II (CPT-II)
tab: NEUROPSYCHOLOGIE
section: CPT II
status: draft
notes: >
  A sustained-attention test on a computer; the psychologist copies the
  results of the report into the form. About 3,145 visits, until 2022. The
  CPT-3 took its place from 2018 on and has its own columns and its own
  schema (cpt3.yaml); only 2 visits have both. The column cpt_version says
  nothing about the CPT and is ignored.

  Twelve measures. Each has a value, a T-score, a percentile and the
  guideline printed by the report; omissions, commissions and perseverations
  also have a percentage. Everything is delivered as stored: the T-scores
  and percentiles come from the software.

  Typing errors. A few T-scores and percentiles are 1,000 or more (a lost
  decimal point: 5045 for 50.45, but the number of decimals is not known),
  and a few values are impossible (more omissions than there are targets).
  They end out_of_range. The limits are wide on purpose: an omission
  T-score above 100 is common (418 visits), because few healthy people miss
  a target.

  The guidelines are spelled as in the extraction ("Midly atypical", "Very
  good perfomance").

defaults: {type: number}

variables:
  # Omissions
  cpt2_omissions: {column: cpt201a, label: "Omissions", range: [0, 324]}
  cpt2_omissions_percent: {column: cpt201b, label: "Omissions (percent)", range: [0, 100]}
  cpt2_omissions_t: {column: cpt201c, label: "Omissions - T-score", range: [0, 1000]}
  cpt2_omissions_percentile: {column: cpt201d, label: "Omissions - percentile", range: [0, 100], winsor: false}
  cpt2_omissions_class: {column: cpt201e, type: category, label: "Omissions - guideline", codes: {Very good perfomance: very_good, Good performance: good, Within average range: average, Midly atypical: mildly_atypical, Markedly atypical: markedly_atypical, Atypically fast: atypically_fast, A little fast: a_little_fast, A little slow: a_little_slow, Atypically slow: atypically_slow}}
