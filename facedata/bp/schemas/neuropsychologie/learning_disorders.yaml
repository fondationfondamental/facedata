instrument: learning_disorders
title: History of learning and developmental disorders
tab: NEUROPSYCHOLOGIE
section: Troubles des acquisitions et des apprentissages
status: reviewed
notes: >
  Ten yes/no questions asked at the neuropsychological assessment, answered
  on 5,789 visits. They are delivered as 1 (yes) and 0 (no). "Ne sais pas"
  is a missing code (unknown): 1,758 cells, from 50 (stuttering) to 454
  (giftedness) per question.

  The same ten questions, with the same names (trbapp01 to trbapp10) and the
  same delivered codes, are in FACE DR and FACE ASP, so that the three
  cohorts can be pooled: yes is 1, no is 0 and unknown is a missing code in
  each. Only the raw cells differ: the text Oui, Non and Ne sais pas here,
  the codes 1, 0 and 2 in DR (form 199.php of eCEDR) and 1, 0 and 9 in ASP
  (form 237.php of eAsperger). DR has three more questions and a free text,
  which BP and ASP do not have.

  In the dictionary the CVLT follows these questions without a header of its
  own; it has its own schema (cvlt.yaml).

defaults: {type: item, range: [0, 1], codes: {Oui: 1, Non: 0}}

variables:
  trbapp01: {column: trbapp01_, label: Dyslexia}
  trbapp02: {column: trbapp02_, label: Dysorthographia}
  trbapp03: {column: trbapp03_, label: Dyscalculia}
  trbapp04: {column: trbapp04_, label: Dysphasia}
