instrument: tmt
title: Trail Making Test, parts A and B
tab: NEUROPSYCHOLOGIE
section: TMT
status: draft
notes: >
  Times and errors, their z-scores and their percentile bands, for part A,
  part B and the difference B minus A.

  Percentile bands of the times (decision D38 in PROGRESS.md). The three
  time percentile columns mix plain numbers (50), bands ("25 - 50", also
  written "50 - 25" or "[25-50]") and a few one-sided classes (">95", "<5").
  They are read as bands: the value is the lower limit of the band, 0 (under
  the 5th percentile), 5, 10, 25, 50, 75, 90 or 95. A higher band is a
  better performance. The share of each band is the same in every period.

  Percentile bands of the errors: recomputed (decisions D42 and D43). The
  four error percentile columns of the extraction are not read
  (ignored.yaml): the EMR wrote them with three different rules over the
  years. A patient with no error in part A has ">95" until 2015, ">5",
  ">10" or ">25" from 2016 to 2021, and "<5" (426 visits) or ">10" from
  2022.

  The four bands are read again in the norm tables of the EMR, from the
  number of errors (corrected plus uncorrected), the age at the visit and
  the years of education (cclin08_, read here a second time and not
  delivered). The tables are files of the norms folder (norms/tmt_*.csv),
  which is not in the repository; without them the four bands are missing
  with norm_missing.

  Most people make no error, so several limits of the norms fall on the same
  number of errors. The band of such a number is the lowest one it can be,
  with <variable>_cens = +1: this band or a higher one. With no error a
  patient gets a low band with that mark, as in the cells the EMR wrote
  from 2016 on (">5", ">10", ">25"). The bands say little, but they now say
  the same thing in every year: the share of each band changes by 6 points
  at most between the periods.

  Check against the cells the EMR wrote from 2016 to 2021, the period whose
  rule is the one of the tables: the same band on 93% of the visits for the
  errors of part B, 98% for the perseverative errors, 95% for B minus A and
  87% for part A.

  Z-scores. The EMR computes z = (mean - raw) / SD for every patient, so a
  positive z-score is a better performance. The five z-scores listed under
  sign were written with the opposite sign in the early years: a slow time
  gave a positive z-score.
  Eight centres changed between 2012 and 2014, each at its own date; the
  other centres always used the present convention. The old values are
  multiplied by -1, so that in every z-score of this instrument a higher
  value means a better performance. About 770 visits are concerned.

  The rule was checked against a second piece of evidence, row by row: a
  visit with no error must have a positive error z-score in the present
  convention, and a visit with one error or more a negative one. The switch
  dates found agree with it on 5,767 of the 5,806 visits where it can be
  read. Of the 39 visits that disagree, 14 are within 90 days of a switch
  date, where the values get sign_doubt; the other 25 are not flagged.

  The z-score of the B-A error difference has the present sign in every
  centre and every year, so it is not listed under sign.

  Errors. The error z-scores and the stored B-A error difference were
  computed from corrected plus uncorrected errors, so the two are added up
  in tmt_a_errors and tmt_b_errors. Most patients make no error. The norms
  then have a very small standard deviation and a single error gives a
  z-score of -2 to -8: the error z-scores are extreme by construction.

  Times are in seconds. In part B, "impossible" and "arrêt" (12 visits) mean
  that the patient could not finish; they are treated as missing codes. A
  few cells hold text such as "26s" and stay unparsed.

  The stored B-A time and B-A error difference are delivered as stored,
  because the z-scores were computed from them. Two check scores recompute
  them as part B minus part A: the time differs on a few rows
  (score_mismatch), the error difference on none.

sign:
  relation: negative
  by: siteid
  pairs:
    tmt_a_time_z: tmt_a_time
    tmt_b_time_z: tmt_b_time
    tmt_ba_time_z: tmt_ba_time
    tmt_a_errors_z: [tmt_a_errors_corrected, tmt_a_errors_uncorrected]
    tmt_b_errors_z: [tmt_b_errors_corrected, tmt_b_errors_uncorrected]

defaults: {type: item}

variables:
  # Part A
  tmt_a_time:               {column: tmta01_,  label: Part A - time, type: number, unit: s, range: [10, 300]}
  tmt_a_errors_corrected:   {column: tmta03_,  label: Part A - corrected errors,   range: [0, 10]}
  tmt_a_errors_uncorrected: {column: tmta04_,  label: Part A - uncorrected errors, range: [0, 10]}
  tmt_a_time_z:             {column: tmta01b_, label: Part A - time as a z-score (higher is better),   type: number, range: [-20, 10]}
  tmt_a_errors_z:           {column: tmta02b_, label: Part A - errors as a z-score (higher is better), type: number, range: [-50, 20]}

  # Part B
  tmt_b_time:
    column: tmtb01_
    label: Part B - time
    type: number
    unit: s
    range: [15, 600]
    missing: {impossible: not_applicable, arret: not_applicable, arrêt: not_applicable}
  tmt_b_errors_corrected:     {column: tmtb03_,  label: Part B - corrected errors,     range: [0, 25]}
  tmt_b_errors_uncorrected:   {column: tmtb04_,  label: Part B - uncorrected errors,   range: [0, 25]}
  tmt_b_errors_perseverative: {column: tmtb05_,  label: Part B - perseverative errors, range: [0, 25]}
  tmt_b_time_z:               {column: tmtb01b_, label: Part B - time as a z-score (higher is better),   type: number, range: [-20, 10]}
  tmt_b_errors_z:             {column: tmtb02b_, label: Part B - errors as a z-score (higher is better), type: number, range: [-50, 20]}

  # Part B minus part A
  tmt_ba_time:     {column: tmtba01_,  label: B minus A - time as stored, type: number, unit: s, range: [-100, 600]}
  tmt_ba_errors:   {column: tmtba02_,  label: B minus A - errors as stored, range: [-10, 25]}
  tmt_ba_time_z:   {column: tmtba01b_, label: B minus A - time as a z-score (higher is better),   type: number, range: [-20, 10]}
  tmt_ba_errors_z: {column: tmtba02b_, label: B minus A - errors as a z-score (higher is better), type: number, range: [-50, 20]}

  # Percentile bands: the lower limit of the band, 0 to 95 (higher is better)
  tmt_a_time_band:          {column: tmta01a_, type: band, limits: [5, 10, 25, 50, 75, 90, 95], missing: {undefined: not_recorded},  label: Part A - time as a percentile band}
  tmt_b_time_band:          {column: tmtb01a_, type: band, limits: [5, 10, 25, 50, 75, 90, 95], missing: {undefined: not_recorded},  label: Part B - time as a percentile band}
  tmt_ba_time_band:         {column: tmtba01a_, type: band, limits: [5, 10, 25, 50, 75, 90, 95], missing: {undefined: not_recorded}, label: B minus A - time as a percentile band}

  # Years of education, read again from the neuropsychology form: the norms of the errors depend on them.
  tmt_education: {column: cclin08_, type: number, label: Years of education (for the norms), range: [0, 30], winsor: false, keep: false}

scores:
  tmt_a_errors:
    label: Part A - errors, corrected and uncorrected
    sum: [tmt_a_errors_corrected, tmt_a_errors_uncorrected]
  tmt_b_errors:
    label: Part B - errors, corrected and uncorrected
    sum: [tmt_b_errors_corrected, tmt_b_errors_uncorrected]
  # Percentile bands of the errors, read in the norm tables (norms/tmt_*.csv) from the number of
  # errors, the age at the visit and the years of education. The value is the lower limit of the band.
  tmt_a_errors_band:
    label: Part A - errors as a percentile band
    lookup: tmt_a_errors
    from: tmt_a_errors
    by: tmt_education
  tmt_b_errors_band:
    label: Part B - errors as a percentile band
    lookup: tmt_b_errors
    from: tmt_b_errors
    by: tmt_education
  tmt_b_perseverative_band:
    label: Part B - perseverative errors as a percentile band
    lookup: tmt_b_perseverative
    from: tmt_b_errors_perseverative
    by: tmt_education
  tmt_ba_errors_band:
    label: B minus A - errors as a percentile band
    lookup: tmt_ba_errors
    from: tmt_ba_errors
    by: tmt_education
  # Consistency checks only: the stored differences must be part B minus part A.
  tmt_ba_time_check: {sum: [tmt_b_time], minus: [tmt_a_time], compare: tmt_ba_time, keep: false}
  tmt_ba_errors_check: {sum: [tmt_b_errors], minus: [tmt_a_errors], compare: tmt_ba_errors, keep: false}
