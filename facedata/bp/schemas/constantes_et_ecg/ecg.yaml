instrument: ecg
title: Electrocardiogram
tab: CONSTANTES et ECG
section: ECG
status: reviewed
notes: >
  The intervals are in seconds in the dictionary. Part of them are written
  in milliseconds (413 for 0.413 s), more and more often since 2023, and a
  few in hundredths of a second (39 for 0.39 s). The unit is recognised from
  the size of the value and the cell is flagged unit_inferred.

  A value of 0 stands for "not measured" in the heart rate and the three
  intervals: missing code.

  The RR interval holds 76 values that fit no unit: 45 under 0.3, and 25
  from 30 to 300, which look like heart rates typed in the wrong field.
  They are out_of_range.

  The RR against the heart rate of the same ECG (decision D114 in
  PROGRESS.md, by the project lead). The two say the same thing: RR is 60
  divided by the heart rate. They agree within 10% on 81% of the 7,861
  visits that have both, and differ by more than 30% on 739. Two centres
  hold most of these: their RR fits the heart rate on 23% of their visits
  (73% to 97% in the other centres with more than 100 visits), with a
  median RR of 1.1 s for a rate of 70, while their QT is the one of the
  other centres. There the typed RR equals the heart rate divided by 60 on
  89% of the visits (58% in a third, small centre, 2% to 14% elsewhere):
  the help text of the field says to divide the heart rate by 60, the
  inverse of the right 60 / rate (defect A84 in docs/EXPORT_REQUESTS.md).
  The custom check rr_differs_from_rate flags these RR (check_failed); the
  value is kept.

  The question "ECG done" opens the four measures: none is filled after a
  no (2,538 visits). After a yes, 3,045 of 13,077 visits (23%) have no
  measure (26% to 31% in each period from 2019). 675 stored QTc have no RR
  (634 of them in 2013-2015, 659 in three centres); 611 of the 656 that
  have a QT and a
  heart rate are within 0.03 s of Bazett's formula on the heart rate, so
  these QTc were not computed by the form from a typed RR. The gate is
  delivered as it is: no change of encoding.

  QTc. The form computes it with Bazett's formula, QT divided by the square
  root of RR, on the numbers as typed. Two defects follow. When QT and RR
  are not on the same scale the stored QTc is absurd (0.013 or 13): 168
  stored values are out_of_range. And where the typed RR does not fit the
  heart rate, the stored QTc is wrong: in the two centres above its median
  is 0.37, against 0.40 to 0.42 elsewhere, and a third are under 0.35.

  qtc_bazett is therefore computed from the harmonised QT and the heart
  rate of the ECG (RR = 60 / rate; custom function corrected_qt), and from
  the typed RR only where there is no heart rate (58 visits). It exists on
  8,963 visits, against 8,470 valid stored values; in the two centres its
  median is 0.42 and under 1% are below 0.35, as elsewhere. It differs
  from the stored one by more than 0.03 s on 1,185 visits (score_mismatch),
  737 of them in the two centres. qtc_stored is the stored value on the
  harmonised scale.

  The form also asks whether the ECG was sent to a cardiologist and whether
  an opinion was requested; the extraction does not hold these two answers.

  No value is winsorised (winsor: false on the heart rate, the QT, the RR and
  the stored QTc, and no winsor on the score qtc_bazett), the user's decision
  of 2026-11-21 for BP, SZ and DR: the hard ranges remove the impossible
  values, and the values beyond the 1st and 99th percentiles are real
  measures; a corrected QT above 0.5 s is the prolongation that a study of
  drug safety looks for, and the default limit (about 0.50 s) brought it back.
  Cells no longer clipped: heart rate 190, QT 141, RR 158, stored QTc 167,
  computed QTc 180 (winsorised 836 -> 0).

defaults: {type: number, unit: s, missing: {0: not_recorded}}

variables:
  ecg_done:
    column: rad_electrocardiogramme
    label: Electrocardiogram done
    type: category
    codes: {Oui: yes, Non: no}
  ecg_heart_rate: {column: eghrmn, label: Heart rate on the ECG (beats per minute), unit: bpm, range: [30, 220], winsor: false}
  qt_interval:
    column: qt
    label: QT interval
    units:
      s: {factor: 1, expect: [0.2, 0.7]}
      cs: {factor: 0.01, expect: [20, 70]}
      ms: {factor: 0.001, expect: [200, 700]}
    range: [0.2, 0.7]
    winsor: false
  rr_interval:
    column: rr
    label: RR interval
    units:
      s: {factor: 1, expect: [0.3, 2.0]}
      ms: {factor: 0.001, expect: [300, 2000]}
    range: [0.3, 2.0]
    winsor: false
  qtc_stored:
    column: qtc
    label: Corrected QT interval as stored by the EMR
    units:
      s: {factor: 1, expect: [0.2, 0.7]}
      cs: {factor: 0.01, expect: [20, 70]}
      ms: {factor: 0.001, expect: [200, 700]}
    range: [0.2, 0.7]
    winsor: false

scores:
  qtc_bazett:
    label: "Corrected QT interval (Bazett), from the QT and the heart rate of the ECG, or the RR where there is no rate"
    custom: corrected_qt
    compare: qtc_stored
    compare_tolerance: 0.03
    range: [0.2, 0.7]

checks:
  rr_interval: rr_differs_from_rate
