instrument: pression_arterielle
title: Blood pressure and heart rate, lying and standing
tab: CONSTANTES et ECG
section: Pression artérielle / fréquence cardiaque
status: reviewed
notes: >
  Blood pressure is in mmHg. In six centres some values are written in cmHg
  (12 for 120): 34 to 40 per column, none since 2022. A systolic pressure
  from 5 to 26, or a diastolic pressure from 3 to 18, can only be cmHg; it
  is multiplied by 10 and flagged unit_inferred (no diastolic pressure is
  typed 17 or 18).

  One lying heart rate is 720 and one standing systolic pressure is
  impossible: out_of_range.

  The values hold together: the systolic pressure is not above the diastolic
  one on 7 visits of 16,145, the standing heart rate is 7 beats above the
  lying one (median), and the systolic pressure falls by 20 mmHg or more on
  standing on 3.7% of the visits. One centre records the pressure on 17% of
  its visits; the others on 55% to 85%.

defaults: {type: number, unit: mmHg}

variables:
  systolic_supine:
    column: sysbpsupine
    label: Systolic blood pressure, lying
    units:
      mmHg: {factor: 1, expect: [50, 260]}
      cmHg: {factor: 10, expect: [5, 26]}
    range: [50, 260]
  diastolic_supine:
    column: diabpsupine
    label: Diastolic blood pressure, lying
    units:
      mmHg: {factor: 1, expect: [30, 180]}
      cmHg: {factor: 10, expect: [3, 18]}
    range: [30, 180]
  systolic_standing:
    column: sysbpstanding
    label: Systolic blood pressure, standing
    units:
      mmHg: {factor: 1, expect: [50, 260]}
      cmHg: {factor: 10, expect: [5, 26]}
    range: [50, 260]
  diastolic_standing:
    column: diabpstanding
    label: Diastolic blood pressure, standing
    units:
      mmHg: {factor: 1, expect: [30, 180]}
      cmHg: {factor: 10, expect: [3, 18]}
    range: [30, 180]
  heart_rate_supine:   {column: hrsupine,   label: Heart rate lying (beats per minute),    unit: bpm, range: [30, 220]}
  heart_rate_standing: {column: hrstanding, label: Heart rate standing (beats per minute), unit: bpm, range: [30, 220]}
