instrument: social
title: Social situation at inclusion
tab: SOCIAL
section: MODULE SOCIAL
status: draft
notes: >
  The social situation of the patient on the day of the inclusion visit:
  marital status, education, work, housing, household, income and debts.
  Filled once, at the inclusion visit, for 5,000 patients. One column, the
  class of the job, is filled at the follow-up visits instead.

  Education. The level reached, as a list from the first year of primary
  school to the doctorate. The export writes most levels as a number (CP to
  CM2 = 1 to 5, collège = 6 to 9, lycée = 10 to 12, CAP = 13, BEP = 14, BAC+1
  to BAC+5 = 15 to 19, doctorate = 20) and two as words, "BAC" and
  "Certificat d'études". The numbers are codes of a list, not years of
  schooling (a CAP is 13, the last year of lycée 12), so the level is
  delivered as a category. The years of education asked on the
  neuropsychology form agree with it (a median of 12 years for "BAC", 17
  for BAC+5).

  Work status. The dictionary gives seven codes, and code 3 (student) never
  appears. Code 6 (other) is given to 23% of the patients, a quarter of them
  under 23: the students are probably there. Delivered with the dictionary's
  labels. The questions on the current job are filled for the employed
  only, and the end of the last job for the unemployed only.

  Main source of income. The dictionary says 7 = no income and 8 = other,
  and code 8 never appears. Code 7 is given to 23% of the patients, among
  them three quarters of the retired, who have a pension: it holds "other"
  as well as "no income". It is delivered as none_or_other (open question
  O35 in PROGRESS.md).

  Household. The number of persons under the same roof is 1 for most of the
  patients who live alone and 0 for 131 of them: some count themselves and
  some do not, and for the others the cell does not tell. Delivered as
  written; a number above 20 is out of range (5 cells).

  Durations of work, in years. A longest period or a total above 60 years is
  out of range (5 cells, up to 2,223). 39 totals are longer than the
  patient's age allows and 40 longest periods are longer than the total;
  delivered as written.

  End of the last job. 1000-01-01 is the form's placeholder (162 cells, from
  2023); 15 dates are after the visit.

  Not loaded (ignored.yaml). empjob, the class of the current job, holds two
  of its nine codes only (5 for 110 patients, 1 for 12, of 2,300 employed):
  the export loses the others. protec, the legal protection measure, is the
  column social_protec of the PATIENT tab again; it is delivered there, as
  protection_measure.

  The class of the job at follow-up (empjob_psytaitement) is a list of 17
  classes, filled on 214 follow-up visits from 2021.

variables:
  marital_status:
    column: maristat
    label: Marital status
    type: category
    codes: {1: single, 2: couple, 3: separated, 4: divorced, 5: widowed}
  education_level:
    column: edulevel
    label: Education level reached
    type: category
    codes:
      1: primary_1
      2: primary_2
      3: primary_3
      4: primary_4
      5: primary_5
      "Certificat d'études": primary_certificate
      6: lower_secondary_1
      7: lower_secondary_2
      8: lower_secondary_3
      9: lower_secondary_4
      10: upper_secondary_1
      11: upper_secondary_2
      12: upper_secondary_3
      13: cap
      14: bep
      BAC: bac
      15: bac_plus_1
      16: bac_plus_2
      17: bac_plus_3
      18: bac_plus_4
      19: bac_plus_5
      20: doctorate

  work_status:
    column: stprof
    label: Work status
    type: category
    codes: {0: unemployed, 1: employed, 2: retired, 3: student, 4: disability_pension, 5: homemaker, 6: other}
  job_duration:
    column: jobdur
    label: Time in work without a break of more than six months (the employed)
    type: category
    codes:
      "<1 an": under_1_year
      "1 an": 1_year
      "2 ans": 2_years
      "3 ans": 3_years
      "4 ans": 4_years
      "5 ans": 5_years
      "6 ans": 6_years
      "7 ans": 7_years
      "8 ans": 8_years
      "9 ans": 9_years
      "10 ans": 10_years
      "entre 10 et 20 ans": 10_to_20_years
      "entre 20 et 30 ans": 20_to_30_years
  job_full_time: {column: jobclas, label: Full-time job (the employed), type: item, range: [0, 1], codes: {Oui: 1, Non: 0}}
  last_job_end_date:
    column: stprof_scdtc
    label: End of the last job (the unemployed)
    type: date
    range: [1950-01-01, 2026-12-31]
  first_job_age: {column: profage, label: Age at the first job, type: item, range: [10, 70]}
  longest_job_years: {column: profdur, label: Longest period of work, type: number, unit: years, range: [0, 60]}
  total_work_years: {column: durtot, label: Total duration of work over the life, type: number, unit: years, range: [0, 60]}

  housing:
    column: vie
    label: Main housing
    type: category
    codes:
      "Propriétaire": owner
      "Locataire (loyer auto financé)": tenant
      "Locataire (loyer payé par un tiers)": tenant_rent_paid_by_other
      "Vit avec ses parents": with_parents
      "Institution": institution
      "Appartement thérapeutique": therapeutic_flat
      "Logement associatif": association_housing
      "Foyer Hôtel": hostel
      "Foyer éducateur": supervised_home
      "Autre": other
  housing_other: {column: vieautre, label: "Other housing, as written", type: text}
  living_arrangement:
    column: lvsbjind
    label: Way of living
    type: category
    codes: {1: alone, 2: with_parents, 3: own_family_home, 4: with_children, 5: with_relatives, 6: shared_flat, 7: institution, 8: other}
  living_arrangement_other: {column: lvsbjind_specifier, label: "Other way of living, as written", type: text}
  household_size: {column: nbpers, label: Number of persons under the same roof, type: item, range: [0, 20]}
  closest_person:
    column: lien
    label: Person the patient spends most time with
    type: category
    codes:
      "Conjoint": spouse
      "Concubin": partner
      "Enfant": child
      "Mère": mother
      "Père": father
      "Frère-Soeur": sibling
      "Grand-parent": grandparent
      "Autres apparentés": other_relative
      "Ami(e)": friend
      "Colocataire": flatmate
      "Autre": other

  income_source:
    column: saltyp
    label: Main source of income
    type: category
    codes:
      1: salary
      2: minimum_income
      3: disability_allowance
      4: disability_pension
      5: unemployment_benefit
      6: housing_benefit
      7: none_or_other
      8: other
  debt_level:
    column: dette
    label: Level of debt
    type: category
    codes:
      "Aucun": none
      "Endettement facile à gérer": easy_to_manage
      "Endettement difficile à gérer": difficult_to_manage
      "Endettement très difficile à gérer": very_difficult_to_manage

  # Filled at the follow-up visits, from 2021.
  job_class_fu:
    column: empjob_psytaitement
    label: Class of the job, at follow-up
    type: category
    codes:
      "Agriculteur exploitant": farmer
      "Artisan": craftsperson
      "Commerçant et assimilé": shopkeeper
      "Profession libérale et assimilé": liberal_profession
      "Cadre de la fonction publique, profession intellectuelle et artistique": public_executive_or_intellectual
      "Cadre d'entreprise": company_executive
      "Profession intermédiaire de l'enseignement, de la santé, de la fonction publique et assimilés": intermediate_public
      "Profession intermédiaire administrative et commerciale des entreprises": intermediate_company
      "Technicien": technician
      "Contremaître, agent de maîtrise": supervisor
      "Employé de la fonction publique": public_employee
      "Employé administratif d'entreprise": office_employee
      "Employé de commerce": sales_employee
      "Personnel de service direct aux particuliers": personal_service_worker
      "Ouvrier qualifié": skilled_worker
      "Ouvrier non qualifiés": unskilled_worker
      "Ouvrier agricole": farm_worker
