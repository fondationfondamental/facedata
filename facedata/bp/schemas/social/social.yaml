instrument: social
title: Social situation at inclusion
tab: SOCIAL
section: MODULE SOCIAL
status: reviewed
notes: >
  The social situation of the patient on the day of the inclusion visit:
  marital status, education, work, housing, household, income and debts.
  Filled once, at the inclusion visit (5,045 patients; no follow-up or
  screening visit holds any of these questions). One column, the class of
  the job, is filled at the follow-up visits instead. The way of living,
  the housing, the income and the debts are asked from 2010-2011. The tab
  is held by 29% and 39% of the inclusions of centre C in 2016-18 and
  2019-21 (71% to 89% before and after), by 23% of those of centre F in
  2019-21, and hardly by centres A and H from 2022 (O40, DM-6).

  Education. The level reached, as a list from the first year of primary
  school to the doctorate. The export writes most levels as a number (CP to
  CM2 = 1 to 5, collège = 6 to 9, lycée = 10 and 11, CAP = 13, BEP = 14,
  BAC+1 to BAC+5 = 15 to 19, doctorate = 20) and two as words, "BAC" and
  "Certificat d'études". The form has no Terminale, so code 12 never
  occurs. The numbers are codes of a list, not years of schooling (a CAP is
  13, the 1ère 11), so the level is delivered as a category. The years of
  education asked on the neuropsychology form agree with it (a median of 12
  years for "BAC", 17 for BAC+5).

  Work status. The form offers seven answers: without a job, in work, at
  home, retired, student, pension, other (decision D94 in PROGRESS.md).
  Code 3 (student) never appears in the extraction: the export tests
  "Étudiant" with an accent while the form stores "Etudiant", and writes 6
  for every other answer, an empty one included (DM-13). Code 6 is given to
  1,150 patients, 23%, with a median age of 30 and 39% under 25; 7 of them
  answered no other social question. Its share rises from 20%-23% of the
  inclusions until 2021 to 34% in 2022-23 and 27% from 2024. Code 6 is
  delivered as student_or_other until the export is corrected. The other
  codes behave as the dictionary says: the questions on the current job are
  filled for code 1 only (94%), the retired (code 2) have a median age of
  65, and 143 of the 188 patients with code 4 live on a disability pension.
  The longest period of work is asked only when the current period of work
  is not the longest: for the employed an empty cell may mean that the
  current period (job_duration) is the longest.

  Main source of income. The form offers seven answers: salary, RMI or RSA,
  AAH, disability pension, unemployment benefit, APL, other. It has no "no
  income" and no eighth answer, so the dictionary's "7 = no income, 8 =
  other" is not the form: code 7 is "other" (decision D94). It is given to
  1,071 patients, among them 187 of the 288 retired, who have a pension.
  The SZ form does have "no income" as its seventh answer: do not compare
  code 7 between the cohorts.

  Household. The number of persons under the same roof is 1 for most of the
  patients who live alone and 0 for 134 of them: some count themselves and
  some do not. Centre C writes 0 for 42 of its 99 patients who live alone,
  the other centres for 3% to 12%. The number is typed as text and the
  export keeps its digits, so the five values above 20 (out of range) are
  probably two numbers run together.

  Durations of work, in years. Not winsorised: the long careers of the
  older patients are real (as in DR). A longest period or a total above 60
  years is out of range (5 cells, up to 2,223). 42 totals are longer than
  the age at inclusion minus 14 years (11 longer than the age itself), and
  51 longest periods are longer than the total (39 by more than a year);
  delivered as written.

  End of the last job. 1000-01-01 is the date the application writes in an
  empty date since July 2024 (D98): 176 cells, 171 of them from 2024, 168
  on patients with another work status, who are not asked the question. 15
  dates are after the visit.

  Debt. The answer "Non renseigné" of the form is delivered as missing (not
  recorded): 153 inclusions, 85 of them until 2012.

  Not loaded (ignored.yaml). empjob, the class of the current job, holds two
  of its nine codes only (5 for 110 patients, 1 for 12, of 2,308 employed):
  the export looks the 18 classes of the form (the second level of the INSEE
  nomenclature) up in the nine classes of the dictionary, whose labels are
  other ones, and keeps two (D74, D99). The mapping to the nine classes is
  in QUESTIONS.md (FU-8). protec, the legal protection measure, is not
  delivered (decision D111 in PROGRESS.md).

  Not in the extraction: the date of the social assessment, the class of
  the last job of a patient without one (asked for in FU-8) and, at
  follow-up, whether the work status changed and the new status. The sick
  leave questions of the form are read in the tab SOIN SUIVI HOSP ARRET
  TRAVAIL. Three cells of the other way of living hold only an escaped line
  break and are read as empty.

  The class of the job at follow-up (empjob_psytaitement) uses the 18
  classes of the inclusion form (no patient has "Chef d'entreprise de 10
  salariés ou plus"). It is filled on 219 follow-up visits of 200 patients
  from 2021, and asked only when the work status changed since the last
  visit and the new status is "in work". The change and the new status are
  not exported, so an empty cell does not say that the patient does not
  work.

variables:
  marital_status:
    column: maristat
    label: Marital status
    type: category
    codes: {1: single, 2: couple, 3: separated, 4: divorced, 5: widowed}
  education_level:
    column: edulevel
    label: Education level reached
    type: category
    codes:
      1: primary_1
      2: primary_2
      3: primary_3
      4: primary_4
      5: primary_5
      "Certificat d'études": primary_certificate
      6: lower_secondary_1
      7: lower_secondary_2
      8: lower_secondary_3
      9: lower_secondary_4
      10: upper_secondary_1
      11: upper_secondary_2
      12: upper_secondary_3
      13: cap
      14: bep
      BAC: bac
      15: bac_plus_1
      16: bac_plus_2
      17: bac_plus_3
      18: bac_plus_4
      19: bac_plus_5
      20: doctorate

  work_status:
    column: stprof
    label: Work status
    type: category
    codes: {0: unemployed, 1: employed, 2: retired, 3: student, 4: disability_pension, 5: homemaker, 6: student_or_other}
  job_duration:
    column: jobdur
    label: Time in work without a break of more than six months (the employed)
    type: category
    codes:
      "<1 an": under_1_year
      "1 an": 1_year
      "2 ans": 2_years
      "3 ans": 3_years
      "4 ans": 4_years
      "5 ans": 5_years
      "6 ans": 6_years
      "7 ans": 7_years
      "8 ans": 8_years
      "9 ans": 9_years
      "10 ans": 10_years
      "entre 10 et 20 ans": 10_to_20_years
      "entre 20 et 30 ans": 20_to_30_years
  job_full_time: {column: jobclas, label: Full-time job (the employed), type: item, range: [0, 1], codes: {Oui: 1, Non: 0}}
  last_job_end_date:
    column: stprof_scdtc
    label: End of the last job (the unemployed)
    type: date
    range: [1950-01-01, 2026-12-31]
  first_job_age: {column: profage, label: Age at the first job, type: item, range: [10, 70]}
  longest_job_years: {column: profdur, label: "Longest period of work, when the current one is not the longest", type: number, unit: years, range: [0, 60], winsor: false}
  total_work_years: {column: durtot, label: Total duration of work over the life, type: number, unit: years, range: [0, 60], winsor: false}

  housing:
    column: vie
    label: Main housing
    type: category
    codes:
      "Propriétaire": owner
      "Locataire (loyer auto financé)": tenant
      "Locataire (loyer payé par un tiers)": tenant_rent_paid_by_other
      "Vit avec ses parents": with_parents
      "Institution": institution
      "Appartement thérapeutique": therapeutic_flat
      "Logement associatif": association_housing
      "Foyer Hôtel": hostel
      "Foyer éducateur": supervised_home
      "Résidence post-cure": post_cure_residence
      "Autre": other
  housing_other: {column: vieautre, label: "Other housing, as written", type: text}
  living_arrangement:
    column: lvsbjind
    label: Way of living
    type: category
    codes: {1: alone, 2: with_parents, 3: own_family_home, 4: with_children, 5: with_relatives, 6: shared_flat, 7: institution, 8: other}
  living_arrangement_other: {column: lvsbjind_specifier, label: "Other way of living, as written", type: text}
  household_size: {column: nbpers, label: Number of persons under the same roof, type: item, range: [0, 20]}
  closest_person:
    column: lien
    label: Person the patient spends most time with
    type: category
    codes:
      "Conjoint": spouse
      "Concubin": partner
      "Enfant": child
      "Mère": mother
      "Père": father
      "Frère-Soeur": sibling
      "Grand-parent": grandparent
      "Autres apparentés": other_relative
      "Ami(e)": friend
      "Colocataire": flatmate
      "Autre": other

  income_source:
    column: saltyp
    label: Main source of income
    type: category
    codes:
      1: salary
      2: minimum_income
      3: disability_allowance
      4: disability_pension
      5: unemployment_benefit
      6: housing_benefit
      7: other
  debt_level:
    column: dette
    label: Level of debt
    type: category
    codes:
      "Aucun": none
      "Endettement facile à gérer": easy_to_manage
      "Endettement difficile à gérer": difficult_to_manage
      "Endettement très difficile à gérer": very_difficult_to_manage

  # Filled at the follow-up visits, from 2021.
  job_class_fu:
    column: empjob_psytaitement
    label: Class of the job, at follow-up
    type: category
    codes:
      "Agriculteur exploitant": farmer
      "Artisan": craftsperson
      "Commerçant et assimilé": shopkeeper
      "Chef d'entreprise de 10 salariés ou plus": company_head
      "Profession libérale et assimilé": liberal_profession
      "Cadre de la fonction publique, profession intellectuelle et artistique": public_executive_or_intellectual
      "Cadre d'entreprise": company_executive
      "Profession intermédiaire de l'enseignement, de la santé, de la fonction publique et assimilés": intermediate_public
      "Profession intermédiaire administrative et commerciale des entreprises": intermediate_company
      "Technicien": technician
      "Contremaître, agent de maîtrise": supervisor
      "Employé de la fonction publique": public_employee
      "Employé administratif d'entreprise": office_employee
      "Employé de commerce": sales_employee
      "Personnel de service direct aux particuliers": personal_service_worker
      "Ouvrier qualifié": skilled_worker
      "Ouvrier non qualifiés": unskilled_worker
      "Ouvrier agricole": farm_worker
