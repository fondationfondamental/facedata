instrument: bilan_hepatique
title: Liver tests
tab: BILAN BIOLOGIQUE
section: Bilan hépatique
status: draft
notes: >
  How the units are read (the same in every schema of this tab). The unit
  column is filled by the form with a default label, also where there is no
  result, so it proves little. Each analyte lists the units that occur, with
  the values one expects on each scale. A value that fits its label keeps it.
  A value that cannot be on the labelled scale and fits exactly one other is
  converted and flagged (unit_inferred, or unit_doubt when it was possible but
  unlikely under its label). A value that fits no scale is left as it is and
  the hard range decides (out_of_range).

  Bilirubin in µmol/L and in mg/L are on almost the same scale (factor 1.71),
  so only the label can tell them apart: 182 results are labelled mg/L. The
  form also offers "mmol/L" (28 results); a bilirubin of 7 mmol/L does not
  exist, so that label is read as µmol/L. 360 results are left-censored
  ("<8", "<3").

  Alkaline phosphatase: 37 results between 0.2 and 5 are in µkat/L (1 µkat/L
  = 60 UI/L).

defaults: {type: number}

variables:
  alkaline_phosphatase:
    label: Alkaline phosphatase
    column: alp_lbstresc
    unit_column: alp_lborresu
    unit: UI/L
    units:
      UI/L: {factor: 1, expect: [10, 1000]}
      µkat/L: {factor: 60, expect: [0.2, 5]}
    range: [10, 1000]

  ast:
    label: Aspartate aminotransferase (ASAT)
    column: ast_lbstresc
    unit_column: ast_lborresu
    unit: UI/L
    units:
      UI/L: {factor: 1, expect: [1, 3000]}
    range: [1, 3000]

  alt:
    label: Alanine aminotransferase (ALAT)
    column: alt_lbstresc
    unit_column: alt_lborresu
    unit: UI/L
    units:
      UI/L: {factor: 1, expect: [1, 3000]}
    range: [1, 3000]

  bilirubin:
    label: Total bilirubin
    column: bili_lbstresc
    unit_column: bili_lborresu
    unit: µmol/L
    units:
      µmol/L: {factor: 1, expect: [0, 500], aliases: [mmol/L]}
      mg/L: {factor: 1.71, expect: [0, 300]}
    range: [0, 500]
    winsor: [0, 0.99]
    note: The lower tail is censored, so only the upper tail is winsorised.

  ggt:
    label: Gamma-glutamyl transferase (GGT)
    column: ggt_lbstresc
    unit_column: ggt_lborresu
    unit: UI/L
    units:
      UI/L: {factor: 1, expect: [1, 3000]}
    range: [1, 3000]
