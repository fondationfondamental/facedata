instrument: bilan_thyroidien
title: Thyroid tests
tab: BILAN BIOLOGIQUE
section: Bilan thyroidien
status: reviewed
implausible_visits: 3
implausible_pool: biology
notes: >
  How the units are read (the same in every schema of this tab). The unit
  column is filled by the form with a default label, also where there is no
  result, so it proves little. Each analyte lists the units that occur, with
  the values one expects on each scale. A value that fits its label keeps it.
  A value that cannot be on the labelled scale and fits exactly one other is
  converted and flagged (unit_inferred, or unit_doubt when it was possible but
  unlikely under its label). A value that fits no scale is left as it is and
  the hard range decides (out_of_range).

  TSH. The three labels of the form (µUI/L, mUI/L, microUI/ml) hold values on
  the same scale, with the same median: the default label "µUI/L" is a
  misprint for µUI/mL, which is the same as mUI/L. They are one unit here.

  Free T4: 107 results between 0.3 and 3 are in ng/dL (1 ng/dL = 12.87
  pmol/L): 100 under the default pmol/L label and 7 labelled ng/dL. The 10
  results between 3 and 4 fit ng/dL and pg/mL alike, so they keep their
  pmol/L label. Free T3 and free T4 in pg/mL overlap the pmol/L scale and
  are recognised by their label only.

  The TSH field of the form rejects a value above 10 (A27 in
  EXPORT_REQUESTS.md): BP has 44 TSH above 10 among 8,608 results before
  2022 and none among 3,443 from 2022. The TSH tail from 2022 is capped by
  the form, so a mean, a share above a limit or a maximum is not comparable
  before and after 2022. A TSH of 0 is nothing measured (one result):
  missing code, not_recorded, in place of the delivered clip value.

  Shifted block and pool. This schema belongs to the pool biology
  (implausible_visits: 3, see biochimie). With three analytes it could not use
  the rule alone (a visit would need all three impossible), but the pool
  counts the impossible values of the seven laboratory schemas of BP: a visit
  with three or more loses its TSH, free T3 and free T4 and gets
  visit_removed. The pool removes 29 visits in all (998 cells); this schema
  loses 49 cells on 25 visits (TSH 23, free T3 7, free T4 19). In the shifted
  block of one centre the free T3 is impossible (a blood-count value above 30
  pmol/L) on 19 of the 24 visits; the TSH and the free T4 of the 20 block
  visits that the pool removes go with them, and the 4 that escape hold none
  of the three.

  Winsorising (step 12) clips each number at its 1st and 99th percentile, so a
  clinical tail becomes the cut value (in BP a TSH above 7.9 mUI/L is
  delivered as 7.9, a free T3 above 7.2 pmol/L as 7.2 and a free T4 above 21.6
  pmol/L as 21.6: 223 to 258 values per analyte are clipped, and from 2022 the
  form already caps the TSH at 10), while the hard range ([0, 150], [1.5, 30]
  and [3, 100]) is what removes impossible values.

defaults: {type: number}

variables:
  tsh:
    label: Thyroid-stimulating hormone (TSH)
    column: tsh_lbstresc
    unit_column: tsh_lborresu
    unit: mUI/L
    units:
      mUI/L: {factor: 1, expect: [0, 150], aliases: [µUI/L, microUI/ml, µUI/mL]}
    range: [0, 150]
    missing: {"0": not_recorded, "0.0": not_recorded, "00": not_recorded}      # 0 where nothing was measured

  free_t3:
    label: Free T3
    column: t3fr_lbstresc
    unit_column: t3fr_lborresu
    unit: pmol/L
    units:
      pmol/L: {factor: 1, expect: [1.5, 30]}
      pg/mL: {factor: 1.536, expect: [1, 20], aliases: [ng/L]}
    range: [1.5, 30]

  free_t4:
    label: Free T4
    column: t4fr_lbstresc
    unit_column: t4fr_lborresu
    unit: pmol/L
    units:
      pmol/L: {factor: 1, expect: [4, 80]}
      ng/dL: {factor: 12.87, expect: [0.3, 4]}
      pg/mL: {factor: 1.287, expect: [3, 60]}
    range: [3, 100]
