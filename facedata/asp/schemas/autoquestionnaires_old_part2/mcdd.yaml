instrument: mcdd
title: "Multiple Complex Developmental Disorder criteria (from the column names)"
tab: autoquestionnaires_old_part2
section: old questionnaires
status: draft
notes: >
  A first box and fifteen criteria answered 0 or 1: 343 inclusion visits (89 of children) and 45 follow-up visits, from 2013 to 2021.
  It belongs to the old set of forms.

  Named from its columns (mcdd): the criteria of the multiple complex
  developmental disorder, likely. The thesaurus gives the answers (1 yes, 0 no,
  9 not known) and not the wording of the criteria; a 9 is read as "not known".
  No score is stored.

  An instrument of the ASP cohort only.

