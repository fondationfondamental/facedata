instrument: hama
title: "Hamilton Anxiety Rating Scale (HAM-A)"
tab: autoquestionnaires_old_part2
section: old questionnaires
status: draft
notes: >
  Fourteen items rated from 0 to 4 and a total: 277 inclusion visits (55 of children) and 82 follow-up visits, from 2013 to 2021.
  It belongs to the old set of forms.

  Identified from its name and its fourteen items as the Hamilton Anxiety
  Rating Scale, sure.

  The scores, each fitted on the data:

  - HAM-A total (0 to 56): the sum of 14 items, equal to the stored score on 354 of 354 complete visits; typed without its items on fewer than five visits, where it is kept as stored.

  An instrument of the ASP cohort only.

defaults: {type: item, range: [0, 4]}

variables:
  hama01: {column: hamanx1, label: "HAM-A, item 1"}
  hama02: {column: hamanx2, label: "HAM-A, item 2"}
  hama03: {column: hamanx3, label: "HAM-A, item 3"}
  hama04: {column: hamanx4, label: "HAM-A, item 4"}
  hama05: {column: hamanx5, label: "HAM-A, item 5"}
  hama06: {column: hamanx6, label: "HAM-A, item 6"}
  hama07: {column: hamanx7, label: "HAM-A, item 7"}
  hama08: {column: hamanx8, label: "HAM-A, item 8"}
  hama09: {column: hamanx9, label: "HAM-A, item 9"}
  hama10: {column: hamanx10, label: "HAM-A, item 10"}
  hama11: {column: hamanx11, label: "HAM-A, item 11"}
  hama12: {column: hamanx12, label: "HAM-A, item 12"}
  hama13: {column: hamanx13, label: "HAM-A, item 13"}
  hama14: {column: hamanx14, label: "HAM-A, item 14"}
  hama_total_stored: {column: hamanx_score, type: number, range: [0, 56], winsor: false, keep: false, label: "HAM-A total (0 to 56), as stored"}

scores:
  hama_total:
    label: "HAM-A total (0 to 56)"
    sum: [hama01, hama02, hama03, hama04, hama05, hama06, hama07, hama08, hama09, hama10, hama11, hama12, hama13, hama14]
    compare: hama_total_stored
    otherwise: hama_total_stored
