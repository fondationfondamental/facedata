instrument: adhd_history
title: "Attention deficit hyperactivity disorder, THADA (section of the old forms)"
tab: autoquestionnaires_old_part2
section: old questionnaires
status: reviewed
notes: >
  Twenty-one questions answered from 1 to 3, then the school years, the age of
  the first signs, and whether help, a diagnosis and a medication were given:
  200 inclusion visits (49 of children) and 49 follow-up visits, from 2010 to 2021 (245 of the 249 in 2013 to 2020). It belongs to the old set of forms.

  The form 219 is titled "Trouble hyperactif avec déficit de l'attention"
  (THADA, attention deficit hyperactivity disorder): 21 questions answered 1
  never, 2 in the past, 3 in the last week, then questions on school, help and
  treatment. No score is stored.

  **Year and centre.** 12 of the 30 variables reach 0.5 or more (9 by year, 10 by centre), all of
  them items answered 1 to 3 or the age of the first signs; no score is stored. Children are 96%
  of the visits of centre C, 2% of D and none of E. Between the centres 12 of the 26 variables
  compared differ beyond chance (permutation test, p below 0.01), among the adults of D and E only
  1 does; between years 2 do, 1 among children (thad10) and none among adults: the age mix.

  An instrument of the ASP cohort only.

