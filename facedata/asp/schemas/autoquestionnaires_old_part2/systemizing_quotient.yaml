instrument: systemizing_quotient
title: "Systemizing Quotient (SQ)"
tab: autoquestionnaires_old_part2
section: old questionnaires
status: draft
notes: >
  Sixty items and a score, filled by adults: 166 inclusion visits (18 of children) and fewer than five follow-up visits,
  from 2013 to 2018. It belongs to the old set of forms.

  Identified from its name, its sixty items and its score as the Systemizing
  Quotient (Baron-Cohen and others, 2003), sure.

  The answers are stored from 1 (definitely agree) to 4 (definitely disagree),
  and the score is not their sum: an answer on the scored side counts 2 points when it is definite and 1 when it is slight. The key was fitted on the data and is
  the published one: agreement scores on 20 items (1, 4, 5, 7, 13, 15, 19, 20, 25, 29, 30, 33, 34, 37, 41, 44, 48, 49, 53 and 55),
  disagreement on 20 (6, 11, 12, 18, 23, 24, 26, 28, 31, 32, 35, 38, 40, 42, 43, 45, 51, 56, 57 and 60), and 20 items are not scored (2, 3, 8, 9, 10, 14, 16, 17, 21, 22, 27, 36, 39, 46, 47, 50, 52, 54, 58 and 59). It
  reproduces the stored score on 152 of 158 visits that hold every item. The score is typed without the items on fewer than five visits, where it is kept as stored.

  An instrument of the ASP cohort only.

