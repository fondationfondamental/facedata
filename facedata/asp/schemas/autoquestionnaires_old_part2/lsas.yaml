instrument: lsas
title: "Liebowitz Social Anxiety Scale (LSAS)"
tab: autoquestionnaires_old_part2
section: old questionnaires
status: reviewed
notes: >
  Twenty-four situations, each rated from 0 to 3 for anxiety (columns _a) and
  for avoidance (columns _e), and six scores: 190 inclusion visits (48 of children) and 73 follow-up visits, from 2009 to 2021 (253 of the 263 in 2013 to 2018).
  It belongs to the old set of forms.

  Identified from its name and its twenty-four situations as the Liebowitz
  Social Anxiety Scale, sure. The form prints (P) or (S) after each situation:
  twelve situations of performance (1, 2, 3, 4, 6, 8, 9, 13, 14, 16, 17 and 20) and twelve of
  social interaction (5, 7, 10, 11, 12, 15, 18, 19, 21, 22, 23 and 24). The script
  of the form counts the same twelve and twelve, and so does the French validation of the
  scale (Yao and others, 1999, read from its abstract). Some literature counts thirteen
  situations of performance and eleven of social interaction, the situation 21 being in the
  performance; no source was read for that split (to verify). The sub-scores delivered follow the form.

  - anxiety, the 24 situations: 24 items, equal to the stored score on 235 of 235 visits.
  - avoidance, the 24 situations: 24 items, equal to the stored score on 235 of 235 visits.
  - anxiety in social interaction: 12 items (situations 5, 7, 10, 11, 12, 15, 18, 19, 21, 22, 23 and 24), equal to the stored score on 247 of 247 visits.
  - avoidance of social interaction: the same 12 situations, equal to the stored score on 242 of 242 visits.
  - anxiety in performance: 12 items (situations 1, 2, 3, 4, 6, 8, 9, 13, 14, 16, 17 and 20), equal to the stored score on 253 of 253 visits.
  - avoidance of performance: the same 12 situations, equal to the stored score on 244 of 244 visits.

  The total of the scale (anxiety plus avoidance, 0 to 144) is not stored and
  is computed here. The form has no age limit: 112 of the 263 visits with an
  item are of patients under 18 (the youngest is 6 years old).

  **Year and centre.** 39 of the 55 variables reach 0.5 or more (31 by year, 37 by centre), the
  six scores at 0.08 to 0.50 by year and 0.31 to 0.45 by centre. The age mix explains them:
  children are 89% of the visits of centre C, 3% of D and none of E, and the median total is 51 in
  C, 78 in D and 81 in E (79 and 81 among the adults of D and E). Between centres 36 of the 55
  variables differ beyond chance (permutation test, p below 0.01), none among adults; between
  years 6 do, 1 among adults and none among children.

  An instrument of the ASP cohort only.

