instrument: spq
title: "Schizotypal Personality Questionnaire (SPQ)"
tab: autoquestionnaires_old_part2
section: old questionnaires
status: draft
notes: >
  Seventy-four items answered 0 or 1, nine sub-scale scores and a total:
  138 inclusion visits (50 of children) and 71 follow-up visits, from 2013 to 2018. It belongs to the old set of forms.

  Identified from its name, its seventy-four items and its nine sub-scales as
  the Schizotypal Personality Questionnaire (Raine, 1991), sure: the nine
  stored scores have the items of the published sub-scales, in their order.

  The scores, each fitted on the data:

  - SPQ ideas of reference: the sum of 9 items (1, 10, 19, 28, 37, 45, 53, 60 and 63), equal to the stored score on 184 of 184 complete visits.
  - SPQ excessive social anxiety: the sum of 8 items (2, 11, 20, 29, 38, 46, 54 and 71), equal to the stored score on 184 of 184 complete visits.
  - SPQ odd beliefs or magical thinking: the sum of 7 items (3, 12, 21, 30, 39, 47 and 55), equal to the stored score on 184 of 184 complete visits.
  - SPQ unusual perceptual experiences: the sum of 9 items (4, 13, 22, 31, 40, 48, 56, 61 and 64), equal to the stored score on 184 of 184 complete visits.
  - SPQ odd or eccentric behaviour: the sum of 7 items (5, 14, 23, 32, 67, 70 and 74), equal to the stored score on 184 of 184 complete visits.
  - SPQ no close friends: the sum of 9 items (6, 15, 24, 33, 41, 49, 57, 62 and 66), equal to the stored score on 184 of 184 complete visits.
  - SPQ odd speech: the sum of 9 items (7, 16, 25, 34, 42, 50, 58, 69 and 72), equal to the stored score on 184 of 184 complete visits.
  - SPQ constricted affect: the sum of 8 items (8, 17, 26, 35, 43, 51, 68 and 73), equal to the stored score on 184 of 184 complete visits.
  - SPQ suspiciousness: the sum of 8 items (9, 18, 27, 36, 44, 52, 59 and 65), equal to the stored score on 184 of 184 complete visits.
  - SPQ total (0 to 74): the sum of 74 items, equal to the stored score on 184 of 184 complete visits.

  An instrument of the ASP cohort only.

defaults: {type: item, range: [0, 1]}

