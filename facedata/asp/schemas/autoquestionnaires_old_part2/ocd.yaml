instrument: ocd
title: "Obsessions and compulsions (section of the old forms)"
tab: autoquestionnaires_old_part2
section: old questionnaires
status: reviewed
notes: >
  A checklist of obsessions and compulsions answered from 1 to 3, three
  severity ratings, the age of onset and the severity of the obsessions and of
  the compulsions with their description, and the diagnosis and treatment of
  an obsessive-compulsive disorder: 186 inclusion visits (48 of children) and fewer than five follow-up visits, from 2012 to 2021 (183 of the 187 in 2013 to 2018). It belongs to the old set of forms.

  The thesaurus calls the section TOCS (obsessive-compulsive disorder; form 217,
  "Troubles obsessionnels compulsifs", three sections: obsessions and compulsions,
  severity, age of onset and diagnosis): a
  checklist of 80 symptoms answered 1 never, 2 in the past, 3 in the last week
  (it has the form of the symptom checklist of the Yale-Brown scale; the instrument
  it derives from is to verify), then
  questions on the severity of the worst period of the life, the ages and the diagnosis. No severity
  score of the Yale-Brown scale is stored, and none is built here. The column of the age
  of the compulsions has the name of a column of the first table, and the
  export added the name of the table to it.

  The form has no age limit: 49 of the 187 visits with an item are of patients
  under 18 (the youngest is 6 years old).

  **Year and centre.** 21 of the 102 variables reach 0.5 or more (17 by year, 17 by centre): items
  of the checklist answered 1 to 3 and the age of onset of the obsessions (0.53 by centre). The
  age mix explains them: children are 94% of the visits of centre C, 3% of D and none of E.
  Between centres 32 of the 87 variables differ beyond chance (permutation test, p below 0.01) and
  1 among adults; between years 12 of the 84 do, none among adults or children.

  An instrument of the ASP cohort only.

