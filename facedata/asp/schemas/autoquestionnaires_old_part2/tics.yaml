instrument: tics
title: "Tics (section of the old forms)"
tab: autoquestionnaires_old_part2
section: old questionnaires
status: reviewed
notes: >
  A checklist of motor and vocal tics answered from 1 to 3 (some lines with a
  description in free text), severity ratings for the last week and for the
  life, the age of onset, and the diagnosis of Tourette's disorder:
  206 inclusion visits (48 of children) and 52 follow-up visits, from 2012 to 2021. It belongs to the old set of forms.

  The thesaurus calls the section "chronic motor and vocal tics" (form 216,
  "Tics moteurs et vocaux chroniques"): a checklist
  of 37 tics (1 to 24 motor, 25 to 37 vocal) answered 1 never, 2 in the past, 3 in the last week, then
  questions on multiple tics, the severity (in the last week and in the worst
  period of the life), the ages and the diagnosis. The labels give the wording of the form in
  short.

  Gates. The 13 description boxes of the checklist (free text) are filled under an answer 2 or 3 of their item (434 cells),
  never under 1, and under an empty item on 19 cells: they are delivered as written, with no shown_if (it would
  blank the 19). The question on a medication for tics (tourtt) asks about "tics and/or Tourette", wider than the
  Tourette diagnosis (tourdiag) that precedes it, so it is not asked_if the diagnosis (it is empty on the 209
  visits that answer no to the diagnosis, and has one answer in all).

  The form offers the answers of the tic-free-period question (0 always tic-free to 5 never tic-free) to the two
  questions on the intensity of the tics in the worst period of the life (ticvie3 and ticvie4), copied from the two
  questions above them: the intensity questions of the last week (ticsem3 and ticsem4) have their own
  answers (0 absent to 5 severe). The two variables are delivered as written and labelled so. The ages are
  whole years: the export casts them with a rule that keeps only the cells made of digits, so a decimal or a word typed in an
  age is lost (request).

  **Year and centre.** 12 of the 76 variables reach 0.5 or more (12 by year, 4 by centre; 27
  variables have a group of 20 values). A step with no known cause, by year: the 37 tics are
  answered 1 never, 2 in the past, 3 in the last week, and on the inclusion visits of adults the
  share of 'never' is 63% to 71% in 2013 to 2016 (mean answer 1.43 to 1.55), 76% and 78% in 2017
  and 2018 (1.33, 1.31) and 93% in 2019 (1.12; 19 visits); it is 94% to 97% on the 48 follow-up
  visits of 2018 to 2020. 14 of the 54 variables differ between years beyond chance (permutation
  test, p below 0.01), 17 among adults and none among children (only two years hold 20 values of
  them), and 10 between centres, 6 among adults. The centres differ by age (children are 94% of
  the visits of C, 1% of D, none of E) but the step is among adults, and the form shows no change.
  The same fall of the yes is seen in the yes-or-no boxes of repetitive_behaviours (from the end
  of 2018) and in the box of MCDD (ticked on 86% of the visits of 2018 and 98% of 2019); the
  history gates of ANTECEDENTS fell from 2017 (D47 of PROGRESS.md).

  An instrument of the ASP cohort only.

