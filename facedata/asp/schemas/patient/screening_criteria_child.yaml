instrument: screening_criteria_child
title: "Checklist of fourteen criteria at screening (children)"
tab: patient
section: screening form
status: draft
level: patient
notes: >
  One value per patient. Fourteen yes/no boxes in five groups of 4, 4, 4, 1
  and 1 (iaaa_1 to iaaa_4, iaab_1 to iaab_4, iaac_1 to iaac_4, iaad_1, iaae_1),
  filled for about 125 patients, all but a few of them children, included from
  2018 to 2025 (17% of the inclusions of 2018, 3% or less since 2022).

  The thesaurus gives them as the screening interview of the Adult Asperger
  Assessment (Baron-Cohen 2005), under the heading "child". The layout is that
  of the DSM-IV-TR criteria of autistic disorder: four items of social
  interaction, four of communication, four of restricted interests, the onset
  before three years, and the exclusion criterion (confirmed by the wording of
  the thesaurus). No count is stored and none is computed.

  An instrument of the ASP cohort only.

defaults: {type: item, range: [0, 1]}

variables:
  screening_criterion_a1: {column: iaaa_1, label: "Screening interview, DSM-IV criterion A1: non-verbal behaviours that regulate social interaction"}
  screening_criterion_a2: {column: iaaa_2, label: "Screening interview, DSM-IV criterion A2: relationships with peers"}
  screening_criterion_a3: {column: iaaa_3, label: "Screening interview, DSM-IV criterion A3: sharing of enjoyment, interests or achievements"}
  screening_criterion_a4: {column: iaaa_4, label: "Screening interview, DSM-IV criterion A4: social or emotional reciprocity"}
  screening_criterion_b1: {column: iaab_1, label: "Screening interview, DSM-IV criterion B1: delay or absence of spoken language"}
  screening_criterion_b2: {column: iaab_2, label: "Screening interview, DSM-IV criterion B2: starting or sustaining a conversation"}
  screening_criterion_b3: {column: iaab_3, label: "Screening interview, DSM-IV criterion B3: stereotyped, repetitive or idiosyncratic language"}
  screening_criterion_b4: {column: iaab_4, label: "Screening interview, DSM-IV criterion B4: make-believe and social imitative play"}
  screening_criterion_c1: {column: iaac_1, label: "Screening interview, DSM-IV criterion C1: restricted and stereotyped interests"}
  screening_criterion_c2: {column: iaac_2, label: "Screening interview, DSM-IV criterion C2: non-functional routines or rituals"}
  screening_criterion_c3: {column: iaac_3, label: "Screening interview, DSM-IV criterion C3: stereotyped and repetitive motor mannerisms"}
  screening_criterion_c4: {column: iaac_4, label: "Screening interview, DSM-IV criterion C4: preoccupation with parts of objects"}
  screening_criterion_d1: {column: iaad_1, label: "Screening interview, DSM-IV criterion D: delay or abnormal functioning before the age of three"}
  screening_criterion_e1: {column: iaae_1, label: "Screening interview, DSM-IV criterion E: the problems were present during the whole life"}
