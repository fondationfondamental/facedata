instrument: identite
title: Patient identity
tab: patient
section: identity
status: draft
level: patient
notes: >
  One value per patient. The extraction repeats these columns on every visit
  row, and they never change between the visits of a patient.

  Same instrument as in FACE BP, SZ and DR, with the diagnosis of this
  cohort. The column arm is 1 for 2,008 patients and 0 for 310: 1 is a
  patient whose autism spectrum diagnosis was confirmed at the expert centre,
  0 a patient who was assessed and not diagnosed (answer of the project lead,
  decision D3; to confirm with the data managers, open question O3 in
  PROGRESS.md). Both groups are delivered. 169 of the patients not diagnosed
  are children and 141 are adults.

  The cohort holds children and adults: 956 patients are 5 to 17 years old at
  inclusion and 1,362 are 18 to 65, so the range of the age starts at 3.

  The date of birth is exported with the day set to the 15th for every
  patient, as in the other cohorts.

  The stored age is the age at the inclusion visit for 2,314 of the 2,318
  patients. age_at_inclusion is computed from the date of birth and the date
  of the inclusion visit, as in FACE DR, and the stored age is read to be
  compared with it.

  fondacode (the column subjid) is the patient code of the foundation, the
  same in every extraction and unique across the cohorts: no fondacode of
  FACE ASP is in FACE BP, SZ or DR, while 378 usubjid are also BP numbers,
  538 SZ numbers and 83 DR numbers, for other patients. It is a text and
  never appears in the report.

  usubjid and siteid are key columns.

variables:
  fondacode:
    column: subjid
    label: Patient code of the foundation, the same in every extraction and unique across the cohorts
    type: text
  sex:
    label: Sex
    type: category
    codes: {Feminin: female, Masculin: male}
  diagnosis:
    column: arm
    label: Diagnosis of the cohort
    type: category
    codes:
      "1": asd_confirmed
      "0": asd_not_confirmed
  birth_date:
    column: brthdtc
    label: Date of birth (the day is the 15th for every patient)
    type: date
    day: 15
    range: [1900-01-01, 2023-12-31]
  age_stored:
    column: age
    label: Age as stored
    type: item
    range: [3, 100]
    keep: false

scores:
  age_at_inclusion:
    custom: age_at_inclusion
    compare: age_stored
    compare_tolerance: 1
    label: Age at the inclusion visit, in years
