  non_drug_care_cmpp: {column: trt_non_parmaco_2, label: "Non-drug care: medico-psycho-pedagogical centre (CMPP) (box; no longer printed by the forms from about 2021)", doubt: {period: [2022-01-01, 2030-12-31], values: [0], remove: true, note: "box no longer printed by forms 241 and 261: a 0 is not an answer"}}
