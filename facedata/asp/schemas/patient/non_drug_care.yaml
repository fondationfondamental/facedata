instrument: non_drug_care
title: "Non-drug treatments (fifteen boxes)"
tab: patient
section: screening form
status: draft
level: patient
notes: >
  One value per patient. Fifteen yes/no boxes named trt_non_parmaco_1 to _15
  ("traitement non pharmacologique"), filled for 1,116 patients (boxes 1 to 5)
  and 1,145 (boxes 6 to 15): 64% of the adults and 25% of the children. The
  most frequent are the boxes 11 (320 patients), 10 (235) and 12 (96); the
  boxes 4 and 5 are 0 for every patient.

  The thesaurus names the kinds 6 to 15 (SESSAD, school inclusion, speech
  therapist, psychomotor therapist, psychologist, psychiatrist, other,
  occupational therapist, social skills group, mobile autism team); the kinds 1
  to 5 are named with no label (O16).

  An instrument of the ASP cohort only.

defaults: {type: item, range: [0, 1]}

variables:
  non_drug_care_01: {column: trt_non_parmaco_1, label: "Non-drug care: kind 1, not documented by the thesaurus (box)"}
  non_drug_care_02: {column: trt_non_parmaco_2, label: "Non-drug care: kind 2, not documented by the thesaurus (box)"}
  non_drug_care_03: {column: trt_non_parmaco_3, label: "Non-drug care: kind 3, not documented by the thesaurus (box)"}
  non_drug_care_04: {column: trt_non_parmaco_4, label: "Non-drug care: kind 4, not documented by the thesaurus (box)"}
  non_drug_care_05: {column: trt_non_parmaco_5, label: "Non-drug care: kind 5, not documented by the thesaurus (box)"}
  non_drug_care_sessad: {column: trt_non_parmaco_6, label: "Non-drug care: home care service for children (SESSAD) (box)"}
  non_drug_care_school_inclusion: {column: trt_non_parmaco_7, label: "Non-drug care: inclusion in an ordinary school (box)"}
  non_drug_care_speech_therapist: {column: trt_non_parmaco_8, label: "Non-drug care: speech therapist (box)"}
  non_drug_care_psychomotor_therapist: {column: trt_non_parmaco_9, label: "Non-drug care: psychomotor therapist (box)"}
  non_drug_care_psychologist: {column: trt_non_parmaco_10, label: "Non-drug care: psychologist (box)"}
  non_drug_care_psychiatrist: {column: trt_non_parmaco_11, label: "Non-drug care: psychiatrist (box)"}
  non_drug_care_other: {column: trt_non_parmaco_12, label: "Non-drug care: other (box)"}
  non_drug_care_occupational_therapist: {column: trt_non_parmaco_13, label: "Non-drug care: occupational therapist (box)"}
  non_drug_care_social_skills_group: {column: trt_non_parmaco_14, label: "Non-drug care: social skills group (box)"}
  non_drug_care_mobile_autism_team: {column: trt_non_parmaco_15, label: "Non-drug care: mobile autism team (EMA), SAMSAH or EAVS (box)"}
