instrument: somatic_pulmonary
title: "Somatic history: lungs, one row per visit and disease"
tab: antecedents
section: history
status: reviewed
level: list
notes: >
  The diseases of the system reported after a yes to the question history_pulmonary_v0
  (inclusion visit) or history_pulmonary_fu (yearly visit) of the instruments somatic_history_v0
  and somatic_history_fu: 346 diseases for 314 visits (314 patients), up to 3 at one visit; 342
  rows are of inclusion visits and 4 of yearly visits. One row per visit and disease in the
  table treatments, where the column list says "somatic_pulmonary" and the column visit names
  the visit.

  A visit's list holds the rows typed at that visit; the lifetime history is the union of the
  visits.

  Read the list with the gate of the same visit: a gate 0 means none, an empty gate or a 9 means
  not known. 153 of the 460 yes at inclusion have no list (33.3% (138 of 289 to 2020, 15 of 171
  from 2021)) and 15 of 19 at the yearly visits. 2 inclusion lists sit under a gate 0 or 9, 1 at
  inclusion under an empty gate.

  The export packs the diseases of a visit in one cell, each between brackets with four fields:
  the code of the disease in the list of the form, a free text, the age of onset in years and
  whether it is over (0 or 1; a 9 is "not known", delivered as missing with its reason: 240
  cells in the eight lists). The list of the diseases is that of the thesaurus V2.13. The eight
  somatic lists have the same shape and differ only by the packed column, the prefix of the
  fields and the list of the codes: disease_code, disease_text, age_onset (0 to 100) and
  disease_over. The code that means "other" is 11 in ear, nose, throat and eyes, 4 in the lungs,
  10 in the nervous system and 9 in the five others, and the free text is filled where the code
  is "other" (1,923 of the 1,925 "other" rows of the eight lists), so that no shown_if is
  needed. 19 rows of the eight lists have no code, 14 of them with all four fields empty (a
  record opened and nothing typed): the schema cannot repair them (open question O19). 3 of the
  2,422 ages of onset are more than one year above the age of the patient at the visit (one each
  in the heart, digestive and ear, nose, throat and eyes lists): kept as recorded.

  In this list "other" is the code 4: 120 of its 120 rows have a free text. 2 rows have no code
  (1 with all four fields empty). Fewer than five records have a dash in their free text, which
  the reader keeps in the text.

  The form 193 lists four lung diseases (asthma, COPD, tuberculosis, other): a fifth code, 5
  "Allergie", is commented out in the form, and no code 5 appears in the data. To 2020, 138
  inclusion visits have a lung gate yes and no lung list, 110 of them with the allergy gate yes:
  the lung history is probably contaminated by allergies (open question O18; request A56, question
  M54 of EXPORT_REQUESTS.md).

  **Year and centre.** The age of onset is a lifetime age: its median follows the age mix of the
  patients (children are 0% to 100% of the inclusion visits of a centre and 9% to 59% of a year)
  and the centre. It is 1 to 10 years by centre (five centres with 20 rows or more): 1 to 4 among
  the children, 8 to 10 among the adults. "Over" is 41% to 85% by year (eight years) and 46% to
  73% by centre: groups of 20 to 78 rows, no step.

  A section of the ASP cohort only.

per_visit: true

packed:
  antipulms_antipulma_antipulmag_antipulmrem: {fields: [pulmonary_code, pulmonary_text, pulmonary_age, pulmonary_over], text: pulmonary_text}

variables:
  disease_code: {column: pulmonary_code, type: category, label: "The disease, in the list of the form", codes: {"1": asthma, "2": copd, "3": tuberculosis, "4": other}}
  disease_text: {column: pulmonary_text, type: text, label: "Disease, free text"}
  age_onset: {column: pulmonary_age, type: number, label: "Age of onset, years", unit: years, range: [0, 100], winsor: false}
  disease_over: {column: pulmonary_over, type: item, label: "The disease is in remission now (0 no, 1 yes)", range: [0, 1], missing: {"9": unknown}}
