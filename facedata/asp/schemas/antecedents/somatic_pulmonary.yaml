instrument: somatic_pulmonary
title: "Somatic history: lungs, one row per disease"
tab: antecedents
section: history
status: draft
level: list
notes: >
  The diseases of the system reported after a yes to the question
  history_pulmonary: 346 diseases for 314 visits (314 patients), up to 3 for one
  patient. One row per patient and disease in the table treatments, where the
  column list says "somatic_pulmonary".

  The export packs the diseases of a patient in one cell, each between brackets
  with four fields: the code of the disease in the list of the form, a free
  text, the age of onset in years and whether it is over (0 or 1; 9 is "not
  known"). The list of the diseases is that of the thesaurus V2.13. Fewer than five records
  have a dash in their free text, which the reader keeps in the text. The
  history is that of the patient: the first visit that holds it is read, and a
  later visit that holds another list gets patient_value_varies.

  A section of the ASP cohort only.

packed:
  antipulms_antipulma_antipulmag_antipulmrem: {fields: [pulmonary_code, pulmonary_text, pulmonary_age, pulmonary_over], text: pulmonary_text}

variables:
  disease_code: {column: pulmonary_code, type: category, label: "The disease, in the list of the form", codes: {"1": asthma, "2": copd, "3": tuberculosis, "4": other}}
  disease_text: {column: pulmonary_text, type: text, label: "Disease, free text"}
  age_onset: {column: pulmonary_age, type: number, label: "Age of onset, years", unit: years, range: [0, 100], winsor: false}
  disease_over: {column: pulmonary_over, type: item, label: "The disease is in remission now (0 no, 1 yes)", range: [0, 1], missing: {"9": unknown}}
