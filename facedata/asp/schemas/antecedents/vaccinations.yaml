instrument: vaccinations
title: "Vaccinations"
tab: antecedents
section: history
status: draft
notes: >
  Seven lines of the vaccination record, each with a code and a box:
  529 inclusion visits (356 of children) and 7 follow-up visits, from 2013 to 2026.

  Each line names a vaccine from the list of the thesaurus (diphtheria,
  tetanus, poliomyelitis, pertussis, BCG, measles, rubella); the code 8 is not
  in that list and is delivered as code_8 (O16). The box (vaccinnf) is 1 on
  almost every visit that holds the line.

  A section of the ASP cohort only.

