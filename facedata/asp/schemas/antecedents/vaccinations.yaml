instrument: vaccinations
title: "Vaccinations"
tab: antecedents
section: history
status: reviewed
notes: >
  Seven lines of the vaccination record, each with a vaccine and a box done or
  not done: 529 inclusion visits (356 of children) and 7 follow-up visits (2014
  and 2015), from 2009 to 2026.

  The record is a free table, not a questionnaire: each line is a select of the
  vaccine and a Fait / non fait radio, and nothing in the form hangs one line on
  another, so there is no gate and no `asked_if`. Each line names a vaccine of
  the list of the form: diphtheria, tetanus, poliomyelitis, pertussis, BCG,
  measles, rubella and the code 8, "vaccin antivariolique", delivered as
  smallpox (24 lines on 23 inclusion visits of 2009 to 2019; the list of the
  current inclusion form has it commented out). 3420 lines hold a vaccine, on 523
  visits.

  The box (vaccine_i_done) is done 1 or not done 0: 3375 lines are done and 29
  not done; 32 lines hold a vaccine and no box, and 16 lines a box and no
  vaccine (14 of them the first line). A line is a position in the table, not
  a vaccine: the code equals the number of the line on 1748 of the 3420 lines
  (51%), and 95 visits repeat a vaccine on two lines. Read the vaccines of a visit as a set over the
  seven lines, not line by line.

  **Year and centre.** The share of inclusion visits with a vaccination line is 36% for the
  children and 12% for the adults and moves from year to year with no lasting step: 7% to 57% by
  year among the children and 1% to 41% among the adults (years with 30 visits or more).

  A section of the ASP cohort only.

