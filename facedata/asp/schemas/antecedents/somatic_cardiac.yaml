instrument: somatic_cardiac
title: "Somatic history: heart and vessels, one row per visit and disease"
tab: antecedents
section: history
status: reviewed
level: list
notes: >
  The diseases of the system reported after a yes to the question history_cardiac_v0 (inclusion
  visit) or history_cardiac_fu (yearly visit) of the instruments somatic_history_v0 and
  somatic_history_fu: 196 diseases for 161 visits (161 patients), up to 4 at one visit; 194 rows
  are of inclusion visits and 2 of yearly visits. One row per visit and disease in the table
  treatments, where the column list says "somatic_cardiac" and the column visit names the visit.

  A visit's list holds the rows typed at that visit; the lifetime history is the union of the
  visits.

  Read the list with the gate of the same visit: a gate 0 means none, an empty gate or a 9 means
  not known. 16 of the 169 yes at inclusion have no list (9.5%) and 1 of 3 at the yearly visits.
  6 inclusion lists sit under a gate 0 or 9.

  The export packs the diseases of a visit in one cell, each between brackets with four fields:
  the code of the disease in the list of the form, a free text, the age of onset in years and
  whether it is over (0 or 1; a 9 is "not known", delivered as missing with its reason: 240
  cells in the eight lists). The list of the diseases is that of the thesaurus V2.13. The eight
  somatic lists have the same shape and differ only by the packed column, the prefix of the
  fields and the list of the codes: disease_code, disease_text, age_onset (0 to 100) and
  disease_over. The code that means "other" is 11 in ear, nose, throat and eyes, 4 in the lungs,
  10 in the nervous system and 9 in the five others, and the free text is filled where the code
  is "other" (1,923 of the 1,925 "other" rows of the eight lists), so that no shown_if is
  needed. 19 rows of the eight lists have no code, 14 of them with all four fields empty (a
  record opened and nothing typed): the schema cannot repair them (open question O19). 3 of the
  2,422 ages of onset are more than one year above the age of the patient at the visit (one each
  in the heart, digestive and ear, nose, throat and eyes lists): kept as recorded.

  In this list "other" is the code 9: 130 of its 130 rows have a free text. 1 row has no code (1
  with all four fields empty). No record has a dash in its free text.

  **Year and centre.** "Over" is 44% to 50% by year (two years with 20 rows or more) and 18% to
  46% by centre (four centres): within chance for groups of 24 to 39 rows, no step.

  A section of the ASP cohort only.

per_visit: true

packed:
  antcardis_antcardia_antcardiag_antcardirem: {fields: [cardiac_code, cardiac_text, cardiac_age, cardiac_over], text: cardiac_text}

variables:
  disease_code: {column: cardiac_code, type: category, label: "The disease, in the list of the form", codes: {"1": myocardial_infarction, "2": stroke, "3": thromboembolic_disease, "4": congenital_heart_disease, "5": heart_failure, "6": arrhythmia, "7": hypertension, "8": valve_disease, "9": other}}
  disease_text: {column: cardiac_text, type: text, label: "Disease, free text"}
  age_onset: {column: cardiac_age, type: number, label: "Age of onset, years", unit: years, range: [0, 100], winsor: false}
  disease_over: {column: cardiac_over, type: item, label: "The disease is in remission now (0 no, 1 yes)", range: [0, 1], missing: {"9": unknown}}
