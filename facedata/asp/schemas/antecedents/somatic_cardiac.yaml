instrument: somatic_cardiac
title: "Somatic history: heart and vessels, one row per disease"
tab: antecedents
section: history
status: draft
level: list
notes: >
  The diseases of the system reported after a yes to the question
  history_cardiac: 196 diseases for 161 visits (161 patients), up to 4 for one
  patient. One row per patient and disease in the table treatments, where the
  column list says "somatic_cardiac".

  The export packs the diseases of a patient in one cell, each between brackets
  with four fields: the code of the disease in the list of the form, a free
  text, the age of onset in years and whether it is over (0 or 1; 9 is "not
  known"). The list of the diseases is that of the thesaurus V2.13. 0 records
  have a dash in their free text, which the reader keeps in the text. The
  history is that of the patient: the first visit that holds it is read, and a
  later visit that holds another list gets patient_value_varies.

  A section of the ASP cohort only.

packed:
  antcardis_antcardia_antcardiag_antcardirem: {fields: [cardiac_code, cardiac_text, cardiac_age, cardiac_over], text: cardiac_text}

variables:
  disease_code: {column: cardiac_code, type: category, label: "The disease, in the list of the form", codes: {"1": myocardial_infarction, "2": stroke, "3": thromboembolic_disease, "4": congenital_heart_disease, "5": heart_failure, "6": arrhythmia, "7": hypertension, "8": valve_disease, "9": other}}
  disease_text: {column: cardiac_text, type: text, label: "Disease, free text"}
  age_onset: {column: cardiac_age, type: number, label: "Age of onset, years", unit: years, range: [0, 100], winsor: false}
  disease_over: {column: cardiac_over, type: item, label: "The disease is in remission now (0 no, 1 yes)", range: [0, 1], missing: {"9": unknown}}
