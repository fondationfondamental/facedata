instrument: somatic_history
title: "Somatic history: the questions"
tab: antecedents
section: history
status: draft
notes: >
  One yes/no question per body system, then gynaecology, genetic diseases,
  other diseases and allergies: 2058 inclusion visits (814 of children) and 71 follow-up visits, from 2011 to 2026.

  Named from the column names and checked against the thesaurus V2.13
  (PROGRESS.md D14); a 9 is "not known". After a yes, the diseases of the
  system are recorded as a list (the code of the disease, a free text, the age
  of onset and whether it is over): these lists are the instruments
  somatic_ent, somatic_cardiac, somatic_pulmonary, somatic_rheumatology,
  somatic_digestive, somatic_endocrine, somatic_neurological and
  somatic_cancer, delivered one row per disease in the table treatments. At the
  inclusion visit a history is reported for 1040 patients (ear, nose, throat
  and eyes), 584 (bones, joints and skin), 505 (digestive), 460 (lungs), 286
  (nervous system), 169 (heart), 154 (endocrine) and 24 (cancer).

  The five boxes gynco_1 to gynco_5 hold a 0 or a 1 on every visit that has
  the form: read them with the question gynco. atcdchang is a box of the
  follow-up form, also filled at the inclusion visit until the forms changed.

  A section of the ASP cohort only.

variables:
