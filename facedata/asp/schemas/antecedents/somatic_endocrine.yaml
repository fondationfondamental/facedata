instrument: somatic_endocrine
title: "Somatic history: endocrine glands, one row per disease"
tab: antecedents
section: history
status: draft
level: list
notes: >
  The diseases of the system reported after a yes to the question
  history_endocrine: 171 diseases for 146 visits (146 patients), up to 3 for one
  patient. One row per patient and disease in the table treatments, where the
  column list says "somatic_endocrine".

  The export packs the diseases of a patient in one cell, each between brackets
  with four fields: the code of the disease in the list of the form, a free
  text, the age of onset in years and whether it is over (0 or 1; 9 is "not
  known"). The list of the diseases is that of the thesaurus V2.13. 0 records
  have a dash in their free text, which the reader keeps in the text. The
  history is that of the patient: the first visit that holds it is read, and a
  later visit that holds another list gets patient_value_varies.

  A section of the ASP cohort only.

packed:
  antendos_antendoa_antendoag_antendorem: {fields: [endocrine_code, endocrine_text, endocrine_age, endocrine_over], text: endocrine_text}

variables:
  disease_code: {column: endocrine_code, type: category, label: "The disease, in the list of the form", codes: {"1": hypothyroidism, "2": type_2_diabetes, "3": hyperthyroidism, "4": growth_hormone_deficiency, "5": dyslipidaemia, "6": adrenal_insufficiency, "7": type_1_diabetes, "8": gonadotropin_deficiency, "9": other}}
  disease_text: {column: endocrine_text, type: text, label: "Disease, free text"}
  age_onset: {column: endocrine_age, type: number, label: "Age of onset, years", unit: years, range: [0, 100], winsor: false}
  disease_over: {column: endocrine_over, type: item, label: "The disease is in remission now (0 no, 1 yes)", range: [0, 1], missing: {"9": unknown}}
