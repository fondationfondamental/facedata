instrument: somatic_cancer
title: "Somatic history: cancer, one row per disease"
tab: antecedents
section: history
status: draft
level: list
notes: >
  The diseases of the system reported after a yes to the question
  history_cancer: 22 diseases for 22 visits (22 patients), up to 1 for one
  patient. One row per patient and disease in the table treatments, where the
  column list says "somatic_cancer".

  The export packs the diseases of a patient in one cell, each between brackets
  with four fields: the code of the disease in the list of the form, a free
  text, the age of onset in years and whether it is over (0 or 1; 9 is "not
  known"). The list of the diseases is that of the thesaurus V2.13. Fewer than five records
  have a dash in their free text, which the reader keeps in the text. The
  history is that of the patient: the first visit that holds it is read, and a
  later visit that holds another list gets patient_value_varies.

  A section of the ASP cohort only.

packed:
  antcancs_antcanca_antcancag_antcancrem: {fields: [cancer_code, cancer_text, cancer_age, cancer_over], text: cancer_text}

variables:
  disease_code: {column: cancer_code, type: category, label: "The disease, in the list of the form", codes: {"1": lung, "2": cervix, "3": prostate, "4": haematological, "5": melanoma, "6": colorectal, "7": breast, "8": ent, "9": other}}
  disease_text: {column: cancer_text, type: text, label: "Disease, free text"}
  age_onset: {column: cancer_age, type: number, label: "Age of onset, years", unit: years, range: [0, 100], winsor: false}
  disease_over: {column: cancer_over, type: item, label: "The disease is in remission now (0 no, 1 yes)", range: [0, 1], missing: {"9": unknown}}
