instrument: perinatal
title: "Birth"
tab: antecedents
section: history
status: reviewed
level: patient
notes: >
  The term, the age of the parents, the delivery, the newborn's first days and
  the measures at birth: 2071 inclusion visits (878 of children) and 0 follow-up
  visits, from 2009 to 2026; asked once, at the inclusion visit.

  Same questions as the instrument perinatal of FACE BP, SZ and DR where they
  exist there: the term, the age of the parents, the weight, the length and
  the head circumference at birth, the two Apgar scores and the stay in a
  neonatal unit are delivered under the same names. None of these columns holds
  a 0 or a 99 that stands for "not known" (the Apgar scores hold three real
  0), so they stack with the other cohorts by name. The delivery is described
  here by yes/no questions (natural, induced, caesarean, forceps, vacuum)
  where the other cohorts have one list.

  The term is known for 1709 patients: under 37 weeks for 163 of them. The birth
  weight is written in grams (1256 values) or in kilograms (fewer than five values under
  10, converted); fewer than five values between 10 and 400 fit neither and are not
  delivered.

  **The delivery.** The form asks "natural delivery" first and shows the
  questions on the delivery (induced, caesarean, forceps, vacuum, the free text
  of another delivery) only when the answer is no: the gate is shown the
  other way round. The answer is yes for 1366 patients, no for 511, not known
  for 135 and empty for 306. not_natural_delivery (not delivered) is that
  question read the other way round, 1 for a delivery that is not natural.
  After a natural delivery induced_delivery, caesarean, forceps and
  vacuum_extraction are 0 (`asked_if`: 1366 patients each, 5464 cells); after a
  delivery that is not natural they are read as written (caesarean 326 yes, 149
  no, 36 empty; induced 165 yes; forceps 65; vacuum 24); where the delivery is
  not known or empty they stay missing. Nothing is filled under a natural
  delivery (0 of the 475 caesarean answers, 0 of the 416 induced). With the
  natural births counted, caesarean is 326 yes among 1841 patients (the 1366
  natural births and the 475 answers), where it was 326 of 475: it is now
  BP's birth_type equal to caesarean. The planned or urgent kind of an
  induction or of a caesarean and the free texts (another delivery, the kind
  of foetal distress) are details and stay missing after a no.

  **The first days.** The days in a neonatal unit (neonatal_hospitalisation_days)
  are shown after a yes to the stay: they are 0 after a no (1675 patients) and
  filled for 113 of the 168 patients with a stay.

  **Year and centre.** The medians of the term (39 or 40 weeks) and of the head circumference (34
  or 35 cm) by year and by centre (years and centres with 20 values or more) differ by one unit of
  a whole number scale: no step. The planned or emergency kind of an induction or of a caesarean
  (126 to 256 answers) does not differ by year or by centre beyond chance.

  A section of the ASP cohort only.

variables:
  gestational_age: {column: semameno, type: number, label: "Gestational age at birth, in weeks of amenorrhoea", unit: weeks, range: [20, 45], winsor: false}
  mother_age_at_birth: {column: agemere, type: item, label: "Age of the mother when the patient was born, in years", range: [12, 60]}
  father_age_at_birth: {column: agepere, type: item, label: "Age of the father when the patient was born, in years", range: [12, 90]}
  natural_delivery: {column: accnat, type: item, label: "Natural delivery (0 no, 1 yes)", range: [0, 1], missing: {"9": unknown}}
  not_natural_delivery: {column: accnat, type: item, range: [0, 1], codes: {"0": 1, "1": 0}, missing: {"9": unknown}, keep: false, label: "Not a natural delivery (the answer of the form read the other way round: 1 not natural, 0 natural); not delivered, the gate of the questions on the delivery"}
  induced_delivery: {column: prov, type: item, label: "Induced delivery (0 no, 1 yes)", range: [0, 1], asked_if: not_natural_delivery}
  induced_delivery_planned: {column: provpla, type: item, label: "Induced delivery, planned (0 no, 1 yes)", range: [0, 1]}
  induced_delivery_emergency: {column: provurg, type: item, label: "Induced delivery, in emergency (0 no, 1 yes)", range: [0, 1]}
  caesarean: {column: cesa, type: item, label: "Caesarean (0 no, 1 yes)", range: [0, 1], asked_if: not_natural_delivery}
  caesarean_planned: {column: cesapla, type: item, label: "Caesarean, planned (0 no, 1 yes)", range: [0, 1]}
  caesarean_emergency: {column: cesaurg, type: item, label: "Caesarean, in emergency (0 no, 1 yes)", range: [0, 1]}
  forceps: {column: forc, type: item, label: "Forceps (0 no, 1 yes)", range: [0, 1], asked_if: not_natural_delivery}
  vacuum_extraction: {column: vent, type: item, label: "Vacuum extraction (0 no, 1 yes)", range: [0, 1], asked_if: not_natural_delivery}
  other_delivery_text: {column: accautre, type: text, label: "Other non-natural delivery, free text"}
  foetal_distress: {column: souffet, type: item, label: "Foetal distress (0 no, 1 yes)", range: [0, 1], missing: {"9": unknown}}
  foetal_distress_type: {column: souffets, type: category, label: "Foetal distress at delivery: kind", codes: {"1": anoxia, "2": severe_jaundice, "3": cerebral_haemorrhage, "4": infection, "5": other}}
  foetal_distress_other_text: {column: souffetc, type: text, label: "Foetal distress, comment, free text"}
  neonatal_resuscitation: {column: reanim, type: item, label: "Resuscitation at birth (0 no, 1 yes)", range: [0, 1], missing: {"9": unknown}}
  neonatal_hospitalisation: {column: neonat, type: item, label: "Was admitted to a neonatal unit (0 no, 1 yes)", range: [0, 1], missing: {"9": unknown}}
  neonatal_hospitalisation_reason: {column: neonatc, type: text, label: "Neonatal unit, reason, free text"}
  neonatal_hospitalisation_days: {column: neonatd, type: number, label: "Neonatal unit, number of days", range: [0, 360], winsor: false, asked_if: neonatal_hospitalisation}
  newborn_disease: {column: affecbb, type: item, label: "Disease of the newborn (0 no, 1 yes)", range: [0, 1], missing: {"9": unknown}}
  newborn_disease_text: {column: affecbbc, type: text, label: "Disease of the newborn, which, free text"}
  twin_birth: {column: gemel, type: item, label: "Twin birth (0 no, 1 yes)", range: [0, 1]}
  twin_zygosity: {column: gemels, type: category, label: "Twin birth: zygosity", codes: {"1": monozygotic, "2": dizygotic}, missing: {"3": unknown}}
  birth_weight:
    column: naispoid
    label: Birth weight
    type: number
    unit: g
    units:
      g: {factor: 1, expect: [400, 6500]}
      kg: {factor: 1000, expect: [0.4, 6.5]}
    range: [400, 6500]
    winsor: false
  birth_length: {column: naistail, type: number, label: Birth length, unit: cm, range: [25, 60], winsor: false}
  birth_head_circumference: {column: naispc, type: number, label: Head circumference at birth, unit: cm, range: [20, 42], winsor: false}
  apgar_1min: {column: apgar1, type: item, label: Apgar score at 1 minute, range: [0, 10]}
  apgar_5min: {column: apgar5, type: item, label: Apgar score at 5 minutes, range: [0, 10]}
