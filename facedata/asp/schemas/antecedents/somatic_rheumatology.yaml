instrument: somatic_rheumatology
title: "Somatic history: bones, joints and skin, one row per disease"
tab: antecedents
section: history
status: draft
level: list
notes: >
  The diseases of the system reported after a yes to the question
  history_rheumatology: 805 diseases for 568 visits (560 patients), up to 8 for one
  patient. One row per patient and disease in the table treatments, where the
  column list says "somatic_rheumatology".

  The export packs the diseases of a patient in one cell, each between brackets
  with four fields: the code of the disease in the list of the form, a free
  text, the age of onset in years and whether it is over (0 or 1; 9 is "not
  known"). The list of the diseases is that of the thesaurus V2.13. Fewer than five records
  have a dash in their free text, which the reader keeps in the text. The
  history is that of the patient: the first visit that holds it is read, and a
  later visit that holds another list gets patient_value_varies.

  A section of the ASP cohort only.

packed:
  antrhums_antrhuma_antrhumag_antrhumrem: {fields: [rheumatology_code, rheumatology_text, rheumatology_age, rheumatology_over], text: rheumatology_text}

variables:
  disease_code: {column: rheumatology_code, type: category, label: "The disease, in the list of the form", codes: {"1": lupus, "2": psoriasis, "3": rheumatoid_arthritis, "4": eczema, "5": spondyloarthritis, "6": angioma, "7": hyperuricaemia_or_gout, "8": hamartoma, "9": other}}
  disease_text: {column: rheumatology_text, type: text, label: "Disease, free text"}
  age_onset: {column: rheumatology_age, type: number, label: "Age of onset, years", unit: years, range: [0, 100], winsor: false}
  disease_over: {column: rheumatology_over, type: item, label: "The disease is in remission now (0 no, 1 yes)", range: [0, 1], missing: {"9": unknown}}
