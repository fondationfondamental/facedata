instrument: somatic_rheumatology
title: "Somatic history: bones, joints and skin, one row per visit and disease"
tab: antecedents
section: history
status: reviewed
level: list
notes: >
  The diseases of the system reported after a yes to the question history_rheumatology_v0
  (inclusion visit) or history_rheumatology_fu (yearly visit) of the instruments
  somatic_history_v0 and somatic_history_fu: 805 diseases for 568 visits (560 patients), up to 8
  at one visit; 780 rows are of inclusion visits and 25 of yearly visits. One row per visit and
  disease in the table treatments, where the column list says "somatic_rheumatology" and the
  column visit names the visit.

  A visit's list holds the rows typed at that visit; the lifetime history is the union of the
  visits.

  Read the list with the gate of the same visit: a gate 0 means none, an empty gate or a 9 means
  not known. 39 of the 584 yes at inclusion have no list (6.7%) and 7 of 25 at the yearly
  visits. 2 inclusion lists sit under a gate 0 or 9, 2 at inclusion and 1 at a yearly visit
  under an empty gate.

  The export packs the diseases of a visit in one cell, each between brackets with four fields:
  the code of the disease in the list of the form, a free text, the age of onset in years and
  whether it is over (0 or 1; a 9 is "not known", delivered as missing with its reason: 240
  cells in the eight lists). The list of the diseases is that of the thesaurus V2.13. The eight
  somatic lists have the same shape and differ only by the packed column, the prefix of the
  fields and the list of the codes: disease_code, disease_text, age_onset (0 to 100) and
  disease_over. The code that means "other" is 11 in ear, nose, throat and eyes, 4 in the lungs,
  10 in the nervous system and 9 in the five others, and the free text is filled where the code
  is "other" (1,923 of the 1,925 "other" rows of the eight lists), so that no shown_if is
  needed. 19 rows of the eight lists have no code, 14 of them with all four fields empty (a
  record opened and nothing typed): the schema cannot repair them (open question O19). 3 of the
  2,422 ages of onset are more than one year above the age of the patient at the visit (one each
  in the heart, digestive and ear, nose, throat and eyes lists): kept as recorded.

  In this list "other" is the code 9: 525 of its 525 rows have a free text. Fewer than five
  records have a dash in their free text, which the reader keeps in the text.

  **Year and centre.** The age of onset is a lifetime age: its median follows the age mix of the
  patients (children are 0% to 100% of the inclusion visits of a centre and 9% to 59% of a year)
  and the centre. It is 7.5 to 18 years by year and 2 to 16 by centre (years and centres with 20
  rows or more): 2 to 4 by centre among the children, 10 to 20 by year and 9.5 to 17 by centre
  among the adults. "Over" is 35% to 64% by year and 27% to 55% by centre: a habit of the centre,
  with no step in time.

  A section of the ASP cohort only.

per_visit: true

packed:
  antrhums_antrhuma_antrhumag_antrhumrem: {fields: [rheumatology_code, rheumatology_text, rheumatology_age, rheumatology_over], text: rheumatology_text}

variables:
  disease_code: {column: rheumatology_code, type: category, label: "The disease, in the list of the form", codes: {"1": lupus, "2": psoriasis, "3": rheumatoid_arthritis, "4": eczema, "5": spondyloarthritis, "6": angioma, "7": hyperuricaemia_or_gout, "8": hamartoma, "9": other}}
  disease_text: {column: rheumatology_text, type: text, label: "Disease, free text"}
  age_onset: {column: rheumatology_age, type: number, label: "Age of onset, years", unit: years, range: [0, 100], winsor: false}
  disease_over: {column: rheumatology_over, type: item, label: "The disease is in remission now (0 no, 1 yes)", range: [0, 1], missing: {"9": unknown}}
