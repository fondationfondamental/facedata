instrument: pregnancy
title: "The mother's pregnancy with the patient"
tab: antecedents
section: history
status: draft
notes: >
  What the parents report of the pregnancy: earlier miscarriages and
  stillbirths, consanguinity, assisted reproduction, folic acid, bleeding,
  infections, vaccination, medications and substances during the pregnancy,
  and the diseases of the mother and of the foetus. 2051 inclusion visits (868 of children) and fewer than five follow-up visits,
  from 2011 to 2026; asked once, at the inclusion visit.

  The section was first read without a dictionary; the labels and the lists are
  now those of the thesaurus V2.13 (PROGRESS.md D14). The questions are yes/no
  with a 9 for "not known", read as missing with its reason: the answer is not
  known for 224 to 790 of the inclusion visits by question (790 for the folic
  acid, 684 for the vaccination). A detail (trimester, number, name of the
  drug) is filled only after a yes.

  **Boxes written on every row.** The boxes of the trimesters and of the drug
  classes (antfct_1 to 3, morute_1 to 3, mednpsy_1 to 6) hold a 0 or a 1 on
  every inclusion visit that has the form (2139 visits): a 0 there is "not
  ticked", which is also what an unanswered question gives. Read them with
  their question (antfc, morute, trtmed).

  groschang and acqchang are boxes of the follow-up form ("changed since the
  last visit").

  A section of the ASP cohort only.

