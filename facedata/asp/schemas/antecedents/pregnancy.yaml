instrument: pregnancy
title: "The mother's pregnancy with the patient"
tab: antecedents
section: history
status: reviewed
notes: >
  What the parents report of the pregnancy: earlier miscarriages and
  stillbirths, consanguinity, assisted reproduction, folic acid, bleeding,
  infections, vaccination, medications and substances during the pregnancy,
  and the diseases of the mother and of the foetus. 2051 inclusion visits (868
  of children) hold an answer of the section, from 2009 to 2026; asked once,
  at the inclusion visit (form 192). The follow-up form (244: sections
  pregnancy, vaccinations, first acquisitions and epilepsy) repeats the first
  questions of the section only: on its 149 visits (2014 to 2020) the section
  holds the boxes described below and, on one visit, another answer.

  The section was first read without a dictionary; the labels and the lists are
  now those of the thesaurus V2.13 (PROGRESS.md D14), and every variable that
  kept its column name has a descriptive name. The questions are yes/no with a
  9 for "not known", read as missing with its reason: the answer is not known
  for 224 to 790 of the inclusion visits by question (790 for the folic acid,
  684 for the vaccination). A detail (trimester, which, name of the drug) is
  filled only after a yes and stays missing after a no.

  **Boxes written on every saved form.** The boxes of the trimesters and of
  the drug classes (miscarriage_before_trimester_1 to 3,
  stillbirth_before_trimester_1 to 3, pregnancy_medication_antiepileptic to
  _other) are checkboxes: the application saves a 0 for each box that is not
  ticked (class.update.php), and the column cannot be empty (tinyint NOT NULL
  DEFAULT 0 in the table, on exactly these twelve columns). They are 0 or 1 on
  2139 inclusion visits and on 149 follow-up visits; 88 inclusion visits and 148
  follow-up visits hold no other answer of the section. A 0 there is "not
  ticked": it is not an answer, and it is also what an unanswered question
  gives, under a yes as well as elsewhere. No box is 1 under a question that is
  not a yes (at inclusion: 328 visits with a trimester of an earlier
  miscarriage, 30 of a stillbirth and 247 of a medication, all under a yes).
  The boxes are delivered as written and flagged `derived_doubt` where their
  question (miscarriage_before, stillbirth_before, pregnancy_medication) is
  empty or not known: 7713 flags (5931 at inclusion, 1782 at follow-up), on 821
  visits. The form shows the number of a trimester when its box is ticked, but
  a box cannot say "not ticked" from "not asked", so the numbers hang on the
  question, not on the box (below).

  **Yes/no questions after a yes.** The nine infections and the six substances
  are Oui/Non radios shown after a yes to infection (pregnancy_infection) or to
  substance use (pregnancy_substance). After a no they are empty in 100% of the
  cells (1545 and 1500 inclusion visits): they are 0 (`asked_if`). A radio left
  unticked is saved empty, so an empty radio beside a ticked one is not an
  answer and there is no `box_list`: 23 of the 98 visits with an infection yes
  and 27 of the 196 with a substance yes have a yes next to an empty radio;
  those stay missing. After a no to their question, the numbers of earlier
  miscarriages and of earlier deaths in utero by trimester (3804 and 4929
  cells), the cigarettes a day (1529), the drinks a day (1643), the joints a
  day (1674) and the doses of another substance a day (1670) are 0. The lists
  that start at 1 (trimester of an infection, of the first intake or of a
  bleeding, severity of a bleeding, time of the folic acid) hold no 0: they
  stay missing after a no, as does every detail. After a no or a "not known"
  nothing is typed under a question, not a number and not a trimester (0 cells
  in the 38 pairs of a question and its details); under an empty answer three
  cells are: the time of the folic acid on one visit, and the trimester and
  the text of another infection on a visit whose infection answer is no.

  The form hides one level only: a click on a question hides and clears the
  fields under it, not the fields that hang on those (a number, a trimester).
  At load it hides the time of the folic acid when the answer is no, not known
  or empty, but does not clear it: one inclusion visit holds it with the
  folic-acid answer empty.

  pregnancy_section_changed is the "change since the last visit" box of the
  pregnancy section of the follow-up form: 0 on 147 visits of 2014 to 2020,
  never 1; it gates nothing. The same box of the first acquisitions, which the
  first reading put here, is early_acquisitions_changed in early_development,
  where the form places it.

  **Year and centre.** folic_acid has steps whose cause is not known. Among the answers yes and no
  the share of yes is 32% to 36% in 2013 and 2014, 13% to 20% from 2016 to 2020, 42% to 44% in
  2021 and 2022 and 30% to 51% from 2024; it is 8% to 54% by centre (five centres with 20 answers
  or more). The steps are made of changes inside the centres: in one centre the share of yes is
  48% to 2015, 3% from 2016 to 2020 and 0% from 2021 while its share of "not known" goes from 11%
  to 14% and then 45%; in another it is 33% and then 69%. No change of this question is known in
  the form (open question O25). The age mix plays a part in the completion of the section (an
  answer on 84% of the inclusion visits of children, 62% of adults), not in these steps: they are
  found among the children and among the adults.

  A section of the ASP cohort only.

