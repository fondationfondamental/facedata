instrument: somatic_digestive
title: "Somatic history: liver and digestive tract, one row per disease"
tab: antecedents
section: history
status: draft
level: list
notes: >
  The diseases of the system reported after a yes to the question
  history_digestive: 668 diseases for 473 visits (471 patients), up to 6 for one
  patient. One row per patient and disease in the table treatments, where the
  column list says "somatic_digestive".

  The export packs the diseases of a patient in one cell, each between brackets
  with four fields: the code of the disease in the list of the form, a free
  text, the age of onset in years and whether it is over (0 or 1; 9 is "not
  known"). The list of the diseases is that of the thesaurus V2.13. Fewer than five records
  have a dash in their free text, which the reader keeps in the text. The
  history is that of the patient: the first visit that holds it is read, and a
  later visit that holds another list gets patient_value_varies.

  A section of the ASP cohort only.

packed:
  anthepas_anthepaa_anthepag_antheparem: {fields: [digestive_code, digestive_text, digestive_age, digestive_over], text: digestive_text}

variables:
  disease_code: {column: digestive_code, type: category, label: "The disease, in the list of the form", codes: {"1": coeliac_disease, "2": ulcer, "3": crohn_disease, "4": gastro_oesophageal_reflux, "5": chronic_diarrhoea, "6": chronic_hepatitis_b_or_c, "7": chronic_constipation, "8": pancreatitis, "9": other}}
  disease_text: {column: digestive_text, type: text, label: "Disease, free text"}
  age_onset: {column: digestive_age, type: number, label: "Age of onset, years", unit: years, range: [0, 100], winsor: false}
  disease_over: {column: digestive_over, type: item, label: "The disease is in remission now (0 no, 1 yes)", range: [0, 1], missing: {"9": unknown}}
