instrument: care_consumption
title: "Use of care in the last year"
tab: sociodemo_medicoeco
section: social and medico-economic
status: reviewed
notes: >
  The date and the cost of the diagnosis, emergency visits, hospitalisations,
  consultations by kind of professional (general practitioner or
  paediatrician, psychiatrist, psychologist, speech therapist, psychomotor
  therapist, occupational therapist, social skills group, orthoptist,
  home-based practitioner, other) in two places (private practice, public
  service), the care package and its length, travels for care and the groups
  for the relatives: 947 inclusion visits (390 of children, 557 of adults) and
  71 follow-up visits, from 2020 to 2026. Asked of children and adults (forms
  351 and 350), apart from the relatives' group (adult form) and the
  behavioural approach of the psychologist (child form).

  The section belongs to the module 'Médico-éco' added in 2020 and 2021 (its first
  questions are on 48% of the inclusion visits of 2021 and 79% of those of 2024):
  an earlier visit is "not asked", not missing. The module has no visit-type or
  date condition (the application chooses the form by age alone), so the form
  can be filled on any visit, an earlier one included: 4 visits before 2020 hold it.
  The questions are on the last 12 months at inclusion and at follow-up alike: no
  _v0/_fu split.

  The labels and the lists of answers are those of the forms (350 adult, 351 child,
  352 Par-DD-QoL, 353 parents) and of the thesaurus V2.13 (PROGRESS.md D14). The
  output names are descriptive English names since 2026-11-20 (the column names
  before); the raw column stays in `column`.

  **Two forms in one table (R31).** The adult form 350 and the child form 351
  write one table (aut_medeco2); the application chooses the form by age at the
  visit. It writes a 0 into every unticked box on each save (D33), the boxes of
  the form NOT shown included: the adult-only boxes hold 0 on 499 records that are
  not adult forms (14,471 cells, never a 1) and the child-only boxes on 577 records
  (4,039 cells, never a 1). The form of a visit is read from the questions that only
  one form asks (`version: medeco_form`, `filled`): 519 adult forms, 441 child forms,
  58 records with no answer of either form (`medeco_unidentified`: their boxes are
  missing), none with both; an age band would misread 3 visits. The zeros never
  asked are missing; no 1 is lost. In this schema 2,651 cells become missing.

  A number of consultations or sessions is asked after a yes: after a no it is
  0 (`asked_if`, 27 counts, 19,464 cells). The form hides and clears the
  questions under a no (masquer), so no count is typed under a no. The details
  (session length, approach, place, wait) stay missing after a no (R1). The
  boxes of the places of the examinations and of the relatives' group, of the
  approaches of the psychologist and of the care hard to find are written 0 on
  every save, after a no or with an empty question too: `derived_from` their
  question (2,279 `derived_doubt` cells).

  The counts of therapeutic flats, of the part-time therapeutic centre, of the
  day and of the full-time hospitalisations are printed "Nombre de consultations
  dans les 12 derniers mois" on the form: the day-hospital count is bimodal
  (median 1 in centre A, 10 in centre B), so stays or days, the form does not
  say (question M90). Ranges are the limits of the form: a blocking check stops the counts above 50
  (eASPERGER.js lines 3560 to 3925), the other numbers at the length of their box. The session lengths stop at 99 minutes and the
  longest wait at 999 months; the intensive intervention before 5 years at 20
  hours a week and its ages at 50. An emergency visit is reported on 101 of
  889 inclusion visits with an answer.

  The forms 263 and 265 of an older 'Module social' (tables aut_medeco and
  medeco_soin) are commented out of the application and not exported: do
  their records hold answers (M91)?

  A section of the ASP cohort only, apart from saw_gp and n_gp, which DR
  delivers too (DR care over the year; the DR box accepts up to 365
  consultations, the ASP form 50, and the ASP question includes the
  paediatrician).

  Years and centres (definition of done, D88; centres lettered as in D77, A
  the children's centre): the centres differ, mostly by the age of their
  patients: the public psychiatrist is seen by 75% in A (children) and 34% to
  51% elsewhere; the private psychologist 55% in A and 23% to 52% elsewhere.
  Habits with no known cause, documented here: centre D has the fewest general
  practitioner visits (44% saw one, median 0, against 76% to 84% and medians 2
  to 5) and the fewest care hard to find (9%, against 27% to 61%); the private
  examinations rise from 9% in 2021 to 38% in 2026 (in A, B and C alike) and
  are 0% in H and 60% in E; the cost of the diagnosis has a median of 0 in A
  and 400 euros in B; the private session lasts 45 minutes in A and 60 in B
  and C.

version:
  name: medeco_form
  filled:                            # the child form 351 and the adult form 350 write one table (aut_medeco2)
    medeco_adult: [pe, ml, ce, sme, crpro, cpo, esat, ea, hooccur_avq1, hooccur_avq2, hav_child, ehaj, hooccur_groupe]
    medeco_child: [psysco, pecs, habitat, jardin, scolar01, fratn, tsadtc, loisi01, demenag]
    medeco_unidentified: [saltyp_1]  # the table is saved (its boxes are written 0) but no answer of either form tells which

