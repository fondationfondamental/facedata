instrument: care_consumption
title: "Use of care in the last year"
tab: sociodemo_medicoeco
section: social and medico-economic
status: draft
notes: >
  The date and the cost of the diagnosis, emergency visits, hospitalisations,
  consultations by kind of professional (general practitioner, psychiatrist
  or psychologist, speech therapist, psychomotor therapist, occupational
  therapist, social skills group, orthoptist) in two places, the care package
  and its length, travels for care and groups: 947 inclusion visits (390 of children, 557 of adults) and 71 follow-up visits,
  from 2020 to 2026.

  The section belongs to the form added in 2020 and 2021 (its first
  questions are on 48% of the inclusion visits of 2021 and 79% of those of 2024):
  an earlier visit is "not asked", not missing.

  The form was first read without a dictionary; the labels and the lists of
  answers are now those of the thesaurus V2.13, which corrected several
  meanings guessed from the column names (PROGRESS.md D14). The output names
  stay the column names. The two series of columns named lieu1 and lieu2 ask
  the same professionals in two places (lieu1 is private practice, lieu2 a
  public service). A number of times is asked after a yes. The boxes
  (psyg_type, lieu_exam, hoterm_pec, lieu_groupe) hold a 0 or a 1 on every
  visit that has the form. An emergency visit is reported on 101 of 889
  inclusion visits with an answer.

  A section of the ASP cohort only.

