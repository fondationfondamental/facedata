instrument: pddqol
title: "Parents' quality of life questionnaire (Par-DD-QoL), 17 items"
tab: sociodemo_medicoeco
section: social and medico-economic
status: reviewed
notes: >
  Seventeen items answered from 1 to 5 by a parent: 339 inclusion visits (337
  of children, 2 of adults) and 48 follow-up visits, from 2021 to 2026, in
  centres A and B. Asked for children (form 352). 363 visits hold the
  seventeen items.

  Identified: the form 352 is titled PAR-DD-QOL (Parental-Developmental
  Disorder-Quality of Life questionnaire), seventeen radios from 1 to 5, a
  higher answer worse. The application has no script and the export no score;
  the items 1 to 16 hang together (Cronbach alpha 0.93 on the data). The
  published key is to verify: the items are delivered as they are and no score
  is computed (O15 (3)).

  A section of the ASP cohort only.

  Years and centres (definition of done, D88; centres lettered as in D77, A
  the children's centre): two centres (A and B): four items (2, 5, 13 and 17)
  have a median one level higher in B than in A (means 0.2 to 0.6 higher, on a
  scale of 1 to 5) and item 12 is 0.3 lower; by year the medians of a few
  items move by one level (one visit in 2020). Levels of a whole-number scale,
  no other step.

defaults: {type: item, range: [1, 5]}

