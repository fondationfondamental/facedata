instrument: pddqol
title: "Parents' quality of life questionnaire (Par-DD-QoL), 17 items"
tab: sociodemo_medicoeco
section: social and medico-economic
status: draft
notes: >
  Seventeen items answered from 1 to 5 by a parent: 339 inclusion visits (337 of children, 2 of adults) and 48 follow-up visits, from 2021 to 2026.
  Asked for children. 363 visits hold the seventeen items.

  Identified from its name (pddqol) and its seventeen items from 1 to 5 as the
  Parental-Developmental Disorder-Quality of Life questionnaire (Par-DD-QoL),
  likely. No score is stored, and the key is not confirmed: the items are
  delivered as they are and no score is computed (O15).

  A section of the ASP cohort only.

defaults: {type: item, range: [1, 5]}

