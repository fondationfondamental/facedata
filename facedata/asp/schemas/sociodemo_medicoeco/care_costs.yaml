instrument: care_costs
title: "Costs of the care"
tab: sociodemo_medicoeco
section: social and medico-economic
status: reviewed
notes: >
  Eleven amounts or numbers about what the care costs the family: 334
  inclusion visits (332 of children, 2 of adults) and 48 follow-up visits,
  from 2021 to 2026 (form 353, centres A and B).

  The section belongs to the module 'Médico-éco' added in 2020 and 2021 (its first
  questions are on 48% of the inclusion visits of 2021 and 79% of those of 2024):
  an earlier visit is "not asked", not missing. The module has no visit-type or
  date condition (the application chooses the form by age alone), so the form
  can be filled on any visit, an earlier one included: 4 visits before 2020 hold it.
  The questions are on the last 12 months at inclusion and at follow-up alike: no
  _v0/_fu split.

  The labels and the lists of answers are those of the forms (350 adult, 351 child,
  352 Par-DD-QoL, 353 parents) and of the thesaurus V2.13 (PROGRESS.md D14). The
  output names are descriptive English names since 2026-11-20 (the column names
  before); the raw column stays in `column`. The amounts are in euros (thesaurus); the numbers are delivered as
  stored. Ranges are the limits of the form: a blocking check stops the counts above 50
  (eASPERGER.js lines 3560 to 3925), the other numbers at the length of their box. The hours a week of a person minding the child stop at 48.

  The distance to the farthest place of care is asked in metres: 18 of 303
  values are under 100, perhaps kilometres typed in the box of metres;
  delivered as typed (not converted: the unit of a value cannot be told).

  A section of the ASP cohort only.

  Years and centres (definition of done, D88; centres lettered as in D77, A
  the children's centre): the form is filled in centres A and B only; no
  variable has a shift of half an interquartile range; no step.

