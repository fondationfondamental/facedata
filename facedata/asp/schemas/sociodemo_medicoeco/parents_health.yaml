instrument: parents_health
title: "Health of the two parents"
tab: sociodemo_medicoeco
section: social and medico-economic
status: reviewed
notes: >
  For each of the two parents (columns ending in 1 and in 2): twelve boxes of
  history, fifteen boxes of disorders, the consultations of the last year
  (general practitioner, psychiatrist, psychologist, with their place), a
  psychotropic treatment and a parents' group. 371 inclusion visits (369 of
  children, 2 of adults) and 53 follow-up visits, from 2021 to 2026. Asked
  for children (form 353, filled in centres A and B only).

  The section belongs to the module 'Médico-éco' added in 2020 and 2021 (its first
  questions are on 48% of the inclusion visits of 2021 and 79% of those of 2024):
  an earlier visit is "not asked", not missing. The module has no visit-type or
  date condition (the application chooses the form by age alone), so the form
  can be filled on any visit, an earlier one included: 4 visits before 2020 hold it.
  The questions are on the last 12 months at inclusion and at follow-up alike: no
  _v0/_fu split.

  The labels and the lists of answers are those of the forms (350 adult, 351 child,
  352 Par-DD-QoL, 353 parents) and of the thesaurus V2.13 (PROGRESS.md D14). The
  output names are descriptive English names since 2026-11-20 (the column names
  before); the raw column stays in `column`. **The columns named dsmv are the disorders of each parent, not
  criteria of the patient**: two series of fifteen boxes, one per parent. The
  twelve history boxes are the body systems of the somatic history and the
  fifteen disorder boxes the psychiatric diagnoses of the parent (thesaurus).
  The 'other disorder, which' text of the form (DSMV15A, 353.php line 28) is
  not exported (request R167).

  The numbers of consultations and of group sessions are 0 after a no
  (`asked_if`, 2,337 cells). The history, disorder and place boxes are written
  0 on every save, after a no or with an empty question too: `derived_from`
  their question (4,845 `derived_doubt` cells). Ranges are the limits of the form: a blocking check stops the counts above 50
  (eASPERGER.js lines 3560 to 3925), the other numbers at the length of their box. These counts have no
  check and stop at 99.

  A section of the ASP cohort only.

  Years and centres (definition of done, D88; centres lettered as in D77, A
  the children's centre): two centres (A and B), the same in both. **A step
  with no known cause**: a parent who saw a general practitioner in the last
  12 months is 67% (parent 1) and 61% (parent 2) in 2021, 37% to 38% in 2022,
  and 7% to 25% from 2023, in A and B alike, while the psychiatrist (14% to
  25%) and the psychologist (19% to 29%) do not move; the count is 0 after
  every no and no count is typed under a no. Documented here and asked (O39,
  DM-28).

