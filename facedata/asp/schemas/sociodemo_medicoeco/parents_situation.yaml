instrument: parents_situation
title: "Situation of the two parents"
tab: sociodemo_medicoeco
section: social and medico-economic
status: draft
notes: >
  For each of the two parents (columns ending in 1 and in 2): the marital
  status, the level of education, the languages, the children and their
  custody, the employment, the work arrangements, the job, absences from
  work, and the resources and allowances. 371 inclusion visits (369 of children, 2 of adults) and 53 follow-up visits, from 2021 to 2026.
  Asked for children.

  The section belongs to the form added in 2020 and 2021 (its first
  questions are on 48% of the inclusion visits of 2021 and 79% of those of 2024):
  an earlier visit is "not asked", not missing.

  The form was first read without a dictionary; the labels and the lists of
  answers are now those of the thesaurus V2.13, which corrected several
  meanings guessed from the column names (PROGRESS.md D14). The output names
  stay the column names. The boxes of resources and allowances hold a 0 or a 1
  on every visit that has the form.

  A section of the ASP cohort only.

