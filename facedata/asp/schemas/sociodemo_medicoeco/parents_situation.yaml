instrument: parents_situation
title: "Situation of the two parents"
tab: sociodemo_medicoeco
section: social and medico-economic
status: reviewed
notes: >
  For each of the two parents (columns ending in 1 and in 2): the marital
  status, the level of education, the languages, the children and their
  custody, the employment, the work arrangements, the job, absences from
  work, and the resources and allowances. 371 inclusion visits (369 of
  children, 2 of adults) and 53 follow-up visits, from 2021 to 2026. Asked for
  children (form 353, filled in centres A and B only).

  The section belongs to the module 'Médico-éco' added in 2020 and 2021 (its first
  questions are on 48% of the inclusion visits of 2021 and 79% of those of 2024):
  an earlier visit is "not asked", not missing. The module has no visit-type or
  date condition (the application chooses the form by age alone), so the form
  can be filled on any visit, an earlier one included: 4 visits before 2020 hold it.
  The questions are on the last 12 months at inclusion and at follow-up alike: no
  _v0/_fu split.

  The labels and the lists of answers are those of the forms (350 adult, 351 child,
  352 Par-DD-QoL, 353 parents) and of the thesaurus V2.13 (PROGRESS.md D14). The
  output names are descriptive English names since 2026-11-20 (the column names
  before); the raw column stays in `column`. The boxes of resources and allowances hold a 0 or a 1 on every visit
  that has the form.

  The level of education is a radio of five answers coded 21 to 25 (primary
  school, lower secondary, CAP/BEP, baccalauréat, higher education; 353.php
  lines 97 and 113): a category, not a number (714 cells relabelled). The
  level of French has six answers that are not an ordered scale: a category.
  Full time is 1 and part time 0 on this form (lines 141 and 166); the
  thesaurus writes 1 and 2, as on the adult and child forms (R171). The block
  of parent 2 prints 'parent 1' in its questions on a new relationship and on
  the dependent children (lines 119 and 120, A95): the answers are read as
  those of parent 2.

  The weeks worked are asked after a yes to 'a work contract or self-employed
  work in the last 12 months': the form hides and clears them after a no
  (eASPERGER.js lines 10391 to 10410 and 10485 to 10505), so they are 0 after a
  no (`asked_if`, 128 cells). The days of absence for the child are 0 after a
  no (`asked_if`, 243 cells), with the range [0, 365] of a year (the form
  blocks above 350). Ranges are the limits of the form: a blocking check stops the counts above 50
  (eASPERGER.js lines 3560 to 3925), the other numbers at the length of their box. The weeks worked stop at 52, the share of a full
  time at 100, the dependent children at 12, the year of the reduction of the
  working time between 1980 and 2030.

  A section of the ASP cohort only.

  Years and centres (definition of done, D88; centres lettered as in D77, A
  the children's centre): two centres (A and B), within a few points of each
  other. The weeks worked in the last year have a median of 0 in 2021 (21
  visits) and 45 to 52 from 2022; the share of a full time is 100% in A and
  80% in B; the new partner moves between 33% and 64% on 21 and 22 visits.
  Small groups or habits, no known cause, documented here.

