instrument: schooling
title: "Schooling"
tab: sociodemo_medicoeco
section: social and medico-economic
status: draft
notes: >
  The school history: ordinary schooling, repeated years, support at school
  and its kind, the highest class reached, and the time at school.
  2134 inclusion visits (866 of children, 1268 of adults) and 266 follow-up visits, from 2011 to 2026.

  The form was first read without a dictionary; the labels and the lists of
  answers are now those of the thesaurus V2.13, which corrected several
  meanings guessed from the column names (PROGRESS.md D14). The output names
  stay the column names. A 9 is "not known". A support at school is reported
  for 420 of 2018 inclusion visits with an answer; its kind (assistant,
  specialised class, SESSAD, IME, day hospital...) is asked after a yes. The
  highest class is free text (1904 visits, 586 different spellings): it is
  delivered as written. The three boxes redoubc and the three boxes tempscola
  hold a 0 or a 1 on every visit that has the form. The questions on full-time
  schooling and on time out of school are asked from 2019. dmochang is a box of
  the follow-up form.

  A section of the ASP cohort only.

