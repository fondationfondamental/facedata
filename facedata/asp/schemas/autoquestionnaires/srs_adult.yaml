instrument: srs_adult
title: "Social Responsiveness Scale, adult self-report"
tab: autoquestionnaires
section: screening questionnaires
status: draft
notes: >
  Sixty-five items answered from 1 to 4 and a total, filled at the screening
  visit by adults: 481 screening visits, from 2019 to 2026. It belongs to the new set of forms.

  Identified from its name and its sixty-five items as the adult self-report
  form of the Social Responsiveness Scale (Constantino and Gruber), likely. The
  published raw score counts each answer from 0 to 3 and reverses seventeen
  items. The stored total follows that rule with fifteen reversed items (3, 7,
  11, 12, 15, 17, 21, 22, 26, 32, 38, 40, 43, 45 and 48): the items 52 and 55,
  reversed in the publication, are not. In the answers of this form these two
  items rise with the rest of the scale, so the stored rule is kept, and the
  difference with the publication is an open question (O12).

  The scores, each fitted on the data:

  - SRS adult total raw score (0 to 195): the sum of 65 items (reversed: 3, 7, 11, 12, 15, 17, 21, 22, 26, 32, 38, 40, 43, 45 and 48), equal to the stored score on 465 of 467 complete visits.

  An instrument of the ASP cohort only. The form filled by a relative is the instrument srs.

