instrument: cdi
title: "Children's Depression Inventory (CDI)"
tab: autoquestionnaires
section: child and parent questionnaires
status: draft
notes: >
  Twenty-seven items answered from 0 to 2 and a total, filled by children:
  482 inclusion visits of children, 2 of adults and 75 follow-up visits, from 2020 to 2026. It belongs to the new set of forms; the
  adults fill the BDI-II.

  Identified from its name and its twenty-seven items as the Children's
  Depression Inventory (Kovacs, 1985), sure: the stored total follows the
  published key, with its thirteen reversed items (2, 5, 7, 8, 10, 11, 13, 15,
  16, 18, 21, 24 and 25).

  The scores, each fitted on the data:

  - CDI total (0 to 54): the sum of 27 items (reversed: 2, 5, 7, 8, 10, 11, 13, 15, 16, 18, 21, 24 and 25), equal to the stored score on 316 of 341 complete visits; typed without its items on 114 visits, where it is kept as stored.

  The visits where the stored total is not the published sum are dated 2022
  and 2023, differ by one point for most, and all but one come from one
  centre: totals typed by hand. The total delivered is the published sum.

  An instrument of the ASP cohort only.

defaults: {type: item, range: [0, 2]}

