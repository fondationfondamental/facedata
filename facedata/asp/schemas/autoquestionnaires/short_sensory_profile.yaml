scores:
  ssp_tactile:
    label: "Short Sensory Profile, tactile sensitivity"
    sum: [ssp01, ssp02, ssp03, ssp04, ssp05, ssp06, ssp07]
    compare: ssp_tactile_stored
    otherwise: ssp_tactile_stored
  ssp_taste_smell:
    label: "Short Sensory Profile, taste and smell sensitivity"
    sum: [ssp08, ssp09, ssp10, ssp11]
    compare: ssp_taste_smell_stored
    otherwise: ssp_taste_smell_stored
  ssp_movement:
    label: "Short Sensory Profile, movement sensitivity"
    sum: [ssp12, ssp13, ssp14]
    compare: ssp_movement_stored
    otherwise: ssp_movement_stored
  ssp_seeks_sensation:
    label: "Short Sensory Profile, underresponsive, seeks sensation"
    sum: [ssp15, ssp16, ssp17, ssp18, ssp19, ssp20, ssp21]
    compare: ssp_seeks_sensation_stored
    otherwise: ssp_seeks_sensation_stored
  ssp_auditory_filtering:
    label: "Short Sensory Profile, auditory filtering"
    sum: [ssp22, ssp23, ssp24, ssp25, ssp26, ssp27]
    compare: ssp_auditory_filtering_stored
    otherwise: ssp_auditory_filtering_stored
  ssp_low_energy:
    label: "Short Sensory Profile, low energy, weak"
    sum: [ssp28, ssp29, ssp30, ssp31, ssp32, ssp33]
    compare: ssp_low_energy_stored
    otherwise: ssp_low_energy_stored
  ssp_visual_auditory:
    label: "Short Sensory Profile, visual and auditory sensitivity"
    sum: [ssp34, ssp35, ssp36, ssp37, ssp38]
    compare: ssp_visual_auditory_stored
    otherwise: ssp_visual_auditory_stored
  ssp_total:
    label: "Short Sensory Profile total (38 to 190, lower is more atypical)"
    sum: [ssp_tactile, ssp_taste_smell, ssp_movement, ssp_seeks_sensation, ssp_auditory_filtering, ssp_low_energy, ssp_visual_auditory]
