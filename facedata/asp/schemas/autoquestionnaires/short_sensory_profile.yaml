instrument: short_sensory_profile
title: "Short Sensory Profile (Dunn)"
tab: autoquestionnaires
section: child and parent questionnaires
status: reviewed
notes: >
  Thirty-eight items answered from 1 to 5 and seven section scores: 853
  inclusion visits (634 of children, 219 of adults) and 148 follow-up visits,
  from 2011 to 2026; 7 visits hold scores only.

  **Adults.** The profile was written for children (the age range of its norms
  is to verify). 239 visits (219 at inclusion, dated 2011 to 2023, from three
  centres) are visits of patients aged 18 or more; they are delivered as
  recorded, the scores are plain sums, and no cut-off of the profile is applied
  here.

  Identified from its name (dunn), its thirty-eight items and its seven sections
  as the Short Sensory Profile (Dunn, 1999), sure: the seven stored scores are
  sums of 7, 4, 3, 7, 6, 6 and 5 consecutive items, the sizes of the published
  sections, in their order. A low score is a frequent behaviour.

  The scores, each fitted on the data:

  - Short Sensory Profile, tactile sensitivity: the sum of 7 items (1, 2, 3, 4, 5, 6 and 7), equal to the stored score on 945 of 945 complete visits; typed without its items on 7 visits, where it is kept as stored.
  - Short Sensory Profile, taste and smell sensitivity: the sum of 4 items (8, 9, 10 and 11), equal to the stored score on 945 of 945 complete visits; typed without its items on 7 visits, where it is kept as stored.
  - Short Sensory Profile, movement sensitivity: the sum of 3 items (12, 13 and 14), equal to the stored score on 945 of 945 complete visits; typed without its items on 7 visits, where it is kept as stored.
  - Short Sensory Profile, underresponsive, seeks sensation: the sum of 7 items (15, 16, 17, 18, 19, 20 and 21), equal to the stored score on 945 of 945 complete visits; typed without its items on 7 visits, where it is kept as stored.
  - Short Sensory Profile, auditory filtering: the sum of 6 items (22, 23, 24, 25, 26 and 27), equal to the stored score on 923 of 945 complete visits; typed without its items on 7 visits, where it is kept as stored.
  - Short Sensory Profile, low energy, weak: the sum of 6 items (28, 29, 30, 31, 32 and 33), equal to the stored score on 945 of 945 complete visits; typed without its items on 7 visits, where it is kept as stored.
  - Short Sensory Profile, visual and auditory sensitivity: the sum of 5 items (34, 35, 36, 37 and 38), equal to the stored score on 945 of 945 complete visits; typed without its items on 7 visits, where it is kept as stored.

  The total is not stored: it is computed here as the sum of the seven sections
  (38 to 190), as the publication defines it. ssp_completed_by says who filled
  the questionnaires of the child block (filled on 921 of the 922 visits that
  hold this profile); father, mother or another person (thesaurus). The 22
  visits where the auditory filtering score differs from the sum of its items
  are all dated 2013.

  **Year and centre.** 25 of the 46 variables reach 0.5 or more (25 by year, 16
  by centre): the 38 items are on a 1 to 5 scale (one level is 1.0 or more of
  the interquartile range), and the seven sections and the total stand at 0.30
  to 0.50 by year and 0.12 to 0.40 by centre (the total at 0.46 and 0.17). The
  age mix: children are 78% of the visits, 100% of centre A, 88% to 99% of B and
  C, 6% of D and none of E; the share of children by year falls from 55% to 67%
  in 2013 to 2015 to 4% to 18% in 2016 and 2017, and is 87% to 100% in 2019 and
  from 2021. The step is the dip of 2018 to 2020 in both age groups (children
  143, 136 and 138, adults 132, 117.5 and 120, against 141 to 155 and 143 to 160
  in the other years): a step with no known cause (no change of the form is
  known; the adults of 2011 to 2023 come from three centres, D, E and C). Within
  children the centres differ by 0.07, within adults by 0.14.

  An instrument of the ASP cohort only.

