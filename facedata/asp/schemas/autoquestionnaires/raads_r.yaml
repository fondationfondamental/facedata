scores:
  raads_social:
    label: "RAADS-R social relatedness"
    sum: [raads01, raads03, raads05, raads06, raads08, raads11, raads12, raads14, raads17, raads18, raads20, raads21, raads22, raads23, raads25, raads26, raads28, raads31, raads37, raads38, raads39, raads43, raads44, raads45, raads47, raads48, raads53, raads54, raads55, raads60, raads61, raads64, raads68, raads69, raads72, raads76, raads77, raads79, raads80]
    reverse: [raads01, raads06, raads11, raads18, raads23, raads26, raads37, raads43, raads47, raads48, raads53, raads68, raads72, raads77]
    compare: raads_social_stored
    otherwise: raads_social_stored
  raads_interests:
    label: "RAADS-R circumscribed interests"
    sum: [raads09, raads13, raads24, raads30, raads32, raads40, raads41, raads50, raads52, raads56, raads63, raads70, raads75, raads78]
    compare: raads_interests_stored
    otherwise: raads_interests_stored
  raads_language:
    label: "RAADS-R language"
    sum: [raads02, raads07, raads15, raads27, raads35, raads58, raads66]
    reverse: [raads58]
    compare: raads_language_stored
    otherwise: raads_language_stored
  raads_sensory_motor:
    label: "RAADS-R sensory motor"
    sum: [raads04, raads10, raads16, raads19, raads29, raads33, raads34, raads36, raads42, raads46, raads49, raads51, raads57, raads59, raads62, raads65, raads67, raads71, raads73, raads74]
    reverse: [raads33, raads62]
    compare: raads_sensory_motor_stored
    otherwise: raads_sensory_motor_stored
  raads_total:
    label: "RAADS-R total (0 to 240)"
    sum: [raads_social, raads_interests, raads_language, raads_sensory_motor]
    compare: raads_total_stored
