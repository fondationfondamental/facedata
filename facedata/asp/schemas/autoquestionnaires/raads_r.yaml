instrument: raads_r
title: "Ritvo Autism Asperger Diagnostic Scale-Revised (RAADS-R)"
tab: autoquestionnaires
section: screening questionnaires
status: draft
notes: >
  Eighty items answered from 0 to 3, four sub-scale scores and a total, filled
  at the screening visit by adults: 331 screening visits, from 2020 to 2026.
  It belongs to the new set of forms: it replaces the Autism-Spectrum Quotient of the old
  set at screening.

  Identified from its name and its eighty items as the RAADS-R (Ritvo and
  others, 2011), sure: the four stored scores are reproduced by the published
  key, with its seventeen reversed items (1, 6, 11, 18, 23, 26, 33, 37, 43, 47,
  48, 53, 58, 62, 68, 72 and 77) and its four sub-scales (social relatedness 39
  items, circumscribed interests 14, language 7, sensory motor 20).

  The scores, each fitted on the data:

  - RAADS-R social relatedness: the sum of 39 items (reversed: 1, 6, 11, 18, 23, 26, 37, 43, 47, 48, 53, 68, 72 and 77), equal to the stored score on 319 of 320 complete visits; typed without its items on 159 visits, where it is kept as stored.
  - RAADS-R circumscribed interests: the sum of 14 items, equal to the stored score on 319 of 320 complete visits; typed without its items on 159 visits, where it is kept as stored.
  - RAADS-R language: the sum of 7 items (2, 7, 15, 27, 35, 58 and 66; reversed: 58), equal to the stored score on 319 of 320 complete visits; typed without its items on 159 visits, where it is kept as stored.
  - RAADS-R sensory motor: the sum of 20 items (reversed: 33 and 62), equal to the stored score on 319 of 320 complete visits; typed without its items on 159 visits, where it is kept as stored.

  The stored total (raads) is filled on fewer than five visits. raads_total is
  therefore computed here, as the publication defines it: the sum of the four
  sub-scales, which share the eighty items between them. It is so available on
  the visits where the sub-scales were typed without the items.

  An instrument of the ASP cohort only.

defaults: {type: item, range: [0, 3]}

