instrument: ados_module1
title: "ADOS-2, module 1"
tab: autoquestionnaires
section: diagnostic instruments
status: draft
notes: >
  The scores of the module 1 (children with no phrase speech): fewer than five visits, and
  no item recorded (the 34 item columns are empty on every row, ignored.yaml).
  **Too few visits to verify**: the scores are delivered as stored.

  An instrument of the ASP cohort only.

variables:
  ados1_social_affect: {column: a21as, type: number, label: "Module 1 social affect, as stored", range: [0, 20], winsor: false}
  ados1_restricted_repetitive: {column: a21crr, type: number, label: "Module 1 restricted and repetitive behaviour, as stored", range: [0, 8], winsor: false}
  ados1_total: {column: a21tot, type: number, label: "Module 1 total, as stored", range: [0, 28], winsor: false}
  ados1_classification: {column: a21class, type: category, label: "Module 1 classification", codes: {"1": autism, "2": autism_spectrum, "3": non_spectrum}}
  ados1_comparison_score: {column: a21link, type: number, label: "Module 1 comparison score (1 to 10), as stored", range: [1, 10], winsor: false}
