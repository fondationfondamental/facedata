instrument: brief_adult
title: "BRIEF-A"
tab: autoquestionnaires
section: adult questionnaires
status: draft
notes: >
  The Behavior Rating Inventory of Executive Function, adult version (Roth and
  others, 2005): 75 items answered from 1 to 3, nine scale scores, two indexes
  and the composite, three validity scores. 781 inclusion visits and 5
  follow-up visits, from 2013 to 2026.

  **Two forms in the same columns, found in the data.** A visit holds either
  86 items or 75: 581 visits hold an item beyond the 75th (580 of them are
  children) and 591 hold the first 75 only (584 are adults). The first is the
  form filled by a parent for a child (BRIEF, 86 items, eight scales), the
  second the form of adults (BRIEF-A, 75 items, nine scales): the scale
  self-monitor (brief_score4) and the infrequency score (brief_if) exist on the
  visits of adults only. The two forms are two instruments (brief_parent and
  brief_adult) with their own columns, and brief_form says which one a visit
  holds. A visit is read as the form of adults when it holds one of the two
  scores that only that form has, and as the form of children otherwise;
  9 visits hold the first 75 items and no such score and are read as the
  form of children.

  The scores, each fitted on the data of this form (raw sums of answers from 1
  to 3; no T-score is stored):

  - inhibit: 8 items (5, 16, 29, 36, 43, 55, 58 and 73), equal to the stored score on 558 of 560 complete visits; typed without the items on 203 visits.
  - shift: 6 items (8, 22, 32, 44, 61 and 67), equal to the stored score on 558 of 560 complete visits; typed without the items on 203 visits.
  - emotional control: 10 items (1, 12, 19, 28, 33, 42, 51, 57, 69 and 72), equal to the stored score on 558 of 560 complete visits; typed without the items on 203 visits.
  - self-monitor: 6 items (13, 23, 37, 50, 64 and 70), equal to the stored score on 558 of 560 complete visits; typed without the items on 204 visits.
  - initiate: 8 items (6, 14, 20, 25, 45, 49, 53 and 62), equal to the stored score on 558 of 560 complete visits; typed without the items on 203 visits.
  - working memory: 8 items (4, 11, 17, 26, 35, 46, 56 and 68), equal to the stored score on 558 of 560 complete visits; typed without the items on 203 visits.
  - plan and organize: 10 items (9, 15, 21, 34, 39, 47, 54, 63, 66 and 71), equal to the stored score on 558 of 560 complete visits; typed without the items on 203 visits.
  - task monitor: 6 items (2, 18, 24, 41, 52 and 75), equal to the stored score on 558 of 560 complete visits; typed without the items on 203 visits.
  - organization of materials: 8 items (3, 7, 30, 31, 40, 60, 65 and 74), equal to the stored score on 558 of 559 complete visits; typed without the items on 203 visits.
  - Behavioral Regulation Index: the sum of 4 scales (30 items), equal to the stored score on 558 of 560 complete visits.
  - Metacognition Index: the sum of 5 scales (40 items), equal to the stored score on 558 of 559 complete visits.
  - Global Executive Composite: the sum of 9 scales (70 items), equal to the stored score on 558 of 559 complete visits.

  The names of the scales are those of the published profile, matched by the
  number of items of each scale and their order: likely, to be confirmed with
  the form (O12). A scale score typed without the items is kept as stored; a
  few typed values are above the highest possible sum (a T-score typed in
  place of the raw score) and are out_of_range. The validity scores do not
  come from a plain sum and are delivered as stored.

  An instrument of the ASP cohort only.

version:
  name: brief_form
  filled:                            # tested top to bottom, first match wins
    brief_adult: [brief_score4, brief_if]
    brief_parent: [brief1, brief2, brief3, brief4, brief5, brief6, brief7, brief8, brief9, brief10, brief11, brief12, brief13, brief14, brief15, brief16, brief17, brief18, brief19, brief20, brief21, brief22, brief23, brief24, brief25, brief26, brief27, brief28, brief29, brief30, brief31, brief32, brief33, brief34, brief35, brief36, brief37, brief38, brief39, brief40, brief41, brief42, brief43, brief44, brief45, brief46, brief47, brief48, brief49, brief50, brief51, brief52, brief53, brief54, brief55, brief56, brief57, brief58, brief59, brief60, brief61, brief62, brief63, brief64, brief65, brief66, brief67, brief68, brief69, brief70, brief71, brief72, brief73, brief74, brief75, brief76, brief77, brief78, brief79, brief80, brief81, brief82, brief83, brief84, brief85, brief86, brief_rel, brief_rela, brief_cone, brief_cona, brief_bri, brief_mi, brief_gec, brief_is, brief_ns, brief_score1, brief_score2, brief_score3, brief_score5, brief_score6, brief_score7, brief_score8, brief_score9]

