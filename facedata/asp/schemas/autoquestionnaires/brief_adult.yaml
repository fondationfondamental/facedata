  briefa_emotional_control: {label: "BRIEF-A emotional control (10 to 30)", sum: [briefa01, briefa12, briefa19, briefa28, briefa33, briefa42, briefa51, briefa57, briefa69, briefa72], compare: briefa_emotional_control_stored, otherwise: briefa_emotional_control_stored}
