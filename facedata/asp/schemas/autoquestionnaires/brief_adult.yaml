  briefa_plan_organize: {label: "BRIEF-A plan and organize (10 to 30)", sum: [briefa09, briefa15, briefa21, briefa34, briefa39, briefa47, briefa54, briefa63, briefa66, briefa71], compare: briefa_plan_organize_stored, otherwise: briefa_plan_organize_stored}
