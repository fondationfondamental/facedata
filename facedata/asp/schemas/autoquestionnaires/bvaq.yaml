instrument: bvaq
title: "Bermond-Vorst Alexithymia Questionnaire, 20 items"
tab: autoquestionnaires
section: adult questionnaires
status: draft
notes: >
  Twenty items answered from 1 to 5 and eight scores, at the inclusion visit:
  440 visits, from 2019 to 2026. It belongs to the new set of forms. It is filled by adults only.

  Identified from its name and its twenty items as a twenty-item form of the
  Bermond-Vorst Alexithymia Questionnaire, likely. Its five dimensions have
  four items each, and the eight scores look like the five dimensions, two
  components and the total: the sum of the first five scores is the last one
  on almost every visit.

  **The scores do not follow the items.** No score is a sum of the twenty
  items, reversed or not, and none is related to them by more than a
  correlation of 0.25, although items and scores are filled on the same visits
  (441 visits hold both). Either the items are not exported in the order of the
  form, or the scores come from other answers (open question O12). Until this
  is settled the items and the scores are both delivered as stored, and the
  scores are not to be read as scores of these items.

  The scores, each fitted on the data:

  - BVAQ verbalising (factor 1: difficulty putting emotions into words): delivered as stored (603 visits); no sum of the items reproduces it.
  - BVAQ fantasising (factor 2: reduced fantasy life): delivered as stored (603 visits); no sum of the items reproduces it.
  - BVAQ identifying (factor 3: difficulty identifying emotions): delivered as stored (603 visits); no sum of the items reproduces it.
  - BVAQ emotionalising (factor 4: low emotional reactivity): delivered as stored (603 visits); no sum of the items reproduces it.
  - BVAQ analysing (factor 5: externally oriented thinking): delivered as stored (603 visits); no sum of the items reproduces it.
  - BVAQ affective dimensions: delivered as stored (613 visits); no sum of the items reproduces it.
  - BVAQ cognitive dimensions: delivered as stored (613 visits); no sum of the items reproduces it.
  - BVAQ total: delivered as stored (614 visits); no sum of the items reproduces it.

  An instrument of the ASP cohort only.

defaults: {type: item, range: [1, 5]}

