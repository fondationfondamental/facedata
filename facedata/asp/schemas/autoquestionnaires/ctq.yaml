instrument: ctq
title: "Childhood Trauma Questionnaire (CTQ)"
tab: autoquestionnaires
section: adult questionnaires
status: reviewed
notes: >
  Twenty-eight items from 1 to 5, five stored sub-scores, a total and the denial
  score, at the inclusion visit: 395 visits, from 2020 to 2026, and 11 follow-up
  visits. It belongs to the new set of forms. It is filled by adults only.

  Same instrument as in FACE BP, SZ and DR, and the same key. **The answers were
  compared with BP before the schema was copied** (the lesson of FACE DR, where
  seven items are stored already reversed). Here the seven "good childhood"
  items fall when the abuse items rise, as in BP (correlations of -0.38 to
  -0.55): the coding is the BP one. The items are delivered as the form stores
  them, 1 (never true) to 5 (very often true); the seven positive items (2, 5,
  7, 13, 19, 26 and 28) are reversed in the scores only (`reverse`). The form
  asks about childhood and adolescence (growing up), and every item label says
  so, with the sub-scale of the item.

  **Two stored sub-scores leave out an item, and the stored total with them.**
  The stored physical abuse is the sum of the items 9, 11, 15 and 17 (400 of 404
  visits): the item 12 is missing. The stored emotional abuse is the sum of the
  items 3, 8, 18 and 25 (400 of 401): the item 14 is missing. The cause is in
  the script of the form (`334_score.js`, lines 45 and 72), which reads two
  radios named CTQ012 and CTQ014 that do not exist in the form, so that the
  items 12 and 14 count 0. The stored sexual abuse is right (405 of 405). The
  stored total is the sum of the five stored sub-scores (400 of 400), so it
  misses two items.

  **The stored neglect scores follow the script, not the key.** The stored
  physical neglect follows the key on 377 of 403 visits and the stored emotional
  neglect on 321 of 404. The script maps the answer 1 of a reversed item to 1
  (`334_score.js`, line 15), where the key gives 5, and counts every other
  answer as the key does: the 83 visits of the emotional neglect and the 26 of
  the physical neglect that differ are exactly the visits where a reversed item
  is answered 1 (no rule was found before the review, O12 (7)). The EMR rule is
  written as formulas "as stored" (`ctq_emotional_neglect_as_stored`,
  `ctq_physical_neglect_as_stored`, with `points`) that reproduce the stored
  scores on every visit: no score_mismatch is left on the two neglect scores,
  and the delivered neglect scores are not compared with the stored ones.

  The five sub-scores and the total are therefore computed with the BP key and
  delivered. The stored values are read to be checked and are not delivered:
  formulas "as stored" reproduce the two abuse scores and the total (5 visits
  keep a stale stored value: 4 physical abuse and 1 emotional abuse), and the
  stored neglect scores are reproduced by the formulas of the previous
  paragraph. The columns are not those of BP: the even numbers from ctq30 to
  ctq38 hold the sub-scores here, and there is no severity class. The stored
  sub-scores come from the script of the EMR here; in FACE DR the cause is the
  export (DR O17).

  **Denial.** Items 10, 16 and 22 do not enter the sub-scores. The denial score
  is the number of them answered 5, exactly (0 to 3), and is computed here from
  the three items, with the same rule in the four cohorts; the stored score
  (ctq40) is the check and is not delivered. They agree on every visit (401 of
  401): the script of this cohort needs the three answers, where the scripts of
  BP, SZ and DR count an unanswered item as 0.

  **Year and centre.** 7 of the 24 variables reach 0.5 or more (6 by year, 7 by
  centre): the 28 items are on a 1 to 5 scale (one level is 1.0 or more of the
  interquartile range). The scores stand at 0.00 to 0.25 by year and 0.00 to
  0.19 by centre, the total at 0.17 and 0.19 (median 40 to 43 by year, 38 to
  43.5 by centre). Adults only, 2021 to 2026 (2020 has fewer than 20 totals). No
  step.

defaults: {type: item, range: [1, 5]}

variables:
  ctq01: {label: "CTQ item 1: physical neglect, scored as answered; childhood and adolescence"}
  ctq02: {label: "CTQ item 2: physical neglect, positive item (reversed in the score); childhood and adolescence"}
  ctq03: {label: "CTQ item 3: emotional abuse, scored as answered; childhood and adolescence"}
  ctq04: {label: "CTQ item 4: physical neglect, scored as answered; childhood and adolescence"}
  ctq05: {label: "CTQ item 5: emotional neglect, positive item (reversed in the score); childhood and adolescence"}
  ctq06: {label: "CTQ item 6: physical neglect, scored as answered; childhood and adolescence"}
  ctq07: {label: "CTQ item 7: emotional neglect, positive item (reversed in the score); childhood and adolescence"}
  ctq08: {label: "CTQ item 8: emotional abuse, scored as answered; childhood and adolescence"}
  ctq09: {label: "CTQ item 9: physical abuse, scored as answered; childhood and adolescence"}
  ctq10: {label: "CTQ item 10: denial (minimization), in the denial score only; childhood and adolescence"}
  ctq11: {label: "CTQ item 11: physical abuse, scored as answered; childhood and adolescence"}
  ctq12: {label: "CTQ item 12: physical abuse, scored as answered; childhood and adolescence"}
  ctq13: {label: "CTQ item 13: emotional neglect, positive item (reversed in the score); childhood and adolescence"}
  ctq14: {label: "CTQ item 14: emotional abuse, scored as answered; childhood and adolescence"}
  ctq15: {label: "CTQ item 15: physical abuse, scored as answered; childhood and adolescence"}
  ctq16: {label: "CTQ item 16: denial (minimization), in the denial score only; childhood and adolescence"}
  ctq17: {label: "CTQ item 17: physical abuse, scored as answered; childhood and adolescence"}
  ctq18: {label: "CTQ item 18: emotional abuse, scored as answered; childhood and adolescence"}
  ctq19: {label: "CTQ item 19: emotional neglect, positive item (reversed in the score); childhood and adolescence"}
  ctq20: {label: "CTQ item 20: sexual abuse, scored as answered; childhood and adolescence"}
  ctq21: {label: "CTQ item 21: sexual abuse, scored as answered; childhood and adolescence"}
  ctq22: {label: "CTQ item 22: denial (minimization), in the denial score only; childhood and adolescence"}
  ctq23: {label: "CTQ item 23: sexual abuse, scored as answered; childhood and adolescence"}
  ctq24: {label: "CTQ item 24: sexual abuse, scored as answered; childhood and adolescence"}
  ctq25: {label: "CTQ item 25: emotional abuse, scored as answered; childhood and adolescence"}
  ctq26: {label: "CTQ item 26: physical neglect, positive item (reversed in the score); childhood and adolescence"}
  ctq27: {label: "CTQ item 27: sexual abuse, scored as answered; childhood and adolescence"}
  ctq28: {label: "CTQ item 28: emotional neglect, positive item (reversed in the score); childhood and adolescence"}

  # The sub-scores and the total as stored. Used only to check our own scores.
  ctq_physical_abuse_stored: {column: ctq30, label: Physical abuse as stored (four items), range: [4, 20], keep: false}
  ctq_emotional_neglect_stored: {column: ctq32, label: Emotional neglect as stored, range: [5, 25], keep: false}
  ctq_physical_neglect_stored: {column: ctq34, label: Physical neglect as stored, range: [5, 25], keep: false}
  ctq_sexual_abuse_stored: {column: ctq36, label: Sexual abuse as stored, range: [5, 25], keep: false}
  ctq_emotional_abuse_stored: {column: ctq38, label: Emotional abuse as stored (four items), range: [4, 20], keep: false}
  ctq_total_stored: {column: ctq39, label: CTQ total as stored (23 items), range: [23, 115], keep: false}
  ctq_denial_stored: {column: ctq40, label: "Denial score as stored", range: [0, 3], keep: false}

scores:
  ctq_emotional_abuse: {label: CTQ emotional abuse, sum: [ctq03, ctq08, ctq14, ctq18, ctq25]}
  ctq_physical_abuse: {label: CTQ physical abuse, sum: [ctq09, ctq11, ctq12, ctq15, ctq17]}
  ctq_sexual_abuse: {label: CTQ sexual abuse, sum: [ctq20, ctq21, ctq23, ctq24, ctq27], compare: ctq_sexual_abuse_stored}
  ctq_emotional_neglect: {label: CTQ emotional neglect, sum: [ctq05, ctq07, ctq13, ctq19, ctq28], reverse: [ctq05, ctq07, ctq13, ctq19, ctq28]}
  ctq_physical_neglect: {label: CTQ physical neglect, sum: [ctq01, ctq02, ctq04, ctq06, ctq26], reverse: [ctq02, ctq26]}
  ctq_total:
    label: CTQ total (25 items)
    sum: [ctq01, ctq02, ctq03, ctq04, ctq05, ctq06, ctq07, ctq08, ctq09, ctq11,
          ctq12, ctq13, ctq14, ctq15, ctq17, ctq18, ctq19, ctq20, ctq21, ctq23,
          ctq24, ctq25, ctq26, ctq27, ctq28]
    reverse: [ctq02, ctq05, ctq07, ctq13, ctq19, ctq26, ctq28]
  ctq_emotional_abuse_as_stored:
    label: "Emotional abuse as the EMR computes it here (without the item 14), to check the stored score"
    sum: [ctq03, ctq08, ctq18, ctq25]
    compare: ctq_emotional_abuse_stored
    keep: false
  ctq_physical_abuse_as_stored:
    label: "Physical abuse as the EMR computes it here (without the item 12), to check the stored score"
    sum: [ctq09, ctq11, ctq15, ctq17]
    compare: ctq_physical_abuse_stored
    keep: false
  ctq_total_as_stored:
    label: "CTQ total as the EMR computes it here (the sum of the five stored sub-scores), to check the stored total"
    sum: [ctq_physical_abuse_stored, ctq_emotional_neglect_stored, ctq_physical_neglect_stored, ctq_sexual_abuse_stored, ctq_emotional_abuse_stored]
    compare: ctq_total_stored
    keep: false
  ctq_emotional_neglect_as_stored:
    label: "Emotional neglect as the EMR computes it here (an item answered 1 counts 1, not 5), to check the stored score"
    sum: [ctq05, ctq07, ctq13, ctq19, ctq28]
    points: {"1": 1, "2": 4, "3": 3, "4": 2, "5": 1}
    compare: ctq_emotional_neglect_stored
    keep: false
  ctq_physical_neglect_direct_as_stored:
    label: "Physical neglect, the three items that are not reversed (to check the stored score)"
    sum: [ctq01, ctq04, ctq06]
    keep: false
  ctq_physical_neglect_reversed_as_stored:
    label: "Physical neglect, items 2 and 26 as the EMR reverses them (an item answered 1 counts 1, not 5)"
    sum: [ctq02, ctq26]
    points: {"1": 1, "2": 4, "3": 3, "4": 2, "5": 1}
    keep: false
  ctq_physical_neglect_as_stored:
    label: "Physical neglect as the EMR computes it here, to check the stored score"
    sum: [ctq_physical_neglect_direct_as_stored, ctq_physical_neglect_reversed_as_stored]
    compare: ctq_physical_neglect_stored
    keep: false
  ctq_denial:
    label: "CTQ denial (minimization) score: number of the items 10, 16 and 22 answered 5 (0 to 3)"
    sum: [ctq10, ctq16, ctq22]
    points: {"1": 0, "2": 0, "3": 0, "4": 0, "5": 1}
    compare: ctq_denial_stored
