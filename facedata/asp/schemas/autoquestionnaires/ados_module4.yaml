instrument: ados_module4
title: "ADOS, module 4"
tab: autoquestionnaires
section: diagnostic instruments
status: draft
notes: >
  The thirty-two items of the module 4 (sections A to E), its algorithm scores
  and its classification: 1435 inclusion visits and 80 follow-up visits, from 2011 to 2026;
  adolescents and adults (1119 of the inclusion visits are 18 or over).

  Identified as the module 4 with its original algorithm (Lord and others,
  2000), sure: communication is the sum of four items (A4, A8, A9, A10),
  reciprocal social interaction the sum of seven (B1, B2, B6, B8, B9, B11, B12),
  the total their sum, and stereotyped behaviours and restricted interests the
  sum of four (D1, D2, D4, D5). A code 3 counts 2, and the codes 7 and 8 count
  0. The items are delivered as recorded: **the codes 7 and 8 are not levels**.

  **Two editions of the form, found in the data.** The item B10 is the one that
  the second edition (ADOS-2) added to the module. It is empty on 254 visits
  that hold the other items (249 of them dated until 2019) and filled on 1101: the
  first were made with the first edition of the ADOS, the others with the
  ADOS-2. The other items are the same and are delivered in the same columns;
  **ados4_b10 is empty on a visit of the first edition**. The algorithm is the
  same for both.

  **The two stored sub-scores count a code 3 as 3, on every visit.** On the
  visits where one of its items is coded 3, the stored communication score is
  the sum with the 3 kept on 476 of 477 and the published sum on 0 of 477; the
  stored social interaction score, on 157 of 157 and 0 of 157. 40 stored
  communication scores are above the maximum of 8 and 14 stored social scores
  above 14. The two sub-scores are therefore computed with the published rule
  and delivered; the stored ones are read to be checked (formulas "as stored")
  and are not delivered.

  **The stored total counts a code 3 as 3 on part of the first edition.** Where
  an item of the algorithm is coded 3, the stored total of a visit of the
  ADOS-2 is the published sum on 413 of 413. On the visits of the first
  edition dated until 2017 it is the published sum on 39 of 80 and the sum
  with the 3 kept on 41 of 80; from 2018 it is the published sum on
  29 of 29 (score_mismatch where the stored total keeps the 3). The total
  delivered follows the publication on every visit.

  The stored score of stereotyped behaviours and restricted interests equals
  the published sum on 1,158 of 1,238 visits. The 80 others hold a higher number;
  77 of them are dated before 2019 and no other item explains them. The
  score delivered is the published sum (score_mismatch on those visits).

  The classification follows the three cut-offs of the module (autism:
  communication 3, social 6, total 10; autism spectrum: 2, 4 and 7) applied to
  the corrected sub-scores on 1,321 of 1,335 visits; it is delivered as stored
  (on fewer than five visits of the first edition the corrected scores give another class).

  **A stored total of 0 with no item is not a total.** On 167 visits, dated from 2013
  to 2017, the total of the module 4 holds a 0 and no item is recorded; 104 of them
  are visits of the module 3. The form wrote that zero; it is not delivered.

  An instrument of the ASP cohort only.

