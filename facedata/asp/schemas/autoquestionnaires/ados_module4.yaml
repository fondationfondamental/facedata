instrument: ados_module4
title: "ADOS, module 4"
tab: autoquestionnaires
section: diagnostic instruments
status: reviewed
notes: >
  The thirty-two items of the module 4 (sections A to E), its algorithm scores
  and its classification: 1,368 visits (1,359 at inclusion and 9 follow-up
  visits), from 2009 to 2026; adolescents and adults (1,130 of the inclusion
  visits are 18 or over).

  Identified as the module 4 with its original algorithm (Lord and others,
  2000), sure: communication is the sum of four items (A4, A8, A9, A10),
  reciprocal social interaction the sum of seven (B1, B2, B6, B8, B9, B11, B12),
  the total their sum, and stereotyped behaviours and restricted interests the
  sum of four (D1, D2, D4, D5). A code 3 counts 2, and the codes 7 and 8 count
  0. The items are delivered as recorded: **the codes 7 and 8 are not levels**.

  **Two editions of the form, found in the data.** The item B10 is the one that
  the second edition (ADOS-2) added to the module. It is empty on 254 visits
  that hold the other items (249 of them dated until 2019) and filled on 1101:
  the first were made with the first edition of the ADOS, the others with the
  ADOS-2. The other items are the same and are delivered in the same columns;
  **ados4_b10 is empty on a visit of the first edition**. The algorithm is the
  same for both.

  **The two stored sub-scores count a code 3 as 3, on every visit, and the cause
  is the export.** The script of the form converts a 3 to 2 (`281_score.js`,
  lines 62, 81 and 256-266); the export sums the raw codes (see the instrument
  ados). Formulas "as stored" sum the raw codes and reproduce the stored values.
  On the visits where one of its items is coded 3, the stored communication
  score is the sum with the 3 kept on 476 of 477 and the published sum on 0 of
  477; the stored social interaction score, on 157 of 157 and 0 of 157. 40
  stored communication scores are above the maximum of 8 and 14 stored social
  scores above 14. The two sub-scores are therefore computed with the published
  rule and delivered; the stored ones are read to be checked (formulas "as
  stored") and are not delivered.

  **The stored total counts a code 3 as 3 on part of the first edition (the
  export's sum).** Where an item of the algorithm is coded 3, the stored total
  of a visit of the ADOS-2 is the published sum on 413 of 413. On the visits of
  the first edition dated until 2017 it is the published sum on 39 of 80 and the
  sum with the 3 kept on 41 of 80; from 2018 it is the published sum on 29 of 29
  (score_mismatch where the stored total keeps the 3). The total delivered
  follows the publication on every visit.

  The stored score of stereotyped behaviours and restricted interests equals the
  published sum on 1,158 of 1,238 visits. The 80 others hold a higher number,
  and every one equals the published sum plus the item C1: the form counted C1
  until 2018-12-11 and dropped it then (`281_score.js`, lines 330-332), so these
  are values written under the earlier rule (77 of them are dated before 2019).
  The score delivered is the published sum (score_mismatch on those visits).

  The classification follows the three cut-offs of the module (autism:
  communication 3, social 6, total 10; autism spectrum: 2, 4 and 7) applied to
  the corrected sub-scores on 1,321 of 1,335 visits; it is delivered as stored
  (on fewer than five visits of the first edition the corrected scores give
  another class). A defect of the script of the form (`281_score.js`, line 126:
  an operator precedence) leaves a stale or empty class on 28 of 1,349 visits of
  this module.

  **A stored total of 0 with no item is not a total.** The export computes the
  two sub-scores of the module 4 on every row of the first edition without
  testing which module was entered (`easperger_aut_c1ados.sql`, lines 248-251;
  `ados.yaml` of the export, line 81): 175 stored totals of the module 4 are 0,
  167 of them on visits dated from 2013 to 2017 where no item is recorded, and
  104 of those are visits of the module 3 (answer to O12 (3)). It is the export
  that wrote that zero; it is not delivered.

  **Year and centre.** 14 of the 28 variables reach 0.5 or more (10 by year, 11
  by centre): the items are whole numbers (0 to 3), and the four scores stand at
  0.25 to 0.50 by year and 0.17 to 0.50 by centre (the total at 0.33 and 0.17).
  The age mix does not explain them: the module is for adolescents and adults
  (17% of the visits are under 18) and the total stays at 0.33 by year and 0.25
  by centre among the adults. The median total is 9 to 12 in every year with 20
  values. The one score at 0.50 is the stereotyped behaviours and restricted
  interests (a 0 to 8 sum with a median of 0 to 2: centre B 2, D 1, E 0), whose
  steps are a one-point move of that median between years (0 to 1.5 to 2022, 2
  from 2023) and between centres, with no known cause. The edition does not
  explain them either (median total 11 on the 251 visits of the first edition,
  10 on the 1,098 of the ADOS-2).

  An instrument of the ASP cohort only.

