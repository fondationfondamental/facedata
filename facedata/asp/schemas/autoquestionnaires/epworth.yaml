instrument: epworth
title: "Epworth Sleepiness Scale"
tab: autoquestionnaires
section: adult questionnaires
status: reviewed
notes: >
  Eight items from 0 to 3 and a total, at the inclusion visit: 408 visits, from
  2020 to 2026, and 7 follow-up visits (415 in all). It belongs to the new set
  of forms. It is filled by adults only.

  Same instrument and same schema as in FACE DR, in the same columns (ess01 to
  ess08), delivered under the BP names (ess0101 to ess0108). The stored total is
  the sum of the eight items on every complete visit.

  **Time frame.** The forms of FACE BP and DR ask about the recent months. The
  form of this cohort (form 331) states no time frame, so the labels state none.

  `epworth_when` (the question 9 of the form: the urges to sleep come only after
  meals, at fixed hours of the day, at night, or at any hour) is an addition of
  the French form to the eight items of the published scale. It is not part of
  the total.

  **Year and centre.** 3 of the 8 variables reach 0.5 or more (2 by year, 2 by
  centre): the eight items are on a 0 to 3 scale (one level is 1.0 or more of
  the interquartile range). The total stands at 0.15 by year and by centre
  (median 7 to 9 in both). Adults only, 2021 to 2026. No step.

defaults: {type: item, range: [0, 3]}

variables:
  ess0101: {column: ess01, label: "Epworth item 1: sitting and reading"}
  ess0102: {column: ess02, label: "Epworth item 2: watching television"}
  ess0103: {column: ess03, label: "Epworth item 3: sitting inactive in a public place"}
  ess0104: {column: ess04, label: "Epworth item 4: passenger in a car for an hour"}
  ess0105: {column: ess05, label: "Epworth item 5: lying down to rest in the afternoon"}
  ess0106: {column: ess06, label: "Epworth item 6: sitting and talking to someone"}
  ess0107: {column: ess07, label: "Epworth item 7: sitting quietly after a lunch without alcohol"}
  ess0108: {column: ess08, label: "Epworth item 8: in a car, stopped for a few minutes in traffic"}
  epworth_when:
    column: ess09
    type: category
    label: When the sleepiness comes
    codes: {0: after_meals, 1: fixed_hours, 2: night, 3: any_time}
  epworth_stored: {column: ess, label: Epworth total as stored, range: [0, 24], keep: false}

scores:
  epworth_total:
    label: Epworth total (0 to 24, higher is sleepier)
    sum: [ess0101, ess0102, ess0103, ess0104, ess0105, ess0106, ess0107, ess0108]
    compare: epworth_stored
