instrument: gsq
title: "Glasgow Sensory Questionnaire (GSQ)"
tab: autoquestionnaires
section: adult questionnaires
status: reviewed
notes: >
  Forty-two items answered from 0 to 4, twenty-one sub-scores and a total, at
  the inclusion visit: 612 visits, from 2018 to 2026 (456 with items), and 6
  follow-up visits. It belongs to the new set of forms. It is filled by adults
  only.

  Identified from its forty-two items, its answers and its twenty-one sub-scores
  as the Glasgow Sensory Questionnaire (Robertson and Simmons, 2013), likely:
  the total is the sum of the forty-two items, fourteen sub-scores are sums of
  three items (seven senses, each with an over- and an under-sensitivity score)
  and seven are sums of six. The thesaurus (which calls the scale GSS, Glasgow
  Sensory Scale) names the sub-scores: seven of hyper-sensitivity, seven of
  hypo-sensitivity and seven that add the two, each in the order tactile,
  visual, auditory, olfactory, gustatory, proprioceptive, vestibular. The names
  and the items of the twenty-one sub-scores are those of the script of the form
  (`338_score.js`, lines 25-47; O12 (5) answered), and the script checks the
  thesaurus names.

  The scores, each fitted on the data:

  - GSQ total (0 to 168): the sum of 42 items, equal to the stored score on 442 of 443 complete visits; typed without its items on 157 visits, where it is kept as stored.
  - GSQ hyper-sensitivity, tactile: the sum of 3 items (1, 15 and 22), equal to the stored score on 442 of 442 complete visits; typed without its items on 155 visits, where it is kept as stored.
  - GSQ hyper-sensitivity, visual: the sum of 3 items (8, 11 and 18), equal to the stored score on 441 of 442 complete visits; typed without its items on 156 visits, where it is kept as stored.
  - GSQ hyper-sensitivity, auditory: the sum of 3 items (6, 25 and 31), equal to the stored score on 442 of 443 complete visits; typed without its items on 156 visits, where it is kept as stored.
  - GSQ hyper-sensitivity, olfactory: the sum of 3 items (13, 21 and 24), equal to the stored score on 442 of 442 complete visits; typed without its items on 156 visits, where it is kept as stored.
  - GSQ hyper-sensitivity, gustatory: the sum of 3 items (2, 23 and 26), equal to the stored score on 442 of 443 complete visits; typed without its items on 156 visits, where it is kept as stored.
  - GSQ hyper-sensitivity, proprioceptive: the sum of 3 items (37, 38 and 41), equal to the stored score on 442 of 442 complete visits; typed without its items on 156 visits, where it is kept as stored.
  - GSQ hyper-sensitivity, vestibular: the sum of 3 items (10, 30 and 32), equal to the stored score on 442 of 442 complete visits; typed without its items on 156 visits, where it is kept as stored.
  - GSQ hypo-sensitivity, tactile: the sum of 3 items (16, 27 and 39), equal to the stored score on 442 of 442 complete visits; typed without its items on 156 visits, where it is kept as stored.
  - GSQ hypo-sensitivity, visual: the sum of 3 items (4, 19 and 42), equal to the stored score on 443 of 443 complete visits; typed without its items on 156 visits, where it is kept as stored.
  - GSQ hypo-sensitivity, auditory: the sum of 3 items (9, 14 and 33), equal to the stored score on 443 of 443 complete visits; typed without its items on 156 visits, where it is kept as stored.
  - GSQ hypo-sensitivity, olfactory: the sum of 3 items (7, 17 and 36), equal to the stored score on 442 of 442 complete visits; typed without its items on 156 visits, where it is kept as stored.
  - GSQ hypo-sensitivity, gustatory: the sum of 3 items (28, 35 and 40), equal to the stored score on 442 of 442 complete visits; typed without its items on 156 visits, where it is kept as stored.
  - GSQ hypo-sensitivity, proprioceptive: the sum of 3 items (3, 5 and 29), equal to the stored score on 442 of 442 complete visits; typed without its items on 156 visits, where it is kept as stored.
  - GSQ hypo-sensitivity, vestibular: the sum of 3 items (12, 20 and 34), equal to the stored score on 441 of 442 complete visits; typed without its items on 156 visits, where it is kept as stored.
  - GSQ hyper- and hypo-sensitivity, tactile: the sum of 6 items (1, 15, 16, 22, 27 and 39), equal to the stored score on 440 of 440 complete visits; typed without its items on 154 visits, where it is kept as stored.
  - GSQ hyper- and hypo-sensitivity, visual: the sum of 6 items (4, 8, 11, 18, 19 and 42), equal to the stored score on 440 of 441 complete visits; typed without its items on 155 visits, where it is kept as stored.
  - GSQ hyper- and hypo-sensitivity, auditory: the sum of 6 items (6, 9, 14, 25, 31 and 33), equal to the stored score on 441 of 441 complete visits; typed without its items on 155 visits, where it is kept as stored.
  - GSQ hyper- and hypo-sensitivity, olfactory: the sum of 6 items (7, 13, 17, 21, 24 and 36), equal to the stored score on 440 of 440 complete visits; typed without its items on 155 visits, where it is kept as stored.
  - GSQ hyper- and hypo-sensitivity, gustatory: the sum of 6 items (2, 23, 26, 28, 35 and 40), equal to the stored score on 440 of 440 complete visits; typed without its items on 155 visits, where it is kept as stored.
  - GSQ hyper- and hypo-sensitivity, proprioceptive: **corrected**. The stored score is the sum of the items 3, 5, 29, 37, 38 and 40 (447 of 449 complete visits): the item 40, a gustatory item, stands where the item 41 should, since the hyper-sensitivity score is the sum of the items 37, 38 and 41 and each of the six other senses is the sum of its two parts. The error is in the script of the form (`338_score.js`, line 46), which writes the item 40 in the place of the item 41 in that sum. The delivered score is the sum of the two parts (items 3, 5, 29, 37, 38 and 41); it differs from the stored one on 381 of the 440 complete visits. Typed without its items on 155 visits, where it is kept as stored.
  - GSQ hyper- and hypo-sensitivity, vestibular: the sum of 6 items (10, 12, 20, 30, 32 and 34), equal to the stored score on 439 of 440 complete visits; typed without its items on 155 visits, where it is kept as stored.

  **Stored scores that differ.** 24 cells of 4 visits (2020 to 2022, two
  centres) differ from the sums of the items, one or two scores on each visit;
  the delivered value is the sum, and no cause was found.

  **Year and centre.** 24 of the 63 variables reach 0.5 or more (20 by year, 17
  by centre): the 42 items are on a 0 to 4 scale (one level is 1.0 or more of
  the interquartile range), and the 22 scores stand at 0.00 to 0.33 by year and
  0.00 to 0.50 by centre (the total at 0.14 and 0.40). Centre D reads lower
  (median total 63 on 94 totals against 74 to 81 in B, C, E and H): a difference
  with no known cause (the case mix or the rater; no change of the form is
  known). The years 2021 to 2026 differ by 0.14 (median 74 to 82). The totals
  typed without items (157, 93% of the totals of centre B and 55% of H) have the
  median of the computed ones (77 in both).

  An instrument of the ASP cohort only.

