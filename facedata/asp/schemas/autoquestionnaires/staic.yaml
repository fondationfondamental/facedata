instrument: staic
title: "State-Trait Anxiety Inventory for Children (STAIC; state: right now, trait: in general)"
tab: autoquestionnaires
section: child and parent questionnaires
status: reviewed
notes: >
  Forty items answered from 1 to 3 and two totals, filled by children: 346
  inclusion visits (344 of children, 2 of adults, from 2020 to 2026) and 62
  follow-up visits. It belongs to the new set of forms; the adults fill the
  STAI. The state part asks how the child feels right now, the trait part how
  the child feels in general.

  Identified from its name and its two blocks of twenty items as the STAIC
  (Spielberger, 1973), sure. The trait total is the sum of the items 21 to 40,
  none reversed, as published.

  **The state items are almost never recorded**: 18 visits hold them, against
  253 for the trait items, and the state total is typed on 168 visits (150
  without any item, from one centre). **The EMR computes the state total
  wrongly.** Half of the state items are worded the other way, and the script of
  the form (`342_score.js`, lines 8-15) reverses the ten positive adjectives
  (items 1, 3, 6, 8, 10, 12, 13, 14, 17 and 20) instead of the ten negative ones
  (items 2, 4, 5, 7, 9, 11, 15, 16, 18 and 19); its reversal map also sends 1 to
  3, 2 to 1 and 3 to 1, where a three-level item reverses 1 to 3, 2 to 2 and 3
  to 1. The stored total is the script's value on 18 of 18 complete visits and
  the value of the right set of items on 1 of 18; across the visits the
  correlation of the state total with the trait total is -0.46 with the script's
  values and +0.71 with the totals typed by hand. The state total is therefore
  computed from the items with the negative items reversed (`reverse`: 2, 4, 5,
  7, 9, 11, 15, 16, 18 and 19) and delivered, and the stored total is the check
  (`staic_state_stored`, 17 score_mismatch on the 18 complete visits). Where no
  item is recorded the typed total is kept as stored (150 visits,
  score_as_stored). The set of items reversed follows the wording of the form;
  the published STAIC key is to verify.

  The scores, each fitted on the data:

  - STAIC trait anxiety (20 to 60): the sum of 20 items, equal to the stored score on 253 of 253 complete visits; typed without its items on 150 visits, where it is kept as stored.

  1 stored trait total is above 60, the highest possible sum, and is
  out_of_range. The trait total and the state total are typed without their
  items on 150 visits each, and the CDI and the BDI-II likewise (103 and 66
  visits), in one centre that records almost no item.

  **Year and centre.** 9 of the 21 variables reach 0.5 or more (9 by year, 2 by
  centre): the items are on a 1 to 3 scale (one level is 1.0 or more of the
  interquartile range). The trait total stands at 0.35 by year and 0.31 by
  centre, the state total at 0.29 by year (one centre only). The steps are the
  Manual mode of centre B, which types 99% of its totals without items: the
  typed trait totals have a median of 41 (mean 40.2) against 36 (35.9) for the
  computed ones, which makes centre B 41 against 35 in A and the median rise
  from 35.5 in 2023 to 41.5 in 2026 as the typed share goes from 27% to 79%. The
  rule applied by hand is not known (O17); the state total has 18 computed
  values, the other 150 are typed by centre B.

  An instrument of the ASP cohort only.

