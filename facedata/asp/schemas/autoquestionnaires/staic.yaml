instrument: staic
title: "State-Trait Anxiety Inventory for Children (STAIC)"
tab: autoquestionnaires
section: child and parent questionnaires
status: draft
notes: >
  Forty items answered from 1 to 3 and two totals, filled by children:
  344 inclusion visits of children, 2 of adults and 62 follow-up visits, from 2021 to 2026. It belongs to the new set of forms;
  the adults fill the STAI.

  Identified from its name and its two blocks of twenty items as the STAIC
  (Spielberger, 1973), sure. The trait total is the sum of the items 21 to 40,
  none reversed, as published.

  **The state items are almost never recorded**: 18 visits hold them, against
  253 for the trait items, and the state total is typed on 168 visits. The
  state total needs the key of the form (half of its items are worded the
  other way) and there are too few visits to verify it: it is delivered as
  stored.

  The scores, each fitted on the data:

  - STAIC trait anxiety (20 to 60): the sum of 20 items, equal to the stored score on 253 of 253 complete visits; typed without its items on 150 visits, where it is kept as stored.

  1 stored trait totals are above 60, the highest possible sum, and are
  out_of_range.

  An instrument of the ASP cohort only.

defaults: {type: item, range: [1, 3]}

