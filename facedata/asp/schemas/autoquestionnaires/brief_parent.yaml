  briefp_emotional_control: {label: "BRIEF emotional control (10 to 30)", sum: [briefp01, briefp07, briefp20, briefp25, briefp26, briefp45, briefp50, briefp62, briefp64, briefp70], compare: briefp_emotional_control_stored, otherwise: briefp_emotional_control_stored}
  briefp_initiate: {label: "BRIEF initiate (8 to 24)", sum: [briefp03, briefp10, briefp16, briefp47, briefp48, briefp61, briefp66, briefp71], compare: briefp_initiate_stored, otherwise: briefp_initiate_stored}
  briefp_working_memory: {label: "BRIEF working memory (10 to 30)", sum: [briefp02, briefp09, briefp17, briefp19, briefp24, briefp27, briefp32, briefp33, briefp37, briefp57], compare: briefp_working_memory_stored, otherwise: briefp_working_memory_stored}
  briefp_plan_organize: {label: "BRIEF plan and organize (12 to 36)", sum: [briefp11, briefp15, briefp18, briefp22, briefp28, briefp35, briefp36, briefp40, briefp46, briefp51, briefp53, briefp58], compare: briefp_plan_organize_stored, otherwise: briefp_plan_organize_stored}
  briefp_monitor: {label: "BRIEF monitor (8 to 24)", sum: [briefp14, briefp21, briefp31, briefp34, briefp42, briefp52, briefp60, briefp63], compare: briefp_monitor_stored, otherwise: briefp_monitor_stored}
  briefp_organization_materials: {label: "BRIEF organization of materials (6 to 18)", sum: [briefp04, briefp29, briefp67, briefp68, briefp69, briefp72], compare: briefp_organization_materials_stored, otherwise: briefp_organization_materials_stored}
  briefp_bri: {label: "BRIEF Behavioral Regulation Index (28 to 84)", sum: [briefp_inhibit, briefp_shift, briefp_emotional_control], compare: briefp_bri_stored}
  briefp_mi: {label: "BRIEF Metacognition Index (44 to 132)", sum: [briefp_initiate, briefp_working_memory, briefp_plan_organize, briefp_monitor, briefp_organization_materials], compare: briefp_mi_stored}
  briefp_gec: {label: "BRIEF Global Executive Composite (72 to 216)", sum: [briefp_inhibit, briefp_shift, briefp_emotional_control, briefp_initiate, briefp_working_memory, briefp_plan_organize, briefp_monitor, briefp_organization_materials], compare: briefp_gec_stored}
