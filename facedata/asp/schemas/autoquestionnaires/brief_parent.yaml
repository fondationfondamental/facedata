instrument: brief_parent
title: "BRIEF"
tab: autoquestionnaires
section: child and parent questionnaires
status: reviewed
notes: >
  The Behavior Rating Inventory of Executive Function filled by a parent for a
  child (Gioia and others, 2000): 86 items answered from 1 to 3, eight scale
  scores, two indexes and the composite, two validity scores and the rater. 723
  inclusion visits and 135 follow-up visits, from 2013 to 2026.

  **Two forms in the same columns, found in the data.** A visit holds either 86
  items or 75: 581 visits hold an item beyond the 75th (580 of them are
  children) and 591 hold the first 75 only (584 are adults). The first is the
  form filled by a parent for a child (BRIEF, 86 items, eight scales), the
  second the form of adults (BRIEF-A, 75 items, nine scales): the scale
  self-monitor (brief_score4) and the infrequency score (brief_if) exist on the
  visits of adults only. The two forms are two instruments (brief_parent and
  brief_adult) with their own columns, and brief_form says which one a visit
  holds. A visit is read as the form of adults when it holds one of the two
  scores that only that form has, and as the form of children otherwise; 9
  visits hold the first 75 items and no such score and are read as the form of
  children.

  The scores, each fitted on the data of this form (raw sums of answers from 1
  to 3; no T-score is stored):

  - inhibit: 10 items (38, 41, 43, 44, 49, 54, 55, 56, 59 and 65), equal to the stored score on 568 of 568 complete visits; typed without the items on 265 visits.
  - shift: 8 items (5, 6, 8, 12, 13, 23, 30 and 39), equal to the stored score on 573 of 573 complete visits; typed without the items on 265 visits.
  - emotional control: 10 items (1, 7, 20, 25, 26, 45, 50, 62, 64 and 70), equal to the stored score on 572 of 572 complete visits; typed without the items on 265 visits.
  - initiate: 8 items (3, 10, 16, 47, 48, 61, 66 and 71), equal to the stored score on 568 of 568 complete visits; typed without the items on 265 visits.
  - working memory: 10 items (2, 9, 17, 19, 24, 27, 32, 33, 37 and 57), equal to the stored score on 573 of 573 complete visits; typed without the items on 265 visits.
  - plan and organize: 12 items (11, 15, 18, 22, 28, 35, 36, 40, 46, 51, 53 and 58), equal to the stored score on 563 of 563 complete visits; typed without the items on 265 visits.
  - monitor: 8 items (14, 21, 31, 34, 42, 52, 60 and 63), equal to the stored score on 571 of 572 complete visits; typed without the items on 265 visits.
  - organization of materials: 6 items (4, 29, 67, 68, 69 and 72), equal to the stored score on 574 of 574 complete visits; typed without the items on 265 visits.
  - Behavioral Regulation Index: the sum of 3 scales (28 items), equal to the stored score on 564 of 564 complete visits.
  - Metacognition Index: the sum of 5 scales (44 items), equal to the stored score on 556 of 556 complete visits.
  - Global Executive Composite: the sum of 8 scales (72 items), equal to the stored score on 553 of 553 complete visits.

  The names and the items of the scales are those of the published profile and
  are confirmed by the scripts of the forms (`268_score.js` for this form,
  `344_score.js` and `264_score.js` for the two forms of adults), scale by
  scale. A scale score typed without the items is kept as stored: the forms have
  a Manual mode (radio "Automatique / Manuel", `manuel_score.js`, lines 20 and
  33), the flag is saved with the form and is in no export model, and one centre
  uses it for almost every visit (429 of its 434 BRIEF visits, from 2018 to
  2026); the typed scores are 265 of the stored rows of this form. 23 typed
  values of the organization of materials (19 to 24) are above its maximum of
  18, and the typed behavioural regulation index differs from the sum of the
  typed scales on 20 of the 265 visits (typing errors to check): the first are
  out_of_range on the stored variable, the others are kept as stored.

  **Validity scores, as the script computes them.** The negativity score counts
  9 items in the script (it agrees with the stored value on 568 of 568 visits; a
  variant with 10 items disagrees on 326), and the inconsistency score uses the
  item 44 twice (the script agrees on 562 of 562 visits; with the items 55 and
  56 instead it disagrees on 303 of 562). They are delivered as stored with the
  maximum of the scale as range (negativity 10, observed 9; inconsistency 20,
  observed 13); the published rules of the two validity scales were not found
  in the literature check of 2026-11-21 (the manual was not read). `briefp_known_for` (years the
  rater has known the child) is limited to 100: 3 values of 100 or more are
  out_of_range. The rater question hangs on no other question; the free text
  `briefp_rater_other` is shown only when the rater is "other" (`shown_if`, no
  cell blanked). The item 83 is not hidden by the rater question: the audit edge
  from the rater to the item 83 is an artefact of the page order, and the item
  is filled on 578 of the 581 visits that hold an item beyond the 75th.

  **Year and centre.** 77 of the 100 variables reach 0.5 or more (76 by year, 34
  by centre): the 86 items are on a 1 to 3 scale (one level is 1.0 or more of
  the interquartile range); the eight scales stand at 0.25 to 0.70 by year and
  0.12 to 0.52 by centre, the two indexes and the composite at 0.52 to 0.67 and
  0.40 to 0.53. Children are 99% of the visits. The step is centre C, which
  holds all 92 composites of 2013 to 2015 and 13 later ones (median composite
  130 to 144.5 in 2013 to 2015, 150 to 163 from 2019; centre C 140, A 160, B
  156): a lower level with no known cause (the case mix or the rater). The
  scales typed without items (265 visits) are 99% of the visits of centre B; the
  240 typed composites have the median of the computed ones (156 and 157).

  An instrument of the ASP cohort only.

