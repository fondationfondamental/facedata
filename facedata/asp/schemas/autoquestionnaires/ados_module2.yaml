instrument: ados_module2
title: "ADOS-2, module 2"
tab: autoquestionnaires
section: diagnostic instruments
status: draft
notes: >
  The items and the scores of the module 2 (children who speak in phrases):
  14 visits. **Too few visits to verify**: the columns are read with their
  types and ranges, the scores are delivered as stored and no rule is checked.
  The names of the scores follow those of the module 3 (social affect,
  restricted and repetitive behaviour, total, classification, comparison
  score). The codes 7 and 8 of the items are not levels.

  An instrument of the ASP cohort only.

