instrument: asrs
title: "Adult ADHD Self-Report Scale (ASRS v1.1, 18 items), last 6 months"
tab: autoquestionnaires
section: adult questionnaires
status: reviewed
notes: >
  Eighteen items from 0 to 4 about the past six months, at the inclusion visit:
  586 visits, from 2019 to 2026, and 4 follow-up visits (590 in all). It belongs
  to the new set of forms. It is filled by adults only. The children have the
  ADHD rating scale.

  Same instrument as in FACE BP, in columns named asrs1 to asrs18. The column of
  the stored total (asrs_scoretot) is empty on every row (ignored.yaml), and the
  form (343) has no field for the screening result that FACE BP stores: nothing
  is stored to check here, so the total and the screen are computed.

  **The screen of part A is computed.** The part A of the published form is the
  items 1 to 6; the screen is positive when 4 or more of them are past their
  threshold (items 1 to 3 at "sometimes" or more, items 4 to 6 at "often" or
  more). `asrs_parta` counts the items past the threshold (0 to 6) and
  `asrs_screen` is 1 when the count is 4 or more, 0 otherwise, as in FACE BP,
  where the stored result is the check (the script of the BP application tests
  the wrong variable for a missing answer, so its stored result is empty or
  wrong on some visits). The screen is delivered on 579 visits. It is numeric (0
  and 1) in both cohorts.

  **Year and centre.** 15 of the 21 variables reach 0.5 or more (10 by year, 13
  by centre): the eighteen items are on a 0 to 4 scale (one level is 1.0 or more
  of the interquartile range). The total stands at 0.18 by year and 0.30 by
  centre, part A (a count of 0 to 6) at 0.00 and 0.50, and the screen (0 or 1)
  at 0.00 by year and 1.00 by centre, a median that flips between 0 and 1
  (positive for 48% of the visits of centre D and 63% to 74% in B, C, E and H).
  Centre D reads lower on every score (median total 35 against 40 to 45): a
  difference of 0.30 of the interquartile range with no known cause (the case
  mix or the rater). The six years 2021 to 2026 differ by 0.18 or less (median
  38 to 43).

defaults: {type: item, range: [0, 4]}

variables:
  asrs01: {column: asrs1, label: "ASRS item 1"}
  asrs02: {column: asrs2, label: "ASRS item 2"}
  asrs03: {column: asrs3, label: "ASRS item 3"}
  asrs04: {column: asrs4, label: "ASRS item 4"}
  asrs05: {column: asrs5, label: "ASRS item 5"}
  asrs06: {column: asrs6, label: "ASRS item 6"}
  asrs07: {column: asrs7, label: "ASRS item 7"}
  asrs08: {column: asrs8, label: "ASRS item 8"}
  asrs09: {column: asrs9, label: "ASRS item 9"}
  asrs10: {column: asrs10, label: "ASRS item 10"}
  asrs11: {column: asrs11, label: "ASRS item 11"}
  asrs12: {column: asrs12, label: "ASRS item 12"}
  asrs13: {column: asrs13, label: "ASRS item 13"}
  asrs14: {column: asrs14, label: "ASRS item 14"}
  asrs15: {column: asrs15, label: "ASRS item 15"}
  asrs16: {column: asrs16, label: "ASRS item 16"}
  asrs17: {column: asrs17, label: "ASRS item 17"}
  asrs18: {column: asrs18, label: "ASRS item 18"}

scores:
  asrs_total:
    label: ASRS total (18 items)
    sum: [asrs01, asrs02, asrs03, asrs04, asrs05, asrs06, asrs07, asrs08, asrs09, asrs10, asrs11, asrs12, asrs13, asrs14, asrs15, asrs16, asrs17, asrs18]

  asrs_a123:
    label: ASRS part A, items 1 to 3 at "sometimes" or more (0 to 3)
    sum: [asrs01, asrs02, asrs03]
    points: {"0": 0, "1": 0, "2": 1, "3": 1, "4": 1}
    keep: false
  asrs_a456:
    label: ASRS part A, items 4 to 6 at "often" or more (0 to 3)
    sum: [asrs04, asrs05, asrs06]
    points: {"0": 0, "1": 0, "2": 0, "3": 1, "4": 1}
    keep: false
  asrs_parta:
    label: ASRS part A, number of items past their threshold (0 to 6; 4 or more is a positive screen)
    sum: [asrs_a123, asrs_a456]
  asrs_screen:
    label: ASRS screen, part A (1 = positive, 4 or more items past their threshold)
    sum: [asrs_parta]
    points: {"0": 0, "1": 0, "2": 0, "3": 0, "4": 1, "5": 1, "6": 1}
