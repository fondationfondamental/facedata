instrument: adi_r
title: "Autism Diagnostic Interview-Revised (ADI-R)"
tab: autoquestionnaires
section: diagnostic instruments
status: draft
notes: >
  The parent interview of the diagnosis of autism, at the inclusion visit:
  1587 visits hold its conclusion, 1618 its first algorithm score and 1217 the
  items, from 2013 to 2026. It is filled for children and adults (806 and
  812 inclusion visits). Never at follow-up.

  Identified as the ADI-R (Lord, Rutter and Le Couteur, 1994), sure: the item
  numbers run from 1 to 93, the answers are its codes (0 to 3, then 7, 8 and 9),
  and the published diagnostic algorithm reproduces the stored sub-scores.

  **The columns.** adi2 to adi28, adi86 and adi87 are the early-development
  items, coded once (ages in months, and codes). The items 29 to 93 have two
  columns: _a, the current behaviour, and _p, the past one (ever, or the most
  abnormal between four and five years), which the algorithm reads. The items
  are delivered as recorded. **The codes 7, 8 and 9 are not levels**: 7 is an
  abnormality of another kind, 8 is "not applicable", 9 is "not known". Do not
  average the items. The algorithm counts a code 3 as 2 and the codes 7, 8 and
  9 as 0 (the field points of the scores). The codes of an age in months from
  991 to 999 are read as missing, each with its code. The two items of free
  text (1 and 3) are delivered as text.

  **The algorithm sub-scores, each checked against its items** (visits where
  the stored value equals the published rule, of the visits that hold the
  items): A1 1,169 of 1,183; A2 1,094 of 1,128; A3 1,163 of 1,176; A4 1,124 of 1,141;
  B1 1,081 of 1,097; B2 1,083 of 1,111; B3 951 of 1,090; B4 1,075 of 1,100;
  C1 1,147 of 1,161; C2 1,090 of 1,105; C3 1,137 of 1,147; C4 1,125 of 1,140.
  A2 follows the age rule of the publication: group play with peers (item 64)
  under ten years at the interview, friendships (item 65) from ten years (the
  function adi_peer_item). C3 and C4 are the higher of two items.

  **B3 leaves out an item between 2016 and 2020.** On the visits of those years
  where the item 38 counts, the stored B3 is the sum of its four items on
  16 of 117 and the sum without the item 38 on 99 of 117; from 2021 it is the
  four-item sum on 143 of 154. The B3 delivered is the four-item sum
  where the items are recorded; a B3 typed without its items is delivered as typed (score_as_stored).

  **The stored domain totals A and C are not the published ones.** The stored
  total A is the sum of every item of the domain, the items 64 and 65 both
  (951 of 951 visits), where the algorithm counts one of the two: it
  equals the sum of its four sub-scores on 449 of 1,136 visits only. The stored
  total C adds the two items of C3 and of C4 instead of the higher one
  (1,109 of 1,109): it equals the sum of its sub-scores on 653 of 1,082. A stored
  total is so up to 2 points (A) or 4 points (C) above the published one. The
  totals A and C delivered are the sums of the sub-scores; the stored ones are
  read to be checked (formulas "as stored") and are not delivered. The stored
  verbal total B is the published one (1,087 of 1,087).

  **Sub-scores typed without the items.** On 423 visits the sub-scores are
  recorded and no item is: they are kept as stored (score_as_stored), and the
  domain totals are their sums.

  D (abnormality evident before 36 months) needs thresholds on ages and is
  delivered as stored. The published rule (first noticed before 36 months,
  first words after 24, first phrases after 33, item 86 coded 3 or 4, the
  interviewer's judgement before 36 months) reproduces it on 751 of 752 visits.
  The non-verbal total B is delivered as stored (226 visits).

  adi_positive is the conclusion as recorded. It agrees with the four cut-offs
  of the publication (A 10, verbal B 8, C 3, D 1) applied to the stored totals
  on 1,008 of 1,053 visits. adi_done is 1 on 1745 visits and 0 on 270; the
  conclusion is filled on 1571 and 8 of them: 1 is read as "done". The
  informant (mother, father, another guardian, several interviews) and the
  version of the interview (ADI of 1988, ADI-R of 1995 or of 2003) are named
  from the thesaurus. The thesaurus writes "Total A = A1 + A2 + A3 + A4" and
  "Total C = C1 + C2 + C3 + C4": the stored totals do not follow its own
  formulas. The name of the examiner (adiexam) is not delivered (ignored.yaml).

  An instrument of the ASP cohort only.

defaults: {type: item}

