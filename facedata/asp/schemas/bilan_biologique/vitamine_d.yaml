instrument: vitamine_d
title: "Vitamin D"
tab: bilan_biologique
section: biology
status: reviewed
notes: >
  25-hydroxy vitamin D, on 255 inclusion visits and 46 follow-up visits. Same
  analyte, name and target unit (nmol/L) as in FACE DR.

  Vitamin D is one of the five analytes that have a unit column. It holds a
  catalogue number, not a label (the list of the form: 67432 nmol/L, 67306
  µg/L, 64387 mmol/L, 67327 ng/L): 67432 on 251 results (read as nmol/L),
  67306 on 19 (ng/mL: their median is 17.1), 64387 on 26 and 67327 on 5.

  64387 is the number that the cholesterol column uses for mmol/L, a unit that
  no vitamin D result can be in. Its 26 results are read as nmol/L, as FACE DR
  reads its code 4: their median (39.5, 23% under 30) is that of the nmol/L
  results (median 48.0, 21% under 30) and not that of the ng/mL ones (89%
  under 30), and they come from the same four centres as the 67432 results.
  The confidence is medium: the size of the values decides, not the label.
  Before this reading they were delivered as missing.

  67327 (ng/L on the form) holds 5 results of the size of ng/mL or nmol/L, not
  of thousands of ng/L: they are not read as ng/L, and 3 of them fit both
  units and stay unit_unknown. 7 results under 1 fit no unit (out_of_range).
  Delivered: 291 of the 301 results. The readings of the numbers stay open
  question O6.

  The default clip at the 1% and 99% percentiles turns a clinical tail into
  the cut value (5 of the 291 values here); the hard range is what removes
  impossible values (7 results here).

defaults: {type: number}

variables:
  vitamin_d:
    label: 25-hydroxy vitamin D
    column: vitd
    unit_column: vitd_orresu
    unit: "nmol/L"
    units:
      "nmol/L": {factor: 1, expect: [8, 400], aliases: ["67432", "64387"]}      # 64387, the form's "mmol/L", as DR reads its code 4
      "ng/mL": {factor: 2.496, expect: [3, 160], aliases: ["67306"]}
    range: [8, 400]
