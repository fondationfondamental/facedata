instrument: bilan_thyroidien
title: "Thyroid: TSH"
tab: bilan_biologique
section: biology
status: draft
notes: >
  TSH, on 469 inclusion visits. Same analyte, name and target unit as in FACE
  DR; the free T3 and T4 are not in this extraction.

  Its unit column holds the catalogue number 67405 on 515 results and
  67434 on a few: both are on the same scale (mUI/L and µUI/mL).

defaults: {type: number}

variables:
  tsh:
    label: Thyroid-stimulating hormone (TSH)
    column: tsh
    unit_column: tsh_orresu
    unit: "mUI/L"
    units:
      "mUI/L": {factor: 1, expect: [0, 150], aliases: ["67405", "67434"]}
    range: [0, 150]
