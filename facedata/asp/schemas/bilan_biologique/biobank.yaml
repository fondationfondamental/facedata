instrument: biobank
title: "Samples for the biobank"
tab: bilan_biologique
section: examinations
status: reviewed
notes: >
  Two questions on a sample for the biobank: banqpre (yes on 387 of the 656
  inclusion visits where it is answered; 9 is read as "not known") with its
  date, and banqrpr (a second sample, yes on 2 inclusion visits and 9
  follow-up visits) with its date. A date exists for 466 of the 489 yes
  answers over all visits and for the 11 second samples; the export writes
  0000-00-00 where there is none, which is read as missing. 198 of the 466
  dates are after the date of the visit and 30 before; 238 are the day of the
  visit.

  The questions are administrative: the answer follows the centre, not the
  patient. One centre gives 273 of the 489 yes answers (56%; 89% of its own
  answers are yes), five centres have any yes at all, and their share of yes
  goes from 14% to 89%.

  The schema was written from the column names and the answers, then checked
  against the thesaurus V2.13, which names these columns (PROGRESS.md D13 and
  D14).

  An instrument of the ASP cohort only.

variables:
  biobank_sample: {column: banqpre, type: item, range: [0, 1], missing: {"9": unknown}, label: "A sample was taken for the biobank"}
  biobank_sample_date: {column: banqpr_date, type: date, range: [2000-01-01, today], label: "Date of the biobank sample"}
  biobank_second_sample: {column: banqrpr, type: item, range: [0, 1], missing: {"9": unknown}, label: "A second sample was taken for the biobank"}
  biobank_second_sample_date: {column: banqrpr_date, type: date, range: [2000-01-01, today], label: "Date of the second sample"}
