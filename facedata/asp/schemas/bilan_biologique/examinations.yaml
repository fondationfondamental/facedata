instrument: examinations
title: "Imaging, EEG, genetics and hearing examinations"
tab: bilan_biologique
section: examinations
status: reviewed
notes: >
  Eight examinations, each with a code and a date, and an eye-tracking code:
  brain CT scan, brain MRI, EEG, karyotype, fragile X test, audiogram,
  auditory evoked potentials and another examination, on 1,004 inclusion
  visits (1,069 over all visits; 687 inclusion visits hold at least one result
  other than "not done").

  The codes are those of the thesaurus: 1 a normal result, 2 an abnormal
  result, 3 a result that is not known, 9 not done. For the MRI: 9 on 577
  inclusion visits, 1 on 167, 2 on 54, 3 on 36. A date is given with the code
  1 on 103 rows and with the code 2 on 49, almost never with 9: which fits.
  "Not done" is an answer and is delivered as such, not as a missing value.
  The eye-tracking code is 9 on 446 of its 459 answers.

  The dates are those of past examinations, so they are often before the visit
  (a median of 1 to 9 years before for the CT scan, MRI, EEG, audiogram,
  evoked potentials and other examination). The dates of the karyotype and of
  the fragile X test are centred on the day of the visit (a median of 0 days):
  the day itself on 96 and 98 rows, after it on 99 and 111, before it on 60
  and 48; 31 more rows of the other examinations are dated after the visit. A
  date after the visit date is expected here, not an error.

  Three free texts name another examination and describe an anomaly. exchang
  is the box "changed since the last visit" of the follow-up form.

  The schema was written from the column names and the answers, then checked
  against the thesaurus V2.13, which names these columns (PROGRESS.md D13 and
  D14).

  An instrument of the ASP cohort only.

defaults: {type: number}

variables:
  ct_scan: {column: scanced, type: category, codes: {"1": normal, "2": abnormal, "3": result_unknown, "9": not_done}, label: "Brain CT scan: result"}
  ct_scan_date: {column: scanced_date, type: date, range: [1970-01-01, today], label: "Brain CT scan: date"}
  mri: {column: irmcer, type: category, codes: {"1": normal, "2": abnormal, "3": result_unknown, "9": not_done}, label: "Brain MRI: result"}
  mri_date: {column: irmcer_date, type: date, range: [1970-01-01, today], label: "Brain MRI: date"}
  eeg: {column: eeg, type: category, codes: {"1": normal, "2": abnormal, "3": result_unknown, "9": not_done}, label: "EEG: result"}
  eeg_date: {column: eeg_date, type: date, range: [1970-01-01, today], label: "EEG: date"}
  karyotype: {column: caryoty, type: category, codes: {"1": normal, "2": abnormal, "3": result_unknown, "9": not_done}, label: "Karyotype or CGH array: result"}
  karyotype_date: {column: caryoty_date, type: date, range: [1970-01-01, today], label: "Karyotype: date"}
  fragile_x: {column: frax, type: category, codes: {"1": normal, "2": abnormal, "3": result_unknown, "9": not_done}, label: "Fragile X test: result"}
  fragile_x_date: {column: frax_date, type: date, range: [1970-01-01, today], label: "Fragile X test: date"}
  audiogram: {column: audiogr, type: category, codes: {"1": normal, "2": abnormal, "3": result_unknown, "9": not_done}, label: "Audiogram: result"}
  audiogram_date: {column: audiogr_date, type: date, range: [1970-01-01, today], label: "Audiogram: date"}
  evoked_potentials: {column: pea, type: category, codes: {"1": normal, "2": abnormal, "3": result_unknown, "9": not_done}, label: "Auditory evoked potentials: result"}
  evoked_potentials_date: {column: pea_date, type: date, range: [1970-01-01, today], label: "Auditory evoked potentials: date"}
  other_examination: {column: autrex, type: category, codes: {"1": normal, "2": abnormal, "3": result_unknown, "9": not_done}, label: "Another examination: result"}
  other_examination_date: {column: autrex_date, type: date, range: [1970-01-01, today], label: "Another examination: date"}
  eye_tracking: {column: eyetrack, type: category, codes: {"1": normal, "2": abnormal, "3": result_unknown, "9": not_done}, label: "Eye tracking: result"}
  other_examination_name: {column: autranoc, type: text, label: "Another examination: which one, as written"}
  examination_anomaly_text: {column: anomspec, type: text, label: "Anomaly found by an examination, as written"}
  known_genetic_anomaly: {column: agenmaj, type: text, label: "Known major genetic anomaly, as written"}
  examinations_changed: {column: exchang, type: item, range: [0, 1], label: "The examinations changed since the last visit (follow-up form)"}
