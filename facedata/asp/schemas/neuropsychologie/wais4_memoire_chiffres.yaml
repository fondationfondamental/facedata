instrument: wais4_memoire_chiffres
title: "WAIS-IV, digit span"
tab: neuropsychologie
section: WAIS-IV
status: reviewed
notes: >
  Digit span: the two trials and the score of each of the eight items, forward
  and backward, the raw score of the three parts (forward, backward,
  sequencing), the total, the longest span of each part with its z-score, the
  scaled score and its z-score, on 293 inclusion visits. The items of the
  sequencing part are not recorded.

  The WAIS-IV of this cohort is recorded item by item, on about 210 to 295
  inclusion visits depending on the subtest (302 visits in all, 12 of patients
  under 18), from 2013 to 2026. It is on 14% of the inclusion visits of 2013,
  42% of 2014, 36% of 2015, 18% to 19% of 2016 and 2017, 3% to 11% of 2018 to
  2023, 21% to 22% of 2024 and 2025 and 7% of 2026 so far. It is the fourth
  edition: the visual puzzles and the sequencing part of the digit span exist
  only in it. No other edition of the scale is recorded in this table. The
  extraction has no column for the edition: wais_version (wais4) is read from
  the first item of each subtest, with the same block in the eleven schemas of
  the WAIS-IV, and is filled on the 302 visits that hold one of them.

  Checked on every visit: the total is the sum of the three raw scores (293 of
  293), the span difference is the forward span minus the backward span (294
  of 294), and the stored z-score is the scaled score minus 10, over 3.

  Same instrument and output names as in FACE BP and SZ, in other columns. The
  48 columns of the trials and of the item scores have the names of BP
  (wais4_ds_forward_1a, wais4_ds_forward_item1 and so on, for the forward and
  the backward part; they were named wais4_dsf_* and wais4_dsb_*).

  Scaled score, z-scores and span z-scores. They are recomputed and delivered
  (decision of the project lead for the standard scores of the
  neuropsychological tests): the scaled score is read in the WAIS-IV table of
  the application (norms/wais4_digit_span.csv) from the raw total, and the
  z-score is (scaled score - 10) / 3. The z-scores of the three longest spans
  are computed with the mean and the standard deviation of the age group
  (norms/wais4_ds_forward_span_z.csv and the two others) and compared with the
  stored ones to 0.011, which have two decimals. The form has no typed age in
  this cohort: the tables are read with the age at the date of the assessment
  form (age basis, below). The visits are of patients from 15.9 to 65 years;
  the visit of 15.9 years is below the first age of the tables and gets
  norm_missing. The stored scores are wais4_ds_scaled_stored,
  wais4_ds_z_stored and the three wais4_ds_*_span_z_stored, not delivered.

  Age basis. The application (eAsperger, script 280_score.js, function
  gere_ageNPSY) computes the age at the date of the assessment form (QSDTC),
  not at the visit date, and the data show that it did so from about 2015 on.
  The table is therefore read with the age at the form date
  (wais4_ds_assessment_date, read from the raw column qsdtc and not delivered;
  score fields age_date and age_date_since 2015-01-01) where the visit is
  dated 2015 or later and the form date is within 366 days of the visit, and
  with the age at the visit elsewhere. In this subtest the scaled score is the
  same with either age, and the three span z-scores differ from the stored
  ones on 9, 10 and 7 visits instead of 10, 15 and 11.

  Verified on the visits that have both: the scaled score differs on 5 of 292
  (1.7%, score_mismatch; the same with the age at the visit), and so does its
  z-score; the forward span z-score differs on 9 of 292, the backward on 10
  and the sequencing on 7 (2 to 3%, 17 of the 26 from 2024; 10, 15 and 11 with
  the age at the visit). One visit is not recomputed (the patient of 15.9 years). The 2024 part of
  the span z-score differences (15 of the 26 cells, all at centres C and D)
  is the 2024 pattern of those two centres described in
  wais4_arithmetique.yaml (form dates 40 to 90 days from the visit). The
  dictionary lists 24 item columns of the sequencing part (MCOC_1A to
  MCOC_8B and MCOC_1 to MCOC_8) that the extraction does not hold; only its
  total (mcoc_tot) is exported.

version:
  name: wais_version
  filled:
    wais4: [wais_sim1, wais_voc1, wais_info1, wais_cub1, wais_mat1, wais_puzl1, wais_mcod_1a, wais_arit1,
            wais_cod_tot, wais_symb_tot, wais_img1]

defaults: {type: item}

