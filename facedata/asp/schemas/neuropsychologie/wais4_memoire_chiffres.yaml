instrument: wais4_memoire_chiffres
title: "WAIS-IV, digit span"
tab: neuropsychologie
section: WAIS-IV
status: draft
notes: >
  Digit span: the two trials and the score of each of the eight items, forward
  and backward, the raw score of the three parts (forward, backward,
  sequencing), the total, the longest span of each part with its z-score, the
  scaled score and its z-score, on 293 inclusion visits. The items of the
  sequencing part are not recorded.

  The WAIS-IV of this cohort is recorded item by item, on about 210 to 295
  inclusion visits depending on the subtest, almost all of adults, from 2013 to
  2026 (29% to 36% of the inclusions until 2015, 10% or less from 2018 to 2023).
  It is the fourth edition: the visual puzzles and the sequencing part of the
  digit span exist only in it. No other edition of the scale is recorded in
  this table.

  Checked on every visit: the total is the sum of the three raw scores (293
  of 293), the span difference is the forward span minus the backward span
  (294 of 294), and the z-score is the scaled score minus 10, over 3.

  Same instrument and output names as in FACE SZ, in other columns. The trials of each item are specific to ASP.

defaults: {type: item}

