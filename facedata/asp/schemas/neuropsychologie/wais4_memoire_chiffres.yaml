  wais4_ds_backward_raw: {column: mcoi_tot, range: [0, 16], label: "WAIS-IV digit span backward, raw score"}
  wais4_ds_sequencing_raw: {column: mcoc_tot, range: [0, 16], label: "WAIS-IV digit span sequencing, raw score"}
  wais4_ds_total: {column: mc_tot, range: [0, 48], label: "WAIS-IV digit span, total raw score"}
  wais4_ds_forward_span: {column: mc_end, range: [0, 9], label: "WAIS-IV digit span forward, longest span"}
  wais4_ds_backward_span: {column: mc_env, range: [0, 9], label: "WAIS-IV digit span backward, longest span"}
  wais4_ds_sequencing_span: {column: mc_cro, range: [0, 9], label: "WAIS-IV digit span sequencing, longest span"}
  wais4_ds_span_difference: {column: mc_emp, range: [-9, 9], label: "WAIS-IV digit span, forward span minus backward span"}
  wais4_ds_scaled_stored: {column: mc_std, range: [1, 19], label: "WAIS-IV digit span, scaled score as stored", keep: false}
  wais4_ds_z_stored: {column: mc_cr, type: number, range: [-3, 3], winsor: false, label: "WAIS-IV digit span, z-score of the scaled score as stored", keep: false}
  wais4_ds_forward_span_z_stored: {column: mc_end_std, type: number, range: [-5, 5], label: "WAIS-IV digit span forward, z-score of the span as stored", keep: false}
  wais4_ds_backward_span_z_stored: {column: mc_env_std, type: number, range: [-5, 5], label: "WAIS-IV digit span backward, z-score of the span as stored", keep: false}
  wais4_ds_sequencing_span_z_stored: {column: mc_cro_std, type: number, range: [-5, 5], label: "WAIS-IV digit span sequencing, z-score of the span as stored", keep: false}
  wais4_ds_assessment_date: {column: qsdtc, type: date, range: [1900-01-01, 2100-12-31], keep: false, label: "Date of the assessment form, the date of the age read in the norms"}

scores:
  wais4_ds_total_check:
    label: "WAIS-IV digit span, sum of the three raw scores"
    sum: [wais4_ds_forward_raw, wais4_ds_backward_raw, wais4_ds_sequencing_raw]
    compare: wais4_ds_total
    keep: false
  wais4_ds_scaled:
    label: Age-scaled score (mean 10 and SD 3), read in the table of the manual
    lookup: wais4_digit_span
    from: wais4_ds_total
    age_date: wais4_ds_assessment_date
    age_date_since: "2015-01-01"
    range: [1, 19]
    compare: wais4_ds_scaled_stored
  wais4_ds_z:
    label: Scaled score as a z-score, (scaled score - 10) / 3
    sum: [wais4_ds_scaled]
    scale: [0.3333333, -3.3333333]
    range: [-3, 3]
    compare: wais4_ds_z_stored
    compare_tolerance: 0.006
  wais4_ds_forward_span_z:
    label: Longest forward span as a z-score, computed with the mean and SD of the age group
    regression: wais4_ds_forward_span_z
    from: wais4_ds_forward_span
    age_date: wais4_ds_assessment_date
    age_date_since: "2015-01-01"
    range: [-5, 5]
    compare: wais4_ds_forward_span_z_stored
    compare_tolerance: 0.011
  wais4_ds_backward_span_z:
    label: Longest backward span as a z-score, computed with the mean and SD of the age group
    regression: wais4_ds_backward_span_z
    from: wais4_ds_backward_span
    age_date: wais4_ds_assessment_date
    age_date_since: "2015-01-01"
    range: [-5, 5]
    compare: wais4_ds_backward_span_z_stored
    compare_tolerance: 0.011
  wais4_ds_sequencing_span_z:
    label: Longest sequencing span as a z-score, computed with the mean and SD of the age group
    regression: wais4_ds_sequencing_span_z
    from: wais4_ds_sequencing_span
    age_date: wais4_ds_assessment_date
    age_date_since: "2015-01-01"
    range: [-5, 5]
    compare: wais4_ds_sequencing_span_z_stored
    compare_tolerance: 0.011
