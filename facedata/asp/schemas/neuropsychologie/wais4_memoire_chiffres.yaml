  wais4_ds_backward_item5: {column: wais_mcoi_5, range: [0, 2], label: "WAIS-IV digit span backward, item 5, score"}
  wais4_ds_backward_6a: {column: wais_mcoi_6a, range: [0, 1], label: "WAIS-IV digit span backward, item 6, first trial"}
  wais4_ds_backward_6b: {column: wais_mcoi_6b, range: [0, 1], label: "WAIS-IV digit span backward, item 6, second trial"}
  wais4_ds_backward_item6: {column: wais_mcoi_6, range: [0, 2], label: "WAIS-IV digit span backward, item 6, score"}
  wais4_ds_backward_7a: {column: wais_mcoi_7a, range: [0, 1], label: "WAIS-IV digit span backward, item 7, first trial"}
