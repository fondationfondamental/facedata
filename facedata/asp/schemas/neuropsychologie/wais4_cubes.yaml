instrument: wais4_cubes
title: "WAIS-IV, block design"
tab: neuropsychologie
section: WAIS-IV
status: draft
notes: >
  Block design: 14 items scored from 0 to 7, their total, the scaled score,
  on 215 inclusion visits.

  The WAIS-IV of this cohort is recorded item by item, on about 210 to 295
  inclusion visits depending on the subtest, almost all of adults, from 2013 to
  2026 (29% to 36% of the inclusions until 2015, 10% or less from 2018 to 2023).
  It is the fourth edition: the visual puzzles and the sequencing part of the
  digit span exist only in it. No other edition of the scale is recorded in
  this table.

  Checked on every visit: the stored total is the sum of the items, and the
  z-score is the scaled score minus 10, over 3. The scaled score needs the norm
  tables of the test, which are not available: it is delivered as stored.

  The stored total equals the sum of the items on 215 of the 215 visits that
  hold every item. An item of the block design is scored 0, 2 or 4, and up to 7 with the time bonus of the last items. No z-score is stored for this subtest.

  An instrument of the ASP cohort only.

defaults: {type: item, range: [0, 7]}

variables:
  wais4_bd01: {column: wais_cub1, label: "WAIS-IV block design, item 1"}
  wais4_bd02: {column: wais_cub2, label: "WAIS-IV block design, item 2"}
  wais4_bd03: {column: wais_cub3, label: "WAIS-IV block design, item 3"}
  wais4_bd04: {column: wais_cub4, label: "WAIS-IV block design, item 4"}
  wais4_bd05: {column: wais_cub5, label: "WAIS-IV block design, item 5"}
  wais4_bd06: {column: wais_cub6, label: "WAIS-IV block design, item 6"}
  wais4_bd07: {column: wais_cub7, label: "WAIS-IV block design, item 7"}
  wais4_bd08: {column: wais_cub8, label: "WAIS-IV block design, item 8"}
  wais4_bd09: {column: wais_cub9, label: "WAIS-IV block design, item 9"}
  wais4_bd10: {column: wais_cub10, label: "WAIS-IV block design, item 10"}
  wais4_bd11: {column: wais_cub11, label: "WAIS-IV block design, item 11"}
  wais4_bd12: {column: wais_cub12, label: "WAIS-IV block design, item 12"}
  wais4_bd13: {column: wais_cub13, label: "WAIS-IV block design, item 13"}
  wais4_bd14: {column: wais_cub14, label: "WAIS-IV block design, item 14"}
  wais4_bd_total: {column: wais_cubtot, range: [0, 66], label: "WAIS-IV block design, total as stored"}
  wais4_bd_scaled: {column: wais_cubstd, range: [1, 19], label: "WAIS-IV block design, scaled score"}

scores:
  wais4_bd_total_check:
    label: "WAIS-IV block design, total of the items"
    sum: [wais4_bd01, wais4_bd02, wais4_bd03, wais4_bd04, wais4_bd05, wais4_bd06, wais4_bd07, wais4_bd08, wais4_bd09, wais4_bd10, wais4_bd11, wais4_bd12, wais4_bd13, wais4_bd14]
    compare: wais4_bd_total
    keep: false
