instrument: wais4_cubes
title: "WAIS-IV, block design"
tab: neuropsychologie
section: WAIS-IV
status: reviewed
notes: >
  Block design: 14 items scored from 0 to 7, their total, the scaled score and
  its z-score, on 215 inclusion visits.

  The WAIS-IV of this cohort is recorded item by item, on about 210 to 295
  inclusion visits depending on the subtest (302 visits in all, 12 of patients
  under 18), from 2013 to 2026. It is on 14% of the inclusion visits of 2013,
  42% of 2014, 36% of 2015, 18% to 19% of 2016 and 2017, 3% to 11% of 2018 to
  2023, 21% to 22% of 2024 and 2025 and 7% of 2026 so far. It is the fourth
  edition: the visual puzzles and the sequencing part of the digit span exist
  only in it. No other edition of the scale is recorded in this table. The
  extraction has no column for the edition: wais_version (wais4) is read from
  the first item of each subtest, with the same block in the eleven schemas of
  the WAIS-IV, and is filled on the 302 visits that hold one of them.

  Checked on every visit: the stored total is the sum of the items.

  The stored total equals the sum of the items on 215 of the 215 visits that
  hold every item. An item of the block design is scored 0, 2 or 4, and up to
  7 with the time bonus of the last items. The raw total is the sum of the
  items (wais4_bd_total); the stored total is a check (wais4_bd_total_stored,
  not delivered). No z-score is stored for this subtest: wais4_bd_z, (scaled
  score - 10) / 3, is computed and has no stored value to be compared with.

  An instrument of the ASP cohort only.

  Scaled score and z-score. They are recomputed and delivered (decision of the
  project lead for the standard scores of the neuropsychological tests): the
  scaled score is read in the WAIS-IV table of the application
  (norms/wais4_block_design.csv) from the raw total, and the z-score is
  (scaled score - 10) / 3. The form has no typed age in this cohort: the table
  is read with the age at the date of the assessment form (age basis, below).
  The visits are of patients from 15.9 to 65 years; the one of 15.9 years is
  below the first age of the tables and gets norm_missing. The stored score is
  wais4_bd_scaled_stored, not delivered. Verified: the scaled score differs
  from the stored one on 2 of the 214 visits that have both (0.9%,
  score_mismatch; the same with the age at the visit); 1 visit is not
  recomputed (the patient of 15.9 years).

  Age basis. The application (eAsperger, script 280_score.js, function
  gere_ageNPSY) computes the age at the date of the assessment form (QSDTC),
  not at the visit date, and the data show that it did so from about 2015 on.
  The table is therefore read with the age at the form date
  (wais4_bd_assessment_date, read from the raw column qsdtc and not delivered;
  score fields age_date and age_date_since 2015-01-01) where the visit is
  dated 2015 or later and the form date is within 366 days of the visit, and
  with the age at the visit elsewhere. In this subtest the age at the form
  date changes no score.

version:
  name: wais_version
  filled:
    wais4: [wais_sim1, wais_voc1, wais_info1, wais_cub1, wais_mat1, wais_puzl1, wais_mcod_1a, wais_arit1,
            wais_cod_tot, wais_symb_tot, wais_img1]

defaults: {type: item, range: [0, 7]}

variables:
  wais4_bd01: {column: wais_cub1, label: "WAIS-IV block design, item 1"}
  wais4_bd02: {column: wais_cub2, label: "WAIS-IV block design, item 2"}
  wais4_bd03: {column: wais_cub3, label: "WAIS-IV block design, item 3"}
  wais4_bd04: {column: wais_cub4, label: "WAIS-IV block design, item 4"}
  wais4_bd05: {column: wais_cub5, label: "WAIS-IV block design, item 5"}
  wais4_bd06: {column: wais_cub6, label: "WAIS-IV block design, item 6"}
  wais4_bd07: {column: wais_cub7, label: "WAIS-IV block design, item 7"}
  wais4_bd08: {column: wais_cub8, label: "WAIS-IV block design, item 8"}
  wais4_bd09: {column: wais_cub9, label: "WAIS-IV block design, item 9"}
  wais4_bd10: {column: wais_cub10, label: "WAIS-IV block design, item 10"}
  wais4_bd11: {column: wais_cub11, label: "WAIS-IV block design, item 11"}
  wais4_bd12: {column: wais_cub12, label: "WAIS-IV block design, item 12"}
  wais4_bd13: {column: wais_cub13, label: "WAIS-IV block design, item 13"}
  wais4_bd14: {column: wais_cub14, label: "WAIS-IV block design, item 14"}
  wais4_bd_total_stored: {column: wais_cubtot, range: [0, 66], keep: false, label: "WAIS-IV block design, total as stored"}
  wais4_bd_scaled_stored: {column: wais_cubstd, range: [1, 19], label: "WAIS-IV block design, scaled score as stored", keep: false}
  wais4_bd_assessment_date: {column: qsdtc, type: date, range: [1900-01-01, 2100-12-31], keep: false, label: "Date of the assessment form, the date of the age read in the norms"}

scores:
  wais4_bd_total:
    label: "WAIS-IV block design, total of the items"
    sum: [wais4_bd01, wais4_bd02, wais4_bd03, wais4_bd04, wais4_bd05, wais4_bd06, wais4_bd07, wais4_bd08, wais4_bd09, wais4_bd10, wais4_bd11, wais4_bd12, wais4_bd13, wais4_bd14]
    range: [0, 66]
    compare: wais4_bd_total_stored
  wais4_bd_scaled:
    label: Age-scaled score (mean 10 and SD 3), read in the table of the manual
    lookup: wais4_block_design
    from: wais4_bd_total
    age_date: wais4_bd_assessment_date
    age_date_since: "2015-01-01"
    range: [1, 19]
    compare: wais4_bd_scaled_stored
  wais4_bd_z:
    label: Scaled score as a z-score, (scaled score - 10) / 3
    sum: [wais4_bd_scaled]
    scale: [0.3333333, -3.3333333]
    range: [-3, 3]
