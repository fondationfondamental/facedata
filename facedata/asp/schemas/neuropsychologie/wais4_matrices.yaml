instrument: wais4_matrices
title: "WAIS-IV, matrix reasoning"
tab: neuropsychologie
section: WAIS-IV
status: reviewed
notes: >
  Matrix reasoning: 26 items scored from 0 to 1, their total, the scaled score
  and its z-score, on 286 inclusion visits.

  The WAIS-IV of this cohort is recorded item by item, on about 210 to 295
  inclusion visits depending on the subtest (302 visits in all, 12 of patients
  under 18), from 2013 to 2026. It is on 14% of the inclusion visits of 2013,
  42% of 2014, 36% of 2015, 18% to 19% of 2016 and 2017, 3% to 11% of 2018 to
  2023, 21% to 22% of 2024 and 2025 and 7% of 2026 so far. It is the fourth
  edition: the visual puzzles and the sequencing part of the digit span exist
  only in it. No other edition of the scale is recorded in this table. The
  extraction has no column for the edition: wais_version (wais4) is read from
  the first item of each subtest, with the same block in the eleven schemas of
  the WAIS-IV, and is filled on the 302 visits that hold one of them.

  Checked on every visit: the stored total is the sum of the items, and the
  stored z-score is the scaled score minus 10, over 3.

  The stored total equals the sum of the items on 286 of the 286 visits that
  hold every item.

  Same instrument and output names as in FACE SZ, in other columns.

  Scaled score and z-score. They are recomputed and delivered (decision of the
  project lead for the standard scores of the neuropsychological tests): the
  scaled score is read in the WAIS-IV table of the application
  (norms/wais4_matrices.csv) from the raw total, and the z-score is (scaled
  score - 10) / 3. The form has no typed age in this cohort: the table is read
  with the age at the date of the assessment form (age basis, below). The
  visits are of patients from 15.9 to 65 years; the one of 15.9 years is below
  the first age of the tables and gets norm_missing. The stored scores are
  wais4_mat_scaled_stored and wais4_mat_z_stored, not delivered. Verified: the
  scaled score differs from the stored one on 5 of the 285 visits that have
  both (1.8%, score_mismatch; 8 with the age at the visit), and so does its
  z-score; 1 visit is not recomputed (the patient of 15.9 years).

  Age basis. The application (eAsperger, script 280_score.js, function
  gere_ageNPSY) computes the age at the date of the assessment form (QSDTC),
  not at the visit date, and the data show that it did so from about 2015 on.
  The table is therefore read with the age at the form date
  (wais4_mat_assessment_date, read from the raw column qsdtc and not
  delivered; score fields age_date and age_date_since 2015-01-01) where the
  visit is dated 2015 or later and the form date is within 366 days of the
  visit, and with the age at the visit elsewhere. In this subtest the
  differences fall from 8 to 5.

version:
  name: wais_version
  filled:
    wais4: [wais_sim1, wais_voc1, wais_info1, wais_cub1, wais_mat1, wais_puzl1, wais_mcod_1a, wais_arit1,
            wais_cod_tot, wais_symb_tot, wais_img1]

defaults: {type: item, range: [0, 1]}

variables:
  wais4_mat01: {column: wais_mat1, label: "WAIS-IV matrix reasoning, item 1"}
  wais4_mat02: {column: wais_mat2, label: "WAIS-IV matrix reasoning, item 2"}
  wais4_mat03: {column: wais_mat3, label: "WAIS-IV matrix reasoning, item 3"}
  wais4_mat04: {column: wais_mat4, label: "WAIS-IV matrix reasoning, item 4"}
  wais4_mat05: {column: wais_mat5, label: "WAIS-IV matrix reasoning, item 5"}
  wais4_mat06: {column: wais_mat6, label: "WAIS-IV matrix reasoning, item 6"}
  wais4_mat07: {column: wais_mat7, label: "WAIS-IV matrix reasoning, item 7"}
  wais4_mat08: {column: wais_mat8, label: "WAIS-IV matrix reasoning, item 8"}
  wais4_mat09: {column: wais_mat9, label: "WAIS-IV matrix reasoning, item 9"}
  wais4_mat10: {column: wais_mat10, label: "WAIS-IV matrix reasoning, item 10"}
  wais4_mat11: {column: wais_mat11, label: "WAIS-IV matrix reasoning, item 11"}
  wais4_mat12: {column: wais_mat12, label: "WAIS-IV matrix reasoning, item 12"}
  wais4_mat13: {column: wais_mat13, label: "WAIS-IV matrix reasoning, item 13"}
  wais4_mat14: {column: wais_mat14, label: "WAIS-IV matrix reasoning, item 14"}
  wais4_mat15: {column: wais_mat15, label: "WAIS-IV matrix reasoning, item 15"}
  wais4_mat16: {column: wais_mat16, label: "WAIS-IV matrix reasoning, item 16"}
  wais4_mat17: {column: wais_mat17, label: "WAIS-IV matrix reasoning, item 17"}
  wais4_mat18: {column: wais_mat18, label: "WAIS-IV matrix reasoning, item 18"}
  wais4_mat19: {column: wais_mat19, label: "WAIS-IV matrix reasoning, item 19"}
  wais4_mat20: {column: wais_mat20, label: "WAIS-IV matrix reasoning, item 20"}
  wais4_mat21: {column: wais_mat21, label: "WAIS-IV matrix reasoning, item 21"}
  wais4_mat22: {column: wais_mat22, label: "WAIS-IV matrix reasoning, item 22"}
  wais4_mat23: {column: wais_mat23, label: "WAIS-IV matrix reasoning, item 23"}
  wais4_mat24: {column: wais_mat24, label: "WAIS-IV matrix reasoning, item 24"}
  wais4_mat25: {column: wais_mat25, label: "WAIS-IV matrix reasoning, item 25"}
  wais4_mat26: {column: wais_mat26, label: "WAIS-IV matrix reasoning, item 26"}
  wais4_mat_total: {column: wais_mattot, range: [0, 26], label: "WAIS-IV matrix reasoning, total as stored"}
  wais4_mat_scaled_stored: {column: wais_mat_std, range: [1, 19], label: "WAIS-IV matrix reasoning, scaled score as stored", keep: false}
  wais4_mat_z_stored: {column: wais_mat_cr, type: number, range: [-3, 3], winsor: false, label: "WAIS-IV matrix reasoning, z-score of the scaled score as stored", keep: false}
  wais4_mat_assessment_date: {column: qsdtc, type: date, range: [1900-01-01, 2100-12-31], keep: false, label: "Date of the assessment form, the date of the age read in the norms"}

scores:
  wais4_mat_total_check:
    label: "WAIS-IV matrix reasoning, total of the items"
    sum: [wais4_mat01, wais4_mat02, wais4_mat03, wais4_mat04, wais4_mat05, wais4_mat06, wais4_mat07, wais4_mat08, wais4_mat09, wais4_mat10, wais4_mat11, wais4_mat12, wais4_mat13, wais4_mat14, wais4_mat15, wais4_mat16, wais4_mat17, wais4_mat18, wais4_mat19, wais4_mat20, wais4_mat21, wais4_mat22, wais4_mat23, wais4_mat24, wais4_mat25, wais4_mat26]
    compare: wais4_mat_total
    keep: false
  wais4_mat_scaled:
    label: Age-scaled score (mean 10 and SD 3), read in the table of the manual
    lookup: wais4_matrices
    from: wais4_mat_total
    age_date: wais4_mat_assessment_date
    age_date_since: "2015-01-01"
    range: [1, 19]
    compare: wais4_mat_scaled_stored
  wais4_mat_z:
    label: Scaled score as a z-score, (scaled score - 10) / 3
    sum: [wais4_mat_scaled]
    scale: [0.3333333, -3.3333333]
    range: [-3, 3]
    compare: wais4_mat_z_stored
    compare_tolerance: 0.006
