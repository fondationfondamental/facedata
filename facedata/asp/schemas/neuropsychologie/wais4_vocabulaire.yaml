instrument: wais4_vocabulaire
title: "WAIS-IV, vocabulary"
tab: neuropsychologie
section: WAIS-IV
status: draft
notes: >
  Vocabulary: 30 items scored from 0 to 2, their total, the scaled score and its z-score,
  on 212 inclusion visits.

  The WAIS-IV of this cohort is recorded item by item, on about 210 to 295
  inclusion visits depending on the subtest, almost all of adults, from 2013 to
  2026 (29% to 36% of the inclusions until 2015, 10% or less from 2018 to 2023).
  It is the fourth edition: the visual puzzles and the sequencing part of the
  digit span exist only in it. No other edition of the scale is recorded in
  this table.

  Checked on every visit: the stored total is the sum of the items, and the
  stored z-score is the scaled score minus 10, over 3.

  The stored total equals the sum of the items on 212 of the 212 visits that
  hold every item.

  Same instrument and output names as in FACE BP, in other columns.

  Scaled score and z-score. They are recomputed and delivered (decision of the
  project lead for the standard scores of the neuropsychological tests): the
  scaled score is read in the WAIS-IV table of the application
  (norms/wais4_vocabulary_asp.csv) from the raw total, and the z-score is
  (scaled score - 10) / 3. The ASP table is used for this subtest, not the one
  of BP: the ASP script gives another scaled score at some ages (the two
  tables differ for 24 of the 212 visits, all of 25 to 29 years). The form has
  no typed age in this cohort: the table is read with the age at the visit
  (the visits are of patients from 15.9 to 65 years; the one of 15.9 years is
  below the first age of the tables and gets norm_missing). The stored scores
  are wais4_vocab_scaled_stored and wais4_vocab_z_stored, not delivered.
  Verified: the scaled score differs from the stored one on 3 of the 211
  visits that have both (1.4%, score_mismatch), and so does its z-score; 1
  visit is not recomputed (the patient of 15.9 years).

defaults: {type: item, range: [0, 2]}

variables:
  wais4_vocab01: {column: wais_voc1, label: "WAIS-IV vocabulary, item 1", range: [0, 1]}
  wais4_vocab02: {column: wais_voc2, label: "WAIS-IV vocabulary, item 2", range: [0, 1]}
  wais4_vocab03: {column: wais_voc3, label: "WAIS-IV vocabulary, item 3", range: [0, 1]}
  wais4_vocab04: {column: wais_voc4, label: "WAIS-IV vocabulary, item 4"}
  wais4_vocab05: {column: wais_voc5, label: "WAIS-IV vocabulary, item 5"}
  wais4_vocab06: {column: wais_voc6, label: "WAIS-IV vocabulary, item 6"}
  wais4_vocab07: {column: wais_voc7, label: "WAIS-IV vocabulary, item 7"}
  wais4_vocab08: {column: wais_voc8, label: "WAIS-IV vocabulary, item 8"}
  wais4_vocab09: {column: wais_voc9, label: "WAIS-IV vocabulary, item 9"}
  wais4_vocab10: {column: wais_voc10, label: "WAIS-IV vocabulary, item 10"}
  wais4_vocab11: {column: wais_voc11, label: "WAIS-IV vocabulary, item 11"}
  wais4_vocab12: {column: wais_voc12, label: "WAIS-IV vocabulary, item 12"}
  wais4_vocab13: {column: wais_voc13, label: "WAIS-IV vocabulary, item 13"}
  wais4_vocab14: {column: wais_voc14, label: "WAIS-IV vocabulary, item 14"}
  wais4_vocab15: {column: wais_voc15, label: "WAIS-IV vocabulary, item 15"}
  wais4_vocab16: {column: wais_voc16, label: "WAIS-IV vocabulary, item 16"}
  wais4_vocab17: {column: wais_voc17, label: "WAIS-IV vocabulary, item 17"}
  wais4_vocab18: {column: wais_voc18, label: "WAIS-IV vocabulary, item 18"}
  wais4_vocab19: {column: wais_voc19, label: "WAIS-IV vocabulary, item 19"}
  wais4_vocab20: {column: wais_voc20, label: "WAIS-IV vocabulary, item 20"}
  wais4_vocab21: {column: wais_voc21, label: "WAIS-IV vocabulary, item 21"}
  wais4_vocab22: {column: wais_voc22, label: "WAIS-IV vocabulary, item 22"}
  wais4_vocab23: {column: wais_voc23, label: "WAIS-IV vocabulary, item 23"}
  wais4_vocab24: {column: wais_voc24, label: "WAIS-IV vocabulary, item 24"}
  wais4_vocab25: {column: wais_voc25, label: "WAIS-IV vocabulary, item 25"}
  wais4_vocab26: {column: wais_voc26, label: "WAIS-IV vocabulary, item 26"}
  wais4_vocab27: {column: wais_voc27, label: "WAIS-IV vocabulary, item 27"}
  wais4_vocab28: {column: wais_voc28, label: "WAIS-IV vocabulary, item 28"}
  wais4_vocab29: {column: wais_voc29, label: "WAIS-IV vocabulary, item 29"}
  wais4_vocab30: {column: wais_voc30, label: "WAIS-IV vocabulary, item 30"}
  wais4_vocab_total_stored: {column: wais_voctot, range: [0, 57], keep: false, label: "WAIS-IV vocabulary, total as stored"}
  wais4_vocab_scaled_stored: {column: wais_voc_std, range: [1, 19], label: "WAIS-IV vocabulary, scaled score as stored", keep: false}
  wais4_vocab_z_stored: {column: wais_voc_cr, type: number, range: [-3, 3.34], winsor: false, label: "WAIS-IV vocabulary, z-score of the scaled score as stored", keep: false}

scores:
  wais4_vocab_total:
    label: "WAIS-IV vocabulary, total of the items"
    sum: [wais4_vocab01, wais4_vocab02, wais4_vocab03, wais4_vocab04, wais4_vocab05, wais4_vocab06, wais4_vocab07, wais4_vocab08, wais4_vocab09, wais4_vocab10, wais4_vocab11, wais4_vocab12, wais4_vocab13, wais4_vocab14, wais4_vocab15, wais4_vocab16, wais4_vocab17, wais4_vocab18, wais4_vocab19, wais4_vocab20, wais4_vocab21, wais4_vocab22, wais4_vocab23, wais4_vocab24, wais4_vocab25, wais4_vocab26, wais4_vocab27, wais4_vocab28, wais4_vocab29, wais4_vocab30]
    compare: wais4_vocab_total_stored
  wais4_vocab_scaled:
    label: Age-scaled score (mean 10 and SD 3), read in the table of the manual
    lookup: wais4_vocabulary_asp
    from: wais4_vocab_total
    range: [1, 19]
    compare: wais4_vocab_scaled_stored
  wais4_vocab_z:
    label: Scaled score as a z-score, (scaled score - 10) / 3
    sum: [wais4_vocab_scaled]
    scale: [0.3333333, -3.3333333]
    range: [-3, 3]
    compare: wais4_vocab_z_stored
    compare_tolerance: 0.006
