instrument: learning_disorders
title: "Learning disorders and early development"
tab: neuropsychologie
section: assessment
status: reviewed
notes: >
  Ten yes/no questions asked before the neuropsychological assessment, on
  807 visits, almost all inclusion visits of adults: dyslexia (yes on 71),
  dysorthographia (61), dyscalculia (28), dysphasia (11), dyspraxia (82),
  delayed speech (102), stuttering (38), delayed walking (40), febrile
  seizures (14) and giftedness (72). Yes is delivered as 1 and no as 0.

  9 is read as "not known" (unknown, missing_code): 618 cells, from 29 to 92
  per question. The form (eAsperger, form 237.php) codes 1 Oui, 0 Non and 9
  Ne sais pas; the dictionary says 2 for no (1=Oui; 2=Non; 9=Ne sais pas),
  but the data hold only 0, 1 and 9 (817 of the 4,500 visits have an answer,
  and none holds a 2).

  The column names say what each question is, and the list is the one of
  FACE DR, in the same order: the variables keep the DR names (trbapp01 to
  trbapp10), and BP has them too. The two ADHD questions, the seizures
  question and the complaints text of DR are not asked here.

  Same instrument as in FACE DR, in other columns.

defaults: {type: item, range: [0, 1], missing: {"9": unknown}}

variables:
  trbapp01: {column: neuro_dyslex, label: Dyslexia}
  trbapp02: {column: neuro_dysor, label: Dysorthographia}
  trbapp03: {column: neuro_dyscal, label: Dyscalculia}
  trbapp04: {column: neuro_dysph, label: Dysphasia}
  trbapp05: {column: neuro_dyspra, label: Dyspraxia}
  trbapp06: {column: neuro_parol, label: Delayed speech}
  trbapp07: {column: neuro_begai, label: Stuttering}
  trbapp08: {column: neuro_march, label: Delayed walking}
  trbapp09: {column: neuro_conv, label: Febrile seizures in early childhood}
  trbapp10: {column: neuro_precoc, label: Giftedness}
