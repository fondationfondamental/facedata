instrument: executive_functions
title: "Executive function tests"
tab: neuropsychologie
section: executive functions
status: draft
notes: >
  A block added in 2018, on 869 inclusion visits: a box "done" (yes on 572),
  five results, the date and the age in months. The test is the revised errands
  test ("test des commissions révisé"): the time to do the task in seconds
  (median 380), the numbers of useless detours, of times not respected and of
  logic errors (0 to 3 each), and the total number of errors (0 to 6).

  The schema was written from the column names and the answers, then checked
  against the thesaurus V2.13, which names these columns (PROGRESS.md D13 and
  D14).

  An instrument of the ASP cohort only.

variables:
  executive_done: {column: fctexe, type: item, range: [0, 1], label: "The executive function test (revised errands test) was done"}
  errands_time: {column: fctexe01, type: number, range: [0, 3000], label: "Revised errands test: time to do the task, seconds"}
  errands_useless_detours: {column: fctexe02, type: number, range: [0, 20], winsor: false, label: "Revised errands test: number of useless detours"}
  errands_time_violations: {column: fctexe03, type: number, range: [0, 20], winsor: false, label: "Revised errands test: number of times not respected"}
  errands_logic_errors: {column: fctexe04, type: number, range: [0, 20], winsor: false, label: "Revised errands test: number of logic errors"}
  errands_total_errors: {column: fctexe05, type: number, range: [0, 20], winsor: false, label: "Revised errands test: total number of errors"}
  executive_date: {column: fctexe_qsdtc, type: date, range: [2005-01-01, 2026-12-31], label: "Date of the executive function tests"}
  executive_age_months: {column: fctexeag, type: number, range: [0, 900], winsor: false, label: "Age at the executive function tests, in months"}
