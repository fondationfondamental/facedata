  wais4_ivt_index_a: {column: ivt_indice_a, range: [50, 150], label: "WAIS-IV processing speed index, second set (_a)"}
  wais4_ivt_percentile_a: {column: ivt_rang_a, type: number, range: [0, 100], winsor: false, label: "WAIS-IV processing speed index, percentile rank, second set (_a)"}
