instrument: wais4_code_symboles_ivt
title: "WAIS-IV, coding, symbol search and the processing speed index"
tab: neuropsychologie
section: WAIS-IV
status: draft
notes: >
  Coding and symbol search: boxes filled, errors, raw score, scaled score and
  z-score, on about 278 inclusion visits; then the processing speed index
  with its sum of scaled scores and its percentile rank (267 visits), and a
  second set of the same three numbers whose names end in _a (276 visits).

  The WAIS-IV of this cohort is recorded item by item, on about 210 to 295
  inclusion visits depending on the subtest, almost all of adults, from 2013 to
  2026 (29% to 36% of the inclusions until 2015, 10% or less from 2018 to 2023).
  It is the fourth edition: the visual puzzles and the sequencing part of the
  digit span exist only in it. No other edition of the scale is recorded in
  this table.

  Coding: the raw score is the number of boxes filled on 276 of 277 visits,
  errors not taken off. Symbol search: the raw score is the correct answers
  minus the errors on 273 of 274. The z-scores are the scaled score minus
  10, over 3, on every visit.

  The index is one function of the sum of the two scaled scores on every visit.
  The clinician copies it into the medical evaluation (wais4_ivt_index, schema
  wais4_indices): the two agree on 185 of the 207 visits that hold both. The
  index of this form is therefore named wais4_ivt_index_np. The second set (_a)
  is the index of the abbreviated form (thesaurus), equal to the first on few
  visits.

  Same instrument as in FACE SZ and DR, in other columns; the index has
  another name here, and the second set is specific to ASP.

defaults: {type: item}

