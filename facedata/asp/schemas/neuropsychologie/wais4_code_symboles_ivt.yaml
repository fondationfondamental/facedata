  wais4_code_raw: {column: wais_cod_brut, range: [0, 135], label: "WAIS-IV coding, raw score"}
  wais4_code_scaled: {column: wais_cod_std, range: [1, 19], label: "WAIS-IV coding, scaled score"}
  wais4_code_z: {column: wais_cod_cr, type: number, range: [-3, 3], winsor: false, label: "WAIS-IV coding, z-score of the scaled score"}
  wais4_symbol_correct: {column: wais_symb_tot, range: [0, 60], label: "WAIS-IV symbol search, correct answers"}
  wais4_symbol_errors: {column: wais_symb_err, range: [0, 60], label: "WAIS-IV symbol search, errors"}
  wais4_symbol_raw: {column: wais_symb_brut, range: [0, 60], label: "WAIS-IV symbol search, raw score"}
  wais4_symbol_scaled: {column: wais_symb_std, range: [1, 19], label: "WAIS-IV symbol search, scaled score"}
  wais4_symbol_z: {column: wais_symb_cr, type: number, range: [-3, 3], winsor: false, label: "WAIS-IV symbol search, z-score of the scaled score"}
  wais4_ivt_sum_scaled: {column: ivt_sum_std, range: [2, 38], label: "WAIS-IV processing speed, sum of the two scaled scores"}
  wais4_ivt_index_np: {column: ivt_indice, range: [50, 150], label: "WAIS-IV processing speed index, neuropsychology form"}
