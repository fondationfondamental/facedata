instrument: tobacco
title: "Tobacco"
tab: clinique
section: clinical examination
status: draft
notes: >
  Tobacco status, recorded from 2020: 563 inclusion visits (237 children).
  The codes are those of FACE DR: 1 for a non-smoker (492), 2 for an ex-smoker
  (22), 3 for a current smoker (49). The data agree: the age when the
  patient stopped is filled only with the code 2, and the dose and the starting
  age only with the codes 2 and 3.

  The dose (sudose_cig, 47 visits) is called pack-years in FACE DR. Here its
  median is 11 and 11 values are above 60, which is not possible for patients
  this young: the thesaurus says pack-years, so these values are entry errors
  or another unit (open question O10).

  The clinician's list of comorbidities (evaluation_medicale, substance_use)
  asks the age at the start of smoking as well (utitabag, 68 inclusion
  visits) and delivers it as `smoking_start_age_clinician`: this examination
  keeps `smoking_start_age`, the name that BP, SZ and DR give to the same
  question. The two ages are equal on 12 of the 13 visits that have both.
  SZ's `tobacco_first_age` is the age at the first cigarette, another
  question: the three names stay apart.

  Same instrument as in FACE DR, in other columns.

variables:
  tobacco_status:
    column: suncf
    type: category
    label: Tobacco status
    codes: {"1": non_smoker, "3": current_smoker, "2": ex_smoker}
  pack_years: {column: sudose_cig, type: number, unit: pack-years, range: [0, 200], label: Pack-years}
  smoking_start_age: {column: agedebut_cig, type: item, range: [0, 90], label: Age when the patient started smoking}
  smoking_stop_age: {column: agefin_cig, type: item, range: [0, 90], label: Age when the patient stopped smoking}
