instrument: ecg
title: "Electrocardiogram"
tab: clinique
section: clinical examination
status: draft
notes: >
  QT, RR and corrected QT intervals, recorded from 2024 only: 48 inclusion
  visits. Same instrument as in FACE BP and DR, without the heart rate of the
  ECG and with one more box (ecgcard, yes on 16 of 40 visits: the ECG was sent
  to a cardiologist).

  The intervals are typed in seconds or in milliseconds: the size of the value
  tells which, and a value in milliseconds is converted (unit_inferred). The
  corrected QT is recomputed with Bazett's formula on the typed RR, since
  this extraction has no heart rate of the ECG (BP and DR use the heart
  rate, BP decision D114), and compared with the stored one.

defaults: {type: number, unit: s}

variables:
  qt_interval:
    column: qt
    label: QT interval
    units:
      s: {factor: 1, expect: [0.2, 0.7]}
      cs: {factor: 0.01, expect: [20, 70]}
      ms: {factor: 0.001, expect: [200, 700]}
    range: [0.2, 0.7]
  rr_interval:
    column: rr
    label: RR interval
    units:
      s: {factor: 1, expect: [0.3, 2.0]}
      ms: {factor: 0.001, expect: [300, 2000]}
    range: [0.3, 2.0]
  qtc_stored:
    column: qtc
    label: Corrected QT interval as stored by the EMR
    units:
      s: {factor: 1, expect: [0.2, 0.7]}
      cs: {factor: 0.01, expect: [20, 70]}
      ms: {factor: 0.001, expect: [200, 700]}
    range: [0.2, 0.7]
  ecg_sent_to_cardiologist: {column: ecgcard, type: item, unit: "", range: [0, 1], label: "The ECG was sent to a cardiologist"}

scores:
  qtc_bazett:
    label: "Corrected QT interval (Bazett), from the QT and the heart rate of the ECG, or the RR where there is no rate"
    custom: corrected_qt
    compare: qtc_stored
    compare_tolerance: 0.03
    range: [0.2, 0.7]
    winsor: [0.01, 0.99]
