instrument: pression_arterielle
title: "Blood pressure and pulse"
tab: clinique
section: clinical examination
status: reviewed
notes: >
  One blood pressure and one pulse per visit (819 inclusion visits). The
  thesaurus says that the patient is lying (couché), so the variables have the
  names of the lying measures of FACE BP, SZ and DR.

  7 systolic and 7 diastolic pressures are written in cmHg and are
  converted to mmHg (unit_inferred), as in the other cohorts; 1 systolic
  pressure is out of range.

  No value is winsorised (winsor: false, rule R34 of this review): the cohort
  pools children and adults (509 of the 929 delivered systolic pressures
  are of children), whose normal pressures and pulse differ, so the 1st and
  99th percentiles of the pooled values are not limits of error. The tails
  were clipped before (17 systolic, 15 diastolic pressures and 17 pulses;
  decision D80). The hard ranges accept every age; no check by age is made.

  Years and centres (definition of done, D88; centres lettered as in D77, A
  the children's centre): no variable has a shift of half an interquartile
  range by year or by centre; no step.

defaults: {type: number}

variables:
  systolic_supine:
    label: Systolic blood pressure, lying
    column: c1tasys
    unit: "mmHg"
    units:
      "mmHg": {factor: 1, expect: [50, 260]}
      "cmHg": {factor: 10, expect: [5, 26]}
    range: [50, 260]
    winsor: false
  diastolic_supine:
    label: Diastolic blood pressure, lying
    column: c1tadias
    unit: "mmHg"
    units:
      "mmHg": {factor: 1, expect: [30, 180]}
      "cmHg": {factor: 10, expect: [3, 18]}
    range: [30, 180]
    winsor: false
  heart_rate_supine: {column: c1pouls, label: "Pulse, lying (beats per minute)", unit: bpm, range: [30, 220], winsor: false}
