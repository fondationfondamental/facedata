instrument: anxiety_disorders
title: "Anxiety disorders"
tab: evaluation_medicale
section: comorbidities
status: draft
notes: >
  The clinician's list of psychiatric comorbidities, anxiety part. A first
  question (tranxi, yes on 899 of 1,547 inclusion visits; 9 is read as "not
  known") opens the disorders, each with its age at onset and its remission:
  panic disorder with agoraphobia (panag, 77 yes) and without (pansa, 104),
  agoraphobia without panic (agspa, 79), social phobia (phso, 429), specific
  phobia (phsp, 187, with five kinds), obsessive-compulsive disorder (toc, 146,
  with an insight box and a code), a disorder named soc (187, with two ages),
  generalised anxiety (anxge, 431). Two more were added in 2020: separation
  anxiety (anxsep, 73) and post-traumatic stress (spt, 40).

  The schema was written from the column names and the answers, then checked
  against the thesaurus V2.13, which names these columns (PROGRESS.md D13 and
  D14). A sub-disorder is delivered as 0 where the first question is no.

  The follow-up visits answer the same questions (72 visits).

  An instrument of the ASP cohort only.

variables:
  anxiety_disorder: {column: tranxi, type: item, range: [0, 1], missing: {"9": unknown}, label: "Any anxiety disorder"}
  panic_with_agoraphobia: {column: panag, type: item, range: [0, 1], missing: {"9": unknown}, asked_if: anxiety_disorder, label: "Panic disorder with agoraphobia"}
  panic_with_agoraphobia_onset_age: {column: panagag, type: number, range: [0, 70], winsor: false, label: "Panic disorder with agoraphobia: age at onset"}
  panic_with_agoraphobia_remission: {column: panagrem, type: item, range: [0, 1], missing: {"9": unknown}, label: "Panic disorder with agoraphobia: in remission"}
