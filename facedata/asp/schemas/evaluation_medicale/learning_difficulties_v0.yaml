instrument: learning_difficulties_v0
title: "Reading, spelling, mathematics and writing difficulties, at inclusion"
tab: evaluation_medicale
section: learning
status: reviewed
notes: >
  Four questions of the clinician (form 120, table aut_c1trappr, 'Trouble spécifique des apprentissages avec déficit'; 9 'Non
  connu' is a missing code): a specific learning disorder with impairment in reading (retlec), in written expression (orth) or
  in mathematics (math), and dysgraphia (ecri), each with two radios after a yes: it interfered with school or daily life
  (ending vi) and an assessment or re-education by a professional (ending reed; a speech therapist, except for dysgraphia,
  where the form says 'un professionnel'). The form carries an older, narrower wording in its other language slot (reading
  delay in childhood, 8 to 18 years; spelling and mathematics difficulties 'âge + 8 ans'; writing difficulties 8 to 18 years):
  the current label is the DSM-5 disorder, with no age window. The names come from the thesaurus V2.13 (PROGRESS.md D13 and
  D14).

  The same twelve columns exist without the ending _med in the table autoquestionnaires: exact copies, not loaded
  (ignored.yaml). The two boxes after the disorder stay missing after a no (they are details of a disorder that is absent,
  R1).

  Not joined. The reviewed learning_disorders (neuropsychology tab, trbapp01 to trbapp10, asked before the assessment) holds
  other questions in other columns: reading difficulty here and dyslexia agree on 598 of the 630 visits where both are
  answered (writing and dysorthographia 588 of 640, mathematics and dyscalculia 596 of 637); the stuttering of the
  developmental part and trbapp07 agree on 186 of 196. The questions are close but are not the same, so the names are not
  shared.

  Two forms in the same columns, so two instruments (PROGRESS.md D49). The inclusion form and the yearly form hold the same
  questions and print no period, so a follow-up answer is an update given at that visit (BP decision D84): neither a history
  of the whole life nor strictly the time since the last visit, and not the BP or SZ 'since the last visit' (rule R22 of the
  review): the follow-up instrument is _fu without since_visit and is not joined with those. Within patients the follow-up
  answers do not repeat the inclusion ones. Over the six sections of the comorbidity forms (49 yes/no questions) there are 290
  patient-question pairs with a yes at inclusion and a later answer, and the last later answer is no for 60 of them (21%;
  insomnia 9 of 20, reading disorder 4 of 4, recurrent depressive disorder 2 of 2); the ages at onset are given again in 110
  of 114 pairs, and a count of episodes that is above 0 twice never falls (13 pairs: 8 equal, 5 higher). So the columns are
  two sets, _v0 (the screening and inclusion visits) and _fu (the yearly visits); visit_form says which form a visit used and
  is read from the visit label, as in the other twin schemas of the cohort (suicide_and_self_harm_v0, somatic_history_v0). An
  empty section at a yearly visit means 'no change' when the form has a change question, never 'no disorder' (rule R25 of the
  review).

  At inclusion. 1,576 inclusion visits answer at least one question. Yes: reading 206 of 1,541 valid answers, written
  expression 243 of 1,532, mathematics 180 of 1,523 and dysgraphia 373 of 1,526. The questions are answered on 47% to 49% of
  the inclusions of 2017-2019, 64% in 2021 and 78% to 83% in 2022-2025; among the five centres with 100 inclusions or more the
  share runs from 49% to 92%.

  **Year and centre.** 2 of the 12 variables reach 0.5 or more: the yes of the two re-education details (156
  and 346 answers, three and five centres with 20 values) is 69% of the children and 33% of the adults for
  mathematics, 78% and 62% for dysgraphia (age mix), and 14% to 57% and 48% to 84% by centre (the habit of the
  centre, small groups).

