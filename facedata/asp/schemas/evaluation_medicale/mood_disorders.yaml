  hypomanic_episode_first_age: {column: hmanagep, type: number, range: [0, 70], winsor: false, label: "Hypomanic episode: age at the first episode"}
  hypomanic_episode_first_treatment_age: {column: hmanagtt, type: number, range: [0, 70], winsor: false, label: "Hypomanic episode: age at the first treatment"}
  hypomanic_episode_remission: {column: hmanrema, type: item, range: [0, 1], missing: {"9": unknown}, label: "Hypomanic episode: in remission"}
  mixed_episode: {column: mix, type: item, range: [0, 1], missing: {"9": unknown}, label: "Mixed episode"}
