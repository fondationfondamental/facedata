instrument: mood_disorders
title: "Mood disorders in the life of the patient"
tab: evaluation_medicale
section: comorbidities
status: draft
notes: >
  The clinician's list of psychiatric comorbidities, mood part. For each
  disorder: present or not (9 is read as "not known"), and after a yes the
  number of episodes, the age at the first episode, the age at the first
  treatment and whether the patient is in remission. Answered on about
  1,546 of the 2,318 inclusion visits and on 69 follow-up visits.

  The schema was written from the column names and the answers, then checked
  against the thesaurus V2.13, which names these columns (PROGRESS.md D13 and
  D14). The names say: edm a major depressive episode (yes on 434 inclusion
  visits), man a manic episode (10), hman a hypomanic episode (23), mix a mixed
  episode (5), tdi (147) and tdr (152) the single-episode and the recurrent
  depressive disorder, td (80) the dysthymic disorder (all three named so by
  the thesaurus, PROGRESS.md D13),
  tb a bipolar disorder (12) with two boxes for its type.

  The details are filled only after a yes. A count is delivered as 0 where the
  disorder is absent. A count written "01" is read as 1.

  Follow-up: the same questions are asked again, with a box that says whether
  the section changed. Of the 8 follow-up answers of patients with a
  depressive episode at inclusion, 7 still say yes: the answers are read as
  an update of the same question, in the same columns.

  An instrument of the ASP cohort only.

variables:
  depressive_episode: {column: edm, type: item, range: [0, 1], missing: {"9": unknown}, label: "Major depressive episode"}
  depressive_episode_n_episodes: {column: edmnbep, type: number, range: [0, 99], winsor: false, asked_if: depressive_episode, label: "Major depressive episode: number of episodes"}
  depressive_episode_first_age: {column: edmagep, type: number, range: [0, 70], winsor: false, label: "Major depressive episode: age at the first episode"}
  depressive_episode_first_treatment_age: {column: edmagtt, type: number, range: [0, 70], winsor: false, label: "Major depressive episode: age at the first treatment"}
  depressive_episode_remission: {column: edmrema, type: item, range: [0, 1], missing: {"9": unknown}, label: "Major depressive episode: in remission"}
  manic_episode: {column: man, type: item, range: [0, 1], missing: {"9": unknown}, label: "Manic episode"}
  manic_episode_n_episodes: {column: mannbep, type: number, range: [0, 99], winsor: false, asked_if: manic_episode, label: "Manic episode: number of episodes"}
  manic_episode_first_age: {column: managep, type: number, range: [0, 70], winsor: false, label: "Manic episode: age at the first episode"}
  manic_episode_first_treatment_age: {column: managtt, type: number, range: [0, 70], winsor: false, label: "Manic episode: age at the first treatment"}
  manic_episode_remission: {column: manrema, type: item, range: [0, 1], missing: {"9": unknown}, label: "Manic episode: in remission"}
  hypomanic_episode: {column: hman, type: item, range: [0, 1], missing: {"9": unknown}, label: "Hypomanic episode"}
