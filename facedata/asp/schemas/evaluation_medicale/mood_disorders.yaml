  mixed_episode_remission: {column: mixrema, type: item, range: [0, 1], label: "Mixed episode: in remission"}
  depressive_disorder_single_episode: {column: tdi, type: item, range: [0, 1], missing: {"9": unknown}, label: "Depressive disorder, single episode"}
  depressive_disorder_single_episode_n_episodes: {column: tdinbep, type: number, range: [0, 99], winsor: false, asked_if: depressive_disorder_single_episode, label: "Depressive disorder, single episode: number of episodes, the current one included"}
  depressive_disorder_single_episode_first_age: {column: tdiagep, type: number, range: [0, 70], winsor: false, label: "Depressive disorder, single episode: age at the first episode"}
