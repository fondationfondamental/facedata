instrument: substance_use
title: "Substance use disorders at inclusion (clinician's list)"
tab: evaluation_medicale
section: comorbidities
status: reviewed
notes: >
  The clinician's list of psychiatric comorbidities, substance part (form
  202 at inclusion, form 348 at follow-up). A first question, "trouble
  d'utilisation de substances" (utisubst), opens nine substances: tobacco,
  alcohol, benzodiazepines, cannabis, psychostimulants, cocaine,
  hallucinogens, androgenic steroids (the column utiste: the form says
  "steroides androgenes") and solvents. The form hides all of them after a
  no or a not known (eASPERGER.js:5533-5535). For each substance: a level
  coded 0 no, 1 abuse, 2 dependence or 9 not known, then the age at onset
  (tobacco: the age at the start of smoking) and a status coded 1 past or 2
  current (steroids have no age and no status in the extraction).

  Two forms in the same columns, as for the suicide questions. The inclusion
  form is delivered here, in variables ending in _v0, on the V0 visits only
  (1,538 answers: yes 142, no 1,381, not known 15; the screening visits hold
  none). The follow-up form (348) is read by variables that are not
  delivered (substance_disorder_fu and the _fu twins, keep: false): 70
  follow-up answers, 69 no and one yes, whose substance cells (9 levels, 4
  ages or statuses) are the only filled ones; they are not delivered
  because 70 answers do not make an instrument, and the coverage check
  counts them as read. The change box of form 348 (RESCHANG, filled on 212
  follow-up visits) heads the whole axis I section and is delivered with it,
  not here. There is no _fu schema.

  The substances are 0 after a no. After a no to the opening question the
  nine substance boxes, ages and statuses are empty in the extraction (0 of
  the 1,381 inclusion no answers hold one), because the form hides them:
  each substance has a second variable, `<substance>_disorder_v0`, that
  reads the same column once more (separator, codes 0 no, 1 and 2 yes, so
  that abuse and dependence are one yes) and is 0 after a no
  (`asked_if: substance_disorder_v0`; 1,381 cells per substance, 12,429 in
  all; a not known stays missing, the ages and statuses stay missing after a
  no). Where a substance has the same name as in BP (alcohol, cannabis,
  cocaine, stimulant, hallucinogen) the question is the same as BP's
  abuse or dependence. The benzodiazepines are narrower than BP's
  sedatives, hypnotics and anxiolytics and the solvents are one of the
  substances of BP's "other substance": they keep names of their own, as the
  tobacco (a schema of its own in BP and SZ, not a disorder) and the
  steroids. ASP has no question on opiates. The three-level answers are
  delivered too (`<substance>_use_disorder_v0`: no, abuse, dependence).

  The age is the age at onset of the disorder. The form says "age de debut
  de l'alcoolisme", "age de debut du tabagisme" and "age de debut"; the
  dictionary says the same. The alcohol median is 18.5 (42 answers),
  as the SZ onset of the use disorder (18, 281 answers) and not the SZ age at
  the first use (15, 465): the variables are named `_onset_age_v0` as in BP
  and SZ (they were `_first_age`). The cells at inclusion: tobacco 68,
  alcohol 42, cannabis 40, cocaine 7, stimulants 6, hallucinogens 2,
  benzodiazepines 9 (and one at a follow-up visit), solvents 2; the largest
  age is 46. The tobacco age of this form is `smoking_start_age_clinician`:
  the tobacco examination of the clinical tab (tobacco.yaml) asks the same
  thing as `smoking_start_age`; the two are equal on 12 of the 13 visits
  that have both, and the name of the examination is kept. SZ's
  tobacco_first_age is the age at the first cigarette, another question: the
  names must not meet. The status (past or current) is another question than
  BP's "in the past month" (`_last_month_v0`): it keeps its name.

  The ages and the statuses are details of a substance, and stay missing
  after a no (R1): 174 of the 176 ages sit under an abuse or a dependence
  (one under a not known, one under an empty level) and 89 of the 263 abuse
  or dependence answers have no age; 225 of the 240 statuses sit under an
  abuse or a dependence (8 under a no, 4 under a not known, 3 under an empty
  level) and 38 of those 263 have none. Nothing is blanked.

  Almost all the answers are those of adults (128 of 137 for tobacco).
  Tobacco: 0 on 38 inclusion visits (39 with the follow-up one), abuse on 12,
  dependence on 86. The utiste columns for the age and the status
  (utisteag, utistest) are empty on every row (ignored.yaml). Of the 142 yes
  answers to the opening question, 140 have at least one substance answered.

  The schema was written from the column names and the answers, then checked
  against the thesaurus V2.13, which names these columns (PROGRESS.md D13 and
  D14) and against forms 202 and 348.

  An instrument of the ASP cohort only; its names follow BP's substance_v0
  where the question is the same.

  **Year and centre.** No variable reaches 0.5, but the screen is not defined for a yes under 25%, so the
  rates were read directly: the opening question is yes for 1% of the children and 18% of the adults (age
  mix), 0% to 39% by centre (eight centres) and 0% to 26% by year (14 years); alcohol 0% to 16% by centre,
  cannabis 0% to 18%, tobacco 0% to 29%. The list is answered on 91% of the inclusions of 2013, 64% to 80% in
  2018 to 2022 and 43% to 63% in 2023 to 2026 (M71).

version:
  name: visit_form
  column: visit
  codes:
    screening: inclusion
    V0: inclusion
    V1_an: follow_up
    V2_ans: follow_up
    V3_ans: follow_up
    V4_ans: follow_up
    V5_ans: follow_up
    V6_ans: follow_up
    V7_ans: follow_up
    V9_ans: follow_up

defaults: {versions: [inclusion]}

