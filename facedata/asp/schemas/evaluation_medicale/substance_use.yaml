  tobacco_disorder_v0: {column: utitab, type: item, range: [0, 1], separator: ",", codes: {"0": 0, "1": 1, "2": 1}, missing: {"9": unknown}, asked_if: substance_disorder_v0, label: "Tobacco: abuse or dependence (yes or no), at inclusion"}
  tobacco_use_disorder_v0: {column: utitab, type: category, codes: {"0": "no", "1": abuse, "2": dependence}, missing: {"9": unknown}, label: "Tobacco: no, abuse or dependence, at inclusion"}
  smoking_start_age_clinician: {column: utitabag, type: number, unit: years, range: [0, 90], winsor: false, label: "Tobacco: age at the start of smoking, as the clinician records it, at inclusion"}
  tobacco_use_status_v0: {column: utitabst, type: category, codes: {"1": past, "2": current}, label: "Tobacco: the abuse or dependence is past or current, at inclusion"}

