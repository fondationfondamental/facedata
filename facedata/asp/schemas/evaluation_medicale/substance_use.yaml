instrument: substance_use
title: "Substance use"
tab: evaluation_medicale
section: comorbidities
status: draft
notes: >
  The clinician's list of psychiatric comorbidities, substance part. A first
  question (utisubst, yes on 142 of 1,538 inclusion visits; 9 is read as "not
  known") opens nine substances: tobacco, alcohol, benzodiazepines, cannabis,
  stimulants, cocaine, hallucinogens, a substance named utiste and solvents.
  For each: a level of use coded 0, 1 or 2 (tobacco: 0 on 38 visits, 1 on 12, 2
  on 86), the age at the first use and a status coded 1 or 2. The two lists are
  those of the thesaurus: no, abuse, dependence; past, current.

  The schema was written from the column names and the answers, then checked
  against the thesaurus V2.13, which names these columns (PROGRESS.md D13 and
  D14).

  Almost all the answers are those of adults (128 of 137 for tobacco). The
  utiste columns for the age and the status are empty on every row
  (ignored.yaml).

  An instrument of the ASP cohort only.

variables:
  substance_use: {column: utisubst, type: item, range: [0, 1], missing: {"9": unknown}, label: "Use of a substance"}
  tobacco_use_disorder: {column: utitab, type: category, codes: {"0": "no", "1": abuse, "2": dependence}, missing: {"9": unknown}, label: "Tobacco: abuse or dependence"}
  tobacco_first_age: {column: utitabag, type: number, range: [0, 70], winsor: false, label: "Tobacco: age at the first use"}
  tobacco_use_status: {column: utitabst, type: category, codes: {"1": past, "2": current}, label: "Tobacco: the abuse or dependence is past or current"}
