instrument: psychotic_symptoms
title: "Psychotic symptoms and schizophrenia"
tab: evaluation_medicale
section: comorbidities
status: draft
notes: >
  The clinician's list of psychiatric comorbidities, psychotic part. A first
  question (symppsyh, yes on 76 of 1,528 inclusion visits; 9 is read as "not
  known") opens four groups of boxes: delusions (idel and four kinds),
  hallucinations (hal and five senses), disorganisation (diss, "dissociation"
  in the French sense, and three boxes) and deficit symptoms (def and three
  boxes), then the onset (acute, progressive) and the course (chronic,
  intermittent, episodic) of the symptoms. A second question (tskizo, yes on 6
  visits) is a schizophrenia spectrum disorder, with five boxes, ages, a number
  of episodes and a remission that are filled for fewer than five patients.

  The schema was written from the column names and the answers, then checked
  against the thesaurus V2.13, which names these columns (PROGRESS.md D13 and
  D14).

  The follow-up visits answer the same questions (67 visits).

  An instrument of the ASP cohort only.

variables:
  psychotic_symptoms: {column: symppsyh, type: item, range: [0, 1], missing: {"9": unknown}, label: "Psychotic symptoms"}
  delusions: {column: idel, type: item, range: [0, 1], missing: {"9": unknown}, label: "Delusions"}
  delusions_intuitive: {column: idelintu, type: item, range: [0, 1], label: "Delusions: intuitive mechanism"}
  delusions_hallucinatory: {column: idelhal, type: item, range: [0, 1], label: "Delusions: hallucinatory mechanism"}
  delusions_interpretative: {column: idelinte, type: item, range: [0, 1], label: "Delusions: interpretative mechanism"}
  delusions_imaginative: {column: idelimag, type: item, range: [0, 1], label: "Delusions: imaginative mechanism"}
  hallucinations: {column: hal, type: item, range: [0, 1], missing: {"9": unknown}, label: "Hallucinations"}
  hallucinations_auditory: {column: halaud, type: item, range: [0, 1], label: "Hallucinations: auditory"}
  hallucinations_cenesthetic: {column: halcene, type: item, range: [0, 1], label: "Hallucinations: cenesthetic"}
  hallucinations_visual: {column: halvisu, type: item, range: [0, 1], label: "Hallucinations: visual"}
  hallucinations_olfactory: {column: halolf, type: item, range: [0, 1], label: "Hallucinations: olfactory"}
  hallucinations_gustatory: {column: halgust, type: item, range: [0, 1], label: "Hallucinations: gustatory"}
  disorganisation: {column: diss, type: item, range: [0, 1], missing: {"9": unknown}, label: "Disorganisation"}
  disorganisation_thought_blocking: {column: dissbarr, type: item, range: [0, 1], label: "Disorganisation: thought blocking"}
  disorganisation_diffluence: {column: dissdiff, type: item, range: [0, 1], label: "Disorganisation: diffluent speech"}
  disorganisation_morbid_rationalism: {column: dissrati, type: item, range: [0, 1], label: "Disorganisation: morbid rationalism"}
  deficit_symptoms: {column: def, type: item, range: [0, 1], missing: {"9": unknown}, label: "Deficit symptoms"}
  deficit_blunted_affect: {column: defemaff, type: item, range: [0, 1], label: "Deficit symptoms: blunted affect"}
  deficit_poverty_of_speech: {column: defpauvd, type: item, range: [0, 1], label: "Deficit symptoms: poverty of speech"}
  deficit_athymhormia: {column: defathy, type: item, range: [0, 1], label: "Deficit symptoms: athymhormia (loss of drive)"}
  psychotic_onset: {column: psyhdeb, type: category, codes: {"1": acute, "2": progressive}, missing: {"9": unknown}, label: "Onset of the psychotic symptoms"}
  psychotic_course: {column: psyhevo, type: category, codes: {"1": chronic, "2": intermittent, "3": episodic}, label: "Course of the psychotic symptoms"}
  schizophrenia_spectrum: {column: tskizo, type: item, range: [0, 1], missing: {"9": unknown}, label: "Schizophrenia spectrum disorder"}
  schizophrenia_paranoid: {column: tskizo1, type: item, range: [0, 1], label: "Schizophrenia spectrum disorder: paranoid type"}
  schizophrenia_disorganised: {column: tskizo2, type: item, range: [0, 1], label: "Schizophrenia spectrum disorder: disorganised type"}
  schizophrenia_catatonic: {column: tskizo3, type: item, range: [0, 1], label: "Schizophrenia spectrum disorder: catatonic type"}
  schizophrenia_undifferentiated: {column: tskizo4, type: item, range: [0, 1], label: "Schizophrenia spectrum disorder: undifferentiated type"}
  schizophrenia_residual: {column: tskizo5, type: item, range: [0, 1], label: "Schizophrenia spectrum disorder: residual type"}
  schizophrenia_first_episode_age: {column: ageprepi, type: number, range: [0, 70], winsor: false, label: "Schizophrenia spectrum disorder: age at the first episode"}
  schizophrenia_n_episodes: {column: nbepi, type: number, range: [0, 99], winsor: false, asked_if: schizophrenia_spectrum, label: "Schizophrenia spectrum disorder: number of episodes"}
  schizophrenia_first_treatment_age: {column: ageprtt, type: number, range: [0, 70], winsor: false, label: "Schizophrenia spectrum disorder: age at the first treatment"}
  schizophrenia_remission: {column: psyhrem, type: item, range: [0, 1], missing: {"9": unknown}, label: "Schizophrenia spectrum disorder: in remission"}
