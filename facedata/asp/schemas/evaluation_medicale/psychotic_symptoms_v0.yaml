  delusions_v0: {column: idel, type: item, range: [0, 1], missing: {"9": unknown}, asked_if: psychotic_symptoms_v0, label: "Delusions, at inclusion"}
  delusions_intuitive_v0: {column: idelintu, type: item, range: [0, 1], label: "Delusions: intuitive mechanism, at inclusion"}
  delusions_hallucinatory_v0: {column: idelhal, type: item, range: [0, 1], label: "Delusions: hallucinatory mechanism, at inclusion"}
  delusions_interpretative_v0: {column: idelinte, type: item, range: [0, 1], label: "Delusions: interpretative mechanism, at inclusion"}
  delusions_imaginative_v0: {column: idelimag, type: item, range: [0, 1], label: "Delusions: imaginative mechanism, at inclusion"}
  hallucinations_v0: {column: hal, type: item, range: [0, 1], missing: {"9": unknown}, asked_if: psychotic_symptoms_v0, label: "Hallucinations, at inclusion"}
  hallucinations_auditory_v0: {column: halaud, type: item, range: [0, 1], label: "Hallucinations: auditory, at inclusion"}
  hallucinations_cenesthetic_v0: {column: halcene, type: item, range: [0, 1], label: "Hallucinations: cenesthetic, at inclusion"}
  hallucinations_visual_v0: {column: halvisu, type: item, range: [0, 1], label: "Hallucinations: visual, at inclusion"}
  hallucinations_olfactory_v0: {column: halolf, type: item, range: [0, 1], label: "Hallucinations: olfactory, at inclusion"}
  hallucinations_gustatory_v0: {column: halgust, type: item, range: [0, 1], label: "Hallucinations: gustatory, at inclusion"}
  disorganisation_v0: {column: diss, type: item, range: [0, 1], missing: {"9": unknown}, asked_if: psychotic_symptoms_v0, label: "Disorganisation, at inclusion"}
  disorganisation_thought_blocking_v0: {column: dissbarr, type: item, range: [0, 1], label: "Disorganisation: thought blocking, at inclusion"}
  disorganisation_diffluence_v0: {column: dissdiff, type: item, range: [0, 1], label: "Disorganisation: diffluent speech, at inclusion"}
  disorganisation_morbid_rationalism_v0: {column: dissrati, type: item, range: [0, 1], label: "Disorganisation: morbid rationalism, at inclusion"}
  deficit_symptoms_v0: {column: def, type: item, range: [0, 1], missing: {"9": unknown}, asked_if: psychotic_symptoms_v0, label: "Deficit symptoms, at inclusion"}
  deficit_blunted_affect_v0: {column: defemaff, type: item, range: [0, 1], label: "Deficit symptoms: blunted affect, at inclusion"}
