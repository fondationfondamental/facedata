instrument: psychotic_symptoms_v0
title: "Psychotic symptoms and schizophrenia in the life of the patient, at inclusion"
tab: evaluation_medicale
section: comorbidities
status: reviewed
notes: >
  The psychotic part of the clinician's list of psychiatric comorbidities (the same table and forms as mood_disorders: form
  202 at inclusion, form 348 at the yearly visits; 9 'Non connu' is a missing code). A first question (symppsyh, psychotic
  symptoms) opens four groups, each a yes/no with boxes: delusions (idel, four mechanisms: intuitive, hallucinatory,
  interpretative, imaginative), hallucinations (hal, five senses), disorganisation (diss, 'dissociation' in the French sense,
  three mechanisms: thought blocking, diffluence, morbid rationalism) and deficit symptoms (def: blunted affect, poverty of
  speech, athymhormia), then the onset (acute, progressive) and the course (chronic, intermittent, episodic) of the symptoms.
  A second question (tskizo) is a schizophrenia spectrum disorder, with five type boxes, an age at the first episode, a number
  of episodes, an age at the first treatment and a remission, filled for fewer than five patients; the duration of the longest
  episode (durepilg, months) is in the form and the export, but its column is empty on all 4,500 rows (ignored.yaml). The
  names come from the thesaurus V2.13 (PROGRESS.md D13 and D14).

  Gates. The yes/no of the four groups (delusions, hallucinations, disorganisation, deficit symptoms) hangs on the first
  question (symppsyh) and is 0 after a no (asked_if; 1,502 visits with a no, 6,008 cells that were missing: 1,438 at inclusion
  and 64 at the yearly visits, four questions each; the extraction leaves them empty and no cell is filled under a no). The
  mechanisms and senses under a group, the type boxes and the remission stay missing after a no: they are details of a symptom
  that is absent (R1). The rule is one level deep: 9 mechanism cells are filled while their group question is empty (all 0,
  none positive; the four group questions are empty on 7, 5, 10 and 11 visits with the first question yes), and none is filled
  under a no.

  Not joined with SZ. The SZ list of symptoms (lifetime_symptoms, ever and last month, many more items) asks other questions
  in another window: symptom_hallucination_bodily_* is the cenesthetic hallucinations here, symptom_alogia_* the poverty of
  speech and symptom_avolition_* the athymhormia, with other wording; no variable is shared.

  Two forms in the same columns, so two instruments (PROGRESS.md D49). The inclusion form and the yearly form hold the same
  questions and print no period, so a follow-up answer is an update given at that visit (BP decision D84): neither a history
  of the whole life nor strictly the time since the last visit, and not the BP or SZ 'since the last visit' (rule R22 of the
  review): the follow-up instrument is _fu without since_visit and is not joined with those. Within patients the follow-up
  answers do not repeat the inclusion ones. Over the six sections of the comorbidity forms (49 yes/no questions) there are 290
  patient-question pairs with a yes at inclusion and a later answer, and the last later answer is no for 60 of them (21%;
  insomnia 9 of 20, reading disorder 4 of 4, recurrent depressive disorder 2 of 2); the ages at onset are given again in 110
  of 114 pairs, and a count of episodes that is above 0 twice never falls (13 pairs: 8 equal, 5 higher). So the columns are
  two sets, _v0 (the screening and inclusion visits) and _fu (the yearly visits); visit_form says which form a visit used and
  is read from the visit label, as in the other twin schemas of the cohort (suicide_and_self_harm_v0, somatic_history_v0). An
  empty section at a yearly visit means 'no change' when the form has a change question, never 'no disorder' (rule R25 of the
  review).

  At inclusion. 1,534 inclusion visits answer at least one question: psychotic symptoms yes on 76 of 1,514 answers; delusions
  44, hallucinations 42, disorganisation 14 and deficit symptoms 15 yes among 1,506, 1,506, 1,500 and 1,500 valid answers (now
  with the zeros after a no); schizophrenia spectrum yes on 6 of 1,507. The list is answered on 83% to 85% of the inclusions
  to 2015 and 44% to 57% of those of 2023 and 2024, as the other parts of the form.

  **Year and centre.** No variable reaches 0.5, but the screen is not defined for a yes under 25% (the
  interquartile range is 0): the yes of the gate (5%, 76 of 1,514) was read directly: 4% to 12% by centre
  among adults (seven centres with 20 answers) and 3% to 14% by year (the 14% is 37 answers in 2015), no step.

