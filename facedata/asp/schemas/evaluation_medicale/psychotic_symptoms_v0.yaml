  psychotic_onset_v0: {column: psyhdeb, type: category, codes: {"1": acute, "2": progressive}, missing: {"9": unknown}, label: "Onset of the psychotic symptoms, at inclusion"}
  psychotic_course_v0: {column: psyhevo, type: category, codes: {"1": chronic, "2": intermittent, "3": episodic}, label: "Course of the psychotic symptoms, at inclusion"}
  schizophrenia_spectrum_v0: {column: tskizo, type: item, range: [0, 1], missing: {"9": unknown}, label: "Schizophrenia spectrum disorder, at inclusion"}
  schizophrenia_paranoid_v0: {column: tskizo1, type: item, range: [0, 1], label: "Schizophrenia spectrum disorder: paranoid type, at inclusion"}
  schizophrenia_disorganised_v0: {column: tskizo2, type: item, range: [0, 1], label: "Schizophrenia spectrum disorder: disorganised type, at inclusion"}
  schizophrenia_catatonic_v0: {column: tskizo3, type: item, range: [0, 1], label: "Schizophrenia spectrum disorder: catatonic type, at inclusion"}
