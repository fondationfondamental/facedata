instrument: developmental_disorders
title: "ADHD, behaviour, elimination, eating, tic and communication disorders"
tab: evaluation_medicale
section: comorbidities
status: draft
notes: >
  The clinician's list of psychiatric comorbidities, developmental part, on
  about 1,529 inclusion visits (9 is read as "not known"): attention deficit
  hyperactivity disorder (tbath, yes on 475 visits, with the age at onset,
  three presentation boxes, the remission and two treatment boxes),
  oppositional defiant disorder (tbopp, 68), conduct disorder (tcond, 13),
  elimination disorders (tcsfinc, 132: encopresis and enuresis with their type
  boxes), eating disorders (tcali, 141: anorexia and bulimia), chronic tics
  (ticchr, 94: motor, vocal, Tourette). Two blocks were added in 2019: a
  developmental coordination disorder (tac, 141 yes of 822) and four
  communication disorders (trbco01 to trbco04: language disorder, speech sound
  disorder, stuttering, social communication disorder; 95, 24, 12 and 208 yes),
  each with the age at the first symptoms and a box "in remission". The ages
  were first read as lists of codes; the thesaurus corrected it (PROGRESS.md
  D14).

  The schema was written from the column names and the answers, then checked
  against the thesaurus V2.13, which names these columns (PROGRESS.md D13 and
  D14). A sub-disorder is delivered as 0 where its first question is no.

  otrchang is the box "changed since the last visit" of the whole list of
  comorbidities; the old forms also fill it at inclusion (until 2020).

  Follow-up: of the 36 follow-up answers of patients with ADHD at inclusion,
  32 still say yes.

  An instrument of the ASP cohort only.

