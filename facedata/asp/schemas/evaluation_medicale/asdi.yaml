instrument: asdi
title: "Asperger Syndrome Diagnostic Interview (ASDI)"
tab: evaluation_medicale
section: diagnosis
status: draft
notes: >
  Twenty items named asdi1 to asdi20, each rated 0, 1 or 2 (9 is read as "not
  known"), with a box before them (asdinf) and one after (asdicrit), on 407
  inclusion visits from 2011 to 2025, three in four of them adults.

  Identified from its name and its twenty items as the Asperger Syndrome
  Diagnostic Interview (Gillberg and others, 2001), whose twenty items are
  grouped in six areas. The thesaurus confirms the instrument. Its answers are
  not in order: 1 is yes, 2 is "a little" and 0 is no. The data agree (the
  criteria are met on 35% of the answers 0, 61% of the answers 2 and 67% of the
  answers 1), so the items are delivered as words (no, a_little, yes), not as
  numbers. No total is stored and none is computed. asdicrit is yes on 252
  visits: the diagnostic criteria of Asperger syndrome are met according to the
  ASDI. asdinf (yes on 149 visits, from 2018) says that the ASDI was done.

  An instrument of the ASP cohort only.

