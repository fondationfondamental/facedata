instrument: learning_difficulties
title: "Reading, spelling, mathematics and writing difficulties"
tab: evaluation_medicale
section: learning
status: draft
notes: >
  Four questions of the clinician on about 1,628 inclusion visits (9 is read as
  "not known"): a specific learning disorder with impairment in reading
  (retlec, yes on 206 visits), in written expression (orth, 243) or in
  mathematics (math, 180), and dysgraphia (ecri, 373), each with two boxes
  after a yes: it interfered with school or daily life (ending vi), and an
  assessment or re-education by a professional (ending reed).

  The schema was written from the column names and the answers, then checked
  against the thesaurus V2.13, which names these columns (PROGRESS.md D13 and
  D14).

  The same twelve columns exist without the ending _med in the table
  autoquestionnaires: exact copies, not loaded (ignored.yaml).

  An instrument of the ASP cohort only.

variables:
  reading_disorder: {column: retlec_med, type: item, range: [0, 1], missing: {"9": unknown}, label: "Specific learning disorder with impairment in reading"}
  reading_disorder_interfered: {column: retlecvi_med, type: item, range: [0, 1], missing: {"9": unknown}, label: "Specific learning disorder with impairment in reading: it interfered with school or daily life"}
  reading_disorder_reeducation: {column: retreed_med, type: item, range: [0, 1], missing: {"9": unknown}, label: "Specific learning disorder with impairment in reading: assessed or re-educated by a speech therapist"}
  written_expression_disorder: {column: orth_med, type: item, range: [0, 1], missing: {"9": unknown}, label: "Specific learning disorder with impairment in written expression"}
  written_expression_disorder_interfered: {column: orthvi_med, type: item, range: [0, 1], missing: {"9": unknown}, label: "Specific learning disorder with impairment in written expression: it interfered with school or daily life"}
  written_expression_disorder_reeducation: {column: orthreed_med, type: item, range: [0, 1], missing: {"9": unknown}, label: "Specific learning disorder with impairment in written expression: assessed or re-educated by a speech therapist"}
  mathematics_disorder: {column: math_med, type: item, range: [0, 1], missing: {"9": unknown}, label: "Specific learning disorder with impairment in mathematics"}
  mathematics_disorder_interfered: {column: mathvi_med, type: item, range: [0, 1], missing: {"9": unknown}, label: "Specific learning disorder with impairment in mathematics: it interfered with school or daily life"}
  mathematics_disorder_reeducation: {column: mathreed_med, type: item, range: [0, 1], missing: {"9": unknown}, label: "Specific learning disorder with impairment in mathematics: assessed or re-educated by a speech therapist"}
  dysgraphia: {column: ecri_med, type: item, range: [0, 1], missing: {"9": unknown}, label: "Dysgraphia"}
  dysgraphia_interfered: {column: ecrivi_med, type: item, range: [0, 1], missing: {"9": unknown}, label: "Dysgraphia: it interfered with school or daily life"}
  dysgraphia_reeducation: {column: ecrireed_med, type: item, range: [0, 1], missing: {"9": unknown}, label: "Dysgraphia: assessed or re-educated by a professional"}
