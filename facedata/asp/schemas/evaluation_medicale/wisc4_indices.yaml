instrument: wisc4_indices
title: "WISC-IV: the four indices and the full-scale IQ"
tab: evaluation_medicale
section: intellectual assessment
status: draft
notes: >
  The indices of the Wechsler Intelligence Scale for Children, fourth edition: verbal comprehension, perceptual reasoning, working memory, processing speed and the full-scale IQ, as the clinician copied them into the medical
  evaluation. A box says that this edition was used (wis4: yes on 155 of
  1,208 inclusion visits); the indices are filled only after a yes. The first
  index is on 151 inclusion visits (115 children, 36 adults), from 2013
  to 2025; the full-scale IQ on 67: it is not computed when the
  indices differ too much.

  One schema per edition: an index of one edition is never delivered in the
  column of another. The indices need the norm tables of the test, which are
  not available: they are delivered as stored, between 40 and 160.

  The schema was written from the column names and the answers, then checked
  against the thesaurus V2.13, which names these columns (PROGRESS.md D13 and
  D14).

  An instrument of the ASP cohort only.

variables:
  wisc4_done: {column: wis4, type: item, range: [0, 1], label: "This edition was used (WISC-IV)"}
  wisc4_icv_index: {column: wis4cv, type: number, range: [40, 160], winsor: false, label: "WISC-IV, verbal comprehension index"}
  wisc4_irp_index: {column: wis4irp, type: number, range: [40, 160], winsor: false, label: "WISC-IV, perceptual reasoning index"}
  wisc4_imt_index: {column: wis4mt, type: number, range: [40, 160], winsor: false, label: "WISC-IV, working memory index"}
  wisc4_ivt_index: {column: wis4vt, type: number, range: [40, 160], winsor: false, label: "WISC-IV, processing speed index"}
  wisc4_qit: {column: wis4qt, type: number, range: [40, 160], winsor: false, label: "WISC-IV, full-scale iq"}
