instrument: dsm_criteria
title: "DSM criteria of the autism spectrum diagnosis"
tab: evaluation_medicale
section: diagnosis
status: draft
notes: >
  Ten yes/no boxes named cridsm17 to cridsm26, filled by the clinician at the
  inclusion visit, on about 1,956 of the 2,318 inclusions in every year
  (and on 19 follow-up visits).

  The schema was written from the column names and the answers, then checked
  against the thesaurus V2.13, which names these columns (PROGRESS.md D13 and
  D14). The count fits the DSM-5 criteria of autism spectrum disorder: three
  criteria of social communication, four of restricted and repetitive
  behaviours, the early onset and the impairment (cridsm17 to cridsm25), then a
  conclusion (cridsm26). cridsm26 is filled on every inclusion and equals the
  column arm for 2,318 of 2,318 patients: it is the diagnosis of the cohort
  (identite). The nine criteria are all yes for 944 patients. 9 is read as "not
  known".

  dsmtype is the interview used for the DSM summary: the DIGS for 427 patients,
  the Kiddie-SADS for 725, and a code 3 that the thesaurus does not document
  for 98 (O16). It is filled on 82% to 94% of the inclusions until 2017 and on
  34% to 59% since. reschang is the box "changed since the last visit" of this
  section; the old forms also fill it at inclusion (63% to 96% of the
  inclusions until 2019, none since 2022).

  Eleven more boxes, dsmaut01 to dsmaut11, exist from 2018 on (1,204
  inclusions): the five specifiers of the DSM-5 (intellectual impairment,
  language impairment, a known medical or genetic condition, another disorder,
  catatonia) and the support needed in each of the two domains. The thesaurus
  numbers the three levels backwards ("level 1: very substantial support"); the
  boxes it calls "level 3: support" are the most ticked (594 and 606 visits,
  against 127 and 115), so the variables are named from the wording, not from
  the number (O16).

  An instrument of the ASP cohort only.

variables:
  dsm_criterion_a1: {column: cridsm17, type: item, range: [0, 1], missing: {"9": unknown}, label: "DSM-5 criterion A1: deficits in social and emotional reciprocity"}
  dsm_criterion_a2: {column: cridsm18, type: item, range: [0, 1], missing: {"9": unknown}, label: "DSM-5 criterion A2: deficits in the non-verbal behaviours used for social interaction"}
  dsm_criterion_a3: {column: cridsm19, type: item, range: [0, 1], missing: {"9": unknown}, label: "DSM-5 criterion A3: deficits in developing and maintaining relationships"}
  dsm_criterion_b1: {column: cridsm20, type: item, range: [0, 1], missing: {"9": unknown}, label: "DSM-5 criterion B1: stereotyped or repetitive speech, movements or use of objects"}
  dsm_criterion_b2: {column: cridsm21, type: item, range: [0, 1], missing: {"9": unknown}, label: "DSM-5 criterion B2: excessive adherence to routines and ritualised behaviour"}
  dsm_criterion_b3: {column: cridsm22, type: item, range: [0, 1], missing: {"9": unknown}, label: "DSM-5 criterion B3: highly restricted, fixated interests"}
  dsm_criterion_b4: {column: cridsm23, type: item, range: [0, 1], missing: {"9": unknown}, label: "DSM-5 criterion B4: hyper- or hypo-reactivity to sensory input"}
  dsm_criterion_c: {column: cridsm24, type: item, range: [0, 1], missing: {"9": unknown}, label: "DSM-5 criterion C: symptoms present in early childhood"}
  dsm_criterion_d: {column: cridsm25, type: item, range: [0, 1], missing: {"9": unknown}, label: "DSM-5 criterion D: symptoms limit and impair everyday functioning"}
  dsm_asd_conclusion: {column: cridsm26, type: item, range: [0, 1], label: "Conclusion of the criteria (equals the diagnosis of the cohort)"}
  dsm_interview: {column: dsmtype, type: category, codes: {"1": digs, "2": kiddie_sads, "3": code_3}, label: "Interview used for the DSM summary (the code 3 is not documented)"}
  dsm_section_changed: {column: reschang, type: item, range: [0, 1], label: "This section changed since the last visit (also filled at inclusion in the old forms)"}
  specifier_intellectual_impairment: {column: dsmaut01, type: item, range: [0, 1], label: "DSM-5 specifier: with intellectual impairment"}
  specifier_language_impairment: {column: dsmaut02, type: item, range: [0, 1], label: "DSM-5 specifier: with language impairment"}
  specifier_medical_or_genetic_condition: {column: dsmaut03, type: item, range: [0, 1], label: "DSM-5 specifier: associated with a known medical or genetic condition or environmental factor"}
  specifier_other_disorder: {column: dsmaut04, type: item, range: [0, 1], label: "DSM-5 specifier: associated with another neurodevelopmental, mental or behavioural disorder"}
  specifier_catatonia: {column: dsmaut05, type: item, range: [0, 1], label: "DSM-5 specifier: with catatonia"}
  severity_social_very_substantial: {column: dsmaut06, type: item, range: [0, 1], label: "Social communication: requiring very substantial support (written 'level 1' in the thesaurus)"}
  severity_social_substantial: {column: dsmaut07, type: item, range: [0, 1], label: "Social communication: requiring substantial support (written 'level 2' in the thesaurus)"}
  severity_social_support: {column: dsmaut08, type: item, range: [0, 1], label: "Social communication: requiring support (written 'level 3' in the thesaurus)"}
  severity_behaviour_very_substantial: {column: dsmaut09, type: item, range: [0, 1], label: "Restricted, repetitive behaviours: requiring very substantial support (written 'level 1' in the thesaurus)"}
  severity_behaviour_substantial: {column: dsmaut10, type: item, range: [0, 1], label: "Restricted, repetitive behaviours: requiring substantial support (written 'level 2' in the thesaurus)"}
  severity_behaviour_support: {column: dsmaut11, type: item, range: [0, 1], label: "Restricted, repetitive behaviours: requiring support (written 'level 3' in the thesaurus)"}
