instrument: communication_context
title: "Questions before the communication checklist"
tab: autoquestionnaires_old_part1
section: old questionnaires
status: draft
notes: >
  Twelve questions asked with the communication checklists of the old forms:
  230 inclusion visits (50 of children) and 79 follow-up visits, from 2013 to
  2020. The first five are asked about adults (age at the end of the studies,
  work, language), the others about children (hearing, speech in sentences, the
  relation of the person who answers and the time spent with the child). Their
  wording is that of the thesaurus V2.13.

  An instrument of the ASP cohort only.

variables:
  arretud: {column: arretud, type: number, label: "CC-A (adult communication checklist): age at the end of the studies, years", range: [0, 200], winsor: false}
  travail: {column: travail, type: text, label: "Work, free text"}
  lang: {column: lang, type: item, label: "CC-A (adult communication checklist): French is the main language at home (0 no, 1 yes)", range: [0, 1]}
  autlang: {column: autlang, type: text, label: "Other language, free text"}
  orthopho: {column: orthopho, type: item, label: "CC-A (adult communication checklist): ever saw a speech therapist for language problems (0 no, 1 yes)", range: [0, 1]}
  surd: {column: surd, type: item, label: "CCC-2 (child communication checklist): the child has a hearing impairment (0 no, 1 yes)", range: [0, 1]}
  surdc: {column: surdc, type: text, label: "Hearing impairment, comment, free text"}
  phras: {column: phras, type: item, label: "CCC-2 (child communication checklist): the child can put words into sentences (0 no, 1 yes)", range: [0, 1]}
  phrasc: {column: phrasc, type: text, label: "Speaks in sentences, comment, free text"}
  relenf: {column: relenf, type: text, label: "Relation to the child of the person who answers, free text"}
  temps: {column: temps, type: number, label: "CCC-2 (child communication checklist): time the respondent has been in contact with the child, months", range: [0, 457], winsor: false}
  comm: {column: comm, type: text, label: "Comment on the checklist, free text"}
