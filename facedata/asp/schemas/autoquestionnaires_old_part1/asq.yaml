instrument: asq
title: "Attachment Style Questionnaire (ASQ)"
tab: autoquestionnaires_old_part1
section: old questionnaires, rare
status: reviewed
notes: >
  40 columns, all filled on 3 inclusion visits (all of 2013 and of one centre,
  D): a pilot. **Too few visits to verify**: the columns are read with their
  types and ranges and no rule is checked. The labels of the thesaurus name it
  the Attachment Style Questionnaire (items 1 to 6, totally disagree to totally
  agree): it is not an autism questionnaire. Forty items on a six-point scale
  fit the ASQ of Feeney, Noller and Hanrahan (1994), as recalled, not read;
  another ASQ, of Van Oudenhoven, has four dimensions (Firoozabadi 2014).
  Which one the form is was not settled by the literature check of
  2026-11-21; the scale names of the form would settle it.

  These six forms (the BIS, the AIM, the ALS, the anhedonia scale, the ASQ and
  the A-TAC) are filled on the same 5 inclusion visits, all of 2013 and of one
  centre (D), 3 of which hold all six: a pilot, as the question O13 (7) of
  PROGRESS.md suspected.

  **Year and centre.** Too few visits to screen: 3 visits of one centre (D), all of 2013. There is
  no group of 20 values, so the quality-control table holds no year or centre shift.

  An instrument of the ASP cohort only.

