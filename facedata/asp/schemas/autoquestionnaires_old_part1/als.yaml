instrument: als
title: "Affective Lability Scale, 54 items (ALS-54), old form of the autism cohort"
tab: autoquestionnaires_old_part1
section: old questionnaires, rare
status: reviewed
notes: >
  The 54-item Affective Lability Scale (ALS-54) of the old forms: 4 inclusion
  visits, all of 2013 and of one centre (D). A pilot, too few visits to study
  the form; the schema reads what can be checked on them. An instrument of the
  ASP cohort only, with the names of the ALS-54 of BP.

  Items. `als54_01` to `als54_54` (the columns `als_1` to `als_54`), from 0
  (not at all characteristic) to 3 (very characteristic), as asked. The 4
  visits hold the 54 items (BP holds 18 of the 54). No item is reversed.

  Scores. The application (`229_score.js`) computes the six sub-scores as the
  mean of their items, each only when all its items are answered, and the
  total as the mean of the 54 items. Every item belongs to one sub-score:
  depression 11 items (1, 8, 9, 13, 19, 25, 31, 40, 42, 46, 54), elation 12
  (2, 6, 7, 18, 27, 32, 35, 36, 45, 47, 52, 53), anxiety-depression 8 (3, 10,
  16, 17, 22, 37, 38, 49), anxiety 7 (4, 5, 12, 20, 26, 28, 44), anger 7 (14,
  15, 21, 23, 33, 41, 50) and bipolar 9 (11, 24, 29, 30, 34, 39, 43, 48, 51).
  The stored scores (`alsdep`, `alselat`, `alsanxdep`, `alsanx`, `alsanger`,
  `alsscorbp`, `als_score`, read as the hidden checks `als54_*_stored`) are
  equal to the application's on 4 of 4 visits for elation, anxiety-depression,
  anxiety, anger, bipolar and the total, to the 3 decimals that the export
  writes (tolerance 0.0006). The stored depression is not: the score step of
  the data managers' pipeline averages 10 items, not 11, and leaves out item 1
  (the data managers confirmed it, M25 of EXPORT_REQUESTS.md). The depression
  that is delivered is the application's, with the 11 items, and the stored
  one is the check: 4 `score_mismatch` on 4 visits, which are the known
  error of the export (R27 of the review).

  Bridge to the ALS-18: the four scores of the ALS-18, from the 18 items that
  both forms have, as in BP (als54.yaml): anxiety-depression (items 5, 12, 16,
  17, 20), depression-elation (8, 25, 34, 36, 42, 43, 45, 46), anger (14, 21,
  23, 33, 41) and the total of the 18 items (means, 0 to 3). The cohort has no
  ALS-18 visit, so there is no stored value to check them against.

  **Year and centre.** Too few visits to screen: 4 visits of one centre (D), all of 2013. There is
  no group of 20 values, so the quality-control table holds no year or centre shift.

defaults: {type: item, range: [0, 3]}

