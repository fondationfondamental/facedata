instrument: repetitive_behaviours
title: "Repetitive behaviours (section of the old forms)"
tab: autoquestionnaires_old_part1
section: old questionnaires
status: draft
notes: >
  A section of the old forms on repetitive behaviours: for each kind of
  behaviour, whether it is present (0 or 1), a description in free text, its
  frequency and its severity; then the main compulsion with its frequency,
  severity and age of onset. 182 inclusion visits (44 of children) and 47 follow-up visits, from 2013 to 2020.

  The thesaurus calls the section "cognition and repetitive acts": the
  sensations that come before repetitive behaviours ('just right' feelings,
  tension, incompleteness, physical sensations, physical anxiety), each with
  its presence, the behaviours it comes before, its frequency (0 never to 4)
  and its severity (0 none to 4 extreme). A detail is filled only where the
  behaviour is present.

  An instrument of the ASP cohort only.

