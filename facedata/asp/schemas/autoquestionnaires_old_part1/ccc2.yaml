instrument: ccc2
title: "Children's Communication Checklist, second edition (CCC-2)"
tab: autoquestionnaires_old_part1
section: old questionnaires
status: reviewed
notes: >
  Seventy items answered from 0 to 3 by a parent (how often the child shows the
  behaviour: 0 less than once a week or never, 1 about once a week, 2 once or
  twice a day, 3 several times a day or continually), ten scale scores (raw,
  scaled and percentile) and two composites. 123 visits hold the form: 51
  inclusion visits and 72 follow-up visits, 111 of them of children, from 2013
  to 2021. The scores are stored on 106 of them (43 inclusion visits and 63
  follow-up visits, all of children, from 2013 to 2016). It belongs to the old
  set of forms.

  Identified from its seventy items, its ten scales of seven items and its two
  composites as the CCC-2 (Bishop, 2003), sure.

  **Two forms in the same seventy item columns, found in the data.** The form of
  a visit is read from what only one form has (`version`, the first match wins).
  A scale score of the children's checklist, or one of the four questions that
  the children's form asks before it (hearing, sentences, relation to the child,
  time in contact: `communication_context`), makes a CCC-2 visit: 123 visits. A
  composite of the adult checklist, or one of the three questions that the adult
  form asks (age at the end of the studies, work, speech therapist), makes a
  CC-A visit (cca.yaml): 237 visits. The language at home (`lang`) is asked in
  both forms and tells nothing. 2 visits hold items and none of these: their
  form cannot be told and they are not delivered (version_unknown). Before the
  review only the scores gave the form: 106 CCC-2 and 235 CC-A visits, and 21
  visits with items and no score were left out; 17 of them are now CCC-2 visits
  and 2 CC-A visits.

  The 17 CCC-2 visits added hold items and no score. They are patients aged 17.1
  to 24.5 years (5 of them under 18) who were given the children's form, and the
  script of the application computes the scores only below the age of 17
  (`214_score.js`, line 30). Their raw scores are computed here (16 visits; the
  17th lacks an item), with no stored value to check them against.

  The ten raw scores, each checked against its items (five items, and two items
  of the last twenty reversed; the visits where the stored score is the sum).
  Counts on the 106 visits that hold the stored scores:

  - speech: items 2, 24, 29, 38 and 44, and 51 and 58 reversed: 105 of 106 visits.
  - syntax: items 1, 17, 27, 36 and 43, and 55 and 69 reversed: 103 of 106 visits.
  - semantics: items 4, 6, 12, 32 and 46, and 64 and 66 reversed: 96 of 106 visits.
  - coherence: items 10, 25, 40, 48 and 50, and 53 and 68 reversed: 105 of 106 visits.
  - inappropriate initiation: items 5, 21, 35, 37 and 45, and 59 and 70 reversed: 97 of 105 visits.
  - stereotyped language: items 11, 18, 23, 30 and 42, and 61 and 62 reversed: 105 of 106 visits.
  - use of context: items 15, 19, 28, 34 and 41, and 54 and 60 reversed: 99 of 106 visits.
  - nonverbal communication: items 8, 14, 20, 31 and 39, and 56 and 65 reversed: 101 of 106 visits.
  - social relations: items 3, 7, 13, 16 and 33, and 57 and 67 reversed: 101 of 105 visits.
  - interests: items 9, 22, 26, 47 and 49, and 52 and 63 reversed: 102 of 106 visits.

  The scaled scores and the percentiles are not read in a norm table: the script
  of the application computes them from the raw score and the age in months with
  a formula of the logarithm of the age (`214_score.js`, lines 150 to 270). The
  formulas are not reproduced here and the scaled scores and percentiles are
  delivered as stored. The General Communication Composite is the sum of the
  first eight scaled scores (106 of 106 visits).

  The Social Interaction Deviance Composite is computed by the script (line 268)
  as the scaled scores of inappropriate initiation, nonverbal communication,
  social relations and interests, minus those of speech, syntax, semantics and
  coherence. The export holds the composite on 43 of the 106 visits, always 0 or
  more: none of the negative values is stored. The field of the application is
  two characters wide (`COMM_SIDCS char(2)`, easperger.sql, line 3377, and a box
  with a maximum length of 2), which cannot hold a value of -10 or lower; why
  the values from -9 to -1 are lost too is not established. `ccc_sidc` is
  computed here from the stored scaled scores, on the 106 visits: 63 values are
  added (all negative: 23 of -10 or lower and 40 from -9 to -1), 3 are 0 and 40
  are positive (range -32 to 15), and the 43 stored values are all equal to it.
  A negative value means that the four scales of the first group (initiation,
  nonverbal communication, social relations, interests) add up to lower scaled
  scores than the four of the second group; the published formula, its sign
  and its cut-off were not settled by the literature check of 2026-11-21 (the
  manual was not read; secondary summaries disagree on the direction of the
  subtraction). The open question O13 of PROGRESS.md about the composite never
  being negative is answered by the lost sign.

  The script tests the scaled score of interests with `!=` and so drops a scaled
  score of 0 from the composite (none is present).

  On 2 visits (2014 and 2015) an item is blank and a raw score is stored (inappropriate initiation
  on one, social relations on the other): it cannot be recomputed and is not delivered
  (`score_not_recomputed`).

  **Year and centre.** 26 of the 103 variables reach 0.5 or more, all by year, none by centre: 119
  of the 123 visits are of one centre (C), so the centres cannot be compared. The years with 20
  values or more are 2013, 2014 and 2015; between them 1 of the 102 variables compared differs
  beyond chance (permutation test, p below 0.01; about 1 expected). The one score that reaches 0.5
  is the scaled interests score (medians 3, 4, 3: one unit of a whole-number scale). The General
  Communication Composite has a median of 29, 37 and 38 (n 24, 43, 31), within chance.

  An instrument of the ASP cohort only.

