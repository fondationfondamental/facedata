  ccc_speech: {label: "CCC-2 speech, raw score (0 to 21)", sum: [ccc02, ccc24, ccc29, ccc38, ccc44, ccc51, ccc58], reverse: [ccc51, ccc58], compare: ccc_speech_stored}
  ccc_syntax: {label: "CCC-2 syntax, raw score (0 to 21)", sum: [ccc01, ccc17, ccc27, ccc36, ccc43, ccc55, ccc69], reverse: [ccc55, ccc69], compare: ccc_syntax_stored}
  ccc_semantics: {label: "CCC-2 semantics, raw score (0 to 21)", sum: [ccc04, ccc06, ccc12, ccc32, ccc46, ccc64, ccc66], reverse: [ccc64, ccc66], compare: ccc_semantics_stored}
  ccc_coherence: {label: "CCC-2 coherence, raw score (0 to 21)", sum: [ccc10, ccc25, ccc40, ccc48, ccc50, ccc53, ccc68], reverse: [ccc53, ccc68], compare: ccc_coherence_stored}
  ccc_inappropriate_initiation: {label: "CCC-2 inappropriate initiation, raw score (0 to 21)", sum: [ccc05, ccc21, ccc35, ccc37, ccc45, ccc59, ccc70], reverse: [ccc59, ccc70], compare: ccc_inappropriate_initiation_stored}
  ccc_stereotyped_language: {label: "CCC-2 stereotyped language, raw score (0 to 21)", sum: [ccc11, ccc18, ccc23, ccc30, ccc42, ccc61, ccc62], reverse: [ccc61, ccc62], compare: ccc_stereotyped_language_stored}
  ccc_use_of_context: {label: "CCC-2 use of context, raw score (0 to 21)", sum: [ccc15, ccc19, ccc28, ccc34, ccc41, ccc54, ccc60], reverse: [ccc54, ccc60], compare: ccc_use_of_context_stored}
  ccc_nonverbal_communication: {label: "CCC-2 nonverbal communication, raw score (0 to 21)", sum: [ccc08, ccc14, ccc20, ccc31, ccc39, ccc56, ccc65], reverse: [ccc56, ccc65], compare: ccc_nonverbal_communication_stored}
  ccc_social_relations: {label: "CCC-2 social relations, raw score (0 to 21)", sum: [ccc03, ccc07, ccc13, ccc16, ccc33, ccc57, ccc67], reverse: [ccc57, ccc67], compare: ccc_social_relations_stored}
  ccc_interests: {label: "CCC-2 interests, raw score (0 to 21)", sum: [ccc09, ccc22, ccc26, ccc47, ccc49, ccc52, ccc63], reverse: [ccc52, ccc63], compare: ccc_interests_stored}
  ccc_sidc:
    label: "CCC-2 Social Interaction Deviance Composite: scaled scores of initiation, nonverbal communication, social relations and interests minus those of speech, syntax, semantics and coherence"
    sum: [ccc_inappropriate_initiation_scaled, ccc_nonverbal_communication_scaled, ccc_social_relations_scaled, ccc_interests_scaled]
    minus: [ccc_speech_scaled, ccc_syntax_scaled, ccc_semantics_scaled, ccc_coherence_scaled]
    compare: ccc_sidc_stored
