instrument: aq
title: "Autism-Spectrum Quotient (AQ)"
tab: autoquestionnaires_old_part1
section: old questionnaires
status: reviewed
notes: >
  Fifty items and a score, filled by adults at the screening visit: 280
  screening visits (276 with the items, 4 with the score alone), 1 of a child,
  from 2009 to 2022 and 95% of them from 2013 to 2021. It belongs to the old set
  of forms: the RAADS-R replaces it at screening in the new set. A visit after
  the change of set did not ask it: not missing (D3 of PROGRESS.md).

  Identified from its name (qa, quotient autistique), its fifty items and its
  score as the Autism-Spectrum Quotient (Baron-Cohen and others, 2001), sure.
  Not to be confused with `aq12` of BP, a 12-item aggression questionnaire: the
  variable `aq12` of this schema is item 12 of the AQ.

  The answers are stored from 1 (definitely agree) to 4 (definitely disagree),
  and the score is not their sum: an answer on the scored side counts 1 point,
  definitely or slightly. The key was fitted on the data: agreement scores on 24
  items (2, 4, 5, 6, 7, 9, 12, 13, 16, 18, 19, 20, 21, 22, 23, 26, 33, 35, 39,
  41, 42, 43, 45 and 46), disagreement on 26 (1, 3, 8, 10, 11, 14, 15, 17, 24,
  25, 27, 28, 29, 30, 31, 32, 34, 36, 37, 38, 40, 44, 47, 48, 49 and 50). That
  it is the published key is to verify (the published key was not read). It
  reproduces the stored score on 223 of 224 visits that hold every item. The
  score is typed without the items on 4 visits, where it is kept as stored.

  On 21 visits (2009 to 2022) an item is blank (a single item on 12 of them) and a score is
  stored: it cannot be recomputed and is not delivered (`score_not_recomputed`).

  **Year and centre.** 30 of the 51 variables reach 0.5 or more (30 by year, 9 by centre): 50
  items answered 1 to 4 whose median moves by one unit; the score is at 0.25 by year and 0.10 by
  centre. The visits are the screening visits of adults of two centres (D 160, E 116). The score
  has a median of 34 to 37.5 in each of the years with 20 values or more (2015 to 2020) and of 36
  and 35 in the two centres. Only 1 of the 51 variables differs between years and 2 between
  centres beyond chance (permutation test, p below 0.01; about 0.5 expected): no step.

  An instrument of the ASP cohort only.

