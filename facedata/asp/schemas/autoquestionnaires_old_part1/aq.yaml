instrument: aq
title: "Autism-Spectrum Quotient (AQ)"
tab: autoquestionnaires_old_part1
section: old questionnaires
status: draft
notes: >
  Fifty items and a score, filled by adults at the screening visit: 276 screening visits, 0 inclusion visits (0 of children) and 0 follow-up visits,
  from 2012 to 2021. It belongs to the old set of forms: the RAADS-R replaces it at screening in the new set.

  Identified from its name (qa, quotient autistique), its fifty items and its
  score as the Autism-Spectrum Quotient (Baron-Cohen and others, 2001), sure.

  The answers are stored from 1 (definitely agree) to 4 (definitely disagree),
  and the score is not their sum: an answer on the scored side counts 1 point, definitely or slightly. The key was fitted on the data and is
  the published one: agreement scores on 24 items (2, 4, 5, 6, 7, 9, 12, 13, 16, 18, 19, 20, 21, 22, 23, 26, 33, 35, 39, 41, 42, 43, 45 and 46),
  disagreement on 26 (1, 3, 8, 10, 11, 14, 15, 17, 24, 25, 27, 28, 29, 30, 31, 32, 34, 36, 37, 38, 40, 44, 47, 48, 49 and 50). It
  reproduces the stored score on 223 of 224 visits that hold every item. The score is typed without the items on fewer than five visits, where it is kept as stored.

  An instrument of the ASP cohort only.

defaults: {type: item, range: [1, 4]}

