  bis1019: {column: bis10_19, label: "BIS-10 item 19 (1 rarely or never to 4 almost always)"}
  bis1020: {column: bis10_20, label: "BIS-10 item 20 (1 rarely or never to 4 almost always)"}
  bis1021: {column: bis10_21, label: "BIS-10 item 21 (1 rarely or never to 4 almost always)"}
  bis1022: {column: bis10_22, label: "BIS-10 item 22 (1 rarely or never to 4 almost always)"}
  bis1023: {column: bis10_23, label: "BIS-10 item 23 (1 rarely or never to 4 almost always)"}
  bis1024: {column: bis10_24, label: "BIS-10 item 24 (1 rarely or never to 4 almost always)"}
  bis1025: {column: bis10_25, label: "BIS-10 item 25 (1 rarely or never to 4 almost always)"}
  bis1026: {column: bis10_26, label: "BIS-10 item 26 (1 rarely or never to 4 almost always)"}
  bis1027: {column: bis10_27, label: "BIS-10 item 27 (1 rarely or never to 4 almost always)"}
