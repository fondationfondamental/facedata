  # Scores as the application stores them: checks of our own sums.
  bis10_motor_app: {column: bis_smi, type: number, range: [11, 44], winsor: false, keep: false, label: "Motor impulsiveness as the application stores it"}
  bis10_attention_app: {column: bis_ai, type: number, range: [8, 32], winsor: false, keep: false, label: "Attentional impulsiveness as the application stores it"}
  bis10_planning_app: {column: bis_npi, type: number, range: [11, 44], winsor: false, keep: false, label: "Planning difficulty as the application stores it"}

  # Scores as the export stores them (6 - value for the reversed items, higher than ours).
  bis10_motor_stored: {column: bis10_imp_mot, type: number, range: [12, 45], winsor: false, keep: false, label: "Motor impulsiveness as the export stores it"}
  bis10_attention_stored: {column: bis10_imp_att, type: number, range: [10, 34], winsor: false, keep: false, label: "Attentional impulsiveness as the export stores it"}
  bis10_planning_stored: {column: bis10_diff_plan, type: number, range: [19, 52], winsor: false, keep: false, label: "Planning difficulty as the export stores it"}
  bis10_total_stored: {column: bis10_score_total, type: number, range: [41, 131], winsor: false, keep: false, label: "Total of the three sums as the export stores it"}
  bis10_score11_stored: {column: bis11, type: number, range: [16, 52], winsor: false, keep: false, label: "Sum of 12 items as the export stores it (stored as bis11)"}
  bis10_sum12_stored: {column: bis10, type: number, range: [17, 53], winsor: false, keep: false, label: "Sum of the 12 items that the BIS-12 also has, as the export stores it"}
  bis10_cognitive_stored: {column: bis1038, type: number, range: [1, 4], winsor: false, keep: false, label: "Cognitive impulsivity (mean of 5 items) as stored"}
  bis10_behavioural_stored: {column: bis1039, type: number, range: [1, 4], winsor: false, keep: false, label: "Behavioural impulsivity (mean of 7 items) as stored"}
  bis10_general_stored: {column: bis_score, type: number, range: [1, 4], winsor: false, keep: false, label: "General impulsivity as stored (mean of the cognitive and behavioural scores)"}

scores:
  bis10_motor:
    label: Motor impulsivity (11 items)
    sum: [bis1002, bis1003, bis1004, bis1016, bis1017, bis1020, bis1022, bis1023, bis1024, bis1028, bis1034]
    reverse: [bis1034]
    compare: bis10_motor_app

  bis10_attention:
    label: Attentional impulsivity (8 items)
    sum: [bis1005, bis1006, bis1009, bis1011, bis1021, bis1025, bis1030, bis1032]
    reverse: [bis1009, bis1021]
    compare: bis10_attention_app

  bis10_planning:
    label: Planning difficulty (11 items)
    sum: [bis1001, bis1007, bis1008, bis1010, bis1012, bis1013, bis1014, bis1015, bis1018, bis1031, bis1033]
    reverse: [bis1001, bis1007, bis1008, bis1010, bis1012, bis1013, bis1015, bis1033]
    compare: bis10_planning_app

  bis10_total:
    label: BIS-10 total (motor + attention + planning, 30 items)
    sum: [bis10_motor, bis10_attention, bis10_planning]
    compare: bis10_total_stored
    compare_offset: 11

  # Bridge to the BIS-12: the total of the 12 items that both forms have.
  bis10_sum12:
    label: Total of the 12 items that the BIS-12 also has
    sum: [bis1001, bis1006, bis1008, bis1009, bis1012, bis1014, bis1017, bis1020, bis1021, bis1023, bis1025, bis1028]
    reverse: [bis1001, bis1008, bis1009, bis1012, bis1021]
    compare: bis10_sum12_stored
    compare_offset: 5
