instrument: bis_old_form
title: "Barratt Impulsiveness Scale, BIS-10 (34 items), old form of the autism cohort"
tab: autoquestionnaires_old_part1
section: old questionnaires, rare
status: reviewed
notes: >
  The 34-item Barratt Impulsiveness Scale (BIS-10) of the old forms: 4
  inclusion visits, all of 2013 and of one centre (D). A pilot, too few visits
  to study the form; the schema reads what can be checked on them. An
  instrument of the ASP cohort only, with the names of the BIS-10 of BP and DR.

  Items. `bis1001` to `bis1034` (the columns `bis10_1` to `bis10_34`), from 1
  (rarely or never) to 4 (almost always), as asked. The reversed items, from
  the application, are 1, 7, 8, 9, 10, 12, 13, 15, 21, 33 and 34: the reversal
  is in the scores (`reverse`, 5 - value), as in BP.

  Scores. The 4 visits hold the 34 items. The application stores three sums
  (`bis_smi`, `bis_ai`, `bis_npi`, read as the hidden checks `bis10_motor_app`,
  `bis10_attention_app`, `bis10_planning_app`): they are equal to ours on 4 of
  4 visits. Motor impulsivity has 11 items, attentional impulsivity 8 and
  planning difficulty 11 (the last also counts items 14, 18 and 31, which the
  dictionary formula leaves out, as in BP). The total is the sum of the three
  (30 items); items 19, 26, 27 and 29 belong to none of them. `bis_score`, the
  column that the thesaurus calls the score of the scale, is not that total:
  it is the mean of the cognitive and of the behavioural scores of the export
  (`bis1038`, 5 items, and `bis1039`, 7 items: the general score, request R83;
  both are equal to the 5 - value rule on 4 of 4 visits, where BP's are 1
  higher). It is read and not delivered.

  What the export adds, read and not delivered (`keep: false`). Its score
  step writes on the same visits the sums with 6 - value, as in BP:
  `bis10_imp_mot`, `bis10_imp_att`, `bis10_diff_plan` and `bis10_score_total`
  are higher than ours by 1, 2, 8 and 11 (one point per reversed item) on 4 of
  4 visits; `bis10`, the sum of the 12 items that the BIS-12 also has, is 5
  higher; `bis11`, the sum of 12 other items, is 4 higher. The total and the
  12-item sum are compared with the offset of BP (`compare_offset`).

  Bridge to the BIS-12: `bis10_sum12`, the total of the 12 items that both
  forms have, as in BP (bis10.yaml). The cohort has no BIS-12 visit.

  **Year and centre.** Too few visits to screen: 4 visits of one centre (D), all of 2013. There is
  no group of 20 values, so the quality-control table holds no year or centre shift.

defaults: {type: item, range: [1, 4]}

