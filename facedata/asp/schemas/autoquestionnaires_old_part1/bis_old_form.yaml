  bis1006: {column: bis10_6, label: "BIS-10 item 6 (1 rarely or never to 4 almost always)"}
  bis1007: {column: bis10_7, label: "BIS-10 item 7 (1 rarely or never to 4 almost always)"}
  bis1008: {column: bis10_8, label: "BIS-10 item 8 (1 rarely or never to 4 almost always)"}
  bis1009: {column: bis10_9, label: "BIS-10 item 9 (1 rarely or never to 4 almost always)"}
