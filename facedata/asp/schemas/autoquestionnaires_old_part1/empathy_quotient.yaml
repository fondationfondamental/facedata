instrument: empathy_quotient
title: "Empathy Quotient (EQ)"
tab: autoquestionnaires_old_part1
section: old questionnaires
status: reviewed
notes: >
  Sixty items and a score, filled by adults: 257 screening visits, 224 inclusion
  visits (66 of children) and 1 follow-up visit, from 2009 to 2022. It belongs
  to the old set of forms. A visit after the change of set did not ask it: not
  missing (D3 of PROGRESS.md).

  Identified from its name, its sixty items and its score as the Empathy
  Quotient (Baron-Cohen and Wheelwright, 2004), sure.

  The answers are stored from 1 (definitely agree) to 4 (definitely disagree),
  and the score is not their sum: an answer on the scored side counts 2 points
  when it is definite and 1 when it is slight. The key was fitted on the data:
  agreement scores on 21 items (1, 6, 19, 22, 25, 26, 35, 36, 37, 38, 41, 42,
  43, 44, 52, 54, 55, 57, 58, 59 and 60), disagreement on 19 (4, 8, 10, 11, 12,
  14, 15, 18, 21, 27, 28, 29, 32, 34, 39, 46, 48, 49 and 50), and 20 items are
  not scored (2, 3, 5, 7, 9, 13, 16, 17, 20, 23, 24, 30, 31, 33, 40, 45, 47, 51,
  53 and 56). That it is the published key is to verify (the published item list
  was not read). It reproduces the stored score on 345 of 347 visits that hold
  every item and the score. The score is typed without the items on 91 visits,
  where it is kept as stored.

  Item 57. The French form words it as a statement of the opposite of empathy
  ("I do not know how the rules of social situations work") and the script of
  the application (`210_score.js`, line 28) scores agreement as empathic, as the
  key above does. The points it gives correlate negatively with the rest of the
  score (r -0.31), which reads as a translation effect. The published key is
  kept and no value changes; scoring disagreement instead would change the 348
  totals of the visits that hold every item, by -0.75 points on average.

  On 31 visits (2009 to 2022) an item is blank (a single item on 14 of them) and a score is
  stored: it cannot be recomputed and is not delivered (`score_not_recomputed`).

  **Year and centre.** 47 of the 61 variables reach 0.5 or more (47 by year, 14 by centre): 60
  items answered 1 to 4 whose median moves by one unit; the score is at 0.30 by year and 0.27 by
  centre. The score typed without its items (91 visits) is almost all of one centre (B: 84 visits,
  2018 to 2020), so the centre B and the years 2019 and 2020 rest largely on typed totals. On the
  352 visits with at least 55 items and a score the median is 22 in D (186 visits) and 28 in E
  (146); 16 of the 61 variables differ beyond chance between the two (permutation test, p below
  0.01): a habit of the centre. The medians by year are 28.5 (2013), 27, 23, 20 (2016), 23, 24,
  29.5 (2019) and 28 (2020), the dip of 2015 to 2017 being seen in both centres and within chance
  (p 0.08 over all the visits, 0.03 among adults): no step with a cause to give.

  An instrument of the ASP cohort only.

