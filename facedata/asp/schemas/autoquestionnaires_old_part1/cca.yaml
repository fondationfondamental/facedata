instrument: cca
title: "Communication Checklist - Adult (CC-A)"
tab: autoquestionnaires_old_part1
section: old questionnaires
status: draft
notes: >
  Seventy items answered from 0 to 3 by a relative and three composites:
  195 inclusion visits (1 of children) and 40 follow-up visits, from 2013 to 2020. It belongs to the old set of forms.

  Identified from its seventy items and its three composites as the
  Communication Checklist - Adult (Whitehouse and Bishop, 2009), sure.

  **Two forms in the same seventy item columns, found in the data.** 106 visits
  hold the ten scale scores of the Children's Communication Checklist (106 of
  them are children) and 235 hold the three composites of the Communication
  Checklist for adults (234 are adults); none holds both. The two forms are
  two instruments (ccc2 and cca) with their own columns, and
  communication_checklist_form says which one a visit holds. 21 visits hold
  items and no score of either form: their form cannot be told and they are
  not delivered (version_unknown).

  The three composites, each fitted on the data of this form:

  - language structure: 21 items, 3 of the last twenty reversed, equal to the stored score on 220 of 220 visits.
  - pragmatic skills: 22 items, equal to the stored score on 220 of 220 visits.
  - social engagement: 27 items, 17 of the last twenty reversed, equal to the stored score on 220 of 220 visits.

  An instrument of the ASP cohort only.

