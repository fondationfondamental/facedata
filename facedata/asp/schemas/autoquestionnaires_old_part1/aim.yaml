instrument: aim
title: "Affect Intensity Measure, 40 items (AIM-40), old form of the autism cohort"
tab: autoquestionnaires_old_part1
section: old questionnaires, rare
status: reviewed
notes: >
  The 40-item Affect Intensity Measure (AIM-40) of the old forms: 4 inclusion
  visits, all of 2013 and of one centre (D). A pilot, too few visits to study
  the form; the schema reads what can be checked on them. An instrument of the
  ASP cohort only, with the names of the AIM-40 of BP.

  Items. `aim40_01` to `aim40_40` (the columns `aim_1` to `aim_40`), from 1
  (never) to 6 (always), as asked. The 4 visits hold the 40 items (BP holds 20
  of the 40). Reversed items, from the key of the export (nucleus
  `aim.yaml`): 12, 16, 19, 24, 26, 28, 29, 31, 33, 37 and 40 (7 - value).

  Score. `aim40_score`, the mean of the 40 items (1 to 6) with the 11 reversed
  items. The stored score (`aim_score`, read as the hidden check
  `aim40_score_stored`) is equal to it on 4 of 4 visits, to the 2 decimals
  that the export writes (tolerance 0.006). The script of the application
  (`230_score.js`, line 35) reverses item 36 where the key has item 37: no
  stored value comes from it (the stored score is the export's), and the
  stored score follows the key above.

  Bridge to the AIM-20: `aim40_score20`, the mean of the 20 items that the
  AIM-20 also has, six of them reversed (12, 24, 29, 33, 37 and 40), as in BP
  (aim40.yaml). The cohort has no AIM-20 visit, so there is no stored value to
  check it against.

  **Year and centre.** Too few visits to screen: 4 visits of one centre (D), all of 2013. There is
  no group of 20 values, so the quality-control table holds no year or centre shift.

