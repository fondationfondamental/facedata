instrument: cshq
title: "Children's Sleep Habits Questionnaire (CSHQ)"
tab: autoquestionnaires_old_part1
section: old questionnaires
status: reviewed
notes: >
  Forty-eight items answered from 1 to 3 by a parent about the child, for 44 of
  them whether it is a problem, four usual times and quantities of sleep, eight
  sub-scale scores and a total: 49 inclusion visits (48 of children) and 70
  follow-up visits (62 of children), from 2013 to 2017 (one visit of 2021). It
  belongs to the old set of forms; filled for children.

  Identified from its name and its eight sub-scales as the Children's Sleep
  Habits Questionnaire (Owens and others, 2000), sure. The names of the
  sub-scales are those of the fields of the form (`222.php`: bedtime resistance,
  sleep onset delay, sleep duration, sleep anxiety, night wakings, parasomnia,
  sleep disordered breathing, daytime sleepiness), which confirms the match
  first made by the number of items.

  What the form asks. The questions are about the last week, or a more typical
  week when the last one was unusual. Items 1 to 44 are answered 3 usually (5 to
  7 times a week), 2 sometimes (2 to 4 times) or 1 rarely (0 or 1 time); items
  45 to 48 say how the child was in four situations (playing alone, watching
  television, on a car trip, during a meal): 1 not asleep, 2 very tired, 3
  asleep. The items are delivered as asked and the reversal is in the scores.
  Each of items 1 to 44 has a line 'is it a problem?': 1 yes, 0 no, 9 not
  applicable (NA on the form), which is read as missing.

  The scores, each fitted on the data (the 8 sub-scores and the total as the
  script of the application computes them, `222_score.js`, lines 263 to 276):

  - CSHQ bedtime resistance: the sum of 6 items (1, 3, 4, 7, 10 and 12; reversed: 1 and 3), equal to the stored score on 116 of 116 visits that hold the 6 items and the score.
  - CSHQ sleep onset delay: the sum of 1 item (2; reversed: 2), equal to the stored score on 118 of 118 visits.
  - CSHQ sleep duration: the sum of 3 items (13, 15 and 16; reversed: 15 and 16), equal to the stored score on 117 of 117 visits.
  - CSHQ sleep anxiety: the sum of 4 items (7, 11, 12 and 27), equal to the stored score on 115 of 115 visits.
  - CSHQ night wakings: the sum of 3 items (21, 31 and 32), equal to the stored score on 113 of 113 visits.
  - CSHQ parasomnias: the sum of 7 items (17, 18, 19, 20, 23, 29 and 30), equal to the stored score on 115 of 115 visits.
  - CSHQ sleep disordered breathing: the sum of 3 items (24, 25 and 26), equal to the stored score on 118 of 118 visits.
  - CSHQ daytime sleepiness: the sum of 8 items (34, 36, 37, 38, 39, 44, 46 and 47; reversed: 34), equal to the stored score on 115 of 115 visits.
  - CSHQ total (33 to 99): the sum of 33 items (reversed: 1, 2, 3, 15, 16 and 34), equal to the stored score on 106 of 106 visits.

  The total counts 33 items once: items 7 and 12 belong to two sub-scales
  (bedtime resistance and sleep anxiety) and the script subtracts them from the
  sum of the eight sub-scores. Fifteen items are in no score (5, 6, 8, 9, 14,
  22, 28, 33, 35, 40, 41, 42, 43, 45 and 48).

  The four times and quantities. The time boxes of the form save 00:00:00 when
  they are left untouched: the waking time reads 00:00:00 on 18 of the 119
  visits, which cannot be a waking time, and is read as not recorded (missing).
  The bedtime reads 00:00:00 on 13 visits; midnight is a possible bedtime and an
  untouched box cannot be told from it, so they are kept.

  **Year and centre.** 5 of the 105 variables reach 0.5 or more, all by year, none by centre: the
  119 visits are of one centre (C), children, from 2013 to 2016 (one visit each of 2017 and 2021).
  The 5 are four items and the sleep onset delay sub-scale (a single item answered 1 to 3, medians
  2, 1, 2); the total is at 0.22 (median 43.5, 44, 41 in 2013 to 2015). Between years 2 of the 105
  variables differ beyond chance (permutation test, p below 0.01; about 1 expected).

  An instrument of the ASP cohort only.

defaults: {type: item, range: [1, 3]}

