scores:
  cshq_bedtime_resistance:
    label: "CSHQ bedtime resistance"
    sum: [cshq01, cshq03, cshq04, cshq07, cshq10, cshq12]
    reverse: [cshq01, cshq03]
    compare: cshq_bedtime_resistance_stored
  cshq_sleep_onset_delay:
    label: "CSHQ sleep onset delay"
    sum: [cshq02]
    reverse: [cshq02]
    compare: cshq_sleep_onset_delay_stored
  cshq_sleep_duration:
    label: "CSHQ sleep duration"
    sum: [cshq13, cshq15, cshq16]
    reverse: [cshq15, cshq16]
    compare: cshq_sleep_duration_stored
  cshq_sleep_anxiety:
    label: "CSHQ sleep anxiety"
    sum: [cshq07, cshq11, cshq12, cshq27]
    compare: cshq_sleep_anxiety_stored
  cshq_night_wakings:
    label: "CSHQ night wakings"
    sum: [cshq21, cshq31, cshq32]
    compare: cshq_night_wakings_stored
  cshq_parasomnias:
    label: "CSHQ parasomnias"
    sum: [cshq17, cshq18, cshq19, cshq20, cshq23, cshq29, cshq30]
    compare: cshq_parasomnias_stored
  cshq_disordered_breathing:
    label: "CSHQ sleep disordered breathing"
    sum: [cshq24, cshq25, cshq26]
    compare: cshq_disordered_breathing_stored
  cshq_daytime_sleepiness:
    label: "CSHQ daytime sleepiness"
    sum: [cshq34, cshq36, cshq37, cshq38, cshq39, cshq44, cshq46, cshq47]
    reverse: [cshq34]
    compare: cshq_daytime_sleepiness_stored
  cshq_total:
    label: "CSHQ total (33 to 99)"
    sum: [cshq01, cshq02, cshq03, cshq04, cshq07, cshq10, cshq11, cshq12, cshq13, cshq15, cshq16, cshq17, cshq18, cshq19, cshq20, cshq21, cshq23, cshq24, cshq25, cshq26, cshq27, cshq29, cshq30, cshq31, cshq32, cshq34, cshq36, cshq37, cshq38, cshq39, cshq44, cshq46, cshq47]
    reverse: [cshq01, cshq02, cshq03, cshq15, cshq16, cshq34]
    compare: cshq_total_stored
