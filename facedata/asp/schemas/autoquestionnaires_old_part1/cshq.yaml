instrument: cshq
title: "Children's Sleep Habits Questionnaire (CSHQ)"
tab: autoquestionnaires_old_part1
section: old questionnaires
status: draft
notes: >
  Forty-eight items answered from 1 to 3 by a parent, for most of them whether
  it is a problem, the usual times of sleep, eight sub-scale scores and a
  total: 49 inclusion visits (48 of children) and 70 follow-up visits, from 2013 to 2016. It belongs to the old set of forms; filled for children.

  Identified from its name and its eight sub-scales as the Children's Sleep
  Habits Questionnaire (Owens and others, 2000), sure: the stored scores are
  sums of items, some reversed, and the total counts thirty-three items once.
  The names of the sub-scales follow the publication in the order of the
  columns (bedtime resistance, sleep onset delay, sleep duration, sleep
  anxiety, night wakings, parasomnias, sleep disordered breathing, daytime
  sleepiness), matched by the number of items of each: likely.

  The scores, each fitted on the data:

  - CSHQ bedtime resistance: the sum of 6 items (1, 3, 4, 7, 10 and 12; reversed: 1 and 3), equal to the stored score on 104 of 104 complete visits.
  - CSHQ sleep onset delay: the sum of 1 items (2; reversed: 2), equal to the stored score on 104 of 104 complete visits.
  - CSHQ sleep duration: the sum of 3 items (13, 15 and 16; reversed: 15 and 16), equal to the stored score on 104 of 104 complete visits.
  - CSHQ sleep anxiety: the sum of 4 items (7, 11, 12 and 27), equal to the stored score on 104 of 104 complete visits.
  - CSHQ night wakings: the sum of 3 items (21, 31 and 32), equal to the stored score on 104 of 104 complete visits.
  - CSHQ parasomnias: the sum of 7 items (17, 18, 19, 20, 23, 29 and 30), equal to the stored score on 104 of 104 complete visits.
  - CSHQ sleep disordered breathing: the sum of 3 items (24, 25 and 26), equal to the stored score on 104 of 104 complete visits.
  - CSHQ daytime sleepiness: the sum of 8 items (34, 36, 37, 38, 39, 44, 46 and 47; reversed: 34), equal to the stored score on 104 of 104 complete visits.
  - CSHQ total (33 to 99): the sum of 33 items (reversed: 1, 2, 3, 15, 16 and 34), equal to the stored score on 104 of 104 complete visits.

  The answer 9 of a problem line is read as "not known".

  An instrument of the ASP cohort only.

defaults: {type: item, range: [1, 3]}

