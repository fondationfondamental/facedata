# Instruments that FACE BP also has and whose SZ schema is not the BP schema, each with the reason.
# tests/test_cohorts.py compares the schemas of the same name in the two cohorts
# (defaults, variables, scores, version) and fails on a difference that is not listed here.

# PATIENT
identite: the diagnoses are those of the SZ cohort (schizophrenia, schizoaffective, schizophreniform)
provenance: the same questions under other column names (adresseur_autres, dsstdtc, connaissance_autre), a third association, and no information date
fin_de_suivi: only three columns of the form are extracted, in one generation; the column named for the cause of death holds the date of death

# HETERO-QUESTIONNAIRE
cgi_egf: the SZ columns are named cgi0101 to cgi0103 where BP has cgi01 to cgi03
ymrs: items 5, 8 and 9 are stored as levels (0 to 4) and are delivered in points (twice the level, as published and as in BP); the stored total counts them once and is checked by a twin score

# CONSTANTES et ECG
pression_arterielle: the SZ extraction holds the two lying pressures only, no standing pressure and no heart rate
ecg: the SZ extraction holds the stored QTc only, so nothing is recomputed

# BILAN BIOLOGIQUE
biochimie: four of the sixteen BP analytes, in columns named for the analyte (urate, crp, gluc, hba1c)
bilan_lipidique: the results are in columns named for the analyte; the unit chosen on the form for LDL is not extracted
nfs: seven of the thirteen BP values, in columns named for the analyte; no check of the white-cell differential
bhcg_prolactine: prolactin only, in the column prolctn; no beta-hCG
dosage_psychotropes: the clozapine level only, with the question "treated with clozapine"; no other drug

# AUTO-QUESTIONNAIRE
psqi: the SZ extraction also holds the questions about the bed partner (psqi10, psqi10a to psqi10e)
mars: item 10 is in the column mars010, and the question "takes a medication at present" (mars11) is not extracted

# NEUROPSYCHOLOGIE
neuropsy_conditions: another form; two columns hold other questions than in BP (clinical state compatible, ECT in the last six months), three questions exist in SZ only, and the handedness, the hour and the entry date are not extracted
tmt: the two times are in tmt0101_ and tmt0102_, and "DCM" is a missing code of part B
wais4_matrices: on the WAIS-IV visits the columns of items 25 and 26 are copies of item 24, so the two items are not delivered and the total is the stored one
errands_test: the education level is in the column rad_nsc_, and the box "test not done" is not extracted
verbal_fluency: the six columns of clusters and switches are not extracted
wais3_memoire_chiffres: the summary scores only (no item); the z-scores of the spans are in mcodempz_w and mcoiempz_w
wais4_memoire_chiffres: the summary scores only (no item), and each column holds what its label says, where the BP columns are shifted
cvlt: ten raw scores are in columns named avl01..., the stored z-scores of six measures are read in two columns, and three more missing codes
wais4_similitudes: the items are in the columns simil01_w...; items 10 and 11 are one column copied into the other, so neither is delivered and the total is the stored one
wais3_code_symboles_ivt: the coding subtest only, in columns named sdmt01...
wais4_code_symboles_ivt: coding in columns named sdmt01..., the index in ivt01_wais4...; no symbol search and no confidence interval

# SUICIDE
isf_since_visit: no doubtful period, the share of attempts since the last visit does not rise in 2022 and 2023 as it does in BP
suicide_attempts_since_visit: no doubtful period, as for isf_since_visit

# SUBSTANCES ET COMORBIDITE
anxiety_v0: another form, where each disorder comes after a screening question; no age at onset, and the box of the panic disorder with agoraphobia is lost
anxiety_fu: the SZ follow-up form holds the first question only
eating_disorder_v0: the age at onset is in the column agedebutca
substance_v0: the first question is in rad_tb_subst and the boxes hold Y and N; no type of disorder, no duration, six substances at inclusion
substance_fu: the first question is in rad_tb_subst and the boxes hold Y and N; no type of disorder and no duration
tobacco: five more questions (cigarettes per day, first cigarette, abstinence, family history, craving), and 999 as a missing code of the pack-years

# PERINATALITE, SOIN SUIVI HOSP ARRET TRAVAIL, SOCIAL - PERINATALITE
perinatal: no birth length, head circumference or Apgar score; the weight is in the column poidsna; four questions of 2017 and the events of the pregnancy are added; 999 is a missing code
hospitalisations_v0: other columns and questions (the first hospitalisation, the first episode, ever hospitalised); the past year is in hospitalisations_12m, asked at every visit
recommendations: two more kinds of recommendation, medico-social and somatic
sick_leave_v0: three of the five BP questions, in columns of their own
sick_leave_fu: other columns; the somatic sick leaves of the past 12 months are added; the length may reach 160 weeks; 999 is a missing code
social: the columns that SZ holds; the way of living is in the column vie; children, months in the job and income level are added

# TRAITEMENTS
medications: no stored daily dose to compare with (the package computes it, as in BP); the interval in weeks and the name, ATC code and active principle of the drug list of the EMR are added
non_drug_fu: the columns have no suffix _sem; no number of sessions and no dates; other treatments are asked (cognitive remediation, psychodynamic approach, family therapy and psychoeducation)

# ANTECEDENTS: the SZ history form is shorter (one question 'treated' per disease, no date of onset, no 'controlled') and its sections hold other diseases
neurological_history_v0: the shorter SZ history form
neurological_history_fu: the shorter SZ history form
cardiovascular_history_v0: the shorter SZ history form
cardiovascular_history_fu: the shorter SZ history form
endocrine_history_v0: the shorter SZ history form
endocrine_history_fu: the shorter SZ history form
skin_history_v0: the shorter SZ history form
skin_history_fu: the shorter SZ history form
gynaecological_history_v0: the shorter SZ history form
gynaecological_history_fu: the shorter SZ history form
digestive_history_v0: the shorter SZ history form
digestive_history_fu: the shorter SZ history form
allergic_history_v0: the shorter SZ history form
allergic_history_fu: the shorter SZ history form
other_history_v0: the shorter SZ history form
other_history_fu: the shorter SZ history form
family_structure: no grandparents in the SZ form
family_history: two questions per relative (disorder, suicide) and no grandparents
