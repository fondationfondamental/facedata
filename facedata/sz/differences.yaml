# Instruments that FACE BP also has and whose SZ schema is not the BP schema, each with the reason.
# tests/test_cohorts.py compares the schemas of the same name in the two cohorts
# (defaults, variables, scores, version) and fails on a difference that is not listed here.

# PATIENT
identite: the diagnoses are those of the SZ cohort (schizophrenia, schizoaffective, schizophreniform)
provenance: the same questions under other column names (adresseur_autres, dsstdtc, connaissance_autre), a third association, and no information date
fin_de_suivi: only three columns of the form are extracted, in one generation; the column named for the cause of death holds the date of death

# HETERO-QUESTIONNAIRE
cgi_egf: the SZ columns are named cgi0101 to cgi0103 where BP has cgi01 to cgi03
ymrs: the export maps items 5, 8 and 9 to the levels 0 to 4 where BP, DR and the form give points (a slip of the export, request R135), so these three items are read through codes as points (0, 2, 4, 6, 8, as published and as in BP); the stored total counts the levels once and is checked by a twin score that reads the levels in hidden variables

# CONSTANTES et ECG
pression_arterielle: the SZ extraction holds the two lying pressures only, no standing pressure and no heart rate
ecg: the SZ extraction holds the stored QTc only, so nothing is recomputed

# BILAN BIOLOGIQUE
biochimie: four of the sixteen BP analytes, in columns named for the analyte (urate, crp, gluc, hba1c)
bilan_lipidique: the results are in columns named for the analyte; the unit chosen on the form for LDL is not extracted
nfs: seven of the thirteen BP values, in columns named for the analyte; no check of the white-cell differential
bhcg_prolactine: prolactin only, in the column prolctn; no beta-hCG
dosage_psychotropes: the clozapine level only, with the question "treated with clozapine"; no other drug

# AUTO-QUESTIONNAIRE
psqi: the SZ extraction also holds the questions about the bed partner (psqi10 and psqi10a to psqi10d, and the free text of the other restlessness in the column psqi10e, named psqi10f as in DR and ASP), each shown only when psqi10 is 1 to 3
mars: item 10 is in the column mars010, and the question "takes a medication at present" (mars11) is not extracted
wurs25: the SZ form is the 25-item form only, so there is no version block (BP splits wurs25 and wurs61 by the ALS and BIS answers of the visit), and the stored total is in the column wurstot

# NEUROPSYCHOLOGIE
neuropsy_conditions: another form; two columns hold other questions than in BP (clinical state compatible, ECT in the last six months), three questions exist in SZ only, and the handedness, the hour and the entry date are not extracted
tmt: the two times are in tmt0101_ and tmt0102_, and "DCM" is a missing code of part B
wais4_matrices: on the WAIS-IV visits the columns of items 25 and 26 are copies of item 24, so the two items are not delivered and the total is the stored one; the version block also names the WAIS-IV sequencing columns under override (O16, D138)
wais3_matrices: The version block also names the WAIS-IV sequencing columns under override (O16, D138), which FACE BP does not have
errands_test: the education level is in the column rad_nsc_, and the box "test not done" is not extracted; both cohorts recompute the z-scores and the bands with the same tables, from the raw counts (BP D126 withdrew the typed BP z-scores, which mix two sign conventions; BP D135 replaces the withdrawal with the recomputed values and keeps the typed ones as checks)
verbal_fluency: the six columns of clusters and switches are not extracted
wais3_memoire_chiffres: the summary scores only (no item); the z-scores of the spans are in mcodempz_w and mcoiempz_w; the version block also names the WAIS-IV sequencing columns under override (O16, D138)
wais4_memoire_chiffres: the summary scores only (no item), and each column holds what its label says, where the BP columns are shifted; the version block also names the WAIS-IV sequencing columns under override (O16, D138)
cvlt: ten raw scores are in columns named avl01..., the stored z-scores of six measures are read in two columns, and three more missing codes
wais4_similitudes: the items are in the columns simil01_w...; items 10 and 11 are one column copied into the other (the form has 18 distinct items), so neither is delivered and the total is the stored one, which sums the 18 real items; the version block also names the WAIS-IV sequencing columns under override (O16, D138)
wais3_code_symboles_ivt: the coding subtest only, in columns named sdmt01...; the version block also names the WAIS-IV sequencing columns under override (O16, D138)
wais4_code_symboles_ivt: coding in columns named sdmt01..., the index in ivt01_wais4...; no symbol search and no confidence interval, so wais4_ivt_index is an estimate from the coding alone (the sum is twice the coding scaled score), not the two-subtest index of BP; the version block also names the WAIS-IV sequencing columns under override (O16, D138)

# SUICIDE
isf_since_visit: no doubtful period, the share of attempts since the last visit does not rise in 2022 and 2023 as it does in BP
suicide_attempts_since_visit: no doubtful period, as for isf_since_visit; the variable that read the date of the first attempt at follow-up is not kept (the follow-up table of the application has no such column)

# SUBSTANCES ET COMORBIDITE
anxiety_v0: another form, where each disorder comes after a screening question; the form has no age at onset; the panic disorder is one question, with or without agoraphobia (the type list is not exported); the obsessional disorder, the obsessive-compulsive disorder and the generalised anxiety (a screening question and the disorder) are named for the fields that the export writes in their columns (R114)
anxiety_fu: the SZ extraction holds the first question only; the yearly form asks the list of the disorders, which the export does not read (R115)
eating_disorder_v0: the age at onset is in the column agedebutca, and is filled to 2019 only
substance_v0: the first question is derived by the export from the boxes, not asked; the boxes (Y and N) are the question of the addiction form on a symptom of a use disorder over the whole life; the questions on four substances are hidden by the opening drug question and read as 0 after a no; no type of disorder, no duration, six substances at inclusion
substance_fu: the first question is the clinician's answer, Oui where any box is yes; the boxes (Y and N) come from the clinician's list and, from 2015, from the addiction form; the questions on six substances are hidden by the opening drug question and read as 0 after a no; no type of disorder and no duration
tobacco: five more questions (cigarettes per day in the last 12 months, age at the first cigarette, abstinence, family history, craving), asked of the current and ex-smokers from 2015, and 999 as a missing code of the pack-years

# PERINATALITE, SOIN SUIVI HOSP ARRET TRAVAIL, SOCIAL - PERINATALITE
perinatal: no birth length, head circumference or Apgar score; the weight is in the column poidsna; four questions of 2017 and the events of the pregnancy are added; 999 is a missing code
hospitalisations_v0: other columns and questions (the first hospitalisation, the first episode, ever hospitalised); the block is hidden after the age answer "Pas d'hospitalisations" (a hidden gate lists the other 88 answers) and ever hospitalised is derived by the export from the number; the past year is in hospitalisations_12m, asked at every visit
recommendations: two more kinds of recommendation, medico-social and somatic
sick_leave_v0: three of the five BP questions, in columns of their own
sick_leave_fu: other columns; the somatic sick leaves of the past 12 months are added; the length reaches 200 weeks at most (one more cell holds the code 999); 999 is a missing code
social: the columns that SZ holds; the way of living is in the column vie; children, months in the job and income level are added; the income code 7 is 'no income' on the SZ form and 'other' on the BP form (D37); maristat and saltyp lose answers in the export (O22)

# TRAITEMENTS
medications: no stored daily dose to compare with (the package computes it, as in BP); the interval in weeks and the name, ATC code and active principle of the drug list of the EMR are added
non_drug_fu: the columns have no suffix _sem; the sessions, the dates and the group or individual sets that the SZ form holds are not in the extraction (R125); other treatments are asked (cognitive remediation, psychodynamic approach, family therapy and psychoeducation)

# ANTECEDENTS: the SZ history form is shorter (one question 'treated' per disease, no date of onset, no 'controlled') and its sections hold other diseases
neurological_history_v0: the shorter SZ history form; the export swaps the two migraine columns, so they are read the other way round (R107)
neurological_history_fu: the shorter SZ history form; the export swaps the two migraine columns, so they are read the other way round (R107)
cardiovascular_history_v0: the shorter SZ history form
cardiovascular_history_fu: the shorter SZ history form
endocrine_history_v0: the shorter SZ history form
endocrine_history_fu: the shorter SZ history form
skin_history_v0: the shorter SZ history form
skin_history_fu: the shorter SZ history form
gynaecological_history_v0: the shorter SZ history form
gynaecological_history_fu: the shorter SZ history form
digestive_history_v0: the shorter SZ history form
digestive_history_fu: the shorter SZ history form
allergic_history_v0: the shorter SZ history form; the first question is 'Pathologies allergiques' where BP and DR ask about the allergic and inflammatory diseases, so the gate is named allergic_disease_v0
allergic_history_fu: the shorter SZ history form; the first question is 'Pathologies allergiques' where BP and DR ask about the allergic and inflammatory diseases, so the gate is named allergic_disease_fu
other_history_v0: the shorter SZ history form
other_history_fu: the shorter SZ history form
family_structure: no grandparents in the SZ form
family_history: two questions per relative (disorder, suicide), no grandparents, and no detail block for the daughters and sons
