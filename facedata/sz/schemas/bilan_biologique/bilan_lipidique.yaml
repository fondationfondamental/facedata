instrument: bilan_lipidique
title: Lipids
tab: BILAN BIOLOGIQUE
section: BILAN BIOLOGIQUE
status: draft
notes: >
  The four lipids of FACE BP with the same units and limits, and the ratio
  of total to HDL cholesterol, recomputed from the harmonised values and
  compared with the stored one.

  HDL: 27 results labelled g/L are converted, 6 fit g/L under the label
  mmol/L, 14 are out of range. Total cholesterol: 46 results fit g/L under
  the label mmol/L (11 unit_inferred, 35 unit_doubt). LDL: 17 unit_doubt.

  The stored ratio is not the ratio of the two stored values on 157 visits
  of 3,578 (4%), more and more often since 2019 (17 to 25 a year from
  2022). 48 of them are visits where a value was on another scale, the BP
  case. Others hold another ratio (LDL over HDL on 15 visits, total over
  LDL on 12) or a number off by 1 or more: on part of the visits the ratio
  looks typed by hand. The recomputed ratio is delivered and the 157 get
  score_mismatch.

  Same instrument as in FACE BP. The unit chosen on the form for LDL
  (rad_chol_hll in BP) is not in the SZ extraction.

defaults: {type: number}

variables:
  hdl:
    label: HDL cholesterol
    column: hdl
    unit_column: hdl_lborresu
    unit: mmol/L
    units:
      mmol/L: {factor: 1, expect: [0.4, 4]}
      g/L: {factor: 2.586, expect: [0.15, 1.3]}
    range: [0.2, 4]

  ldl:
    label: LDL cholesterol
    column: ldl
    unit_column: ldl_lborresu
    unit: mmol/L
    units:
      mmol/L: {factor: 1, expect: [0.8, 10]}
      g/L: {factor: 2.586, expect: [0.3, 2.6]}
    range: [0.3, 12]

  cholesterol:
    label: Total cholesterol
    column: chol
    unit_column: chol_lborresu
    unit: mmol/L
    units:
      mmol/L: {factor: 1, expect: [2.6, 15]}
      g/L: {factor: 2.586, expect: [1.0, 3.5]}
    range: [1.5, 15]

  triglycerides:
    label: Triglycerides
    column: trig
    unit_column: trig_lborresu
    unit: mmol/L
    units:
      mmol/L: {factor: 1, expect: [0.1, 40]}
      g/L: {factor: 1.129, expect: [0.1, 40]}
    range: [0.1, 40]

  cholesterol_hdl_ratio_stored: {column: cholhdl, label: Total over HDL cholesterol as stored, range: [0.5, 30], winsor: false, keep: false}

scores:
  cholesterol_hdl_ratio:
    label: Total cholesterol divided by HDL cholesterol, from the harmonised values
    custom: cholesterol_ratio
    compare: cholesterol_hdl_ratio_stored
    compare_tolerance: 0.051
    range: [1, 30]
    winsor: [0.01, 0.99]
