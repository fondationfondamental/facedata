instrument: bilan_lipidique
title: Lipids
tab: BILAN BIOLOGIQUE
section: BILAN BIOLOGIQUE
status: reviewed
notes: >
  The four lipids of FACE BP with the same units and limits, and the ratio
  of total to HDL cholesterol, recomputed from the harmonised values and
  compared with the stored one.

  HDL: 27 results labelled g/L are converted, 6 fit g/L under the label
  mmol/L, 14 are out of range. Total cholesterol: 46 results fit g/L under
  the label mmol/L (11 unit_inferred, 35 unit_doubt). LDL: 17 unit_doubt.

  The stored ratio is the one the EMR computes from the two numbers as
  typed, on key-up, with no unit. It differs from the ratio of the two typed
  numbers on 120 of 3,172 visits (3.8%, against 19 of 12,648 in BP, 0.15%),
  103 of them since 2022; two centres carry 48 and 29 of the 120. It differs
  from the ratio of the two harmonised values on 157 of 3,578 visits (4.4%,
  score_mismatch). 44 of these hold the ratio of numbers typed in two units
  (a value on another scale, the BP case: on 37 the stored value is the
  recomputed one times 2.59 or divided by it). 13 hold LDL over HDL and 9
  total over LDL (16 and 13 before the 44 are taken out). 91 are not
  explained: 78 date from 2022 or later, 46 are in one centre, and the
  stored value is off by more than 1 on 32. The centres should be asked.
  That any of them was typed by hand is not proven. The recomputed ratio is
  delivered and the 157 get score_mismatch.

  LDL is not exported with its unit (export request R27; BP has the choice
  in rad_chol_hll). Typed LDL from 1.0 up to 1.8, where a result in g/L
  would fall, is 7.7% of the 3,530 SZ results, against 8.2% of the 9,575 BP
  results with no choice (6.3% where mmol/L was chosen, 55% where g/L was
  chosen): there is no sign of a large group in g/L, at most about 3% of the
  results (100). The 2 results labelled g/L are converted. LDL is a
  calculated value: it is within 0.15 mmol/L of total - HDL - triglycerides
  / 2.2 on 86.8% of the 3,424 visits with triglycerides under 4.5 mmol/L
  (unwinsorised values).

  The clip at the 1st and 99th percentile turns a clinical tail into the cut
  value, on 66 to 72 results per variable; the hard range is what removes
  impossible values.

  Same instrument as in FACE BP.

  The 14 visits where the ratio cannot be recomputed (score_not_recomputed;
  50 in BP): on 10 both fields are typed but the HDL (8) or the total
  cholesterol (2) was removed as impossible, and 4 have an empty typed field
  beside a stored ratio, the stale ratio that the form keeps.

defaults: {type: number}

variables:
  hdl:
    label: HDL cholesterol
    column: hdl
    unit_column: hdl_lborresu
    unit: mmol/L
    units:
      mmol/L: {factor: 1, expect: [0.4, 4]}
      g/L: {factor: 2.586, expect: [0.15, 1.3]}
    range: [0.2, 4]

  ldl:
    label: LDL cholesterol
    column: ldl
    unit_column: ldl_lborresu
    unit: mmol/L
    units:
      mmol/L: {factor: 1, expect: [0.8, 10]}
      g/L: {factor: 2.586, expect: [0.3, 2.6]}
    range: [0.3, 12]

  cholesterol:
    label: Total cholesterol
    column: chol
    unit_column: chol_lborresu
    unit: mmol/L
    units:
      mmol/L: {factor: 1, expect: [2.6, 15]}
      g/L: {factor: 2.586, expect: [1.0, 3.5]}
    range: [1.5, 15]

  triglycerides:
    label: Triglycerides
    column: trig
    unit_column: trig_lborresu
    unit: mmol/L
    units:
      mmol/L: {factor: 1, expect: [0.1, 40]}
      g/L: {factor: 1.129, expect: [0.1, 40]}
    range: [0.1, 40]

  cholesterol_hdl_ratio_stored: {column: cholhdl, label: Total over HDL cholesterol as stored, range: [0.5, 30], winsor: false, keep: false}

scores:
  cholesterol_hdl_ratio:
    label: Total cholesterol divided by HDL cholesterol, from the harmonised values
    custom: cholesterol_ratio
    compare: cholesterol_hdl_ratio_stored
    compare_tolerance: 0.051
    range: [1, 30]
    winsor: [0.01, 0.99]
