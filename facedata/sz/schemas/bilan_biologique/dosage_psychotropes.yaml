instrument: dosage_psychotropes
title: Clozapine plasma level
tab: BILAN BIOLOGIQUE
section: BILAN BIOLOGIQUE
status: reviewed
notes: >
  The plasma level of clozapine, read like in FACE BP, and the question
  that precedes it on the form, "is the patient treated with clozapine?".

  clozapine_treated has 1,600 answers, 569 of them "yes". A level is given
  on 524 of the "yes" visits and on 68 visits with no answer: 592 levels in
  all, with a median of 424 µg/L (5th to 95th percentile 110 to 1,010), a
  plausible size for clozapine levels in treated patients. 11 levels are in
  mg/L (0.4 for 400 µg/L), 9 are written with "<" (censored_left) and 10 are
  out of range: 3 zeros and 7 under 20 µg/L.

  Six of the 7 results under 20 are from 1 to 20 with no mark, all on "yes"
  visits. Four of them, multiplied by 326.8 (µmol/L to µg/L), give 490 to
  750 µg/L, the size of the other levels; the two others give over 3,000.
  They may be µmol/L, but no unit is recorded and six values do not prove
  it: they are not converted and stay out of range (an open question for the
  centres).

  The clip at the 99th percentile turns a high level into the cut value (6
  results); the hard range, 20 to 3,000 µg/L, is what removes impossible
  values.

  Same instrument as in FACE BP for the level; the BP extraction has other
  drugs and another first question (was the treatment taken before the
  sample).

defaults: {type: number}

variables:
  clozapine_treated:
    column: rad_clozapine
    label: The patient is treated with clozapine
    type: item
    range: [0, 1]
    codes: {Oui: 1, Non: 0}
  clozapine:
    label: Clozapine plasma level
    column: clozapin
    unit: µg/L
    units:
      µg/L: {factor: 1, expect: [20, 3000]}
      mg/L: {factor: 1000, expect: [0.02, 1]}
    range: [20, 3000]
    winsor: [0, 0.99]
