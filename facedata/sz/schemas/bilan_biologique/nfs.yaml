instrument: nfs
title: Blood count
tab: BILAN BIOLOGIQUE
section: BILAN BIOLOGIQUE
status: reviewed
notes: >
  Seven of the thirteen values of the BP blood count, with the same units
  and limits: leukocytes, erythrocytes, haemoglobin, neutrophils,
  eosinophils, mean cell volume and platelets.

  Haemoglobin: 32 results are in g/L under the label g/dL (148 for 14.8), 2
  labelled g/L are converted and 2 labelled mmol/L are read in g/dL by their
  size. Leukocytes (5) and platelets (3) per mm3; 2 platelet counts are
  written in hundreds of G/L (2.5 for 250, as in 2.5 x 10^5 per mm3, BP
  D130) and read with the unit x100 G/L (unit_inferred). Neutrophils: 20
  results typed as a percentage of the leukocytes and 3 per mm3.
  Eosinophils: 37 results could be a percentage (unit_doubt), 2 are read as
  a percentage and 2 per mm3 (unit_inferred). Mean cell volume: 16 results
  ten times too small. 15 results are out of range: 1 leukocytes, 1
  erythrocytes, 4 haemoglobin and 9 mean cell volume.

  The clip at the 1st and 99th percentile turns a clinical tail into the cut
  value, on 36 to 74 results per variable; the hard range is what removes
  impossible values.

  Same instrument as in FACE BP, without the six values that the SZ
  extraction does not hold (haematocrit, basophils, lymphocytes, monocytes,
  MCH, MCHC). The BP check that the five kinds of white cells add up to the
  leukocytes cannot be made with two kinds. The weaker test that neutrophils
  plus eosinophils do not exceed 1.1 times the leukocytes fails on 8 of
  3,630 visits (unwinsorised values).

defaults: {type: number}

variables:
  leukocytes:
    label: Leukocytes
    column: wbc
    unit_column: wbc_lborresu
    unit: G/L
    units:
      G/L: {factor: 1, expect: [0.5, 100], aliases: [Giga/L]}
      "/mm3": {factor: 0.001, expect: [500, 100000], aliases: ["/mm"]}
    range: [0.5, 100]

  erythrocytes:
    label: Erythrocytes
    column: rbc
    unit_column: rbc_lborresu
    unit: T/L
    units:
      T/L: {factor: 1, expect: [1.5, 8], aliases: [Tera/L]}
      G/L: {factor: 0.001, expect: [1500, 8000]}
      "/mm3": {factor: 1e-06, expect: [1500000, 8000000], aliases: ["/mm"]}
    range: [1.5, 8]

  haemoglobin:
    label: Haemoglobin
    column: hgb
    unit_column: hgb_lborresu
    unit: g/dL
    units:
      g/dL: {factor: 1, expect: [5, 25]}
      g/L: {factor: 0.1, expect: [50, 250]}
    range: [5, 25]

  neutrophils:
    label: Neutrophils
    column: neut
    unit_column: neut_lborresu
    unit: G/L
    units:
      G/L: {factor: 1, expect: [0, 25]}
      "/mm3": {factor: 0.001, expect: [100, 25000], aliases: ["/mm"]}
      "%": {percent_of: leukocytes, expect: [0, 100], aliases: [pour]}
    range: [0, 25]

  eosinophils:
    label: Eosinophils
    column: eos
    unit_column: eos_lborresu
    unit: G/L
    units:
      G/L: {factor: 1, expect: [0, 1.5]}
      "/mm3": {factor: 0.001, expect: [10, 5000], aliases: ["/mm"]}
      "%": {percent_of: leukocytes, expect: [0, 10], aliases: [pour]}
    range: [0, 5]

  mcv:
    label: Mean corpuscular volume (VGM)
    column: mcv
    unit_column: mcv_lborresu
    unit: fL
    units:
      fL: {factor: 1, expect: [50, 130], aliases: [microns, u, µ]}
      "10 fL": {factor: 10, expect: [5, 13]}
    range: [50, 130]

  platelets:
    label: Platelets
    column: plat
    unit_column: plat_lborresu
    unit: G/L
    units:
      G/L: {factor: 1, expect: [10, 1500], aliases: [Giga/L]}
      "x100 G/L": {factor: 100, expect: [0.5, 10]}      # 2.47 for 247 G/L, as in 2.47 x 10^5 per mm3 (BP D130)
      "/mm3": {factor: 0.001, expect: [10000, 1500000], aliases: ["/mm"]}
    range: [10, 1500]
