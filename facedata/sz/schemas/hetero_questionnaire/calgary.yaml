instrument: calgary
title: Calgary Depression Scale for Schizophrenia (CDSS)
tab: HETERO-QUESTIONNAIRE
section: Questionnaire CALGARY depression scale for schizophrenia
status: reviewed
notes: >
  Rated by the clinician at every visit: nine items from 0 (absent) to 3
  (severe) over the last two weeks, in a structured interview; item 9 is the
  interviewer's own observation (Addington et al. 1990, 1992, 1993;
  scale_reference.md, section 8). The dictionary does not name the items; the
  labels are those of the published scale and of the form.

  What the columns hold (decision D76, request R136). The form numbers the
  items 1 to 9 (depression, hopelessness, self-depreciation, guilty ideas of
  reference, pathological guilt, morning depression, early wakening, suicide,
  observed depression) and the script of the form adds the nine
  (hetero_calgary.js, lines 20 to 22). The export reads the eight first fields
  right and then goes wrong (eschizo_hetero_calgary.sql, lines 35 to 43):
  CALGAR07 and CALGAR08 are both the early-wakening answer, CALGAR09 is the
  suicide answer, and the observed-depression field is exported nowhere.
  So calgar07 is item 7; calgar08 is a copy of item 7 (equal on 4,672 of
  4,672 rows); calgar09 is item 8, the suicide item; item 9 is in no column.
  The suicide reading of calgar09 is checked on the follow-up visits against
  the questions of the suicide tab: its mean is 0.04 where the patient felt
  that life is not worth living since the last visit is no and 0.49 where it
  is yes (2,337 visits), and 0.16 against 0.58 where an attempt since the last
  visit is no or yes (2,331); early wakening (calgar07) moves much less (0.10
  against 0.20 on the first question). It was delivered until now as
  calgary09, "observed depression": the variable is now named calgary08 and
  labelled for what it holds (R12; same column, same values).

  The stored total (calgar) is the strict sum of the nine exported columns
  (nucleus score definition calgary.yaml), so it is the true total, minus item
  9, plus item 7 again: calgary_sum8 plus calgary07 on all 4,672 visits that
  have one. It is not delivered (ignored.yaml). The published total is the sum
  of the nine items (0 to 27) and the usual rule is "above 6", seven or more
  (the form says "superieur a 6" and the author's table gives 85% sensitivity
  and 82% specificity at 7); the dictionary says "6 or more", which is not the
  published rule.

  What is delivered: the eight items that the extraction holds (calgary01 to
  calgary08) and calgary_sum8, their sum (0 to 24; 0 to 20 observed). It is
  not the CDSS total, and the threshold of 6 does not apply to it: the rule
  "above 6" gives another answer than the stored total on 58 of 4,672 visits
  (694 with this sum, 752 with the stored total). No total is delivered while
  item 9 is missing. When the export is corrected (CALGAR08 from the suicide
  field and CALGAR09 from the observed-depression field), item 9 and the total
  come back with one line each (calgary_total, 0 to 27, compared with the
  stored one).

defaults: {type: item, range: [0, 3]}

variables:
  calgary01: {column: calgar01, label: "CDSS 1: depression"}
  calgary02: {column: calgar02, label: "CDSS 2: hopelessness"}
  calgary03: {column: calgar03, label: "CDSS 3: self-depreciation"}
  calgary04: {column: calgar04, label: "CDSS 4: guilty ideas of reference"}
  calgary05: {column: calgar05, label: "CDSS 5: pathological guilt"}
  calgary06: {column: calgar06, label: "CDSS 6: morning depression"}
  calgary07: {column: calgar07, label: "CDSS 7: early wakening"}
  calgary08: {column: calgar09, label: "CDSS 8: suicide (the column is named calgar09; see the notes)"}

scores:
  calgary_sum8:
    label: Sum of CDSS items 1 to 8 (item 9, observed depression, is not in the extraction; not the CDSS total; 0 to 24)
    sum: [calgary01, calgary02, calgary03, calgary04, calgary05, calgary06, calgary07, calgary08]
    range: [0, 24]
