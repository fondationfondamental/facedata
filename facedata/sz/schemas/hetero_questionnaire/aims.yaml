instrument: aims
title: Abnormal Involuntary Movement Scale (AIMS)
tab: HETERO-QUESTIONNAIRE
section: Questionnaire AIMS
status: reviewed
notes: >
  Rated by the clinician at every visit. Seven items on the movements
  (face, lips, jaw, tongue, upper limbs, lower limbs, trunk), then the
  overall severity, the incapacitation and the patient's awareness, each
  from 0 to 4, and two yes/no items on the teeth. The dictionary gives the
  body parts of items 1 to 9.

  Total. The extraction stores no AIMS score and the application computes
  none. aims_movements is the sum of the seven movement items (0 to 28 by
  construction, 0 to 24 observed on 4,149 visits); it needs its seven items
  and cannot be compared with a stored value. In the one source read the
  published total is the ten components, items 1 to 10 (0 to 40) (Menzies
  and Farrell 2002 after Guy 1976; scale_reference.md, section 9); whether
  items 8 to 12 enter a total of the manual is unknown, as the 1976 manual
  itself could not be read (literature check 2026-11-21). The overall
  severity (item 8) equals the highest of items 1 to 7 on 3,422 of 4,111
  visits (it is higher on 18 and lower on 671); no source read states a rule
  that links item 8 to items 1 to 7 (literature check 2026-11-21).

  Teeth (decision D78; closes open question O6). aims0111 is item 11, current
  problems with teeth or dentures (field rad_pbactu, order 18 in the form), and
  aims0112 is item 12, the patient usually wears dentures (rad_portprothese,
  order 19). The form and the export agree on this (eschizo_hetero_aims.sql,
  lines 84 to 91). Only the dictionary swaps them: it names them in one line
  with two orders, "11: portprothese, 12: pbactu" for the labels and
  "rad_pbactu et rad_portprothese" for the fields, copied from the order of the
  columns of the table. The first is "yes" on 13% of the visits and the second
  on 6%. In the published scale items 11 and 12 are the dental status
  (current problems with teeth or dentures, usually wears dentures); which of
  the two is 11, and their yes/no coding, could not be confirmed: the source
  read (Menzies and Farrell 2002) asks about both without numbering them
  (literature check 2026-11-21).

  No item loses an answer: the levels 0 to 4 all occur, the highest rarely.

defaults: {type: item, range: [0, 4]}

variables:
  aims01: {column: aims0101, label: "AIMS 1: muscles of facial expression"}
  aims02: {column: aims0102, label: "AIMS 2: lips and perioral area"}
  aims03: {column: aims0103, label: "AIMS 3: jaw"}
  aims04: {column: aims0104, label: "AIMS 4: tongue"}
  aims05: {column: aims0105, label: "AIMS 5: upper limbs"}
  aims06: {column: aims0106, label: "AIMS 6: lower limbs"}
  aims07: {column: aims0107, label: "AIMS 7: neck, shoulders and hips"}
  aims_severity: {column: aims0108, label: "AIMS 8: overall severity of the abnormal movements"}
  aims_incapacitation: {column: aims0109, label: "AIMS 9: incapacitation due to the abnormal movements"}
  aims_awareness: {column: aims0110, label: "AIMS 10: patient's awareness of the abnormal movements (0 none, 4 severe distress)"}
  aims_dental_problems: {column: aims0111, label: "AIMS 11: current problems with teeth or dentures (see the notes)", range: [0, 1]}
  aims_dentures: {column: aims0112, label: "AIMS 12: usually wears dentures (see the notes)", range: [0, 1]}

scores:
  aims_movements:
    label: AIMS, sum of the seven movement items (0 to 28)
    sum: [aims01, aims02, aims03, aims04, aims05, aims06, aims07]
