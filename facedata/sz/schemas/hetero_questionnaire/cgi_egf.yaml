instrument: cgi_egf
title: "Clinical Global Impression (CGI) and Global Assessment of Functioning (EGF)"
tab: HETERO-QUESTIONNAIRE
section: Questionnaire CGI-EGF
status: draft
notes: >
  The code 0 means "not assessed" for the severity, the improvement, the
  therapeutic effect and the efficacy index. It is read as a missing code.

  Three items at the follow-up visits only, as in BP (BP decision D113, SZ
  D36). The form asks the improvement, the therapeutic effect with its side
  effects, and the efficacy index at the follow-up visits, and says to tick
  "not assessed" at the initial evaluation. They are nevertheless filled at
  353 to 650 of the 2,231 inclusion visits with a CGI. These variables are
  read at the follow-up visits only (visit_form, from the visit label).

  The efficacy index is (therapeutic effect - 1) x 4 + side effects. A schema
  cannot write a product, so the custom check cgi_index_differs compares the
  stored index with that formula: it holds on 2,013 of the 2,036 follow-up
  visits that have the three values, and the 23 others get check_failed.

  The EGF is a number from 1 to 100 in every cell: no band of ten points, as
  some BP cells hold.

  The severity is rated at every visit.

  Same instrument as in FACE BP; the SZ columns are named cgi0101 to
  cgi0103 where BP has cgi01 to cgi03.

version:
  name: visit_form
  column: visit
  codes:
    V0: inclusion
    V1_an: follow_up
    V2_ans: follow_up
    V3_ans: follow_up
    V4_ans: follow_up
    V5_ans: follow_up
    V6_ans: follow_up
    V7_ans: follow_up
    V8_ans: follow_up
    V9_ans: follow_up
    V10_ans: follow_up
    V6_mois: follow_up
    V18_mois: follow_up
    V30_mois: follow_up
    V42_mois: follow_up
    V54_mois: follow_up
    V66_mois: follow_up
    V78_mois: follow_up
    V90_mois: follow_up
    V102_mois: follow_up
    V114_mois: follow_up
    V126_mois: follow_up

defaults: {type: item}

variables:
  cgi_severity:
    column: cgi0101
    label: "CGI severity of illness, from 1 (normal) to 7 (among the most ill)"
    range: [1, 7]
    missing: {0: not_recorded}
  cgi_improvement:
    column: cgi0102
    versions: [follow_up]
    label: "CGI global improvement, from 1 (very much improved) to 7 (very much worse)"
    range: [1, 7]
    missing: {0: not_recorded}
  cgi_therapeutic_effect:
    column: cgi0103a
    versions: [follow_up]
    label: "CGI therapeutic effect, from 1 (marked) to 4 (unchanged or worse)"
    range: [1, 4]
    missing: {0: not_recorded}
  cgi_side_effects:
    column: cgi0103b
    versions: [follow_up]
    label: "CGI side effects, from 1 (none) to 4 (outweigh the therapeutic effect)"
    range: [1, 4]
  cgi_efficacy_index:
    column: cgi0103
    versions: [follow_up]
    label: "CGI efficacy index, from 1 to 16"
    range: [1, 16]
    missing: {0: not_recorded}
  gaf:
    column: egf
    label: "Global Assessment of Functioning (EGF), from 1 to 100"
    type: number
    range: [1, 100]
    missing: {0: not_recorded}
    bands: middle
    winsor: false

checks:
  cgi_efficacy_index: cgi_index_differs
