instrument: wurs25
title: Wender Utah Rating Scale, 25-item form (WURS-25), recall of childhood
tab: AUTO-QUESTIONNAIRE
section: Questionnaire WURS
status: reviewed
notes: >
  Wender Utah Rating Scale, the 25-item form, a recall of childhood: 305
  visits from 2012 (285 at inclusion, 125 dated before 2021), 295 of them with
  the 25 items. The questions are numbered as in the 61-item questionnaire
  (wurs25_03 is the question numbered 3 there, as in BP). The stored sum
  (wurstot) equals the sum of the items on all 295.

  Which form? The SZ form is the 25-item form only: its group is named
  "Echelle WURS 25", its table holds exactly the 25 items numbered 3 to 59,
  the score step of the export has a WURS-25 entry for the SZ table, and the
  SZ application has no 61-item questionnaire (the open question O9 is
  answered). In FACE BP the 61-item form was used until 2021 and the two forms
  share columns, so BP has two schemas (wurs25 and wurs61) split by the ALS
  and BIS answers of the visit; SZ needs no split and no ALS or BIS to read
  it.

  Who is asked. The WURS is not a questionnaire of every patient: 285 of the
  2,353 inclusion visits have it. It follows the screening question on
  attention deficit hyperactivity disorder asked at inclusion
  (adhd_symptoms_v0): 240 of the 285 inclusion visits with a WURS have a yes
  to it (84%), and 240 of the 309 yes have a WURS (78%). Its mean is that of a
  selected group, not of the cohort. The form's box "done / not done"
  (rad_wurs_nf) is not in the extraction (export request R152).

