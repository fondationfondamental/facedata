instrument: sogs
title: South Oaks Gambling Screen (SOGS)
tab: AUTO-QUESTIONNAIRE
section: Questionnaire SOGS
status: reviewed
notes: >
  South Oaks Gambling Screen, filled from 2014 by few patients (146 visits;
  the questions on borrowed money, 16a to 16k, on 13). Until the extraction
  of 13 November 2026 nine items were empty (decision D1 in PROGRESS.md).

  The dictionary gives the wording of questions 2, 4, 5 and 6 only (for 4, 5
  and 6, the last 12 months); the yes/no items keep their number. 22 of the
  columns are not in its list.

  Coding, as the export writes it. Item 4 is not in order of frequency: 1
  most of the times I lose, 2 sometimes (less than half of the times), 3
  every time. Items 1a to 1g: 1 at least once a week, 2 less than once a
  week. The export reads the answers of item 6 as "no" and "yes, some months
  ago but not now" only: the answer "yes" is lost (0 on 90 visits, 1 on 28,
  empty on 28, never 2); export request R151 of
  docs/EXPORT_REQUESTS.md.

  Gate. Item 16 (borrowed money) opens 16a to 16k (asked_if): after a no
  they are 0 (130 of the 132 visits with a no had them empty; the other 2
  hold an answer and keep it). Item 3a (the relatives, a text) is empty on
  the 118 visits with a no to item 3 and filled on 23 of the 24 with a yes:
  asked_if does not apply to a text, so no gate is written.

  Total. It is delivered as stored. Its key is in the application script
  (sogs.js, calcul, lines 118 to 139, the item 4 rule in valeur_champ, lines
  49 to 58; A80 of docs/EXPORT_REQUESTS.md): item 4 counts 1 for any answer,
  "never" included, so that every stored total is 1 or more (58 of 122 equal
  1; the published rule scores item 4 only for "most of the time" and "every
  time", to verify); items 5
  and 6 count 1 for any answer but the first; items 7 to 11, 13 to 15 and
  16a to 16i count 1 for a yes; item 12 and 16j and 16k are not counted; the
  maximum is 20. On the 94 totals that the delivered items allow to
  recompute, the key gives the stored one on 90. The total is not recomputed
  here while the export loses the answer "yes" of item 6 and some answers
  written with an apostrophe (8 stored totals have no item 5); to be seen
  again once the export is put right, with the choice of the item 4 rule.

defaults: {type: item, range: [0, 1]}

