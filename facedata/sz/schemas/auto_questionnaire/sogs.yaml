instrument: sogs
title: South Oaks Gambling Screen (SOGS)
tab: AUTO-QUESTIONNAIRE
section: Questionnaire SOGS
status: draft
notes: >
  South Oaks Gambling Screen, filled from 2014 by few patients (145
  visits; the questions on borrowed money, 16a to 16k, on 13). Until the
  extraction of 13 November 2026 nine items were empty (decision D1 in
  PROGRESS.md).

  The dictionary gives the wording of questions 2, 4, 5 and 6 only; the
  yes/no items keep their number. 22 of the columns are not in its list.

  The total is delivered as stored. With 122 totals the scoring key
  cannot be recovered from the data.

defaults: {type: item, range: [0, 1]}

variables:
  sogs01a: {label: "SOGS 1a: a kind of gambling (0 never, 1 once a week or more, 2 less than once a week)", range: [0, 2]}
  sogs01b: {label: "SOGS 1b: a kind of gambling (0 never, 1 once a week or more, 2 less than once a week)", range: [0, 2]}
  sogs01c: {label: "SOGS 1c: a kind of gambling (0 never, 1 once a week or more, 2 less than once a week)", range: [0, 2]}
  sogs01d: {label: "SOGS 1d: a kind of gambling (0 never, 1 once a week or more, 2 less than once a week)", range: [0, 2]}
  sogs01e: {label: "SOGS 1e: a kind of gambling (0 never, 1 once a week or more, 2 less than once a week)", range: [0, 2]}
  sogs01f: {label: "SOGS 1f: a kind of gambling (0 never, 1 once a week or more, 2 less than once a week)", range: [0, 2]}
  sogs01g: {label: "SOGS 1g: a kind of gambling (0 never, 1 once a week or more, 2 less than once a week)", range: [0, 2]}
  sogs_largest_amount: {column: sogs02, type: number, label: "SOGS 2: largest amount gambled in one day", range: [0, 1000000], winsor: false}
  sogs03: {label: "SOGS 3: a relative has or had a gambling problem"}
  sogs_relatives: {column: sogs03a, type: text, label: "SOGS 3a: the relatives with a gambling problem, as written"}
  sogs04: {label: "SOGS 4: went back another day to win back the money lost (0 never to 3 every time)", range: [0, 3]}
  sogs05: {label: "SOGS 5: claimed to be winning while losing (0 never to 2 most of the time)", range: [0, 2]}
  sogs06: {label: "SOGS 6: had a gambling problem in the last 12 months (0 no, 1 in the past but not now, 2 yes)", range: [0, 2]}
  sogs07: {label: "SOGS item 7 (1 yes, 0 no)"}
  sogs08: {label: "SOGS item 8 (1 yes, 0 no)"}
