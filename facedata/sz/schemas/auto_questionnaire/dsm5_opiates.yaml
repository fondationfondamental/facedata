instrument: dsm5_opiates
title: "DSM-5 criteria of a use disorder: opiates"
tab: AUTO-QUESTIONNAIRE
section: "Critères DSM5 de troubles lié à l'usage de: OPIACE"
status: reviewed
notes: >
  Twelve criteria of a use disorder for opiates, answered from 2014 on 52
  visits (36 with one criterion or more). Each criterion is asked twice:
  ever, and in the last 12 months. 1 is yes, 0 is no, and 2 is "do not
  know", read as a missing code.

  The second question is asked after a yes to the first (asked_if). The
  extraction never fills it after a no (0 of 359 such cells), so every 0 of
  the 12-month criteria comes from asked_if. Under a yes, none is empty and
  none is "do not know".

  The block is shown after a yes to the question "more than ten times in your
  life" of the SUBSTANCES tab (opiate_over_ten_times; addict.js, lines 50 to
  56). It is not written as a shown_if: the form hides the block but keeps
  what was typed, and no delivered cell of the block sits under a no or an
  empty answer. A block empty on a visit with a yes to the use question was
  not answered: it stays missing, as it does where the use question is empty.
  After a no (ten times or fewer in the life) the block is never asked, and
  its criteria are 0 (the user's decisions of 2026-11-21). The use question of
  this substance (opiate_over_ten_times) is itself asked only after a yes to
  illicit drugs more than ten times (rad_add_4, illicit_drugs_over_ten_times
  of drug_use.yaml), and drug_use.yaml delivers it as 0 after a no there. The
  gate reproduces that chain with two hidden readers:
  opiate_illicit_drugs_gate reads rad_add_4, and opiate_over_ten_times_gate
  reads the SUBSTANCES column suoccur_opiacelt with asked_if on it, so the
  criteria are 0 wherever the delivered opiate_over_ten_times is 0. 40,056
  cells of the criteria ever and as many of the 12-month criteria (asked after
  a yes to ever, so 0 too) become 0, on 3,338 visits; the two counts are 0
  there (the count ever is filled on 52 visits before, 3,390 after). A
  criterion typed under a no is read as typed.

  The same twelve questions are asked for seven substances, in seven schemas
  with the same variables (dsm5_alcohol.yaml and the others; the stems are
  alcohol_, cannabis_, cocaine_, heroin_, opiate_, sedative_ and
  other_substance_). The first eleven are the DSM-5 criteria; the twelfth,
  legal problems, is a DSM-IV criterion. No count of criteria is stored. Two
  are computed here: the number of yes among the criteria a to k, ever and
  in the last 12 months (0 to 11). A "do not know" leaves the count missing,
  and the legal problems are not counted. No severity band is delivered:
  DSM-5 reads 2 or 3 criteria as mild, 4 or 5 as moderate, 6 or more as
  severe (APA 2013, as stated by Miller et al. 2023 and Choi et al. 2025).
  The application counts the criteria a to k for its own message
  (calcul_sympt, addict.js, lines 448 to 490) and does not store the count.

  The same form is used at inclusion and at the yearly visits (the yearly
  update, no split). The count "ever" is not always kept from one year to the
  next: 5 of the 16 yearly answers of the patients with one criterion or more
  at inclusion give a count of 0. With the gate on the use question, 7 of 18:
  at 2 yearly visits these patients answer no to "more than ten times in your
  life" (or to the illicit-drugs question), although they met a criterion at
  inclusion: these zeros come from the use question, not from the criteria.

defaults: {type: item, range: [0, 1], missing: {2: unknown}}

variables:
  opiate_illicit_drugs_gate: {column: rad_add_4, codes: {Oui: 1, Non: 0}, keep: false, label: "Illicit drugs or medicines without a prescription: more than ten times in your life (the opening question of drug_use.yaml, delivered as illicit_drugs_over_ten_times; not delivered here, the gate of the substance question)"}
  opiate_over_ten_times_gate: {column: suoccur_opiacelt, codes: {Y: 1, N: 0}, keep: false, label: "Opiates: more than ten times in your life (the SUBSTANCES tab question, delivered as opiate_over_ten_times; not delivered here, the gate of the criteria ever)", asked_if: opiate_illicit_drugs_gate}
  opiate_larger_amounts: {column: opiacea1, label: "Opiates, criterion a: took larger amounts than intended, ever", asked_if: opiate_over_ten_times_gate}
  opiate_larger_amounts_12m: {column: opiacea2, label: "Opiates, criterion a: took larger amounts than intended, in the last 12 months", asked_if: opiate_larger_amounts}
  opiate_cut_down: {column: opiaceb1, label: "Opiates, criterion b: tried to cut down or stop, ever", asked_if: opiate_over_ten_times_gate}
  opiate_cut_down_12m: {column: opiaceb2, label: "Opiates, criterion b: tried to cut down or stop, in the last 12 months", asked_if: opiate_cut_down}
  opiate_time_spent: {column: opiacec1, label: "Opiates, criterion c: spends time obtaining, using or recovering, ever", asked_if: opiate_over_ten_times_gate}
  opiate_time_spent_12m: {column: opiacec2, label: "Opiates, criterion c: spends time obtaining, using or recovering, in the last 12 months", asked_if: opiate_time_spent}
  opiate_craving: {column: opiaced1, label: "Opiates, criterion d: craving, ever", asked_if: opiate_over_ten_times_gate}
  opiate_craving_12m: {column: opiaced2, label: "Opiates, criterion d: craving, in the last 12 months", asked_if: opiate_craving}
  opiate_obligations: {column: opiacee1, label: "Opiates, criterion e: failed major obligations at work, at home or at school, ever", asked_if: opiate_over_ten_times_gate}
  opiate_obligations_12m: {column: opiacee2, label: "Opiates, criterion e: failed major obligations at work, at home or at school, in the last 12 months", asked_if: opiate_obligations}
  opiate_interpersonal: {column: opiacef1, label: "Opiates, criterion f: went on using in spite of interpersonal consequences, ever", asked_if: opiate_over_ten_times_gate}
  opiate_interpersonal_12m: {column: opiacef2, label: "Opiates, criterion f: went on using in spite of interpersonal consequences, in the last 12 months", asked_if: opiate_interpersonal}
  opiate_activities_given_up: {column: opiaceg1, label: "Opiates, criterion g: gave up social, occupational or leisure activities, ever", asked_if: opiate_over_ten_times_gate}
  opiate_activities_given_up_12m: {column: opiaceg2, label: "Opiates, criterion g: gave up social, occupational or leisure activities, in the last 12 months", asked_if: opiate_activities_given_up}
  opiate_hazardous_use: {column: opiaceh1, label: "Opiates, criterion h: repeated use when it can be dangerous, ever", asked_if: opiate_over_ten_times_gate}
  opiate_hazardous_use_12m: {column: opiaceh2, label: "Opiates, criterion h: repeated use when it can be dangerous, in the last 12 months", asked_if: opiate_hazardous_use}
  opiate_despite_problems: {column: opiacei1, label: "Opiates, criterion i: went on using in spite of psychological or physical problems it causes, ever", asked_if: opiate_over_ten_times_gate}
  opiate_despite_problems_12m: {column: opiacei2, label: "Opiates, criterion i: went on using in spite of psychological or physical problems it causes, in the last 12 months", asked_if: opiate_despite_problems}
  opiate_tolerance: {column: opiacej1, label: "Opiates, criterion j: tolerance, ever", asked_if: opiate_over_ten_times_gate}
  opiate_tolerance_12m: {column: opiacej2, label: "Opiates, criterion j: tolerance, in the last 12 months", asked_if: opiate_tolerance}
  opiate_withdrawal: {column: opiacek1, label: "Opiates, criterion k: withdrawal symptoms, or use to avoid them, ever", asked_if: opiate_over_ten_times_gate}
  opiate_withdrawal_12m: {column: opiacek2, label: "Opiates, criterion k: withdrawal symptoms, or use to avoid them, in the last 12 months", asked_if: opiate_withdrawal}
  opiate_legal_problems: {column: opiacel1, label: "Opiates, criterion l: legal problems linked to the use, ever", asked_if: opiate_over_ten_times_gate}
  opiate_legal_problems_12m: {column: opiacel2, label: "Opiates, criterion l: legal problems linked to the use, in the last 12 months", asked_if: opiate_legal_problems}

scores:
  opiate_criteria_count:
    label: "Opiates: DSM-5 criteria met, ever (criteria a to k, 0 to 11)"
    sum: [opiate_larger_amounts, opiate_cut_down, opiate_time_spent, opiate_craving, opiate_obligations, opiate_interpersonal, opiate_activities_given_up, opiate_hazardous_use, opiate_despite_problems, opiate_tolerance, opiate_withdrawal]
    range: [0, 11]
    min_items: 11
  opiate_criteria_count_12m:
    label: "Opiates: DSM-5 criteria met, in the last 12 months (criteria a to k, 0 to 11)"
    sum: [opiate_larger_amounts_12m, opiate_cut_down_12m, opiate_time_spent_12m, opiate_craving_12m, opiate_obligations_12m, opiate_interpersonal_12m, opiate_activities_given_up_12m, opiate_hazardous_use_12m, opiate_despite_problems_12m, opiate_tolerance_12m, opiate_withdrawal_12m]
    range: [0, 11]
    min_items: 11
