instrument: dsm5_cocaine
title: "DSM-5 criteria of a use disorder: cocaine"
tab: AUTO-QUESTIONNAIRE
section: "Critères DSM5 de troubles lié à l'usage de: COCAINE"
status: draft
notes: >
  Twelve criteria of a use disorder for cocaine, answered from 2014 on
  191 visits (104 with one criterion or more). Each criterion is
  asked twice: ever, and in the last 12 months. 1 is yes, 0 is no, and 2 is
  "do not know", read as a missing code.

  The second question is asked after a yes to the first (asked_if): where
  it is empty after a "no" it is 0. The extraction mostly writes it.

  The same twelve questions are asked for seven substances, in seven
  schemas with the same variables (dsm5_alcohol.yaml and the others). The
  first eleven are the DSM-5 criteria; the twelfth, legal problems, is a
  DSM-IV criterion. No count of criteria is stored, and none is computed.

defaults: {type: item, range: [0, 1], missing: {2: unknown}}

variables:
  cocaine_larger_amounts: {column: cocaina1, label: "Cocaine, criterion a: took larger amounts than intended, ever"}
  cocaine_larger_amounts_12m: {column: cocaina2, label: "Cocaine, criterion a: took larger amounts than intended, in the last 12 months", asked_if: cocaine_larger_amounts}
  cocaine_cut_down: {column: cocainb1, label: "Cocaine, criterion b: tried to cut down or stop, ever"}
  cocaine_cut_down_12m: {column: cocainb2, label: "Cocaine, criterion b: tried to cut down or stop, in the last 12 months", asked_if: cocaine_cut_down}
  cocaine_time_spent: {column: cocainc1, label: "Cocaine, criterion c: spends time obtaining, using or recovering, ever"}
  cocaine_time_spent_12m: {column: cocainc2, label: "Cocaine, criterion c: spends time obtaining, using or recovering, in the last 12 months", asked_if: cocaine_time_spent}
  cocaine_craving: {column: cocaind1, label: "Cocaine, criterion d: craving, ever"}
  cocaine_craving_12m: {column: cocaind2, label: "Cocaine, criterion d: craving, in the last 12 months", asked_if: cocaine_craving}
  cocaine_obligations: {column: cocaine1, label: "Cocaine, criterion e: failed major obligations at work, at home or at school, ever"}
  cocaine_obligations_12m: {column: cocaine2, label: "Cocaine, criterion e: failed major obligations at work, at home or at school, in the last 12 months", asked_if: cocaine_obligations}
  cocaine_interpersonal: {column: cocainf1, label: "Cocaine, criterion f: went on using in spite of interpersonal consequences, ever"}
  cocaine_interpersonal_12m: {column: cocainf2, label: "Cocaine, criterion f: went on using in spite of interpersonal consequences, in the last 12 months", asked_if: cocaine_interpersonal}
  cocaine_activities_given_up: {column: cocaing1, label: "Cocaine, criterion g: gave up social, occupational or leisure activities, ever"}
  cocaine_activities_given_up_12m: {column: cocaing2, label: "Cocaine, criterion g: gave up social, occupational or leisure activities, in the last 12 months", asked_if: cocaine_activities_given_up}
  cocaine_hazardous_use: {column: cocainh1, label: "Cocaine, criterion h: repeated use when it can be dangerous, ever"}
  cocaine_hazardous_use_12m: {column: cocainh2, label: "Cocaine, criterion h: repeated use when it can be dangerous, in the last 12 months", asked_if: cocaine_hazardous_use}
  cocaine_despite_problems: {column: cocaini1, label: "Cocaine, criterion i: went on using in spite of psychological or physical problems it causes, ever"}
  cocaine_despite_problems_12m: {column: cocaini2, label: "Cocaine, criterion i: went on using in spite of psychological or physical problems it causes, in the last 12 months", asked_if: cocaine_despite_problems}
  cocaine_tolerance: {column: cocainj1, label: "Cocaine, criterion j: tolerance, ever"}
  cocaine_tolerance_12m: {column: cocainj2, label: "Cocaine, criterion j: tolerance, in the last 12 months", asked_if: cocaine_tolerance}
  cocaine_withdrawal: {column: cocaink1, label: "Cocaine, criterion k: withdrawal symptoms, or use to avoid them, ever"}
  cocaine_withdrawal_12m: {column: cocaink2, label: "Cocaine, criterion k: withdrawal symptoms, or use to avoid them, in the last 12 months", asked_if: cocaine_withdrawal}
  cocaine_legal_problems: {column: cocainl1, label: "Cocaine, criterion l: legal problems linked to the use, ever"}
  cocaine_legal_problems_12m: {column: cocainl2, label: "Cocaine, criterion l: legal problems linked to the use, in the last 12 months", asked_if: cocaine_legal_problems}
