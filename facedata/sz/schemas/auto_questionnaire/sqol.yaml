instrument: sqol
title: Schizophrenia Quality of Life questionnaire (S-QoL 18)
tab: AUTO-QUESTIONNAIRE
section: Questionnaire QUALITE DE VIE
status: draft
notes: >
  S-QoL 18, filled at every visit (4,313 visits): 18 items of 1 to 5,
  eight dimensions and an index, each from 0 to 100.

  Scoring, fitted on the items: a dimension is the mean of its items
  brought to 0 to 100, (mean - 1) x 25, and the index is the mean of the
  eight dimensions. The dictionary gives the items of each dimension, and
  the data agree: no score_mismatch on the seven dimensions recomputed
  here. The stored index is rounded to one decimal, hence the tolerance.

  Items 17 and 18 lose two of their five answers. They hold only 2, 4 and
  5, in every year, while item 16 of the same dimension holds 1 to 5: the
  answers 1 and 3 are not in the extraction. 1,549 visits have item 16 and
  no item 17. The stored dimension (psychological well-being) exists on
  782 of them, so the answers were given and the export loses them, as it
  lost the Epworth answers in BP (decision D8 and open question O8 in
  PROGRESS.md). The two items are delivered as extracted: missing where
  the answer was 1 or 3. The dimension cannot be recomputed, so the stored
  one is delivered as it is, and the index is computed with it.

defaults: {type: item, range: [1, 5]}

variables:
  sqol01: {label: "S-QoL item 1 (1 to 5)"}
  sqol02: {label: "S-QoL item 2 (1 to 5)"}
  sqol03: {label: "S-QoL item 3 (1 to 5)"}
  sqol04: {label: "S-QoL item 4 (1 to 5)"}
  sqol05: {label: "S-QoL item 5 (1 to 5)"}
  sqol06: {label: "S-QoL item 6 (1 to 5)"}
  sqol07: {label: "S-QoL item 7 (1 to 5)"}
  sqol08: {label: "S-QoL item 8 (1 to 5)"}
  sqol09: {label: "S-QoL item 9 (1 to 5)"}
  sqol10: {label: "S-QoL item 10 (1 to 5)"}
  sqol11: {label: "S-QoL item 11 (1 to 5)"}
  sqol12: {label: "S-QoL item 12 (1 to 5)"}
  sqol13: {label: "S-QoL item 13 (1 to 5)"}
  sqol14: {label: "S-QoL item 14 (1 to 5)"}
  sqol15: {label: "S-QoL item 15 (1 to 5)"}
  sqol16: {label: "S-QoL item 16 (1 to 5)"}
  sqol17: {label: "S-QoL item 17 (1 to 5)"}
  sqol18: {label: "S-QoL item 18 (1 to 5)"}
  sqol_sentimental_life_stored: {column: sqol19, type: number, label: S-QoL sentimental life as stored, range: [0, 100], winsor: false, keep: false}
  sqol_self_esteem_stored: {column: sqol20, type: number, label: S-QoL self-esteem as stored, range: [0, 100], winsor: false, keep: false}
  sqol_family_stored: {column: sqol21, type: number, label: S-QoL relations with the family as stored, range: [0, 100], winsor: false, keep: false}
  sqol_friends_stored: {column: sqol22, type: number, label: S-QoL relations with friends as stored, range: [0, 100], winsor: false, keep: false}
  sqol_autonomy_stored: {column: sqol23, type: number, label: S-QoL autonomy as stored, range: [0, 100], winsor: false, keep: false}
  sqol_physical_wellbeing_stored: {column: sqol25, type: number, label: S-QoL physical well-being as stored, range: [0, 100], winsor: false, keep: false}
  sqol_resilience_stored: {column: sqol26, type: number, label: S-QoL resilience as stored, range: [0, 100], winsor: false, keep: false}
  sqol_psychological_wellbeing:
    column: sqol24
    type: number
    label: "S-QoL psychological well-being, as stored (items 16 to 18; see the notes)"
    range: [0, 100]
    winsor: false
  sqol_index_stored: {column: sqol, type: number, label: S-QoL index as stored, range: [0, 100], winsor: false, keep: false}

scores:
  sqol_sentimental_life:
    label: "S-QoL sentimental life (items 14, 15; 0 to 100)"
    mean: [sqol14, sqol15]
    scale: [25, -25]
    compare: sqol_sentimental_life_stored
    compare_tolerance: 0.051
  sqol_self_esteem:
    label: "S-QoL self-esteem (items 1, 4; 0 to 100)"
    mean: [sqol01, sqol04]
    scale: [25, -25]
    compare: sqol_self_esteem_stored
    compare_tolerance: 0.051
  sqol_family:
    label: "S-QoL relations with the family (items 10, 11; 0 to 100)"
    mean: [sqol10, sqol11]
    scale: [25, -25]
    compare: sqol_family_stored
    compare_tolerance: 0.051
  sqol_friends:
    label: "S-QoL relations with friends (items 12, 13; 0 to 100)"
    mean: [sqol12, sqol13]
    scale: [25, -25]
    compare: sqol_friends_stored
    compare_tolerance: 0.051
  sqol_autonomy:
    label: "S-QoL autonomy (items 5, 6; 0 to 100)"
    mean: [sqol05, sqol06]
    scale: [25, -25]
    compare: sqol_autonomy_stored
    compare_tolerance: 0.051
  sqol_physical_wellbeing:
    label: "S-QoL physical well-being (items 8, 9; 0 to 100)"
    mean: [sqol08, sqol09]
    scale: [25, -25]
    compare: sqol_physical_wellbeing_stored
    compare_tolerance: 0.051
  sqol_resilience:
    label: "S-QoL resilience (items 2, 3, 7; 0 to 100)"
    mean: [sqol02, sqol03, sqol07]
    scale: [25, -25]
    compare: sqol_resilience_stored
    compare_tolerance: 0.051
  sqol_index:
    label: "S-QoL index, mean of the eight dimensions (0 to 100, higher is better)"
    mean: [sqol_sentimental_life, sqol_self_esteem, sqol_family, sqol_friends, sqol_autonomy,
           sqol_psychological_wellbeing, sqol_physical_wellbeing, sqol_resilience]
    compare: sqol_index_stored
    compare_tolerance: 0.06
