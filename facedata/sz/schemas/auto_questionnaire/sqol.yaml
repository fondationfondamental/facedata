scores:
  sqol_sentimental_life:
    label: "S-QoL sentimental life (items 14, 15; 0 to 100)"
    mean: [sqol14, sqol15]
    scale: [25, -25]
    min_items: 1
    compare: sqol_sentimental_life_stored
    compare_tolerance: 0.051
  sqol_self_esteem:
    label: "S-QoL self-esteem (items 1, 4; 0 to 100)"
    mean: [sqol01, sqol04]
    scale: [25, -25]
    min_items: 1
    compare: sqol_self_esteem_stored
    compare_tolerance: 0.051
  sqol_family:
    label: "S-QoL relations with the family (items 10, 11; 0 to 100)"
    mean: [sqol10, sqol11]
    scale: [25, -25]
    min_items: 1
    compare: sqol_family_stored
    compare_tolerance: 0.051
  sqol_friends:
    label: "S-QoL relations with friends (items 12, 13; 0 to 100)"
    mean: [sqol12, sqol13]
    scale: [25, -25]
    min_items: 1
    compare: sqol_friends_stored
    compare_tolerance: 0.051
  sqol_autonomy:
    label: "S-QoL autonomy (items 5, 6; 0 to 100)"
    mean: [sqol05, sqol06]
    scale: [25, -25]
    min_items: 1
    compare: sqol_autonomy_stored
    compare_tolerance: 0.051
  sqol_psychological_wellbeing:
    label: "S-QoL psychological well-being (items 16, 17, 18; 0 to 100)"
    mean: [sqol16, sqol17, sqol18]
    scale: [25, -25]
    min_items: 2
    compare: sqol_psychological_wellbeing_stored
    compare_tolerance: 0.051
  sqol_physical_wellbeing:
    label: "S-QoL physical well-being (items 8, 9; 0 to 100)"
    mean: [sqol08, sqol09]
    scale: [25, -25]
    min_items: 1
    compare: sqol_physical_wellbeing_stored
    compare_tolerance: 0.051
  sqol_resilience:
    label: "S-QoL resilience (items 2, 3, 7; 0 to 100)"
    mean: [sqol02, sqol03, sqol07]
    scale: [25, -25]
    min_items: 2
    compare: sqol_resilience_stored
    compare_tolerance: 0.051
  sqol_index:
    label: "S-QoL index, mean of the eight dimensions, seven at least (0 to 100, higher is better)"
    mean: [sqol_sentimental_life, sqol_self_esteem, sqol_family, sqol_friends, sqol_autonomy,
           sqol_psychological_wellbeing, sqol_physical_wellbeing, sqol_resilience]
    min_items: 7
    compare: sqol_index_stored
    compare_tolerance: 0.06
