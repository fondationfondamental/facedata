instrument: sqol
title: Schizophrenia Quality of Life questionnaire (S-QoL 18)
tab: AUTO-QUESTIONNAIRE
section: Questionnaire QUALITE DE VIE
status: reviewed
notes: >
  S-QoL 18, filled at every visit (4,330 visits): 18 items of 1 to 5, eight
  dimensions and an index, each from 0 to 100.

  Scoring, fitted on the items: a dimension is the mean of its items brought
  to 0 to 100, (mean - 1) x 25, and the index is the mean of the eight
  dimensions. The dictionary gives the items of each dimension, and the data
  agree: no score_mismatch on the eight dimensions recomputed here. The EMR
  export stores a dimension when at most one of its items is missing (the
  mean of the others, as the nucleus rule says), so the dimensions are
  computed with min_items 1 (two items) or 2 (three items: resilience and
  psychological well-being), all equal to the stored ones (D87). The stored
  index is the mean of seven or eight dimensions rounded to one decimal,
  hence the tolerance: the index recomputed with min_items 7 equals the
  stored one on its 4,256 visits (211 rest on seven dimensions).

  Items 17 and 18 were mis-coded by the export up to SZALL_20261117: it read
  them with the labels "much less than expected" to "more than expected",
  where the form gives them the answers of item 16 (from "much more than
  expected", 1, to "less than expected", 5, the best), so the answer 5 was
  delivered as 2, the answer 2 as 5, and the answers 1 and 3 were lost
  (D87, O8). The export reads them with the labels of item 16 since
  SZALL_20261121 (request R150, export commit fcbdfb31): the two items hold
  1 to 5 and correlate +0.39 and +0.44 with item 16 (rank correlation), and
  the stored psychological dimension and index are computed again from
  them. Items 17 and 18, the psychological dimension and the index are
  delivered again (D104). The psychological dimension is recomputed like
  the others (min_items 2, three items) and the index is the mean of at
  least seven of the eight dimensions, the rule of the nucleus.

  The 18 boxes "does not concern me" of the form (chk_sqol_N_pc, exported
  as sqolNN_pc since SZALL_20261121) are delivered as 1 (ticked) and 0. The
  raw cell holds OUI, NON or def, and is empty on the visits without the
  questionnaire. def is read as a box not ticked: on 574 visits some boxes
  are OUI and all the others def, as on the visits of NON (the meaning of def
  is asked of the data managers, O47). The application leaves a ticked item
  out of its dimension and a dimension whose items are all ticked out of
  the index (autoq_qualite_vie.js); the export, and this schema, average
  the answers present, which gives the same value except where an answer
  sits beside a ticked box (124 cells): the answer is delivered as recorded
  and the dimension keeps it (O47).

