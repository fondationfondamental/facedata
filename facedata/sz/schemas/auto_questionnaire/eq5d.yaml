instrument: eq5d
title: EQ-5D-5L, health-related quality of life
tab: AUTO-QUESTIONNAIRE
section: Questionnaire EQ5D
status: reviewed
notes: >
  EQ-5D-5L, filled at every visit from 2011 (3,927 visits, 57 of them
  screening rows): five dimensions of 1 to 5, the visual scale and the index.
  Same instrument as in FACE BP.

  Index. The extraction holds a stored index; the package reads the index from
  the five answers in a table with one value per profile, as in BP (BP D133).
  The table is the crosswalk of the 5L profile to the French 3L value set (the
  EuroQol crosswalk of van Hout et al., Value Health 2012;15:708-715, which
  maps a 5L profile to the 3L value set of any country; country France):
  3,125 profiles, identical in the scripts of the BP, SZ and ASP
  applications; the score step of the export names the same country. It is not
  a French value set for the 5L itself; one exists (Andrade et al.,
  PharmacoEconomics 2020;38:413-425) but its table is not in the sources, so
  it is not used. The
  stored index equals it on all 3,909 visits with the five answers: nothing is
  flagged. The visual scale (0 to 100) is not needed: the script of the
  application tests a missing scale on a node list that is never empty, so its
  test never fires (defect A18) and the index exists on 3,909 visits against
  3,169 scales. The index goes from -0.53 to 1.

defaults: {type: item, range: [1, 5]}

variables:
  eq5d0201: {label: "Mobilité"}
  eq5d0202: {label: "Autonomie de la personne"}
  eq5d0203: {label: "Activités courantes (exemples : travail, études, travaux domestiques,..."}
  eq5d0204: {label: "Douleurs, gêne"}
  eq5d0205: {label: "Anxiété, dépression"}
  eq5d_vas: {column: eq5d0206, type: number, label: "Health today, visual scale", range: [0, 100], winsor: false}
  eq5d_index_stored: {column: eq5d_, type: number, label: "EQ-5D-5L index as stored", range: [-0.6, 1], winsor: false, keep: false}

scores:
  eq5d_index:
    label: "EQ-5D-5L index (crosswalk of the 5L profile to the French 3L value set, one value per combination of the five answers)"
    profile: eq5d_index
    from: [eq5d0201, eq5d0202, eq5d0203, eq5d0204, eq5d0205]
    compare: eq5d_index_stored
