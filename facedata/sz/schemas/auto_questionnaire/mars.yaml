instrument: mars
title: Medication Adherence Rating Scale (MARS, 10 items)
tab: AUTO-QUESTIONNAIRE
section: Questionnaire MARS
status: draft
notes: >
  Medication Adherence Rating Scale, filled at every visit (4,315
  visits). The BP schema: ten items coded 1 = no and 0 = yes, and a total
  that counts items 7 and 8 the other way (decision D37 of the BP file).
  The stored total was fitted on the items here too and follows the same
  formula: 2 score_mismatch on 4,266 totals.

  Item 10 is in the column mars010 (mars10 in BP), which the dictionary
  does not list. The BP question "takes a medication at present" (mars11)
  is not in the SZ extraction.

defaults: {type: item, range: [0, 1]}

variables:
  mars01: {label: "MARS item 1 (1 = no, 0 = yes)"}
  mars02: {label: "MARS item 2 (1 = no, 0 = yes)"}
  mars03: {label: "MARS item 3 (1 = no, 0 = yes)"}
  mars04: {label: "MARS item 4 (1 = no, 0 = yes)"}
  mars05: {label: "MARS item 5 (1 = no, 0 = yes)"}
  mars06: {label: "MARS item 6 (1 = no, 0 = yes)"}
  mars07: {label: "MARS item 7 (1 = no, 0 = yes)"}
  mars08: {label: "MARS item 8 (1 = no, 0 = yes)"}
  mars09: {label: "MARS item 9 (1 = no, 0 = yes)"}
  mars10: {column: mars010, label: "MARS item 10 (1 = no, 0 = yes)"}
  mars_stored: {column: mars_, label: MARS total as stored, range: [0, 10], keep: false}

scores:
  mars_total:
    label: MARS adherence total (higher is better)
    sum: [mars01, mars02, mars03, mars04, mars05, mars06, mars07, mars08,
          mars09, mars10]
    reverse: [mars07, mars08]
    compare: mars_stored
