instrument: mars
title: Medication Adherence Rating Scale (MARS, 10 items)
tab: AUTO-QUESTIONNAIRE
section: Questionnaire MARS
status: reviewed
notes: >
  Medication Adherence Rating Scale, 10 items, filled at every visit (4,316
  visits, 2,078 at inclusion). The BP schema: ten items coded 1 = no and 0 =
  yes, and a total that counts items 7 and 8 the other way (decision D37 of
  the BP file). The stored total was fitted on the items here too and follows
  the same formula: 2 score_mismatch on the 4,204 visits that have both a
  stored and a recomputed total; 62 more visits have a recomputed total and no
  stored one.

  Item 10 is in the column mars010 (mars10 in BP), which the dictionary does
  not list. The BP question "takes a medication at present" (mars11) is not in
  the SZ extraction and the SZ form has no such question: there is no gate (in
  BP the form hides the MARS after a no to that question). An empty MARS in SZ
  is a questionnaire not filled, never a no: it is missing, not 0. The form's
  box "done / not done" (rad_mars_nf) is not in the extraction (export
  request R152).

defaults: {type: item, range: [0, 1]}

variables:
  mars01: {label: "MARS item 1 (1 = no, 0 = yes)"}
  mars02: {label: "MARS item 2 (1 = no, 0 = yes)"}
  mars03: {label: "MARS item 3 (1 = no, 0 = yes)"}
  mars04: {label: "MARS item 4 (1 = no, 0 = yes)"}
  mars05: {label: "MARS item 5 (1 = no, 0 = yes)"}
  mars06: {label: "MARS item 6 (1 = no, 0 = yes)"}
  mars07: {label: "MARS item 7 (1 = no, 0 = yes)"}
  mars08: {label: "MARS item 8 (1 = no, 0 = yes)"}
  mars09: {label: "MARS item 9 (1 = no, 0 = yes)"}
  mars10: {column: mars010, label: "MARS item 10 (1 = no, 0 = yes)"}
  mars_stored: {column: mars_, label: MARS total as stored, range: [0, 10], keep: false}

scores:
  mars_total:
    label: MARS adherence total (higher is better)
    sum: [mars01, mars02, mars03, mars04, mars05, mars06, mars07, mars08,
          mars09, mars10]
    reverse: [mars07, mars08]
    compare: mars_stored
