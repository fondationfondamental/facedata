instrument: fagerstrom
title: Fagerström Test for Nicotine Dependence (6 items)
tab: AUTO-QUESTIONNAIRE
section: Questionnaire FAGERSTROM
status: reviewed
notes: >
  Fagerström test for nicotine dependence, 6 items, filled on 2,044 visits
  (1,042 at inclusion). Same instrument and same schema as in FACE BP. Item 3
  lost its answer "any other cigarette" until the extraction of 13 November
  2026 (decision D1 in PROGRESS.md); it is back, and the stored total equals
  the sum of the six items on the 1,981 visits that have it.

  Who is asked. The test is for smokers. The form hides it by a smoking-status
  question named rad_tabac that no table of the SZ extraction holds, so the
  gate cannot be read from the extraction; against the tobacco status of the
  same visit (tobacco.yaml) the items are filled on 1,833 of the 2,087 current
  smokers, 44 of the 614 ex-smokers, 35 of the 1,728 non-smokers and 132 of
  the 2,177 visits with no status. These 79 cells of non-smokers and
  ex-smokers and the 132 with no status are kept as recorded (no shown_if: the
  status is of the day of the visit and "Non fumeur" is not "never smoked"). A
  visit with no item is missing, never 0. The form's box "done / not done"
  (rad_fagerstrom_nf) is not in the extraction (export request R152).

defaults: {type: item, range: [0, 1]}

variables:
  fagers01: {label: "Combien de temps après votre réveil fumez-vous votre première cigarette", range: [0, 3]}
  fagers02: {label: "Trouvez-vous difficile de vous abstenir de fumer dans les endroits où..."}
  fagers03: {label: "A quelle cigarette de la journée vous serait-il le plus difficile de..."}
  fagers04: {label: "Combien de cigarettes fumez-vous par jour", range: [0, 3]}
  fagers05: {label: "Fumez-vous à un rythme plus soutenu le matin que l'après-midi"}
  fagers06: {label: "Fumez-vous lorsque vous êtes si malade que vous devez rester au lit..."}
  fagers_stored: {column: fagers, label: Fagerström total as stored, range: [0, 10], keep: false}

scores:
  fagerstrom_total:
    label: Fagerström total (0 to 10)
    sum: [fagers01, fagers02, fagers03, fagers04, fagers05, fagers06]
    compare: fagers_stored
