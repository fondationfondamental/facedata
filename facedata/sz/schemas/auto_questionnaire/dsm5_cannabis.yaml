instrument: dsm5_cannabis
title: "DSM-5 criteria of a use disorder: cannabis"
tab: AUTO-QUESTIONNAIRE
section: "Critères DSM5 de troubles lié à l'usage de: CANNABIS"
status: reviewed
notes: >
  Twelve criteria of a use disorder for cannabis, answered from 2012 on
  1,257 visits (863 with one criterion or more). Each criterion is asked
  twice: ever, and in the last 12 months. 1 is yes, 0 is no, and 2 is "do
  not know", read as a missing code.

  The second question is asked after a yes to the first (asked_if). The
  extraction never fills it after a no (0 of 8,428 such cells), so every 0
  of the 12-month criteria comes from asked_if. Under a yes, 23 are empty
  and 27 are "do not know".

  The block is shown after a yes to the question "more than ten times in
  your life" of the SUBSTANCES tab (cannabis_over_ten_times; addict.js,
  lines 50 to 56). It is not written as a shown_if: the form hides the block
  but keeps what was typed, and 78 delivered cells on 5 visits sit under a
  no, 24 on 1 visit under an empty answer. A block empty on a visit was not
  answered: it is not a string of no. The criteria carry no asked_if on the
  use question, which would turn the blocks never asked into 0: a no there
  means ten times or fewer.

  The same twelve questions are asked for seven substances, in seven schemas
  with the same variables (dsm5_alcohol.yaml and the others; the stems are
  alcohol_, cannabis_, cocaine_, heroin_, opiate_, sedative_ and
  other_substance_). The first eleven are the DSM-5 criteria; the twelfth,
  legal problems, is a DSM-IV criterion. No count of criteria is stored. Two
  are computed here: the number of yes among the criteria a to k, ever and
  in the last 12 months (0 to 11). A "do not know" leaves the count missing,
  and the legal problems are not counted. No severity band is delivered:
  DSM-5 reads 2 or 3 criteria as mild, 4 or 5 as moderate, 6 or more as
  severe (APA 2013, as stated by Miller et al. 2023 and Choi et al. 2025).
  The application counts the criteria a to k for its own message
  (calcul_sympt, addict.js, lines 448 to 490) and does not store the count.

  The same form is used at inclusion and at the yearly visits (the yearly
  update, no split). The count "ever" is not always kept from one year to
  the next: 38 of the 225 yearly answers of the patients with one criterion
  or more at inclusion give a count of 0.

defaults: {type: item, range: [0, 1], missing: {2: unknown}}

variables:
  cannabis_larger_amounts: {column: cannaba1, label: "Cannabis, criterion a: took larger amounts than intended, ever"}
  cannabis_larger_amounts_12m: {column: cannaba2, label: "Cannabis, criterion a: took larger amounts than intended, in the last 12 months", asked_if: cannabis_larger_amounts}
  cannabis_cut_down: {column: cannabb1, label: "Cannabis, criterion b: tried to cut down or stop, ever"}
  cannabis_cut_down_12m: {column: cannabb2, label: "Cannabis, criterion b: tried to cut down or stop, in the last 12 months", asked_if: cannabis_cut_down}
  cannabis_time_spent: {column: cannabc1, label: "Cannabis, criterion c: spends time obtaining, using or recovering, ever"}
  cannabis_time_spent_12m: {column: cannabc2, label: "Cannabis, criterion c: spends time obtaining, using or recovering, in the last 12 months", asked_if: cannabis_time_spent}
  cannabis_craving: {column: cannabd1, label: "Cannabis, criterion d: craving, ever"}
  cannabis_craving_12m: {column: cannabd2, label: "Cannabis, criterion d: craving, in the last 12 months", asked_if: cannabis_craving}
  cannabis_obligations: {column: cannabe1, label: "Cannabis, criterion e: failed major obligations at work, at home or at school, ever"}
  cannabis_obligations_12m: {column: cannabe2, label: "Cannabis, criterion e: failed major obligations at work, at home or at school, in the last 12 months", asked_if: cannabis_obligations}
  cannabis_interpersonal: {column: cannabf1, label: "Cannabis, criterion f: went on using in spite of interpersonal consequences, ever"}
  cannabis_interpersonal_12m: {column: cannabf2, label: "Cannabis, criterion f: went on using in spite of interpersonal consequences, in the last 12 months", asked_if: cannabis_interpersonal}
  cannabis_activities_given_up: {column: cannabg1, label: "Cannabis, criterion g: gave up social, occupational or leisure activities, ever"}
  cannabis_activities_given_up_12m: {column: cannabg2, label: "Cannabis, criterion g: gave up social, occupational or leisure activities, in the last 12 months", asked_if: cannabis_activities_given_up}
  cannabis_hazardous_use: {column: cannabh1, label: "Cannabis, criterion h: repeated use when it can be dangerous, ever"}
  cannabis_hazardous_use_12m: {column: cannabh2, label: "Cannabis, criterion h: repeated use when it can be dangerous, in the last 12 months", asked_if: cannabis_hazardous_use}
  cannabis_despite_problems: {column: cannabi1, label: "Cannabis, criterion i: went on using in spite of psychological or physical problems it causes, ever"}
  cannabis_despite_problems_12m: {column: cannabi2, label: "Cannabis, criterion i: went on using in spite of psychological or physical problems it causes, in the last 12 months", asked_if: cannabis_despite_problems}
  cannabis_tolerance: {column: cannabj1, label: "Cannabis, criterion j: tolerance, ever"}
  cannabis_tolerance_12m: {column: cannabj2, label: "Cannabis, criterion j: tolerance, in the last 12 months", asked_if: cannabis_tolerance}
  cannabis_withdrawal: {column: cannabk1, label: "Cannabis, criterion k: withdrawal symptoms, or use to avoid them, ever"}
  cannabis_withdrawal_12m: {column: cannabk2, label: "Cannabis, criterion k: withdrawal symptoms, or use to avoid them, in the last 12 months", asked_if: cannabis_withdrawal}
  cannabis_legal_problems: {column: cannabl1, label: "Cannabis, criterion l: legal problems linked to the use, ever"}
  cannabis_legal_problems_12m: {column: cannabl2, label: "Cannabis, criterion l: legal problems linked to the use, in the last 12 months", asked_if: cannabis_legal_problems}

scores:
  cannabis_criteria_count:
    label: "Cannabis: DSM-5 criteria met, ever (criteria a to k, 0 to 11)"
    sum: [cannabis_larger_amounts, cannabis_cut_down, cannabis_time_spent, cannabis_craving, cannabis_obligations, cannabis_interpersonal, cannabis_activities_given_up, cannabis_hazardous_use, cannabis_despite_problems, cannabis_tolerance, cannabis_withdrawal]
    range: [0, 11]
    min_items: 11
  cannabis_criteria_count_12m:
    label: "Cannabis: DSM-5 criteria met, in the last 12 months (criteria a to k, 0 to 11)"
    sum: [cannabis_larger_amounts_12m, cannabis_cut_down_12m, cannabis_time_spent_12m, cannabis_craving_12m, cannabis_obligations_12m, cannabis_interpersonal_12m, cannabis_activities_given_up_12m, cannabis_hazardous_use_12m, cannabis_despite_problems_12m, cannabis_tolerance_12m, cannabis_withdrawal_12m]
    range: [0, 11]
    min_items: 11
