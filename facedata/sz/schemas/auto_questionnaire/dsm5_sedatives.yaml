instrument: dsm5_sedatives
title: "DSM-5 criteria of a use disorder: sedatives"
tab: AUTO-QUESTIONNAIRE
section: "Critères DSM5 de troubles lié à l'usage de: SEDATIF"
status: draft
notes: >
  Twelve criteria of a use disorder for sedatives, answered from 2013 on
  101 visits (61 with one criterion or more). Each criterion is
  asked twice: ever, and in the last 12 months. 1 is yes, 0 is no, and 2 is
  "do not know", read as a missing code.

  The second question is asked after a yes to the first (asked_if): where
  it is empty after a "no" it is 0. The extraction mostly writes it.

  The same twelve questions are asked for seven substances, in seven
  schemas with the same variables (dsm5_alcohol.yaml and the others). The
  first eleven are the DSM-5 criteria; the twelfth, legal problems, is a
  DSM-IV criterion. No count of criteria is stored, and none is computed.

defaults: {type: item, range: [0, 1], missing: {2: unknown}}

variables:
  sedatives_larger_amounts: {column: sedatia1, label: "Sedatives, criterion a: took larger amounts than intended, ever"}
  sedatives_larger_amounts_12m: {column: sedatia2, label: "Sedatives, criterion a: took larger amounts than intended, in the last 12 months", asked_if: sedatives_larger_amounts}
  sedatives_cut_down: {column: sedatib1, label: "Sedatives, criterion b: tried to cut down or stop, ever"}
  sedatives_cut_down_12m: {column: sedatib2, label: "Sedatives, criterion b: tried to cut down or stop, in the last 12 months", asked_if: sedatives_cut_down}
  sedatives_time_spent: {column: sedatic1, label: "Sedatives, criterion c: spends time obtaining, using or recovering, ever"}
  sedatives_time_spent_12m: {column: sedatic2, label: "Sedatives, criterion c: spends time obtaining, using or recovering, in the last 12 months", asked_if: sedatives_time_spent}
  sedatives_craving: {column: sedatid1, label: "Sedatives, criterion d: craving, ever"}
  sedatives_craving_12m: {column: sedatid2, label: "Sedatives, criterion d: craving, in the last 12 months", asked_if: sedatives_craving}
  sedatives_obligations: {column: sedatie1, label: "Sedatives, criterion e: failed major obligations at work, at home or at school, ever"}
  sedatives_obligations_12m: {column: sedatie2, label: "Sedatives, criterion e: failed major obligations at work, at home or at school, in the last 12 months", asked_if: sedatives_obligations}
  sedatives_interpersonal: {column: sedatif1, label: "Sedatives, criterion f: went on using in spite of interpersonal consequences, ever"}
  sedatives_interpersonal_12m: {column: sedatif2, label: "Sedatives, criterion f: went on using in spite of interpersonal consequences, in the last 12 months", asked_if: sedatives_interpersonal}
  sedatives_activities_given_up: {column: sedatig1, label: "Sedatives, criterion g: gave up social, occupational or leisure activities, ever"}
  sedatives_activities_given_up_12m: {column: sedatig2, label: "Sedatives, criterion g: gave up social, occupational or leisure activities, in the last 12 months", asked_if: sedatives_activities_given_up}
  sedatives_hazardous_use: {column: sedatih1, label: "Sedatives, criterion h: repeated use when it can be dangerous, ever"}
  sedatives_hazardous_use_12m: {column: sedatih2, label: "Sedatives, criterion h: repeated use when it can be dangerous, in the last 12 months", asked_if: sedatives_hazardous_use}
  sedatives_despite_problems: {column: sedatii1, label: "Sedatives, criterion i: went on using in spite of psychological or physical problems it causes, ever"}
  sedatives_despite_problems_12m: {column: sedatii2, label: "Sedatives, criterion i: went on using in spite of psychological or physical problems it causes, in the last 12 months", asked_if: sedatives_despite_problems}
  sedatives_tolerance: {column: sedatij1, label: "Sedatives, criterion j: tolerance, ever"}
  sedatives_tolerance_12m: {column: sedatij2, label: "Sedatives, criterion j: tolerance, in the last 12 months", asked_if: sedatives_tolerance}
  sedatives_withdrawal: {column: sedatik1, label: "Sedatives, criterion k: withdrawal symptoms, or use to avoid them, ever"}
  sedatives_withdrawal_12m: {column: sedatik2, label: "Sedatives, criterion k: withdrawal symptoms, or use to avoid them, in the last 12 months", asked_if: sedatives_withdrawal}
  sedatives_legal_problems: {column: sedatil1, label: "Sedatives, criterion l: legal problems linked to the use, ever"}
  sedatives_legal_problems_12m: {column: sedatil2, label: "Sedatives, criterion l: legal problems linked to the use, in the last 12 months", asked_if: sedatives_legal_problems}
