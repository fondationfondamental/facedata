instrument: dsm5_alcohol
title: "DSM-5 criteria of a use disorder: alcohol"
tab: AUTO-QUESTIONNAIRE
section: "Critères DSM5 de troubles lié à l'usage de: ALCOOL"
status: reviewed
notes: >
  Twelve criteria of a use disorder for alcohol, answered from 2012 on 2,042
  visits (589 with one criterion or more). Each criterion is asked twice:
  ever, and in the last 12 months. 1 is yes, 0 is no, and 2 is "do not
  know", read as a missing code.

  The second question is asked after a yes to the first (asked_if). The
  extraction never fills it after a no (0 of 20,731 such cells), so every 0
  of the 12-month criteria comes from asked_if. Under a yes, 8 are empty and
  22 are "do not know".

  The block is shown after a yes to the question "more than ten times in your
  life" of the SUBSTANCES tab (alcohol_over_ten_times; addict.js, lines 50 to
  56). It is not written as a shown_if: the form hides the block but keeps
  what was typed, and 72 delivered cells on 3 visits sit under a no, none
  under an empty answer. A block empty on a visit with a yes to the use
  question was not answered: it stays missing, as it does where the use
  question is empty. After a no (ten times or fewer in the life) the block is
  never asked, and its criteria are 0: asked_if on
  alcohol_over_ten_times_gate, a hidden reader of the SUBSTANCES column
  suoccur_alcoollt (the user's decision of 2026-11-21). 10,752 cells of the
  criteria ever and as many of the 12-month criteria (asked after a yes to
  ever, so 0 too) become 0, on 896 visits; the two counts are 0 there (the
  count ever is filled on 1,960 visits before, 2,856 after). A criterion typed
  under a no is read as typed.

  The same twelve questions are asked for seven substances, in seven schemas
  with the same variables (dsm5_alcohol.yaml and the others; the stems are
  alcohol_, cannabis_, cocaine_, heroin_, opiate_, sedative_ and
  other_substance_). The first eleven are the DSM-5 criteria; the twelfth,
  legal problems, is a DSM-IV criterion. No count of criteria is stored. Two
  are computed here: the number of yes among the criteria a to k, ever and
  in the last 12 months (0 to 11). A "do not know" leaves the count missing,
  and the legal problems are not counted. No severity band is delivered:
  DSM-5 reads 2 or 3 criteria as mild, 4 or 5 as moderate, 6 or more as
  severe (APA 2013, as stated by Miller et al. 2023 and Choi et al. 2025).
  The application counts the criteria a to k for its own message
  (calcul_sympt, addict.js, lines 448 to 490) and does not store the count.

  The same form is used at inclusion and at the yearly visits (the yearly
  update, no split). The count "ever" is not always kept from one year to the
  next: 62 of the 158 yearly answers of the patients with one criterion or
  more at inclusion give a count of 0. With the gate on the use question, 86
  of 182: at 24 yearly visits these patients answer no to "more than ten times
  in your life", although they met a criterion at inclusion: these zeros come
  from the use question, not from the criteria.

defaults: {type: item, range: [0, 1], missing: {2: unknown}}

variables:
  alcohol_over_ten_times_gate: {column: suoccur_alcoollt, codes: {Y: 1, N: 0}, keep: false, label: "Alcohol: more than ten times in your life (the SUBSTANCES tab question, delivered as alcohol_over_ten_times; not delivered here, the gate of the criteria ever)"}
  alcohol_larger_amounts: {column: alcoola1, label: "Alcohol, criterion a: took larger amounts than intended, ever", asked_if: alcohol_over_ten_times_gate}
  alcohol_larger_amounts_12m: {column: alcoola2, label: "Alcohol, criterion a: took larger amounts than intended, in the last 12 months", asked_if: alcohol_larger_amounts}
  alcohol_cut_down: {column: alcoolb1, label: "Alcohol, criterion b: tried to cut down or stop, ever", asked_if: alcohol_over_ten_times_gate}
  alcohol_cut_down_12m: {column: alcoolb2, label: "Alcohol, criterion b: tried to cut down or stop, in the last 12 months", asked_if: alcohol_cut_down}
  alcohol_time_spent: {column: alcoolc1, label: "Alcohol, criterion c: spends time obtaining, using or recovering, ever", asked_if: alcohol_over_ten_times_gate}
  alcohol_time_spent_12m: {column: alcoolc2, label: "Alcohol, criterion c: spends time obtaining, using or recovering, in the last 12 months", asked_if: alcohol_time_spent}
  alcohol_craving: {column: alcoold1, label: "Alcohol, criterion d: craving, ever", asked_if: alcohol_over_ten_times_gate}
  alcohol_craving_12m: {column: alcoold2, label: "Alcohol, criterion d: craving, in the last 12 months", asked_if: alcohol_craving}
  alcohol_obligations: {column: alcoole1, label: "Alcohol, criterion e: failed major obligations at work, at home or at school, ever", asked_if: alcohol_over_ten_times_gate}
  alcohol_obligations_12m: {column: alcoole2, label: "Alcohol, criterion e: failed major obligations at work, at home or at school, in the last 12 months", asked_if: alcohol_obligations}
  alcohol_interpersonal: {column: alcoolf1, label: "Alcohol, criterion f: went on using in spite of interpersonal consequences, ever", asked_if: alcohol_over_ten_times_gate}
  alcohol_interpersonal_12m: {column: alcoolf2, label: "Alcohol, criterion f: went on using in spite of interpersonal consequences, in the last 12 months", asked_if: alcohol_interpersonal}
  alcohol_activities_given_up: {column: alcoolg1, label: "Alcohol, criterion g: gave up social, occupational or leisure activities, ever", asked_if: alcohol_over_ten_times_gate}
  alcohol_activities_given_up_12m: {column: alcoolg2, label: "Alcohol, criterion g: gave up social, occupational or leisure activities, in the last 12 months", asked_if: alcohol_activities_given_up}
  alcohol_hazardous_use: {column: alcoolh1, label: "Alcohol, criterion h: repeated use when it can be dangerous, ever", asked_if: alcohol_over_ten_times_gate}
  alcohol_hazardous_use_12m: {column: alcoolh2, label: "Alcohol, criterion h: repeated use when it can be dangerous, in the last 12 months", asked_if: alcohol_hazardous_use}
  alcohol_despite_problems: {column: alcooli1, label: "Alcohol, criterion i: went on using in spite of psychological or physical problems it causes, ever", asked_if: alcohol_over_ten_times_gate}
  alcohol_despite_problems_12m: {column: alcooli2, label: "Alcohol, criterion i: went on using in spite of psychological or physical problems it causes, in the last 12 months", asked_if: alcohol_despite_problems}
  alcohol_tolerance: {column: alcoolj1, label: "Alcohol, criterion j: tolerance, ever", asked_if: alcohol_over_ten_times_gate}
  alcohol_tolerance_12m: {column: alcoolj2, label: "Alcohol, criterion j: tolerance, in the last 12 months", asked_if: alcohol_tolerance}
  alcohol_withdrawal: {column: alcoolk1, label: "Alcohol, criterion k: withdrawal symptoms, or use to avoid them, ever", asked_if: alcohol_over_ten_times_gate}
  alcohol_withdrawal_12m: {column: alcoolk2, label: "Alcohol, criterion k: withdrawal symptoms, or use to avoid them, in the last 12 months", asked_if: alcohol_withdrawal}
  alcohol_legal_problems: {column: alcooll1, label: "Alcohol, criterion l: legal problems linked to the use, ever", asked_if: alcohol_over_ten_times_gate}
  alcohol_legal_problems_12m: {column: alcooll2, label: "Alcohol, criterion l: legal problems linked to the use, in the last 12 months", asked_if: alcohol_legal_problems}

scores:
  alcohol_criteria_count:
    label: "Alcohol: DSM-5 criteria met, ever (criteria a to k, 0 to 11)"
    sum: [alcohol_larger_amounts, alcohol_cut_down, alcohol_time_spent, alcohol_craving, alcohol_obligations, alcohol_interpersonal, alcohol_activities_given_up, alcohol_hazardous_use, alcohol_despite_problems, alcohol_tolerance, alcohol_withdrawal]
    range: [0, 11]
    min_items: 11
  alcohol_criteria_count_12m:
    label: "Alcohol: DSM-5 criteria met, in the last 12 months (criteria a to k, 0 to 11)"
    sum: [alcohol_larger_amounts_12m, alcohol_cut_down_12m, alcohol_time_spent_12m, alcohol_craving_12m, alcohol_obligations_12m, alcohol_interpersonal_12m, alcohol_activities_given_up_12m, alcohol_hazardous_use_12m, alcohol_despite_problems_12m, alcohol_tolerance_12m, alcohol_withdrawal_12m]
    range: [0, 11]
    min_items: 11
