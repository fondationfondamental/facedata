instrument: wurs
title: Wender Utah Rating Scale, the 25 items that the extraction holds
tab: AUTO-QUESTIONNAIRE
section: Questionnaire WURS
status: draft
notes: >
  Wender Utah Rating Scale, 305 visits from 2012, almost all inclusion
  visits. The extraction holds 25 items, numbered as in the 61-item
  questionnaire, and their sum (wurstot), which equals the sum of the items
  on the 295 visits that have it.

  Which form? In FACE BP the 61-item questionnaire was filled until 2021
  and the 25-item one after, in the same columns, and the form of a visit
  is read from the ALS and the BIS of that visit. SZ has neither, and
  nothing here tells the forms apart: 127 of the visits are dated before
  2021. So this schema does not say "WURS-25" or "WURS-61": it delivers
  the 25 items that both forms have and their sum, under names of its own
  (open question O9 in PROGRESS.md). When the form is known, the visits
  are split like in BP.

