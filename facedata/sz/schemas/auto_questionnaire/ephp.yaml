instrument: ephp
title: "EPHP, assessment of the processes of psychic handicap, filled by someone close to the patient"
tab: AUTO-QUESTIONNAIRE
section: Questionnaire EPHP
status: reviewed
notes: >
  EPHP, filled from 2013 (1,802 visits): 13 items from 0 (great difficulty)
  to 6 (no difficulty), in four domains. The dictionary says that someone
  close to the patient fills it, at V0, V1, V3 and V5; the extraction holds
  it at every yearly visit (V0 953, V1 363, V2 180, V3 173, V4 73, V5 48,
  later visits 12).

  The code 7 is "cannot be assessed": 377 cells on 231 visits, read as a
  missing code in the items (ephp01 to ephp13), and as 0 in the scores.

  Scores. The four stored sub-scores are the sums of their items (1 to 4, 5 to
  8, 9 to 11, 12 and 13), and the total is their sum. The scores count the
  code 7 as 0 points, as the application does since 2026-10-28 (the commit
  "score non-evaluable answers as zero"; A80 of docs/EXPORT_REQUESTS.md): the
  user's decision of 2026-11-21. They add up hidden copies of the items
  (ephp01_scored to ephp13_scored, keep: false) that keep the 7 (missing: {})
  and count it 0 (points); the items themselves are delivered with the 7 as
  missing. A sum needs all its items, so the 17 visits with an item empty for
  another reason have no score (and no stored score).

  Since 0 means great difficulty, a score leans toward the worst rating where
  an item could not be assessed. No published rule for a non-evaluable item
  was found: the article (Passerieux, Bulot and Hardy-Baylé, Alter 2012) could
  not be read and no other source gives the scoring (literature check
  2026-11-21). The scores gain a value on the visits with a 7: cognition 66
  (1,727 to 1,793 visits), motivation 118 (1,673 to 1,791), communication 87
  (1,704 to 1,791), self-assessment 46 (1,748 to 1,794), total 228 (1,557 to
  1,785).

  The stored scores stay the check. Until 2026-10-28 the EMR script counted
  the 7 as 7 points, and every stored score of the extraction was computed so:
  the total is the sum with the 7 on 224 of the 225 visits with a 7 and a
  stored total, and 16 stored totals are above the maximum of 78 (up to 82).
  These visits get score_mismatch (total 4 to 229, cognition 2 to 67,
  motivation 2 to 120, communication 1 to 87, self-assessment 1 to 45); the
  score_not_recomputed of the stored scores (225 on the total) are gone.
  Outside the 7 the scores match the stored ones but for 1 to 4 visits each.

defaults: {type: item, range: [0, 6], missing: {7: not_applicable}}

