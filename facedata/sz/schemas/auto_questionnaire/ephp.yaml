    compare: ephp_self_assessment_stored
  ephp_total:
    label: "EPHP total (13 items, 0 to 78, higher is less handicap)"
    sum: [ephp_cognition, ephp_motivation, ephp_social_cognition, ephp_self_assessment]
    compare: ephp_total_stored
