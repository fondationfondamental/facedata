instrument: stori
title: Stages of Recovery Instrument (STORI)
tab: AUTO-QUESTIONNAIRE
section: Questionnaire STORI
status: reviewed
notes: >
  Stages of Recovery Instrument, filled from 2012 (3,145 visits, 1,361 at
  inclusion): 50 statements from 0 (not at all true now) to 5 (completely true
  now), about the present, ten for each of the five stages of recovery, in
  turn: items 1, 6, 11... are stage 1, items 2, 7, 12... stage 2, and so on.

  The 50 items are not in the dictionary's list of columns, which names them
  in one line as a range. The five stored totals are the sums of their ten
  items but for 1 to 4 visits each (score_mismatch: 2, 2, 1, 1 and 4). 62 to
  66 visits per stage have the items and no stored total (the totals are
  computed on a button): the recomputed stage is delivered there. The stage
  names are those of the published instrument. The form's box "done / not
  done" (rad_stori_nf) is not in the extraction (export request R152).

defaults: {type: item, range: [0, 5]}

