instrument: psqi
title: Pittsburgh Sleep Quality Index (PSQI)
tab: AUTO-QUESTIONNAIRE
section: Questionnaire PSQI
status: reviewed
notes: >
  Pittsburgh Sleep Quality Index, about the past month (30 days), filled from
  2012 on 3,234 visits. The BP schema, where the notes give the rules, with
  the steps below. The minutes to fall asleep multiplied by 60 are divided (15
  unit_inferred), a bedtime typed in that field is out of range (1), and 26
  durations written like a time ("0:30") end unparsed. The minutes are not
  winsorised (winsor: false): the default limits brought 15 values above 180
  minutes down to 180, and they are real answers.

  Components. The duration (component 3) is delivered as stored. The latency
  (2), the efficiency (4), the disturbances (5) and the daytime dysfunction
  (7) are computed here by functions of custom.py from the items, and the
  stored component is the check. The stored latency and efficiency use the
  minutes and the bedtime as typed: the latency differs on 15 visits and the
  efficiency on 104 (the 109 visits with a bedtime written on a 12-hour clock
  are corrected here; D43, BP D132), and the stored total is higher than ours
  on 106. 35 stored totals have no recomputed total (an item is missing), 26
  stored latency components none (the 26 durations written like a time are
  unparsed) and 13 stored efficiencies none (11 visits with the same bedtime
  and rising time, so no hours in bed, and 2 with the hours of sleep out of
  range): score_not_recomputed. A bedtime of 24:00 is delivered as 24.0 (20
  visits), where the BP export writes 0: the efficiency is the same, and no
  conversion of the 24:xx bedtimes is written (the SZ form has no 24-hour
  warning: A75 of docs/EXPORT_REQUESTS.md).

  Disturbances and a blank 5j. The component adds the items 5b to 5j. Item 5j
  (another reason, how often) is blank on 70 visits, against 12 to 39 for each
  of the other items of question 5. The score step of the export is a strict
  sum of 5b to 5j and its definition lists the SZ table, so the stored
  component is empty on the 45 visits whose items 5b to 5i are answered and 5j
  is blank. The package reads a blank 5j as 0 and computes the component
  there: 45 more components and 35 more totals. Where the stored component
  exists, ours equals it (no score_mismatch). The published treatment of a
  blank 5j is to verify. The text of the other reason (psqi05k) is shown only
  after a 5j of 1, 2 or 3 (shown_if): none of its 608 texts is hidden.

  The SZ extraction also holds the questions about the bed partner, which BP
  does not have: psqi10 (none, or a partner in the same room or bed, 0 to 3)
  and psqi10a to psqi10d (the dictionary does not list them), shown by the
  form only when psqi10 is 1, 2 or 3 (shown_if; no cell is hidden in SZ). They
  are delivered and are not part of the score. The column psqi10e of SZ holds
  the free text of "other restlessness" only: it is called psqi10f here, as
  the text of the same question is in the DR and ASP schemas, where psqi10e is
  the 0 to 3 answer of that question.

  Not loaded: psqi15 and psqi16, copies of items 6 and 7 on every row
  (ignored.yaml), as in BP. The form's box "done / not done" (rad_psqi_nf) is
  not in the extraction (export request R152).

defaults: {type: item, range: [0, 3]}

variables:
  psqi_bedtime: {column: psqi01, type: time, label: Usual bedtime (hours), range: [0, 24]}
  psqi_latency:
    column: psqi02
    type: number
    label: Minutes to fall asleep
    unit: min
    units:
      min: {factor: 1, expect: [0, 240.01]}
      "min x 60": {factor: 0.0166667, expect: [240.01, 1260]}
      "min x 60, long": {factor: 0.0166667, expect: [1440, 4501]}
    range: [0, 240]
    winsor: false
  psqi_rising_time: {column: psqi03, type: time, label: Usual rising time (hours), range: [0, 24]}
  psqi_sleep_hours: {column: psqi04, type: time, label: Hours of sleep per night, range: [0, 24]}
  psqi05a: {label: "Vous n’êtes pas arrivé(e) à vous endormir en 30 minutes"}
  psqi05b: {label: "Vous vous êtes réveillé(e) au milieu de la nuit ou plus tôt que..."}
  psqi05c: {label: "Vous avez dû vous lever pour aller aux toilettes"}
  psqi05d: {label: "Vous avez eu du mal à respirer"}
  psqi05e: {label: "Vous avez toussé ou ronflé bruyamment"}
  psqi05f: {label: "Vous avez eu trop froid"}
  psqi05g: {label: "Vous avez eu trop chaud"}
  psqi05h: {label: "Vous avez fait des cauchemars"}
  psqi05i: {label: "Vous avez eu des douleurs"}
  psqi05j: {label: "Combien de fois, au cours des 30 derniers jours, avez-vous eu des..."}
  psqi05k: {type: text, label: "Other reason for troubled sleep, as written", shown_if: {psqi05j: [1, 2, 3]}}
  psqi06: {label: "Comment qualifieriez-vous la qualité de votre sommeil en général au..."}
  psqi07: {label: "Au cours des 30 derniers jours, combien de fois avez-vous pris des..."}
  psqi08: {label: "Au cours des 30 derniers jours, combien de fois avez-vous eu des..."}
  psqi09: {label: "Au cours des 30 derniers jours, combien vous a-t-il été difficile..."}

  # The questions about the bed partner, which the BP extraction does not hold. Not part of the score.
  psqi10: {label: "Has a bed partner or a room mate (0 none to 3 in the same bed)"}
  psqi10a: {label: "As seen by the partner: loud snoring", shown_if: {psqi10: [1, 2, 3]}}
  psqi10b: {label: "As seen by the partner: long pauses between breaths while asleep", shown_if: {psqi10: [1, 2, 3]}}
  psqi10c: {label: "As seen by the partner: legs twitching or jerking while asleep", shown_if: {psqi10: [1, 2, 3]}}
  psqi10d: {label: "As seen by the partner: episodes of disorientation or confusion during sleep", shown_if: {psqi10: [1, 2, 3]}}
  psqi10f: {column: psqi10e, type: text, label: "As seen by the partner: other restlessness, as written", shown_if: {psqi10: [1, 2, 3]}}

  # Component scores as stored, 0 to 3.
  psqi_efficiency_stored: {column: psqi11, label: Component 4 as stored (hours in bed from the bedtime typed as written), keep: false}
  psqi_duration: {column: psqi12, label: "Component 3 - sleep duration, as stored (7 hours or more counts 0)"}
  psqi_disturbances_stored: {column: psqi13, label: Component 5 as stored, keep: false}
  psqi_latency_stored: {column: psqi14, label: Component 2 as stored, keep: false}
  psqi_dysfunction_stored: {column: psqi17, label: Component 7 as stored, keep: false}
  psqi_stored: {column: psqi_, label: PSQI total as stored, range: [0, 21], keep: false}

scores:
  psqi_disturbances:
    label: Component 5 - sleep disturbances
    custom: psqi_disturbances
    compare: psqi_disturbances_stored
  psqi_dysfunction:
    label: Component 7 - daytime dysfunction
    custom: psqi_dysfunction
    compare: psqi_dysfunction_stored
  psqi_latency_component:
    label: Component 2 - sleep latency
    custom: psqi_latency
    compare: psqi_latency_stored
  psqi_efficiency:
    label: Component 4 - habitual sleep efficiency
    custom: psqi_efficiency
    compare: psqi_efficiency_stored
  psqi_total:
    label: PSQI total (0 to 21, higher is worse)
    sum: [psqi06, psqi_latency_component, psqi_duration, psqi_efficiency,
          psqi_disturbances, psqi07, psqi_dysfunction]
    compare: psqi_stored
