instrument: non_drug_fu
title: Non-drug treatments since the last visit
tab: TRAITEMENTS
section: Traitement non pharmacologique
status: draft
notes: >
  At the follow-up visits, never at the inclusion: did the patient have a
  non-drug treatment since the last visit, then one yes/no per treatment.
  2,297 visits answer the first question (836 yes, 40 "Ne sais pas"). 1 is
  yes, 0 is no; "Ne sais pas" is a missing code.

  The treatments are answered after a yes to the first question, and the
  five contents of the cognitive behavioural therapy after a yes to that
  therapy (last answered in July 2019). After a "no" they are delivered as 0
  (asked_if).

  Boxes of one list (box_list, D124). After a yes, some raters tick only the
  treatments received and leave the other boxes empty. An empty box beside a
  ticked box of the same list is read as no: 722 boxes on 163 visits among
  the seven treatments of the current form, and 138 boxes on 56 visits among
  the five contents of the cognitive behavioural therapy, a list of their
  own. Where all seven treatments are empty after a yes (50 visits), they
  stay missing. 79 visits say yes and then no to all seven; they are
  delivered as recorded.

  "Another treatment" is not in the list: the form dropped it in 2019. It
  was last answered in August 2019, and none of the 390 yes visits from 2020
  answer it: since then it is 0 after a "no" to the first question and
  missing after a yes.

  The same questions as in FACE BP for the first one, the electroconvulsive
  therapy, the magnetic stimulation, the cognitive behavioural therapy and
  "another treatment", under the same names, in columns without the suffix
  _sem. The SZ form has no number of sessions and no dates, and asks about
  cognitive remediation, the psychodynamic approach, family therapy and
  family psychoeducation instead of the psychoeducation group and the IPSRT
  of BP.

