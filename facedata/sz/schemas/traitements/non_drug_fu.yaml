instrument: non_drug_fu
title: Non-drug treatments since the last visit
tab: TRAITEMENTS
section: Traitement non pharmacologique
status: draft
notes: >
  At the follow-up visits (2,297): did the patient have a non-drug treatment
  since the last visit (836 yes), then one yes/no per treatment. 1 is yes,
  0 is no; "Ne sais pas" is a missing code.

  The treatments are answered after a yes to the first question, and the
  five contents of the cognitive behavioural therapy after a yes to that
  therapy (asked until 2019). After a "no" they are delivered as 0
  (asked_if).

  The same questions as in FACE BP for the first one, the
  electroconvulsive therapy, the magnetic stimulation, the cognitive
  behavioural therapy and "another treatment", under the same names, in
  columns without the suffix _sem. The SZ form has no number of sessions
  and no dates, and asks about cognitive remediation, the psychodynamic
  approach, family therapy and family psychoeducation instead of the
  psychoeducation group and the IPSRT of BP.

