instrument: wais3_arithmetique
title: WAIS-III arithmetic
tab: NEUROPSYCHOLOGIE
section: Arithmétique (WAIS-3) ancienne version
status: reviewed
notes: >
  WAIS-III and WAIS-IV are two instruments stored in the same columns
  (decision D10 of the BP file). This schema reads the arithmetic columns on
  the WAIS-III visits (533 visits, from 2010 to 2015): 20 items, the last two
  scored 0 to 2 (a point for speed). wais4_arithmetique.yaml reads the WAIS-IV
  visits.

  Edition rule (decision D138, question O16): the 33 visits that the form
  labels WAIS-III and that hold the WAIS-IV digit-span sequencing task
  (columns mcoc_w and mcocemp_w) are read as WAIS-IV (override in the version
  block, flag version_overridden). 25 of them hold arithmetic items and are
  read in wais4_arithmetique.yaml, not here.

  All 533 visits have the 20 items. The stored raw total is their sum on 532
  of 532 visits (one visit has no stored total, and the recomputed one is
  delivered). The z-score is (scaled score - 10) / 3 on every visit.

  No stopping rule shows in the data: no visit has an empty item. A total with
  an empty item would not be computed, as in the application ('Questionnaire
  incomplet').

  FACE BP does not have this subtest.

  Scaled score and z-score (decision of 18 November 2026). Recomputed from
  the raw total in the application's own norm table
  (norms/wais3_arithmetic.csv, 12 age groups read from the scripts of the
  EMR; not part of the repository) and delivered; the stored ones are read
  as checks (keep: false) and a difference is score_mismatch on the
  delivered score. The EMR read its table with the age typed in the form
  (cclin01_); the package uses that age where it is within one year of the
  age at the visit, else the age at the visit (age: wais3_arith_age). The
  z-score is (scaled score - 10) / 3 (tolerance 0.006). On the 532 visits
  that have a stored and a recomputed scaled score, 2 differ (before 2013),
  both with a typed age more than a year from the age at the visit (read
  with the typed age as it stands the table gives the stored score on all
  531 visits that have a typed age). The z-score differs on the same 2. The
  typed age is within a year of the age at the visit on 515 of the 533
  visits that have a total, farther on 17 and missing on 1. Two typed ages
  written 'NN ans' are unparsed; the age at the visit is used where the
  typed one is not read (1 of the 2 visits have this subtest).

version:
  name: wais_version
  column: wais_version
  codes: {WAIS3: wais3, WAIS4: wais4}
  override: {wais4: [mcoc_w, mcocemp_w]}

defaults: {type: item, range: [0, 1], versions: [wais3]}

variables:
  wais3_arith01: {column: arith01_w, label: Arithmetic item 1}
  wais3_arith02: {column: arith02_w, label: Arithmetic item 2}
  wais3_arith03: {column: arith03_w, label: Arithmetic item 3}
  wais3_arith04: {column: arith04_w, label: Arithmetic item 4}
  wais3_arith05: {column: arith05_w, label: Arithmetic item 5}
  wais3_arith06: {column: arith06_w, label: Arithmetic item 6}
  wais3_arith07: {column: arith07_w, label: Arithmetic item 7}
  wais3_arith08: {column: arith08_w, label: Arithmetic item 8}
  wais3_arith09: {column: arith09_w, label: Arithmetic item 9}
  wais3_arith10: {column: arith10_w, label: Arithmetic item 10}
  wais3_arith11: {column: arith11_w, label: Arithmetic item 11}
  wais3_arith12: {column: arith12_w, label: Arithmetic item 12}
  wais3_arith13: {column: arith13_w, label: Arithmetic item 13}
  wais3_arith14: {column: arith14_w, label: Arithmetic item 14}
  wais3_arith15: {column: arith15_w, label: Arithmetic item 15}
  wais3_arith16: {column: arith16_w, label: Arithmetic item 16}
  wais3_arith17: {column: arith17_w, label: Arithmetic item 17}
  wais3_arith18: {column: arith18_w, label: Arithmetic item 18}
  wais3_arith19: {column: arith19_w, label: Arithmetic item 19, range: [0, 2]}
  wais3_arith20: {column: arith20_w, label: Arithmetic item 20, range: [0, 2]}
  wais3_arith_total_stored: {column: arithtot_w, label: Raw total as stored, range: [0, 22], keep: false}
  wais3_arith_age: {column: cclin01_, type: number, range: [15, 100], winsor: false, keep: false, label: "Age typed in the form, the age the EMR read its table with"}
  wais3_arith_scaled_stored: {column: arithstd_w, label: Age-scaled score as stored, range: [1, 19], keep: false}
  wais3_arith_z_stored: {column: arithcr_w, label: "Scaled score as a z-score, as stored", type: number, range: [-3, 3], winsor: false, keep: false}

scores:
  wais3_arith_total:
    label: Arithmetic raw total (20 items)
    sum: [wais3_arith01, wais3_arith02, wais3_arith03, wais3_arith04, wais3_arith05,
          wais3_arith06, wais3_arith07, wais3_arith08, wais3_arith09, wais3_arith10,
          wais3_arith11, wais3_arith12, wais3_arith13, wais3_arith14, wais3_arith15,
          wais3_arith16, wais3_arith17, wais3_arith18, wais3_arith19, wais3_arith20]
    compare: wais3_arith_total_stored
  wais3_arith_scaled:
    label: Age-scaled score (mean 10 and SD 3)
    lookup: wais3_arithmetic
    from: wais3_arith_total
    age: wais3_arith_age
    range: [1, 19]
    compare: wais3_arith_scaled_stored
  wais3_arith_z:
    label: Scaled score as a z-score, (scaled score - 10) / 3
    sum: [wais3_arith_scaled]
    scale: [0.3333333, -3.3333333]
    compare: wais3_arith_z_stored
    compare_tolerance: 0.006
