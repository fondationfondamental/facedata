instrument: wais3_similitudes
title: WAIS-III similarities
tab: NEUROPSYCHOLOGIE
section: Similitudes (WAIS-3) ancienne version
status: reviewed
notes: >
  WAIS-III and WAIS-IV are two instruments stored in the same columns
  (decision D10 of the BP file). This schema reads the similarities columns on
  the WAIS-III visits (545 visits, from 2010 to 2015): 19 items scored 0 to 2.
  wais4_similitudes.yaml reads the WAIS-IV visits. The 19 item columns are not
  in the dictionary.

  Edition rule (decision D138, question O16). The form labels 33 visits
  WAIS-III although they hold the WAIS-IV digit-span sequencing task (the
  columns mcoc_w and mcocemp_w, which only the WAIS-IV has). They are read as
  WAIS-IV: the version block lists the two columns under override, and the
  visits get the flag version_overridden. 25 of them hold similarities items
  and are read in wais4_similitudes.yaml. Read here, as they were before the
  rule, they gave 18 of the 20 mismatches of the scaled score and all 12
  mismatches of the raw total (24 of the 25 visits with empty items were these
  WAIS-IV tests).

  Of the 545 visits, 544 have all 19 items and a stored raw total, which is
  the sum of the 19 items on 544 of 544; the 545th has 14 items and no stored
  total, and gets none (the application adds the 19 items and writes
  'Questionnaire incomplet' when one is empty). The z-score is (scaled score -
  10) / 3 on every visit.

  No stopping rule shows in the data: item 19 is filled on 544 of the 545
  visits, and the items are not left empty after failures.

  FACE BP has no WAIS-III similarities: its WAIS-III battery has the
  vocabulary test instead.

  Scaled score and z-score (decision of 18 November 2026). Recomputed from the
  raw total in the application's own norm table (norms/wais3_similarities.csv,
  12 age groups read from the scripts of the EMR; not part of the repository)
  and delivered; the stored ones are read as checks (keep: false) and a
  difference is score_mismatch on the delivered score. The EMR read its table
  with the age typed in the form (cclin01_); the package uses that age where
  it is within one year of the age at the visit, else the age at the visit
  (age: wais3_simil_age). The z-score is (scaled score - 10) / 3 (tolerance
  0.006). On the 544 visits that have both, 2 differ (before 2013), both with
  a typed age more than a year from the age at the visit (read with the typed
  age as it stands the table gives the stored score on all 542 visits that
  have a typed age). The z-score differs on the same 2. The typed age is
  within a year of the age at the visit on 527 of the 544 visits that have a
  total, farther on 15 and missing on 2. Two typed ages written 'NN ans' are
  unparsed; the age at the visit is used where the typed one is not read (2
  of the 2 visits have this subtest). Centre E (22 visits) has a scaled
  score of 11.5 against 8.4 in the others (1 SD above), on 5 of the 19 items
  (11, 13, 14, 16 and 18), while its other subtests stay within 1.0 point of
  the cohort: a scoring habit of the similarities items in a small centre,
  not a step in the table or in time.

version:
  name: wais_version
  column: wais_version
  codes: {WAIS3: wais3, WAIS4: wais4}
  override: {wais4: [mcoc_w, mcocemp_w]}

defaults: {type: item, range: [0, 2], versions: [wais3]}

variables:
  wais3_simil01: {column: simil01_w, label: Similarities item 1}
  wais3_simil02: {column: simil02_w, label: Similarities item 2}
  wais3_simil03: {column: simil03_w, label: Similarities item 3}
  wais3_simil04: {column: simil04_w, label: Similarities item 4}
  wais3_simil05: {column: simil05_w, label: Similarities item 5}
  wais3_simil06: {column: simil06_w, label: Similarities item 6}
  wais3_simil07: {column: simil07_w, label: Similarities item 7}
  wais3_simil08: {column: simil08_w, label: Similarities item 8}
  wais3_simil09: {column: simil09_w, label: Similarities item 9}
  wais3_simil10: {column: simil10_w, label: Similarities item 10}
  wais3_simil11: {column: simil11_w, label: Similarities item 11}
  wais3_simil12: {column: simil12_w, label: Similarities item 12}
  wais3_simil13: {column: simil13_w, label: Similarities item 13}
  wais3_simil14: {column: simil14_w, label: Similarities item 14}
  wais3_simil15: {column: simil15_w, label: Similarities item 15}
  wais3_simil16: {column: simil16_w, label: Similarities item 16}
  wais3_simil17: {column: simil17_w, label: Similarities item 17}
  wais3_simil18: {column: simil18_w, label: Similarities item 18}
  wais3_simil19: {column: simil19_w, label: Similarities item 19}
  wais3_simil_total_stored: {column: similtot_w, label: Raw total as stored, range: [0, 33], keep: false}
  wais3_simil_age: {column: cclin01_, type: number, range: [15, 100], winsor: false, keep: false, label: "Age typed in the form, the age the EMR read its table with"}
  wais3_simil_scaled_stored: {column: similstd_w, label: Age-scaled score as stored, range: [1, 19], keep: false}
  wais3_simil_z_stored: {column: similcr_w, label: "Scaled score as a z-score, as stored", type: number, range: [-3, 3], winsor: false, keep: false}

scores:
  wais3_simil_total:
    label: Similarities raw total (19 items)
    sum: [wais3_simil01, wais3_simil02, wais3_simil03, wais3_simil04, wais3_simil05,
          wais3_simil06, wais3_simil07, wais3_simil08, wais3_simil09, wais3_simil10,
          wais3_simil11, wais3_simil12, wais3_simil13, wais3_simil14, wais3_simil15,
          wais3_simil16, wais3_simil17, wais3_simil18, wais3_simil19]
    compare: wais3_simil_total_stored
  wais3_simil_scaled:
    label: Age-scaled score (mean 10 and SD 3)
    lookup: wais3_similarities
    from: wais3_simil_total
    age: wais3_simil_age
    range: [1, 19]
    compare: wais3_simil_scaled_stored
  wais3_simil_z:
    label: Scaled score as a z-score, (scaled score - 10) / 3
    sum: [wais3_simil_scaled]
    scale: [0.3333333, -3.3333333]
    compare: wais3_simil_z_stored
    compare_tolerance: 0.006
