instrument: wais4_arithmetique
title: WAIS-IV arithmetic
tab: NEUROPSYCHOLOGIE
section: Arithmétique (WAIS-4) nouvelle version
status: reviewed
notes: >
  WAIS-III and WAIS-IV are two instruments stored in the same columns
  (decision D10 of the BP file). This schema reads the arithmetic columns on
  the WAIS-IV visits (489 visits, from 2013 to 2025): 22 items scored 0 or 1.
  wais3_arithmetique.yaml reads the WAIS-III visits.

  Edition rule (decision D138, question O16): the 33 visits that the form
  labels WAIS-III and that hold the WAIS-IV digit-span sequencing task
  (columns mcoc_w and mcocemp_w) are read as WAIS-IV (override in the version
  block, flag version_overridden). 25 of them hold arithmetic items and are
  read here, not in wais3_arithmetique.yaml.

  Of the 489 visits, 475 have all 22 items and a stored raw total, which is
  their sum on 475 of 475. 14 visits have empty items (the last item filled is
  0 on 13 of them, the mark of a stopping rule): 1 has a stored total, equal
  to the sum of the items present, which cannot be recomputed
  (score_not_recomputed), and 13 have none. The application adds the 22 items
  and writes 'Questionnaire incomplet' when one is empty. The first four items
  are 1 on 480 of the 480 visits that have them: the test starts further on
  and credits them. The z-score is (scaled score - 10) / 3 on every visit.

  FACE BP does not have this subtest.

  Scaled score and z-score. They are recomputed and delivered (decision of
  the project lead for the standard scores of the neuropsychological tests):
  the scaled score is read in the WAIS-IV table of the application
  (norms/wais4_arithmetic.csv) from the raw total of the items, and the
  z-score is (scaled score - 10) / 3. The table is read with the age typed
  in the form (cclin01_, delivered as neuropsy_age by neuropsy_conditions)
  where it is within 1 year of the age at the visit, and with the age at the
  visit elsewhere (462 of the 475 visits that have a total use the typed
  age, 13 have a typed age more than 1 year away). The stored scores are
  wais4_arith_scaled_stored and wais4_arith_z_stored, not delivered.
  Verified: the scaled score differs from the stored one on 3 of the 475
  visits that have both, and so does its z-score (score_mismatch, 2 in 2016
  to 2018 and 1 from 2024); no total gives norm_missing; the stored total
  that cannot be recomputed gives score_not_recomputed on the total, the
  scaled score and the z-score. Items 21 and 22 are filled on 2 visits
  labelled WAIS-III that hold no sequencing task, so the edition rule leaves
  them there: they are read as WAIS-III and the 2 cells of each item are not
  delivered.

version:
  name: wais_version
  column: wais_version
  codes: {WAIS3: wais3, WAIS4: wais4}
  override: {wais4: [mcoc_w, mcocemp_w]}

defaults: {type: item, range: [0, 1], versions: [wais4]}

variables:
  wais4_arith_age_entered: {column: cclin01_, label: Age typed in the form (the norms were read with it), type: number, range: [15, 100], winsor: false, keep: false}
  wais4_arith01: {column: arith01_w, label: Arithmetic item 1}
  wais4_arith02: {column: arith02_w, label: Arithmetic item 2}
  wais4_arith03: {column: arith03_w, label: Arithmetic item 3}
  wais4_arith04: {column: arith04_w, label: Arithmetic item 4}
  wais4_arith05: {column: arith05_w, label: Arithmetic item 5}
  wais4_arith06: {column: arith06_w, label: Arithmetic item 6}
  wais4_arith07: {column: arith07_w, label: Arithmetic item 7}
  wais4_arith08: {column: arith08_w, label: Arithmetic item 8}
  wais4_arith09: {column: arith09_w, label: Arithmetic item 9}
  wais4_arith10: {column: arith10_w, label: Arithmetic item 10}
  wais4_arith11: {column: arith11_w, label: Arithmetic item 11}
  wais4_arith12: {column: arith12_w, label: Arithmetic item 12}
  wais4_arith13: {column: arith13_w, label: Arithmetic item 13}
  wais4_arith14: {column: arith14_w, label: Arithmetic item 14}
  wais4_arith15: {column: arith15_w, label: Arithmetic item 15}
  wais4_arith16: {column: arith16_w, label: Arithmetic item 16}
  wais4_arith17: {column: arith17_w, label: Arithmetic item 17}
  wais4_arith18: {column: arith18_w, label: Arithmetic item 18}
  wais4_arith19: {column: arith19_w, label: Arithmetic item 19}
  wais4_arith20: {column: arith20_w, label: Arithmetic item 20}
  wais4_arith21: {column: arith21_w, label: Arithmetic item 21}
  wais4_arith22: {column: arith22_w, label: Arithmetic item 22}
  wais4_arith_total_stored: {column: arithtot_w, label: Raw total as stored, range: [0, 22], keep: false}
  wais4_arith_scaled_stored: {column: arithstd_w, label: Age-scaled score (mean 10 and SD 3) as stored, range: [1, 19], keep: false}
  wais4_arith_z_stored: {column: arithcr_w, label: Scaled score as a z-score as stored, type: number, range: [-3, 3], winsor: false, keep: false}

scores:
  wais4_arith_total:
    label: Arithmetic raw total (22 items)
    sum: [wais4_arith01, wais4_arith02, wais4_arith03, wais4_arith04, wais4_arith05,
          wais4_arith06, wais4_arith07, wais4_arith08, wais4_arith09, wais4_arith10,
          wais4_arith11, wais4_arith12, wais4_arith13, wais4_arith14, wais4_arith15,
          wais4_arith16, wais4_arith17, wais4_arith18, wais4_arith19, wais4_arith20,
          wais4_arith21, wais4_arith22]
    compare: wais4_arith_total_stored
  wais4_arith_scaled:
    label: Age-scaled score (mean 10 and SD 3), read in the table of the manual
    lookup: wais4_arithmetic
    from: wais4_arith_total
    age: wais4_arith_age_entered
    range: [1, 19]
    compare: wais4_arith_scaled_stored
  wais4_arith_z:
    label: Scaled score as a z-score, (scaled score - 10) / 3
    sum: [wais4_arith_scaled]
    scale: [0.3333333, -3.3333333]
    range: [-3, 3]
    compare: wais4_arith_z_stored
    compare_tolerance: 0.006
