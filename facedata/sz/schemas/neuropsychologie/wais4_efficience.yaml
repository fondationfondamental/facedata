instrument: wais4_efficience
title: WAIS-IV intellectual efficiency (estimated indices)
tab: NEUROPSYCHOLOGIE
section: Efficience intellectuelle (WAIS-4) - nouvelle version (données à partir de juin 2015)
status: draft
notes: >
  The indices that the EMR estimated from the seven WAIS-IV subtests of the
  battery, on the WAIS-IV visits. Two periods. From 2015 to 2018 the seven
  subtests were given and the four indices and the full-scale IQ are filled
  (about 450 visits). From 2019 the battery keeps similarities, matrices and
  digit span, and the only estimate is the two-subtest IQ that the dictionary
  calls "Denney 2015" (538 visits, 2016 to 2026). It is stored for 41% to 68%
  of the inclusions of 2019 to 2021 and for 10% to 28% of those of 2022 to
  2026, while its subtests are still done (open question O28 in PROGRESS.md).

  The dictionary gives no formula. In the data, on the visits where the scaled
  scores are there: verbal comprehension sum = 1.5 x (similarities +
  information) (455 of 456), perceptual reasoning sum = 1.5 x (matrices +
  picture completion) (451 of 451), working memory sum = digit span +
  arithmetic (445 of 447), full-scale sum = 10/7 x the sum of the seven scaled
  scores (428 of 430). The scaled scores are in other schemas: the sums are recomputed from the
  scaled scores that those schemas deliver (uses), and the stored sums are
  checks (wais4_*_sum_scaled_stored, not delivered);
  tests/test_real_data_sz.py checks the formulas. The stored sums were built
  on stored scaled scores: 6 of 455 verbal comprehension sums and 7 of 429
  full-scale sums differ from the recomputed ones (score_mismatch), each on
  a visit where one stored scaled score (information on 5, similarities on
  1, others) differs from the table. Only 1 of the 131 flagged similarities
  visits has a sum: the EMR stored the sums up to 2018 and the similarities
  error starts in 2021. "NaN" in a stored sum is a missing code: a subtest
  was not given. A visit whose stored sum cannot be recomputed (a subtest
  missing) gets no sum and no index (score_not_recomputed).

  Two stored indices are 0.7 and 2.9 lower than the index of the table
  (decision D12, open question O15). The stored working memory index always
  ends in .3 and the stored full-scale IQ in .1, while an index is a whole
  number. Three facts say that the working memory index is 0.7 too low and the
  full-scale IQ 2.9 too low, on every visit, in every year and centre: (1) at
  the centre of the sum, where every index is 100, they are 99.3 and 97.1; (2)
  their percentile ranks are those of the normal curve for the stored value
  plus 0.7 and plus 2.9, as the percentile ranks of the two other indices are
  for their stored value; (3) the Barona difference of the same visit is the
  expected IQ minus the stored IQ plus 2.9 (292 of 293 visits). The verbal
  comprehension and perceptual reasoning indices are right as stored.

  The two-subtest IQ follows the sum of the scaled scores of similarities
  and matrices (about 47.6 + 2.38 x the sum, rounded) on 504 of 536 visits;
  the 32 others, from 2022 to 2026, hold another value. "undefined" is a
  missing code: one of the two subtests was not given. One value of 10 is
  out of range. The cell is empty on 1,293 WAIS-IV visits that have both
  scaled scores.

  The processing speed index is in wais4_code_symboles_ivt.yaml.

  25 visits of 2013 to 2016 labelled WAIS-III hold WAIS-IV indices; they are
  not read here (open question O16).

  Indices. They are read in the tables of the manual and delivered (decision
  of the project lead for the standard scores of the neuropsychological
  tests), from the sum of the recomputed scaled scores of each index
  (norms/wais4_icv.csv, wais4_irp.csv, wais4_imt.csv and wais4_qit.csv, with
  their wais4_*_percentile.csv; the tables are the same in the four
  applications). The stored indices and percentile ranks are
  wais4_*_index_stored, wais4_qit_stored and wais4_*_percentile_stored, not
  delivered. For the working memory index and the full-scale IQ the stored
  value is the table value minus 0.7 and minus 2.9 (compare_offset): the table
  value is delivered. This replaces the correction by +0.7 and +2.9 of the
  stored values.

  Verified: on every visit that has both (456 verbal comprehension, 451
  perceptual reasoning, 447 working memory, 430 full-scale IQ) the stored
  index is the table value (with the two offsets) and the stored percentile
  rank is the table's, to 0.051: no score_mismatch and no norm_missing. A
  percentile of 0.1 or 99.9 is censored (wais4_*_percentile_cens). The
  two-subtest IQ is delivered as stored.

uses: [wais4_simil_scaled, wais4_info_scaled, wais4_mat_scaled, wais4_pc_scaled, wais4_ds_scaled, wais4_arith_scaled, wais4_code_scaled]
version:
  name: wais_version
  column: wais_version
  codes: {WAIS3: wais3, WAIS4: wais4}

defaults: {type: item, versions: [wais4]}

variables:
  wais4_icv_sum_scaled_stored: {column: ei16_wais4, label: "Verbal comprehension sum of scaled scores, 1.5 x (similarities + information), as stored", type: number, range: [3, 57], winsor: false, keep: false}
  wais4_icv_index_stored: {column: ei17_wais4, label: Verbal comprehension index as stored, range: [45, 155], keep: false}
  wais4_icv_percentile_stored: {column: ei18_wais4, label: Percentile rank of the verbal comprehension index as stored, type: number, range: [0, 100], winsor: false, keep: false}
  wais4_irp_sum_scaled_stored: {column: ei19_wais4, label: "Perceptual reasoning sum of scaled scores, 1.5 x (matrices + picture completion), as stored", type: number, range: [3, 57], winsor: false, keep: false}
  wais4_irp_index_stored: {column: ei20_wais4, label: Perceptual reasoning index as stored, range: [45, 155], keep: false}
  wais4_irp_percentile_stored: {column: ei21_wais4, label: Percentile rank of the perceptual reasoning index as stored, type: number, range: [0, 100], winsor: false, keep: false}
  wais4_imt_sum_scaled_stored: {column: imt01_wais4, label: "Working memory sum of scaled scores (digit span + arithmetic), as stored", range: [2, 38], keep: false}
  wais4_imt_index_stored: {column: imt02_wais4, label: "Working memory index, as stored (0.7 too low)", type: number, range: [44.3, 154.3], winsor: false, keep: false}
  wais4_imt_percentile_stored: {column: imt03_wais4, label: Percentile rank of the working memory index as stored, type: number, range: [0, 100], winsor: false, keep: false}
  wais4_qit_sum_scaled_stored: {column: ei22_wais4, label: "Full-scale sum of scaled scores, 10/7 x the seven subtests, as stored", type: number, range: [10, 190], winsor: false, keep: false}
  wais4_qit_stored: {column: ei23_wais4, label: "Estimated full-scale IQ, as stored (2.9 too low)", type: number, range: [37.1, 157.1], winsor: false, keep: false}
  wais4_qit_percentile_stored: {column: ei24_wais4, label: Percentile rank of the full-scale IQ as stored, type: number, range: [0, 100], winsor: false, keep: false}
  wais4_qi_two_subtests: {column: qi_w, label: "IQ estimated from similarities and matrices (Denney 2015)", range: [40, 160], missing: {undefined: not_recorded}}

scores:
  wais4_icv_sum_scaled:
    label: Verbal comprehension, sum of the scaled scores, 1.5 x (similarities + information)
    sum: [wais4_simil_scaled, wais4_info_scaled]
    scale: [1.5, 0]
    range: [3, 57]
    compare: wais4_icv_sum_scaled_stored
    versions: [wais4]
  wais4_irp_sum_scaled:
    label: Perceptual reasoning, sum of the scaled scores, 1.5 x (matrices + picture completion)
    sum: [wais4_mat_scaled, wais4_pc_scaled]
    scale: [1.5, 0]
    range: [3, 57]
    compare: wais4_irp_sum_scaled_stored
    versions: [wais4]
  wais4_imt_sum_scaled:
    label: Working memory, sum of the scaled scores (digit span + arithmetic)
    sum: [wais4_ds_scaled, wais4_arith_scaled]
    range: [2, 38]
    compare: wais4_imt_sum_scaled_stored
    versions: [wais4]
  wais4_qit_sum_scaled:
    label: Full scale, sum of the scaled scores, 10/7 x the seven subtests
    sum: [wais4_simil_scaled, wais4_info_scaled, wais4_mat_scaled, wais4_pc_scaled, wais4_ds_scaled, wais4_arith_scaled, wais4_code_scaled]
    scale: [1.4285714286, 0]
    range: [10, 190]
    compare: wais4_qit_sum_scaled_stored
    compare_tolerance: 0.06
    versions: [wais4]
  wais4_icv_index:
    label: Verbal comprehension index, read in the table of the manual from the sum of the scaled scores
    lookup: wais4_icv
    from: wais4_icv_sum_scaled
    range: [45, 155]
    compare: wais4_icv_index_stored
    versions: [wais4]
  wais4_icv_percentile:
    label: Percentile rank of the verbal comprehension index, read in the table of the manual
    lookup: wais4_icv_percentile
    from: wais4_icv_sum_scaled
    range: [0, 100]
    compare: wais4_icv_percentile_stored
    compare_tolerance: 0.051
    versions: [wais4]
  wais4_irp_index:
    label: Perceptual reasoning index, read in the table of the manual from the sum of the scaled scores
    lookup: wais4_irp
    from: wais4_irp_sum_scaled
    range: [45, 155]
    compare: wais4_irp_index_stored
    versions: [wais4]
  wais4_irp_percentile:
    label: Percentile rank of the perceptual reasoning index, read in the table of the manual
    lookup: wais4_irp_percentile
    from: wais4_irp_sum_scaled
    range: [0, 100]
    compare: wais4_irp_percentile_stored
    compare_tolerance: 0.051
    versions: [wais4]
  wais4_imt_index:
    label: Working memory index, read in the table of the manual (the stored index is 0.7 lower)
    lookup: wais4_imt
    from: wais4_imt_sum_scaled
    range: [50, 150]
    compare: wais4_imt_index_stored
    compare_offset: -0.7
    versions: [wais4]
  wais4_imt_percentile:
    label: Percentile rank of the working memory index, read in the table of the manual
    lookup: wais4_imt_percentile
    from: wais4_imt_sum_scaled
    range: [0, 100]
    compare: wais4_imt_percentile_stored
    compare_tolerance: 0.051
    versions: [wais4]
  wais4_qit:
    label: Estimated full-scale IQ, read in the table of the manual (the stored IQ is 2.9 lower)
    lookup: wais4_qit
    from: wais4_qit_sum_scaled
    range: [40, 160]
    compare: wais4_qit_stored
    compare_offset: -2.9
    versions: [wais4]
  wais4_qit_percentile:
    label: Percentile rank of the full-scale IQ, read in the table of the manual
    lookup: wais4_qit_percentile
    from: wais4_qit_sum_scaled
    range: [0, 100]
    compare: wais4_qit_percentile_stored
    compare_tolerance: 0.051
    versions: [wais4]
