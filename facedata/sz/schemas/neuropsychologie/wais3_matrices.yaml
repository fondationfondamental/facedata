instrument: wais3_matrices
title: WAIS-III matrix reasoning (26 items)
tab: NEUROPSYCHOLOGIE
section: Matrices
status: draft
notes: >
  WAIS-III and WAIS-IV are two instruments stored in the same columns
  (decision D10 of the BP file). This schema reads the columns mat01_w to
  mat26_w on the WAIS-III visits (568 visits, from 2010 to 2016);
  wais4_matrices.yaml reads the WAIS-IV visits.

  The stored raw total equals the sum of the 26 items on 563 of the 567
  visits that have it; the 4 others get score_mismatch.

  Scaled score and z-score (decision of 18 November 2026). Recomputed from
  the raw total in the application's own norm table (norms/wais3_matrices.csv,
  not part of the repository) and delivered; the stored ones are read as
  checks (keep: false), and a difference is score_mismatch on the delivered
  score. The EMR read its table with the age typed in the form (cclin01_);
  the package reads it with that age where it is within one year of the age
  at the visit, else with the age at the visit (age: wais3_mat_age). The
  z-score is (scaled score - 10) / 3. On the 567 visits that have a stored
  and a recomputed scaled score, 21 differ: 15 are among the 33 visits
  labelled WAIS-III that were given the WAIS-IV (question DM-2, O16), where
  the stored score is probably the WAIS-IV one; of the other 6, five have a
  typed age more than a year from the age at the visit (read with the typed
  age as it stands the table gives the stored score on all but one of
  them). The z-score differs on 21.

  Same instrument and same schema as in FACE BP.

version:
  name: wais_version
  column: wais_version
  codes: {WAIS3: wais3, WAIS4: wais4}

defaults: {type: item, range: [0, 1], versions: [wais3]}

variables:
  wais3_mat01: {column: mat01_w, label: Matrices item 1}
  wais3_mat02: {column: mat02_w, label: Matrices item 2}
  wais3_mat03: {column: mat03_w, label: Matrices item 3}
  wais3_mat04: {column: mat04_w, label: Matrices item 4}
  wais3_mat05: {column: mat05_w, label: Matrices item 5}
  wais3_mat06: {column: mat06_w, label: Matrices item 6}
  wais3_mat07: {column: mat07_w, label: Matrices item 7}
  wais3_mat08: {column: mat08_w, label: Matrices item 8}
  wais3_mat09: {column: mat09_w, label: Matrices item 9}
  wais3_mat10: {column: mat10_w, label: Matrices item 10}
  wais3_mat11: {column: mat11_w, label: Matrices item 11}
  wais3_mat12: {column: mat12_w, label: Matrices item 12}
  wais3_mat13: {column: mat13_w, label: Matrices item 13}
  wais3_mat14: {column: mat14_w, label: Matrices item 14}
  wais3_mat15: {column: mat15_w, label: Matrices item 15}
  wais3_mat16: {column: mat16_w, label: Matrices item 16}
  wais3_mat17: {column: mat17_w, label: Matrices item 17}
  wais3_mat18: {column: mat18_w, label: Matrices item 18}
  wais3_mat19: {column: mat19_w, label: Matrices item 19}
  wais3_mat20: {column: mat20_w, label: Matrices item 20}
  wais3_mat21: {column: mat21_w, label: Matrices item 21}
  wais3_mat22: {column: mat22_w, label: Matrices item 22}
  wais3_mat23: {column: mat23_w, label: Matrices item 23}
  wais3_mat24: {column: mat24_w, label: Matrices item 24}
  wais3_mat25: {column: mat25_w, label: Matrices item 25}
  wais3_mat26: {column: mat26_w, label: Matrices item 26}

  wais3_mat_age:           {column: cclin01_, type: number, range: [15, 100], winsor: false, keep: false, label: "Age typed in the form, the age the EMR read its table with"}
  wais3_mat_total_stored:  {column: mat_tot_w, label: Raw total as stored, range: [0, 26], keep: false}
  wais3_mat_scaled_stored: {column: mat_std_w, label: Age-scaled score as stored, range: [1, 19], keep: false}
  wais3_mat_z_stored:      {column: mat_cr_w,  label: "Scaled score as a z-score, as stored", type: number, range: [-3, 3], winsor: false, keep: false}

scores:
  wais3_mat_total:
    label: Matrices raw total (26 items)
    sum: [wais3_mat01, wais3_mat02, wais3_mat03, wais3_mat04, wais3_mat05, wais3_mat06,
          wais3_mat07, wais3_mat08, wais3_mat09, wais3_mat10, wais3_mat11, wais3_mat12,
          wais3_mat13, wais3_mat14, wais3_mat15, wais3_mat16, wais3_mat17, wais3_mat18,
          wais3_mat19, wais3_mat20, wais3_mat21, wais3_mat22, wais3_mat23, wais3_mat24,
          wais3_mat25, wais3_mat26]
    compare: wais3_mat_total_stored
  wais3_mat_scaled:
    label: Age-scaled score (mean 10 and SD 3)
    lookup: wais3_matrices
    from: wais3_mat_total
    age: wais3_mat_age
    range: [1, 19]
    compare: wais3_mat_scaled_stored
  wais3_mat_z:
    label: Scaled score as a z-score, (scaled score - 10) / 3
    sum: [wais3_mat_scaled]
    scale: [0.3333333, -3.3333333]
    compare: wais3_mat_z_stored
    compare_tolerance: 0.006
