instrument: doors_test
title: Doors test (visual recognition memory)
tab: NEUROPSYCHOLOGIE
section: Test des portes
status: draft
notes: >
  Recognition of photographs of doors: part A (12 easy sets) and part B (12
  hard sets), one point per door recognised. 987 visits with a part A from
  2010 to 2018 (one in 2025).

  The total is recomputed here as A + B and equals the stored one on all
  774 visits that have both. Part B holds words on 42 visits ("NA", "non
  réalisé", "DCM": missing codes): the part was not given, and the EMR left
  the total empty. Three scores are above 12 and out of range.

  Percentile bands, recomputed. The percentile of part A, of part B and of
  the total is read again in the norm tables of the application
  (norms/doors_*_band.csv, one band for each score and age group) from the
  score and the age typed in the form (cclin01_), where it is within one year
  of the age at the visit, and from the age at the visit elsewhere. The value
  is the lower limit of the band; a band wider than one step ("75 - 95") is
  read as 75 or more and has <variable>_cens = +1 (censored_right, 83 visits
  for part A). The stored percentiles are kept only as checks
  (doors_*_band_stored, not delivered); a band that differs from the stored
  one is flagged score_mismatch: 2 of 986 visits for part A, 1 of 772 for part
  B and 1 of 769 for the total, all before 2013. The share of each band is
  stable from one period to the next.

  The percentile of part B is "<1" on 172 visits where part B is empty: the
  EMR computed it from an empty cell, as if the score were 0 (the same
  error as for the CVLT recency in FACE BP). So does the percentile of part
  A on one visit. Nothing is delivered for these visits, and they get
  score_not_recomputed (the stored value is in the flag log). Not counting
  them, "<1" is the percentile of 119 visits for part B.

defaults: {type: item, range: [0, 12]}

variables:
  # The age as typed in the form: the application reads the norms of the percentiles with it
  doors_age: {column: cclin01_, type: number, label: "Age at the testing, as entered (years; for the norms)", range: [15, 100], winsor: false, keep: false}
  doors_a: {column: portea_, label: Part A (0 to 12)}
  doors_b: {column: porteb_, label: Part B (0 to 12), missing: {dcm: not_recorded, non réalisé: not_applicable, non realisé: not_applicable}}
  doors_total_stored: {column: porte_, label: "Total, as stored", range: [0, 24], keep: false}
  doors_a_band_stored: {column: porteapc_, label: "Part A as a percentile band, as stored", type: band, limits: [1, 5, 10, 25, 50, 75, 90, 95], keep: false}
  doors_b_band_stored: {column: portebpc_, label: "Part B as a percentile band, as stored", type: band, limits: [1, 5, 10, 25, 50, 75, 90, 95], keep: false}
  doors_total_band_stored: {column: portepc_, label: "Total as a percentile band, as stored", type: band, limits: [1, 5, 10, 25, 50, 75, 90, 95], keep: false}

scores:
  doors_total:
    label: Total (A + B, 0 to 24)
    sum: [doors_a, doors_b]
    compare: doors_total_stored

  # Percentile bands, read in the norm tables of the application (norms/doors_*_band.csv) from the score and the age typed in the form.
  # The value is the lower limit of the band; a band wider than one step has <variable>_cens = +1.
  doors_a_band:
    label: Part A as a percentile band
    lookup: doors_a_band
    from: doors_a
    age: doors_age
    compare: doors_a_band_stored
  doors_b_band:
    label: Part B as a percentile band
    lookup: doors_b_band
    from: doors_b
    age: doors_age
    compare: doors_b_band_stored
  doors_total_band:
    label: Total as a percentile band
    lookup: doors_total_band
    from: doors_total
    age: doors_age
    compare: doors_total_band_stored
