instrument: wais3_sequences_lettres_chiffres
title: WAIS-III letter-number sequencing
tab: NEUROPSYCHOLOGIE
section: Séquences Lettres-Chiffres (WAIS-3) ancienne version
status: reviewed
notes: >
  A WAIS-III subtest, filled from 2010 to 2015 (477 visits): seven items of
  three trials each. A trial is 0 or 1 and an item is the number of its trials
  passed, 0 to 3. The 28 trial and item columns are not in the dictionary.

  Edition rule (decision D138, question O16): the 33 visits that the form
  labels WAIS-III and that hold the WAIS-IV digit-span sequencing task
  (columns mcoc_w and mcocemp_w) are read as WAIS-IV (override in the version
  block, flag version_overridden). None of them holds this subtest.

  The stored raw total is the sum of the items present on 477 of 477 visits.
  The z-score is (scaled score - 10) / 3 on every visit. No WAIS-IV visit
  holds a value here (0 of 477).

  412 visits have all seven items. On 65 the items after the first item scored
  0 are empty (the last item filled is 0 on all 65, and no visit has an item
  above 0 after a 0): the script of the application adds the items up to the
  first one scored 0, and so does the schema (stop_at_zero, with min_items 1:
  a total needs one item). This changes no value.

  FACE BP does not have this subtest.

  Scaled score and z-score (decision of 18 November 2026). Recomputed from the
  raw total in the application's own norm table
  (norms/wais3_letter_number.csv, 12 age groups read from the scripts of the
  EMR; not part of the repository) and delivered; the stored ones are read as
  checks (keep: false) and a difference is score_mismatch on the delivered
  score. The EMR read its table with the age typed in the form (cclin01_); the
  package uses that age where it is within one year of the age at the visit,
  else the age at the visit (age: wais3_lns_age). The z-score is (scaled score
  - 10) / 3 (tolerance 0.006). On the 477 visits that have both, 2 differ
  (before 2013), both with a typed age more than a year from the age at the
  visit (read with the typed age as it stands the table gives the stored score
  on all 475 visits that have a typed age). The z-score differs on the same 2.
  The typed age is within a year of the age at the visit on 463 of the 477
  visits, farther on 12 and missing on 2. Two typed ages written 'NN ans' are
  unparsed; the age at the visit is used where the typed one is not read (2
  of the 2 visits have this subtest).

version:
  name: wais_version
  column: wais_version
  codes: {WAIS3: wais3, WAIS4: wais4}
  override: {wais4: [mcoc_w, mcocemp_w]}

defaults: {type: item, range: [0, 1], versions: [wais3]}

variables:
  wais3_lns01a: {column: slc01a_wais3, label: "Letter-number sequencing item 1, trial a"}
  wais3_lns01b: {column: slc01b_wais3, label: "Letter-number sequencing item 1, trial b"}
  wais3_lns01c: {column: slc01c_wais3, label: "Letter-number sequencing item 1, trial c"}
  wais3_lns02a: {column: slc02a_wais3, label: "Letter-number sequencing item 2, trial a"}
  wais3_lns02b: {column: slc02b_wais3, label: "Letter-number sequencing item 2, trial b"}
  wais3_lns02c: {column: slc02c_wais3, label: "Letter-number sequencing item 2, trial c"}
  wais3_lns03a: {column: slc03a_wais3, label: "Letter-number sequencing item 3, trial a"}
  wais3_lns03b: {column: slc03b_wais3, label: "Letter-number sequencing item 3, trial b"}
  wais3_lns03c: {column: slc03c_wais3, label: "Letter-number sequencing item 3, trial c"}
  wais3_lns04a: {column: slc04a_wais3, label: "Letter-number sequencing item 4, trial a"}
  wais3_lns04b: {column: slc04b_wais3, label: "Letter-number sequencing item 4, trial b"}
  wais3_lns04c: {column: slc04c_wais3, label: "Letter-number sequencing item 4, trial c"}
  wais3_lns05a: {column: slc05a_wais3, label: "Letter-number sequencing item 5, trial a"}
  wais3_lns05b: {column: slc05b_wais3, label: "Letter-number sequencing item 5, trial b"}
  wais3_lns05c: {column: slc05c_wais3, label: "Letter-number sequencing item 5, trial c"}
  wais3_lns06a: {column: slc06a_wais3, label: "Letter-number sequencing item 6, trial a"}
  wais3_lns06b: {column: slc06b_wais3, label: "Letter-number sequencing item 6, trial b"}
  wais3_lns06c: {column: slc06c_wais3, label: "Letter-number sequencing item 6, trial c"}
  wais3_lns07a: {column: slc07a_wais3, label: "Letter-number sequencing item 7, trial a"}
  wais3_lns07b: {column: slc07b_wais3, label: "Letter-number sequencing item 7, trial b"}
  wais3_lns07c: {column: slc07c_wais3, label: "Letter-number sequencing item 7, trial c"}
  wais3_lns01: {column: slc01_wais3, label: "Letter-number sequencing item 1 (trials passed)", range: [0, 3]}
  wais3_lns02: {column: slc02_wais3, label: "Letter-number sequencing item 2 (trials passed)", range: [0, 3]}
  wais3_lns03: {column: slc03_wais3, label: "Letter-number sequencing item 3 (trials passed)", range: [0, 3]}
  wais3_lns04: {column: slc04_wais3, label: "Letter-number sequencing item 4 (trials passed)", range: [0, 3]}
  wais3_lns05: {column: slc05_wais3, label: "Letter-number sequencing item 5 (trials passed)", range: [0, 3]}
  wais3_lns06: {column: slc06_wais3, label: "Letter-number sequencing item 6 (trials passed)", range: [0, 3]}
  wais3_lns07: {column: slc07_wais3, label: "Letter-number sequencing item 7 (trials passed)", range: [0, 3]}
  wais3_lns_total_stored: {column: slctot_wais3, label: Raw total as stored, range: [0, 21], keep: false}
  wais3_lns_age: {column: cclin01_, type: number, range: [15, 100], winsor: false, keep: false, label: "Age typed in the form, the age the EMR read its table with"}
  wais3_lns_scaled_stored: {column: slcstd_wais3, label: Age-scaled score as stored, range: [1, 19], keep: false}
  wais3_lns_z_stored: {column: slccr_wais3, label: "Scaled score as a z-score, as stored", type: number, range: [-3, 3], winsor: false, keep: false}

scores:
  wais3_lns_total:
    label: Letter-number sequencing raw total (7 items)
    sum: [wais3_lns01, wais3_lns02, wais3_lns03, wais3_lns04, wais3_lns05, wais3_lns06,
          wais3_lns07]
    min_items: 1
    stop_at_zero: true
    compare: wais3_lns_total_stored
  wais3_lns_scaled:
    label: Age-scaled score (mean 10 and SD 3)
    lookup: wais3_letter_number
    from: wais3_lns_total
    age: wais3_lns_age
    range: [1, 19]
    compare: wais3_lns_scaled_stored
  wais3_lns_z:
    label: Scaled score as a z-score, (scaled score - 10) / 3
    sum: [wais3_lns_scaled]
    scale: [0.3333333, -3.3333333]
    compare: wais3_lns_z_stored
    compare_tolerance: 0.006
