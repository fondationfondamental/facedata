instrument: lis
title: Attribution of intentions in six film clips (LIS)
tab: NEUROPSYCHOLOGIE
section: "Film A : l'amende. Question : Pourquoi l’homme parle-il de son fils au policier ?"
status: reviewed
notes: >
  Lecture Intentionnelle en Situation: six short film clips, and for each a
  question about the intention of a character with five proposed answers. The
  patient rates each answer from 1 (very unlikely) to 4 (very likely). 1,162
  visits from 2013 to 2026 have ratings, 1,148 of them the 30 ratings.

  The score is the distance to a reference group: the sum, over the 30
  answers, of the gap between the rating and the mean rating of the reference
  group (the higher, the further from the usual reading). It is recomputed and
  delivered (distance, norms/lis_reference.csv: one reference rating for each
  answer, read in psy_neuropsychologie_lis.js, where it is written as 30
  constants); the stored score (lis_total_stored, not delivered) is the check.
  The stored score equals the recomputed one, to 0.01, on 983 of the 1,011
  visits that have both (962 to 0.00001; 21 were stored rounded to two
  decimals). The 28 others, from 2022 to 2024 in 6 centres (23 at V0), hold a
  score that the ratings do not give: score_mismatch. 137 visits with the 30
  ratings have no stored score (2015 to 2026, 135 of them in 2018 to 2024 and
  53 in 2022; 7 centres): their score is delivered. 7 stored scores cannot be
  recomputed (3 visits with no rating and 4 with 29 ratings):
  score_not_recomputed. The 28 scores that the ratings do not give were typed,
  not computed by the form. The button of the form writes the unrounded sum
  into a field that cannot be edited (psy_neuropsychologie_lis.js, lines 37
  and 40 to 90): 883 of the 962 scores equal to 0.00001 carry more than two
  decimals, while the 28 carry two decimals at most (7 whole, 7 with one, 14
  with two), and no score of centre E in 2022 and 2023 (19) carries more than
  two. No other rule gives them: a squared distance, reversed ratings, an
  answer or a film shifted, one answer left out, a rounded reference. They are
  entry errors, and the recomputed score is delivered; how they could be typed
  in a field that cannot be edited is question M85. The 137 missing scores
  stay open question O18. The scores of 2014 and 2015 are higher: 45 visits of
  centres D (36) and F (9), mean 20.2 against 17.3 from 2016 to 2026, with the
  whole distribution moved (median 19.9 against 16.0). Every film and every
  answer adds to it, the stored score equals the ratings, centre D is at the
  later level in 2013 and 2016 (median 16.1 and 15.0), and 8 of these patients
  tested again later moved by -1.2 (median). No cause in the scoring; the step
  is documented here (item 6).

