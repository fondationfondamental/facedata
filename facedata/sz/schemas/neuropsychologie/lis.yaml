  lis_c5: {column: lisc05_, label: "Film C (the wound), answer 5"}
  lis_d1: {column: lisd01_, label: "Film D (the turned-up collar), answer 1"}
  lis_d2: {column: lisd02_, label: "Film D (the turned-up collar), answer 2"}
  lis_d3: {column: lisd03_, label: "Film D (the turned-up collar), answer 3"}
  lis_d4: {column: lisd04_, label: "Film D (the turned-up collar), answer 4"}
