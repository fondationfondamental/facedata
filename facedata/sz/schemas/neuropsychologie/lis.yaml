scores:
  lis_total:
    label: "LIS score: distance to the ratings of the reference group"
    distance: lis_reference
    from: [lis_a1, lis_a2, lis_a3, lis_a4, lis_a5, lis_b1, lis_b2, lis_b3, lis_b4, lis_b5,
           lis_c1, lis_c2, lis_c3, lis_c4, lis_c5, lis_d1, lis_d2, lis_d3, lis_d4, lis_d5,
           lis_e1, lis_e2, lis_e3, lis_e4, lis_e5, lis_f1, lis_f2, lis_f3, lis_f4, lis_f5]
    range: [0, 100]
    compare: lis_total_stored
    compare_tolerance: 0.011
