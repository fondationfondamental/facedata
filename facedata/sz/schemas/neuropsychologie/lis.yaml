instrument: lis
title: Attribution of intentions in six film clips (LIS)
tab: NEUROPSYCHOLOGIE
section: "Film A : l'amende. Question : Pourquoi l’homme parle-il de son fils au policier ?"
status: draft
notes: >
  Lecture Intentionnelle en Situation: six short film clips, and for each a
  question about the intention of a character with five proposed answers.
  The patient rates each answer from 1 (very unlikely) to 4 (very likely).
  1,162 visits from 2013 to 2026, 1,148 of them with the 30 ratings.

  The score is the distance to a reference group: the sum, over the 30
  answers, of the gap between the rating and the mean rating of the
  reference group (the higher, the further from the usual reading). The
  reference ratings are not in the dictionary and are not copied here, so
  the score is delivered as stored. The data confirm the rule: one set of 30
  reference ratings gives the stored score, to 0.01, on 983 of the 1,011
  visits that have the score and the 30 ratings. The 28 others, from 2022 to
  2024 in 6 centres, hold a score that the ratings do not give, and 137
  visits with the 30 ratings have no score (2018 to 2024, 53 of them in
  2022). Both are open question O18.

