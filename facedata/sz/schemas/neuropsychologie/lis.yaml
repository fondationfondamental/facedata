  lis_e1: {column: lise01_, label: "Film E (the coffees), answer 1"}
  lis_e2: {column: lise02_, label: "Film E (the coffees), answer 2"}
  lis_e3: {column: lise03_, label: "Film E (the coffees), answer 3"}
  lis_e4: {column: lise04_, label: "Film E (the coffees), answer 4"}
  lis_e5: {column: lise05_, label: "Film E (the coffees), answer 5"}
  lis_f1: {column: lisf01_, label: "Film F (the bathroom), answer 1"}
