instrument: wais3_complement_images
title: WAIS-III picture completion
tab: NEUROPSYCHOLOGIE
section: Complètement d'images (WAIS-3) ancienne version
status: draft
notes: >
  WAIS-III and WAIS-IV are two instruments stored in the same columns
  (decision D10 of the BP file). This schema reads the
  picture completion columns on the WAIS-III visits (571 visits, from 2010
  to 2016): 25 items scored 0 or 1. wais4_complement_images.yaml reads the
  WAIS-IV visits.

  The stored raw total is the sum of the 25 items on 570 of 571 visits.
  The z-score is (scaled score - 10) / 3 on every visit.

  A total counts the items that were given: after the stopping rule the
  remaining items are left empty.

  FACE BP does not have this subtest.

  Scaled score and z-score (decision of 18 November 2026). Recomputed from
  the raw total in the application's own norm table (norms/wais3_picture_completion.csv,
  12 age groups read from the scripts of the EMR; not part of the
  repository) and delivered; the stored ones are read as checks (keep:
  false) and a difference is score_mismatch on the delivered score. The EMR
  read its table with the age typed in the form (cclin01_); the package
  uses that age where it is within one year of the age at the visit, else
  the age at the visit (age: wais3_pc_age). The z-score is (scaled score - 10) / 3
  (tolerance 0.006). On the 571 visits that have both, 28 differ: 24 are among the 33 visits labelled WAIS-III that were given the WAIS-IV (question DM-2, O16) and 4 are not, 3 of them with a typed age more than a year from the age at the visit (read with the typed age as it stands the table gives the stored score on all but 25). The z-score differs on 28.

version:
  name: wais_version
  column: wais_version
  codes: {WAIS3: wais3, WAIS4: wais4}

defaults: {type: item, range: [0, 1], versions: [wais3]}

variables:
  wais3_pc01: {column: compl01_w, label: Picture completion item 1}
  wais3_pc02: {column: compl02_w, label: Picture completion item 2}
  wais3_pc03: {column: compl03_w, label: Picture completion item 3}
  wais3_pc04: {column: compl04_w, label: Picture completion item 4}
  wais3_pc05: {column: compl05_w, label: Picture completion item 5}
  wais3_pc06: {column: compl06_w, label: Picture completion item 6}
  wais3_pc07: {column: compl07_w, label: Picture completion item 7}
  wais3_pc08: {column: compl08_w, label: Picture completion item 8}
  wais3_pc09: {column: compl09_w, label: Picture completion item 9}
  wais3_pc10: {column: compl10_w, label: Picture completion item 10}
  wais3_pc11: {column: compl11_w, label: Picture completion item 11}
  wais3_pc12: {column: compl12_w, label: Picture completion item 12}
  wais3_pc13: {column: compl13_w, label: Picture completion item 13}
  wais3_pc14: {column: compl14_w, label: Picture completion item 14}
  wais3_pc15: {column: compl15_w, label: Picture completion item 15}
  wais3_pc16: {column: compl16_w, label: Picture completion item 16}
  wais3_pc17: {column: compl17_w, label: Picture completion item 17}
  wais3_pc18: {column: compl18_w, label: Picture completion item 18}
  wais3_pc19: {column: compl19_w, label: Picture completion item 19}
  wais3_pc20: {column: compl20_w, label: Picture completion item 20}
  wais3_pc21: {column: compl21_w, label: Picture completion item 21}
  wais3_pc22: {column: compl22_w, label: Picture completion item 22}
  wais3_pc23: {column: compl23_w, label: Picture completion item 23}
  wais3_pc24: {column: compl24_w, label: Picture completion item 24}
  wais3_pc25: {column: compl25_w, label: Picture completion item 25}
  wais3_pc_total_stored: {column: compltot_w, label: Raw total as stored, range: [0, 25], keep: false}
  wais3_pc_age: {column: cclin01_, type: number, range: [15, 100], winsor: false, keep: false, label: "Age typed in the form, the age the EMR read its table with"}
  wais3_pc_scaled_stored: {column: complstd_w, label: Age-scaled score as stored, range: [1, 19], keep: false}
  wais3_pc_z_stored: {column: complcr_w, label: "Scaled score as a z-score, as stored", type: number, range: [-3, 3], winsor: false, keep: false}

scores:
  wais3_pc_total:
    label: Picture completion raw total (25 items)
    sum: [wais3_pc01, wais3_pc02, wais3_pc03, wais3_pc04, wais3_pc05, wais3_pc06, wais3_pc07,
          wais3_pc08, wais3_pc09, wais3_pc10, wais3_pc11, wais3_pc12, wais3_pc13, wais3_pc14,
          wais3_pc15, wais3_pc16, wais3_pc17, wais3_pc18, wais3_pc19, wais3_pc20, wais3_pc21,
          wais3_pc22, wais3_pc23, wais3_pc24, wais3_pc25]
    min_items: 1
    compare: wais3_pc_total_stored
  wais3_pc_scaled:
    label: Age-scaled score (mean 10 and SD 3)
    lookup: wais3_picture_completion
    from: wais3_pc_total
    age: wais3_pc_age
    range: [1, 19]
    compare: wais3_pc_scaled_stored
  wais3_pc_z:
    label: Scaled score as a z-score, (scaled score - 10) / 3
    sum: [wais3_pc_scaled]
    scale: [0.3333333, -3.3333333]
    compare: wais3_pc_z_stored
    compare_tolerance: 0.006
