instrument: cvlt
title: California Verbal Learning Test (CVLT)
tab: NEUROPSYCHOLOGIE
section: Troubles des acquisitions et des apprentissages
status: draft
notes: >
  A list of 16 words ("Monday list") learned over five trials, a second list
  ("Tuesday list", list B), then recalls of the first list after a short and
  a long delay, free and cued, and a recognition task. 2,298 visits from
  2010 to 2026.

  The BP schema, where the notes give the rules and their evidence
  (decisions D38, D39, D44, D45, D108 and D109 of the BP file): the
  z-scores are computed again with the regressions of the norms, from the
  raw score, the age at the visit, the years of education and the sex; one
  band per measure for every age, read in the percentile table where the
  norms have one and the band of the z-score elsewhere. What follows is
  what differs in the SZ extraction.

  Raw scores. Ten of them are in columns named avl01... (the five trials,
  list B, the two free recalls, the correct and false recognitions); the
  others have the BP names. The total of trials 1 to 5 equals the stored
  one but for 24 visits (score_mismatch).

  Years of education. They come from the first part of the assessment
  (cclin08_). Until the extraction of 17 November 2026 the export read
  them in the older form only and they stopped in 2016; they are now on
  every visit that has a CVLT (decision D35 in PROGRESS.md).

  The stored z-scores are only compared with the computed ones. For the six
  measures that give a percentile to one age group and a z-score to the
  other (trial 5, the four delayed recalls, semantic clustering), SZ has
  two columns, cvltNNz_ and cvltNNp_, where BP has one, and neither holds
  one kind of value: the check variable reads the two and keeps the cells
  written with decimals.

  What the comparison shows (decision D35). The stored z-score of trials 1
  to 5 was computed with the coefficients of the age and of the sex
  exchanged on 291 visits, from October 2021 to June 2026, in eleven
  centres: until a correction dated 2024-08-02 the script of the SZ form
  did so for the patients under 70, and each centre runs its own copy of
  the application. These values were 4 to 9 points too high. They are
  computed again like the others, and the doubt period that covered them
  is no longer needed.

  Limits. The patients of this cohort recall fewer words than the norm
  group, so a z-score of a recall may be far below 0: the limits of the
  recalls go from -8 to 5 here and in BP.

  Missing codes of this cohort: "xxx", "DCM" and "NF" (about 130 cells).

defaults: {type: item, range: [0, 16], missing: {xxx: not_recorded, dcm: not_recorded, nf: not_recorded}}

variables:
  # Raw scores
  cvlt_trial1: {column: avl01016_, label: Trial 1 - words recalled}
  cvlt_trial2: {column: avl01133_, label: Trial 2 - words recalled}
  cvlt_trial3: {column: avl01050_, label: Trial 3 - words recalled}
  cvlt_trial4: {column: avl01067_, label: Trial 4 - words recalled}
  cvlt_trial5: {column: avl01084_, label: Trial 5 - words recalled}
  cvlt_total_1_5_stored: {column: cvlt06_, label: Trials 1 to 5 as stored, range: [0, 80], keep: false}
  cvlt_list_b: {column: avl01118_, label: List B - words recalled}
  cvlt_short_free: {column: avl01103_, label: Short-delay free recall}
  cvlt_short_cued: {column: cvlt09_, label: Short-delay cued recall}
  cvlt_long_free: {column: avl01135_, label: Long-delay free recall}
  cvlt_long_cued: {column: cvlt11_, label: Long-delay cued recall}
  cvlt_semantic: {column: cvlt12_, type: number, label: Semantic clustering index, range: [-5, 50]}
  cvlt_serial: {column: cvlt13_, type: number, label: Serial clustering index, range: [-15, 50]}
  cvlt_perseverations: {column: cvlt14_, label: Perseverations, range: [0, 50]}
  cvlt_intrusions: {column: cvlt15_, label: Intrusions, range: [0, 50]}
  cvlt_hits: {column: avl01137_, label: Correct recognitions}
  cvlt_false_alarms: {column: avl01138_, label: False recognitions, range: [0, 28]}
  cvlt_discriminability: {column: cvlt18_, type: number, label: Discriminability (percent), range: [0, 100], winsor: false}
  cvlt_primacy: {column: cvlt19_, type: number, label: Primacy (percent), range: [0, 100], winsor: false}
  cvlt_recency: {column: cvlt20_, type: number, label: Recency (percent), range: [0, 100], winsor: false}
  cvlt_bias: {column: cvlt21_, type: number, label: Response bias, range: [-1, 1], winsor: false}
  cvlt_delay: {column: cvlt22_, type: number, label: Minutes between the first recalls and the delayed recalls, range: [0, 120]}

  # What the regressions of the norms need besides the age: read here a second time, not delivered
  cvlt_education: {column: cclin08_, type: number, label: Years of education (for the norms), range: [0, 30], winsor: false, keep: false}
  cvlt_sex: {column: sex, type: item, codes: {Feminin: "1", Masculin: "2"}, range: [1, 2], label: "Sex, 1 for a woman and 2 for a man (for the norms)", keep: false}

  # The z-scores as the EMR stored them: only compared with the recomputed ones. For six measures they are in
  # two columns, which also hold percentiles (shared: true): those cells are not z-scores and are left out.
  cvlt_trial1_z_stored: {column: cvlt01z_, type: number, label: "Trial 1, z-score as stored", range: [-1000, 1000], missing: {inf: not_recorded, -inf: not_recorded, xxx: not_recorded, dcm: not_recorded, nf: not_recorded}, winsor: false, keep: false}
  cvlt_trial5_z_stored: {column: [cvlt05z_, cvlt05p_], shared: true, type: number, label: "Trial 5, z-score as stored", range: [-1000, 1000], missing: {inf: not_recorded, -inf: not_recorded, xxx: not_recorded, dcm: not_recorded, nf: not_recorded}, winsor: false, keep: false}
  cvlt_total_1_5_z_stored: {column: cvlt06z_, type: number, label: "Trials 1 to 5, z-score as stored", range: [-1000, 1000], missing: {inf: not_recorded, -inf: not_recorded, xxx: not_recorded, dcm: not_recorded, nf: not_recorded}, winsor: false, keep: false}
  cvlt_list_b_z_stored: {column: cvlt07z_, type: number, label: "List B, z-score as stored", range: [-1000, 1000], missing: {inf: not_recorded, -inf: not_recorded, xxx: not_recorded, dcm: not_recorded, nf: not_recorded}, winsor: false, keep: false}
  cvlt_short_free_z_stored: {column: [cvlt08z_, cvlt08p_], shared: true, type: number, label: "Short-delay free recall, z-score as stored", range: [-1000, 1000], missing: {inf: not_recorded, -inf: not_recorded, xxx: not_recorded, dcm: not_recorded, nf: not_recorded}, winsor: false, keep: false}
  cvlt_short_cued_z_stored: {column: [cvlt09z_, cvlt09p_], shared: true, type: number, label: "Short-delay cued recall, z-score as stored", range: [-1000, 1000], missing: {inf: not_recorded, -inf: not_recorded, xxx: not_recorded, dcm: not_recorded, nf: not_recorded}, winsor: false, keep: false}
  cvlt_long_free_z_stored: {column: [cvlt10z_, cvlt10p_], shared: true, type: number, label: "Long-delay free recall, z-score as stored", range: [-1000, 1000], missing: {inf: not_recorded, -inf: not_recorded, xxx: not_recorded, dcm: not_recorded, nf: not_recorded}, winsor: false, keep: false}
  cvlt_long_cued_z_stored: {column: [cvlt11z_, cvlt11p_], shared: true, type: number, label: "Long-delay cued recall, z-score as stored", range: [-1000, 1000], missing: {inf: not_recorded, -inf: not_recorded, xxx: not_recorded, dcm: not_recorded, nf: not_recorded}, winsor: false, keep: false}
  cvlt_semantic_z_stored: {column: [cvlt12z_, cvlt12p_], shared: true, type: number, label: "Semantic clustering, z-score as stored", range: [-1000, 1000], missing: {inf: not_recorded, -inf: not_recorded, xxx: not_recorded, dcm: not_recorded, nf: not_recorded}, winsor: false, keep: false}
  cvlt_primacy_z_stored: {column: cvlt19z_, type: number, label: "Primacy, z-score as stored", range: [-1000, 1000], missing: {inf: not_recorded, -inf: not_recorded, xxx: not_recorded, dcm: not_recorded, nf: not_recorded}, winsor: false, keep: false}
  cvlt_recency_z_stored: {column: cvlt20z_, type: number, label: "Recency, z-score as stored", range: [-1000, 1000], missing: {inf: not_recorded, -inf: not_recorded, xxx: not_recorded, dcm: not_recorded, nf: not_recorded}, winsor: false, keep: false}
  cvlt_bias_z_stored: {column: cvlt21z_, type: number, label: "Response bias, z-score as stored", range: [-1000, 1000], missing: {inf: not_recorded, -inf: not_recorded, xxx: not_recorded, dcm: not_recorded, nf: not_recorded}, winsor: false, keep: false}

  # A percentile band at every age
  cvlt_serial_band: {column: cvlt13z_, type: band, limits: [1, 5, 25, 50, 75, 95, 99], label: "Serial clustering, percentile band"}
  cvlt_perseverations_band: {column: cvlt14z_, type: band, limits: [1, 5, 25, 50, 75, 95, 99], lookup: cvlt_perseverations, from: cvlt_perseverations, label: "Perseverations, percentile band"}
  cvlt_intrusions_band: {column: cvlt15z_, type: band, limits: [1, 5, 25, 50, 75, 95, 99], lookup: cvlt_intrusions, from: cvlt_intrusions, label: "Intrusions, percentile band"}
  cvlt_hits_band: {column: cvlt16z_, type: band, limits: [1, 5, 25, 50, 75, 95, 99], lookup: cvlt_hits, from: cvlt_hits, label: "Correct recognitions, percentile band"}
  cvlt_false_alarms_band: {column: cvlt17z_, type: band, limits: [1, 5, 25, 50, 75, 95, 99], lookup: cvlt_false_alarms, from: cvlt_false_alarms, label: "False recognitions, percentile band"}
  cvlt_discriminability_band: {column: cvlt18z_, type: band, limits: [1, 5, 25, 50, 75, 95, 99], lookup: cvlt_discriminability, from: cvlt_discriminability, label: "Discriminability, percentile band"}

scores:
  cvlt_total_1_5:
    label: Trials 1 to 5 - words recalled
    sum: [cvlt_trial1, cvlt_trial2, cvlt_trial3, cvlt_trial4, cvlt_trial5]
    compare: cvlt_total_1_5_stored

  # Z-scores, computed again with the regressions of the norms (norms/cvlt_*_z.csv) from the raw score, the age
  # at the visit, the years of education and the sex. A file has a line only for the ages that have a regression.
  cvlt_trial1_z:
    label: "Trial 1, z-score"
    regression: cvlt_trial1_z
    from: cvlt_trial1
    with: {education: cvlt_education, sex: cvlt_sex}
    range: [-8, 5]
    winsor: [0.01, 0.99]
    compare: cvlt_trial1_z_stored
    compare_tolerance: 0.25
  cvlt_trial5_z:
    label: "Trial 5, z-score"
    regression: cvlt_trial5_z
    from: cvlt_trial5
    with: {education: cvlt_education, sex: cvlt_sex}
    range: [-8, 5]
    winsor: [0.01, 0.99]
    compare: cvlt_trial5_z_stored
    compare_tolerance: 0.25
  cvlt_total_1_5_z:
    label: "Trials 1 to 5, z-score"
    regression: cvlt_total_1_5_z
    from: cvlt_total_1_5
    with: {education: cvlt_education, sex: cvlt_sex}
    range: [-8, 5]
    winsor: [0.01, 0.99]
    compare: cvlt_total_1_5_z_stored
    compare_tolerance: 0.25
  cvlt_list_b_z:
    label: "List B, z-score"
    regression: cvlt_list_b_z
    from: cvlt_list_b
    with: {education: cvlt_education, sex: cvlt_sex}
    range: [-8, 5]
    winsor: [0.01, 0.99]
    compare: cvlt_list_b_z_stored
    compare_tolerance: 0.25
  cvlt_short_free_z:
    label: "Short-delay free recall, z-score"
    regression: cvlt_short_free_z
    from: cvlt_short_free
    with: {education: cvlt_education, sex: cvlt_sex}
    range: [-8, 5]
    winsor: [0.01, 0.99]
    compare: cvlt_short_free_z_stored
    compare_tolerance: 0.25
  cvlt_short_cued_z:
    label: "Short-delay cued recall, z-score"
    regression: cvlt_short_cued_z
    from: cvlt_short_cued
    with: {education: cvlt_education, sex: cvlt_sex}
    range: [-8, 5]
    winsor: [0.01, 0.99]
    compare: cvlt_short_cued_z_stored
    compare_tolerance: 0.25
  cvlt_long_free_z:
    label: "Long-delay free recall, z-score"
    regression: cvlt_long_free_z
    from: cvlt_long_free
    with: {education: cvlt_education, sex: cvlt_sex}
    range: [-8, 5]
    winsor: [0.01, 0.99]
    compare: cvlt_long_free_z_stored
    compare_tolerance: 0.25
  cvlt_long_cued_z:
    label: "Long-delay cued recall, z-score"
    regression: cvlt_long_cued_z
    from: cvlt_long_cued
    with: {education: cvlt_education, sex: cvlt_sex}
    range: [-8, 5]
    winsor: [0.01, 0.99]
    compare: cvlt_long_cued_z_stored
    compare_tolerance: 0.25
  cvlt_semantic_z:
    label: "Semantic clustering, z-score"
    regression: cvlt_semantic_z
    from: cvlt_semantic
    with: {education: cvlt_education, sex: cvlt_sex}
    range: [-5, 5]
    winsor: [0.01, 0.99]
    compare: cvlt_semantic_z_stored
    compare_tolerance: 0.25
  cvlt_primacy_z:
    label: "Primacy, z-score"
    regression: cvlt_primacy_z
    from: cvlt_primacy
    with: {education: cvlt_education, sex: cvlt_sex}
    range: [-10, 10]
    winsor: [0.01, 0.99]
    compare: cvlt_primacy_z_stored
    compare_tolerance: 0.25
  cvlt_recency_z:
    label: "Recency, z-score"
    regression: cvlt_recency_z
    from: cvlt_recency
    with: {education: cvlt_education, sex: cvlt_sex}
    range: [-10, 10]
    winsor: [0.01, 0.99]
    compare: cvlt_recency_z_stored
    compare_tolerance: 0.25
  cvlt_bias_z:
    label: "Response bias, z-score"
    regression: cvlt_bias_z
    from: cvlt_bias
    with: {education: cvlt_education, sex: cvlt_sex}
    range: [-10, 10]
    winsor: [0.01, 0.99]
    compare: cvlt_bias_z_stored
    compare_tolerance: 0.25

  # One percentile band per measure, for every age: read in the percentile table of the norms where the age has
  # one, and the band of the z-score elsewhere.
  cvlt_trial1_band:
    label: "Trial 1, percentile band"
    band_of: cvlt_trial1_z
    limits: [1, 5, 25, 50, 75, 95, 99]
  cvlt_trial5_band:
    label: "Trial 5, percentile band"
    lookup: cvlt_trial5
    from: cvlt_trial5
    band_of: cvlt_trial5_z
    limits: [1, 5, 25, 50, 75, 95, 99]
  cvlt_total_1_5_band:
    label: "Trials 1 to 5, percentile band"
    band_of: cvlt_total_1_5_z
    limits: [1, 5, 25, 50, 75, 95, 99]
  cvlt_list_b_band:
    label: "List B, percentile band"
    band_of: cvlt_list_b_z
    limits: [1, 5, 25, 50, 75, 95, 99]
  cvlt_short_free_band:
    label: "Short-delay free recall, percentile band"
    lookup: cvlt_short_free
    from: cvlt_short_free
    band_of: cvlt_short_free_z
    limits: [1, 5, 25, 50, 75, 95, 99]
  cvlt_short_cued_band:
    label: "Short-delay cued recall, percentile band"
    lookup: cvlt_short_cued
    from: cvlt_short_cued
    band_of: cvlt_short_cued_z
    limits: [1, 5, 25, 50, 75, 95, 99]
  cvlt_long_free_band:
    label: "Long-delay free recall, percentile band"
    lookup: cvlt_long_free
    from: cvlt_long_free
    band_of: cvlt_long_free_z
    limits: [1, 5, 25, 50, 75, 95, 99]
  cvlt_long_cued_band:
    label: "Long-delay cued recall, percentile band"
    lookup: cvlt_long_cued
    from: cvlt_long_cued
    band_of: cvlt_long_cued_z
    limits: [1, 5, 25, 50, 75, 95, 99]
  cvlt_semantic_band:
    label: "Semantic clustering, percentile band"
    lookup: cvlt_semantic
    from: cvlt_semantic
    band_of: cvlt_semantic_z
    limits: [1, 5, 25, 50, 75, 95, 99]
  cvlt_primacy_band:
    label: "Primacy, percentile band"
    band_of: cvlt_primacy_z
    limits: [1, 5, 25, 50, 75, 95, 99]
  cvlt_recency_band:
    label: "Recency, percentile band"
    band_of: cvlt_recency_z
    limits: [1, 5, 25, 50, 75, 95, 99]
  cvlt_bias_band:
    label: "Response bias, percentile band"
    band_of: cvlt_bias_z
    limits: [1, 5, 25, 50, 75, 95, 99]
