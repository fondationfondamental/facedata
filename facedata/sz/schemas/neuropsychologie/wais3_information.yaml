instrument: wais3_information
title: WAIS-III information
tab: NEUROPSYCHOLOGIE
section: Information (WAIS-3) ancienne version
status: draft
notes: >
  WAIS-III and WAIS-IV are two instruments stored in the same columns
  (decision D10 of the BP file). This schema reads the
  information columns on the WAIS-III visits (563 visits, from 2010 to
  2016): 28 items scored 0 or 1. wais4_information.yaml reads the WAIS-IV
  visits.

  The stored raw total is the sum of the 28 items on every visit. The
  z-score is (scaled score - 10) / 3 on every visit.

  A total counts the items that were given: after the stopping rule the
  remaining items are left empty.

  FACE BP does not have this subtest.

  Scaled score and z-score (decision of 18 November 2026). Recomputed from
  the raw total in the application's own norm table (norms/wais3_information.csv,
  12 age groups read from the scripts of the EMR; not part of the
  repository) and delivered; the stored ones are read as checks (keep:
  false) and a difference is score_mismatch on the delivered score. The EMR
  read its table with the age typed in the form (cclin01_); the package
  uses that age where it is within one year of the age at the visit, else
  the age at the visit (age: wais3_info_age). The z-score is (scaled score - 10) / 3
  (tolerance 0.006). On the 563 visits that have both, 24 differ: 22 are among the 33 visits labelled WAIS-III that were given the WAIS-IV (question DM-2, O16) and 2 have a typed age more than a year from the age at the visit (read with the typed age as it stands the table gives the stored score on all but the 22). The z-score differs on 24.

version:
  name: wais_version
  column: wais_version
  codes: {WAIS3: wais3, WAIS4: wais4}

defaults: {type: item, range: [0, 1], versions: [wais3]}

variables:
  wais3_info01: {column: infor01_w, label: Information item 1}
  wais3_info02: {column: infor02_w, label: Information item 2}
  wais3_info03: {column: infor03_w, label: Information item 3}
  wais3_info04: {column: infor04_w, label: Information item 4}
  wais3_info05: {column: infor05_w, label: Information item 5}
  wais3_info06: {column: infor06_w, label: Information item 6}
  wais3_info07: {column: infor07_w, label: Information item 7}
  wais3_info08: {column: infor08_w, label: Information item 8}
  wais3_info09: {column: infor09_w, label: Information item 9}
  wais3_info10: {column: infor10_w, label: Information item 10}
  wais3_info11: {column: infor11_w, label: Information item 11}
  wais3_info12: {column: infor12_w, label: Information item 12}
  wais3_info13: {column: infor13_w, label: Information item 13}
  wais3_info14: {column: infor14_w, label: Information item 14}
  wais3_info15: {column: infor15_w, label: Information item 15}
  wais3_info16: {column: infor16_w, label: Information item 16}
  wais3_info17: {column: infor17_w, label: Information item 17}
  wais3_info18: {column: infor18_w, label: Information item 18}
  wais3_info19: {column: infor19_w, label: Information item 19}
  wais3_info20: {column: infor20_w, label: Information item 20}
  wais3_info21: {column: infor21_w, label: Information item 21}
  wais3_info22: {column: infor22_w, label: Information item 22}
  wais3_info23: {column: infor23_w, label: Information item 23}
  wais3_info24: {column: infor24_w, label: Information item 24}
  wais3_info25: {column: infor25_w, label: Information item 25}
  wais3_info26: {column: infor26_w, label: Information item 26}
  wais3_info27: {column: infor27_w, label: Information item 27}
  wais3_info28: {column: infor28_w, label: Information item 28}
  wais3_info_total_stored: {column: infortot_w, label: Raw total as stored, range: [0, 28], keep: false}
  wais3_info_age: {column: cclin01_, type: number, range: [15, 100], winsor: false, keep: false, label: "Age typed in the form, the age the EMR read its table with"}
  wais3_info_scaled_stored: {column: inforstd_w, label: Age-scaled score as stored, range: [1, 19], keep: false}
  wais3_info_z_stored: {column: inforcr_w, label: "Scaled score as a z-score, as stored", type: number, range: [-3, 3], winsor: false, keep: false}

scores:
  wais3_info_total:
    label: Information raw total (28 items)
    sum: [wais3_info01, wais3_info02, wais3_info03, wais3_info04, wais3_info05, wais3_info06,
          wais3_info07, wais3_info08, wais3_info09, wais3_info10, wais3_info11, wais3_info12,
          wais3_info13, wais3_info14, wais3_info15, wais3_info16, wais3_info17, wais3_info18,
          wais3_info19, wais3_info20, wais3_info21, wais3_info22, wais3_info23, wais3_info24,
          wais3_info25, wais3_info26, wais3_info27, wais3_info28]
    min_items: 1
    compare: wais3_info_total_stored
  wais3_info_scaled:
    label: Age-scaled score (mean 10 and SD 3)
    lookup: wais3_information
    from: wais3_info_total
    age: wais3_info_age
    range: [1, 19]
    compare: wais3_info_scaled_stored
  wais3_info_z:
    label: Scaled score as a z-score, (scaled score - 10) / 3
    sum: [wais3_info_scaled]
    scale: [0.3333333, -3.3333333]
    compare: wais3_info_z_stored
    compare_tolerance: 0.006
