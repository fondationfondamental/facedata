instrument: fnart
title: French National Adult Reading Test (fNART)
tab: NEUROPSYCHOLOGIE
section: fNART
status: draft
notes: >
  Reading aloud of 40 irregular French words, each scored correct or
  incorrect: an estimate of the premorbid IQ. 686 visits from 2010 to 2016,
  all with the old neuropsychological form; the test is not in the form
  that replaced it.

  The total is the number of words read correctly: recomputed here, it
  equals the stored total on the 684 visits that have the 40 words. The
  three estimated IQs (full scale, verbal, performance) are each an exact
  straight line of the total, on all 685 visits; they are delivered as
  stored, and doubted where the stored total is not the number of correct
  words. The dictionary does not give the three equations.

