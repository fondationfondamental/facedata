scores:
  fnart_total:
    label: Number of words read correctly (0 to 40)
    sum: [fnart_01, fnart_02, fnart_03, fnart_04, fnart_05, fnart_06, fnart_07, fnart_08,
          fnart_09, fnart_10, fnart_11, fnart_12, fnart_13, fnart_14, fnart_15, fnart_16,
          fnart_17, fnart_18, fnart_19, fnart_20, fnart_21, fnart_22, fnart_23, fnart_24,
          fnart_25, fnart_26, fnart_27, fnart_28, fnart_29, fnart_30, fnart_31, fnart_32,
          fnart_33, fnart_34, fnart_35, fnart_36, fnart_37, fnart_38, fnart_39, fnart_40]
    range: [0, 40]
    otherwise: fnart_total_stored
    compare: fnart_total_stored
  fnart_qit:
    label: Full-scale IQ estimated from the fNART
    regression: wais3_fnart_qit
    from: fnart_total
    with: {total: fnart_total}
    range: [60, 140]
    compare: fnart_qit_stored
    compare_tolerance: 0.011
  fnart_qiv:
    label: Verbal IQ estimated from the fNART
    regression: wais3_fnart_qiv
    from: fnart_total
    with: {total: fnart_total}
    range: [60, 140]
    compare: fnart_qiv_stored
    compare_tolerance: 0.011
  fnart_qip:
    label: Performance IQ estimated from the fNART
    regression: wais3_fnart_qip
    from: fnart_total
    with: {total: fnart_total}
    range: [60, 140]
    compare: fnart_qip_stored
    compare_tolerance: 0.011
