instrument: lifetime_symptoms
title: Psychotic symptoms over the whole life and in the last month
tab: EVALUATION MEDICALE
section: SYMPTOMES VIE ENTIERE
status: reviewed
notes: >
  Twenty-two symptoms (ten delusions, ideas of reference, four kinds of
  hallucination, catatonia, three signs of disorganisation and three
  negative symptoms), each answered twice at the inclusion visit: ever, and
  present in the last month. 2,185 visits answer at least one symptom, all of
  them inclusion visits, and 1,148 answer the 22. 1 is yes, 0 is no; "Ne sais
  pas" is a missing code (66 to 224 answers per symptom for the first
  question, 6 to 61 for the second).

  The second question is shown after a yes to the first and only then: the
  field of the form depends on the first one, at its first option, for each of
  the 22 pairs (the table of the form, psy_diag_psychiatrique_sz). The cell is
  filled after a yes (15,896 of the 15,911 cells of the second question, 1,649
  of 1,650 for the delusion of persecution) and empty after a no. It is 0 here
  after a no (asked_if on the first question): 27,142 cells at inclusion, the
  22 variables together. After "Ne sais pas" to the first question it stays
  missing. 8 answers "yes in the last month" sit under a "no" to the first
  question and stay as typed. After a yes, the second answer is blank on 1,560
  of 17,456 cells, and on 87 of the 2,170 visits with a yes every second answer
  is blank (4%).

defaults: {type: item, range: [0, 1], codes: {Oui: 1, Non: 0}}

