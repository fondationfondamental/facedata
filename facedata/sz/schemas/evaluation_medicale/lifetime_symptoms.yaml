instrument: lifetime_symptoms
title: Psychotic symptoms over the whole life and in the last month
tab: EVALUATION MEDICALE
section: SYMPTOMES VIE ENTIERE
status: draft
notes: >
  Twenty-two symptoms (ten delusions, ideas of reference, four kinds of
  hallucination, catatonia, three signs of disorganisation and three
  negative symptoms), each answered twice at the inclusion visit: ever, and
  present in the last month. About 2,150 visits. 1 is yes, 0 is no; "Ne
  sais pas" is a missing code (66 to 224 answers per symptom).

  The second question is asked after a yes to the first (1,710 of 1,711
  cells for the delusion of persecution) and stays empty otherwise: it is
  not turned into a 0 here.

defaults: {type: item, range: [0, 1], codes: {Oui: 1, Non: 0}}

