instrument: violent_behaviours
title: Violent behaviours
tab: EVALUATION MEDICALE
section: COMPORTEMENTS VIOLENTS
status: reviewed
notes: >
  At the inclusion visit (1,816 visits; no other visit holds an answer): four
  kinds of violent behaviour of the patient over the whole life (verbal,
  physical, sexual, breaking of objects). For each: inside or outside the
  family, an intervention of the police, a conviction and its sentence; for the
  physical violence also blows and wounds, with or without a weapon, whether the
  other person needed care, and homicide; for the sexual violence its kind. 1 is
  yes, 0 is no. The form puts the question as "has the subject presented, over
  the whole life".

  The details hang on a gate in the form (the table psy_ecv_nom_champ): the type,
  the police and the conviction on the question of the kind of violence, the
  sentence on the conviction; for the physical violence the blows and homicide
  on the physical violence, and the weapon and the care needed on the blows,
  not on the physical violence. A detail is filled after a yes and empty
  otherwise. The ten yes/no questions that hang on a gate (the police and the
  conviction of the four kinds, the blows, the care needed) are 0 after a no on
  their gate (asked_if): 12,613 cells, the cascade included (the care needed
  hangs on the blows: 1,195 cells after a no to the physical violence, 211
  after blows and wounds "no"). The sets (type, weapon, sentence) are left as
  they are: an empty cell of a set is not a no. Cells that list several boxes
  ("Intrafamiliale,Extrafamiliale", the weapons, the sentences) are read as one
  yes/no per box. The firearm is written "Arme ? feu" in the extraction: the
  accented letter was lost by the export.

  Homicide (decision D80; closes open question O21). rad_ecv_vp5 is the
  question "Homicide" of the physical violence (field 136 of the form),
  committed by the patient over the whole life, and is delivered as
  violence_physical_homicide: 603 answers (8 yes) after a yes to the physical
  violence and 0 after a no (1,195), 1,798 valid cells in all. 12 of the 615
  visits with a physical violence have the answer blank. Of the 8 yes, 6 also
  hold blows and wounds, 6 an intervention of the police and 5 a conviction.

  Roll-out. The block is answered on 6%, 10% and 15% of the inclusion visits of
  2010, 2011 and 2012, 33% in 2013, 50% in 2014 and 81% to 99% from 2015.

defaults: {type: item, range: [0, 1], codes: {Oui: 1, Non: 0}}

