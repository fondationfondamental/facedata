instrument: violent_behaviours
title: Violent behaviours
tab: EVALUATION MEDICALE
section: COMPORTEMENTS VIOLENTS
status: draft
notes: >
  At the inclusion visit (about 1,800 visits): four kinds of violent
  behaviour of the patient (verbal, physical, sexual, breaking of
  objects). For each: inside or outside the family, an intervention of the
  police, a conviction and its sentence; for the physical violence also
  blows and wounds, with or without a weapon, and whether the other person
  needed care; for the sexual violence its kind. 1 is yes, 0 is no.

  The details are filled after a yes and stay empty otherwise. Cells that
  list several boxes ("Intrafamiliale,Extrafamiliale", the weapons, the
  sentences) are read as one yes/no per box. The firearm is written "Arme ?
  feu" in the extraction: the accented letter was lost by the export.

  rad_ecv_vp5 (603 cells, yes on 8), a question of the physical violence
  that the dictionary does not have, is ignored (open question O21).

defaults: {type: item, range: [0, 1], codes: {Oui: 1, Non: 0}}

variables:
  violence_verbal: {column: mhoccur_ecv_vv, label: "Verbal violence"}
  violence_verbal_within_family: {column: type_ecv_vv, separator: ",", codes: {Intrafamiliale: 1, Extrafamiliale: 0}, label: "Verbal violence: within family"}
  violence_verbal_outside_family: {column: type_ecv_vv, separator: ",", codes: {Intrafamiliale: 0, Extrafamiliale: 1}, label: "Verbal violence: outside family"}
  violence_verbal_police: {column: police_ecv_vv, label: "Verbal violence: the police intervened"}
  violence_verbal_convicted: {column: rad_ecv_vv4, label: "Verbal violence: convicted"}
  violence_verbal_sentence_fine: {column: condamn_ecv_vv, separator: ",", codes: {Amende: 1, Sursis: 0, Prison: 0}, label: "Verbal violence: sentence, amende"}
  violence_verbal_sentence_suspended: {column: condamn_ecv_vv, separator: ",", codes: {Amende: 0, Sursis: 1, Prison: 0}, label: "Verbal violence: sentence, sursis"}
  violence_verbal_sentence_prison: {column: condamn_ecv_vv, separator: ",", codes: {Amende: 0, Sursis: 0, Prison: 1}, label: "Verbal violence: sentence, prison"}

  violence_physical: {column: mhoccur_ecv_vp, label: "Physical violence"}
  violence_physical_blows: {column: rad_ecv_vp2, label: "Physical violence: blows and wounds"}
  violence_physical_no_weapon: {column: mhmodify_ecv_vp, separator: ",", codes: {"Sans arme": 1, "Arme blanche": 0, "Arme ? feu": 0}, label: "Physical violence: sans arme"}
  violence_physical_blade: {column: mhmodify_ecv_vp, separator: ",", codes: {"Sans arme": 0, "Arme blanche": 1, "Arme ? feu": 0}, label: "Physical violence: arme blanche"}
