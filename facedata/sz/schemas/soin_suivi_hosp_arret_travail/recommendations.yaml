instrument: recommendations
title: Whether the recommendations of the first evaluation were followed
tab: SOIN SUIVI HOSP ARRET TRAVAIL
section: Suivi des Recommandations
status: reviewed
notes: >
  At the follow-up visits (about 2,270): were the recommendations of the
  first evaluation followed (fully, partly, not), and if not fully, why.
  Four kinds of recommendation: the drug treatment and the other
  treatments, as in FACE BP, and two that the SZ form adds, the
  medico-social and the somatic recommendations.

  The reason is shown only after "partly" or "not followed" (positions 1
  and 2 of the answer in the field table). It is filled after those
  answers on 797 of 818 visits for the drug treatment, 992 of 1,016 for
  the other treatments, 500 of 520 for the medico-social recommendations
  and 697 of 732 for the somatic ones. Three reasons of the other
  treatments stand under another answer (two after "fully", one with no
  first answer): they are kept as recorded (decision R2, no shown_if); the
  other three kinds have none.

variables:
  drug_advice_followed: {column: trtmed_daorres, type: category, codes: {"Complètement suivi": fully, "Partiellement suivi": partly, "Non suivi": not_followed}, label: "Recommendations on the drug treatment: followed"}
  drug_advice_reason: {column: trtmed_reason, type: category, codes: {"Refus du patient": patient_refusal, "Désaccord du médecin pratiquant le suivi": physician_disagreement, "Problème de tolérance": tolerance, "Problème de rechute": relapse, "Autres": other}, label: "Drug recommendations not followed: why"}
  other_advice_followed: {column: trtnmed_daorres, type: category, codes: {"Complètement suivi": fully, "Partiellement suivi": partly, "Non suivi": not_followed}, label: "Recommendations on the other treatments: followed"}
  other_advice_reason: {column: trtnmed_reason, type: category, codes: {"Impossible à mettre en place": not_feasible, "Refus du patient": patient_refusal, "Désaccord avec le médecin pratiquant le suivi": physician_disagreement, "Autres": other}, label: "Other recommendations not followed: why"}
  medicosocial_advice_followed: {column: medicoso_daorres, type: category, codes: {"Complètement suivi": fully, "Partiellement suivi": partly, "Non suivi": not_followed}, label: "Medico-social recommendations: followed"}
  medicosocial_advice_reason: {column: medicoso_reason, type: category, codes: {"Impossible à mettre en place": not_feasible, "Refus du patient": patient_refusal, "Désaccord avec le médecin pratiquant le suivi": physician_disagreement, "Autres": other}, label: "Medico-social recommendations not followed: why"}
  somatic_advice_followed: {column: somat_daorres, type: category, codes: {"Complètement suivi": fully, "Partiellement suivi": partly, "Non suivi": not_followed}, label: "Somatic recommendations: followed"}
