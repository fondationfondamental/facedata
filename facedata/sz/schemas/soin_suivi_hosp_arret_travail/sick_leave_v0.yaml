instrument: sick_leave_v0
title: Sick leave at inclusion
tab: SOIN SUIVI HOSP ARRET TRAVAIL
section: ACTUEL
status: draft
notes: >
  At the inclusion visit (about 1,880): is the patient on sick leave now,
  was the patient on sick leave in the past year, and for how many weeks.
  "Non applicable" (the patient has no job: 992 answers) is a missing
  code. After a yes the weeks are filled on 197 of 247 visits; after a no
  they are 0 (asked_if, 616 visits), as in FACE BP. 11 values above 52
  weeks are out of range.

  SZ reads the past year from the social form; FACE BP reads it from its
  inclusion diagnosis form. FACE BP also asks the number of sick leaves and
  whether the current one is a long one; SZ does not.

variables:
  sick_leave_current: {column: hooccur_arret_travail_actuel, type: item, range: [0, 1], codes: {Oui: 1, Non: 0}, label: On sick leave now}
  sick_leave_12m: {column: hooccur_arret_travail_ly, type: item, range: [0, 1], codes: {Oui: 1, Non: 0}, label: On sick leave in the past year}
  sick_leave_weeks_12m: {column: hodur_arret_travail_ly, type: number, unit: weeks, range: [0, 52], winsor: false, asked_if: sick_leave_12m, label: Weeks of sick leave in the past year}
