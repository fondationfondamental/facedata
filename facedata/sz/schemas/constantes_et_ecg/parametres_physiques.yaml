instrument: parametres_physiques
title: Height, weight, body mass index and waist
tab: CONSTANTES et ECG
section: Paramètres physiques
status: reviewed
notes: >
  These columns have no unit column. In FACE BP a few values are written on
  another scale: a height in millimetres (1650 for 165 cm), a weight with a
  lost decimal point (8602 for 86.02 kg). The same units are declared here,
  so that such a value would be recognised and flagged unit_inferred; the SZ
  extraction holds none. The export keeps a height typed with a decimal
  point as it is (eschizo_infirmier.sql, lines 72 to 73) but strips any
  other character from the rest, so that a height typed "172,5" would
  become 1725 (lines 75 to 76): no height is 1,000 or more.

  Three heights under 100 cm, one weight of 55,300 and nine waists under 40
  cm (one of them 0) are impossible: out_of_range. One body mass index
  recomputed from a height and a weight inside their ranges falls outside
  10 to 80 (out_of_range). That visit and the visit of the weight of
  55,300 hold a stored index that is not recomputed (2
  score_not_recomputed).

  The body mass index is recomputed from the harmonised weight and height
  (custom function body_mass_index) and compared with the stored one, which
  is rounded to one decimal: no visit differs. It is computed on 4,303
  visits; the EMR stored it on 4,180, every year to 2026, although the BMI
  handler of the script of the clone of the application is commented out
  (inf_dossier_infirmier.js, lines 39 to 43): which script computes it in
  the centres is question M80.

  Same instrument and same schema as in FACE BP.

  No value is winsorised (winsor: false on the height, the weight and the
  waist, and no winsor on the score bmi), the user's decision of 2026-11-21
  for BP, SZ and DR, as in ASP (D80, rule R34): the hard ranges remove the
  impossible values, and the values beyond the 1st and 99th percentiles are
  real measures (obesity, hypertension, a slow or fast pulse) that the default
  would bring back to the percentile. Cells no longer clipped: height 74
  cells, weight 79, waist 74, body mass index 86 (winsorised 313 -> 0).

defaults: {type: number}

variables:
  height:
    label: Height
    unit: cm
    units:
      cm: {factor: 1, expect: [100, 230]}
      "cm, decimal point lost": {factor: 0.1, expect: [1000, 2300]}
      "cm, two decimals, point lost": {factor: 0.01, expect: [10000, 23000]}
      m: {factor: 100, expect: [1, 2.3]}
    range: [100, 230]
    winsor: false
  weight:
    label: Weight
    unit: kg
    units:
      kg: {factor: 1, expect: [25, 300]}
      0.1 kg: {factor: 0.1, expect: [300, 2500]}
      0.01 kg: {factor: 0.01, expect: [2500, 25000]}
    range: [25, 300]
    winsor: false
  waist:
    column: wstcir
    label: Waist circumference
    unit: cm
    units:
      cm: {factor: 1, expect: [40, 200]}
      mm: {factor: 0.1, expect: [400, 2000]}
    range: [40, 200]
    winsor: false
  bmi_stored: {column: bmi, label: Body mass index as stored, range: [5, 300], winsor: false, keep: false}

scores:
  bmi:
    label: Body mass index, from the harmonised weight and height
    custom: body_mass_index
    compare: bmi_stored
    compare_tolerance: 0.051
    range: [10, 80]
