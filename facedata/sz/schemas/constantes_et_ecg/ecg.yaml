instrument: ecg
title: Electrocardiogram
tab: CONSTANTES et ECG
section: ECG
status: draft
notes: >
  The SZ extraction holds one ECG column, the corrected QT interval that the
  EMR stores. The QT and RR intervals and the heart rate, from which FACE BP
  recomputes it, are not extracted, so it cannot be checked here.

  It is in seconds in the dictionary. Part of the values are written in
  milliseconds (413 for 0.413 s) or in hundredths of a second (39 for
  0.39 s); the unit is recognised from the size of the value and the cell is
  flagged unit_inferred. A value of 0 stands for "not measured": missing
  code.

  In BP the EMR computes this value from the QT and RR as typed, and it is
  absurd where the two are not on the same scale (0.013 or 13). The same
  values are found here and end out_of_range.

  Same instrument as in FACE BP, reduced to the stored value.

defaults: {type: number, unit: s, missing: {0: not_recorded}}

variables:
  qtc_stored:
    column: qtc
    label: Corrected QT interval as stored by the EMR
    units:
      s: {factor: 1, expect: [0.2, 0.7]}
      cs: {factor: 0.01, expect: [20, 70]}
      ms: {factor: 0.001, expect: [200, 700]}
    range: [0.2, 0.7]
