instrument: family_structure
title: Family structure
tab: ANTECEDENTS
section: Enfants, Fratrie, Parents
status: draft
level: patient
notes: >
  How many daughters, sons, sisters and brothers the patient has, how many
  of them have something to describe, and whether each parent has. One
  value per patient, in the table patients. The details of each relative
  are in family_history.

  The question, as in FACE BP: a relative "with a psychiatric disorder, an
  abuse of or dependence on a substance, a history of suicide attempt or a
  cardiovascular risk factor". A yes is therefore not a psychiatric
  history. The names of the variables say "affected" for short.

  The number of affected sisters is asked only when the patient has
  sisters: with no sister it is 0 (asked_if), and the same for the
  brothers, the daughters and the sons. "U" is a missing code (135 mothers,
  193 fathers).

  The BP schema without the four grandparents, which the SZ form does not
  ask about. About 2,200 patients answer.

defaults: {type: item}
variables:
  n_daughters: {column: fille_structure, range: [0, 20], label: Number of daughters}
  n_daughters_affected:
    column: fille_structureatteint
    range: [0, 20]
    asked_if: n_daughters
    label: Daughters with a disorder or a cardiovascular risk factor
  n_sons: {column: fils_structure, range: [0, 20], label: Number of sons}
  n_sons_affected:
    column: fils_structureatteint
    range: [0, 20]
    asked_if: n_sons
    label: Sons with a disorder or a cardiovascular risk factor
  n_sisters: {column: soeur_structure, range: [0, 20], label: Number of sisters}
  n_sisters_affected:
    column: soeur_structureatteint
    range: [0, 20]
    asked_if: n_sisters
    label: Sisters with a disorder or a cardiovascular risk factor
  n_brothers: {column: frere_structure, range: [0, 20], label: Number of brothers}
  n_brothers_affected:
    column: frere_structureatteint
    range: [0, 20]
    asked_if: n_brothers
    label: Brothers with a disorder or a cardiovascular risk factor
  mother_affected:
    column: mere_structure
    range: [0, 1]
    codes: {Y: 1, N: 0}
    missing: {U: unknown}
    label: The mother has a disorder or a cardiovascular risk factor
  father_affected:
    column: pere_structure
    range: [0, 1]
    codes: {Y: 1, N: 0}
    missing: {U: unknown}
    label: The father has a disorder or a cardiovascular risk factor
