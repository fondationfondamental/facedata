instrument: autoimmune_history_fu
title: Auto-immune diseases, at follow-up
tab: ANTECEDENTS
section: Pathologies auto-immunes
status: draft
notes: >
  A section that BP does not have, asked from 2012 (about 1,415 visits):
  thirteen diseases, each with "treated at present". Nearly every answer is
  no; "Nc" is a missing code (about 28 answers per disease). Five of the
  "treated" columns are empty in the extraction.

  The questions of the inclusion form, asked again at part of the follow-up
  visits (about 400, 5% to 40% of the visits of a year), where they seem to
  be about the time since the last visit: see the schema of the inclusion
  form, whose notes hold for this one.

version:
  name: visit_form
  column: visit
  codes:
