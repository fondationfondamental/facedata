instrument: neurological_history_v0
title: Neurological history, at inclusion
tab: ANTECEDENTS
section: Pathologies neurologiques
status: draft
notes: >
  The two migraine columns are swapped in the extraction (open question
  O24): migraine_mhdecod, named for "treated", holds the answer of every
  patient (2,488 cells), and migraine_mhoccur, named for the disease, is
  filled only after a yes (164 of 166 cells). They are read the other way
  round. Every other disease has its answer in _mhoccur. Migraine is "yes"
  for 10% to 15% of the answers of 2011 to 2017 and for 4% to 7% of those of
  2018 to 2026, while no other disease of the section moves (open question
  O27).

  Yes/no answers are delivered as 1 and 0; "U" is a missing code. "Treated"
  and the other details are asked after a yes and are missing otherwise.

  Two forms in the same columns, as in FACE BP (BP decision D59; checked on
  the SZ data, decision D20 in PROGRESS.md). At the inclusion visit the
  questions are about the whole life. At the follow-up visits a disease
  answered yes at inclusion is most often answered no (39 of 47 for a head
  injury, 43 of 54 for acne), so the follow-up form seems to ask about the
  time since the last visit. The two are delivered as separate columns
  ending in _v0 and _fu; visit_form says which form a visit used.

  The section is answered at about 80% of the inclusion visits or more in
  every year, with no fall in 2022. Three other sections of the medical
  history do fall in 2022: the digestive diseases, the autoimmune diseases
  and the other diseases (decision D23 in PROGRESS.md).

  The SZ form is shorter than the BP one: one question "treated" per
  disease, and no date of onset and no "controlled". The names are those of
  BP where the question is the same.

