    V7_ans: follow_up
    V8_ans: follow_up
    V9_ans: follow_up
    V10_ans: follow_up
    V6_mois: follow_up
    V18_mois: follow_up
    V30_mois: follow_up
    V42_mois: follow_up
    V54_mois: follow_up
    V66_mois: follow_up
    V78_mois: follow_up
    V90_mois: follow_up
    V102_mois: follow_up
    V114_mois: follow_up
    V126_mois: follow_up

defaults: {versions: [inclusion]}

variables:
  allergic_inflammatory_v0: {column: somat_all, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Allergic disease, at inclusion"}
  asthma_v0: {column: chk_somat_all_specifier, type: item, range: [0, 1], separator: ",", codes: {"Allergies hors asthme": 0, "Asthme (allergique ou non)": 1}, asked_if: allergic_inflammatory_v0, label: "Asthma, at inclusion"}
  allergy_v0: {column: chk_somat_all_specifier, type: item, range: [0, 1], separator: ",", codes: {"Allergies hors asthme": 1, "Asthme (allergique ou non)": 0}, asked_if: allergic_inflammatory_v0, label: "Allergy other than asthma, at inclusion"}
