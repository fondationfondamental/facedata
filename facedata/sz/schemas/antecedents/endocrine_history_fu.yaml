instrument: endocrine_history_fu
title: Endocrine and metabolic history, at follow-up
tab: ANTECEDENTS
section: Pathologies endocriniennes et métaboliques
status: draft
notes: >
  The SZ form asks about type 2 diabetes here (type 1 is with the
  auto-immune diseases), where BP asks one question and then the type.

  The questions of the inclusion form, asked again at part of the follow-up
  visits (about 400, 5% to 40% of the visits of a year), where they seem to
  be about the time since the last visit: see the schema of the inclusion
  form, whose notes hold for this one.

version:
  name: visit_form
  column: visit
  codes:
    V0: inclusion
    V1_an: follow_up
    V2_ans: follow_up
    V3_ans: follow_up
    V4_ans: follow_up
    V5_ans: follow_up
    V6_ans: follow_up
    V7_ans: follow_up
    V8_ans: follow_up
    V9_ans: follow_up
    V10_ans: follow_up
    V6_mois: follow_up
    V18_mois: follow_up
    V30_mois: follow_up
    V42_mois: follow_up
    V54_mois: follow_up
    V66_mois: follow_up
    V78_mois: follow_up
    V90_mois: follow_up
    V102_mois: follow_up
    V114_mois: follow_up
    V126_mois: follow_up

defaults: {versions: [follow_up]}

variables:
  diabetes_type2_fu: {column: diabete2_mhoccur, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Type 2 diabetes, at follow-up"}
  diabetes_type2_treated_fu: {column: diabete2_mhdecod, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Type 2 diabetes: treated at present, at follow-up"}
  thyroid_disorder_fu: {column: dysthyro_mhoccur, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Thyroid disorder, at follow-up"}
  thyroid_disorder_type_fu: {column: dysthyro_mhmodify, type: category, codes: {"Hypo-thyroïdie": hypothyroidism, "Hyper-thyroïdie": hyperthyroidism}, label: "Thyroid disorder: which, at follow-up"}
  thyroid_disorder_treated_fu: {column: dysthyro_mhdecod, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Thyroid disorder: treated at present, at follow-up"}
  dyslipidaemia_fu: {column: dyslipidemie_mhoccur, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Dyslipidaemia, at follow-up"}
  dyslipidaemia_type_fu: {column: dyslipidemie_mhmodify, type: category, codes: {"Hypercholestérolémie": hypercholesterolaemia, "Hypertriglycéridémie": hypertriglyceridaemia, "Les deux": both}, label: "Dyslipidaemia: which, at follow-up"}
  dyslipidaemia_treated_fu: {column: dyslipidemie_mhdecod, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Dyslipidaemia: treated, at follow-up"}
  other_endocrine_fu: {column: autendoc_mhoccur, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Another endocrine disease, at follow-up"}
  other_endocrine_text_fu: {column: autendoc_mhmodify, type: text, label: "Another endocrine disease: which one, as written, at follow-up"}
