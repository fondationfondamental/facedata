variables:
  n_pregnancies_fu: {column: pregnn_rporres, type: item, range: [0, 30], label: "Number of pregnancies, at follow-up"}
  menopause_fu: {column: menostat_rporres, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Menopause, at follow-up"}
  menopause_hormone_therapy_fu: {column: hormonal_rporres, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Hormonal treatment of the menopause, at follow-up"}
