  diabetes_type2_treated_v0: {column: diabete2_mhdecod, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Type 2 diabetes: treated at present, at inclusion"}
  thyroid_disorder_v0: {column: dysthyro_mhoccur, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Thyroid disorder, at inclusion"}
  thyroid_disorder_type_v0: {column: dysthyro_mhmodify, type: category, codes: {"Hypo-thyroïdie": hypothyroidism, "Hyper-thyroïdie": hyperthyroidism}, label: "Thyroid disorder: which, at inclusion"}
  thyroid_disorder_treated_v0: {column: dysthyro_mhdecod, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Thyroid disorder: treated at present, at inclusion"}
  dyslipidaemia_v0: {column: dyslipidemie_mhoccur, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Dyslipidaemia, at inclusion"}
  dyslipidaemia_type_v0: {column: dyslipidemie_mhmodify, type: category, codes: {"Hypercholestérolémie": hypercholesterolaemia, "Hypertriglycéridémie": hypertriglyceridaemia, "Les deux": both}, label: "Dyslipidaemia: which, at inclusion"}
  dyslipidaemia_treated_v0: {column: dyslipidemie_mhdecod, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Dyslipidaemia: treated, at inclusion"}
  other_endocrine_v0: {column: autendoc_mhoccur, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Another endocrine disease, at inclusion"}
  other_endocrine_text_v0: {column: autendoc_mhmodify, type: text, label: "Another endocrine disease: which one, as written, at inclusion"}
