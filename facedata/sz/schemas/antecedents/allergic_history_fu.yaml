variables:
  allergic_disease_fu: {column: somat_all, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Allergic disease, at follow-up"}
  asthma_fu: {column: chk_somat_all_specifier, type: item, range: [0, 1], separator: ",", codes: {"Allergies hors asthme": 0, "Asthme (allergique ou non)": 1}, asked_if: allergic_disease_fu, label: "Asthma, at follow-up"}
  allergy_fu: {column: chk_somat_all_specifier, type: item, range: [0, 1], separator: ",", codes: {"Allergies hors asthme": 1, "Asthme (allergique ou non)": 0}, asked_if: allergic_disease_fu, label: "Allergy other than asthma, at follow-up"}
