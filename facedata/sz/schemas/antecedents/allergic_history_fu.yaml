instrument: allergic_history_fu
title: Allergic history, at follow-up
tab: ANTECEDENTS
section: Pathologies allergiques
status: draft
notes: >
  One question, then two boxes written in one cell, as in BP (asked_if: no
  allergic disease means neither). The columns asthme_mhoccur and
  allergie_mhoccur repeat each box in a column of its own and are ignored.
  Lupus and rheumatoid arthritis, boxes of this list in BP, are with the
  auto-immune diseases here.

  The questions of the inclusion form, asked again at part of the follow-up
  visits (about 400, 5% to 40% of the visits of a year), where they seem to
  be about the time since the last visit: see the schema of the inclusion
  form, whose notes hold for this one.

version:
  name: visit_form
  column: visit
  codes:
    V0: inclusion
    V1_an: follow_up
    V2_ans: follow_up
    V3_ans: follow_up
    V4_ans: follow_up
    V5_ans: follow_up
    V6_ans: follow_up
    V7_ans: follow_up
    V8_ans: follow_up
    V9_ans: follow_up
    V10_ans: follow_up
    V6_mois: follow_up
    V18_mois: follow_up
    V30_mois: follow_up
    V42_mois: follow_up
    V54_mois: follow_up
    V66_mois: follow_up
    V78_mois: follow_up
    V90_mois: follow_up
    V102_mois: follow_up
    V114_mois: follow_up
    V126_mois: follow_up

defaults: {versions: [follow_up]}

variables:
  allergic_inflammatory_fu: {column: somat_all, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Allergic disease, at follow-up"}
  asthma_fu: {column: chk_somat_all_specifier, type: item, range: [0, 1], separator: ",", codes: {"Allergies hors asthme": 0, "Asthme (allergique ou non)": 1}, asked_if: allergic_inflammatory_fu, label: "Asthma, at follow-up"}
  allergy_fu: {column: chk_somat_all_specifier, type: item, range: [0, 1], separator: ",", codes: {"Allergies hors asthme": 1, "Asthme (allergique ou non)": 0}, asked_if: allergic_inflammatory_fu, label: "Allergy other than asthma, at follow-up"}
