instrument: provenance
title: How the patient came to the expert centre
tab: PATIENT
section: Provenance
status: reviewed
level: patient
notes: >
  One value per patient; no value changes between the visits of a patient.
  Filled for about two patients in three (1,591 have a referrer).

  Same instrument as in FACE BP, read in the columns of the SZ extraction:
  the free text of the referrer is adresseur_autres, the date of the
  referral letter is dsstdtc, the free text of "how did you hear of the
  centre" is connaissance_autre. The date at which the information was
  collected (dmdtc in BP) is not in the SZ extraction.

  The purpose of the visit is a multiple choice, exported as a list in one
  cell; only three combinations occur.

  The date of the referral letter holds the placeholder 1000-01-01 for 10
  patients (date_placeholder). Four letters are dated before 2005 and 14 a
  year or more after the visit of the row; they are inside the hard range
  and are delivered as written.

  The referring association is known for 4 patients.

  The form is filled for 75% to 99% of the patients included up to 2018,
  68% in 2019 and 42% to 58% from 2020: centres A and F nearly stopped filling it (85%
  and 78% of their patients included in 2016 to 2018, 11% and 10% from
  2019), centre I in part (77%, then 35%). The share of patients from
  inside the catchment area rises with it (10% to 23% in 2014 to 2018, 39%
  to 53% from 2021), as centre A (81% from outside) left. The purpose of
  the visit differs between centres (treatment 71% of the answers at
  centre C, diagnosis 56% at centre H, both 76% at centres A and I). No
  cause of these steps is known; they are documented here.

  The two free-text details may hold names of people or places; they are
  delivered as text and never appear in the report.

variables:
  catchment:
    column: secteur
    label: Patient lives inside the centre's catchment area
    type: category
    codes: {Secteur du centre: inside, Hors secteur du centre: outside}
  referred_by:
    column: adresseur
    label: Referred by
    type: category
    codes:
      Psychiatre libéral: private_psychiatrist
      Psychiatre hospitalier du secteur du centre: hospital_psychiatrist_inside
      Psychiatre hospitalier hors du secteur: hospital_psychiatrist_outside
      Généraliste: general_practitioner
      Psychologue ou Psychothérapeute: psychologist
      Patient lui-même: self
      Entourage: relatives
      Association: association
      Autres: other
  referred_by_association:
    column: adresseur_association
    label: Referring association
    type: category
    codes: {Argos: argos, Unafam: unafam, Autres: other}
  referred_by_detail:
    column: adresseur_autres
    label: Referred by, free text
    type: text
  referral_letter_date:
    column: dsstdtc
    label: Date of the referring doctor's letter
    type: date
    range: [1990-01-01, 2030-12-31]
  visit_purpose:
    column: objet_visite
    label: Purpose of the visit
    type: category
    codes:
      "Avis diagnostic,Avis thérapeutique": diagnosis_and_treatment
      Avis diagnostic: diagnosis
      Avis thérapeutique: treatment
  heard_of_centre_from:
    column: connaissance_centre_expert
    label: How the patient heard of the expert centre
    type: category
    codes:
      Psychiatre: psychiatrist
      Médecin généraliste: general_practitioner
      Internet: internet
      Association: association
      Autre: other
  heard_of_centre_detail:
    column: connaissance_autre
    label: How the patient heard of the expert centre, free text
    type: text
