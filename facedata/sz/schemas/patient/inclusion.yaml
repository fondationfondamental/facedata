instrument: inclusion
title: Inclusion
tab: PATIENT
section: Inclusion
status: draft
level: patient
notes: >
  One value per patient.

  formoppos is not in the dictionary. In FACE BP the data managers described
  it (decision D68 of the BP file): it is the raw code of the EMR for the
  non-opposition form; the export removes the patients with code 3 or 4, the
  oppositions, so these codes never occur; the meaning of codes 1 and 2 is
  not documented.

  Here it is filled for 1,099 of the 2,353 patients: 3% of those included in
  2010 and 2011, about half of those included since 2015. Code 1 for 1,012
  patients and code 2 for 87, in nine centres and in every year from 2012.
  In BP code 2 is given to 3 patients of 619, so its meaning matters more
  here (open question O1 in PROGRESS.md). The codes are delivered as
  written.

  Same instrument as in FACE BP, without the legal protection measure
  (social_protec), which the SZ extraction does not hold.

variables:
  opposition_form:
    column: formoppos
    label: Non-opposition form, code of the EMR (meaning of 1 and 2 not documented)
    type: category
    codes: {1: "1", 2: "2"}
