instrument: identite
title: Patient identity
tab: PATIENT
section: IDENTIFICATION PATIENT
status: draft
level: patient
notes: >
  One value per patient. The extraction repeats these columns on every visit
  row, and they never change between the visits of a patient.

  The date of birth is exported with the day set to the 15th for every
  patient. The stored age is the age at the inclusion visit (V0): it equals
  the age computed from the date of birth and the V0 date for 2,350 of 2,353
  patients, and is one year more for the other 3.

  The type of disorder holds three values: schizophrenia (1,797 patients),
  schizoaffective disorder (513) and schizophreniform disorder (43). The
  dictionary lists other diagnoses (schizoid and schizotypal personality,
  brief psychotic disorder and others) that the extraction does not hold.

  Same instrument as in FACE BP, with the diagnoses of this cohort.

  fondacode (the column subjid) is the patient code of the foundation. A
  usubjid is a number given inside the cohort: it can change from one
  extraction to the next for a patient registered in two centres, and 824
  numbers are also used in FACE BP for other patients. The fondacode does
  neither: it is the key to join two extractions or two cohorts (decision
  D9 in PROGRESS.md). It is a text and never appears in the report.

  usubjid and siteid are key columns. The dictionary also lists nom_centre,
  which is not in the extraction.

variables:
  fondacode:
    column: subjid
    label: Patient code of the foundation, the same in every extraction and unique across the cohorts
    type: text
  sex:
    label: Sex
    type: category
    codes: {Feminin: female, Masculin: male}
  diagnosis:
    column: arm
    label: Type of psychotic disorder
    type: category
    codes:
      Schizophrénie: schizophrenia
      Trouble schizo-affectif: schizoaffective
      Trouble schizophréniforme: schizophreniform
  birth_date:
    column: brthdtc
    label: Date of birth (the export sets the day to the 15th)
    type: date
    range: [1900-01-01, 2012-12-31]
  age_at_inclusion:
    column: age
    label: Age at the inclusion visit, in years
    type: item
    range: [15, 100]
