instrument: isf_lifetime
title: Suicidal thoughts and acts over the whole life (inclusion visit)
tab: SUICIDE
section: Intentionnalité suicidaire (VIE ENTIERE ou depuis la DERNIERE VISITE)
status: draft
notes: >
  Five yes/no questions of rising severity, each followed by "when did it
  last happen?". Delivered as 1 (yes) and 0 (no). 2,239 of the 2,353
  inclusion visits hold at least one answer.

  Two forms in the same columns, as in FACE BP (BP decisions D46 and D85;
  checked on the SZ data, decision D16 in PROGRESS.md). At the inclusion
  visit the five questions are about the whole life: 64% answer yes to the
  first and 30% say they have attempted suicide. At the follow-up visits
  the same columns hold the answers for the time since the last visit: 31%
  and 2.4%. Of the 665 later answers of the patients who said at inclusion
  that they had attempted suicide, 631 (95%) are no; 300 of these 332
  patients (90%) say no at every later visit. The answers to "when did it
  last happen" differ too: last week, two weeks to a year ago or more than
  a year ago at inclusion; last week or since the last visit at follow-up.
  The two forms are two instruments, isf_lifetime and isf_since_visit.
  visit_form says which form a visit used; it is read from the visit
  label. The screening rows hold none of these columns.

  21 to 38 "yes" answers per question have no "when" (inclusion visits).

  The BP schema, unchanged.

