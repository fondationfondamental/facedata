instrument: alcohol_use
title: Alcohol use
tab: SUBSTANCES ET COMORBIDITE
section: Alcool
status: reviewed
notes: >
  Has the patient drunk alcohol more than ten times in their life, the
  amounts and frequencies over the whole life (in the periods of heaviest
  use, "périodes de consommation maximales" in the form) and in the last 12
  months, the frequency of heavy drinking (more than 6 glasses on one
  occasion), the age at the first drink, the longest abstinence, the family
  history and a craving score. 3,477 visits answer the first question; 75%
  say yes at inclusion and 73% at follow-up. The question is "more than ten
  times in your life", not "ever": the patients who say no are asked a second
  question, whether they never drank at all (alcohol_never_once, primary
  abstinence). That question is shown after a no only, so after a yes it is
  delivered as 0 (asked_if on a hidden variable that reads the first answer
  the other way round and is not delivered): 2,578 cells missing become 0
  (1,218 at inclusion, 1,360 at follow-up).

  Asked at inclusion and at yearly visits, used from 2015 and not from 2012:
  the first question is answered on 9% of the inclusion visits of 2012, 18% of
  2014, 48% of 2015 and 83% to 93% from 2016 (yearly visits: 14% in 2014, 55%
  in 2015, 68% to 90% after). The questions about the whole life keep that
  meaning at follow-up on average only: the share of yes is the same at the
  two, but 169 of the 1,154 later answers (15%) of the patients who said yes
  at inclusion are no, and at follow-up the age at onset of the disorder
  equals the age given at inclusion in 65 of 97 pairs (substance_fu.yaml). The
  details are filled after a yes. 999 and 9999 mean "does not know" in an
  amount or a duration, 99 in an age. "Ne sais pas" is a missing code.

  Not asked, not no. The questions at the end of the section (age at the first
  use, longest abstinence, family history of a use disorder, craving) are
  shown only with two or more DSM-5 criteria, a count that is in another tab
  (auto_questionnaire/dsm5_alcohol.yaml): they are filled on 0 of 1,500 visits
  with none or one criterion and on 80% to 85% of 546 with two or more. An
  empty cell means "not asked"; it is not encoded.

  The number of times per week is filled after "1 to 7 times a week" (98% of
  1,247 answers for the whole life) and after "less than weekly" on none of
  740: not encoded. "Less than weekly" holds the non-users of the last 12
  months: 559 of the 1,266 answers of that frequency have an amount of 0.

  Amounts are glasses (10 g of alcohol) per day of use. The range is 0 to 40
  glasses: 49 amounts over the whole life are above it (22 from 41 to 60, 22
  from 61 to 100 and 5 above 100; 8 more are 999) and 5 of the last 12 months;
  they are flagged out_of_range and delivered as missing. Ages are plausible:
  the first use is at 6 or later and none is above the patient's age. Two
  frequency columns of the last 12 months have names of their own
  (rad_add_alc6b, rad_add_alc6c). The twelve criteria of an alcohol use
  disorder are in auto_questionnaire/dsm5_alcohol.yaml. The questions of the
  form on a drug treatment of the alcohol use disorder and on a hospitalisation
  for withdrawal (yes, number, age at the first) are not in the extraction
  (export request R120).

  By year, "never once" is delivered as yes (0 after a yes to the first
  question included) on 8% of the answers of 2014-16, of 2017-19 and of
  2020-22, and on 15% from 2023, with a rise in eight of the nine centres that
  have 20 answers in both of the last two periods. The longest abstinence
  (months, a question over the whole life) has a median of 4 in 2014-19, 11 in
  2020-22 and 6 from 2023, and of 3 to 6 in five centres against 12 and 18 in
  two others; the family history is yes on 30% to 52% by centre: no known
  cause.

variables:
  alcohol_over_ten_times: {column: suoccur_alcoollt, type: item, range: [0, 1], codes: {Y: 1, N: 0}, label: "Alcohol: more than ten times in your life"}
  alcohol_up_to_ten_times: {column: suoccur_alcoollt, type: item, range: [0, 1], codes: {Y: 0, N: 1}, keep: false, label: "Alcohol: ten times or fewer in your life (the answer of alcohol_over_ten_times read the other way round; not delivered, the gate of alcohol_never_once)"}
  alcohol_never_once: {column: suncf_alcoollt, type: item, range: [0, 1], codes: {Oui: 1, Non: 0}, asked_if: alcohol_up_to_ten_times, label: "Alcohol: not one use in the whole life (primary abstinence; asked after a no to more than ten times)"}
  alcohol_dose_lifetime: {column: sudose_alcoollt, type: number, unit: glasses per day, range: [0, 40], missing: {999: unknown, 9999: unknown}, label: "Alcohol: amount per day of use, in the periods of heaviest use over the whole life"}
  alcohol_frequency_lifetime: {column: sudosfrq_alcoollife, type: category, codes: {"1 à 7 fois par semaine": weekly, "Moins d'une fois par semaine": less_than_weekly}, label: "Alcohol: frequency of use in the periods of heaviest use over the whole life"}
  alcohol_times_per_week_lifetime: {column: sudosfrq_alcoollt, type: item, range: [1, 7], label: "Alcohol: times per week in the periods of heaviest use"}
  alcohol_dose_12m: {column: sudose_alcoolly, type: number, unit: glasses per day, range: [0, 40], missing: {999: unknown, 9999: unknown}, label: "Alcohol: amount per day of use in the last 12 months"}
  alcohol_frequency_12m: {column: rad_add_alc6b, type: category, codes: {"1 à 7 fois par semaine": weekly, "Moins d'une fois par semaine": less_than_weekly}, label: "Alcohol: frequency in the last 12 months"}
  alcohol_times_per_week_12m: {column: rad_add_alc6c, type: item, range: [1, 7], label: "Alcohol: times per week in the last 12 months"}
  alcohol_heavy_frequency_lifetime: {column: freqimp_alcoollife, type: category, codes: {"1 à 7 fois par semaine": weekly, "Moins d'une fois par semaine": less_than_weekly}, label: "Alcohol: frequency of heavy use (more than 6 glasses on one occasion) in the periods of heaviest use over the whole life"}
  alcohol_heavy_times_per_week_lifetime: {column: freqimp_alcoollt, type: item, range: [1, 7], label: "Alcohol: heavy use (more than 6 glasses on one occasion), times per week, in the periods of heaviest use"}
  alcohol_heavy_frequency_12m: {column: freqimp_alcoolly, type: category, codes: {"1 à 7 fois par semaine": weekly, "Moins d'une fois par semaine": less_than_weekly}, label: "Alcohol: frequency of heavy use (more than 6 glasses on one occasion) in the last 12 months"}
  alcohol_heavy_times_per_week_12m: {column: freqimp_alcoollynb, type: item, range: [1, 7], label: "Alcohol: heavy use (more than 6 glasses on one occasion) in the last 12 months, times per week"}
  alcohol_first_age: {column: agedebut_alcoollt, type: item, range: [0, 90], missing: {99: unknown, 999: unknown}, label: "Alcohol: age at the first use"}
  alcohol_max_abstinence: {column: durabsti_alcoollt, type: number, unit: months, range: [0, 720], missing: {999: unknown, 9999: unknown}, label: "Alcohol: longest abstinence"}
  alcohol_family_history: {column: atcd1deg_alcoollt, type: item, range: [0, 1], codes: {Oui: 1, Non: 0}, label: "Alcohol: first-degree relative with a use disorder"}
  alcohol_craving_score: {column: craving_alcoollt, type: item, range: [0, 10], codes: {"0 Jamais": 0, "10 Tout le temps": 10}, label: "Alcohol: maximum craving in the last week (0 never to 10 all the time)"}
