instrument: alcohol_use
title: Alcohol use
tab: SUBSTANCES ET COMORBIDITE
section: Alcool
status: draft
notes: >
  Has the patient ever drunk alcohol, the amounts and frequencies over the
  whole life and in the last 12 months, the frequency of heavy drinking,
  the age at the first drink, the longest abstinence, the family history
  and a craving score. 3,477 visits; 75% have ever drunk at inclusion and
  73% at follow-up. 169 of 1,154 later answers of patients who said yes at
  inclusion are no: the answer is not always kept from one year to the
  next.

  Asked at inclusion and at follow-up, from 2012. The questions about the
  whole life keep that meaning at follow-up: the share of patients who
  have ever used is the same at the two (see the notes below), unlike the
  questions on a use disorder (substance_v0.yaml). The details are filled
  after a yes. 999 and 9999 mean "does not know" in an amount or a
  duration, 99 in an age. "Ne sais pas" is a missing code. The number of
  times per week is filled when the frequency is "1 to 7 times a week".

  Amounts are glasses (10 g of alcohol) per day of drinking. 35 amounts
  over the whole life are above 60 glasses (13 times 100): they are kept up
  to 100 and out of range above. Two frequency columns of the last 12
  months have names of their own (rad_add_alc6b, rad_add_alc6c). The twelve
  criteria of an alcohol use disorder are in auto_questionnaire/dsm5_alcohol.yaml.

variables:
  alcohol_ever: {column: suoccur_alcoollt, type: item, range: [0, 1], codes: {Y: 1, N: 0}, label: "Alcohol: has ever used"}
  alcohol_never_once: {column: suncf_alcoollt, type: item, range: [0, 1], codes: {Oui: 1, Non: 0}, label: "Alcohol: not one use in the whole life (asked after a no)"}
  alcohol_dose_lifetime: {column: sudose_alcoollt, type: number, unit: glasses per day, range: [0, 100], missing: {999: unknown, 9999: unknown}, label: "Alcohol: amount per day of use, in the periods of use over the whole life"}
  alcohol_frequency_lifetime: {column: sudosfrq_alcoollife, type: category, codes: {"1 à 7 fois par semaine": weekly, "Moins d'une fois par semaine": less_than_weekly}, label: "Alcohol: frequency in the periods of use over the whole life"}
  alcohol_times_per_week_lifetime: {column: sudosfrq_alcoollt, type: item, range: [1, 7], label: "Alcohol: times per week in the periods of use"}
  alcohol_dose_12m: {column: sudose_alcoolly, type: number, unit: glasses per day, range: [0, 100], missing: {999: unknown, 9999: unknown}, label: "Alcohol: amount per day of use in the last 12 months"}
  alcohol_frequency_12m: {column: rad_add_alc6b, type: category, codes: {"1 à 7 fois par semaine": weekly, "Moins d'une fois par semaine": less_than_weekly}, label: "Alcohol: frequency in the last 12 months"}
  alcohol_times_per_week_12m: {column: rad_add_alc6c, type: item, range: [1, 7], label: "Alcohol: times per week in the last 12 months"}
  alcohol_heavy_frequency_lifetime: {column: freqimp_alcoollife, type: category, codes: {"1 à 7 fois par semaine": weekly, "Moins d'une fois par semaine": less_than_weekly}, label: "Alcohol: frequency of heavy use over the whole life"}
  alcohol_heavy_times_per_week_lifetime: {column: freqimp_alcoollt, type: item, range: [1, 7], label: "Alcohol: heavy use, times per week"}
  alcohol_heavy_frequency_12m: {column: freqimp_alcoolly, type: category, codes: {"1 à 7 fois par semaine": weekly, "Moins d'une fois par semaine": less_than_weekly}, label: "Alcohol: frequency of heavy use in the last 12 months"}
  alcohol_heavy_times_per_week_12m: {column: freqimp_alcoollynb, type: item, range: [1, 7], label: "Alcohol: heavy use in the last 12 months, times per week"}
  alcohol_first_age: {column: agedebut_alcoollt, type: item, range: [0, 90], missing: {99: unknown, 999: unknown}, label: "Alcohol: age at the first use"}
  alcohol_max_abstinence: {column: durabsti_alcoollt, type: number, unit: months, range: [0, 720], missing: {999: unknown, 9999: unknown}, label: "Alcohol: longest abstinence"}
  alcohol_family_history: {column: atcd1deg_alcoollt, type: item, range: [0, 1], codes: {Oui: 1, Non: 0}, label: "Alcohol: first-degree relative with a use disorder"}
  alcohol_craving_score: {column: craving_alcoollt, type: item, range: [0, 10], codes: {"0 Jamais": 0, "10 Tout le temps": 10}, label: "Alcohol: craving (0 never to 10 all the time)"}
