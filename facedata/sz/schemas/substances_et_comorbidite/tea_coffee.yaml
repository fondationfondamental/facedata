instrument: tea_coffee
title: Tea and coffee
tab: SUBSTANCES ET COMORBIDITE
section: The
status: draft
notes: >
  Cups per day and frequency of tea and of coffee, over the whole life and
  in the last 12 months. Asked at inclusion and at follow-up from 2012
  (about 2,600 visits each). 999 means "does not know". A few amounts are
  out of range (365 cups of coffee a day on 3 visits: a number per year).

  sudosnb_cafelt, the times per week for coffee, is not in the dictionary;
  it is filled with the frequency "1 to 7 times a week", as its tea
  counterpart is.

variables:
  tea_cups_lifetime: {column: sudose_thelt, type: number, unit: cups per day, range: [0, 30], missing: {999: unknown, 9999: unknown}, label: "Tea: cups per day of use, in the periods of use over the whole life"}
  tea_frequency_lifetime: {column: sudosfrq_thelt, type: category, codes: {"1 à 7 fois par semaine": weekly, "Moins d'une fois par semaine": less_than_weekly}, label: "Tea: frequency in the periods of use over the whole life"}
  tea_times_per_week_lifetime: {column: sudosfrq_theltnb, type: item, range: [1, 7], label: "Tea: times per week in the periods of use"}
  tea_cups_12m: {column: sudose_thely, type: number, unit: cups per day, range: [0, 30], label: "Tea: cups per day of use in the last 12 months"}
  tea_times_per_week_12m: {column: sudosfrq_thely, type: item, range: [1, 7], label: "Tea: times per week in the last 12 months"}
  coffee_cups_lifetime: {column: sudose_cafelt, type: number, unit: cups per day, range: [0, 40], missing: {999: unknown, 9999: unknown}, label: "Coffee: cups per day of use, in the periods of use over the whole life"}
  coffee_frequency_lifetime: {column: sudosfrq_cafelt, type: category, codes: {"1 à 7 fois par semaine": weekly, "Moins d'une fois par semaine": less_than_weekly}, label: "Coffee: frequency in the periods of use over the whole life"}
  coffee_times_per_week_lifetime: {column: sudosnb_cafelt, type: item, range: [1, 7], label: "Coffee: times per week in the periods of use"}
  coffee_cups_12m: {column: sudose_cafely, type: number, unit: cups per day, range: [0, 40], label: "Coffee: cups per day of use in the last 12 months"}
  coffee_times_per_week_12m: {column: sudosfrq_cafely, type: item, range: [1, 7], label: "Coffee: times per week in the last 12 months"}
