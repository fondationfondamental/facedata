defaults: {versions: [follow_up]}

variables:
  substance_disorder_fu: {column: rad_tb_subst, type: item, range: [0, 1], codes: {Oui: 1, Non: 0}, label: "Has or has had a substance use disorder, at follow-up"}
  drugs_over_ten_times_fu: {column: rad_add_4, type: item, range: [0, 1], codes: {Oui: 1, Non: 0}, keep: false, label: "More than ten times in your life: illicit drugs or medicines taken without a prescription (the opening question of drug_use.yaml; not delivered here, the gate of the boxes of six substances), at follow-up"}

  alcohol_disorder_fu: {column: suoccur_alcool, type: item, range: [0, 1], codes: {Y: 1, N: 0}, label: "Alcohol: symptom of a use disorder over the whole life (at least one DSM-5 criterion or the clinician's tick), at follow-up"}
  alcohol_last_month_fu: {column: abudep_alcool, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Alcohol: use disorder present at the time of the visit (asked from two DSM-5 criteria), at follow-up"}
  alcohol_onset_age_fu: {column: agedebut_alcool, type: item, range: [0, 90], missing: {99: unknown, 999: unknown}, label: "Alcohol: age at onset of the use disorder, at follow-up"}

  sedative_disorder_fu: {column: suoccur_sedatif, type: item, range: [0, 1], codes: {Y: 1, N: 0}, asked_if: drugs_over_ten_times_fu, label: "Sedatives, hypnotics, anxiolytics: symptom of a use disorder over the whole life (at least one DSM-5 criterion or the clinician's tick), at follow-up"}
  sedative_last_month_fu: {column: abudep_sedatif, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Sedatives, hypnotics, anxiolytics: use disorder present at the time of the visit (asked from two DSM-5 criteria), at follow-up"}
  sedative_onset_age_fu: {column: agedebut_sedatif, type: item, range: [0, 90], missing: {99: unknown, 999: unknown}, label: "Sedatives, hypnotics, anxiolytics: age at onset of the use disorder, at follow-up"}

  cannabis_disorder_fu: {column: suoccur_cannabis, type: item, range: [0, 1], codes: {Y: 1, N: 0}, label: "Cannabis: symptom of a use disorder over the whole life (at least one DSM-5 criterion or the clinician's tick), at follow-up"}
  cannabis_last_month_fu: {column: abudep_cannabis, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Cannabis: use disorder present at the time of the visit (asked from two DSM-5 criteria), at follow-up"}
  cannabis_onset_age_fu: {column: agedebut_cannabis, type: item, range: [0, 90], missing: {99: unknown, 999: unknown}, label: "Cannabis: age at onset of the use disorder, at follow-up"}

  stimulant_disorder_fu: {column: suoccur_stimulants, type: item, range: [0, 1], codes: {Y: 1, N: 0}, asked_if: drugs_over_ten_times_fu, label: "Stimulants: symptom of a use disorder over the whole life (at least one DSM-5 criterion or the clinician's tick), at follow-up"}
  stimulant_onset_age_fu: {column: agedebut_stimulants, type: item, range: [0, 90], missing: {99: unknown, 999: unknown}, label: "Stimulants: age at onset of the use disorder, at follow-up"}

  opiate_disorder_fu: {column: suoccur_opiaces, type: item, range: [0, 1], codes: {Y: 1, N: 0}, asked_if: drugs_over_ten_times_fu, label: "Opiates: symptom of a use disorder over the whole life (at least one DSM-5 criterion or the clinician's tick), at follow-up"}
  opiate_last_month_fu: {column: abudep_opiaces, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Opiates: use disorder present at the time of the visit (asked from two DSM-5 criteria), at follow-up"}
  opiate_onset_age_fu: {column: agedebut_opiaces, type: item, range: [0, 90], missing: {99: unknown, 999: unknown}, label: "Opiates: age at onset of the use disorder, at follow-up"}

  cocaine_disorder_fu: {column: suoccur_cocaine, type: item, range: [0, 1], codes: {Y: 1, N: 0}, asked_if: drugs_over_ten_times_fu, label: "Cocaine: symptom of a use disorder over the whole life (at least one DSM-5 criterion or the clinician's tick), at follow-up"}
  cocaine_last_month_fu: {column: abudep_cocaine, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Cocaine: use disorder present at the time of the visit (asked from two DSM-5 criteria), at follow-up"}
  cocaine_onset_age_fu: {column: agedebut_cocaine, type: item, range: [0, 90], missing: {99: unknown, 999: unknown}, label: "Cocaine: age at onset of the use disorder, at follow-up"}

