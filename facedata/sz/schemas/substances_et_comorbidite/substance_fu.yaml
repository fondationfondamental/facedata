instrument: substance_fu
title: Substance use disorders, at follow-up
tab: SUBSTANCES ET COMORBIDITE
section: Troubles lié à une SUBSTANCE AU COURS DE LA VIE / VISITE
status: draft
notes: >
  The questions of substance_v0 at the follow-up visits, where they are
  about the time since the last visit (see substance_v0.yaml): 2,311
  visits, 744 yes to the first question, 55 "Ne sais pas" (missing codes).
  Eight substances have a box here; the stimulants and the other
  substances exist at follow-up only.

  The age at onset still describes the whole life, as in BP.

  Three columns are not loaded. chk_substances_type lists the substances
  in one cell on 540 visits: every one of them is also a yes in its box,
  and the boxes hold more. sutrt_autre, the name of the other substance,
  is a copy of sutrt_autre_produit (drug_use.yaml) on every row.

