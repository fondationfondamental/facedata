defaults: {versions: [inclusion]}

variables:
  substance_disorder_v0: {column: rad_tb_subst, type: item, range: [0, 1], codes: {Oui: 1, Non: 0}, label: "Has or has had a substance use disorder, at inclusion"}
  drugs_over_ten_times_v0: {column: rad_add_4, type: item, range: [0, 1], codes: {Oui: 1, Non: 0}, keep: false, label: "More than ten times in your life: illicit drugs or medicines taken without a prescription (the opening question of drug_use.yaml; not delivered here, the gate of the boxes of four substances), at inclusion"}

  alcohol_disorder_v0: {column: suoccur_alcool, type: item, range: [0, 1], codes: {Y: 1, N: 0}, label: "Alcohol: symptom of a use disorder over the whole life (at least one DSM-5 criterion), at inclusion"}
  alcohol_last_month_v0: {column: abudep_alcool, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Alcohol: use disorder present at the time of the visit (asked from two DSM-5 criteria), at inclusion"}
  alcohol_onset_age_v0: {column: agedebut_alcool, type: item, range: [0, 90], missing: {99: unknown, 999: unknown}, label: "Alcohol: age at onset of the use disorder, at inclusion"}

  sedative_disorder_v0: {column: suoccur_sedatif, type: item, range: [0, 1], codes: {Y: 1, N: 0}, asked_if: drugs_over_ten_times_v0, label: "Sedatives, hypnotics, anxiolytics: symptom of a use disorder over the whole life (at least one DSM-5 criterion), at inclusion"}
  sedative_last_month_v0: {column: abudep_sedatif, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Sedatives, hypnotics, anxiolytics: use disorder present at the time of the visit (asked from two DSM-5 criteria), at inclusion"}
  sedative_onset_age_v0: {column: agedebut_sedatif, type: item, range: [0, 90], missing: {99: unknown, 999: unknown}, label: "Sedatives, hypnotics, anxiolytics: age at onset of the use disorder, at inclusion"}

  cannabis_disorder_v0: {column: suoccur_cannabis, type: item, range: [0, 1], codes: {Y: 1, N: 0}, label: "Cannabis: symptom of a use disorder over the whole life (at least one DSM-5 criterion), at inclusion"}
  cannabis_last_month_v0: {column: abudep_cannabis, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Cannabis: use disorder present at the time of the visit (asked from two DSM-5 criteria), at inclusion"}
  cannabis_onset_age_v0: {column: agedebut_cannabis, type: item, range: [0, 90], missing: {99: unknown, 999: unknown}, label: "Cannabis: age at onset of the use disorder, at inclusion"}

  opiate_disorder_v0: {column: suoccur_opiaces, type: item, range: [0, 1], codes: {Y: 1, N: 0}, asked_if: drugs_over_ten_times_v0, label: "Opiates: symptom of a use disorder over the whole life (at least one DSM-5 criterion), at inclusion"}
  opiate_last_month_v0: {column: abudep_opiaces, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Opiates: use disorder present at the time of the visit (asked from two DSM-5 criteria), at inclusion"}
  opiate_onset_age_v0: {column: agedebut_opiaces, type: item, range: [0, 90], missing: {99: unknown, 999: unknown}, label: "Opiates: age at onset of the use disorder, at inclusion"}

  cocaine_disorder_v0: {column: suoccur_cocaine, type: item, range: [0, 1], codes: {Y: 1, N: 0}, asked_if: drugs_over_ten_times_v0, label: "Cocaine: symptom of a use disorder over the whole life (at least one DSM-5 criterion), at inclusion"}
  cocaine_last_month_v0: {column: abudep_cocaine, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Cocaine: use disorder present at the time of the visit (asked from two DSM-5 criteria), at inclusion"}
  cocaine_onset_age_v0: {column: agedebut_cocaine, type: item, range: [0, 90], missing: {99: unknown, 999: unknown}, label: "Cocaine: age at onset of the use disorder, at inclusion"}

  hallucinogen_disorder_v0: {column: suoccur_hallucinogenes, type: item, range: [0, 1], codes: {Y: 1, N: 0}, asked_if: drugs_over_ten_times_v0, label: "Hallucinogens: symptom of a use disorder over the whole life (at least one DSM-5 criterion), at inclusion"}
