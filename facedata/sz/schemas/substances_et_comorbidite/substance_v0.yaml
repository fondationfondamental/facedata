instrument: substance_v0
title: Substance use disorders, at inclusion
tab: SUBSTANCES ET COMORBIDITE
section: Troubles lié à une SUBSTANCE AU COURS DE LA VIE / VISITE
status: draft
notes: >
  One yes/no question (does the patient have, or have they had, a substance
  use disorder), then for each of six substances a yes/no, whether symptoms
  were present in the past month and the age at onset. Yes/no answers are
  delivered as 1 and 0. The boxes are filled from 2015 at inclusion (50
  visits before).

  Two periods in the same columns, as in FACE BP (BP decisions D49 and D50;
  checked on the SZ data, decision D17 in PROGRESS.md). At inclusion the
  questions are about the whole life; at the yearly visits they are about
  the time since the last visit: of the patients with an alcohol disorder
  at inclusion, 147 of 319 later answers are no (175 of 487 for cannabis).
  The two are delivered as separate columns ending in _v0 and _fu;
  visit_form says which form a visit used.

  The first question is not usable at inclusion (open question O20, to
  send first). It holds "Ne sais pas" on 975 of 1,583 inclusion visits
  (45% to 75% in every year), "Non" on 18 and "Oui" on 590, against 2%
  "Ne sais pas" at follow-up. On every one of the 1,022 visits that hold
  "Ne sais pas" with the boxes filled, all the boxes say no: "Ne sais pas"
  stands where "no" is expected. It is read as a missing code, as
  everywhere, and nothing is guessed: the boxes of the six substances are
  complete and say the same thing (a box is yes on 1,326 of the 1,328
  visits answered "Oui", and on none of the others).

  Age 99 is "does not know". The type of disorder (abuse or dependence)
  and its cumulated duration, which BP has, are not extracted; neither are
  the boxes of the stimulants and of the other substances at inclusion.

