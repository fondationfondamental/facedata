instrument: substance_v0
title: Substance use disorders, at inclusion
tab: SUBSTANCES ET COMORBIDITE
section: Troubles lié à une SUBSTANCE AU COURS DE LA VIE / VISITE
status: reviewed
notes: >
  For each of six substances (alcohol, sedatives, cannabis, opiates, cocaine,
  hallucinogens): a box (a symptom of a use disorder over the whole life),
  whether the disorder is present at the time of the visit, and the age at
  onset of the disorder. Yes/no answers are delivered as 1 and 0. A first
  question (substance_disorder_v0) sums the boxes up. SZ has no type of
  disorder (abuse or dependence) and no cumulated duration, which BP has; the
  stimulants and the other substances have no box at inclusion.

  Where the questions come from. The form is one block of the application, in
  three tables: the diagnostic form, the comorbidity form (attached to the
  yearly visit only, never to the inclusion visit) and the addiction form
  (addicto, at both). At inclusion the diagnostic form has no substance
  question, so everything here comes from the addiction form: the box is its
  question 7a or 8a, "a symptom of a use disorder over the whole life". It is
  yes on 293 of the 303 inclusion visits that tick at least one of the eleven
  DSM-5 criteria of alcohol and on 8 of the 697 that tick none (the criteria
  are in auto_questionnaire/dsm5_alcohol.yaml and the six other dsm5_
  schemas). The hallucinogen box at inclusion is the question on other
  products (rad_add_autre7a). hallucinogen_onset_age_v0 has no cell; it is
  kept to match the follow-up. The "present at the time of the visit" answers
  are written Y/N, Oui/Non or 0/1 depending on the substance; the schema reads
  the three.

  The first question is derived by the export, not asked (open question O20,
  answered by the source: there is no question to send; export request R116,
  which also asks for the clinician's own answer, rad_tb_subst_raw, dropped by
  the export). At inclusion it is "Oui" when any box is yes (590 visits),
  "Non" when the six boxes are no (18) and "Ne sais pas" otherwise (975 of the
  1,583 answered visits). Of these 975, 925 have a "no" to rad_add_4 (next
  paragraph): the export leaves the drug boxes blank after it, so "all six
  no" is never reached. "Ne sais pas" is a missing code, as everywhere, and
  nothing is guessed. The variable is 97% yes (590 of 608 valid answers): it
  does not measure the disorder.

  Hidden gate. The opening question of the drug section (rad_add_4, "more
  than ten times in your life: illicit drugs or medicines taken without a
  prescription", delivered as illicit_drugs_over_ten_times in drug_use.yaml)
  shows the questions on sedatives, heroin, cocaine, opiates and other
  products only after a yes. After a "no" the export leaves the boxes of the
  sedatives, opiates, cocaine and hallucinogens blank (1,354, 1,355, 1,354 and
  1,355 of the 1,355 inclusion visits that say no). They are delivered as 0
  (asked_if on drugs_over_ten_times_v0, a hidden variable that is not
  delivered): 5,418 cells missing become 0. The yes share of the four boxes
  falls from 14.9, 7.7, 26.3 and 15.7% to 2.2, 1.2, 3.7 and 2.0%, close to the
  follow-up shares (1.7, 1.6, 3.1 and 2.2%).

  The end of each section (disorder at the time of the visit, age at the first
  use, age at onset, longest abstinence, family history, craving) is shown
  only with two or more DSM-5 criteria, a count that is in another tab. Age at
  the first use, alcohol: filled on 0 of 1,500 visits with none or one
  criterion and on 85% of 546 with two or more; cannabis 1 of 433 and 83% of
  835; cocaine 0 of 94 and 83% of 98; sedatives 0 of 41 and 82% of 60; opiates
  0 of 18 and 91% of 34. An empty cell means "not asked", not "no"; it is not
  encoded.

  The module is used from 2015, not from 2012. The opening question of the
  alcohol section (the other sections are the same) is answered on 9% of the
  inclusion visits of 2012, 18% of those of 2014, 48% of 2015 and 83% to 93%
  from 2016 (6%, 17%, 52% and 84% of the inclusion and yearly visits
  together). The alcohol box is blank under a yes to that question on 5% to 8%
  of the inclusion visits of 2015 to 2017 and 14% to 23% from 2018. One centre
  answers the opening question on 77% of its inclusion visits in 2016-18, 31%
  in 2019-21 and 34% in 2022-26 (at follow-up 53%, 23% and 11%), and another
  on 79% of its follow-up visits in 2019-21 and 33% from 2022: centre
  practice, unexplained.

  Two periods in the same columns, as in FACE BP (BP decisions D49, D50 and
  D84; checked on the SZ data, decision D17 in PROGRESS.md). At inclusion the
  questions are about the whole life; a follow-up answer is a yearly update
  (D84): not the whole life, and not strictly the time since the last visit.
  Of the patients with an alcohol box at 1 at inclusion, 147 of the 319 later
  answers are no (175 of 487 for cannabis, 201 of 633 for the first
  question). The two are delivered as separate columns ending in _v0 and _fu;
  visit_form says which form a visit used.

  The export casts the ages with a pattern of digits: a typed "Ne sais pas"
  becomes an empty cell; 99 and 999 are read as missing codes (1 cell at
  inclusion). The ages run from 5 to 45 and none is above the patient's age.

  By year and centre. The sedatives box shows the step of drug_use.yaml: one
  centre ticks it on 18 of its 129 answers to 2016 (14%) and on 6 of 274 since
  (2%), the other centres on 3 of 163 (2%) and 8 of 1,023 (1%). The yes share
  of the cannabis box is 34% to 35% of the answers of 2014 to 2022 and 22%
  from 2023, and it falls in each of the four centres that have 20 answers in
  both 2020-22 and 2023-26: no known cause. The dictionary lists
  agedebut_autre (age at onset, other substances), which the extraction does
  not have.

