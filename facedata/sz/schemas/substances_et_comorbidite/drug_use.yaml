instrument: drug_use
title: Use of sedatives, heroin, cocaine, opiates and other products
tab: SUBSTANCES ET COMORBIDITE
section: Sédatifs
status: draft
notes: >
  One question opens five sections: sedatives, heroin, crack or cocaine,
  opiates and other products. For each, has the patient ever used it (more
  than ten times), how (smoked, sniffed, injected, oral, sublingual: one
  yes/no per way, several can be ticked), the amounts and frequencies over
  the whole life and in the last 12 months, the age at the first use, the
  longest abstinence, the family history and a craving score. The opiates
  have no amounts; the other products have a name, amounts and
  frequencies only.

  The opening question (rad_add_4) is not in the dictionary: its label is
  read from the data. It is answered on 3,436 visits (481 yes), and the
  five sections are filled only after a yes (456 visits). After a "no" the
  five "has ever used" are delivered as 0 (asked_if). 77 of 212 later
  answers of patients who said yes at inclusion are no.

  Asked at inclusion and at follow-up, from 2012. The questions about the
  whole life keep that meaning at follow-up: the share of patients who
  have ever used is the same at the two (see the notes below), unlike the
  questions on a use disorder (substance_v0.yaml). The details are filled
  after a yes. 999 and 9999 mean "does not know" in an amount or a
  duration, 99 in an age. "Ne sais pas" is a missing code. The number of
  times per week is filled when the frequency is "1 to 7 times a week".

  Amounts are tablets or capsules per day (sedatives), grams per day
  (heroin, cocaine) and standard units per day (other products). The
  sections are small: 126 patients-visits with sedatives, 55 with heroin,
  254 with cocaine, 73 with opiates, 186 with another product.

  rad_add_heroin7a (38 cells, yes or no, after heroin) is a question that
  the dictionary does not have: it is ignored (open question O21). The
  criteria of a use disorder are in the dsm5_* schemas of
  auto_questionnaire.

