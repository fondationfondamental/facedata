instrument: drug_use
title: Use of sedatives, heroin, cocaine, opiates and other products
tab: SUBSTANCES ET COMORBIDITE
section: Sédatifs
status: reviewed
notes: >
  One question opens five sections: sedatives, heroin, crack or cocaine,
  opiates and other products. For each, has the patient used it more than ten
  times in their life (the question says "plus de dix fois dans votre vie",
  as for alcohol and cannabis), how (smoked, sniffed, injected, oral,
  sublingual: one yes/no per way, several can be ticked; the list of the form
  has no "sniffed" for the sedatives, whose 118 answers are oral, smoked or
  sublingual), the amounts and frequencies in the periods of heaviest use over
  the whole life and in the last 12 months, the age at the first use, the
  longest abstinence, the family history and a craving score (the maximum in
  the last week). The opiates have no amounts; the other products have a name,
  amounts and frequencies only.

  The opening question (rad_add_4) is not in the dictionary: its label is read
  from the form. It is answered on 3,436 visits (481 yes), and the five
  sections are filled only after a yes (456 of the 481 visits for sedatives,
  heroin, opiates and other products, 459 for cocaine; none after a no). After
  a "no" the five "more than ten times" are delivered as 0 (asked_if). The
  same question also hides the boxes of use disorder of four of the
  substances in substance_v0.yaml and substance_fu.yaml. 77 of the 212 later
  answers (36%) of the patients who said yes at inclusion are no (sedatives 53
  of 84, cocaine 23 of 88, opiates 4 of 25, heroin 2 of 14).

  Asked at inclusion and at yearly visits, used from 2015 and not from 2012:
  the opening question is answered on 9% of the inclusion visits of 2012, 18%
  of 2014, 47% of 2015 and 84% to 93% from 2016 (the same pattern as alcohol,
  alcohol_use.yaml). The questions about the whole life keep that meaning at
  follow-up on average only: the share of yes is the same at the two, but a
  third of the later answers of the patients who said yes at inclusion are no.
  The details are filled after a yes. 999 and 9999 mean "does not know" in an
  amount or a duration, 99 in an age. "Ne sais pas" is a missing code. The
  number of times per week is filled when the frequency is "1 to 7 times a
  week" (378 of 387 answers) and after "less than weekly" on none: not
  encoded. At 12 months "less than weekly" mostly means no use: the amount
  is 0 on 32 of 33 sedative answers, 27 of 33 heroin, 98 of 138 cocaine and 55
  of 67 other products.

  Not asked, not no. The questions at the end of each section (age at the
  first use, longest abstinence, family history, craving) are shown only with
  two or more DSM-5 criteria, a count that is in another tab (the dsm5_
  schemas of auto_questionnaire). Age at the first use, filled on 0 of 41
  sedative visits with none or one criterion and on 82% of 60 with two or
  more; heroin 0 of 15 and 21 of 23; cocaine 0 of 94 and 83% of 98; opiates 0
  of 18 and 91% of 34. An empty cell means "not asked"; it is not encoded.

  Amounts are tablets or capsules per day (sedatives), grams per day (heroin,
  cocaine) and standard units per day (other products). The sections are
  small: 126 patients-visits with sedatives, 55 with heroin, 254 with cocaine,
  73 with opiates, 186 with another product. In the form the details of the
  other product are shown by a question that is not in the extraction
  (rad_add_autre4e2): the amount is filled on 71 of the 186 visits that say
  yes and the name on 179 (export request R116). The questions of the form on
  a drug treatment of the use disorder and on a hospitalisation for withdrawal
  (yes, number, age at the first) are not in the extraction for any of the
  five sections (export request R120). Ages are plausible: the first use is at
  14 or later and none is above the patient's age.

  rad_add_heroin7a (24 inclusion and 14 follow-up answers, yes or no) is the
  question "a symptom of a use disorder over the whole life" for heroin, the
  counterpart of the boxes of substance_v0.yaml, which has no heroin box. It
  is not read (ignored.yaml; open question O21). The criteria of a use
  disorder are in the dsm5_* schemas of auto_questionnaire.

  One centre's step in the sedatives: the question "more than ten times" is
  yes on 12% to 13% of the answers of 2014 and 2015, 7% of 2016 and 2% to 4%
  from 2017. Before 2017 it comes mostly from one centre (37 yes on its 241
  answers, 15%; 10 on the 296 answers of the other centres, 3%), and from 2017
  it is 3% in that centre (17 of 580) as in the others (62 of 2,294): no known
  cause (the boxes of substance_v0.yaml show it too). Cocaine smoked (crack)
  is ticked on 20% of the cocaine sections of 2014-19, 30% of 2020-22 and 40%
  from 2023, and on 10% to 50% by centre (centres with 20 answers or more): no
  known cause. Two amounts of 99 grams of cocaine a day are out of range.

