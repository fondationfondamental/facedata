instrument: eating_disorder_v0
title: Eating disorder at inclusion
tab: SUBSTANCES ET COMORBIDITE
section: Trouble du comportement alimentaire
status: draft
notes: >
  Asked at the inclusion visit only (2,147 visits, 219 yes): whether the
  patient has an eating disorder, which one, whether symptoms were present
  in the past month and the age at onset. "U" is a missing code.

  The BP schema; the age at onset is in the column agedebutca here. The SZ
  extraction has no answer at the follow-up visits, so there is no
  eating_disorder_fu.

