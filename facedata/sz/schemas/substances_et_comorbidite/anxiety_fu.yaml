notes: >
  The first question of anxiety_v0 (does the patient have an anxiety
  disorder), at the follow-up visits: 2,265 visits, 716 yes, a stable 24%
  to 42% every year. The form of the follow-up visits holds nothing else
  on anxiety: the boxes that BP has at follow-up are not in the SZ
  extraction. "Ne sais pas" is a missing code (39).

