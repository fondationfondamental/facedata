variables:
  anxiety_disorder_v0: {column: rad_tb_anx, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Has an anxiety disorder, at inclusion"}

  # Each disorder is asked after a screening question, itself asked after a yes to the first question.
  panic_attacks_v0: {column: rad_attaq_paniq, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, asked_if: anxiety_disorder_v0, label: "Screening: panic attacks, at inclusion"}
  panic_disorder_v0: {column: ceoccurtroubpansago, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, asked_if: panic_attacks_v0, label: "Panic disorder, with or without agoraphobia, at inclusion"}
  panic_last_month_v0: {column: [occurtroubpansago, occurtroubpanago], type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Panic disorder: symptoms in the past month, at inclusion"}
  agoraphobic_fear_v0: {column: rad_peur_agoraphobie, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, asked_if: anxiety_disorder_v0, label: "Screening: fear of agoraphobic situations, at inclusion"}
  agoraphobia_v0: {column: ceoccuragostroubpan, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, asked_if: agoraphobic_fear_v0, label: "Agoraphobia without panic disorder, at inclusion"}
  agoraphobia_last_month_v0: {column: occuragostroubpan, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Agoraphobia: symptoms in the past month, at inclusion"}
  social_fear_v0: {column: rad_peur_sociale, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, asked_if: anxiety_disorder_v0, label: "Screening: fear of social situations, at inclusion"}
  social_phobia_v0: {column: ceoccurphobiesoc, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, asked_if: social_fear_v0, label: "Social phobia, at inclusion"}
  social_phobia_last_month_v0: {column: occurphobiesoc, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Social phobia: symptoms in the past month, at inclusion"}
  specific_fear_v0: {column: rad_peur_specifique, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, asked_if: anxiety_disorder_v0, label: "Screening: a specific fear, at inclusion"}
  specific_phobia_v0: {column: ceoccurphobie_sp_cifi, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, asked_if: specific_fear_v0, label: "Specific phobia, at inclusion"}
  specific_phobia_last_month_v0: {column: occurphobie_sp_cifi, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Specific phobia: symptoms in the past month, at inclusion"}
  obsessions_v0: {column: rad_peur_obsessionnel, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, asked_if: anxiety_disorder_v0, label: "Screening: obsessions, at inclusion"}
  obsessional_disorder_v0: {column: ceoccurtoc, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, asked_if: obsessions_v0, label: "Obsessional disorder (asked after the obsessions), at inclusion"}
  compulsions_v0: {column: rad_peur_compulsif, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, asked_if: anxiety_disorder_v0, label: "Screening: compulsions, at inclusion"}
  ocd_v0: {column: rad_trouble_compulsif, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, asked_if: compulsions_v0, label: "Obsessive-compulsive disorder (asked after the compulsions), at inclusion"}
