instrument: anxiety_v0
title: Anxiety disorders at inclusion
tab: SUBSTANCES ET COMORBIDITE
section: Troubles ANXIEUX
status: draft
notes: >
  One yes/no question (does the patient have an anxiety disorder; 2,168
  inclusion visits, 826 yes), then, from 2012, a tree of questions for the
  patients answered yes (about 640 visits). Yes/no answers are delivered as
  1 and 0; "U" is a missing code.

  Another form than in FACE BP (decision D17 in PROGRESS.md). BP ticks one
  box per disorder. Here each disorder comes after a screening question, in
  columns that the dictionary does not list (rad_attaq_paniq, rad_peur_*):
  panic attacks, then panic disorder; fear of agoraphobic situations, then
  agoraphobia; a social fear, then social phobia; a specific fear, then
  specific phobia; obsessions, then obsessive-compulsive disorder;
  compulsions, then a compulsive disorder. The data show the tree: a
  disorder is filled only after a yes to its screening question (295 of
  299, 265 of 271, 228 of 231, 152 of 156, 166 of 173, 169 of 172 cells).
  The labels of the screening questions are read from the column names.
  Post-traumatic stress, generalised anxiety, anxiety due to a medical
  condition and the unspecified disorder have no screening question.

  A question that the form did not show after a "no" is delivered as 0
  (asked_if): no anxiety disorder means none of them, and a "no" to a
  screening question means no such disorder. The inclusion visits of 2010
  and 2011 answered yes have no detail: the tree did not exist yet.

  One answer is lost (open question O19). The box "panic disorder with
  agoraphobia" (ceoccurtroubpanago) holds, on all its 634 rows, the answer
  to the screening question on agoraphobic fear (rad_peur_agoraphobie),
  and it is that answer which opens the agoraphobia question. It is
  ignored. rad_trouble_panique is a copy of the panic disorder without
  agoraphobia and is ignored too. The two "past month" columns of the panic
  disorder are read as one, as in BP.

  The ages at onset, which BP has, are not extracted. The same first
  question at the follow-up visits is in anxiety_fu.yaml.

