  # Each disorder is asked after a screening question, itself asked after a yes to the first question.
  panic_attacks_v0: {column: rad_attaq_paniq, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, asked_if: anxiety_disorder_v0, label: "Screening: panic attacks, at inclusion"}
