  anxiety_medical_condition_v0: {column: cedecodtroubanxaffmed, type: text, label: "Anxiety due to a medical condition: the condition, as written (asked under generalised anxiety), at inclusion"}
  anxiety_medical_last_month_v0: {column: occurtroubanxaffmed, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, label: "Anxiety due to a medical condition: symptoms in the past month (asked under generalised anxiety), at inclusion"}
  anxiety_unspecified_v0: {column: ceoccurtroubanxnonspe, type: item, range: [0, 1], codes: {Y: 1, N: 0, Oui: 1, Non: 0}, missing: {U: unknown}, asked_if: anxiety_disorder_v0, label: "Anxiety disorder not otherwise specified, at inclusion"}
