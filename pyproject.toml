[project]
name = "facedata"
version = "0.3.0"
description = "Load, harmonise and quality-check data from the FACE psychiatric cohorts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0",     # pandas 2 cannot hold a date before 1677: the cell would end unparsed, not out of range
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.scripts]
facedata = "facedata.guide:main"   # facedata init, guide, find, show, instruments, page, files

[project.optional-dependencies]
thesaurus = [
    "openpyxl>=3.1",   # coverage() reads the thesaurus workbooks
]

[dependency-groups]
dev = [
    "pytest>=8",
    "openpyxl>=3.1",   # only to read the thesaurus workbooks
    "jupyterlab>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["facedata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
