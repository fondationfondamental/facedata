[project]
name = "facedata"
version = "0.1.0"
description = "Load, harmonise and quality-check data from the FACE psychiatric cohorts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "openpyxl>=3.1",   # only to read the thesaurus workbooks
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["facedata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
