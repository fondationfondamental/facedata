# Annotations of the group diagnosis_bp_sz_dr: the medical evaluation, comorbidity and substance forms of
# FACE BP, SZ and DR. Format and rules: the annotation brief. Every statement comes from a schema note, a
# label, a project document or the literature notes (local/out/scale_reference*.md), named in `sources`.

diva:
  description: 'DIVA, the diagnostic interview for attention deficit and hyperactivity in adults, with the criteria of DSM-IV-TR:
    nine criteria of attention deficit and nine of hyperactivity-impulsivity, each answered present or absent for adult
    life and for childhood. FACE BP only, at the inclusion visit, for patients chosen by the clinician.'
  version: 'DSM-IV-TR criteria (the items match the DIVA 2.0 form); the application''s form holds the 36 criteria and four
    counts only. French translation of the DIVA 2.0: to verify.'
  reference: Kooij JJS, Francken MH. DIVA 2.0. Diagnostic Interview for ADHD in adults. DIVA Foundation, The Hague, 2010
  reference_confidence: confirmed in source (form read; Hong 2020 Neuropsychiatr Dis Treat 16)
  respondent: clinician
  construct: adhd_symptoms
  period: adult life and childhood
  sources:
  - schema notes (bp diva)
  - scale_reference.md section 23
  - docs/bp/PROGRESS.md D53, D122
  items:
    higher_means: criterion present
    polarity: worse
    basis: stated
    source: 'schema notes (bp diva): ''each answered for adult life and for childhood (1 = present, 0 = absent)'''
  scores:
    diva_adult_a_total:
      meaning: Number of the nine criteria of attention deficit that are present, for adult life (0 to 9). Computed only
        where the nine criteria are answered.
      higher_means: more criteria of attention deficit present
      polarity: worse
      basis: stated
      source: 'schema notes (bp diva): ''The number of criteria present, for each of the four blocks (0 to 9)''; criteria
        coded 1 = present, 0 = absent'
      cutoffs:
      - value: 6 or more of 9
        meaning: Published threshold of the DSM-IV-TR criteria, in attention or in hyperactivity-impulsivity, for adults
          and for childhood alike. The package delivers the count only.
        source: Kooij and others 2010 (BMC Psychiatry 10:67), cited in schema notes (bp diva) and scale_reference.md section
          23
        confidence: confirmed in source (Kooij 2010 BMC Psychiatry 10:67; Hong 2020); DIVA 2.0 summary-page adult cut-off
          to verify
      - value: 5 or more of 9
        meaning: 'DSM-5 and DIVA-5 threshold for adults: another edition than the DSM-IV-TR criteria of this form.'
        source: Hong and others 2020, cited in schema notes (bp diva) and scale_reference.md section 23
        confidence: confirmed in source (Kooij 2010 BMC Psychiatry 10:67; Hong 2020)
    diva_child_a_total:
      meaning: Number of the nine criteria of attention deficit that are present, for childhood (0 to 9). Computed only
        where the nine criteria are answered.
      higher_means: more criteria of attention deficit present
      polarity: worse
      basis: stated
      source: 'schema notes (bp diva): ''The number of criteria present, for each of the four blocks (0 to 9)''; criteria
        coded 1 = present, 0 = absent'
      cutoffs:
      - value: 6 or more of 9
        meaning: Published threshold of the DSM-IV-TR criteria, in attention or in hyperactivity-impulsivity, for adults
          and for childhood alike. The package delivers the count only.
        source: Kooij and others 2010 (BMC Psychiatry 10:67), cited in schema notes (bp diva) and scale_reference.md section
          23
        confidence: confirmed in source (Kooij 2010 BMC Psychiatry 10:67; Hong 2020); DIVA 2.0 summary-page adult cut-off
          to verify
    diva_adult_hi_total:
      meaning: Number of the nine criteria of hyperactivity-impulsivity that are present, for adult life (0 to 9). Computed
        only where the nine criteria are answered.
      higher_means: more criteria of hyperactivity-impulsivity present
      polarity: worse
      basis: stated
      source: 'schema notes (bp diva): ''The number of criteria present, for each of the four blocks (0 to 9)''; criteria
        coded 1 = present, 0 = absent'
      cutoffs:
      - value: 6 or more of 9
        meaning: Published threshold of the DSM-IV-TR criteria, in attention or in hyperactivity-impulsivity, for adults
          and for childhood alike. The package delivers the count only.
        source: Kooij and others 2010 (BMC Psychiatry 10:67), cited in schema notes (bp diva) and scale_reference.md section
          23
        confidence: confirmed in source (Kooij 2010 BMC Psychiatry 10:67; Hong 2020); DIVA 2.0 summary-page adult cut-off
          to verify
      - value: 5 or more of 9
        meaning: 'DSM-5 and DIVA-5 threshold for adults: another edition than the DSM-IV-TR criteria of this form.'
        source: Hong and others 2020, cited in schema notes (bp diva) and scale_reference.md section 23
        confidence: confirmed in source (Kooij 2010 BMC Psychiatry 10:67; Hong 2020)
    diva_child_hi_total:
      meaning: Number of the nine criteria of hyperactivity-impulsivity that are present, for childhood (0 to 9). Computed
        only where the nine criteria are answered.
      higher_means: more criteria of hyperactivity-impulsivity present
      polarity: worse
      basis: stated
      source: 'schema notes (bp diva): ''The number of criteria present, for each of the four blocks (0 to 9)''; criteria
        coded 1 = present, 0 = absent'
      cutoffs:
      - value: 6 or more of 9
        meaning: Published threshold of the DSM-IV-TR criteria, in attention or in hyperactivity-impulsivity, for adults
          and for childhood alike. The package delivers the count only.
        source: Kooij and others 2010 (BMC Psychiatry 10:67), cited in schema notes (bp diva) and scale_reference.md section
          23
        confidence: confirmed in source (Kooij 2010 BMC Psychiatry 10:67; Hong 2020); DIVA 2.0 summary-page adult cut-off
          to verify
  flags:
  - 'The patients are a selection made by the clinician (50 inclusions, 2019 to 2026, never at follow-up), not a screening
    of the inclusions: the DIVA gives no prevalence of ADHD.'
  - The form holds the counts only. The other questions of the interview (symptoms present more than in other people, onset
    before age 7, impairment in two or more areas) are not in the form, so a diagnosis of ADHD cannot be rebuilt from these
    variables (request A68).
  - The number stored by the application is typed by the clinician and is used as a check only; the delivered count is the
    sum of the nine criteria and is missing where one criterion is not answered.
  - 'The levels rise after 2021 (adult attention: mean 3.1 of 9 in 2019-2021, 6.1 from 2022), partly through the mix of
    centres.'
  - The interview is DSM-IV-TR for every patient, whatever the DSM edition of the mood sections of the same visit.
  - 'To verify (scale_reference.md section 23): the adult cut-off printed on the summary page of the DIVA 2.0; who translated
    the DIVA 2.0 into French, and any French validation.'

dsm4_annee_ecoulee:
  description: 'The mood episodes of the year before the inclusion visit, on the DSM-IV inclusion form of FACE BP: one yes/no
    question (at least one episode), then the number of depressive, hypomanic, manic and mixed episodes, and for depressive,
    manic and mixed episodes a yes/no and a number for those with psychotic features.'
  version: DSM-IV version of the inclusion form of FACE BP (the form says DSM-IV; the text revision is not named). The DSM-5
    version is dsm5_annee_ecoulee.
  reference: DSM-IV (1994), the classification whose criteria the form names. The form is a form of the application, with
    no publication of its own.
  reference_confidence: confirmed in source (Grunze et al. 2021)
  respondent: clinician
  construct: illness_course
  period: the year before the inclusion visit
  sources:
  - schema notes (bp dsm4_annee_ecoulee)
  - scale_reference.md section 25
  - docs/bp/PROGRESS.md D9, D53, D122
  - 'respondent: the notes of the DSM-IV inclusion form name the rater (dsm4_vie_entiere, dsm4_annee_ecoulee) and the clinicians
    (dsm4_episode_recent)'
  variables:
    dsm4_ly_n_*:
      meaning: Number of episodes of that kind in the year before inclusion, 0 to 20 ('>20' is read as 20 and marked censored_right).
        Read as 0 where the first answer is no; missing where it is unknown or empty.
      higher_means: more episodes of that kind
      polarity: worse
      basis: anchors
      source: labels 'Number of ... episodes in the past year' (range 0 to 20); schema notes (bp dsm4_annee_ecoulee)
  flags:
  - DSM-IV and DSM-5 are two editions, asked on two forms and exported in the same raw columns. Each has its own schema
    and its own columns (dsm4_ and dsm5_); the two are never delivered in one column (BP decision D9).
  - 'The application stores no edition: it is read from the label that the export writes on the inclusion row. The labelled
    inclusions are DSM-IV until 2019 (7 exceptions), DSM-5 on 24 of 380 in 2020, 44 of 425 in 2021 and 203 of 238 in 2022,
    and all DSM-5 from 2023. An inclusion with no label is read by the date of the patient''s first visit (DSM-IV before
    2020, DSM-5 from 2023; flag version_inferred) and is not delivered when that date is in 2020 to 2022 (version_unknown).'
  - 'Asked at the inclusion visit only. The follow-up visits ask the same counts for the time since the last visit (dsm4_depuis_derniere_visite):
    another period, other columns.'
  - The yes/no per kind of episode (dsm4_ly_mde, dsm4_ly_hypomania, dsm4_ly_mania, dsm4_ly_mixed) is written by the export
    from the number (1 where it is 1 or more) and adds nothing to it.
  - 'Mixed episodes exist on the DSM-IV form only. A DSM-IV mixed episode is not the DSM-5 specifier ''with mixed features''
    (scale_reference.md section 25: confirmed in source (Hergueta 2013; Tandon 2015; Cafaro 2023)).'
  - 'Answers that contradict each other are delivered as typed: 80 of the 1,386 inclusions in a current episode that answer
    here say no mood episode in the year, and the number in the year is above the lifetime number for 88 inclusions.'

dsm4_depuis_derniere_visite:
  description: 'The mood episodes since the last visit, asked at the follow-up visits of FACE BP on the DSM-IV version of
    the follow-up form: one yes/no question (at least one episode), then the number of depressive, hypomanic, manic and
    mixed episodes and their total, the numbers with psychotic features, and the type of the most recent episode.'
  version: DSM-IV version of the follow-up form of FACE BP (the form says DSM-IV; the text revision is not named). The DSM-5
    version is dsm5_depuis_derniere_visite.
  reference: DSM-IV (1994), the classification whose criteria the form names. The form is a form of the application, with
    no publication of its own.
  reference_confidence: confirmed in source (Grunze et al. 2021)
  respondent: clinician
  construct: illness_course
  period: since the last visit
  sources:
  - schema notes (bp dsm4_depuis_derniere_visite)
  - scale_reference.md section 25
  - docs/bp/PROGRESS.md D9, D12, D14, D15, D53, D122
  - 'respondent: the notes of the follow-up form name the rater (dsm4_depuis_derniere_visite: ''the typed total is the rater''s
    own'')'
  scores:
    dsm4_fu_n_episodes:
      meaning: 'Number of mood episodes since the last visit: the sum of the depressive, hypomanic, manic and mixed numbers.
        Where one of the four is unknown or empty, the total typed by the rater is delivered instead (flag score_as_stored,
        349 visits).'
      higher_means: more mood episodes since the last visit
      polarity: worse
      basis: anchors
      source: label 'Number of mood episodes since the last visit (depressive, hypomanic, manic and mixed, added)'; schema
        notes (bp dsm4_depuis_derniere_visite)
  variables:
    dsm4_fu_n_*:
      meaning: Number of episodes of that kind since the last visit, 0 to 20 ('>20' is read as 20 and marked censored_right).
        Read as 0 where the first answer is no.
      higher_means: more episodes of that kind
      polarity: worse
      basis: anchors
      source: labels 'Number of ... episodes since the last visit' (range 0 to 20); schema notes (bp dsm4_depuis_derniere_visite)
    dsm4_fu_recent_type:
      meaning: 'Type of the most recent episode since the last visit (depressive, hypomanic, manic, unspecified). The list
        has no mixed type: a missing type after a yes often means a mixed episode.'
      polarity: not_applicable
  flags:
  - DSM-IV and DSM-5 are two editions, asked on two forms and exported in the same raw columns. Each has its own schema
    and its own columns (dsm4_ and dsm5_); the two are never delivered in one column (BP decision D9).
  - 'Edition of a follow-up visit: before 2022 it takes the label of the patient''s inclusion (D12); from 1 January 2022
    it is DSM-5 in every centre, whatever the inclusion (D14), although the follow-up form changed centre by centre between
    October 2021 and May 2022. A visit that holds a column of the old form (mixed numbers, typed total) is read as DSM-IV
    whatever its date (flag version_overridden).'
  - 'This schema reads 7,165 visits from 2009 to 2022. Its 33 visits of January to May 2022 all answered yes (the columns
    that mark them exist only after a yes), so 2022 is a selection and not a profile of the year: leave 2022 out of a trend.'
  - 'The window is the time since the previous visit, which is not one window (median gap 195 days at the six-monthly visits
    and 357 at the yearly ones). The share of yes answers rises with the gap: do not compare counts of episodes across visits
    without the gap.'
  - 'Episodes since the last visit are probably undercounted: of the 1,616 follow-up visits in a current episode that answer
    this question, 377 say that no episode occurred since the last visit.'
  - 'Where the typed total and the sum differ, the sum is delivered (flag score_mismatch, 204 visits): the typed total is
    the rater''s own, the application never computes it.'
  - 'Mixed episodes exist on the DSM-IV form only. A DSM-IV mixed episode is not the DSM-5 specifier ''with mixed features''
    (scale_reference.md section 25: confirmed in source (Hergueta 2013; Tandon 2015; Cafaro 2023)).'
  - FACE DR delivers five of these names (dsm4_fu_n_mde, dsm4_fu_n_mde_psychotic, dsm4_fu_n_hypomania, dsm4_fu_n_mania_psychotic,
    dsm4_fu_n_mixed) from its own follow-up form (mood_course_fu); the BP gate and total do not exist in DR.

dsm4_episode_actuel:
  description: 'The mood episode the patient is in on the day of the visit, if any, on the DSM-IV version of the forms of
    FACE BP: a yes/no, then the type, specifier, severity, chronicity and whether it followed a birth. Filled at the inclusion
    visit and at every follow-up visit; the start date exists at follow-up only.'
  version: DSM-IV version of the inclusion and follow-up forms of FACE BP (the form says DSM-IV; the text revision is not
    named). The DSM-5 version is dsm5_episode_actuel.
  reference: DSM-IV (1994), the classification whose criteria the form names. The form is a form of the application, with
    no publication of its own.
  reference_confidence: confirmed in source (Grunze et al. 2021)
  respondent: clinician
  construct: illness_course
  period: the day of the visit
  sources:
  - schema notes (bp dsm4_episode_actuel)
  - scale_reference.md section 25
  - docs/bp/PROGRESS.md D9, D12, D14, D15, D53
  - 'respondent: schema notes (bp dsm4_episode_actuel): ''''Chronic'' is a judgement of the rater'''
  variables:
    dsm4_current_type:
      meaning: 'Type of the current episode (depressive, hypomanic, manic, mixed, unspecified). At the follow-up visits
        the list has no mixed type today: an episode with no type is often a mixed one.'
      polarity: not_applicable
    dsm4_current_severity:
      meaning: 'Severity of the current episode, asked for a depressive, manic or mixed episode: mild, moderate, severe,
        severe with congruent or with incongruent psychotic features.'
      polarity: not_applicable
    dsm4_current_chronic:
      meaning: 'Current depressive episode ticked chronic. A judgement of the rater: of the follow-up episodes ticked chronic
        that have a start date, 45 of 307 began two years or more before the visit.'
      polarity: not_applicable
  flags:
  - DSM-IV and DSM-5 are two editions, asked on two forms and exported in the same raw columns. Each has its own schema
    and its own columns (dsm4_ and dsm5_); the two are never delivered in one column (BP decision D9).
  - 'The application stores no edition: it is read from the label that the export writes on the inclusion row. The labelled
    inclusions are DSM-IV until 2019 (7 exceptions), DSM-5 on 24 of 380 in 2020, 44 of 425 in 2021 and 203 of 238 in 2022,
    and all DSM-5 from 2023. An inclusion with no label is read by the date of the patient''s first visit (DSM-IV before
    2020, DSM-5 from 2023; flag version_inferred) and is not delivered when that date is in 2020 to 2022 (version_unknown).'
  - 'Edition of a follow-up visit: before 2022 it takes the label of the patient''s inclusion (D12); from 1 January 2022
    it is DSM-5 in every centre, whatever the inclusion (D14), although the follow-up form changed centre by centre between
    October 2021 and May 2022. A visit that holds a column of the old form (mixed numbers, typed total) is read as DSM-IV
    whatever its date (flag version_overridden).'
  - 'The answer describes the day of the visit at every visit, so inclusion and follow-up answers are in the same columns:
    a third of the inclusions and a quarter of the follow-up visits are in an episode.'
  - 'At the follow-up visits the form most likely had a mixed type whose answers were emptied when the form changed (October
    2021 to May 2022): 164 follow-up visits in an episode have no type (2010 to 2022). They are delivered with no type.'
  - 'The follow-up specifier cannot be compared with the inclusion one: until September 2021 the answer ''none'' never appears
    at follow-up, so an empty cell means ''none'' or not answered.'
  - 'The 33 follow-up visits of January to May 2022 read as DSM-IV are a selection (64% in an episode against 24% to 25%
    in 2019 to 2021): leave 2022 out of a trend.'
  - The share of inclusions in an episode goes from 15% to 51% between centres, and the share of chronic depressive episodes
    at inclusion from 18% to 74%.
  - The details are asked for some types only and only after a yes. 33 visits answered no still hold details; they are delivered
    as written.
  - 54 of the 1,559 start dates are after the visit and are delivered as written.
  - FACE DR delivers dsm4_current_specifier, dsm4_current_severity, dsm4_current_chronic and dsm4_current_postpartum from
    its inclusion form (mood_history_v0); dsm4_current_catatonic is BP only.

dsm4_episode_recent:
  description: 'The most recent mood episode before the inclusion visit, on the DSM-IV inclusion form of FACE BP: its start
    and end dates, type, specifier, chronicity, severity and whether it followed a birth. Filled once, at the inclusion
    visit.'
  version: DSM-IV version of the inclusion form of FACE BP (the form says DSM-IV; the text revision is not named). The DSM-5
    version is dsm5_episode_recent.
  reference: DSM-IV (1994), the classification whose criteria the form names. The form is a form of the application, with
    no publication of its own.
  reference_confidence: confirmed in source (Grunze et al. 2021)
  respondent: clinician
  construct: illness_course
  period: the most recent episode before the inclusion visit
  sources:
  - schema notes (bp dsm4_episode_recent)
  - scale_reference.md section 25
  - docs/bp/PROGRESS.md D9, D53
  - 'respondent: the notes of the DSM-IV inclusion form name the rater (dsm4_vie_entiere, dsm4_annee_ecoulee) and the clinicians
    (dsm4_episode_recent)'
  flags:
  - DSM-IV and DSM-5 are two editions, asked on two forms and exported in the same raw columns. Each has its own schema
    and its own columns (dsm4_ and dsm5_); the two are never delivered in one column (BP decision D9).
  - 'The application stores no edition: it is read from the label that the export writes on the inclusion row. The labelled
    inclusions are DSM-IV until 2019 (7 exceptions), DSM-5 on 24 of 380 in 2020, 44 of 425 in 2021 and 203 of 238 in 2022,
    and all DSM-5 from 2023. An inclusion with no label is read by the date of the patient''s first visit (DSM-IV before
    2020, DSM-5 from 2023; flag version_inferred) and is not delivered when that date is in 2020 to 2022 (version_unknown).'
  - 'The most recent episode or the current one: where the patient is in an episode at inclusion, the clinicians often described
    that episode here (902 of the 1,224 such visits with a type give the type of the current episode, and 619 have no end
    date). Use dsm4_current_* for the episode of the day.'
  - Each detail is asked for some types only (specifier and chronicity for a depressive episode, severity for a depressive,
    manic or mixed one). 28 answers filled where the form hides the question are missing (flag not_shown).
  - 'Dates: a start date on or after the visit is out of range and not delivered (100 of 3,823). End dates are not checked
    in this way (289 of 3,176 are on or after the visit), and 49 delivered pairs have an end before the start.'
  - The share of severe episodes without psychotic features falls from 45% of the severities until 2015 to 36% from 2016,
    within most centres.
  - The type of the most recent episode recorded at the follow-up visits is another column (dsm4_fu_recent_type).
  - 'Mixed episodes exist on the DSM-IV form only. A DSM-IV mixed episode is not the DSM-5 specifier ''with mixed features''
    (scale_reference.md section 25: confirmed in source (Hergueta 2013; Tandon 2015; Cafaro 2023)).'

dsm4_premier_episode:
  description: 'The first mood episode of the patient, on the DSM-IV inclusion form of FACE BP: its type, the age at which
    it began, whether it came within six months of a birth and whether a cyclothymic period of more than two years came
    before. Filled once, at the inclusion visit.'
  version: DSM-IV version of the inclusion form of FACE BP (the form says DSM-IV; the text revision is not named). The DSM-5
    version is dsm5_premier_episode.
  reference: DSM-IV (1994), the classification whose criteria the form names. The form is a form of the application, with
    no publication of its own.
  reference_confidence: confirmed in source (Grunze et al. 2021)
  respondent: clinician
  construct: illness_course
  period: lifetime (the first mood episode)
  sources:
  - schema notes (bp dsm4_premier_episode)
  - scale_reference.md section 25
  - docs/bp/PROGRESS.md D9, D53, D89
  - facedata/common_instruments.yaml (first_mood_episode)
  - 'respondent: the notes of the DSM-IV inclusion form name the rater (dsm4_vie_entiere, dsm4_annee_ecoulee) and the clinicians
    (dsm4_episode_recent)'
  variables:
    dsm4_first_episode_age:
      meaning: Age at the first mood episode, whatever its type (D89). '<5' is read as 5 (censored_left), '>89' as 89 (censored_right).
      higher_means: older age
      polarity: neutral
      basis: anchors
      source: label 'Age at the first mood episode' (years); schema notes (bp dsm4_premier_episode)
    dsm4_first_episode_type:
      meaning: 'Type of the first mood episode. The DSM-IV form has two types more than the DSM-5 form: mixed with and without
        psychotic features.'
      polarity: not_applicable
  flags:
  - DSM-IV and DSM-5 are two editions, asked on two forms and exported in the same raw columns. Each has its own schema
    and its own columns (dsm4_ and dsm5_); the two are never delivered in one column (BP decision D9).
  - 'The application stores no edition: it is read from the label that the export writes on the inclusion row. The labelled
    inclusions are DSM-IV until 2019 (7 exceptions), DSM-5 on 24 of 380 in 2020, 44 of 425 in 2021 and 203 of 238 in 2022,
    and all DSM-5 from 2023. An inclusion with no label is read by the date of the patient''s first visit (DSM-IV before
    2020, DSM-5 from 2023; flag version_inferred) and is not delivered when that date is in 2020 to 2022 (version_unknown).'
  - The DSM-5 twin of dsm4_first_episode_age is the score dsm5_first_episode_age (the earliest of three ages). On the DSM-5
    form the same raw column is the age at the first major depressive episode only (dsm5_first_mde_age, D89).
  - 'The postpartum question is asked of every patient, men included (they answer 0): a rate is computed among women.'
  - The cyclothymic period is yes for 13% of the patients and from 5% to 31% by centre; 'Ne sais pas' goes from 5% to 21%
    by centre.
  - FACE DR delivers dsm4_first_episode_type, dsm4_first_episode_age and dsm4_first_episode_postpartum from its own inclusion
    form (mood_history_v0), read from the same raw columns. The first psychotic episode of FACE SZ (first_psychotic_episode_age)
    is another question.
  - 4 ages are above the age at the inclusion visit; they are delivered as written and flagged check_failed.

dsm4_vie_entiere:
  description: 'The mood disorder over the whole life, as recorded at the inclusion visit on the DSM-IV form of FACE BP:
    the number of depressive, hypomanic, manic and mixed episodes, those with psychotic features, induced episodes, rapid
    cycling, full remission between episodes, seasonal pattern and the age at the first psychotropic treatment.'
  version: DSM-IV version of the inclusion form of FACE BP (the form says DSM-IV; the text revision is not named). The DSM-5
    version is dsm5_vie_entiere.
  reference: DSM-IV (1994), the classification whose criteria the form names. The form is a form of the application, with
    no publication of its own.
  reference_confidence: confirmed in source (Grunze et al. 2021)
  respondent: clinician
  construct: illness_course
  period: lifetime, as recorded at the inclusion visit
  sources:
  - schema notes (bp dsm4_vie_entiere)
  - scale_reference.md section 25
  - docs/bp/PROGRESS.md D9, D53, D122, D176
  - facedata/shared_names.yaml
  - facedata/common_instruments.yaml (mood_episodes_lifetime)
  - 'respondent: schema notes (bp dsm4_vie_entiere): ''the rater left it empty'''
  variables:
    dsm4_lt_n_*:
      meaning: 'Lifetime number of episodes of that kind. The form stops at 20: ''>20'' is read as 20 with a mark in the
        censoring column (this value or more).'
      higher_means: more episodes of that kind
      polarity: worse
      basis: anchors
      source: labels 'Number of ... episodes' (range 0 to 20); schema notes (bp dsm4_vie_entiere)
    dsm4_lt_first_treatment_age:
      meaning: Age at the first psychotropic treatment. '<5' is read as 5 (censored_left), '>89' as 89.
      higher_means: older age
      polarity: neutral
      basis: anchors
      source: label 'Age at the first psychotropic treatment' (years); schema notes (bp dsm4_vie_entiere)
  flags:
  - DSM-IV and DSM-5 are two editions, asked on two forms and exported in the same raw columns. Each has its own schema
    and its own columns (dsm4_ and dsm5_); the two are never delivered in one column (BP decision D9).
  - 'The application stores no edition: it is read from the label that the export writes on the inclusion row. The labelled
    inclusions are DSM-IV until 2019 (7 exceptions), DSM-5 on 24 of 380 in 2020, 44 of 425 in 2021 and 203 of 238 in 2022,
    and all DSM-5 from 2023. An inclusion with no label is read by the date of the patient''s first visit (DSM-IV before
    2020, DSM-5 from 2023; flag version_inferred) and is not delivered when that date is in 2020 to 2022 (version_unknown).'
  - 'A count of 20 is a lower bound (236 depressive, 190 hypomanic, 12 manic, 12 mixed): use the censoring column.'
  - '''Ne sais pas'' is 15% of the numbers of depressive episodes (5% to 33% by centre), 24% of the hypomanic ones (9% to
    40%), 13% of the mixed and 5% of the manic ones.'
  - The number of episodes with psychotic features, and of induced episodes, is asked only after a yes and is read as 0
    after a no; the yes/no on psychotic features is read as 0 where the number of episodes of that kind is 0 (D122).
  - 'Mixed episodes exist on the DSM-IV form only. A DSM-IV mixed episode is not the DSM-5 specifier ''with mixed features''
    (scale_reference.md section 25: confirmed in source (Hergueta 2013; Tandon 2015; Cafaro 2023)).'
  - 'The criteria of a manic episode differ between the editions (scale_reference.md section 25): DSM-5 asks for increased
    energy or activity besides the mood, DSM-IV for the mood only (confirmed in source (Grunze 2021)). DSM-IV excluded treatment-induced
    episodes; DSM-5 counts a full syndrome that persists beyond the effect of the treatment (confirmed in source (Tandon
    2015; Grunze 2021); DSM-5 text to verify).'
  - 'Rapid cycling is the rater''s yes/no (''now or in the past''), not derived from the counts. Published definition: at
    least four episodes in 12 months (scale_reference.md section 25: confirmed in source (Miola 2023, DSM-5-TR wording);
    ''unchanged from DSM-IV'' to verify).'
  - FACE DR delivers the same names (dsm4_lt_n_*, dsm4_lt_full_remission, dsm4_lt_seasonal, dsm4_lt_first_treatment_age)
    from its inclusion form (mood_history_v0), with counts from 0 to 50 against 0 to 20 here (shared_names.yaml).
  - The age at the first psychotropic treatment is not the first antipsychotic of FACE SZ (first_antipsychotic_age), although
    both are read from the same raw column (shared_names.yaml). A first treatment more than two years before the first episode
    (173 of 4,053 patients) is not an error.

dsm5_annee_ecoulee:
  description: 'The mood episodes of the year before the inclusion visit, on the DSM-5 inclusion form of FACE BP: one yes/no
    question (at least one episode), then the number of depressive, hypomanic and manic episodes, and for depressive and
    manic episodes a yes/no and a number for those with psychotic features.'
  version: DSM-5 version of the inclusion form of FACE BP. The DSM-IV version is dsm4_annee_ecoulee.
  reference: DSM-5 (APA 2013), the classification whose criteria the form names. The form is a form of the application,
    with no publication of its own.
  reference_confidence: confirmed in source (Grunze et al. 2021; Osipov thesis cites APA 2013)
  respondent: clinician
  construct: illness_course
  period: the year before the inclusion visit
  sources:
  - schema notes (bp dsm5_annee_ecoulee)
  - scale_reference.md section 25
  - docs/bp/PROGRESS.md D9, D53, D122
  - 'respondent: the notes of the DSM-5 inclusion form name the clinicians (dsm5_episode_recent; diva: ''typed by the clinician'')'
  variables:
    dsm5_ly_n_*:
      meaning: Number of episodes of that kind in the year before inclusion, 0 to 20 ('>20' is read as 20 and marked censored_right).
        Read as 0 where the first answer is no; missing where it is unknown or empty.
      higher_means: more episodes of that kind
      polarity: worse
      basis: anchors
      source: labels 'Number of ... episodes in the past year' (range 0 to 20); schema notes (bp dsm5_annee_ecoulee)
  flags:
  - DSM-IV and DSM-5 are two editions, asked on two forms and exported in the same raw columns. Each has its own schema
    and its own columns (dsm4_ and dsm5_); the two are never delivered in one column (BP decision D9).
  - 'The application stores no edition: it is read from the label that the export writes on the inclusion row. The labelled
    inclusions are DSM-IV until 2019 (7 exceptions), DSM-5 on 24 of 380 in 2020, 44 of 425 in 2021 and 203 of 238 in 2022,
    and all DSM-5 from 2023. An inclusion with no label is read by the date of the patient''s first visit (DSM-IV before
    2020, DSM-5 from 2023; flag version_inferred) and is not delivered when that date is in 2020 to 2022 (version_unknown).'
  - '9 inclusions labelled DSM-5 (2018 to 2022) also hold a DSM-IV record, and the export takes their answers from the DSM-IV
    record first: their answers may be those of the DSM-IV form (R70).'
  - The DSM-5 form has no mixed episode. It asks instead about depressive and manic episodes with mixed features in the
    year, which the extraction does not hold (R140).
  - Psychotic features of manic episodes are asked only after 1 to 15 manic episodes in the year; the answer is read as
    0 where the number of manic episodes is 0.
  - The yes/no per kind of episode (dsm5_ly_mde, dsm5_ly_hypomania, dsm5_ly_mania) is written by the export from the number
    and adds nothing to it.
  - Two centres hold almost no answer of this section on their DSM-5 inclusions (R20, O40); elsewhere the first answer is
    filled for 88% of the DSM-5 inclusions.

dsm5_depuis_derniere_visite:
  description: 'The mood episodes since the last visit, asked at the follow-up visits of FACE BP on the DSM-5 version of
    the follow-up form: one yes/no question (at least one episode), then the number of depressive, hypomanic and manic episodes,
    the numbers with psychotic features, and the type of the most recent episode.'
  version: DSM-5 version of the follow-up form of FACE BP. The DSM-IV version is dsm4_depuis_derniere_visite.
  reference: DSM-5 (APA 2013), the classification whose criteria the form names. The form is a form of the application,
    with no publication of its own.
  reference_confidence: confirmed in source (Grunze et al. 2021; Osipov thesis cites APA 2013)
  respondent: clinician
  construct: illness_course
  period: since the last visit
  sources:
  - schema notes (bp dsm5_depuis_derniere_visite)
  - scale_reference.md section 25
  - docs/bp/PROGRESS.md D9, D12, D14, D15, D53, D122
  - 'respondent: the notes of the follow-up form name the rater (dsm4_depuis_derniere_visite: ''the typed total is the rater''s
    own'')'
  scores:
    dsm5_fu_n_episodes:
      meaning: 'Number of mood episodes since the last visit: the sum of the depressive, hypomanic and manic numbers (0
        after a no). No total where one of the three is empty or unknown (185 visits).'
      higher_means: more mood episodes since the last visit
      polarity: worse
      basis: anchors
      source: label 'Number of mood episodes since the last visit (depressive, hypomanic and manic, added)'; schema notes
        (bp dsm5_depuis_derniere_visite), decision D122
  variables:
    dsm5_fu_n_*:
      meaning: Number of episodes of that kind since the last visit, 0 to 20. Read as 0 where the first answer is no.
      higher_means: more episodes of that kind
      polarity: worse
      basis: anchors
      source: labels 'Number of ... episodes since the last visit' (range 0 to 20); schema notes (bp dsm5_depuis_derniere_visite)
    dsm5_fu_recent_type:
      meaning: Type of the most recent episode since the last visit (depressive, hypomanic, manic, unspecified). The list
        has no mixed type.
      polarity: not_applicable
  flags:
  - DSM-IV and DSM-5 are two editions, asked on two forms and exported in the same raw columns. Each has its own schema
    and its own columns (dsm4_ and dsm5_); the two are never delivered in one column (BP decision D9).
  - 'Edition of a follow-up visit: before 2022 it takes the label of the patient''s inclusion (D12); from 1 January 2022
    it is DSM-5 in every centre, whatever the inclusion (D14), although the follow-up form changed centre by centre between
    October 2021 and May 2022. A visit that holds a column of the old form (mixed numbers, typed total) is read as DSM-IV
    whatever its date (flag version_overridden).'
  - This schema reads 2,328 visits, all but 1 from 2022; 1,029 of them are visits of patients whose inclusion was DSM-IV
    (D14).
  - 'The total has no mixed episodes, unlike the DSM-IV total (dsm4_fu_n_episodes): the two totals do not add the same kinds
    of episode.'
  - 'The window is the time since the previous visit, which is not one window (median gap 186 days at the six-monthly visits
    and 367 at the yearly ones). The share of yes answers rises with the gap: do not compare counts of episodes across visits
    without the gap.'
  - 'Episodes since the last visit are probably undercounted: of the 596 follow-up visits in a current episode that answer
    this question, 153 say that no episode occurred since the last visit.'
  - The form shows a number with psychotic features only after 1 to 20 episodes of that kind; it is read as 0 where that
    number is 0.
  - 'Not in the extraction (R140): the numbers of depressive and manic episodes with mixed features since the last visit,
    and the dates of the first depressive, manic and hypomanic episode since the last visit.'
  - From 2022 one large centre holds an answer of the follow-up mood form on few of its follow-up visits (O40), against
    85% in the other centres.

dsm5_episode_actuel:
  description: 'The mood episode the patient is in on the day of the visit, if any, on the DSM-5 version of the forms of
    FACE BP: a yes/no, then the type, specifier, severity, chronicity and whether it followed a birth. Filled at the inclusion
    visit and at every follow-up visit; the start date exists at follow-up only.'
  version: DSM-5 version of the inclusion and follow-up forms of FACE BP. The DSM-IV version is dsm4_episode_actuel.
