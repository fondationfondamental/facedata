substance_fu:
  description: 'Substance use disorders at the yearly follow-up visits: the inclusion questions asked again. FACE BP: one
    question (does the patient have, or have they had, a substance use disorder), then for each of eight substances a box,
    the type (abuse or dependence), symptoms in the past month, the age at onset and the cumulated duration in months. FACE
    SZ: for each of eight substances a box (a symptom of a use disorder over the whole life), whether the disorder is present
    at the time of the visit and the age at onset.'
  version: 'FACE BP: the yearly comorbidity form, with the DSM-IV names abuse and dependence. FACE SZ: the clinician''s
    list of the comorbidity form, to which a yes of the addiction form is added from 2015.'
  reference: Abuse and dependence are the DSM-IV names (FACE BP); the FACE SZ boxes rest on the DSM-5 criteria of a substance
    use disorder (Hasin DS, O'Brien CP, Auriacombe M, et al. Am J Psychiatry 2013;170:834-851). The forms are forms of the
    application, with no publication of their own.
  reference_confidence: 'Confirmed (abstract: Hasin 2013, PMID 23903334)'
  respondent: clinician
  construct: substance_use
  period: 'at the yearly visit: an update given at that visit of a question worded over the whole life; symptoms: past month
    (BP), at the time of the visit (SZ)'
  sources:
  - schema notes (bp substance_fu)
  - schema notes (sz substance_fu)
  - docs/bp/PROGRESS.md D49, D50, D74, D84
  - docs/sz/PROGRESS.md D17
  - facedata/common_instruments.yaml (substance_fu)
  - scale_reference_aq_general.md section 3
  - 'respondent: schema notes (sz substance_fu): ''the clinician''s answer of the comorbidity form''; BP form ''does the
    patient have, or have they had, a substance use disorder'''
  variables:
    substance_disorder_fu:
      meaning: 'First question, at a yearly visit (1 yes, 0 no). FACE BP: the clinician''s answer to ''does the patient
        have, or have they had, a substance use disorder''. FACE SZ: the clinician''s answer of the comorbidity form, which
        the export turns into yes when any box is yes.'
    '*_disorder_fu':
      meaning: 'Box of one substance, at a yearly visit (1 yes, 0 no). FACE BP: abuse or dependence on that substance. FACE
        SZ: a symptom of a use disorder over the whole life (at least one DSM-5 criterion, or the clinician''s tick).'
    '*_last_month_fu':
      meaning: 'FACE BP: symptoms in the past month. FACE SZ: the use disorder is present at the time of the visit (asked
        from two DSM-5 criteria).'
    '*_type_fu':
      meaning: Abuse or dependence, FACE BP only (SZ has no type of disorder).
      polarity: not_applicable
    '*_onset_age_fu':
      meaning: 'Age at onset of the disorder of that substance (FACE SZ: of the use disorder), as given at a yearly visit:
        still a lifetime age. The export loses ''Ne sais pas'', ''<5'' and ''>89''.'
      higher_means: older age
      polarity: neutral
      basis: anchors
      source: 'labels ''...: age at onset'' (range 0 to 90); schema notes (bp and sz substance_fu)'
    '*_months_fu':
      meaning: Cumulated duration of the disorder over the whole life, in months, typed freely. FACE BP only. Winsorised
        like every number; above 840 months is out of range.
      higher_means: longer cumulated duration of the disorder
      polarity: neutral
      basis: anchors
      source: 'labels ''...: cumulated duration of the disorder over the life'' (months, range 0 to 840); schema notes (bp
        substance_fu)'
  flags:
  - 'A yearly answer is an update given at that visit, on the inclusion form asked again: neither a history of the whole
    life nor strictly an answer about the time since the last visit (BP decision D84).'
  - 'The question is about the whole life (''has or has had''), so a yes should not become a no; it does. FACE BP: the first
    question is yes for 37% of the answers at inclusion and 23% at the yearly visits, and 41% of the yearly answers given
    more than nine months after a yes at inclusion are ''no''. FACE SZ: of the patients with an alcohol box at 1 at inclusion,
    147 of the 319 later answers are ''no''.'
  - 'Same names, different content in the two cohorts. FACE BP: the box is the clinician''s tick of abuse or dependence,
    and ''_last_month'' is ''symptoms in the past month''. FACE SZ: the box is ''a symptom of a use disorder over the whole
    life (at least one DSM-5 criterion)'' and ''_last_month'' is ''use disorder present at the time of the visit''. Stack
    with care (common_instruments.yaml).'
  - 'FACE SZ: the box has two sources, the clinician''s list and, from 2015, a yes of the addiction form: the yes share
    of the cannabis box rises from 10% to 19% of the answers in 2012-14 to 22% to 29% from 2015. The stimulants and the
    other substances have a box at follow-up only.'
  - 'FACE SZ: the end of each section (disorder present at the time of the visit, age at onset) is shown only with two or
    more DSM-5 criteria, a count that is in another tab: an empty cell means ''not asked'', not ''no''. Two or more of 11
    criteria within 12 months is the published DSM-5 threshold (scale_reference_aq_general.md section 3: Confirmed (direct:
    Miller 2023)).'
  - 'FACE BP: the yearly form opens with the question ''no change since the last visit?'', which the extraction does not
    hold: an empty yearly section may mean ''no change''. In FACE BP the first question is empty on 37% of the yearly visits
    up to 2021 and on 58% from 2022 (five centres make the step).'
  - Asked at the yearly visits only, never at the six-monthly ones. In FACE BP the share of yearly visits that hold the
    tab is 37% to 48% in 2010-2013, 67% to 73% in 2015-2019 and 39% to 47% from 2022.
  - 'The ages at onset and the durations still describe the whole life at the yearly visits, but are retyped: in FACE BP
    the age equals the one of the inclusion visit in 66% of the pairs and the duration in 38%.'
  - 'FACE BP uses abuse and dependence, the DSM-IV names, in every year, also for the patients evaluated with DSM-5 criteria.
    DSM-5 merges the two into one disorder (scale_reference_aq_general.md section 3: Confirmed (abstract: Hasin 2013)).'

