    dsm5_first_mood_stabiliser_age:
      meaning: Age at the first mood stabiliser (form label 'Age du premier traitement thymorégulateur', D87). DSM-5 form
        only.
      higher_means: older age
      polarity: neutral
      basis: anchors
      source: label 'Age at the first mood stabiliser' (years); schema notes (bp dsm5_premier_episode), D87
  flags:
  - DSM-IV and DSM-5 are two editions, asked on two forms and exported in the same raw columns. Each has its own schema
    and its own columns (dsm4_ and dsm5_); the two are never delivered in one column (BP decision D9).
  - 'The application stores no edition: it is read from the label that the export writes on the inclusion row. The labelled
    inclusions are DSM-IV until 2019 (7 exceptions), DSM-5 on 24 of 380 in 2020, 44 of 425 in 2021 and 203 of 238 in 2022,
