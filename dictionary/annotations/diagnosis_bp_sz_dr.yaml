        D150, D151'
  variables:
    anxiety_disorder_fu:
      meaning: Answer to 'does the patient have an anxiety disorder' at a yearly visit (1 yes, 0 no; unknown is missing).
        In FACE SZ it is the only anxiety answer of the yearly visits.
    '*_onset_age_fu':
      meaning: 'Age at onset of that disorder as given at a yearly visit, FACE BP only. A lifetime age, not an age ''since
        the last visit'': it equals the age given at inclusion in 33% to 82% of the pairs by disorder.'
      higher_means: older age
      polarity: neutral
      basis: anchors
      source: 'labels ''...: age at onset, at follow-up'' (range 0 to 90); schema notes (bp anxiety_fu)'
  flags:
  - 'A yearly answer is an update given at that visit, on the inclusion form asked again: neither a history of the whole
    life nor strictly an answer about the time since the last visit (BP decision D84).'
  - 'FACE BP: the yearly form opens with the question ''no change since the last visit?'', which the extraction does not
    hold: an empty yearly section may mean ''no change''. The SZ form has no such question.'
  - 'Not a lifetime answer: of the patients answered yes at inclusion, the first answer a year or more later is ''no'' for
    40% in FACE BP (435 of 1,081); in FACE SZ 397 of 837 later answers (47%) are ''no''.'
  - Asked at the yearly visits only, never at the six-monthly ones. In FACE BP the share of yearly visits that hold the
    tab is 37% to 48% in 2010-2013, 67% to 73% in 2015-2019 and 39% to 47% from 2022. anxiety_disorder_fu is answered on
    56% of the BP yearly visits and on 2,265 of the 2,588 SZ yearly visits.
  - 'FACE SZ: the extraction holds the first question only; the list of disorders of the yearly form is not exported (R115).'
  - 'FACE BP: the boxes are read as 0 after a no to the first question and stay missing where it is unknown or empty. An
