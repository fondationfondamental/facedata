    life (at least one DSM-5 criterion)'' and ''_last_month'' is ''use disorder present at the time of the visit''. Stack
    with care (common_instruments.yaml).'
  - 'FACE SZ: substance_disorder_v0 cannot be used: the export derives it from the boxes and writes ''Ne sais pas'' (read
    as missing) on 975 of the 1,583 answered inclusion visits (R116).'
  - 'FACE SZ: the module is used from 2015, not from 2012 (its opening alcohol question is answered on 9% of the inclusion
    visits of 2012, 48% of 2015 and 83% to 93% from 2016). The sedative, opiate, cocaine and hallucinogen boxes are read
    as 0 after a no to the opening drug question (illicit_drugs_over_ten_times, instrument drug_use).'
  - 'FACE SZ: the end of each section (disorder present at the time of the visit, age at onset) is shown only with two or
    more DSM-5 criteria, a count that is in another tab: an empty cell means ''not asked'', not ''no''. Two or more of 11
    criteria within 12 months is the published DSM-5 threshold (scale_reference_aq_general.md section 3: Confirmed (direct:
    Miller 2023)).'
  - 'FACE SZ: six substances at inclusion (no stimulants, no other substances); the hallucinogen box at inclusion is the
    question on other products, and hallucinogen_onset_age_v0 has no cell.'
  - 'Inclusion and yearly answers are delivered apart (_v0 and _fu): a later answer often says ''no'' after a yes although
    the question is about the whole life (BP: 41% of the yearly answers given more than nine months after a yes at inclusion).'
  - 'FACE BP uses abuse and dependence, the DSM-IV names, in every year, also for the patients evaluated with DSM-5 criteria.
    DSM-5 merges the two into one disorder (scale_reference_aq_general.md section 3: Confirmed (abstract: Hasin 2013)).'
  - 'FACE BP: a ticked box often has empty details, and an empty detail is not ''not asked'': at inclusion the type is empty
    for 22% of the ticked boxes and the duration for 42%; all four details are empty on 5% to 9% of the boxes of 2011 to
    2016 and on 32% to 40% of those of 2018 to 2021.'
  - 'FACE BP: the first question is empty on 14% of the inclusion visits up to 2021 and on 35% from 2022 (three centres
    make the step); an empty answer is missing, not ''no''. The boxes are 0 after a no and missing where the first answer
    is unknown or empty.'
  - 'By year in FACE SZ: the cannabis box is yes on 34% to 35% of the answers of 2014 to 2022 and 22% from 2023; the sedative
    box falls after 2016 in one centre; no known cause.'

tobacco:
  description: 'The tobacco status at the visit (non-smoker, current smoker, ex-smoker), with the pack-years and the ages
    at which the patient started and stopped smoking. In the four cohorts. FACE SZ adds five questions: cigarettes per day
    in the last 12 months, age at the first cigarette, longest abstinence, a first-degree relative with a tobacco use disorder
    and a craving score from 0 to 10.'
  reference: not_applicable
  construct: tobacco
  period: 'status: the day of the visit; pack-years and ages: cumulative over the life; SZ: cigarettes per day in the last
    12 months, craving in the last week'
  sources:
  - schema notes (bp, sz, dr and asp tobacco)
  - scale_reference_rest.md section 11
  - docs/bp/PROGRESS.md D49
  - docs/dr/PROGRESS.md D42
  - facedata/common_instruments.yaml (tobacco)
  variables:
    tobacco_status:
      meaning: 'Status on the day of the visit: non-smoker, current smoker or ex-smoker. ''Non-smoker'' is not ''never smoked''.'
      polarity: not_applicable
    pack_years:
      meaning: 'Pack-years: packs a day times years smoked (1 pack = 20 cigarettes), typed by hand and retyped at each visit.
        Filled for smokers and ex-smokers only; winsorised; above 200 is out of range.'
      higher_means: more tobacco smoked over the life
      polarity: worse
      basis: literature
      source: 'scale_reference_rest.md section 11: pack-years = packs per day x years, Confirmed (search snippets of the
        NCI entries); schema notes (bp tobacco): ''the formula of the form (packs a day times years)'''
    cigarettes_per_day_12m:
      meaning: FACE SZ only. Cigarettes smoked per day on average in the last 12 months; asked of current and ex-smokers
        (0 for 74% of the ex-smokers' answers). Winsorised.
      higher_means: more cigarettes per day
      polarity: worse
      basis: anchors
      source: label 'Cigarettes smoked per day on average in the last 12 months'; schema notes (sz tobacco)
    tobacco_craving_score:
      meaning: FACE SZ only. Maximum craving for tobacco in the last week, from 0 (never) to 10 (all the time).
      higher_means: more craving
      polarity: worse
      basis: anchors
      source: label 'Maximum craving for tobacco in the last week (0 never to 10 all the time)' (sz tobacco)
    tobacco_first_age:
      meaning: 'FACE SZ only. Age at the first cigarette: another question than smoking_start_age.'
      higher_means: older age
      polarity: neutral
      basis: anchors
      source: 'label ''Age at the first cigarette''; schema notes (asp tobacco): ''the three names stay apart'''
  flags:
  - '''Non-smoker'' is not ''never smoked'': a patient is a non-smoker at one visit and a smoker or ex-smoker at another
    (12% of the non-smoker visits of FACE BP are dated after a visit as a smoker or ex-smoker). The details of a non-smoker
    are empty, never 0: never derive 0 pack-years from ''non-smoker''.'
  - 'The pack-years and the ages are retyped at each visit and are not constant: in FACE BP the pack-years fall between
    two visits in 22% of the pairs and the start age takes more than one value for 44% of the patients who give it twice
    or more (SZ 25% and 52%, DR 31% and 51%).'
  - 'The delivered pack-years are not the typed ones: they are winsorised at the 1st and 99th percentiles (FACE BP: 61 values
    from 73 to 200 become 72).'
  - 'FACE ASP records tobacco from 2020 and its pack-years are doubtful (values that are not possible for patients this
    young, from one centre; the unit is not known, open question O10): compare the pack-years of BP, SZ and DR only (common_instruments.yaml).'
  - 'FACE SZ: the five added questions are asked of current and ex-smokers only and are used from 2015 (filled on 3% to
    13% of the smoker visits in 2012 to 2014, 65% to 89% since 2016).'
  - 'Steps with no known cause. FACE DR: non-smokers are 50% of the visits until 2020 and 64% since, while the details are
    given less often. FACE SZ: current smokers go from 53% of the visits of 2014-16 to 36% from 2023. FACE BP: the status
    is filled on 67% to 84% of the follow-up visits of 2009-2013 and 76% in 2020, against 86% to 94% in the other years.'
  - Who records the answers is stated for FACE DR only (the nurse's record, form 112). In FACE DR the form shows the pack-year
    formula and computes nothing; in FACE BP the formula is commented out of the script.
  - 'Not in the extraction: the nicotine substitute (BP, R120); the age of the strongest dependence and a drug treatment
    of the tobacco use disorder (SZ, R120). The Fagerström test is another instrument (fagerstrom).'

lifetime_symptoms:
  description: 'Twenty-two psychotic symptoms (ten delusions, ideas of reference, four kinds of hallucination, catatonia,
    three signs of disorganisation and three negative symptoms), each answered twice at the inclusion visit of FACE SZ:
    ever, and present in the last month.'
  reference: not_applicable
  respondent: clinician
  construct: psychotic_symptoms
  period: lifetime (ever) and the last month, as recorded at the inclusion visit
  sources:
  - schema notes (sz lifetime_symptoms)
  - docs/sz/PROGRESS.md D80
  - 'respondent: the questions are on the diagnostic form (table psy_diag_psychiatrique_sz), the form that asks ''does the
    patient have an anxiety disorder'' (schema notes, sz anxiety_v0)'
  items:
    higher_means: symptom present
    polarity: worse
    basis: stated
    source: 'schema notes (sz lifetime_symptoms): ''1 is yes, 0 is no'''
  variables:
    symptom_*_ever:
      meaning: The symptom was present at some time of the life (1 yes, 0 no; 'Ne sais pas' is a missing code).
    symptom_*_last_month:
      meaning: 'The symptom was present in the last month. Shown only after a yes to ''ever'': read as 0 after a no, missing
        after ''Ne sais pas''.'
  flags:
  - 'Inclusion visits only: 2,185 visits answer at least one symptom and 1,148 answer the 22.'
  - 'After a yes to ''ever'' the last-month answer is blank on 1,560 of 17,456 cells, and on 87 of the 2,170 visits with
    a yes every last-month answer is blank: a blank there is missing, not ''no''.'
  - '''Ne sais pas'' is a missing code: 66 to 224 answers per symptom for ''ever'', 6 to 61 for the last month.'

psychosis_course:
  description: 'The course of the psychotic disorder in FACE SZ. At the inclusion visit: the age at the first psychotic
    episode and at the first antipsychotic treatment, the duration of untreated psychosis in months, the number of psychotic
    episodes and the course of the symptoms. At every visit: a psychotic episode in the past year, a suicide attempt in
    the past year and the number of attempts.'
  reference: not_applicable
  construct: illness_course
  period: lifetime (inclusion visit); the past year (every visit)
  sources:
  - schema notes (sz psychosis_course)
  - docs/sz/PROGRESS.md D80
  - facedata/shared_names.yaml
  - facedata/common_instruments.yaml (first_mood_episode)
  variables:
    first_psychotic_episode_age:
      meaning: Age at the first psychotic episode. Another question than the age at the first mood episode of BP and DR
        (dsm4_first_episode_age); not joined with it.
      higher_means: older age
      polarity: neutral
      basis: anchors
      source: label 'Age at the first psychotic episode' (years); schema notes (sz psychosis_course)
    first_antipsychotic_age:
      meaning: 'Age at the first antipsychotic treatment. BP and DR read the first psychotropic treatment from the same
        raw column: another question (shared_names.yaml).'
      higher_means: older age
      polarity: neutral
      basis: anchors
      source: label 'Age at the first antipsychotic treatment' (years); facedata/shared_names.yaml (agetrt)
    untreated_psychosis_months:
      meaning: 'Duration of untreated psychosis, in months, typed in a numeric field: not the difference of the two ages.
        Winsorised (15 cells of 192 to 360 months become 184); above 600 is out of range.'
      higher_means: longer untreated psychosis
      polarity: neutral
      basis: anchors
      source: label 'Duration of untreated psychosis' (months, range 0 to 600); schema notes (sz psychosis_course)
    n_psychotic_episodes:
      meaning: 'Number of psychotic episodes, asked at the inclusion visit: 0 to 20 (''Aucun'' is read as 0, ''more than
        20'' is censored_right on 21 visits).'
      higher_means: more psychotic episodes
      polarity: worse
      basis: anchors
      source: label 'Number of psychotic episodes' (range 0 to 20); schema notes (sz psychosis_course)
    symptom_course:
      meaning: 'Course of the symptoms: single episode, episodic or continuous, with the state between or after the episodes
        (nine answers).'
      polarity: not_applicable
    suicide_attempt_12m:
      meaning: A suicide attempt in the past year (1 yes, 0 no), asked at every visit.
      construct: suicidal_behaviour
    n_suicide_attempts_12m:
      meaning: Number of suicide attempts in the past year, 0 to 20. Shown after a yes to the attempt question and read
        as 0 after a no. Not winsorised.
      construct: suicidal_behaviour
      higher_means: more suicide attempts in the past year
      polarity: worse
      basis: anchors
      source: label 'Number of suicide attempts in the past year' (range 0 to 20); schema notes (sz psychosis_course)
  flags:
  - 'Two periods in one instrument: the ages, the duration, the number of episodes and the course are asked at the inclusion
    visit (2,244 visits); the three past-year questions at every visit (4,549 visits).'
  - The follow-up form has its own course question and 12-month questions on violence and substances; the export does not
    read them (R141).
  - 'Delivered as written: the first treatment is before the first episode on 65 of 2,093 visits (50 by 2 years or more);
    the course says a single episode with 2 or more episodes on 33 of 168 visits, and episodic with 1 episode on 172 of
    1,183.'
  - An age above the age at the visit is flagged check_failed (8 first-episode ages, 17 first-treatment ages). 14 durations
    of untreated psychosis are longer than the time since the first episode plus 12 months.
  - '''Ne sais pas'' is a missing code, and so is 999 in the duration. ''<5'' is read as 5 (censored_left) on 4 cells.'
  - Who fills the form is not stated in the notes.

violent_behaviours:
  description: 'Violent behaviours of the patient over the whole life, at the inclusion visit of FACE SZ: four kinds (verbal,
    physical, sexual, breaking of objects) and, for each, inside or outside the family, an intervention of the police, a
    conviction and its sentence; for the physical violence also blows and wounds, with or without a weapon, whether the
    other person needed care, and homicide; for the sexual violence its kind.'
  reference: not_applicable
  respondent: clinician
  construct: aggression_hostility
  period: lifetime
  sources:
  - schema notes (sz violent_behaviours)
  - docs/sz/PROGRESS.md D80
  - 'respondent: the form puts the question in the third person (''has the subject presented, over the whole life'')'
  items:
    higher_means: yes (1 is yes, 0 is no)
    basis: stated
    source: 'schema notes (sz violent_behaviours): ''1 is yes, 0 is no'''
  variables:
    violence_verbal:
      meaning: Verbal violence by the patient over the whole life (1 yes, 0 no). The gate of its details.
      higher_means: behaviour present
      polarity: worse
      basis: stated
      source: 'labels ''... by the patient, whole life''; schema notes (sz violent_behaviours): ''1 is yes, 0 is no'''
    violence_physical:
      meaning: Physical violence by the patient over the whole life (1 yes, 0 no). The gate of its details.
      higher_means: behaviour present
      polarity: worse
      basis: stated
      source: 'labels ''... by the patient, whole life''; schema notes (sz violent_behaviours): ''1 is yes, 0 is no'''
    violence_sexual:
      meaning: Sexual violence by the patient over the whole life (1 yes, 0 no). The gate of its details.
      higher_means: behaviour present
      polarity: worse
      basis: stated
      source: 'labels ''... by the patient, whole life''; schema notes (sz violent_behaviours): ''1 is yes, 0 is no'''
    violence_objects:
      meaning: Breaking of objects by the patient over the whole life (1 yes, 0 no). The gate of its details.
      higher_means: behaviour present
      polarity: worse
      basis: stated
      source: 'labels ''... by the patient, whole life''; schema notes (sz violent_behaviours): ''1 is yes, 0 is no'''
    violence_physical_homicide:
      meaning: 'Homicide committed by the patient over the whole life, asked under the physical violence: 603 answers (8
        yes) after a yes to the physical violence, 0 after a no (decision D80).'
  flags:
  - 'Roll-out: the block is answered on 6%, 10% and 15% of the inclusion visits of 2010, 2011 and 2012, 33% in 2013, 50%
    in 2014 and 81% to 99% from 2015. Inclusion visits only (1,816 visits).'
  - The ten yes/no questions that hang on a gate (police and conviction of the four kinds, blows and wounds, care needed)
    are read as 0 after a no on their gate.
  - 'The sets (inside or outside the family, weapon, sentence) are one yes/no per box and are left as they are: an empty
    cell of a set is not a ''no''.'

alcohol_use:
  description: 'Alcohol use in FACE SZ, at inclusion and at the yearly visits: whether the patient has drunk alcohol more
    than ten times in their life, the amounts and frequencies in the periods of heaviest use over the whole life and in
    the last 12 months, the frequency of heavy drinking (more than 6 glasses on one occasion), the age at the first drink,
    the longest abstinence, the family history and a craving score from 0 to 10.'
  reference: not_applicable
  construct: alcohol
  period: 'lifetime (periods of heaviest use) and the last 12 months; craving: the last week'
  sources:
  - schema notes (sz alcohol_use)
  - docs/sz/PROGRESS.md D17
  - scale_reference_aq_general.md section 3
  variables:
    alcohol_over_ten_times:
      meaning: 'Has drunk alcohol more than ten times in their life (1 yes, 0 no): not ''ever''. The gate of the details.'
    alcohol_never_once:
      meaning: Not one use in the whole life (primary abstinence). Asked after a no to 'more than ten times'; delivered
        as 0 after a yes.
      higher_means: never drank alcohol (1 = primary abstinence)
      basis: anchors
      source: 'label ''Alcohol: not one use in the whole life (primary abstinence; asked after a no to more than ten times)''
        (sz alcohol_use)'
    alcohol_dose_*:
      meaning: Glasses (10 g of alcohol) per day of use, in the periods of heaviest use over the whole life or in the last
        12 months. Above 40 glasses is out of range and delivered as missing.
      higher_means: more alcohol per day of use
      polarity: worse
      basis: anchors
      source: 'labels ''Alcohol: amount per day of use ...'' (glasses per day, range 0 to 40); schema notes (sz alcohol_use)'
    alcohol_frequency_12m:
      meaning: 'Frequency in the last 12 months: weekly (1 to 7 times a week) or less than weekly. ''Less than weekly''
        holds the non-users: 559 of the 1,266 answers of that frequency have an amount of 0.'
      polarity: not_applicable
    alcohol_craving_score:
      meaning: Maximum craving for alcohol in the last week, from 0 (never) to 10 (all the time).
      higher_means: more craving
      polarity: worse
      basis: anchors
      source: 'labels ''...: maximum craving in the last week (0 never to 10 all the time)'' (sz alcohol_use)'
    alcohol_max_abstinence:
      meaning: 'Longest abstinence, in months: a question over the whole life. Shown only with two or more DSM-5 criteria.'
      higher_means: longer abstinence
      polarity: neutral
      basis: anchors
      source: 'labels ''...: longest abstinence'' (months, range 0 to 720); schema notes (sz alcohol_use)'
  flags:
  - 'Asked at inclusion and at the yearly visits, and used from 2015, not from 2012: the first question is answered on 9%
    of the inclusion visits of 2012, 18% of 2014, 48% of 2015 and 83% to 93% from 2016.'
  - 'Not asked, not ''no'': the questions at the end of the section (age at the first use, longest abstinence, family history,
    craving) are shown only with two or more DSM-5 criteria, a count that is in another tab (the instrument dsm5_alcohol).
    An empty cell there means ''not asked''; it is not encoded. Two or more of 11 criteria within 12 months is the published
    DSM-5 threshold (scale_reference_aq_general.md section 3: Confirmed (direct: Miller 2023)).'
  - 'One column per question for inclusion and follow-up. The questions about the whole life keep that meaning at follow-up
    on average only: 169 of the 1,154 later answers (15%) of the patients who said yes at inclusion are ''no''.'
  - The number of times per week is filled after '1 to 7 times a week' only; it is empty, not 0, after 'less than weekly'.
  - 999 and 9999 mean 'does not know' in an amount or a duration, 99 in an age; they are missing codes.
  - By year, 'never once' is yes on 8% of the answers until 2022 and 15% from 2023; the longest abstinence has a median
    of 4 months in 2014-19, 11 in 2020-22 and 6 from 2023; no known cause.
  - 'Not in the extraction (R120): a drug treatment of the alcohol use disorder and a hospitalisation for withdrawal.'
  - 'Who answers is not stated in the notes: the form words its questions to the patient (''more than ten times in your
    life'').'

cannabis_use:
  description: 'Cannabis use in FACE SZ, at inclusion and at the yearly visits: whether the patient has used cannabis more
    than ten times in their life, the amounts (joints per day of use) and frequencies in the periods of heaviest use over
    the whole life and in the last 12 months, the age at the first use, the longest abstinence, the family history and a
    craving score from 0 to 10.'
  reference: not_applicable
  construct: cannabis
  period: 'lifetime (periods of heaviest use) and the last 12 months; craving: the last week'
  sources:
  - schema notes (sz cannabis_use)
  - schema notes (dr cannabis)
  - docs/sz/PROGRESS.md D17
  - scale_reference_aq_general.md section 3
  variables:
    cannabis_over_ten_times:
      meaning: 'Has used cannabis more than ten times in their life (1 yes, 0 no): not ''ever''. About 70% of the inclusion
        answers have used cannabis at least once, 50% more than ten times.'
    cannabis_never_once:
      meaning: Not one use in the whole life (primary abstinence). Asked after a no to 'more than ten times'; delivered
        as 0 after a yes.
      higher_means: never used cannabis (1 = primary abstinence)
      basis: anchors
      source: 'label ''Cannabis: not one use in the whole life (primary abstinence; asked after a no to more than ten times)''
        (sz cannabis_use)'
    cannabis_dose_*:
      meaning: Joints per day of use, in the periods of heaviest use over the whole life or in the last 12 months.
      higher_means: more joints per day of use
      polarity: worse
      basis: anchors
      source: 'labels ''Cannabis: amount per day of use ...'' (joints per day, range 0 to 50); schema notes (sz cannabis_use)'
    cannabis_frequency_12m:
      meaning: 'Frequency in the last 12 months: weekly (1 to 7 times a week) or less than weekly. ''Less than weekly''
        holds the non-users (763 of the 887 answers of that frequency have an amount of 0): use the amount, not the frequency,
        to tell a user from a non-user.'
      polarity: not_applicable
    cannabis_craving_score:
      meaning: Maximum craving for cannabis in the last week, from 0 (never) to 10 (all the time).
      higher_means: more craving
      polarity: worse
      basis: anchors
      source: 'labels ''...: maximum craving in the last week (0 never to 10 all the time)'' (sz cannabis_use)'
    cannabis_max_abstinence:
      meaning: 'Longest abstinence, in months: a question over the whole life. Shown only with two or more DSM-5 criteria.'
      higher_means: longer abstinence
      polarity: neutral
      basis: anchors
      source: 'labels ''...: longest abstinence'' (months, range 0 to 720); schema notes (sz cannabis_use)'
  flags:
  - 'Asked at inclusion and at the yearly visits, and used from 2015, not from 2012: the first question is answered on 6%
    of the inclusion and yearly visits of 2012, 16% of 2014, 52% of 2015 and 83% of 2016.'
  - 'Not asked, not ''no'': the questions at the end of the section (age at the first use, longest abstinence, family history,
    craving) are shown only with two or more DSM-5 criteria, a count that is in another tab (the instrument dsm5_cannabis).
    An empty cell there means ''not asked''; it is not encoded. Two or more of 11 criteria within 12 months is the published
    DSM-5 threshold (scale_reference_aq_general.md section 3: Confirmed (direct: Miller 2023)).'
  - 'One column per question for inclusion and follow-up. The questions about the whole life keep that meaning at follow-up
    on average only: 80 of the 725 later answers (11%) of the patients who said yes at inclusion are ''no''.'
  - 'Not joinable with the cannabis question of FACE DR (cannabis_current: current use) nor with the cannabis use disorder
    of BP and ASP (schema notes, dr cannabis).'
  - 999 and 9999 mean 'does not know' in an amount or a duration, 99 in an age; they are missing codes.
  - By year, 'never once' is yes on 24% to 32% of the answers until 2022 and 37% from 2023; the frequency of the last 12
    months is 'weekly' on 32% of the answers of 2014-16 and 22% since 2020; no known cause.
  - 'Not in the extraction (R120): a drug treatment of the cannabis use disorder and a hospitalisation for withdrawal.'
  - 'Who answers is not stated in the notes: the form words its questions to the patient (''more than ten times in your
    life'').'

depressive_episodes:
  description: 'Major depressive episodes outside the psychotic episodes, asked at the inclusion visit of FACE SZ: has the
    patient had major depressive episodes (including post-psychotic depression), the age at the first one and their number
    over the whole life.'
  reference: not_applicable
  respondent: clinician
  construct: psychiatric_comorbidity
  period: lifetime, as recorded at the inclusion visit
  sources:
  - schema notes (sz depressive_episodes)
  - docs/sz/PROGRESS.md D17
  - 'respondent: the form asks about the patient in the third person (''has the patient had major depressive episodes'')'
  variables:
    mde_count:
      meaning: 'Number of major depressive episodes over the whole life; 0 after a no to the first question. Capped: the
        export removes the sign of ''>20'', so a 20 is a lower bound (12 cells).'
      higher_means: more major depressive episodes
      polarity: worse
      basis: anchors
      source: label 'Number of major depressive episodes over the whole life'; schema notes (sz depressive_episodes)
    mde_first_age:
      meaning: Age at the first major depressive episode. The options run from '<5' to '>89', read as 5 and 89 ('<5' cannot
        be told from 5). Missing after a no.
      higher_means: older age
      polarity: neutral
      basis: anchors
      source: label 'Age at the first major depressive episode'; schema notes (sz depressive_episodes)
  flags:
  - 'Inclusion visits only (2,149 of the 2,353 visits answered: 1,016 yes, 966 no); the follow-up visits do not hold the
    question.'
  - 999 is 'does not know' (215 numbers, 58 ages) and 'U' is a missing code (167 first answers). Under a yes the age is
    empty on 7% of the visits and the number on 10%.
  - 'The yes share of the first question differs by centre, from 34% to 74%, and moves inside a centre over the years: the
    pooled share follows the mix and the practice of the centres; no known cause.'

drug_use:
  description: 'Use of sedatives, heroin, crack or cocaine, opiates and other products in FACE SZ, at inclusion and at the
    yearly visits. One opening question (illicit drugs, or medicines taken without a prescription, more than ten times in
    your life), then for each product: more than ten times, the ways of use, the amounts and frequencies in the periods
    of heaviest use over the whole life and in the last 12 months, the age at the first use, the longest abstinence, the
    family history and a craving score.'
  reference: not_applicable
  construct: substance_use
  period: 'lifetime (periods of heaviest use) and the last 12 months; craving: the last week'
  sources:
  - schema notes (sz drug_use)
  - docs/sz/PROGRESS.md D17
  - scale_reference_aq_general.md section 3
  variables:
    illicit_drugs_over_ten_times:
      meaning: 'Opening question: illicit drugs, or medicines taken without a prescription, more than ten times in your
        life (1 yes, 0 no). The five sections are filled only after a yes; after a no the five ''more than ten times'' are
        delivered as 0.'
    '*_dose_*':
      meaning: 'Amount per day of use, in the periods of heaviest use over the whole life or in the last 12 months. The
        unit depends on the product: tablets or capsules (sedatives), grams (heroin, cocaine), standard units (other products).
        The opiates have no amount.'
      higher_means: more of the product per day of use
      polarity: worse
      basis: anchors
      source: 'labels ''...: amount per day of use ...'' with their units; schema notes (sz drug_use)'
    '*_frequency_12m':
      meaning: 'Frequency in the last 12 months: weekly (1 to 7 times a week) or less than weekly. ''Less than weekly''
        mostly means no use: the amount is 0 on 32 of 33 sedative answers, 27 of 33 heroin, 98 of 138 cocaine and 55 of
        67 other products.'
      polarity: not_applicable
    '*_route_*':
      meaning: One way of use (smoked, sniffed, injected, oral, sublingual), one yes/no per way; several can be ticked.
        The list has no 'sniffed' for the sedatives.
    '*_craving_score':
      meaning: Maximum craving for the product in the last week, from 0 (never) to 10 (all the time).
      higher_means: more craving
      polarity: worse
      basis: anchors
      source: 'labels ''...: maximum craving in the last week (0 never to 10 all the time)'' (sz drug_use)'
    '*_max_abstinence':
      meaning: 'Longest abstinence, in months: a question over the whole life. Shown only with two or more DSM-5 criteria.'
      higher_means: longer abstinence
      polarity: neutral
      basis: anchors
      source: 'labels ''...: longest abstinence'' (months, range 0 to 720); schema notes (sz drug_use)'
  flags:
  - 'Asked at inclusion and at the yearly visits, and used from 2015, not from 2012: the first question is answered on 9%
    of the inclusion visits of 2012, 18% of 2014, 47% of 2015 and 84% to 93% from 2016.'
  - 'The sections are small: 126 patient-visits with sedatives, 55 with heroin, 254 with cocaine, 73 with opiates and 186
    with another product.'
  - 'Not asked, not ''no'': the questions at the end of each section (age at the first use, longest abstinence, family history,
    craving) are shown only with two or more DSM-5 criteria, a count that is in another tab (the dsm5_ schemas of the auto_questionnaire
    tab). An empty cell there means ''not asked''; it is not encoded.'
  - 'One column per question for inclusion and follow-up. The questions about the whole life keep that meaning at follow-up
    on average only: 77 of the 212 later answers (36%) of the patients who said yes at inclusion are ''no'' (sedatives 53
    of 84).'
  - The opening question also hides the boxes of use disorder of four substances in substance_v0 and substance_fu.
  - 999 and 9999 mean 'does not know' in an amount or a duration, 99 in an age; they are missing codes.
  - 'Steps with no known cause: sedatives ''more than ten times'' is yes on 12% to 13% of the answers of 2014 and 2015 and
    2% to 4% from 2017 (one centre before 2017); cocaine smoked (crack) is ticked on 20% of the cocaine sections of 2014-19
    and 40% from 2023.'
  - 'Not in the extraction: the question that shows the details of the other product (R116: the amount is filled on 71 of
    186 visits); a drug treatment of the use disorder and a hospitalisation for withdrawal (R120).'
  - 'Who answers is not stated in the notes: the form words its questions to the patient (''more than ten times in your
    life'').'

tea_coffee:
  description: 'Tea and coffee in FACE SZ, at inclusion and at the yearly visits: cups per day and frequency, in the periods
    of heaviest use over the whole life and in the last 12 months.'
  reference: not_applicable
  construct: caffeine
  period: lifetime (periods of heaviest use) and the last 12 months
  sources:
  - schema notes (sz tea_coffee)
  - docs/sz/PROGRESS.md D17
  variables:
    '*_cups_*':
      meaning: 'Cups per day of use, in the periods of heaviest use over the whole life or in the last 12 months. There
        is no gate: a patient who does not drink tea or coffee answers 0 cups.'
      higher_means: more cups per day of use
      polarity: neutral
      basis: anchors
      source: 'labels ''...: cups per day of use ...'' (cups per day); schema notes (sz tea_coffee)'
    '*_times_per_week_12m':
      meaning: 'Times per week in the last 12 months, 1 to 7: the number only. The frequency category of the form (weekly,
        less than weekly) is not exported (R118).'
    '*_frequency_lifetime':
      meaning: 'Frequency in the periods of heaviest use: weekly or less than weekly. ''Less than weekly'' includes the
        non-consumers (813 of the 1,246 tea answers of that frequency have 0 cups): use the number of cups to tell a consumer
        from a non-consumer.'
      polarity: not_applicable
  flags:
  - 'Asked at inclusion and at the yearly visits, from 2015 and not from 2012: the tea questions are answered on 7% of the
    inclusion visits of 2012, 16% of 2014, 42% of 2015 and 71% to 79% of 2016 to 2018.'
  - '999 means ''does not know''. A few amounts are out of range (365 cups of coffee a day on 3 visits: a number per year).'
  - 'The cups differ by centre (median of tea over the whole life 1 cup in five centres and 0 in five others) and are stable
    by year: centre habit or practice, no known cause.'
  - Who answers is not stated in the notes.

episode_described:
  description: 'One episode described at the inclusion visit of FACE DR (the table ''Episodes'' of form 116): its number,
    its length, and whether it was treated, resistant, hospitalised, with psychotic or mixed features, seasonal, followed
    by a full remission, with a recurrence under treatment or a switch under an antidepressant, and the time since the previous
    episode. Not in BP or SZ.'
  reference: not_applicable
  respondent: clinician
  construct: illness_course
  sources:
  - schema notes (dr episode_described)
  - docs/dr/PROGRESS.md D12, D66
  - 'respondent: schema notes (dr episode_described): ''not left out by the raters'''
  variables:
    episode_number:
      meaning: 'Number typed on the row that the export kept (1 to 20). It is 1 on only 102 of 220 rows: the episode described
        is not the first episode.'
    episode_resistant:
      meaning: The episode is ticked resistant (1 yes, 0 no).
      construct: treatment_resistance
    episode_months:
      meaning: Length of the episode, in months.
      higher_means: longer episode
      polarity: neutral
      basis: anchors
      source: label 'Length of the episode' (months, range 0 to 600)
  flags:
  - 'Which episode a row describes is not stated: the table is headed ''Episodes'', not ''depressive'', and its questions
    are those of a depressive episode (low confidence; the name stays). No period is given.'
  - The form is a table with one row per episode. The export keeps one arbitrary row per visit, so the other episodes of
    the form are lost to this extraction (R142).
  - '221 inclusion visits: 45% of the inclusion visits of 2012 to 2017 and 27% of those of 2018 to 2026.'
  - 2 is 'DM', missing data (29 cells).
  - The number of the episode described is above the total of episodes counted in mood_history_v0 on 8 of 213 visits; delivered
    as written.

mood_course_fu:
  description: 'The mood episodes since the last visit, at the follow-up visits of FACE DR (the patient-state form, form
    183): the numbers of major depressive episodes, of those with psychotic features, of depressive episodes resistant to
    two treatments or more, of hypomanic episodes, of manic episodes with psychotic features, of mixed and of induced episodes,
    and the number of suicide attempts.'
  version: Follow-up form 183 of FACE DR. The counts that the DSM-IV follow-up form of FACE BP also asks carry BP's names
    (dsm4_fu_n_*).
  reference: not_applicable
  construct: illness_course
  period: since the last visit
  sources:
  - schema notes (dr mood_course_fu)
  - docs/dr/PROGRESS.md D12, D49, D66
  - facedata/common_instruments.yaml (mood_episodes_since_visit)
  variables:
    dsm4_fu_n_*:
      meaning: Number of episodes of that kind since the last visit, 0 to 20. The same question as in the DSM-IV follow-up
        form of FACE BP, read from other raw columns.
      higher_means: more episodes of that kind
      polarity: worse
      basis: anchors
      source: labels 'Number of ... episodes since the last visit' (range 0 to 20); schema notes (dr mood_course_fu)
    n_resistant_episodes_since_visit:
      meaning: Number of depressive episodes resistant to two treatments or more since the last visit. FACE DR only.
      construct: treatment_resistance
      higher_means: more resistant depressive episodes
      polarity: worse
      basis: anchors
      source: label 'Number of depressive episodes resistant to two treatments or more since the last visit'
    n_induced_since_visit:
      meaning: Number of induced episodes since the last visit. Shown only after a yes to induced_episode_since_visit and
        read as 0 after a no.
      higher_means: more induced episodes
      polarity: worse
      basis: anchors
      source: label 'Number of induced episodes since the last visit'; schema notes (dr mood_course_fu)
    manic_psychotic_since_visit:
      meaning: 'A manic episode with psychotic features since the last visit (yes/no). Not a gate and almost never filled
        (17 cells): the form shows it only when the hypomanic count is above 0, a defect. Use the count dsm4_fu_n_mania_psychotic;
        a blank here is not ''no''.'
    n_suicide_attempts_since_visit:
      meaning: Number of suicide attempts since the last visit (the ETAT_SUI_NB field of form 183). Not the attempt question
        of FACE BP (D49).
      construct: suicidal_behaviour
      higher_means: more suicide attempts since the last visit
      polarity: worse
      basis: anchors
      source: label 'Number of suicide attempts since the last visit' (range 0 to 99); schema notes (dr mood_course_fu)
  flags:
  - 'The window is not the same for every visit: the median gap to the previous visit is 190 days, and 744 days at the 4-year
    visit. The BP window is six months or a year: do not compare counts across windows (common_instruments.yaml).'
  - 'Two forms in the same raw columns: the inclusion visit asks the same counts over the whole life (mood_history_v0).
    The two are never delivered in one column.'
  - Unlike the BP follow-up form, the DR form has no question 'at least one episode since the last visit', no total number
    of episodes and no count of manic episodes.
  - A resistant count above the depressive count on 13 of 795 visits is delivered as typed and flagged check_failed.
  - 'Not in the extraction (R142): the mixed episodes with psychotic features, the complete and the incomplete remission
    between the episodes and the seasonal pattern since the last visit.'
  - Who fills the form is not stated in the notes.

mood_history_v0:
  description: 'The mood disorder over the whole life and the current episode, at the inclusion visit of FACE DR (forms
    117 and 116): the kind of disorder and its course (single episode or recurrent), the first episode (type, age, postpartum
    onset), the lifetime numbers of episodes of each kind and of resistant episodes, remission between the episodes, seasonal
    pattern, the age at the first psychotropic treatment, and for the current episode its specifier, severity, chronicity,
    postpartum onset and the weeks before a treatment was started.'
  version: 'Forms 117 and 116 of FACE DR: one form, with no DSM-5 version and no column for the version. The questions shared
    with the DSM-IV form of FACE BP carry BP''s dsm4_ names.'
  reference: 'DSM-IV (1994): two labels of form 116 say ''selon critère DSM IV'' (the mixed episodes and the severity of
    the current episode). The form is a form of the application, with no publication of its own.'
  reference_confidence: confirmed in source (Grunze et al. 2021)
  respondent: clinician
  construct: illness_course
  period: lifetime; the current episode at the inclusion visit
  sources:
  - schema notes (dr mood_history_v0)
  - docs/dr/PROGRESS.md D12, D66
  - facedata/shared_names.yaml
  - facedata/common_instruments.yaml (first_mood_episode, mood_episodes_lifetime, current_mood_episode)
  - scale_reference.md section 25
  - 'respondent: form 116 is filled by raters (schema notes, dr episode_described: ''not left out by the raters'')'
  variables:
    dsm4_lt_n_*:
      meaning: Lifetime number of episodes of that kind, 0 to 50 (0 to 20 in FACE BP). The counts include the current episode.
      higher_means: more episodes of that kind
      polarity: worse
      basis: anchors
      source: labels 'Number of ... episodes over the whole life' (range 0 to 50); schema notes (dr mood_history_v0)
    n_resistant_episodes_lifetime:
      meaning: Number of depressive episodes resistant to two treatments or more over the whole life (median 1). FACE DR
        only.
      construct: treatment_resistance
      higher_means: more resistant depressive episodes
      polarity: worse
      basis: anchors
      source: label 'Number of depressive episodes resistant to two treatments or more over the whole life'
    dsm4_first_episode_age:
      meaning: Age at the first mood episode, as declared (not corrected). Same raw column and same name as in the DSM-IV
        form of FACE BP.
      higher_means: older age
      polarity: neutral
      basis: anchors
      source: label 'Age at the first mood episode (the age declared)' (years); common_instruments.yaml (first_mood_episode)
    first_treated_episode_age:
      meaning: Age at the first episode treated or diagnosed. FACE DR only.
      higher_means: older age
      polarity: neutral
      basis: anchors
      source: label 'Age at the first episode treated or diagnosed' (years)
    dsm4_lt_first_treatment_age:
      meaning: Age at the first psychotropic treatment.
      higher_means: older age
      polarity: neutral
      basis: anchors
      source: label 'Age at the first psychotropic treatment' (years)
    treatment_delay_weeks:
      meaning: A delay in weeks, 0 to 52. The form says only 'Délai' (hint 'Max 52') and never says a delay of what; it
        equals the weeks before a treatment of the current episode on 52 of 130 rows.
    current_episode_untreated_weeks:
      meaning: Length of the current episode before a treatment was started, in weeks.
      higher_means: longer time before a treatment was started
      polarity: neutral
      basis: anchors
      source: label 'Length of the current episode before a treatment was started' (weeks, range 0 to 1040)
    dsm4_first_episode_type:
      meaning: Type of the first mood episode (seven types, as in the DSM-IV form of FACE BP). The values 8 and 9 of the
        extraction (resistant, not resistant; 21 visits of 2013 to 2017) are not types and are missing here.
      polarity: not_applicable
    dsm4_current_chronic:
      meaning: 'Current episode longer than two years (1 yes, 0 no): yes on 238 of 343 inclusion visits.'
  flags:
  - 'The page of form 116 is saved on only 360 of the 635 rows: an empty page means the page was not saved, not ''no episode''.'
  - 'Two forms in the same raw columns: the follow-up visits use them for the time since the last visit (mood_course_fu).
    The two are never delivered in one column.'
  - The lifetime counts go from 0 to 50 here and from 0 to 20 in FACE BP, whose form stops at 20 (shared_names.yaml).
  - 'The three numbers with psychotic features have no yes/no question here (BP asks one): they are read as 0 where the
    number of episodes of that kind is 0, and stay missing where it is above 0 and the cell is empty.'
  - The type of disorder of form 117 is major depressive disorder on every row. The course says recurrent for 509 and single
    episode for 123 of the 632 visits that answer it.
  - The current episode is severe on 234 of 342 inclusion visits.
  - 'The first psychotropic treatment comes before the declared first episode on 14 of 340 visits: a psychotropic can precede
    the first mood episode, so this is not an error by itself.'
  - The resistance of the first episode is in the application but not in the export (R142).

cannabis:
  description: 'One question of the nurse''s record of FACE DR (form 112): ''Consommez-vous du cannabis ?'' (do you use
    cannabis?), current use, 1 yes and 0 no. It opens the four DETC-CAGE items.'
  reference: not_applicable
  construct: cannabis
  period: current (question in the present tense)
  sources:
  - schema notes (dr cannabis)
  - docs/dr/PROGRESS.md D42, D43
  variables:
    cannabis_current:
      meaning: 'Uses cannabis now (1 yes, 0 no): current use, not use at any time of the life.'
      higher_means: current cannabis use
      polarity: worse
      basis: stated
      source: 'schema notes (dr cannabis): ''do you use cannabis?, 1 yes, 0 no: CURRENT use, in the present tense'''
  flags:
  - 'Current use, not lifetime: a 0 does not mean ''never used'' (yes on 24 of 582 answers).'
  - 'Not joinable with the other cohorts: SZ asks ''more than ten times in your life'' (cannabis_over_ten_times); BP and
    ASP deliver a cannabis use disorder (abuse or dependence). Do not stack them with this variable.'
  - Asked at inclusion, at 2 years and at 4 years; never at 6, 12, 18 or 30 months.
  - Answered on 43% to 45% of the inclusions of 2013 to 2015 and on 67% to 89% a year from 2016. An empty cell is 'not answered';
    one centre answers on 10% of its inclusions since 2016.
  - Recorded in the nurse's record; the notes do not say more on who answers.
