trouble_psychotique_fu:
  description: Whether the patient has a psychotic disorder, which one, the date of onset and whether symptoms were present
    in the past month, asked again at the follow-up visits of FACE BP (six-monthly and yearly) on the follow-up diagnostic
    form, one form whatever the DSM edition.
  reference: not_applicable
  respondent: clinician
  construct: psychiatric_comorbidity
  period: 'at the follow-up visit: an update given at that visit (question in the present tense); symptoms: past month'
  sources:
  - schema notes (bp trouble_psychotique_fu)
  - docs/bp/PROGRESS.md D53, D84, D176
  - 'respondent: the form asks about the patient in the third person (''Le patient a-t-il un trouble psychotique'')'
  variables:
    psychotic_disorder_fu:
      meaning: Answer to 'does the patient have a psychotic disorder' at a follow-up visit (1 yes, 0 no). The form does
        not say 'other than the mood disorder' and has no 'change since the last visit' question.
  flags:
  - A follow-up answer is an update given at that visit (D84); it is delivered apart from the inclusion answer (psychotic_*_v0).
    Of the 73 follow-up answers of patients with a psychotic disorder at inclusion, 70 are 'no'.
  - 'Rare: 34 yes in 9,389 answers (0.36%), from 30 patients, 18 of whom answered no at inclusion; of the 12 yes followed
    by another answer, 8 are followed by a no.'
  - 'Answered on 81% of the follow-up visits: 87% to 92% by period until 2018, 81% in 2019-2021 and 66% to 68% from 2022.
    The missing answers are missing forms. Never asked at screening.'
  - The placeholder date 1000-01-01 (422 cells, 396 of them on visits of 2025 and 2026) is flagged date_placeholder. 22
    real dates of onset, 9 of them before the inclusion.

trouble_psychotique_v0:
  description: Whether the patient has a psychotic disorder, which one of nine, the date of onset and whether symptoms were
