    adhd_symptoms_v0:
      meaning: 'FACE SZ only. Symptoms of an attention deficit hyperactivity disorder in childhood (before age 12). Not
        part of the anxiety tree and not asked of every patient: 1,638 of the 2,353 inclusion visits hold it (7% of those
        of 2012, 79% to 96% from 2016).'
      construct: adhd_symptoms
  flags:
  - 'Inclusion and yearly answers are delivered apart (_v0 and _fu), because the same question asked again gives another
    answer: in FACE BP 48% yes at inclusion and 35% at the yearly visits, and 40% of the patients answered yes at inclusion
    have a first later answer ''no''.'
  - The boxes are read as 0 after a no to the first question (the form did not ask) and stay missing where the first answer
    is unknown or empty. The past-month answers and the ages stay missing after a no.
  - 'FACE BP: the whole comorbidity tab is often left empty. Its four first questions (anxiety, substances, eating disorders,
    somatoform disorders) are all empty on 17% of the inclusion visits (453 of the 1,127 inclusions of 2022 to 2024) and
    on 43% of the yearly visits, and four centres stop holding the tab. An empty first answer is missing, not ''no''.'
  - 'FACE BP: the type of the panic disorder (with or without agoraphobia) is not known: the export''s two type columns
    hold the social phobia and are not delivered (R113).'
