  scores:
    panic_disorder_fu:
      meaning: 'Panic disorder at a yearly visit (1 yes, 0 no), FACE BP only: the box written by the export, set to missing
        where the agoraphobia box is ticked and no detail of the panic disorder is filled (156 yearly visits, flag score_not_recomputed),
