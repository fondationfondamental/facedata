  scores:
    ssp_tactile:
      meaning: "Tactile sensitivity: sum of the items 1 to 7 (7 to 35)."
      higher_means: fewer or less frequent atypical behaviours in this section
      polarity: better
      basis: stated
      source: "schema notes (asp short_sensory_profile): 'A low score is a frequent behaviour'"
    ssp_taste_smell:
      meaning: "Taste and smell sensitivity: sum of the items 8 to 11 (4 to 20)."
      higher_means: fewer or less frequent atypical behaviours in this section
      polarity: better
      basis: stated
      source: "schema notes (asp short_sensory_profile): 'A low score is a frequent behaviour'"
    ssp_movement:
      meaning: "Movement sensitivity: sum of the items 12 to 14 (3 to 15)."
      higher_means: fewer or less frequent atypical behaviours in this section
      polarity: better
      basis: stated
      source: "schema notes (asp short_sensory_profile): 'A low score is a frequent behaviour'"
    ssp_seeks_sensation:
      meaning: "Underresponsive, seeks sensation: sum of the items 15 to 21 (7 to 35)."
      higher_means: fewer or less frequent atypical behaviours in this section
      polarity: better
      basis: stated
      source: "schema notes (asp short_sensory_profile): 'A low score is a frequent behaviour'"
    ssp_auditory_filtering:
      meaning: "Auditory filtering: sum of the items 22 to 27 (6 to 30)."
      higher_means: fewer or less frequent atypical behaviours in this section
      polarity: better
      basis: stated
      source: "schema notes (asp short_sensory_profile): 'A low score is a frequent behaviour'"
    ssp_low_energy:
      meaning: "Low energy, weak: sum of the items 28 to 33 (6 to 30)."
      higher_means: fewer or less frequent atypical behaviours in this section
      polarity: better
      basis: stated
      source: "schema notes (asp short_sensory_profile): 'A low score is a frequent behaviour'"
    ssp_visual_auditory:
      meaning: "Visual and auditory sensitivity: sum of the items 34 to 38 (5 to 25)."
      higher_means: fewer or less frequent atypical behaviours in this section
      polarity: better
      basis: stated
      source: "schema notes (asp short_sensory_profile): 'A low score is a frequent behaviour'"
    ssp_total:
      meaning: "Total: sum of the seven sections, 38 to 190. Not stored, computed by the package."
      higher_means: more typical sensory processing
      polarity: better
      basis: stated
      source: "schema label (asp short_sensory_profile): 'Short Sensory Profile total (38 to 190, lower is more atypical)'"
      cutoffs:
        - {value: "155 to 190", meaning: "typical performance", source: "Keshavarz 2025, in scale_reference_aq_autism.md section 15", confidence: "confirmed in source (extracted, secondary: Keshavarz 2025, which labels the instrument SSP-2; the manual's table was not read)"}
        - {value: "142 to 154", meaning: "probable difference", source: "Keshavarz 2025, in scale_reference_aq_autism.md section 15", confidence: "confirmed in source (extracted, secondary: Keshavarz 2025, which labels the instrument SSP-2; the manual's table was not read)"}
        - {value: "38 to 141", meaning: "definite difference", source: "Keshavarz 2025, in scale_reference_aq_autism.md section 15", confidence: "confirmed in source (extracted, secondary: Keshavarz 2025, which labels the instrument SSP-2; the manual's table was not read)"}
  variables:
    ssp_completed_by:
      meaning: "Who filled the questionnaires of the child block: father, mother or another person."
      polarity: not_applicable
  flags:
    - "Higher is better here, the opposite of most scales of this group: a low score is a frequent behaviour."
    - "No cut-off of the profile is applied by the package. The bands above come from a secondary source and from child norms (3 to 17 years); the section cut-offs were not read."
    - "239 visits are visits of patients aged 18 or more (2011 to 2023): outside the published child norms; they are delivered as recorded."
    - "In youth with autism the seven-factor structure did not fit, and the authors advise against the total and most section scores in that population (Williams 2018, confirmed in source, extracted)."
    - "On 22 visits, all dated 2013, the stored auditory filtering score differs from the sum of its items; the delivered score is the sum."
    - "The total dips in 2018 to 2020 in children and in adults, with no known cause."

srs_adult:
  description: "The adult self-report form of the Social Responsiveness Scale, filled by adults at the screening visit: sixty-five items answered from 1 to 4 and a total raw score."
  version: "Adult self-report form (form 345), 65 items"
  reference: "Constantino JN, Davis SA, Todd RD, et al. Validation of a brief quantitative measure of autistic traits. J Autism Dev Disord 2003;33:427-433 (PMID 12959421); manuals: Constantino JN, Gruber CP. SRS manual (2005) and SRS-2 manual (2012), Western Psychological Services"
  reference_confidence: "original confirmed in source (abstract), reference tool verified; manuals to verify (years recalled, manuals not read)"
  respondent: patient
  construct: autism_symptoms
  sources: ["schema notes (asp srs_adult)", "scale_reference_aq_autism.md section 3"]
  scores:
    srsa_total:
      meaning: "Total raw score: each answer counted from 0 to 3, fifteen items reversed; 0 to 195."
      higher_means: more difficulty in social responsiveness (more autistic traits)
      polarity: worse
      basis: stated
      source: "schema notes (asp srs_adult): the items that are not reversed are worded as problems; scale_reference_aq_autism.md section 3: the SRS is a measure of autistic traits that correlates about 0.7 with ADI-R algorithm scores (confirmed in source, abstract)"
  flags:
    - "Identified as the adult self-report form, 'likely'. The key has fifteen reversed items, not the seventeen of the forms filled by a relative: this form words the items 52 and 55 as problems, and the answers agree. No page read gives the reversed items of the adult forms (to verify)."
    - "The wording of the answers 1 to 4 is given in the schema notes for the forms filled by a relative only."
    - "No T-score is delivered and no cut-off is written: the severity bands are read from the T-score of the manual, which was not read."
    - "Filled at the screening visit. The forms filled by a relative are srs_relative_child and srs_relative_adult."

srs_relative_adult:
  description: "The adult form of the Social Responsiveness Scale filled by a relative about a patient of 18 or over: sixty-five items answered from 1 (not true) to 4 (almost always true), five sub-scale scores, a social communication and interaction score and a total raw score."
  version: "Adult form filled by a relative, 65 items"
  reference: "Constantino JN, Davis SA, Todd RD, et al. Validation of a brief quantitative measure of autistic traits. J Autism Dev Disord 2003;33:427-433 (PMID 12959421); manuals: Constantino JN, Gruber CP. SRS manual (2005) and SRS-2 manual (2012), Western Psychological Services"
  reference_confidence: "original confirmed in source (abstract), reference tool verified; manuals to verify (years recalled, manuals not read)"
  respondent: relative
  construct: autism_symptoms
  sources: ["schema notes (asp srs_relative_adult)", "scale_reference_aq_autism.md section 3", "docs/asp/PROGRESS.md D14 and D64"]
  items:
    meaning: "Answers as recorded: 1 not true, 2 sometimes true, 3 often true, 4 almost always true (9, does not apply, is read as missing). Seventeen items are worded the other way and are reversed in the scores."
    higher_means: the statement is more often true
    polarity: neutral
    basis: anchors
    source: "schema notes (asp srs_relative_adult): answers of the thesaurus, 1 not true to 4 almost always true"
  scores:
    srsr_awareness:
      meaning: "Social awareness: 8 items, each counted from 0 to 3 after reversal; 0 to 24."
      higher_means: more difficulty in social awareness
      polarity: worse
      basis: stated
      source: "schema notes (asp srs_relative_adult): published key, answers 0 to 3 with the positively worded items reversed; scale_reference_aq_autism.md section 3 (measure of autistic traits, confirmed in source, abstract)"
    srsr_cognition:
      meaning: "Social cognition: 12 items, each counted from 0 to 3 after reversal; 0 to 36."
      higher_means: more difficulty in social cognition
      polarity: worse
      basis: stated
      source: "schema notes (asp srs_relative_adult): published key, answers 0 to 3 with the positively worded items reversed; scale_reference_aq_autism.md section 3 (measure of autistic traits, confirmed in source, abstract)"
    srsr_communication:
      meaning: "Social communication: 22 items, each counted from 0 to 3 after reversal; 0 to 66."
      construct: communication_language
      higher_means: more difficulty in social communication
      polarity: worse
      basis: stated
      source: "schema notes (asp srs_relative_adult): published key, answers 0 to 3 with the positively worded items reversed; scale_reference_aq_autism.md section 3 (measure of autistic traits, confirmed in source, abstract)"
    srsr_motivation:
      meaning: "Social motivation: 11 items, each counted from 0 to 3 after reversal; 0 to 33."
      higher_means: more difficulty in social motivation
      polarity: worse
      basis: stated
      source: "schema notes (asp srs_relative_adult): published key, answers 0 to 3 with the positively worded items reversed; scale_reference_aq_autism.md section 3 (measure of autistic traits, confirmed in source, abstract)"
    srsr_restricted_repetitive:
      meaning: "Restricted interests and repetitive behaviour: 12 items, none reversed, each counted from 0 to 3; 0 to 36."
      construct: repetitive_behaviours
      higher_means: more restricted interests and repetitive behaviour
      polarity: worse
      basis: stated
      source: "schema notes (asp srs_relative_adult): published key, answers 0 to 3; scale_reference_aq_autism.md section 3 (measure of autistic traits, confirmed in source, abstract)"
    srsr_sci:
      meaning: "Social communication and interaction: the 53 items of the four social sub-scales; 0 to 159."
      higher_means: more difficulty in social communication and interaction
      polarity: worse
      basis: stated
      source: "schema notes (asp srs_relative_adult): published key, answers 0 to 3 with the positively worded items reversed; scale_reference_aq_autism.md section 3 (measure of autistic traits, confirmed in source, abstract)"
    srsr_total:
      meaning: "Total raw score: the 65 items, each counted from 0 to 3, seventeen reversed; 0 to 195."
      higher_means: more difficulty in social responsiveness (more autistic traits)
      polarity: worse
      basis: stated
      source: "schema notes (asp srs_relative_adult): published key, answers 0 to 3 with the positively worded items reversed; scale_reference_aq_autism.md section 3: the SRS correlates about 0.7 with ADI-R algorithm scores (confirmed in source, abstract)"
  variables:
    srsr_filled_by:
      meaning: "Who filled the form: father, mother or another person."
      polarity: not_applicable
  flags:
    - "A higher sub-scale score is more difficulty: a high social awareness, cognition, communication or motivation score is not more of the ability."
    - "The stored raw scores are wrong on every visit (the export sums the answers 1 to 4 and reverses no item; 20 to 114 points too high). The delivered scores are recomputed with the published key and differ from the stored ones."
    - "The stored T-scores are not delivered (they were read from the wrong raw scores). No cut-off is written: a T-score can be read in the manual from the delivered raw score, the sex and the form."
    - "Two forms share the columns and no column says which was filled: the age at the visit tells it (18 and over here; under 18 is srs_relative_child). The norms of the two forms differ. The application uses the age at the date of the form: the two rules differ on 7 follow-up visits."
    - "The list of seventeen reversed items is attested for the school-age form only (a forum thread, extracted); for the adult form it is 'to verify', though the answers of this form single out the same seventeen items."
    - "A German research version for adults reported a raw total of 67 as a cut-off for ASD (Bolte 2012, confirmed in source, direct); it is not established for this form."
    - "No French adult form was found in the literature check."

