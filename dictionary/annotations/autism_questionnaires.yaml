      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 16: 14 sub-scales of three items scored 0-4, higher means greater sensitivity (confirmed in source, extracted, secondary: Jakob 2025)"
    "gsq_hypo_*":
      meaning: "Hypo-sensitivity in one sense (tactile, visual, auditory, olfactory, gustatory, proprioceptive or vestibular): sum of three items, 0 to 12."
      higher_means: more frequent hypo-sensitivity in that sense
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 16: 14 sub-scales of three items scored 0-4, higher means greater sensitivity (confirmed in source, extracted, secondary: Jakob 2025)"
    gsq_tactile:
      meaning: "Tactile: hyper- plus hypo-sensitivity, sum of six items, 0 to 24."
      higher_means: more frequent tactile hyper- and hypo-sensitivity
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 16 (confirmed in source, extracted); the six-item scores are the sums of the two three-item parts"
    gsq_visual:
      meaning: "Visual: hyper- plus hypo-sensitivity, sum of six items, 0 to 24."
      higher_means: more frequent visual hyper- and hypo-sensitivity
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 16 (confirmed in source, extracted); the six-item scores are the sums of the two three-item parts"
    gsq_auditory:
      meaning: "Auditory: hyper- plus hypo-sensitivity, sum of six items, 0 to 24."
      higher_means: more frequent auditory hyper- and hypo-sensitivity
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 16 (confirmed in source, extracted); the six-item scores are the sums of the two three-item parts"
    gsq_olfactory:
      meaning: "Olfactory: hyper- plus hypo-sensitivity, sum of six items, 0 to 24."
      higher_means: more frequent olfactory hyper- and hypo-sensitivity
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 16 (confirmed in source, extracted); the six-item scores are the sums of the two three-item parts"
    gsq_gustatory:
      meaning: "Gustatory: hyper- plus hypo-sensitivity, sum of six items, 0 to 24."
      higher_means: more frequent gustatory hyper- and hypo-sensitivity
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 16 (confirmed in source, extracted); the six-item scores are the sums of the two three-item parts"
    gsq_proprioceptive:
      meaning: "Proprioceptive: hyper- plus hypo-sensitivity, sum of its two parts (items 3, 5, 29, 37, 38 and 41), 0 to 24. Corrected: the stored score counts the item 40 for the item 41."
      higher_means: more frequent proprioceptive hyper- and hypo-sensitivity
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 16 (confirmed in source, extracted); the six-item scores are the sums of the two three-item parts"
    gsq_vestibular:
      meaning: "Vestibular: hyper- plus hypo-sensitivity, sum of six items, 0 to 24."
      higher_means: more frequent vestibular hyper- and hypo-sensitivity
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 16 (confirmed in source, extracted); the six-item scores are the sums of the two three-item parts"
  flags:
    - "gsq_proprioceptive is corrected: the script of the form puts the item 40 (a gustatory item) in the place of the item 41. The delivered score differs from the stored one on 381 of the 440 complete visits. Where it was typed without items (155 visits) it is kept as stored."
    - "Identified as the GSQ, 'likely'. The item numbers of each sub-score are those of the script of the form; on the published side they are 'to verify', and the published use of the six-item scores is 'to verify'."
    - "Scores typed without their items (about 156 visits) are kept as stored; their median total equals that of the computed ones."
    - "No cut-off in the sources read (to verify)."
    - "A French version is published (Sapey-Triomphe and others, 2018, confirmed in source, abstract); the schema does not say which French text the form uses."
    - "One centre reads lower (median total 63 against 74 to 81 elsewhere), with no known cause."

raads_r:
  description: "The Ritvo Autism Asperger Diagnostic Scale-Revised, filled by adults at the screening visit: eighty items answered from 0 to 3, four sub-scale scores and a total. It replaces the Autism-Spectrum Quotient of the old set of forms."
  version: "80 items; French form of unknown origin (no French validation found)"
  reference: "Ritvo RA, Ritvo ER, Guthrie D, et al. The RAADS-R. J Autism Dev Disord 2011;41:1076-1089 (PMC3134766)"
  reference_confidence: "confirmed in source (direct)"
  respondent: patient
  construct: autism_symptoms
  sources: ["schema notes (asp raads_r)", "scale_reference_aq_autism.md section 4"]
  scores:
    raads_social:
      meaning: "Social relatedness: sum of 39 items answered from 0 to 3, fourteen of them reversed."
      higher_means: more autism-related traits in social relatedness
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 4: domain threshold 31, total 44 to 227 in the ASD group and 0 to 65 in the comparison group (confirmed in source, direct)"
      cutoffs:
        - {value: "31", meaning: "domain threshold of the original study", source: "Ritvo 2011, in scale_reference_aq_autism.md section 4", confidence: "confirmed in source (direct)"}
    raads_interests:
      meaning: "Circumscribed interests: sum of 14 items."
      construct: repetitive_behaviours
      higher_means: more circumscribed interests
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 4: domain threshold 15 (confirmed in source, direct)"
      cutoffs:
        - {value: "15", meaning: "domain threshold of the original study", source: "Ritvo 2011, in scale_reference_aq_autism.md section 4", confidence: "confirmed in source (direct)"}
    raads_language:
      meaning: "Language: sum of 7 items, one of them reversed."
      construct: communication_language
      higher_means: more autism-related traits in language
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 4: domain threshold 4 (confirmed in source, direct)"
      cutoffs:
        - {value: "4", meaning: "domain threshold of the original study", source: "Ritvo 2011, in scale_reference_aq_autism.md section 4", confidence: "confirmed in source (direct)"}
    raads_sensory_motor:
      meaning: "Sensory motor: sum of 20 items, two of them reversed."
      construct: sensory_processing
      higher_means: more sensory and motor traits
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 4: domain threshold 16 (confirmed in source, direct)"
      cutoffs:
        - {value: "16", meaning: "domain threshold of the original study", source: "Ritvo 2011, in scale_reference_aq_autism.md section 4", confidence: "confirmed in source (direct)"}
    raads_total:
      meaning: "Total: sum of the four sub-scales, which share the eighty items; 0 to 240. Computed by the package (the stored total is almost never filled)."
      higher_means: more autism-related traits
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 4: best threshold 65; totals 44 to 227 in the ASD group and 0 to 65 in the comparison group (confirmed in source, direct)"
      cutoffs:
        - {value: "65", meaning: "best threshold between adults with ASD and comparisons in the original study (sensitivity 97%, specificity 100%)", source: "Ritvo 2011, in scale_reference_aq_autism.md section 4", confidence: "confirmed in source (direct)"}
  flags:
    - "The reversed items (seventeen), the item counts per sub-scale and the 0 to 3 coding are those of the key that reproduces the stored scores (319 of 320 visits); they could not be compared with a page read (to verify), and the wording of the answers is not in the schema."
    - "Other samples report other total thresholds (Swedish: 72; Italian: 92 and 104)."
    - "Sub-scales typed without the items (159 visits) are kept as stored; the total is then their sum. The typed totals read slightly lower (median 146 against 153.5)."
    - "Filled at the screening visit only."

short_sensory_profile:
  description: "The Short Sensory Profile of Dunn: thirty-eight items answered from 1 to 5 by a parent or another caregiver on how often the child shows sensory behaviours, seven section scores and a total. Filled for children, and for adults on 239 visits."
  version: "Short Sensory Profile of 1999, 38 items answered from 1 to 5"
  reference: "McIntosh DN, Miller LJ, Shyu V, Dunn W. Short Sensory Profile (1999; in Dunn W, Sensory Profile manual)"
