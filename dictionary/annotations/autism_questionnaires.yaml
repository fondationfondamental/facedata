staic:
  description: "The State-Trait Anxiety Inventory for Children, filled by children: two blocks of twenty items answered from 1 to 3, one on how the child feels right now (state) and one on how the child feels in general (trait), with a total for each. The adults fill the STAI."
  version: "Two blocks of 20 items (state: items 1 to 20; trait: items 21 to 40)"
  reference: "Spielberger CD, Edwards CD, Lushene RE, Montuori J, Platzek D. State-Trait Anxiety Inventory for Children manual, Consulting Psychologists Press, 1973"
  reference_confidence: "to verify (recalled; manual not read)"
  respondent: patient
  construct: anxiety
  period: "state: right now; trait: in general"
  sources: ["schema notes (asp staic)", "scale_reference_aq_autism.md section 26", "docs/asp/PROGRESS.md D62"]
  scores:
    staic_trait:
      meaning: "Trait anxiety: sum of the items 21 to 40, none reversed; 20 to 60."
    staic_state:
      meaning: "State anxiety: sum of the items 1 to 20 with the ten negative adjectives (items 2, 4, 5, 7, 9, 11, 15, 16, 18 and 19) reversed; 20 to 60. Computed from the items; the stored total follows a wrong rule of the form."
  flags:
    - "No document gives the wording of the answers 1 to 3 or says what a higher total means, and nothing of the published STAIC was read (to verify): no direction is written here."
    - "The state items are almost never recorded: 18 visits hold them, against 253 for the trait items. On 150 visits the state total, like the trait total, was typed without any item and is kept as stored; the rule applied by hand is not known."
    - "The form computes the state total wrongly (it reverses the ten positive adjectives instead of the ten negative ones). The delivered state total reverses the negative items, following the wording of the form; which items the published STAIC reverses was not found."
    - "The trait totals typed without items read higher than the computed ones (median 41 against 36), which raises the median of the recent years as the typed share grows."
    - "One stored trait total is above 60 and is flagged out of range."

abc:
  description: "The Aberrant Behavior Checklist of the old set of forms: fifty-eight items answered from 0 to 3 and five sub-scale scores. Filled for children and adults, almost all between 2013 and 2018."
  version: "58 items, five sub-scales"
  reference: "Aman MG, Singh NN, Stewart AW, Field CJ. The aberrant behavior checklist: a behavior rating scale for the assessment of treatment effects. Am J Ment Defic 1985;89:485-491"
  reference_confidence: "references confirmed in a Europe PMC record (no abstract); reference tool unchecked (HTTP 429)"
  construct: behaviour_problems
  sources: ["schema notes (asp abc)", "scale_reference_aq_autism.md section 8", "docs/asp/PROGRESS.md D3 and D9"]
  scores:
    abc_irritability:
      meaning: "Irritability: sum of 15 items answered from 0 to 3 (0 to 45)."
    abc_lethargy:
      meaning: "Lethargy and social withdrawal: sum of 16 items (0 to 48)."
    abc_stereotypy:
      meaning: "Stereotypy: sum of 7 items (0 to 21)."
      construct: repetitive_behaviours
    abc_hyperactivity:
      meaning: "Hyperactivity: sum of 16 items (0 to 48)."
      construct: adhd_symptoms
    abc_inappropriate_speech:
      meaning: "Inappropriate speech: sum of 4 items (0 to 12)."
  flags:
    - "No document read states what a higher score means. The literature notes give the answers as 0 'not a problem' to 3 'problem severe in degree', tagged 'to verify' (the manual was not read): no direction is written here."
    - "Who answers is not written in the schema; the literature notes say a caregiver or a teacher, about recent weeks (to verify)."
    - "The form stopped being asked (old set of forms): a blank on a recent visit is a form not asked, not a missing answer."
    - "A sub-score is delivered only where all its items are answered. On 36 visits an item is blank and the scores are stored (the form counted a blank as 0): they are not delivered."
    - "No total is stored or delivered. The item counts per sub-scale and the 0 to 3 coding were not confirmed by the literature check."
    - "The centres differ by the age of their patients, which explains the differences between centres."

aim:
  description: "The 40-item Affect Intensity Measure of the old forms: items answered from 1 (never) to 6 (always) and a mean score. A pilot: 4 inclusion visits of 2013."
  version: "AIM-40"
  reference: "Larsen RJ. Theory and measurement of affect intensity as an individual difference characteristic. Dissertation Abstracts International 1984;85:2297B; Larsen RJ, Diener E. J Res Pers 1987;21:1-39"
  reference_confidence: "to verify (from memory)"
  respondent: patient
  construct: emotional_reactivity
  sources: ["schema notes and labels (asp aim)", "scale_reference_aq_general.md section 19"]
  items:
    meaning: "Items as asked, from 1 (never) to 6 (always). Eleven items are reversed in the score."
    higher_means: the item is true more often
    polarity: neutral
    basis: anchors
    source: "schema labels (asp aim): 'AIM-40 item N (1 never to 6 always)'"
  scores:
    aim40_score:
      meaning: "Affect intensity: mean of the 40 items (1 to 6), eleven of them reversed."
      higher_means: greater affect intensity
      polarity: neutral
      basis: literature
      source: "scale_reference_aq_general.md section 19: 1 never to 6 always, higher = greater affect intensity (Confirmed, direct: Yang 2026)"
    aim40_score20:
      meaning: "Mean of the 20 items that the AIM-20 also has, six of them reversed: a bridge to the 20-item form of the other cohorts."
      higher_means: greater affect intensity
      polarity: neutral
      basis: literature
      source: "scale_reference_aq_general.md section 19: 1 never to 6 always, higher = greater affect intensity (Confirmed, direct: Yang 2026)"
  flags:
    - "A pilot of 4 visits (2013): too few to study the form."
    - "The reversed items come from the key of the export; the published list of reversed items is 'to verify'. The script of the application reverses the item 36 where the key has the item 37; the stored score follows the key."
    - "aim40_score20 has no stored value to be checked against (the cohort has no AIM-20 visit). The published 20-item form is 'to verify'."

als:
  description: "The 54-item Affective Lability Scale of the old forms: items answered from 0 (not at all characteristic) to 3 (very characteristic), six sub-scores and a total, all means. A pilot: 4 inclusion visits of 2013."
  version: "ALS-54"
  reference: "Harvey PD, Greenberg BR, Serper MR. The affective lability scales. J Clin Psychol 1989;45:786-793"
  reference_confidence: "to verify (from memory)"
  respondent: patient
  construct: affective_lability
  sources: ["schema notes and labels (asp als)", "scale_reference_aq_general.md section 20"]
  items:
    meaning: "Items as asked, from 0 (not at all characteristic) to 3 (very characteristic). No item is reversed."
    higher_means: the statement is more characteristic of the person
    polarity: worse
    basis: anchors
    source: "schema labels (asp als): 'ALS-54 item N (0 not at all characteristic to 3 very characteristic)'"
  scores:
    als54_depression:
      meaning: "Depression sub-score: mean of 11 items (0 to 3)."
      higher_means: more affective lability (statements rated more characteristic)
      polarity: worse
      basis: anchors
      source: "schema labels and notes (asp als): items 0 not at all characteristic to 3 very characteristic, no item reversed"
    als54_elation:
      meaning: "Elation sub-score: mean of 12 items (0 to 3)."
      higher_means: more affective lability (statements rated more characteristic)
      polarity: worse
      basis: anchors
      source: "schema labels and notes (asp als): items 0 not at all characteristic to 3 very characteristic, no item reversed"
    als54_anxiety_depression:
      meaning: "Anxiety-depression sub-score: mean of 8 items (0 to 3)."
      higher_means: more affective lability (statements rated more characteristic)
      polarity: worse
      basis: anchors
      source: "schema labels and notes (asp als): items 0 not at all characteristic to 3 very characteristic, no item reversed"
    als54_anxiety:
      meaning: "Anxiety sub-score: mean of 7 items (0 to 3)."
      higher_means: more affective lability (statements rated more characteristic)
      polarity: worse
      basis: anchors
      source: "schema labels and notes (asp als): items 0 not at all characteristic to 3 very characteristic, no item reversed"
    als54_anger:
      meaning: "Anger sub-score: mean of 7 items (0 to 3)."
      higher_means: more affective lability (statements rated more characteristic)
      polarity: worse
      basis: anchors
      source: "schema labels and notes (asp als): items 0 not at all characteristic to 3 very characteristic, no item reversed"
    als54_bipolar:
      meaning: "Bipolar sub-score: mean of 9 items (0 to 3)."
      higher_means: more affective lability (statements rated more characteristic)
      polarity: worse
      basis: anchors
      source: "schema labels and notes (asp als): items 0 not at all characteristic to 3 very characteristic, no item reversed"
    als54_total:
      meaning: "Total: mean of the 54 items (0 to 3)."
      higher_means: more affective lability (statements rated more characteristic)
      polarity: worse
      basis: anchors
      source: "schema labels and notes (asp als): items 0 not at all characteristic to 3 very characteristic, no item reversed"
    als54_anxiety_depression18:
      meaning: "Anxiety-depression score of the ALS-18: mean of the 5 items that both forms have (0 to 3). A bridge to the 18-item form of the other cohorts."
      higher_means: more affective lability (statements rated more characteristic)
      polarity: worse
      basis: anchors
      source: "schema labels and notes (asp als): items 0 not at all characteristic to 3 very characteristic, no item reversed"
    als54_depression_elation18:
      meaning: "Depression-elation score of the ALS-18: mean of the 8 items that both forms have (0 to 3)."
      higher_means: more affective lability (statements rated more characteristic)
      polarity: worse
      basis: anchors
      source: "schema labels and notes (asp als): items 0 not at all characteristic to 3 very characteristic, no item reversed"
    als54_anger18:
      meaning: "Anger score of the ALS-18: mean of the 5 items that both forms have (0 to 3)."
      higher_means: more affective lability (statements rated more characteristic)
      polarity: worse
      basis: anchors
      source: "schema labels and notes (asp als): items 0 not at all characteristic to 3 very characteristic, no item reversed"
    als54_total18:
      meaning: "Mean of the 18 items that the ALS-18 also has (0 to 3)."
      higher_means: more affective lability (statements rated more characteristic)
      polarity: worse
      basis: anchors
      source: "schema labels and notes (asp als): items 0 not at all characteristic to 3 very characteristic, no item reversed"
  flags:
    - "A pilot of 4 visits (2013): too few to study the form."
    - "The direction is read from the answer labels of the schema; no source read states it for the published scale, whose answer labels and sub-scale names are 'to verify'."
    - "The delivered depression sub-score is the application's, with 11 items; the stored one of the export averages 10 items (the item 1 is left out), a known error of the export."
    - "The four ALS-18 scores have no stored value to be checked against (the cohort has no ALS-18 visit); the item numbers of the ALS-18 factors are 'to verify' on the published side."

anhedonia:
  description: "A social anhedonia scale of the old forms: forty items answered false (0) or true (1) and a stored score. A pilot: 4 inclusion visits of 2013."
  version: "40 true or false items (named from the thesaurus: social anhedonia scale, score 'SAS')"
  construct: anhedonia
  sources: ["schema notes and labels (asp anhedonia)"]
  items:
    higher_means: "the answer is 'true' (0 false, 1 true)"
    polarity: neutral
    basis: anchors
    source: "schema labels (asp anhedonia): 'Social anhedonia scale, item N (0 false, 1 true)'"
  variables:
    anh_score:
      meaning: "Score of the scale as stored (0 to 40). It is not the plain sum of the items: the scale is scored with a key by item that the schema does not hold."
  flags:
    - "Too few visits to verify: the columns are read with their types and ranges and the score is delivered as stored."
    - "No document states what a higher score means, who answers or which publication the scale is (the literature check did not cover it): no direction and no reference are written."

aq:
  description: "The Autism-Spectrum Quotient of the old set of forms, filled by adults at the screening visit: fifty items answered from 1 (definitely agree) to 4 (definitely disagree) and a score from 0 to 50. The RAADS-R replaces it in the new set."
  version: "50 items"
  reference: "Baron-Cohen S, Wheelwright S, Skinner R, Martin J, Clubley E. The AQ. J Autism Dev Disord 2001;31:5-17 (PMID 11439754)"
  reference_confidence: "confirmed in source (abstract); reference tool verified"
  respondent: patient
  construct: autism_symptoms
  sources: ["schema notes and labels (asp aq)", "scale_reference_aq_autism.md section 5", "docs/asp/PROGRESS.md D9"]
  items:
    meaning: "Answers as stored, 1 definitely agree to 4 definitely disagree. The side that scores depends on the item: agreement on 24 items, disagreement on 26."
    higher_means: more disagreement with the statement
    polarity: neutral
    basis: anchors
    source: "schema labels (asp aq): 'item N (1 definitely agree to 4 definitely disagree)'"
  scores:
    aq_total:
      meaning: "AQ score: one point for each item answered on the scored side, definitely or slightly; 0 to 50."
      higher_means: more autistic traits
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 5: endorsing the autistic trait, mildly or strongly, scores 1 (confirmed in source, direct, Ruzich 2015)"
      cutoffs:
        - {value: "32 or more", meaning: "80% of adults with Asperger syndrome or high-functioning autism scored 32 or more, against 2% of controls", source: "Baron-Cohen 2001, in scale_reference_aq_autism.md section 5", confidence: "confirmed in source (abstract)"}
        - {value: "26", meaning: "cut-off in a clinical sample (sensitivity .95, specificity .52)", source: "Ruzich 2015, in scale_reference_aq_autism.md section 5", confidence: "confirmed in source (direct, secondary: Ruzich 2015); the underlying study to verify"}
  flags:
    - "The key was fitted on the data (it gives the stored score on 223 of 224 visits). The scoring principle is the published one; which items score on agreement was not read, so the key is not confirmed item by item."
    - "Not the AQ-12 of the bipolar cohort, a 12-item aggression questionnaire: the variable aq12 here is the item 12 of the Autism-Spectrum Quotient."
    - "On 21 visits an item is blank and a score is stored: it is not delivered. On 4 visits the score was typed without the items and is kept as stored."
    - "Old set of forms: a visit after the change of set did not ask it (not asked, not missing)."
    - "French studies concern adolescents and students; an adult clinical French validation was not found."

asq:
  description: "An Attachment Style Questionnaire of the old forms: forty items answered from 1 (totally disagree) to 6 (totally agree). A pilot: 3 inclusion visits of 2013. No score."
  version: "40 items answered from 1 to 6"
  construct: attachment
  sources: ["schema notes and labels (asp asq)", "scale_reference_aq_autism.md section 6"]
  items:
    higher_means: more agreement with the statement
    polarity: neutral
    basis: anchors
    source: "schema labels (asp asq): 'item N (1 totally disagree to 6 totally agree)'"
  flags:
    - "Too few visits to verify: the columns are read with their types and ranges and no rule is checked. No score is stored or built."
    - "Not an autism questionnaire. Which Attachment Style Questionnaire it is was not settled: forty items on a six-point scale fit the one of Feeney, Noller and Hanrahan (1994), as recalled, not read (to verify); another questionnaire of the same name has four dimensions. No reference is written."
    - "Who answers, the scales and the reversed items are not documented."

atac:
  description: "The A-TAC inventory (autism, tics, ADHD and other comorbidities) of the old forms: 96 items answered 0 (no), 1 (to some degree) or 2 (yes) about the patient, modules by letter with further items, and module scores as stored. The person interviewed is a parent or another relative. A pilot: 5 inclusion visits of 2013."
  version: "96 items and modules A to S (named from the column names and the thesaurus)"
  reference: "Hansson SL, Svanstrom Rojvall A, Rastam M, Gillberg C, Gillberg C, Anckarsater H. Br J Psychiatry 2005;187:262-267 (PMID 16135864)"
  reference_confidence: "confirmed in source (abstract)"
  respondent: relative
  construct: neurodevelopmental_screening
  sources: ["schema notes and labels (asp atac)", "scale_reference_aq_autism.md section 7"]
  items:
    meaning: "Answers 0 no, 1 to some degree, 2 yes (schema labels). What a yes means for each item is not documented."
  variables:
    "atac_score_*":
      meaning: "Score of one module as stored: the 'symptom' score when the name ends in 1, the 'problem load' score when it ends in 2. No rule is checked."
    atacper:
      meaning: "Person interviewed: mother, father, guardian, relative or other."
      polarity: not_applicable
  flags:
    - "Too few visits to verify: the scores are delivered as stored and no rule is checked. No document states how the 'symptom' and 'problem load' scores are computed or what a higher value means."
    - "The published coding of the answers (0, 0.5, 1) is 'to verify' and differs from the 0 to 2 of the form; the published cut-offs were not read."
    - "In each module one item holds a number in the extraction, not a 0 to 2 answer (for example ataca7): its meaning is not documented."
    - "63 questions hang on a gate of the form that is not written in the schema: a blank cannot be told from a question not asked."

bis_old_form:
  description: "The 34-item Barratt Impulsiveness Scale (BIS-10) of the old forms: items answered from 1 (rarely or never) to 4 (almost always), three sub-scores and a total. A pilot: 4 inclusion visits of 2013."
  version: "BIS-10, 34 items"
  reference: "Baylé FJ, Bourdel MC, Caci H, Gorwood P, Chignon JM, Adès J, Lôo H. Factor analysis of the French translation of the BIS-10. Can J Psychiatry 2000;45:156-165 (PMID 10742875)"
  reference_confidence: "Confirmed (abstract; paywalled); the original BIS-10 (Barratt 1985) is to verify"
  respondent: patient
  construct: impulsivity
  sources: ["schema notes and labels (asp bis_old_form)", "scale_reference_aq_general.md section 1"]
  items:
    meaning: "Items as asked, from 1 (rarely or never) to 4 (almost always). Eleven items (1, 7, 8, 9, 10, 12, 13, 15, 21, 33 and 34) are reversed in the scores."
    higher_means: the behaviour is more frequent
    polarity: neutral
    basis: anchors
    source: "schema labels (asp bis_old_form): 'BIS-10 item N (1 rarely or never to 4 almost always)'"
  scores:
    bis10_motor:
      meaning: "Motor impulsivity: sum of 11 items, one reversed (11 to 44)."
      higher_means: more motor impulsivity
      polarity: worse
      basis: anchors
      source: "schema labels and notes (asp bis_old_form): items 1 rarely or never to 4 almost always, the items worded the other way reversed (5 - value)"
    bis10_attention:
      meaning: "Attentional impulsivity: sum of 8 items, two reversed (8 to 32)."
      higher_means: more attentional impulsivity
      polarity: worse
      basis: anchors
      source: "schema labels and notes (asp bis_old_form): items 1 rarely or never to 4 almost always, the items worded the other way reversed (5 - value)"
    bis10_planning:
      meaning: "Planning difficulty: sum of 11 items, eight reversed (11 to 44)."
      higher_means: more planning difficulty
      polarity: worse
      basis: anchors
      source: "schema labels and notes (asp bis_old_form): items 1 rarely or never to 4 almost always, the items worded the other way reversed (5 - value)"
    bis10_total:
      meaning: "Total: motor plus attention plus planning, 30 of the 34 items (30 to 120)."
      higher_means: more impulsivity
      polarity: worse
      basis: anchors
      source: "schema labels and notes (asp bis_old_form): items 1 rarely or never to 4 almost always, the items worded the other way reversed (5 - value)"
    bis10_sum12:
      meaning: "Sum of the 12 items that the BIS-12 form also has, five of them reversed: a bridge to the form of the other cohorts."
      higher_means: more impulsivity
      polarity: worse
      basis: anchors
      source: "schema labels and notes (asp bis_old_form): items 1 rarely or never to 4 almost always, the items worded the other way reversed (5 - value)"
  flags:
    - "A pilot of 4 visits (2013): too few to study the form."
    - "The direction is read from the answer labels and from the reversal that the application applies. On the published side 'higher = more impulsive' is confirmed for the BIS-11 only; the item keys, the reversed items and the coding of the BIS-10 are 'to verify'."
    - "The reversed items are scored 5 minus the answer. The export also stores sums made with 6 minus the answer, higher by one point per reversed item; they are not delivered."
    - "The column that the thesaurus calls the score of the scale is another quantity (a mean of two scores of the export) and is not delivered. The items 19, 26, 27 and 29 belong to no sub-score."
    - "'BIS-12' is not a published version name (literature notes)."

cca:
  description: "The Communication Checklist - Adult of the old set of forms: seventy items answered from 0 to 3 on how often a behaviour happens, and three composites (language structure, pragmatic skills, social engagement). Visits of adults, 2009 to 2020."
  version: "CC-A, 70 items"
  reference: "Whitehouse AJO, Bishop DVM. Communication Checklist - Adult (CC-A), Psychological Corporation, 2009"
  reference_confidence: "to verify (manual not read; year recalled)"
  construct: communication_language
  sources: ["schema notes (asp cca)", "scale_reference_aq_autism.md section 10", "docs/asp/PROGRESS.md D9 and D68"]
  items:
    meaning: "How often the behaviour happens: 0 less than once a week or never, 1 about once a week, 2 once or twice a day, 3 several times a day or continually. Some of the last twenty items are reversed in the composites."
    higher_means: the behaviour is more frequent
    polarity: neutral
    basis: anchors
    source: "schema notes (asp cca): answers 0 less than once a week or never to 3 several times a day or continually"
  scores:
    cca_language_structure:
      meaning: "Language structure composite: sum of 21 items, 3 of them reversed (0 to 63)."
    cca_pragmatic_skills:
      meaning: "Pragmatic skills composite: sum of 22 items, none reversed (0 to 66)."
    cca_social_engagement:
      meaning: "Social engagement composite: sum of 27 items, 17 of them reversed (0 to 81)."
  flags:
    - "No document states what a higher composite means (whether it counts difficulties or abilities): no direction is written. The manual was not read."
    - "Who answers was not settled: the items of the form are worded in the first person, which reads as a self-report, while an earlier note and the literature notes say a relative or an informant (to verify)."
    - "Two forms share the seventy item columns (this checklist and the CCC-2 of children). The form of a visit is read from what only one form has; 2 visits whose form cannot be told are not delivered."
    - "A composite stored with a missing item is not recomputed and not delivered."
    - "The pragmatic skills composite differs between two centres among adults (median 20 against 13): a habit of the centre."

ccc2:
  description: "The Children's Communication Checklist, second edition, of the old set of forms: seventy items answered from 0 to 3 by a parent on how often the child shows a behaviour, ten scale scores (raw, scaled and percentile) and two composites."
  version: "CCC-2, 70 items, ten scales of seven items"
  reference: "Bishop DVM. CCC-2 manual, Psychological Corporation, 2003"
  reference_confidence: "revision confirmed in source (abstract, Norbury 2004); manual not read"
  respondent: relative
  construct: communication_language
  sources: ["schema notes (asp ccc2)", "scale_reference_aq_autism.md section 9", "docs/asp/PROGRESS.md D9 and D68"]
  items:
    meaning: "How often the child shows the behaviour: 0 less than once a week or never, 1 about once a week, 2 once or twice a day, 3 several times a day or continually. In each scale two of the last twenty items are reversed."
    higher_means: the behaviour is more frequent
    polarity: neutral
    basis: anchors
    source: "schema notes (asp ccc2): answers 0 less than once a week or never to 3 several times a day or continually"
  scores:
    ccc_speech:
      meaning: "Speech, raw score: sum of 7 items, two of them reversed (0 to 21)."
    ccc_syntax:
      meaning: "Syntax, raw score: sum of 7 items, two of them reversed (0 to 21)."
    ccc_semantics:
      meaning: "Semantics, raw score: sum of 7 items, two of them reversed (0 to 21)."
    ccc_coherence:
      meaning: "Coherence, raw score: sum of 7 items, two of them reversed (0 to 21)."
    ccc_inappropriate_initiation:
      meaning: "Inappropriate initiation, raw score: sum of 7 items, two of them reversed (0 to 21)."
    ccc_stereotyped_language:
      meaning: "Stereotyped language, raw score: sum of 7 items, two of them reversed (0 to 21)."
    ccc_use_of_context:
      meaning: "Use of context, raw score: sum of 7 items, two of them reversed (0 to 21)."
    ccc_nonverbal_communication:
      meaning: "Nonverbal communication, raw score: sum of 7 items, two of them reversed (0 to 21)."
    ccc_social_relations:
      meaning: "Social relations, raw score: sum of 7 items, two of them reversed (0 to 21)."
    ccc_interests:
      meaning: "Interests, raw score: sum of 7 items, two of them reversed (0 to 21)."
    ccc_sidc:
      meaning: "Social Interaction Deviance Composite, computed from the stored scaled scores: those of inappropriate initiation, nonverbal communication, social relations and interests minus those of speech, syntax, semantics and coherence. A negative value means that the first four scales add up to lower scaled scores than the other four."
  variables:
    "ccc_*_scaled":
      meaning: "Scaled score of the scale, as stored: computed by the application from the raw score and the age in months with a formula, not read in a norm table."
    "ccc_*_percentile":
      meaning: "Percentile, as stored: computed by the application from the raw score and the age in months with a formula."
    ccc_gcc:
      meaning: "General Communication Composite, as stored: the sum of the first eight scaled scores (0 to 160)."
  flags:
    - "No document states what a higher raw score, scaled score or percentile means (whether it counts difficulties or abilities): no direction is written. The manual was not read."
    - "ccc_sidc: the published formula, its sign and its cut-off were not settled (secondary summaries disagree on the direction of the subtraction). It is computed here because the application could not store a negative value: 63 of the 106 values are negative."
    - "A cut-off of 55 on the General Communication Composite is used in some studies, seen in a search snippet only (to verify)."
    - "The scores are stored on 106 visits, all of children, from 2013 to 2016. 17 more visits (patients aged 17 to 24 given the children's form) hold items and no stored score: their raw scores are computed here, with no scaled score."
    - "Two forms share the seventy item columns (this checklist and the CC-A of adults). The form of a visit is read from what only one form has; 2 visits whose form cannot be told are not delivered."
    - "Almost all the visits come from one centre."

communication_context:
  description: "Twelve questions asked before the communication checklists of the old forms. The adult form (CC-A) asks the age at the end of the studies, the work, the language at home and whether a speech therapist was seen; the children's form (CCC-2) asks about hearing, speaking in sentences, the language at home, the relation of the respondent to the child and the time in contact. No score."
  reference: not_applicable
  construct: communication_language
  sources: ["schema notes and labels (asp communication_context)", "scale_reference_aq_autism.md section 10"]
  variables:
    arretud:
      meaning: "CC-A: age at the end of the studies, in years."
      polarity: neutral
    temps:
      meaning: "CCC-2: time the respondent has been in contact with the child, in months (the form wants at least 3 months)."
      polarity: neutral
  flags:
    - "Not a scale: these are context questions and carry no score."
    - "Each question is asked by one form only, except the language at home (lang, autlang), asked in both. The questions asked by one form give the form of a visit that has checklist items and no score."
    - "Six of the twelve variables are free text."

cshq:
  description: "The Children's Sleep Habits Questionnaire of the old set of forms: a parent answers forty-eight items from 1 to 3 about the sleep of the child in the last week, says for 44 of them whether it is a problem, and gives four usual times and quantities of sleep. Eight sub-scale scores and a total of 33 items."
  version: "48 items in the form, 33 of them scored"
  reference: "Owens JA, Spirito A, McGuinn M. The CSHQ. Sleep 2000;23:1043-1051 (PMID 11145319)"
  reference_confidence: "confirmed in source (abstract); reference tool verified"
  respondent: relative
  construct: sleep_quality
  period: "last week, or a more typical week when the last one was unusual"
  sources: ["schema notes and labels (asp cshq)", "scale_reference_aq_autism.md section 30"]
  items:
    meaning: "Items 1 to 44: 1 rarely (0 or 1 time a week), 2 sometimes (2 to 4 times), 3 usually (5 to 7 times). Items 45 to 48: 1 not asleep, 2 very tired, 3 asleep. Items are delivered as asked; six are reversed in the scores (1, 2, 3, 15, 16 and 34)."
    higher_means: the behaviour is more frequent
    polarity: neutral
    basis: anchors
    source: "schema labels (asp cshq): '1 rarely to 3 usually, last week'"
  scores:
    cshq_bedtime_resistance:
      meaning: "Bedtime resistance: sum of 6 items, two reversed (6 to 18)."
      higher_means: more sleep disturbance of this kind
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 30: higher scores mean more sleep disturbance, reverse scoring where needed (confirmed in source, extracted)"
    cshq_sleep_onset_delay:
      meaning: "Sleep onset delay: one item, reversed (1 to 3)."
      higher_means: more sleep disturbance of this kind
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 30: higher scores mean more sleep disturbance, reverse scoring where needed (confirmed in source, extracted)"
    cshq_sleep_duration:
      meaning: "Sleep duration: sum of 3 items, two reversed (3 to 9)."
      higher_means: more sleep disturbance of this kind
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 30: higher scores mean more sleep disturbance, reverse scoring where needed (confirmed in source, extracted)"
    cshq_sleep_anxiety:
      meaning: "Sleep anxiety: sum of 4 items (4 to 12)."
      higher_means: more sleep disturbance of this kind
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 30: higher scores mean more sleep disturbance, reverse scoring where needed (confirmed in source, extracted)"
    cshq_night_wakings:
      meaning: "Night wakings: sum of 3 items (3 to 9)."
      higher_means: more sleep disturbance of this kind
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 30: higher scores mean more sleep disturbance, reverse scoring where needed (confirmed in source, extracted)"
    cshq_parasomnias:
      meaning: "Parasomnias: sum of 7 items (7 to 21)."
      higher_means: more sleep disturbance of this kind
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 30: higher scores mean more sleep disturbance, reverse scoring where needed (confirmed in source, extracted)"
    cshq_disordered_breathing:
      meaning: "Sleep disordered breathing: sum of 3 items (3 to 9)."
      higher_means: more sleep disturbance of this kind
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 30: higher scores mean more sleep disturbance, reverse scoring where needed (confirmed in source, extracted)"
    cshq_daytime_sleepiness:
      meaning: "Daytime sleepiness: sum of 8 items, one reversed (8 to 24)."
      construct: sleepiness
      higher_means: more daytime sleepiness
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 30: higher scores mean more sleep disturbance, reverse scoring where needed (confirmed in source, extracted)"
    cshq_total:
      meaning: "Total: sum of the 33 scored items, each counted once, six reversed (33 to 99)."
      higher_means: more sleep disturbance
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 30: higher scores mean more sleep disturbance (confirmed in source, extracted)"
      cutoffs:
        - {value: "above 41", meaning: "screening cut-off (not diagnostic of a specific sleep disorder)", source: "Taskin 2026, in scale_reference_aq_autism.md section 30", confidence: "confirmed in source (extracted, Taskin 2026)"}
  variables:
    "cshq_problem*":
      meaning: "Whether the parent says the item is a problem: 0 no, 1 yes (9, not applicable, is read as missing)."
      higher_means: the parent sees the behaviour as a problem
      polarity: worse
      basis: anchors
      source: "schema labels (asp cshq): 'is item N a problem (0 no, 1 yes; 9 not applicable is missing)'"
    cshq_sleep_hours:
      meaning: "Usual hours of sleep of the child, night and naps."
      polarity: neutral
    cshq_minutes_awake:
      meaning: "Minutes that a usual waking in the night lasts."
      higher_means: longer wakings in the night
      polarity: worse
      basis: anchors
      source: "schema label (asp cshq): 'minutes that a usual waking in the night lasts'"
    cshq_bedtime:
      meaning: "Usual bedtime of the child. A value of 00:00:00 may be a box left untouched (13 visits): it cannot be told from midnight and is kept."
      polarity: not_applicable
    cshq_waking_time:
      meaning: "Usual waking time in the morning. A value of 00:00:00 is a box left untouched and is read as not recorded."
      polarity: not_applicable
  flags:
    - "The sub-scales and the total are those the script of the form computes; the reversed items by number (1, 2, 3, 15, 16 and 34) are 'to verify' on the published side."
    - "The items 7 and 12 belong to two sub-scales (bedtime resistance and sleep anxiety): the total counts them once, so it is not the sum of the eight sub-scores. Fifteen items of the form are in no score."
    - "The visits come from one centre, children, 2013 to 2016 (one visit each of 2017 and 2021)."
    - "No French version was found in the literature check (to verify)."

empathy_quotient:
  description: "The Empathy Quotient of the old set of forms, filled by adults: sixty items answered from 1 (definitely agree) to 4 (definitely disagree), of which forty are scored, and a score from 0 to 80."
  version: "60 items (40 scored, 20 fillers)"
  reference: "Baron-Cohen S, Wheelwright S. The empathy quotient. J Autism Dev Disord 2004;34:163-175 (PMID 15162935)"
  reference_confidence: "confirmed in source (abstract); reference tool verified"
  respondent: patient
  construct: empathy
  sources: ["schema notes and labels (asp empathy_quotient)", "scale_reference_aq_autism.md section 11", "docs/asp/PROGRESS.md D9"]
  items:
    meaning: "Answers as stored, 1 definitely agree to 4 definitely disagree. Agreement scores on 21 items, disagreement on 19, and 20 items are not scored."
    higher_means: more disagreement with the statement
    polarity: neutral
    basis: anchors
    source: "schema labels (asp empathy_quotient): 'item N (1 definitely agree to 4 definitely disagree)'"
  scores:
    empathy_quotient_total:
      meaning: "EQ score: on each of the 40 scored items, 2 points for a definite answer on the scored side and 1 for a slight one; 0 to 80."
      higher_means: more empathy
      polarity: better
      basis: literature
      source: "scale_reference_aq_autism.md section 11: an empathic response scores 1 or 2 by its strength, other responses 0 (confirmed in source, extracted, Robinson 2025); total 0-80 (confirmed in source, abstract)"
      cutoffs:
        - {value: "30 or below", meaning: "81% of adults with Asperger syndrome or high-functioning autism scored 30 or fewer, against 12% of controls", source: "Baron-Cohen and Wheelwright 2004, in scale_reference_aq_autism.md section 11", confidence: "confirmed in source (abstract)"}
  flags:
    - "Higher is better here (more empathy): a low score is the autism-related side."
    - "The key was fitted on the data (it gives the stored score on 345 of 347 visits). The structure is the published one; which items score on agreement and which are fillers was not read, so the key is not confirmed item by item."
    - "Item 57: the French form words it as the opposite of empathy and the form scores agreement as empathic; its points correlate negatively with the rest of the score (a translation effect). The key is kept."
    - "The score was typed without the items on 91 visits, where it is kept as stored. On 31 visits an item is blank and a score is stored: it is not delivered."
    - "Two centres differ on the score (median 22 against 28): a habit of the centre."
    - "Old set of forms: a visit after the change of set did not ask it (not asked, not missing)."

repetitive_behaviours:
  description: "The section 'cognition and repetitive acts' of the old forms: for each kind of sensation that comes before repetitive behaviours (several 'just right' feelings, inner tension, a feeling of incompleteness, unpleasant physical sensations, physical anxiety, a plain need to do the behaviour) it records whether it is present, its frequency and its severity, then the main repetitive behaviour with its frequency, severity and age of onset. No score."
  construct: repetitive_behaviours
  sources: ["schema notes and labels (asp repetitive_behaviours)", "scale_reference_aq_autism.md section 13"]
  items:
    meaning: "Presence 0 no, 1 yes; frequency 0 never to 4 always; severity 0 none to 4 extreme. A frequency or a severity is filled only where the sensation is present."
    higher_means: the sensation is present, more frequent or more severe
    polarity: worse
    basis: anchors
    source: "schema labels (asp repetitive_behaviours): 'present (0 no, 1 yes)', 'frequency (0 never to 4)', 'severity (0 none to 4 extreme)'"
  variables:
    rep3symn:
      meaning: "Physical anxiety: number of symptoms."
      higher_means: more symptoms of physical anxiety
      polarity: worse
      basis: anchors
      source: "schema label (asp repetitive_behaviours): 'physical anxiety, number of symptoms'"
    rep3syma:
      meaning: "Physical anxiety: most severe symptom at present, a number typed in a text box (0 to 13); the form does not say whether it numbers the 13 boxes."
      polarity: not_applicable
    compage:
      meaning: "Main repetitive behaviour: age of onset, in years."
      polarity: neutral
  flags:
    - "Not a repetitive behaviour scale (the RBS-R is rbs_r) and not tied to a published instrument: the structure resembles a sensory phenomena scale used in research on obsessive-compulsive disorder (resemblance only, no page read). No reference is written and no total should be built."
    - "Who answers is not documented."
    - "Five of the ten yes or no boxes hold only 'no' from the end of 2018, where they were 'yes' on 17% to 51% of the visits of 2013 to 2016: a step with no known cause (the visits from 2019 come almost all from one centre)."
    - "Old set of forms: a visit after the change of set did not ask it (not asked, not missing)."

adhd_history:
  description: "The section on attention deficit hyperactivity disorder ('THADA') of the old forms: twenty-one questions answered 1 never, 2 in the past, 3 in the last week, then the achievement at primary school, the age of the first signs, and whether help, a diagnosis and a medication were given. No score."
  construct: adhd_symptoms
  period: "lifetime and the last week (answers 1 never, 2 in the past, 3 in the last week)"
  sources: ["schema notes and labels (asp adhd_history)", "scale_reference_aq_autism.md section 29"]
  items:
    meaning: "The twenty-one questions thad1 to thad21: 1 never, 2 in the past, 3 in the last week. The other questions carry their own answers in their labels."
    higher_means: "the behaviour is present, and more recently (questions thad1 to thad21)"
    polarity: worse
    basis: anchors
    source: "schema labels (asp adhd_history): 'item N (1 never, 2 in the past, 3 in the last week)'"
  variables:
    ecprim:
      meaning: "Achievement at primary school: 1 poor, 2 reasonable, 3 average, 4 good."
      higher_means: better achievement at primary school
      polarity: better
      basis: anchors
      source: "schema label (asp adhd_history): '1 poor, 2 reasonable, 3 average, 4 good'"
    ageprec:
      meaning: "Age of the first signs, in years."
      polarity: neutral
    attaide:
      meaning: "Sought help for attention problems (0 no, 1 yes)."
      polarity: not_applicable
    attdiag:
      meaning: "A diagnosis of attention disorder was raised (0 no, 1 yes)."
      polarity: not_applicable
    attdiaga:
      meaning: "Age at the diagnosis of an attention disorder, in years."
      polarity: neutral
    attmed:
      meaning: "Took medication for attention problems (0 no, 1 yes)."
      polarity: not_applicable
  flags:
    - "Not tied to a published instrument (literature notes: unidentified); no reference is written. No score is stored: do not build a total or an ADHD classification from the twenty-one questions."
    - "The answers 1 to 3 order recency (never, past, last week), not severity."
    - "Who answers is not documented. Filled for children and adults; the centres differ by the age of their patients."
    - "Old set of forms: a visit after the change of set did not ask it (not asked, not missing)."

dcdq:
  description: "The Developmental Coordination Disorder Questionnaire of the old set of forms: fifteen items answered from 1 (not at all like the other children) to 5 (extremely like the other children) and a total. Mostly filled by a parent about the child."
  version: "15 items; a child form filled by a parent (form 224) and an adult retrospective form (form 223) in the same columns"
  reference: "Wilson BN, Crawford SG, Green D, et al. Psychometric properties of the revised DCDQ. Phys Occup Ther Pediatr 2009;29:182-202 (PMID 19401931)"
  reference_confidence: "confirmed in source (abstract)"
  respondent: relative
  construct: motor_coordination
  sources: ["schema notes (asp dcdq)", "scale_reference_aq_autism.md section 22", "docs/asp/PROGRESS.md D74"]
  items:
    meaning: "Answers from 1 (not at all like the other children) to 5 (extremely like the other children)."
    higher_means: better coordination
    polarity: better
    basis: stated
    source: "schema notes (asp dcdq): 'the higher, the better the coordination'"
  scores:
    dcdq_total:
      meaning: "Total: sum of the fifteen items, 15 to 75."
      higher_means: better coordination
      polarity: better
      basis: stated
      source: "schema notes (asp dcdq): answers 1 (not at all like the other children) to 5 (extremely like the other children), 'the higher, the better the coordination'"
  variables:
    dcdq_filled_by:
      meaning: "Respondent of the child form (father, mother, grandparents or guardian). Empty on the adult retrospective form."
      polarity: not_applicable
  flags:
    - "Higher is better here (better coordination)."
    - "Identified as the DCDQ (Wilson and others, 2007), 'likely'. The published cut-offs are given by age group and their values were not read: none is written."
    - "Two forms share the columns: the child form (a parent reports on the child, 50 visits) and an adult retrospective form (the patient reports on the years before 10, 6 visits). The export carries no form number; an empty dcdq_filled_by means the adult form."
    - "The published questionnaire is meant for children from 5 to 15 years; 15 of the 56 visits are of patients aged 16 or more."
    - "The median total is 36 in 2013 and 56.5 in 2014, in the same centre, at the same age and with the same respondents: a step with no known cause."
    - "The three published sub-scales are not delivered (their item lists were not found)."

hama:
  description: "The Hamilton Anxiety Rating Scale of the old set of forms: fourteen items rated from 0 to 4 and a total. Filled for children and adults."
  version: "14 items"
  reference: "Hamilton M. The assessment of anxiety states by rating. Br J Med Psychol 1959;32:50-55 (PMID 13638508)"
  reference_confidence: "reference confirmed (Europe PMC record; reference tool verified); abstract not read"
  respondent: clinician
  construct: anxiety
  sources: ["schema notes (asp hama)", "scale_reference_aq_autism.md section 31"]
  scores:
    hama_total:
      meaning: "Total: sum of the fourteen items, 0 to 56."
  flags:
    - "No page read states what a higher total means: no direction is written. The literature notes give severity bands 'as commonly cited' (mild below 17, 18 to 24 mild to moderate, 25 to 30 moderate to severe), tagged 'to verify'."
    - "Respondent: the schema says the items are 'rated' and does not say by whom; the literature notes say a clinician (to verify)."
    - "The form has no age limit: 119 of the 359 visits are of patients under 18. The median total is 1.5 among children and 10.5 among adults."
    - "Among adults the median total swings by year inside one centre (5 in 2019, 20 in 2020), with no known cause."

hamd:
  description: "The Hamilton Depression Rating Scale, 17 items, of the old set of forms: items rated from 0 to 2 or from 0 to 4 and a total. Filled for children and adults."
  version: "17 items (HAM-D17)"
  reference: "Hamilton M. A rating scale for depression. J Neurol Neurosurg Psychiatry 1960;23:56-62 (PMID 14399272)"
  reference_confidence: "reference confirmed (Europe PMC record; reference tool verified); full text not read"
  respondent: clinician
  construct: depression
  sources: ["schema notes (asp hamd)", "scale_reference_aq_autism.md section 32"]
  items:
    meaning: "Three answers (0 to 2) for the items 4, 5, 6, 12, 13, 14, 16 and 17 and five (0 to 4) for the others. The item 16 (weight loss) has two columns, by history and measured: one of the two is filled."
    higher_means: more severe symptom
    polarity: worse
    basis: literature
    source: "scale_reference_aq_autism.md section 32: the total is the plain sum of the items and its bands run from no depression to severe (confirmed in source, abstract, Zimmerman 2013)"
  scores:
    hamd_total:
      meaning: "Total of the 17 items, 0 to 52; the item 16 counts the column that is filled."
      higher_means: more severe depression
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 32: severity bands (confirmed in source, abstract, Zimmerman 2013)"
      cutoffs:
        - {value: "0 to 7", meaning: "no depression", source: "Zimmerman 2013, in scale_reference_aq_autism.md section 32", confidence: "confirmed in source (abstract, Zimmerman 2013)"}
        - {value: "8 to 16", meaning: "mild depression", source: "Zimmerman 2013, in scale_reference_aq_autism.md section 32", confidence: "confirmed in source (abstract, Zimmerman 2013)"}
        - {value: "17 to 23", meaning: "moderate depression", source: "Zimmerman 2013, in scale_reference_aq_autism.md section 32", confidence: "confirmed in source (abstract, Zimmerman 2013)"}
        - {value: "24 or more", meaning: "severe depression", source: "Zimmerman 2013, in scale_reference_aq_autism.md section 32", confidence: "confirmed in source (abstract, Zimmerman 2013)"}
  flags:
    - "Respondent: the schema does not say who rates; it speaks of 'the rater'. Clinician is written from that and from the name of the scale."
    - "The bands come from adult outpatients. The form has no age limit: 117 of the 351 visits are of patients under 18 (median total 1 among children, 7 among adults)."
    - "The item maxima (0 to 2 or 0 to 4) are those of the form; on the published side they are 'to verify'."
    - "The items 18 to 21 of the form are not part of the total and are not in the extraction."
    - "On 5 visits an item is blank and a total is stored: it is not delivered."
    - "Among adults the median total swings by year inside one centre (3.5 in 2019, 12 in 2020), like the HAM-A, with no known cause."

lsas:
  description: "The Liebowitz Social Anxiety Scale of the old set of forms: twenty-four situations, each rated from 0 to 3 for anxiety and for avoidance, with six sub-scores and a total. Filled for children and adults."
  version: "24 situations; the sub-scores follow the form: twelve situations of performance and twelve of social interaction, as in the French validation (Yao and others, 1999)"
  reference: "Liebowitz MR. Social phobia. Mod Probl Pharmacopsychiatry 1987;22:141-173"
  reference_confidence: "to verify (not looked up); French version, Yao 1999: confirmed in source (abstract)"
  construct: social_anxiety
  sources: ["schema notes (asp lsas)", "scale_reference_aq_autism.md section 33"]
  items:
    meaning: "Each situation has two ratings from 0 to 3: anxiety and avoidance."
    higher_means: more anxiety in the situation, or more avoidance of it
    polarity: worse
    basis: literature
    source: "scale_reference_aq_autism.md section 33: the total is the plain sum of the ratings, with cut-offs 30 and 60 for social anxiety disorder (confirmed in source, abstract, Rytwinski 2009)"
  scores:
    lsas_anxiety_total:
      meaning: "Anxiety over the 24 situations (0 to 72)."
      higher_means: more social anxiety
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 33: plain sum of the ratings; cut-offs of the total for social anxiety disorder (confirmed in source, abstract, Rytwinski 2009)"
    lsas_avoidance_total:
      meaning: "Avoidance over the 24 situations (0 to 72)."
      higher_means: more avoidance of social situations
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 33: plain sum of the ratings; cut-offs of the total for social anxiety disorder (confirmed in source, abstract, Rytwinski 2009)"
    lsas_social_anxiety:
      meaning: "Anxiety in the 12 situations of social interaction (0 to 36)."
      higher_means: more anxiety in social interaction
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 33: plain sum of the ratings; cut-offs of the total for social anxiety disorder (confirmed in source, abstract, Rytwinski 2009)"
    lsas_social_avoidance:
      meaning: "Avoidance of the 12 situations of social interaction (0 to 36)."
      higher_means: more avoidance of social interaction
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 33: plain sum of the ratings; cut-offs of the total for social anxiety disorder (confirmed in source, abstract, Rytwinski 2009)"
    lsas_performance_anxiety:
      meaning: "Anxiety in the 12 situations of performance (0 to 36)."
      higher_means: more anxiety in performance situations
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 33: plain sum of the ratings; cut-offs of the total for social anxiety disorder (confirmed in source, abstract, Rytwinski 2009)"
    lsas_performance_avoidance:
      meaning: "Avoidance of the 12 situations of performance (0 to 36)."
      higher_means: more avoidance of performance situations
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 33: plain sum of the ratings; cut-offs of the total for social anxiety disorder (confirmed in source, abstract, Rytwinski 2009)"
    lsas_total:
      meaning: "Total: anxiety plus avoidance over the 24 situations, 0 to 144. Not stored, computed by the package."
      higher_means: more social anxiety and avoidance
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 33: cut-offs 30 and 60 (confirmed in source, abstract, Rytwinski 2009)"
      cutoffs:
        - {value: "30", meaning: "social anxiety disorder (self-report version, ROC)", source: "Rytwinski 2009, in scale_reference_aq_autism.md section 33", confidence: "confirmed in source (abstract, Rytwinski 2009)"}
        - {value: "60", meaning: "generalized subtype of social anxiety disorder (self-report version, ROC)", source: "Rytwinski 2009, in scale_reference_aq_autism.md section 33", confidence: "confirmed in source (abstract, Rytwinski 2009)"}
  flags:
    - "Who rates is not written in the schema. The published scale is clinician-administered and a self-report version exists; the cut-offs above come from the self-report version."
    - "Sub-scores: twelve situations of performance and twelve of social interaction, as the form prints them. Some literature counts thirteen and eleven (the situation 21 in performance); no source read states that split."
    - "The form has no age limit: 112 of the 263 visits are of patients under 18. The centres differ by the age of their patients (median total 51 where most are children, 78 and 81 elsewhere)."
    - "The answer range 0 to 3 and the total range are 'to verify' on the published side (no page read states them)."

mcdd:
  description: "The criteria of Multiple Complex Developmental Disorder of the old set of forms: a box 'no to all the criteria' and fifteen criteria answered yes or no in three groups (regulation of affect and anxiety, social behaviour, thought disorder). No score."
  version: "15 criteria of the form 199"
  reference: "Buitelaar JK, van der Gaag RJ. Diagnostic rules for children with PDD-NOS and multiple complex developmental disorder. J Child Psychol Psychiatry 1998;39:911-919 (PMID 9758199)"
  reference_confidence: "concept confirmed in source (abstract); the fifteen criteria of the form were not matched to a published set"
  construct: psychiatric_diagnosis
  sources: ["schema notes and labels (asp mcdd)", "scale_reference_aq_autism.md section 23", "docs/asp/PROGRESS.md D74"]
  variables:
    "mcdd*":
      meaning: "One criterion: 0 no, 1 yes (9, unknown, is read as missing). An empty criterion under a ticked box 'no to all the criteria' is read as 0."
      higher_means: the criterion is met
      polarity: worse
      basis: anchors
      source: "schema labels (asp mcdd): 'MCDD criterion ... (0 no, 1 yes)'"
    mcddn_1:
      meaning: "Box 'no to all the criteria': 0 not ticked, 1 ticked. Written on every saved form; ticking it sets the fifteen criteria to no."
      polarity: not_applicable
  flags:
    - "No score is stored or built. The published rule found (three items out of six items of anxieties and thought disturbance) could not be matched to the fifteen criteria of the form."
    - "The use of the box 'no to all the criteria' rises with the years (ticked on 11% of the visits of 2013, 86% of 2018, 98% of 2019), so the number of criteria met falls: a step in the habit of the box, with no known cause, not in the criteria."
    - "On 14 visits a criterion is yes under a ticked box: kept as written (contradictory)."
    - "Who fills the criteria is not documented."

ocd:
  description: "The section on obsessions and compulsions of the old forms: a checklist of 80 symptoms answered 1 never, 2 in the past, 3 in the last week, three ratings of the worst period of the life, the ages of onset and of the worst period, descriptions in free text, and the diagnosis and treatment of an obsessive-compulsive disorder. No score."
  construct: ocd_symptoms
  period: "lifetime and the last week (checklist); worst lifetime period (ratings)"
  sources: ["schema notes and labels (asp ocd)", "scale_reference_aq_autism.md section 34"]
  items:
    meaning: "Checklist items ocd_toc1 to ocd_toc80: 1 never, 2 in the past, 3 in the last week. The other questions carry their own answers in their labels."
    higher_means: "the symptom is present, and more recently (checklist items)"
    polarity: worse
    basis: anchors
    source: "schema labels (asp ocd): 'checklist, item N (1 never, 2 in the past, 3 in the last week)'"
  variables:
    ocd_tocgr1:
      meaning: "Time the obsessions and compulsions took in the worst lifetime period, from 0 (none) to 4 (over 8 hours a day)."
      higher_means: more time taken by obsessions and compulsions
      polarity: worse
      basis: anchors
      source: "schema label (asp ocd): 'time they took in the worst lifetime period (0 none to 4 over 8 hours a day)'"
    ocd_tocgr2:
      meaning: "Interference with activities in the worst lifetime period, from 0 (none) to 4 (extreme)."
      higher_means: more interference
      polarity: worse
      basis: anchors
      source: "schema label (asp ocd): 'interference with activities in the worst lifetime period (0 none to 4 extreme)'"
    ocd_tocgr3:
      meaning: "Distress in the worst lifetime period, from 0 (none) to 4 (extreme)."
      higher_means: more distress
      polarity: worse
      basis: anchors
      source: "schema label (asp ocd): 'distress in the worst lifetime period (0 none to 4 extreme)'"
    ocd_tocdiag:
      meaning: "A diagnosis of obsessive-compulsive disorder was raised (0 no, 1 yes)."
      polarity: not_applicable
    ocd_toctt:
      meaning: "Ever received medication for obsessive-compulsive disorder (0 no, 1 yes)."
      polarity: not_applicable
    ocd_obsage:
      meaning: "Age at the first obsessive thoughts, in years."
      polarity: neutral
    ocd_obsgrav:
      meaning: "Age when the obsessive thoughts were worst, in years."
      polarity: neutral
    ocd_compage__face_asp_2_autoquestionnaires_old_part2:
      meaning: "Age of onset of the compulsions, in years. The export added the name of the table to the column name."
      polarity: neutral
    ocd_compgrav:
      meaning: "Age when the compulsions were worst, in years."
      polarity: neutral
    ocd_tocage:
      meaning: "Age when the diagnosis was raised, in years."
      polarity: neutral
  flags:
    - "Not tied to a published instrument: the checklist has the form of the symptom checklist of the Yale-Brown scale, but whether it derives from the adult or a child version was not settled. No reference is written. No severity score of the Yale-Brown scale is stored, and none should be built from these items."
    - "The answers 1 to 3 of the checklist order recency (never, past, last week), not severity."
    - "Who answers is not documented. The form has no age limit: 49 of the 187 visits are of patients under 18."
    - "Old set of forms: a visit after the change of set did not ask it (not asked, not missing)."

rbs_r:
  description: "The Repetitive Behavior Scale-Revised of the old set of forms: forty-three items rated from 0 to 3, six sub-scale scores and a total. Filled for children and adults."
  version: "43 items, six sub-scales (the original structure, not the five factors of Lam and Aman 2007)"
  reference: "Bodfish JW, Symons FJ, Parker DE, Lewis MH. Varieties of repetitive behavior in autism. J Autism Dev Disord 2000;30:237-243 (PMID 11055459)"
  reference_confidence: "study confirmed in source (abstract); the authorship of the RBS-R itself is to verify"
  construct: repetitive_behaviours
  sources: ["schema notes (asp rbs_r)", "scale_reference_aq_autism.md section 14"]
  scores:
    rbsr_stereotyped:
      meaning: "Stereotyped behaviour: sum of the items 1 to 6, each rated from 0 to 3 (0 to 18)."
    rbsr_self_injurious:
      meaning: "Self-injurious behaviour: sum of the items 7 to 14 (0 to 24)."
    rbsr_compulsive:
      meaning: "Compulsive behaviour: sum of the items 15 to 22 (0 to 24)."
    rbsr_ritualistic:
      meaning: "Ritualistic behaviour: sum of the items 23 to 28 (0 to 18)."
    rbsr_sameness:
      meaning: "Sameness behaviour: sum of the items 29 to 39 (0 to 33)."
    rbsr_restricted:
      meaning: "Restricted behaviour: sum of the items 40 to 43 (0 to 12)."
    rbsr_total:
      meaning: "Total: sum of the forty-three items (0 to 129)."
  flags:
    - "No page read states what a higher score means. The literature notes give the answers as 0 'behaviour not present' to 3 'severe problem', tagged 'to verify': no direction is written here."
    - "Who answers is not written in the schema; the published validation used caregivers (Lam and Aman 2007, confirmed in source, abstract)."
    - "The six sub-scales and their item counts are 'to verify' on the published side. The form also computes the five-factor scores of Lam and Aman; the extraction does not hold them."
    - "In one centre the median total rises from 16 (to 2016) to 32 (2019 to 2021) at the same age, with every item filled: a step with no known cause (the rater, who answers or the patients referred)."
    - "Old set of forms: a visit after the change of set did not ask it (not asked, not missing). No French version was found."

spq:
  description: "The Schizotypal Personality Questionnaire of the old set of forms: seventy-four items answered 0 or 1, nine sub-scale scores and a total. Filled for children and adults."
  version: "74 items, nine sub-scales"
  reference: "Raine A. The SPQ. Schizophr Bull 1991;17:555-564 (PMID 1805349)"
  reference_confidence: "confirmed in source (abstract); reference tool verified"
  respondent: patient
  construct: schizotypy
  sources: ["schema notes (asp spq)", "scale_reference_aq_autism.md section 35"]
  scores:
    spq_ideas_of_reference:
      meaning: "Ideas of reference: sum of 9 items answered 0 or 1 (0 to 9)."
      higher_means: more of this schizotypal trait
      polarity: worse
      basis: literature
