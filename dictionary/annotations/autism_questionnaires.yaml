systemizing_quotient:
  description: "The Systemizing Quotient of the old set of forms, filled by adults: sixty items answered from 1 (definitely agree) to 4 (definitely disagree), of which forty are scored, and a score from 0 to 80."
  version: "60-item SQ of 2003 (40 scored items, 20 not scored), not the 75-item SQ-R"
  reference: "Baron-Cohen S, Richler J, Bisarya D, Gurunathan N, Wheelwright S. The systemizing quotient. Philos Trans R Soc Lond B 2003;358:361-374 (PMID 12639333)"
  reference_confidence: "confirmed in source (abstract); reference tool verified"
  respondent: patient
  construct: empathy
  sources: ["schema notes and labels (asp systemizing_quotient)", "scale_reference_aq_autism.md section 12", "docs/asp/PROGRESS.md D9"]
  items:
    meaning: "Answers as stored, 1 definitely agree to 4 definitely disagree. Agreement scores on 20 items, disagreement on 20, and 20 items are not scored."
    higher_means: more disagreement with the statement
    polarity: neutral
    basis: anchors
    source: "schema labels (asp systemizing_quotient): 'item N (1 definitely agree to 4 definitely disagree)'"
  scores:
    systemizing_quotient_total:
      meaning: "SQ score: on each of the 40 scored items, 2 points for a definite answer on the scored side and 1 for a slight one; 0 to 80."
      higher_means: more systemizing
      polarity: neutral
      basis: literature
      source: "scale_reference_aq_autism.md section 12: 40 systemizing items and 20 control items, each systemizing item scores 2, 1 or 0, maximum 80 (confirmed in source, abstract)"
  flags:
    - "The key was fitted on the data (it gives the stored score on 152 of 158 visits; the 6 that differ are dated 2013). The published list of reverse-keyed items and any cut-off were not read (to verify)."
    - "This is the 60-item SQ, not the SQ-R: a comparison with SQ-R norms would be wrong."
    - "One score typed without items is above the maximum of 80 and is not delivered."
    - "Old set of forms: a visit after the change of set did not ask it (not asked, not missing)."

tas20:
  description: "The Toronto Alexithymia Scale of the old set of forms: twenty items answered from 1 to 5, three factor scores and a total. A few visits, mostly of children, from 2013 to 2018. The children's alexithymia questionnaire and the BVAQ replace it in the new set."
  version: "TAS-20"
  reference: "Bagby RM, Parker JDA, Taylor GJ. The twenty-item Toronto Alexithymia Scale-I. J Psychosom Res 1994;38:23-32 (PMID 8126686)"
  reference_confidence: "confirmed in source (abstract)"
  construct: alexithymia
  sources: ["schema notes (asp tas20)", "scale_reference_aq_autism.md section 18"]
  items:
    meaning: "Answers from 1 to 5, strongly disagree to strongly agree. The items 4, 5, 10, 18 and 19 are worded the other way and are reversed in the scores."
    higher_means: more agreement with the statement
    polarity: neutral
    basis: literature
    source: "scale_reference_aq_autism.md section 18: five-point Likert, strongly disagree to strongly agree; items 4, 5, 10, 18, 19 reverse-scored (confirmed in source, extracted)"
  scores:
    tas_describing:
      meaning: "Difficulty describing feelings: sum of the items 2, 4, 11, 12 and 17, with 4 reversed (5 to 25)."
      higher_means: more difficulty describing feelings
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 18: factor of five items; total 61 or more is alexithymia (confirmed in source, extracted)"
    tas_identifying:
      meaning: "Difficulty identifying feelings: sum of the items 1, 3, 6, 7, 9, 13 and 14 (7 to 35)."
      higher_means: more difficulty identifying feelings
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 18: factor of seven items; total 61 or more is alexithymia (confirmed in source, extracted)"
    tas_externally_oriented:
      meaning: "Externally oriented thinking: sum of the items 5, 8, 10, 15, 16, 18, 19 and 20, with 5, 10, 18 and 19 reversed (8 to 40)."
      higher_means: more externally oriented thinking
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 18: factor of eight items; total 61 or more is alexithymia (confirmed in source, extracted)"
    tas_total:
      meaning: "Total: sum of the twenty items with five reversed, 20 to 100."
      higher_means: more alexithymia
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 18: 61 or more alexithymia, 51 or less non-alexithymia (confirmed in source, extracted)"
      cutoffs:
        - {value: "61 or more", meaning: "alexithymia", source: "scale_reference_aq_autism.md section 18", confidence: "confirmed in source (extracted)"}
        - {value: "51 or less", meaning: "no alexithymia (52 to 60 is intermediate)", source: "scale_reference_aq_autism.md section 18", confidence: "confirmed in source (extracted)"}
  flags:
    - "The two stored factors 'describing' and 'identifying' swap the items 7 and 11 (an error of the script of the form). The delivered factors follow the publication and differ from the stored ones; the total and the third factor are unaffected."
    - "Who answers is not written in the schema. 27 of the 33 inclusion visits are of children; the cut-offs above were not established for children in the sources read."
    - "41 visits in all, most from one centre in 2013 and 2014."

tci:
  description: "The Temperament and Character Inventory in a form of 125 items answered false (0) or true (1), with seven scale scores and a total stored as percents. 5 visits."
  version: "125 true or false items (named from the column names)"
  reference: "Cloninger CR, Svrakic DM, Przybeck TR. A psychobiological model of temperament and character. Arch Gen Psychiatry 1993;50:975-990 (PMID 8250684)"
  reference_confidence: "model confirmed in source (Europe PMC record; reference tool verified), abstract not read; the short form of 125 items is to verify"
  construct: personality_temperament
  sources: ["schema notes and labels (asp tci)", "scale_reference_aq_autism.md section 36"]
  items:
    higher_means: "the answer is 'true' (0 false, 1 true)"
    polarity: neutral
    basis: anchors
    source: "schema labels (asp tci): 'TCI, item N (0 false, 1 true)'"
  variables:
    "tci_score*":
      meaning: "Score of one dimension as stored, a percent from 0 to 100 and not a raw sum: 1 novelty seeking, 2 reward dependence, 3 persistence, 4 harm avoidance, 5 self-directedness, 6 cooperativeness, 7 self-transcendence; tci_scoretot is the total. No rule is checked."
  flags:
    - "Too few visits to verify: the scores are delivered as stored and no rule is checked. No document states how the percents are computed or what a higher value means."
    - "Who answers is not documented."

tics:
  description: "The section on chronic motor and vocal tics of the old forms: a checklist of 37 tics (24 motor, 13 vocal) answered 1 never, 2 in the past, 3 in the last week, ratings of the tics in the last week and in the worst period of the life, the ages of onset and of the worst period, and the diagnosis of Tourette syndrome. No score."
  construct: tics
  period: "lifetime and the last week (checklist); last week and worst lifetime period (ratings)"
  sources: ["schema notes and labels (asp tics)", "scale_reference_aq_autism.md section 24"]
  items:
    meaning: "Checklist items tic1 to tic37: 1 never, 2 in the past, 3 in the last week. The other questions carry their own answers in their labels."
    higher_means: "the tic is present, and more recently (checklist items)"
    polarity: worse
    basis: anchors
    source: "schema labels (asp tics): 'Tics checklist ... (1 never, 2 in the past, 3 in the last week)'"
  variables:
    "ticsem*":
      meaning: "Ratings of the last week. ticsem1 and ticsem2: longest period without motor or vocal tics, 0 always tic-free to 5 never tic-free. ticsem3 and ticsem4: intensity, 0 absent to 5 severe. ticsem5_m and ticsem5_v: interference, 1 never to 5 frequently disrupts."
      higher_means: more severe tics in the last week
      polarity: worse
      basis: anchors
      source: "schema labels (asp tics): '0 always tic-free to 5 never tic-free', '0 absent to 5 severe', '1 never to 5 frequently disrupts'"
    "ticvie*":
      meaning: "Ratings of the worst period of the life. ticvie1 and ticvie2: longest period without motor or vocal tics, 0 always tic-free to 5 never tic-free. ticvie5_m and ticvie5_v: interference, 1 never to 5 frequently disrupts."
      higher_means: more severe tics in the worst lifetime period
      polarity: worse
      basis: anchors
      source: "schema labels (asp tics): '0 always tic-free to 5 never tic-free', '1 never to 5 frequently disrupts'"
    ticvie3:
      meaning: "Intensity of motor tics in the worst lifetime period. The form offers the answers of the tic-free-period question (0 always tic-free to 5 never tic-free) instead of intensity answers; delivered as written."
    ticvie4:
      meaning: "Intensity of vocal tics in the worst lifetime period. The form offers the answers of the tic-free-period question (0 always tic-free to 5 never tic-free) instead of intensity answers; delivered as written."
    ticmul:
      meaning: "Several distinct tics at the same time in the last week (0 no, 1 yes)."
      polarity: not_applicable
    ticcons:
      meaning: "A series of tics occurring together in the last week (0 no, 1 yes)."
      polarity: not_applicable
    tourdiag:
      meaning: "A diagnosis of Tourette syndrome was raised (0 no, 1 yes)."
      polarity: not_applicable
    tourtt:
      meaning: "Ever received medication for tics or Tourette syndrome (0 no, 1 yes); it has one answer in all."
      polarity: not_applicable
    ticmage:
      meaning: "Age at the first motor tics, in years."
      polarity: neutral
    ticmgrav:
      meaning: "Age when the motor tics were worst, in years."
      polarity: neutral
    ticvage:
      meaning: "Age at the first vocal tics, in years."
      polarity: neutral
    ticvgrav:
      meaning: "Age when the vocal tics were worst, in years."
      polarity: neutral
    tourage:
      meaning: "Age when the diagnosis of Tourette syndrome was raised, in years."
      polarity: neutral
  flags:
    - "Not tied to a published instrument (literature notes: unidentified); no reference is written and no score is stored or built."
    - "The answers 1 to 3 of the checklist order recency (never, past, last week), not severity."
    - "ticvie3 and ticvie4 (intensity in the worst period) were answered on the list of the tic-free-period question: their meaning is uncertain and no direction is written for them."
    - "Among adults the share of 'never' rises with the years (63% to 71% in 2013 to 2016, 93% in 2019), with no change of the form: a step with no known cause."
    - "The ages are whole years: a decimal or a word typed in an age is lost by the export."
    - "Who answers is not documented. Old set of forms: a visit after the change of set did not ask it (not asked, not missing)."
