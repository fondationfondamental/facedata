# Annotations of the group autism_questionnaires (FACE ASP: the three auto-questionnaire folders, 48 instruments).
# Written from the schema notes, the schema labels and the literature notes only.
# A field that is missing means that no document states it: a blank is not an oversight.

adhd_rs_adult:
  description: "The ADHD Rating Scale in the adult form of the application (form 220): eighteen items answered from 0 to 3 in which the adult recalls the behaviours of his or her childhood, two sub-scores and a total, then one question on the behaviours before the age of 7."
  version: "Adult form (form 220), 18 items; items 1 to 9 inattention, items 10 to 18 hyperactivity-impulsivity"
  reference: "DuPaul GJ, Power TJ, Anastopoulos AD, Reid R. ADHD Rating Scale-IV: checklists, norms, and clinical interpretation. Guilford, 1998"
  reference_confidence: "to verify (listing seen as a search snippet only)"
  respondent: patient
  construct: adhd_symptoms
  period: "childhood, as recalled by the adult"
  sources: ["schema notes (asp adhd_rs_adult)", "scale_reference_aq_autism.md section 28", "docs/asp/PROGRESS.md D63"]
  scores:
    adhdrsa_inattention:
      meaning: "Inattention: sum of the items 1 to 9, each answered from 0 to 3 (0 to 27)."
    adhdrsa_hyperactivity:
      meaning: "Hyperactivity-impulsivity: sum of the items 10 to 18 (0 to 27)."
    adhdrsa_total:
      meaning: "Total: sum of the eighteen items (0 to 54)."
  variables:
    adhdrsa19:
      meaning: "Nineteenth question: were some of these behaviours present before the age of 7 (yes or no; the answer 'NA' of the form is read as missing)."
      polarity: not_applicable
  flags:
    - "No document gives the wording of the answers 0 to 3 or says what a higher score means: no direction is written here."
    - "Identified as the ADHD Rating Scale (DuPaul and others) from its name and its eighteen items, 'likely'. The published form is said to alternate the two dimensions (odd items inattention; to verify); in this form the first nine items are inattention and the last nine hyperactivity-impulsivity, as the item correlations and the stored sub-scores show."
    - "Two forms share the raw columns (this one and the child form filled by a parent) and no column says which was filled: the age at the visit tells it (18 and over here). A visit with answers and no age has no form."
    - "The published scale is a child scale (to verify); this form asks adults to recall their childhood. The adults also fill the ASRS."
    - "A score typed without its items is kept as stored (7 or 8 visits)."

adhd_rs_child:
  description: "The ADHD Rating Scale in the child form of the application (form 221): a parent answers eighteen items from 0 to 3 about the behaviours of the child now, with two sub-scores and a total, then one question on the behaviours before the age of 7. Visits of patients under 18."
  version: "Child form filled by a parent (form 221), 18 items; items 1 to 9 inattention, items 10 to 18 hyperactivity-impulsivity"
  reference: "DuPaul GJ, Power TJ, Anastopoulos AD, Reid R. ADHD Rating Scale-IV: checklists, norms, and clinical interpretation. Guilford, 1998"
  reference_confidence: "to verify (listing seen as a search snippet only)"
  respondent: relative
  construct: adhd_symptoms
  period: "the behaviours of the child now"
  sources: ["schema notes (asp adhd_rs_child)", "scale_reference_aq_autism.md section 28", "docs/asp/PROGRESS.md D63"]
  scores:
    adhdrsc_inattention:
      meaning: "Inattention: sum of the items 1 to 9, each answered from 0 to 3 (0 to 27)."
    adhdrsc_hyperactivity:
      meaning: "Hyperactivity-impulsivity: sum of the items 10 to 18 (0 to 27)."
    adhdrsc_total:
      meaning: "Total: sum of the eighteen items (0 to 54)."
  variables:
    adhdrsc19:
      meaning: "Nineteenth question: were some of these behaviours present before the age of 7 (yes or no; the answer 'NA' of the form is read as missing)."
      polarity: not_applicable
  flags:
    - "No document gives the wording of the answers 0 to 3 or says what a higher score means: no direction is written here."
    - "Identified as the ADHD Rating Scale (DuPaul and others), 'likely'. The published form is said to alternate the two dimensions (to verify); in this form the first nine items are inattention and the last nine hyperactivity-impulsivity."
    - "Two forms share the raw columns (this one and the adult form) and no column says which was filled: the age at the visit tells it (under 18 here)."
    - "From 2019 the scores are often typed without the items (210 visits); they are kept as stored. On 17 visits, 16 of them dated 2013, the stored total differs from the sum of the items; the delivered total is the sum."
    - "The median total is lower in 2013 to 2015 (16.5 to 22.5) than from 2018 (23 to 28); the early years come from one centre and the cause is not known."
    - "A French version was only partially validated (Mercier 2016, confirmed in source, abstract)."

adi_r:
  description: "The parent interview for the diagnosis of autism, done at the inclusion visit for children and adults. A clinician interviews a parent or another caregiver and codes 93 items; the published algorithm gives twelve sub-scores and the domain scores A (social interaction), B (communication), C (restricted and repetitive behaviours) and D (onset before 36 months)."
  version: "ADI-R, 93 items; the edition of 2003 on 99% of the visits that name the edition (adi_version)"
  reference: "Lord C, Rutter M, Le Couteur A. Autism Diagnostic Interview-Revised. J Autism Dev Disord 1994;24:659-685 (PMID 7814313)"
  reference_confidence: "confirmed in source (abstract); reference tool verified"
  respondent: relative
  construct: autism_symptoms
  period: "lifetime: the algorithm reads the 'past' codes (ever, or the most abnormal between four and five years); the 'current' codes describe the behaviour now"
  sources: ["schema notes (asp adi_r)", "scale_reference_aq_autism.md section 2", "docs/asp/PROGRESS.md D8 and D64"]
  scores:
    adi_a1:
      meaning: "A1, non-verbal behaviours that regulate social interaction: sum of three items (a code 3 counts 2; 7, 8 and 9 count 0), 0 to 6."
      higher_means: more abnormality in this area
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 2: algorithm scores 0 to 2 (2 = definite abnormal behaviour) summed into domains that have cut-offs for autism (confirmed in source, direct)"
    adi_a2:
      meaning: "A2, peer relationships: sum of four items, one of them chosen by age (item 64 under ten years, item 65 from ten), 0 to 8."
      higher_means: more abnormality in this area
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 2: algorithm scores 0 to 2 summed into domains that have cut-offs for autism (confirmed in source, direct)"
    adi_a3:
      meaning: "A3, shared enjoyment: sum of three items, 0 to 6."
      higher_means: more abnormality in this area
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 2: algorithm scores 0 to 2 summed into domains that have cut-offs for autism (confirmed in source, direct)"
    adi_a4:
      meaning: "A4, socio-emotional reciprocity: sum of five items, 0 to 10."
      higher_means: more abnormality in this area
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 2: algorithm scores 0 to 2 summed into domains that have cut-offs for autism (confirmed in source, direct)"
    adi_b1:
      meaning: "B1, gestures: sum of four items, 0 to 8."
      construct: communication_language
      higher_means: more abnormality in this area
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 2: algorithm scores 0 to 2 summed into domains that have cut-offs for autism (confirmed in source, direct)"
    adi_b2:
      meaning: "B2, conversation (verbal subjects): sum of two items, 0 to 4."
      construct: communication_language
      higher_means: more abnormality in this area
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 2: algorithm scores 0 to 2 summed into domains that have cut-offs for autism (confirmed in source, direct)"
    adi_b3:
      meaning: "B3, stereotyped and idiosyncratic speech (verbal subjects): sum of four items, 0 to 8."
      construct: communication_language
      higher_means: more abnormality in this area
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 2: algorithm scores 0 to 2 summed into domains that have cut-offs for autism (confirmed in source, direct)"
    adi_b4:
      meaning: "B4, make-believe and imitative play: sum of three items, 0 to 6."
      construct: communication_language
      higher_means: more abnormality in this area
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 2: algorithm scores 0 to 2 summed into domains that have cut-offs for autism (confirmed in source, direct)"
    adi_c1:
      meaning: "C1, preoccupations and circumscribed interests: sum of two items, 0 to 4."
      construct: repetitive_behaviours
      higher_means: more abnormality in this area
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 2: algorithm scores 0 to 2 summed into domains that have cut-offs for autism (confirmed in source, direct)"
    adi_c2:
      meaning: "C2, routines and rituals: sum of two items, 0 to 4."
      construct: repetitive_behaviours
      higher_means: more abnormality in this area
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 2: algorithm scores 0 to 2 summed into domains that have cut-offs for autism (confirmed in source, direct)"
    adi_c3:
      meaning: "C3, motor mannerisms: the higher of two items, 0 to 2."
      construct: repetitive_behaviours
      higher_means: more abnormality in this area
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 2: algorithm scores 0 to 2 summed into domains that have cut-offs for autism (confirmed in source, direct)"
    adi_c4:
      meaning: "C4, parts of objects and sensory interests: the higher of two items, 0 to 2."
      construct: repetitive_behaviours
      higher_means: more abnormality in this area
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 2: algorithm scores 0 to 2 summed into domains that have cut-offs for autism (confirmed in source, direct)"
    adi_social_total:
      meaning: "Domain A, reciprocal social interaction: sum of A1 to A4, 0 to 30."
      higher_means: more abnormality of reciprocal social interaction
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 2 (confirmed in source, direct); schema label 'cut-off 10'"
      cutoffs:
        - {value: "10", meaning: "cut-off of the diagnostic algorithm for this domain (autism when every domain reaches its cut-off)", source: "schema notes (asp adi_r); scale_reference_aq_autism.md section 2", confidence: "confirmed in source (direct)"}
    adi_communication_verbal_total:
      meaning: "Domain B, communication of verbal subjects: sum of B1 to B4, 0 to 26."
      construct: communication_language
      higher_means: more abnormality of communication
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 2 (confirmed in source, direct); schema label 'cut-off 8'"
      cutoffs:
        - {value: "8", meaning: "cut-off of the diagnostic algorithm for verbal subjects", source: "schema notes (asp adi_r); scale_reference_aq_autism.md section 2", confidence: "confirmed in source (direct)"}
    adi_repetitive_total:
      meaning: "Domain C, restricted and repetitive behaviours: sum of C1 to C4, 0 to 12."
      construct: repetitive_behaviours
      higher_means: more restricted and repetitive behaviours
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 2 (confirmed in source, direct); schema label 'cut-off 3'"
      cutoffs:
        - {value: "3", meaning: "cut-off of the diagnostic algorithm for this domain", source: "schema notes (asp adi_r); scale_reference_aq_autism.md section 2", confidence: "confirmed in source (direct)"}
  variables:
    adi_communication_nonverbal_total:
      meaning: "Domain B total of non-verbal subjects, as stored (0 to 14); not recomputed."
      construct: communication_language
      higher_means: more abnormality of communication
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 2 (confirmed in source, direct)"
      cutoffs:
        - {value: "7", meaning: "cut-off of the diagnostic algorithm for non-verbal subjects", source: "scale_reference_aq_autism.md section 2", confidence: "confirmed in source (direct)"}
    adi_onset_total:
      meaning: "Domain D, abnormality of development evident before 36 months, as stored (0 to 5): a count of five signs of early abnormality."
      construct: development
      higher_means: more signs that development was abnormal before 36 months
      polarity: worse
      basis: stated
      source: "schema notes (asp adi_r): the published rule counts five signs (first noticed before 36 months, first words after 24, first phrases after 33, item 86 coded 3 or 4, the interviewer's judgement before 36 months)"
      cutoffs:
        - {value: "1", meaning: "cut-off of the diagnostic algorithm for this domain", source: "schema notes (asp adi_r); scale_reference_aq_autism.md section 2", confidence: "confirmed in source (direct)"}
    adi_positive:
      meaning: "Conclusion recorded in the form: the ADI-R is above the diagnostic thresholds (yes or no)."
      polarity: not_applicable
    "adi*_past":
      meaning: "Code of the item for the past behaviour (ever, or the most abnormal between four and five years), the one the algorithm reads. Codes 0 to 3, then 7 (abnormality of another kind), 8 (not applicable) and 9 (not known), which are not levels."
      higher_means: "more abnormal behaviour, for the codes 0 to 3 only"
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 2: 0 no definite behaviour, 1 probably present, 2 definite abnormal behaviour, 3 extreme severity (confirmed in source, direct)"
    "adi*_current":
      meaning: "Code of the item for the current behaviour. Codes 0 to 3, then 7 (abnormality of another kind), 8 (not applicable) and 9 (not known), which are not levels."
      higher_means: "more abnormal behaviour, for the codes 0 to 3 only"
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 2: 0 no definite behaviour, 1 probably present, 2 definite abnormal behaviour, 3 extreme severity (confirmed in source, direct)"
    adi30_current:
      meaning: "Item 30, overall level of language: the item that says whether the verbal or the non-verbal communication cut-off applies. A code, not a severity level."
      polarity: not_applicable
  flags:
    - "The item codes 7, 8 and 9 are not levels: do not average the items."
    - "The stored domain totals A and C are not the published ones (the export counts both peer items in A and both items of C3 and of C4 in C; up to 2 and 4 points too high). The delivered totals A and C are the sums of the sub-scores; the stored ones are not delivered."
    - "The stored B3 leaves out the item 38 between 2016 and 2020; the delivered B3 is the four-item sum where the items are recorded."
    - "On 423 visits the sub-scores were typed without the items: they are kept as stored and the domain totals are their sums."
    - "adi_onset_total: 432 of the 1,184 stored values are partial sums (the export counts a missing item as 0): read them as lower bounds."
    - "On 12 visits coded non-verbal, B2, B3 and the verbal total B are delivered where the application leaves them empty. The cut-off of non-verbal subjects is 7, not 8."
    - "The item rules of the algorithm (the age rule of A2, the higher of two items in C3 and C4, the four items of B3) are the schema's findings, checked on the data; on the published side they are 'to verify' (the manual was not read)."
    - "The domain totals fall over the years (median social total 21 in 2011 to 2013, 10 to 12 from 2018) in children and adults alike, with no known cause."
    - "adi_positive is the conclusion as recorded; it agrees with the four published cut-offs applied to the stored totals on 1,008 of 1,053 visits."

ados:
  description: "The record of the ADOS session, whatever the module: whether it was done, its date, the age, the module entered and the conclusion. The items and the algorithm scores are in the instruments of the modules (ados_module1 to ados_module4)."
  version: "First edition of the ADOS and ADOS-2 in the same columns"
  reference: "Lord C, Risi S, Lambrecht L, et al. The Autism Diagnostic Observation Schedule-Generic. J Autism Dev Disord 2000;30:205-223 (PMID 11055457)"
  reference_confidence: "confirmed in source (abstract); reference tool verified"
  respondent: clinician
  construct: autism_symptoms
  period: "the observation session"
  sources: ["schema notes (asp ados)", "scale_reference_aq_autism.md section 1", "docs/asp/PROGRESS.md D8 and D64"]
  variables:
    ados_positive:
      meaning: "Above the spectrum cut-off (yes or no), as the export computes it from the raw item codes (a code 3 counted 3). Delivered as recorded."
      polarity: not_applicable
    ados_module:
      meaning: "Module entered. Module 3 is for children and adolescents with fluent speech, module 4 for adolescents and adults; modules 1 and 2 are rare here."
      polarity: not_applicable
  flags:
    - "Use the total of the module (ados3_total, ados4_total), which is recomputed with the published rule. The total of the summary line is not delivered: it holds two algorithms in one column and the error of the stored totals of the first edition."
    - "The stored scores of the ADOS are those of the export, which sums the raw codes (a 3 counted 3); the form itself counts a 3 as 2, as the publication does."
    - "ados_positive comes from those raw sums: 6 of its 'yes' are visits whose published sums say no."
    - "The first edition and the ADOS-2 share the columns. The edition is told by the item that the ADOS-2 added (B8 in the module 3, B10 in the module 4), which is empty on a visit of the first edition."
    - "12 visits hold the items of another module than the one entered."

ados_module1:
  description: "The scores of the module 1 of the ADOS-2 (children with no phrase speech), as stored. Fewer than five visits and no item recorded."
  version: "ADOS-2, module 1"
  reference: "Lord C, Rutter M, DiLavore PC, Risi S, Gotham K, Bishop SL. ADOS-2 manual. Western Psychological Services, 2012"
  reference_confidence: "year of manual confirmed in source (secondary, direct); manual itself not read"
  respondent: clinician
  construct: autism_symptoms
  period: "the observation session"
  sources: ["schema notes (asp ados_module1)", "scale_reference_aq_autism.md section 1"]
  variables:
    ados1_social_affect:
      meaning: "Social affect score of the module 1, as stored (0 to 20); not verified."
      higher_means: more autism-related behaviour observed
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 1: social affect total + restricted and repetitive behaviour total = overall total, which gives the classification with two cut-offs (confirmed in source, direct)"
    ados1_restricted_repetitive:
      meaning: "Restricted and repetitive behaviour score of the module 1, as stored (0 to 8); not verified."
      construct: repetitive_behaviours
      higher_means: more restricted and repetitive behaviour observed
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 1: social affect total + restricted and repetitive behaviour total = overall total, which gives the classification with two cut-offs (confirmed in source, direct)"
    ados1_total:
      meaning: "Total of the module 1, as stored (0 to 28); not verified."
      higher_means: more autism-related behaviour observed
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 1: the overall total gives the classification with two cut-offs, autism and autism spectrum (confirmed in source, direct)"
    ados1_comparison_score:
      meaning: "Comparison score of the module 1 (1 to 10), as stored."
      higher_means: more severe on the 10-point severity metric
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 1: comparison score, a 10-point severity metric calibrated on percentiles of raw totals (confirmed in source, direct and abstracts)"
    ados1_classification:
      meaning: "Classification of the module as stored: autism, autism spectrum or non-spectrum."
      polarity: not_applicable
  flags:
    - "Too few visits to verify: the scores are delivered as stored and no rule is checked. The stored scores are the export's, like those of the other modules (a code 3 may be counted 3)."
    - "The cut-offs of the module 1 depend on the number of words (literature notes) and were not read."

ados_module2:
  description: "The items and the scores of the module 2 of the ADOS-2 (children who speak in phrases), as stored. 14 visits."
  version: "ADOS-2, module 2"
  reference: "Lord C, Rutter M, DiLavore PC, Risi S, Gotham K, Bishop SL. ADOS-2 manual. Western Psychological Services, 2012"
  reference_confidence: "year of manual confirmed in source (secondary, direct); manual itself not read"
  respondent: clinician
  construct: autism_symptoms
  period: "the observation session"
  sources: ["schema notes (asp ados_module2)", "scale_reference_aq_autism.md section 1"]
  items:
    meaning: "Codes of the examiner as recorded. The codes 7 and 8 are not levels."
  variables:
    ados2_social_affect:
      meaning: "Social affect score of the module 2, as stored (0 to 20); not verified."
      higher_means: more autism-related behaviour observed
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 1: social affect total + restricted and repetitive behaviour total = overall total, which gives the classification with two cut-offs (confirmed in source, direct)"
    ados2_restricted_repetitive:
      meaning: "Restricted and repetitive behaviour score of the module 2, as stored (0 to 8); not verified."
      construct: repetitive_behaviours
      higher_means: more restricted and repetitive behaviour observed
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 1: social affect total + restricted and repetitive behaviour total = overall total, which gives the classification with two cut-offs (confirmed in source, direct)"
    ados2_total:
      meaning: "Total of the module 2, as stored (0 to 28); not verified."
      higher_means: more autism-related behaviour observed
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 1: the overall total gives the classification with two cut-offs, autism and autism spectrum (confirmed in source, direct)"
    ados2_comparison_score:
      meaning: "Comparison score of the module 2 (1 to 10), as stored."
      higher_means: more severe on the 10-point severity metric
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 1: comparison score, a 10-point severity metric calibrated on percentiles of raw totals (confirmed in source, direct and abstracts)"
    ados2_classification:
      meaning: "Classification of the module as stored: autism, autism spectrum or non-spectrum."
      polarity: not_applicable
  flags:
    - "Too few visits to verify: the columns are read with their types and ranges, the scores are delivered as stored and no rule is checked. The names of the scores follow those of the module 3."
    - "Two points are to check before the module can be verified: a column of the first edition is mapped to the items B9a and B9b (probably a slip of the export), and the cut-off arrays of the module 2 in the script of the form look transposed (to verify)."
    - "Do not average the items: the codes 7 and 8 are not levels."

ados_module3:
  description: "The twenty-nine items of the module 3 of the ADOS (children and adolescents with fluent speech), coded by the examiner during the session, with the algorithm scores, the classification and the comparison score."
  version: "Module 3, first edition and ADOS-2 in the same columns; revised algorithm (Gotham and others, 2007)"
  reference: "Gotham K, Risi S, Pickles A, Lord C. The ADOS: revised algorithms for improved diagnostic validity. J Autism Dev Disord 2007;37:613-627 (PMID 17180459)"
  reference_confidence: "confirmed in source (abstract)"
  respondent: clinician
  construct: autism_symptoms
  period: "the observation session"
  sources: ["schema notes (asp ados_module3)", "scale_reference_aq_autism.md section 1", "docs/asp/PROGRESS.md D8 and D64"]
  items:
    meaning: "Codes of the examiner, 0 to 3; the codes 7 and 8 are not levels. The algorithm counts a 3 as 2 and the codes 7 and 8 as 0."
    higher_means: "more autism-related behaviour, for the codes 0 to 3 of the algorithm items"
    polarity: worse
    basis: stated
    source: "schema notes (asp ados_module3): the algorithm sums the codes of fourteen items and the total classifies autism from 9; nothing is stated for the items outside the algorithm"
  scores:
    ados3_social_affect:
      meaning: "Social affect: sum of ten algorithm items (a code 3 counts 2, the codes 7 and 8 count 0), 0 to 20."
      higher_means: more autism-related behaviour observed in social affect
      polarity: worse
      basis: stated
      source: "schema notes (asp ados_module3): the total is social affect plus restricted and repetitive behaviour, autism from 9, autism spectrum 7 and 8, non-spectrum below"
    ados3_restricted_repetitive:
      meaning: "Restricted and repetitive behaviour: sum of four algorithm items, 0 to 8."
      construct: repetitive_behaviours
      higher_means: more restricted and repetitive behaviour observed
      polarity: worse
      basis: stated
      source: "schema notes (asp ados_module3): the total is social affect plus restricted and repetitive behaviour, autism from 9, autism spectrum 7 and 8, non-spectrum below"
    ados3_total:
      meaning: "Total of the module 3: social affect plus restricted and repetitive behaviour, 0 to 28."
      higher_means: more autism-related behaviour observed
      polarity: worse
      basis: stated
      source: "schema notes (asp ados_module3): autism from 9, autism spectrum 7 and 8, non-spectrum below"
      cutoffs:
        - {value: "9 or more", meaning: "autism (classification of the module)", source: "schema notes (asp ados_module3)", confidence: "to verify (only the schema notes)"}
        - {value: "7 and 8", meaning: "autism spectrum (classification of the module)", source: "schema notes (asp ados_module3)", confidence: "to verify (only the schema notes)"}
  variables:
    ados3_comparison_score:
      meaning: "Comparison score (1 to 10), read by the form in a table of the manual from the total and the age; as stored, filled from 2017 (ADOS-2 only)."
      higher_means: more severe on the 10-point severity metric
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 1: comparison score, a 10-point severity metric calibrated on percentiles of raw totals (confirmed in source, direct and abstracts)"
    ados3_classification:
      meaning: "Classification as stored: autism (total 9 or more), autism spectrum (7 and 8) or non-spectrum."
      polarity: not_applicable
    ados3_b08:
      meaning: "Item B8, the item that the ADOS-2 added to the module: empty on a visit of the first edition, which tells the two editions apart."
  flags:
    - "Two editions in the same columns: the first edition on 96 visits (most until 2017) and the ADOS-2 on 702. The same revised algorithm is delivered for both."
    - "The stored scores of the first edition count a code 3 as 3 (up to 5 points too high); the delivered scores follow the publication on every visit."
    - "The classification is delivered as stored: on fewer than five visits of the first edition the corrected total gives another class, and a defect of the script of the form leaves a stale or empty class on 2 visits."
    - "The item lists of the two domains and the cut-offs 9 and 7 are those of the schema and are 'to verify' on the published side (the papers were read as abstracts)."
    - "Do not average the items: the codes 7 and 8 are not levels."
    - "The median total steps by year inside one centre (10 in 2016, 16 in 2017, 8 in 2018, 13 in 2019), with no known cause."

ados_module4:
  description: "The thirty-two items of the module 4 of the ADOS (adolescents and adults), coded by the examiner during the session, with the algorithm scores and the classification."
  version: "Module 4, first edition and ADOS-2 in the same columns; original algorithm (Lord and others, 2000), not the revised one of 2014"
  reference: "Lord C, Risi S, Lambrecht L, et al. The Autism Diagnostic Observation Schedule-Generic. J Autism Dev Disord 2000;30:205-223 (PMID 11055457)"
  reference_confidence: "confirmed in source (abstract); reference tool verified"
  respondent: clinician
  construct: autism_symptoms
  period: "the observation session"
  sources: ["schema notes (asp ados_module4)", "scale_reference_aq_autism.md section 1", "docs/asp/PROGRESS.md D8 and D64"]
  items:
    meaning: "Codes of the examiner, 0 to 3; the codes 7 and 8 are not levels. The algorithm counts a 3 as 2 and the codes 7 and 8 as 0."
    higher_means: "more autism-related behaviour, for the codes 0 to 3 of the algorithm items"
    polarity: worse
    basis: stated
    source: "schema notes (asp ados_module4): the algorithm sums the item codes and the classification has cut-offs for autism and autism spectrum; nothing is stated for the items outside the algorithm"
  scores:
    ados4_communication:
      meaning: "Communication: sum of four algorithm items (a code 3 counts 2, the codes 7 and 8 count 0), 0 to 8."
      construct: communication_language
      higher_means: more autism-related behaviour observed in communication
      polarity: worse
      basis: stated
      source: "schema notes (asp ados_module4): classification cut-offs, autism 3 and autism spectrum 2 on this score"
      cutoffs:
        - {value: "3", meaning: "autism (one of the three cut-offs of the classification)", source: "schema notes (asp ados_module4)", confidence: "to verify"}
        - {value: "2", meaning: "autism spectrum (one of the three cut-offs of the classification)", source: "schema notes (asp ados_module4); scale_reference_aq_autism.md section 1", confidence: "confirmed in source (extracted, Nakamura 2024)"}
    ados4_social_interaction:
      meaning: "Reciprocal social interaction: sum of seven algorithm items, 0 to 14."
      higher_means: more autism-related behaviour observed in social interaction
      polarity: worse
      basis: stated
      source: "schema notes (asp ados_module4): classification cut-offs, autism 6 and autism spectrum 4 on this score"
      cutoffs:
        - {value: "6", meaning: "autism (one of the three cut-offs of the classification)", source: "schema notes (asp ados_module4)", confidence: "to verify"}
        - {value: "4", meaning: "autism spectrum (one of the three cut-offs of the classification)", source: "schema notes (asp ados_module4); scale_reference_aq_autism.md section 1", confidence: "confirmed in source (extracted, Nakamura 2024)"}
    ados4_total:
      meaning: "Total of the original algorithm: communication plus reciprocal social interaction, 0 to 22."
      higher_means: more autism-related behaviour observed
      polarity: worse
      basis: stated
      source: "schema notes (asp ados_module4): autism from 10, autism spectrum from 7"
      cutoffs:
        - {value: "10", meaning: "autism (one of the three cut-offs of the classification)", source: "schema notes (asp ados_module4)", confidence: "to verify"}
        - {value: "7", meaning: "autism spectrum (one of the three cut-offs of the classification)", source: "schema notes (asp ados_module4); scale_reference_aq_autism.md section 1", confidence: "confirmed in source (extracted, Nakamura 2024)"}
    ados4_stereotyped_restricted:
      meaning: "Stereotyped behaviours and restricted interests: sum of four items (D1, D2, D4, D5) with the same recoding, 0 to 8. Outside the total; no cut-off."
      construct: repetitive_behaviours
      higher_means: more stereotyped behaviours and restricted interests observed
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 1: the revised algorithm of the module 4 counts the items D1, D2 and D4 in a total with cut-offs (confirmed in source, direct, Hanawa 2025); schema notes (asp ados_module3): D1, D2 and D4 are in the total of the module 3. Nothing is stated for the item D5."
  variables:
    ados4_classification:
      meaning: "Classification as stored: autism (communication 3, social interaction 6 and total 10), autism spectrum (2, 4 and 7) or non-spectrum."
      polarity: not_applicable
    ados4_b10:
      meaning: "Item B10, the item that the ADOS-2 added to the module: empty on a visit of the first edition, which tells the two editions apart."
  flags:
    - "Original algorithm of the module 4, not the revised one (Hus and Lord, 2014), which uses other items, has no separate communication domain and has the cut-offs 8 and 10: do not compare with cohorts scored with the revised algorithm. No comparison score for this module."
    - "ados4_stereotyped_restricted enters no classification of the original algorithm. Its direction is read from the other algorithms, which count three of its four items (D1, D2, D4) towards their totals; nothing is stated for the item D5. 80 stored values, 77 of them before 2019, also counted the item C1 under an earlier rule of the form; the delivered score is the four-item sum."
    - "The two stored sub-scores count a code 3 as 3 on every visit (the export's error) and are not delivered; the delivered ones follow the published rule."
    - "The stored total counts a code 3 as 3 on part of the first edition (41 of 80 visits until 2017 with such a code); the delivered total follows the publication on every visit."
    - "Two editions in the same columns: ados4_b10 is empty on a visit of the first edition (254 visits, most until 2019)."
    - "A stored total of 0 with no item (175 values written by the export) is not a total and is not delivered."
    - "The classification is delivered as stored; a defect of the script of the form leaves a stale or empty class on 28 visits."
    - "Do not average the items: the codes 7 and 8 are not levels."

alexithymia_children:
  description: "The Alexithymia Questionnaire for Children, the children's form of the TAS-20: twenty items answered from 0 to 2 by the child, three factor scores and a total. The adults fill the BVAQ."
  version: "20 items answered from 0 to 2 (French form 'qae')"
  reference: "Rieffe C, Oosterveld P, Terwogt MM. An alexithymia questionnaire for children. Pers Individ Dif 2006;40:123-133"
  reference_confidence: "confirmed in source (secondary, direct: Loas 2017 cites it and describes it); reference tool unchecked (HTTP 429)"
  respondent: patient
  construct: alexithymia
  sources: ["schema notes (asp alexithymia_children)", "scale_reference_aq_autism.md sections 17 and 18"]
  scores:
    aqc_identifying:
      meaning: "Difficulty identifying feelings: sum of seven items (1, 3, 6, 7, 9, 13, 14), 0 to 14."
    aqc_describing:
      meaning: "Difficulty describing feelings: sum of five items (2, 4, 11, 12, 17; item 4 reversed), 0 to 10."
    aqc_externally_oriented:
      meaning: "Externally oriented thinking: sum of eight items (5, 8, 10, 15, 16, 18, 19, 20; items 5, 10, 18 and 19 reversed), 0 to 16."
    aqc_total:
      meaning: "Total: sum of the three factors, 0 to 40. Not stored, computed by the package."
  flags:
    - "No document states what a higher score means or gives the wording of the answers 0 to 2, so no direction is written. The key is that of the TAS-20 (same three factors, same reversed items 4, 5, 10, 18 and 19), where 61 or more is read as alexithymia (literature notes, section 18); the reversed items and the 0 to 2 coding of the children's form are 'to verify'."
    - "Externally oriented thinking had low internal consistency in children (alpha .29 in a school sample: Loas 2017, confirmed in source, direct). Here its reversed items 5 and 18 barely correlate with the rest of the factor (+0.09 and +0.07)."
    - "Scores typed without their items (208 visits) are kept as stored; the typed totals are 1.6 points above the computed ones on average."
    - "No cut-off is established (to verify)."

bdi2:
  description: "The Beck Depression Inventory, second edition: twenty-one items answered by the adult about the past two weeks, today included, and a total. Filled by adults only; the children fill the CDI."
  version: "BDI-II, 21 items"
  reference: "Beck AT, Steer RA, Brown GK. BDI-II manual, 1996; Beck AT, Steer RA, Ball R, Ranieri W. Comparison of BDI-IA and BDI-II. J Pers Assess 1996;67:588-597 (PMID 8991972)"
  reference_confidence: "comparison confirmed in source (abstract); manual year to verify"
  respondent: patient
  construct: depression
  period: "past two weeks, today included"
  sources: ["schema notes (asp bdi2)", "scale_reference_aq_autism.md section 27"]
  items:
    meaning: "Each item is delivered on the levels 0 to 3 (the items 16 and 18, which have seven options, are brought to these four levels)."
    higher_means: more severe symptom
    polarity: worse
    basis: literature
    source: "scale_reference_aq_autism.md section 27: 21 items with answers 0-3, higher scores more severe (confirmed in source, direct, Loas 2017)"
  scores:
    bdi_total:
      meaning: "Total: sum of the twenty-one items, 0 to 63."
      higher_means: more severe depression
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 27: answers 0-3, higher scores more severe (confirmed in source, direct, Loas 2017)"
      cutoffs:
        - {value: "0 to 13, 14 to 19, 20 to 28, 29 to 63", meaning: "the four usual severity categories, in increasing order", source: "scale_reference_aq_autism.md section 27", confidence: "four categories confirmed in source (abstract, Dolle 2012); band limits to verify"}
        - {value: "23 or more", meaning: "screening cut-off in adolescent patients (sensitivity .88, specificity .92)", source: "Dolle 2012, reported in scale_reference_aq_autism.md section 27", confidence: "confirmed in source (abstract, Dolle 2012)"}
  flags:
    - "The items 16 (sleep) and 18 (appetite) have seven options, stored 0 to 6 and brought to the levels 0 to 3; whether the change is an increase or a decrease is not delivered."
    - "The total is not delivered where some items are missing (78 visits), since a stored total may then be a partial sum. A total typed without any item (82 visits) is kept as stored."
    - "No French validation was found in the literature check (to verify)."

brief_adult:
  description: "The Behavior Rating Inventory of Executive Function, adult version (BRIEF-A): 75 items answered from 1 to 3 about executive functioning in everyday life, nine scale scores, two indexes, a composite and three validity scores. Visits of adults."
  version: "BRIEF-A, 75 items; an informant form (form 264) and the self-report form (form 344) in the same columns"
  reference: "Roth RM, Isquith PK, Gioia GA. BRIEF-A professional manual, PAR, 2005"
  reference_confidence: "to verify (manual not read; the schema cites 2005)"
  respondent: patient
  construct: executive_function
  sources: ["schema notes (asp brief_adult)", "scale_reference_aq_autism.md section 21", "docs/asp/PROGRESS.md D8"]
  scores:
    briefa_inhibit:
      meaning: "Inhibit: raw sum of 8 items answered from 1 to 3 (8 to 24)."
    briefa_shift:
      meaning: "Shift: raw sum of 6 items (6 to 18)."
    briefa_emotional_control:
      meaning: "Emotional control: raw sum of 10 items (10 to 30)."
    briefa_self_monitor:
      meaning: "Self-monitor: raw sum of 6 items (6 to 18)."
    briefa_initiate:
      meaning: "Initiate: raw sum of 8 items (8 to 24)."
    briefa_working_memory:
      meaning: "Working memory: raw sum of 8 items (8 to 24)."
    briefa_plan_organize:
      meaning: "Plan and organize: raw sum of 10 items (10 to 30)."
    briefa_task_monitor:
      meaning: "Task monitor: raw sum of 6 items (6 to 18)."
    briefa_organization_materials:
      meaning: "Organization of materials: raw sum of 8 items (8 to 24)."
    briefa_bri:
      meaning: "Behavioral Regulation Index: raw sum of the scales inhibit, shift, emotional control and self-monitor (30 to 90)."
    briefa_mi:
      meaning: "Metacognition Index: raw sum of the scales initiate, working memory, plan and organize, task monitor and organization of materials (40 to 120)."
    briefa_gec:
      meaning: "Global Executive Composite: raw sum of the nine scales (70 to 210)."
  variables:
    briefa_negativity:
      meaning: "Negativity validity score, as stored (at most 10); the published rule was not found."
    briefa_infrequency:
      meaning: "Infrequency validity score, as stored: a count of 5 items, so at most 5; the published rule was not found."
    briefa_inconsistency:
      meaning: "Inconsistency validity score, as stored (at most 20); the published rule was not found."
    briefa_rater:
      meaning: "Relation of the rater to the patient. Filled on the informant form only, so a value here marks a visit of the informant form."
      polarity: not_applicable
    briefa_known_for:
      meaning: "For how long the rater has known the patient, in years (informant form only)."
      polarity: neutral
  flags:
    - "No document gives the wording of the answers 1 to 3 or says what a higher raw score means: no direction is written here. The scores are raw sums and no T-score is stored; the convention 'T 65 or more is clinically elevated' is 'to verify'."
    - "Respondent: two forms share every item and score column, an informant form (108 visits, 2009 to 2020) and the self-report form (678 visits, mostly from 2019). The export does not say which was filled; only the rater fields, filled on the informant form, tell them apart."
    - "Scale scores typed without the items (about 204 visits) are kept as stored; the typed composites read higher (median 151.5 against 141 for the computed ones)."
    - "7 visits have T-scores typed in the raw column (flagged out of range)."
    - "The composite rises over the years (median 122.5 to 129.5 until 2017, 132 to 149 from 2019), partly the change of form and of centres; no other cause is known."
    - "The scale names and items are those of the published profile and of the scripts of the forms; on the published side the structure is confirmed at abstract level only."

brief_parent:
  description: "The Behavior Rating Inventory of Executive Function filled by a parent for a child: 86 items answered from 1 to 3, eight scale scores, two indexes, a composite, two validity scores and the rater."
  version: "BRIEF, parent form, 86 items"
  reference: "Gioia GA, Isquith PK, Guy SC, Kenworthy L. BRIEF professional manual, PAR, 2000"
  reference_confidence: "to verify (manual not read; no page states the authors and year)"
  respondent: relative
  construct: executive_function
  sources: ["schema notes (asp brief_parent)", "scale_reference_aq_autism.md section 20", "docs/asp/PROGRESS.md D8"]
  scores:
    briefp_inhibit:
      meaning: "Inhibit: raw sum of 10 items answered from 1 to 3 (10 to 30)."
    briefp_shift:
      meaning: "Shift: raw sum of 8 items (8 to 24)."
    briefp_emotional_control:
      meaning: "Emotional control: raw sum of 10 items (10 to 30)."
    briefp_initiate:
      meaning: "Initiate: raw sum of 8 items (8 to 24)."
    briefp_working_memory:
      meaning: "Working memory: raw sum of 10 items (10 to 30)."
    briefp_plan_organize:
      meaning: "Plan and organize: raw sum of 12 items (12 to 36)."
    briefp_monitor:
      meaning: "Monitor: raw sum of 8 items (8 to 24)."
    briefp_organization_materials:
      meaning: "Organization of materials: raw sum of 6 items (6 to 18)."
    briefp_bri:
      meaning: "Behavioral Regulation Index: raw sum of the scales inhibit, shift and emotional control (28 to 84)."
    briefp_mi:
      meaning: "Metacognition Index: raw sum of the scales initiate, working memory, plan and organize, monitor and organization of materials (44 to 132)."
    briefp_gec:
      meaning: "Global Executive Composite: raw sum of the eight scales (72 to 216)."
  variables:
    briefp_negativity:
      meaning: "Negativity validity score, as stored and as the script of the form computes it (9 items counted; at most 10); the published rule was not found."
    briefp_inconsistency:
      meaning: "Inconsistency validity score, as stored and as the script of the form computes it (the item 44 is used twice; at most 20); the published rule was not found."
    briefp_rater:
      meaning: "Relation of the rater to the child."
      polarity: not_applicable
    briefp_known_for:
      meaning: "For how long the rater has known the child, in years."
      polarity: neutral
  flags:
    - "No document gives the wording of the answers 1 to 3 or says what a higher raw score means: no direction is written here. The scores are raw sums and no T-score is stored; the convention 'T 65 as the usual clinical elevation' is 'to verify'."
    - "Scale scores typed without the items (265 visits) are kept as stored. 23 typed values of the organization of materials are above its maximum of 18 (flagged out of range), and the typed Behavioral Regulation Index differs from the sum of the typed scales on 20 visits."
    - "The children's form and the adult form share the item columns; a visit is read as the adult form when it holds a score that only that form has. 9 visits with the first 75 items only are read as the children's form."
    - "The composite is lower in 2013 to 2015 (median 130 to 144.5, one centre) than from 2019 (150 to 163), with no known cause."
    - "A French version of the parent and teacher forms was studied in healthy children aged 5 to 18 (Fournet 2015, confirmed in source, abstract)."

bvaq:
  description: "A twenty-item form of the Bermond-Vorst Alexithymia Questionnaire, filled by adults at the inclusion visit: items answered from 1 to 5, five factor scores of four items each, two components (affective and cognitive) and a total."
  version: "20-item form (five dimensions of four items each); the published questionnaire has 40 items"
  reference: "Vorst HCM, Bermond B. Validity and reliability of the Bermond-Vorst Alexithymia Questionnaire. Pers Individ Dif 2001;30:413-434"
  reference_confidence: "cited by de Vroege 2018 (read); reference tool unchecked (HTTP 429)"
  respondent: patient
  construct: alexithymia
  sources: ["schema notes and labels (asp bvaq)", "scale_reference_aq_autism.md section 19", "docs/asp/PROGRESS.md D62"]
  scores:
    bvaq_verbalising:
      meaning: "Verbalising (difficulty putting emotions into words): sum of the items 1, 6, 11 and 16, with 6 and 11 reversed; 4 to 20."
      higher_means: more alexithymic
      polarity: worse
      basis: stated
      source: "schema label (asp bvaq): 'BVAQ verbalising (4 to 20, higher = more alexithymic)'"
    bvaq_fantasising:
      meaning: "Fantasising (reduced fantasy life): sum of the items 2, 7, 12 and 17, with 7 and 17 reversed; 4 to 20."
      higher_means: more reduced fantasy life (more alexithymic)
      polarity: worse
      basis: stated
      source: "schema labels (asp bvaq): the stored column is labelled 'factor 2: reduced fantasy life'; the factor is built like verbalising, labelled 'higher = more alexithymic'"
    bvaq_identifying:
      meaning: "Identifying (difficulty identifying emotions): sum of the items 3, 8, 13 and 18, with 8 and 18 reversed; 4 to 20."
      higher_means: more difficulty identifying emotions (more alexithymic)
      polarity: worse
      basis: stated
      source: "schema labels (asp bvaq): the stored column is labelled 'factor 3: difficulty identifying emotions'; the factor is built like verbalising, labelled 'higher = more alexithymic'"
    bvaq_emotionalising:
      meaning: "Emotionalising (low emotional reactivity): sum of the items 4, 9, 14 and 19, with 9 and 19 reversed; 4 to 20."
      higher_means: lower emotional reactivity (more alexithymic)
      polarity: worse
      basis: stated
      source: "schema labels (asp bvaq): the stored column is labelled 'factor 4: low emotional reactivity'; the factor is built like verbalising, labelled 'higher = more alexithymic'"
    bvaq_analysing:
      meaning: "Analysing (externally oriented thinking): sum of the items 5, 10, 15 and 20, with 10 and 20 reversed; 4 to 20."
      higher_means: more externally oriented thinking (more alexithymic)
      polarity: worse
      basis: stated
      source: "schema labels (asp bvaq): the stored column is labelled 'factor 5: externally oriented thinking'; the factor is built like verbalising, labelled 'higher = more alexithymic'"
    bvaq_affective:
      meaning: "Affective component: fantasising plus emotionalising, 8 to 40."
      higher_means: more alexithymic on the affective component
      polarity: worse
      basis: stated
      source: "schema notes and labels (asp bvaq): sum of two factors, each counting a deficit"
    bvaq_cognitive:
      meaning: "Cognitive component: verbalising plus identifying plus analysing, 12 to 60."
      higher_means: more alexithymic on the cognitive component
      polarity: worse
      basis: stated
      source: "schema notes and labels (asp bvaq): sum of three factors, verbalising among them ('higher = more alexithymic')"
    bvaq_total:
      meaning: "Total: affective plus cognitive component, 20 to 100."
      higher_means: more alexithymic
      polarity: worse
      basis: stated
      source: "schema notes and labels (asp bvaq): sum of the five factors, verbalising among them ('higher = more alexithymic')"
  flags:
    - "Identified as a twenty-item form of the BVAQ, 'likely'. The key delivered is that of the script of the form; whether a twenty-item form is published, and its key, were not settled, so the key is 'to verify'."
    - "Only the verbalising label states the direction in words. For the other factors it is read from the labels of the stored columns (reduced fantasy life, difficulty identifying emotions, low emotional reactivity, externally oriented thinking), not from a publication."
    - "Before 2025 the form stored the factor scores inverted (24 minus the right sum) on 289 of the 441 visits with the twenty items. The delivered scores are recomputed from the items on every visit, so they differ from the stored values on 262 to 272 visits per factor."
    - "Scores typed without items (172 visits) are kept as stored; on 71 of them the stored affective and cognitive components are exchanged and are not corrected."
    - "No cut-off and no French version were found in the literature check (to verify)."

cdi:
  description: "The Children's Depression Inventory: twenty-seven items answered from 0 to 2 by the child about the past two weeks, and a total. The adults fill the BDI-II."
  version: "27 items"
  reference: "Kovacs M. The Children's Depression Inventory (CDI). Psychopharmacol Bull 1985;21:995-998 (PMID 4089116)"
  reference_confidence: "reference confirmed (Europe PMC record, no abstract); reference tool unchecked (HTTP 429)"
  respondent: patient
  construct: depression
  period: "past two weeks"
  sources: ["schema notes (asp cdi)", "scale_reference_aq_autism.md section 25"]
  items:
    meaning: "Items as answered, 0 to 2. Thirteen items (2, 5, 7, 8, 10, 11, 13, 15, 16, 18, 21, 24 and 25) are reversed in the total."
    higher_means: "more severe symptom, for the items that the total does not reverse"
    polarity: worse
    basis: literature
    source: "scale_reference_aq_autism.md section 25: three statements graded 0-2 in order of increasing severity (confirmed in source, extracted: Bang 2015)"
  scores:
    cdi_total:
      meaning: "Total: sum of the twenty-seven items with thirteen reversed, 0 to 54."
      higher_means: more severe depressive symptoms
      polarity: worse
      basis: literature
      source: "scale_reference_aq_autism.md section 25: items graded 0-2 in order of increasing severity, total 0-54 (confirmed in source, extracted: Bang 2015)"
      cutoffs:
        - {value: "13", meaning: "cut-off of Kovacs for clinic-referred children", source: "Bang 2015, reported in scale_reference_aq_autism.md section 25", confidence: "confirmed in source (extracted, secondary: Bang 2015)"}
        - {value: "19 or 20", meaning: "cut-off of Kovacs for non-clinical samples (20 favoured for general screening)", source: "Bang 2015, reported in scale_reference_aq_autism.md section 25", confidence: "confirmed in source (extracted, secondary: Bang 2015)"}
  flags:
    - "The list of thirteen reversed items is the schema's key, fitted on the data (it gives the stored total on 316 of 341 complete visits); the published key was not read (to verify)."
    - "Totals typed without any item (114 visits) are kept as stored. They read higher than the computed ones (median 15.5 against 11); the rule applied by hand is not known."
    - "On 25 visits of 2021 to 2023 the stored total is not the published sum (one point off on 20 of them); the delivered total is the sum."
    - "Other cut-offs are published (Korean adolescents: 20 for screening, 15, 20 and 25 for mild, moderate and severe). No French version was found in the literature check."

gsq:
  description: "The Glasgow Sensory Questionnaire, filled by adults at the inclusion visit: forty-two items answered from 0 to 4 on how often sensory experiences happen, a hyper-sensitivity and a hypo-sensitivity score for each of seven senses, seven scores that add the two, and a total."
  version: "42 items"
  reference: "Robertson AE, Simmons DR. The relationship between sensory sensitivity and autistic traits in the general population. J Autism Dev Disord 2013;43:775-784 (PMID 22832890)"
  reference_confidence: "confirmed in source (abstract); the abstract does not name the GSQ"
  respondent: patient
  construct: sensory_processing
  sources: ["schema notes (asp gsq)", "scale_reference_aq_autism.md section 16", "docs/asp/PROGRESS.md D14 and D64"]
  items:
    higher_means: more frequent sensory experience of the kind the item describes
    polarity: worse
    basis: literature
    source: "scale_reference_aq_autism.md section 16: five answers (never, rarely, sometimes, often, always) scored 0-4, higher means greater sensitivity, no reversed items mentioned (confirmed in source, extracted, secondary: Jakob 2025)"
  scores:
    gsq_total:
