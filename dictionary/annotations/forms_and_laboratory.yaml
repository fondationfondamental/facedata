  reference: not_applicable
  construct: care_use
  period: the last 12 months, at inclusion and at follow-up alike
  sources:
  - schema notes (asp care_costs)
  flags:
  - 'The section belongs to the medico-economic module added in 2020 and 2021: an earlier visit is ''not asked'', not missing.'
