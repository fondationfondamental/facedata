# Annotations of the group forms_and_laboratory: forms of the application and laboratory panels of FACE BP, SZ, DR
# and ASP. Written from the schema notes and from local/out/scale_reference_rest.md; a field left out is not documented.
allergic_history_fu:
  description: 'Medical history at the yearly follow-up visits: allergic and inflammatory diseases (asthma, another allergy,
    lupus, rheumatoid arthritis, another autoimmune disease). The inclusion form asked again, as an update given at that
    visit.'
  reference: not_applicable
  respondent: clinician
  construct: somatic_history
  period: an update given at the yearly visit (neither the whole life nor strictly the time since the last visit)
  sources:
  - schema notes (bp, sz, dr allergic_history_fu)
  flags:
  - 'A follow-up answer is the inclusion form asked again, with no period in its wording: a disease answered yes at inclusion
    is often answered no. Do not stack the _fu answers with the _v0 answers.'
  - 'BP and SZ: the yearly form starts with ''is there a change since the last visit?'', which is not exported, so an empty
    yearly section may mean ''no change''. DR has no such question and asks the block at the visits of 2 and 4 years.'
  - 'SZ asks about ''allergic diseases'' only (asthma and allergy; the gate is named allergic_disease_*): it is not the
    BP and DR question, and 29% of its inclusion answers are yes against 8.8% in BP. In SZ lupus and rheumatoid arthritis
    are in the auto-immune section.'
  - This section has no 'no for all' shortcut and is not emptied in 2022, unlike most sections of the BP medical history.
  - Yes is 1 and no is 0; 'unknown' is a missing code. The details (date of onset, treated, controlled) are asked only after
    a yes and are missing otherwise (SZ asks 'treated' only).
allergic_history_v0:
  description: 'Medical history at the inclusion visit, about the whole life: allergic and inflammatory diseases (asthma,
