  reference: not_applicable
  construct: social_situation
  period: the last 12 months, at inclusion and at follow-up alike
  sources:
  - schema notes (asp child_living_conditions)
  flags:
  - 'The section belongs to the medico-economic module added in 2020 and 2021: an earlier visit is ''not asked'', not missing.'
  - 'The adult form and the child form write one table, and the application saves a 0 in every unticked box, the boxes of
    the form not shown included: those zeros are delivered as missing.'
occupation:
  description: 'Occupation and activity (ASP): the occupational class (first level of the INSEE classes, with ''student''
    added) and the kind of current activity, at inclusion and at follow-up.'
  reference: not_applicable
  respondent: clinician
  construct: education_employment
  sources:
  - schema notes (asp occupation)
  - scale_reference_rest.md section 12
  flags:
  - job_class carries the labels of the DR job_class for its eight INSEE classes; 'student' is ASP only and 'not applicable'
    is missing. The structure of the INSEE classes is confirmed in scale_reference_rest.md section 12; the names of the
    groups are 'to verify' there.
  - The occupation follows the age of the patients (the children are students).
parents_health:
  description: 'Health of the two parents (ASP, parents'' form of the medico-economic module): for each parent, twelve boxes
    of somatic history, fifteen boxes of psychiatric disorders, the consultations of the last year (general practitioner,
    psychiatrist, psychologist), a psychotropic treatment and a parents'' group.'
  reference: not_applicable
  construct: family_history
  period: the last 12 months, at inclusion and at follow-up alike
  sources:
  - schema notes (asp parents_health)
  flags:
  - 'The section belongs to the medico-economic module added in 2020 and 2021: an earlier visit is ''not asked'', not missing.'
  - Filled for children, in two centres only.
  - The columns named dsmv are the disorders of each parent, not criteria of the patient.
  - 'The history, disorder and place boxes are saved 0 on every save, also with an empty question: flag derived_doubt there.'
  - The share of parents who saw a general practitioner falls from 67% in 2021 to 7% to 25% from 2023, with no known cause.
parents_situation:
  description: 'Situation of the two parents (ASP, parents'' form of the medico-economic module): for each parent, the marital
    status, the level of education, the languages, the children and their custody, the employment and work arrangements,
    absences from work for the child, and the resources and allowances.'
  reference: not_applicable
  construct: social_situation
  period: the last 12 months, at inclusion and at follow-up alike
  sources:
  - schema notes (asp parents_situation)
  flags:
  - 'The section belongs to the medico-economic module added in 2020 and 2021: an earlier visit is ''not asked'', not missing.'
  - Filled for children, in two centres only.
  - The level of education is a category of five answers (primary school to higher education), not a number, and the level
    of French is not an ordered scale.
  - Full time is 1 and part time 0 on this form. The block of parent 2 prints 'parent 1' in two of its questions; the answers
    are read as those of parent 2.
pddqol:
  description: 'Parents'' quality of life questionnaire (ASP): seventeen items answered from 1 to 5 by a parent of a child.
    The items are delivered as they are; no score is computed.'
  version: Par-DD-QoL, 17 items (form 352 of the application)
  reference: Baghdadli A, Pry R, Michelon C, Rattaz C. Impact of autism in adolescents on parental quality of life. Qual
    Life Res 2014;23:1859-68 (PMID 24504623)
  reference_confidence: Abstract confirmed; full text paywalled
  respondent: relative
  construct: quality_of_life
  sources:
  - schema notes (asp pddqol)
  - scale_reference_rest.md section 10
  items:
    higher_means: a worse answer
    polarity: worse
    basis: stated
    source: 'schema notes (asp pddqol): ''seventeen radios from 1 to 5, a higher answer worse'''
  flags:
  - 'The published scale has an emotional and a daily-disturbance dimension and a global score from 0 to 100. Which items
    make each dimension, the 0-100 transformation and its direction are not settled (''to verify''): do not rebuild the
    published scores without the paper.'
  - Filled for children in two centres, from 2021. The items 1 to 16 hang together (Cronbach alpha 0.93 on the data).
schooling:
  description: 'Schooling (ASP): ordinary schooling, repeated years, support at school and its kind, the highest class reached
    (free text) and the time at school, at inclusion and at follow-up.'
  reference: not_applicable
  respondent: clinician
  construct: education_employment
  sources:
  - schema notes (asp schooling)
  flags:
  - 'Two forms: the time at school, the full-time schooling, the time out of school and the help in class are on the inclusion
    form of 2019 only; the zeros of the other records, where they were never asked, are delivered as missing.'
  - 'The years of education are not delivered: their scale differs between centres.'
  - The support at school of children falls over the years (82% in the first years, 26% from 2021), partly a change of the
    mix of centres; the cause of the later fall is not known.
  - '''Not known'' is delivered as missing. The weeks out of school stop at 99 (right-censored).'
work:
  description: 'Work and living situation (ASP, adult and child forms of the medico-economic module): the work contracts
    of the last 12 months, their length and kind, the sick leave during them, the situation without a contract and the kind
    of housing.'
  reference: not_applicable
  construct: education_employment
  period: the last 12 months, at inclusion and at follow-up alike
  sources:
  - schema notes (asp work)
  flags:
  - 'The section belongs to the medico-economic module added in 2020 and 2021: an earlier visit is ''not asked'', not missing.'
  - 'sick_leave_12m here is ''off work during the work contracts of the last 12 months'': not the same question as the sick_leave_12m
    of BP, SZ and DR (sick_leave_v0).'
  - The weeks under contract and the weeks of sick leave are 0 after a 'no'; the weeks stop at 52.
  - A work contract in the last year follows the age mix of the patients (children have almost none).
