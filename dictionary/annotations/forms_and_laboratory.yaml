somatic_history_fu:
  description: 'Somatic history at the yearly follow-up visits (ASP), the questions: one yes/no question per body system
    (eight systems, each with a list of diseases in the table treatments), then gynaecology, genetic diseases, other diseases
    and allergy. The inclusion form asked again, with one more question, ''change since the last visit''.'
  reference: not_applicable
  respondent: clinician
  construct: somatic_history
  period: an update given at the yearly visit (neither the whole life nor strictly the time since the last visit)
  sources:
  - schema notes (asp somatic_history_fu)
  flags:
  - 'A yearly answer is an update given at that visit: 31% of the yearly answers to a question answered yes at inclusion
    are no. Do not stack the _fu answers with the _v0 answers.'
  - 'After a ''no change'' (somatic_history_changed_fu) most visits leave the whole section empty: an empty yearly section
    may mean ''no change'', and it stays missing.'
  - More than half of the yes at the yearly visits have no list of diseases.
  - 'The five gynaecology boxes are saved 0 when not ticked: a 0 is ''not ticked'', never an explicit no. The gynaecology
    question is answered for men too: filter on the sex of the patient.'
  - '''Not known'' is delivered as missing.'
somatic_history_v0:
  description: 'Somatic history at the inclusion visit (ASP), the questions: one yes/no question per body system (eight
    systems, each with a list of diseases in the table treatments), then gynaecology, genetic diseases, other diseases and
    allergy.'
  reference: not_applicable
  respondent: clinician
  construct: somatic_history
  period: asked at the inclusion visit
  sources:
  - schema notes (asp somatic_history_v0)
  flags:
  - 'The shortcut ''no for all'' of the form (not exported) fills every question with 0: all twelve answers are 0 on 28%
    to 31% of the answered inclusion visits of 2021 to 2023, and the yes per visit fall gradually from 2017. Such a section
    cannot be told from a real ''no for all''; the share of yes is not a prevalence and is not comparable across years.'
  - The diseases after a yes are rows of the lists somatic_ent, somatic_cardiac, somatic_pulmonary, somatic_rheumatology,
    somatic_digestive, somatic_endocrine, somatic_neurological and somatic_cancer; 11% of the yes at inclusion have no list.
  - 'The five gynaecology boxes are saved 0 when not ticked: a 0 is ''not ticked'', never an explicit no. The gynaecology
    question is answered for men too: filter on the sex of the patient.'
  - The allergy question holds only yes or nothing until 2019.
  - The share of yes also follows the age mix (children have fewer yes) and the habits of the centres. 'Not known' is delivered
    as missing.
somatic_neurological:
  description: 'Somatic history of the nervous system (ASP), one row per visit and disease in the table treatments (list
