  - 'A visit''s list holds the rows typed at that visit: the lifetime history is the union of the visits.'
vaccinations:
  description: 'Vaccinations (ASP): seven lines of the vaccination record, each with a vaccine of the list of the form (diphtheria,
    tetanus, poliomyelitis, pertussis, BCG, measles, rubella, smallpox) and a box done or not done. Mostly inclusion visits.'
  reference: not_applicable
  respondent: clinician
  construct: somatic_history
  sources:
  - schema notes (asp vaccinations)
  flags:
  - 'A line is a position in the table, not a vaccine, and some visits repeat a vaccine on two lines: read the vaccines
    of a visit as a set over the seven lines.'
  - A record is held by 36% of the inclusion visits of children and 12% of those of adults.
biobank:
  description: 'Samples for the biobank (ASP): whether a sample was taken, and a second one, with their dates.'
  reference: not_applicable
  respondent: clinician
  construct: visit_administration
  sources:
  - schema notes (asp biobank)
  flags:
  - 'The questions are administrative: the answer follows the centre, not the patient (five centres have any yes).'
  - The date of the sample is often after the date of the visit.
examinations:
  description: 'Complementary examinations (ASP): brain CT scan, brain MRI, EEG, karyotype or CGH array, fragile X test,
    audiogram, auditory evoked potentials and another examination, each with a result (normal, abnormal, result unknown,
    not done) and a date, and an eye-tracking result.'
  reference: not_applicable
  respondent: clinician
  construct: laboratory_other
  period: past examinations, recorded at the visit
  sources:
  - schema notes (asp examinations)
  flags:
  - '''Not done'' is an answer and is delivered as such, not as a missing value.'
  - The dates are those of past examinations, often years before the visit; the karyotype and the fragile X test are often
    dated on or after the day of the visit, which is expected.
puberty_and_handedness:
  description: Handedness (right, left, both) and the four Tanner stages of puberty from 1 to 5 (genitals and pubic hair
    for the boys, breasts and pubic hair for the girls), from the clinical examination (ASP).
  reference: Marshall WA, Tanner JM. Arch Dis Child 1969;44:291 (girls) and 1970;45:13 (boys)
  reference_confidence: Citations confirmed; range from memory (high confidence), text not read
  respondent: clinician
  construct: puberty
  sources:
  - schema notes (asp puberty_and_handedness)
  - scale_reference_rest.md section 5
  variables:
    handedness:
      construct: handedness
      meaning: Handedness as one answer of the clinical examination (right, left, both), not a handedness inventory.
    tanner_*:
      meaning: Tanner stage of puberty, rated separately for the genitals or the breasts and for the pubic hair.
      higher_means: more advanced puberty (1 prepubertal, 5 adult)
      polarity: neutral
      basis: literature
      source: 'scale_reference_rest.md section 5 (Marshall & Tanner 1969, 1970): citations confirmed; range from memory
        (high confidence), text not read'
  flags:
  - 'The form has no sex or age gate: the stages are filled for adults too, and a few boys'' stages are typed for girls
    (kept as recorded).'
  - The stages follow the age of the patients, and the age mix differs between centres and years.
earlier_diagnosis:
  description: 'Diagnoses made before the expert centre (ASP), one value per patient in the table patients, from the form
    filled before the assessment: an earlier autism spectrum diagnosis, its date and who made it, and another earlier diagnosis
    with its kind.'
  reference: not_applicable
  respondent: clinician
  construct: psychiatric_diagnosis
  sources:
  - schema notes (asp earlier_diagnosis)
  flags:
  - Filled for 62% of the adults and 24% of the children.
  - 'other_earlier_diagnosis_kind is a multiple choice of the form of which the export keeps one box, the lowest-numbered
    one ticked: the other diagnoses ticked are lost.'
  - '''Not known'' is delivered as missing.'
expert_centre_referral:
  description: 'Criteria for an assessment at the expert centre (ASP), one value per patient in the table patients: six
    yes/no criteria that the patient must meet, the date of the first assessment and a remark.'
  reference: not_applicable
  respondent: clinician
  construct: visit_administration
  sources:
  - schema notes (asp expert_centre_referral)
  flags:
  - 'It is not the referral of BP and SZ (who sent the patient, from where): those fields are not exported for ASP.'
  - Each criterion is yes for 96% to 100% of the patients; the form is filled for 57% of the adults and 21% of the children.
non_drug_care:
  description: 'Non-drug care (ASP), one value per patient in the table patients, from the form filled before the assessment:
    fifteen yes/no boxes (medico-psychological centres, day hospital, medico-educational institutes, home care service,
    school inclusion, speech therapist, psychomotor therapist, psychologist, psychiatrist, occupational therapist, social
    skills group, mobile autism team, other).'
  reference: not_applicable
  respondent: clinician
  construct: non_drug_treatment
  sources:
  - schema notes (asp non_drug_care)
  flags:
  - 'The first five boxes (CMP, CMPP, day hospital, IME, IMPRO) are no longer printed by the forms from about 2021: their
    0 from 2022 is not an answer and is delivered as missing (period_removed).'
  - Filled for 64% of the adults and 25% of the children.
screening_criteria_child:
  description: 'Checklist of fourteen yes/no criteria at screening, for children (ASP), one value per patient in the table
    patients: four criteria of social interaction, four of communication, four of restricted interests, the onset before
    three years and the exclusion criterion.'
  reference: Screening interview of the Adult Asperger Assessment (Baron-Cohen 2005), as the thesaurus names it, under the
    heading 'child'; the layout is that of the DSM-IV-TR criteria of autistic disorder
  reference_confidence: cited in schema notes
  respondent: clinician
  construct: psychiatric_diagnosis
  sources:
  - schema notes (asp screening_criteria_child)
  flags:
  - Filled for about 125 patients, all but a few of them children, included from 2018 to 2025.
  - No count of criteria is stored and none is computed.
screening_form:
  description: 'Conclusion of the screening form filled before the assessment (ASP), one value per patient in the table
    patients: an autism spectrum disorder evoked, rejected or deferred, the probable diagnosis, whether an assessment at
    the expert centre was scheduled and why not, and free texts.'
  reference: not_applicable
  respondent: clinician
  construct: psychiatric_diagnosis
  sources:
  - schema notes (asp screening_form)
  flags:
  - 'It is not the diagnosis of the cohort (diagnosis in identite): 57 of the 868 patients for whom an autism spectrum disorder
    is evoked do not have a confirmed diagnosis.'
  - The answer 'deferred' was removed in 2021, and the two lists of probable diagnoses were last filled in 2020.
  - Filled for 62% of the adults and 20% of the children.
adult_support:
  description: 'Support of the adult patient (ASP, adult form of the medico-economic module): the employment and disability
