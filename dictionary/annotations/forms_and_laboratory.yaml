  flags:
  - 'Read the list with the gate of the same visit (history_cardiac_v0 or _fu in somatic_history_v0 and _fu): a gate 0 means
    none, an empty gate or ''not known'' means not known. 9.5% of the yes at inclusion have no list.'
  - 'A visit''s list holds the rows typed at that visit: the lifetime history is the union of the visits.'
somatic_digestive:
  description: 'Somatic history of the liver and digestive tract (ASP), one row per visit and disease in the table treatments
