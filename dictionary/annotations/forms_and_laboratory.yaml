family_history:
  description: 'Family history, one row per patient and relative in the table relatives: the mood or psychotic disorder
    of the relative and suicide, and in BP and DR also substances, anxiety, dementia and cardiovascular risk factors (BP:
    also the birth and the death of the relative). A family is described once, most often at the inclusion visit, and the
    first answer is kept.'
  reference: not_applicable
  respondent: clinician
  construct: family_history
  sources:
  - schema notes (bp, sz, dr family_history)
  - docs/ARCHITECTURE.md section 4 (relatives)
  - docs/SCHEMA_SPEC.md section 16
  flags:
  - A row does not say that the relative has a disorder (half of the BP rows hold only a birth date or a death), and a relative
    answered 'no' in family_structure has nothing to describe. To ask 'does a relative have it', use the columns fdr_ and
    gp_ of the table patients (1, 0 or missing), not the rows.
  - 'BP: ''sister 1'' is the first of the affected sisters, not the eldest; at most five relatives of a kind are described.'
  - 'SZ: the parents, the sisters and the brothers only, with two questions (disorder, suicide); filter degree == 1 to compare
    with BP.'
  - 'DR: the children and the siblings are one arbitrary relative per group (the export keeps one record), so these rows
    do not join the BP rows; DR asks the kind of mood disorder (relative_mood_disorder_kind), not the BP list relative_disorder.'
  - 'relative_suicide is one answer (none, attempt, completed): a relative who died by suicide is not among the attempts.'
  - 'BP: an empty relative_deceased is not ''alive'' (the question was not asked everywhere before 2014), and from 2022
    the dates of birth and of death are almost never typed.'
family_structure:
  description: 'Family structure, one value per patient in the table patients: how many daughters, sons, sisters and brothers
    the patient has, how many of them are ''affected'', and whether each parent (and each grandparent in BP and DR) is.
    Asked once, most often at inclusion; the first answer is kept.'
  reference: not_applicable
  respondent: clinician
  construct: family_history
  sources:
  - schema notes (bp, sz, dr family_structure)
  flags:
  - 'BP and SZ: ''affected'' means a psychiatric disorder, an abuse of or dependence on a substance, a suicide attempt or
    a cardiovascular risk factor. A yes is therefore not a psychiatric history: it can be hypertension alone.'
  - 'DR asks the psychiatric history and the cardiovascular risk factors as two questions, under other names (mother_psychiatric_history,
    n_siblings_cardiovascular_risk): not the BP and SZ variables.'
  - 'BP and SZ: the answer ''more than 5'' relatives is lost by the export (empty cell). A 5 is exactly five, and an empty
    number beside a filled number of affected relatives may be ''more than 5''.'
  - 'SZ: the share of parents answered yes falls with the year of inclusion (mothers 43% in 2010-2017, 30% in 2018-2026);
    the cause is not known.'
