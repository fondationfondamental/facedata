    yearly section may mean ''no change''. DR has no such question and asks the block at the visits of 2 and 4 years.'
  - 'BP and SZ show the section to everyone: some men have answers (almost always ''none'' and ''no''). Filter on the sex
    of the patient. In DR the section is hidden for men.'
  - The numbers of pregnancies and the menopause mostly agree between the inclusion and the yearly answers; only the gynaecological
    disease behaves like the diseases of the other sections.
  - This section has no 'no for all' shortcut and is not emptied in 2022.
  - Yes is 1 and no is 0; 'unknown' is a missing code. The details (date of onset, treated, controlled) are asked only after
