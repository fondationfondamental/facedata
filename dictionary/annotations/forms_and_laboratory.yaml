  flags:
  - 'The section belongs to the medico-economic module added in 2020 and 2021: an earlier visit is ''not asked'', not missing.'
  - 'The adult form and the child form write one table, and the application saves a 0 in every unticked box, the boxes of
    the form not shown included: those zeros are delivered as missing.'
  - The minutes of help of a relative a day stop at 99 (right-censored, delivered as typed).
care_consumption:
  description: 'Use of care in the last year (ASP, medico-economic module): the date and the cost of the diagnosis, emergency
    visits, hospitalisations, the number of consultations by kind of professional in private practice and in a public service,
    the care package, travel for care and groups for the relatives.'
  reference: not_applicable
  construct: care_use
  period: the last 12 months, at inclusion and at follow-up alike
  sources:
  - schema notes (asp care_consumption)
  flags:
  - 'The section belongs to the medico-economic module added in 2020 and 2021: an earlier visit is ''not asked'', not missing.'
  - 'The adult form and the child form write one table, and the application saves a 0 in every unticked box, the boxes of
