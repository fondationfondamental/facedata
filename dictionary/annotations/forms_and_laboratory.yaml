    means none, an empty gate or ''not known'' means not known. A third of the yes at inclusion (153 of 460) have no list.'
  - 'A visit''s list holds the rows typed at that visit: the lifetime history is the union of the visits.'
  - 'Until 2020 the lung history is probably contaminated by allergies: many visits have the lung question yes, no lung
    list and the allergy question yes.'
somatic_rheumatology:
  description: 'Somatic history of the bones, joints and skin (ASP), one row per visit and disease in the table treatments
