    menopause, its date and its hormone therapy, and a gynaecological disease other than a cancer (SZ: number of pregnancies,
    menopause and hormone therapy only). The inclusion form asked again, as an update given at that visit.'
  reference: not_applicable
  respondent: clinician
  construct: somatic_history
  period: an update given at the yearly visit (neither the whole life nor strictly the time since the last visit)
  sources:
