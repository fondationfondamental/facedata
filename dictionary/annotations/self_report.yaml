ephp:
  description: EPHP, the scale of assessment of the processes of psychic handicap. Thirteen items from 0 (great difficulty) to 6 (no difficulty), in four domains, filled by someone close to the patient.
  version: 13 items
  reference: "Passerieux C, Bulot V, Hardy-Baylé MC. Une contribution à l'évaluation du handicap psychique : l'échelle d'évaluation des processus du handicap psychique (EPHP). Alter - European Journal of Disability Research 2012"
  reference_confidence: "Partial (secondary; the article was not read). Volume and pages to verify"
  respondent: relative
  construct: psychosocial_functioning
  sources: ["schema notes (sz ephp)", "scale_reference_aq_general.md section 4"]
  items:
    higher_means: less difficulty (0 great difficulty to 6 no difficulty)
    polarity: better
    basis: anchors
    source: "labels of the items: '(0 great difficulty to 6 no difficulty)'"
  scores:
    ephp_cognition:
      meaning: Cognitive abilities, the sum of items 1 to 4 (0 to 24).
      higher_means: less difficulty with cognitive abilities
      polarity: better
      basis: anchors
      source: "labels of the items: '(0 great difficulty to 6 no difficulty)', plain sum"
    ephp_motivation:
      meaning: Motivation, the sum of items 5 to 8 (0 to 24).
      higher_means: less difficulty with motivation
      polarity: better
      basis: anchors
      source: "labels of the items: '(0 great difficulty to 6 no difficulty)', plain sum"
    ephp_social_cognition:
      meaning: Communication and understanding of others, the sum of items 9 to 11 (0 to 18).
      construct: social_cognition
      higher_means: less difficulty with communication and the understanding of others
      polarity: better
      basis: anchors
      source: "labels of the items: '(0 great difficulty to 6 no difficulty)', plain sum"
    ephp_self_assessment:
      meaning: Self-assessment of abilities and asking for help, the sum of items 12 and 13 (0 to 12).
      higher_means: less difficulty with the self-assessment of abilities and asking for help
      polarity: better
      basis: anchors
      source: "labels of the items: '(0 great difficulty to 6 no difficulty)', plain sum"
    ephp_total:
      meaning: Sum of the four sub-scores (13 items, 0 to 78).
      higher_means: less handicap
      polarity: better
      basis: stated
      source: "label of the score: 'EPHP total (13 items, 0 to 78, higher is less handicap)'"
  flags:
    - "The answer 7, 'cannot be assessed', is missing in the items and counts 0 points in the scores, as the application does since 2026-10-28. A score therefore leans toward the worst rating where an item could not be assessed (228 totals)."
    - No published scoring rule was found. The rater, the response scale and the sub-scores are 'To verify' in the literature notes; the dictionary says that someone close to the patient fills it.
    - The stored scores counted the 7 as 7 points and are checks only.

physical_activity:
  description: Physical activity over the last seven days, reported by the patient. Days of vigorous activity, of moderate activity and of walking, the time per day, the walking pace and the time spent sitting. No score.
  respondent: patient
  construct: physical_activity
  period: last seven days
  sources: ["schema notes (sz physical_activity, dr physical_activity)", "scale_reference_aq_general.md section 33", "facedata/common_instruments.yaml"]
  variables:
    vigorous_days:
      meaning: Days of vigorous physical activity in the last 7 days (0 to 7).
      higher_means: more days of vigorous activity
      polarity: neutral
      basis: anchors
      source: "label of the variable"
    moderate_days:
      meaning: Days of moderate physical activity in the last 7 days (0 to 7).
      higher_means: more days of moderate activity
      polarity: neutral
      basis: anchors
      source: "label of the variable"
    walking_days:
      meaning: Days with a walk of ten minutes or more in the last 7 days (0 to 7).
      higher_means: more days with a walk
      polarity: neutral
      basis: anchors
      source: "label of the variable"
    walking_pace:
      meaning: Usual walking pace (1 slow, 2 moderate, 3 brisk). The DR form stores it the other way round and is read back.
      higher_means: brisker pace
      polarity: neutral
      basis: anchors
      source: "label of the variable: '(1 slow, 2 moderate, 3 brisk)'"
    "*_hours":
      meaning: The hours typed for the duration on such a day. One of two fields of a duration, delivered as typed.
    "*_minutes":
      meaning: The minutes typed for the duration on such a day. One of two fields of a duration, delivered as typed; some cells hold a whole duration in minutes.
  flags:
    - "Each duration has two fields, hours and minutes, which the patients use in three ways (both, hours only, minutes only). No duration and no total is computed: the analyst decides the rule."
    - The schema does not name the questionnaire and gives no reference. Its content is that of the IPAQ short form described in the literature notes (section 33), which is not confirmed as the form used.
    - The hours, the minutes and the pace are shown only after a number of days of 1 or more.
    - In DR a sitting time above 24 hours is not delivered.

presenteeism:
  description: Questions B3 to B11 of a questionnaire on work, filled by the patients who work. Hours worked and expected, days of work missed or worked extra in the last 28 days, and three ratings of performance from 0 to 10. No score.
  respondent: patient
  construct: work_productivity
  period: last 7 days and last 28 days
  sources: ["schema notes (sz presenteeism)"]
  variables:
    work_hours_7_days:
      meaning: Hours worked in the last 7 days.
      polarity: neutral
    work_hours_expected:
      meaning: Hours the employer expects in a typical week of 7 days.
      polarity: neutral
    work_hours_28_days:
      meaning: Hours worked in the last 28 days.
      polarity: neutral
    work_days_missed_health:
      meaning: Whole days of work missed for a physical or mental health problem, in the last 28 days.
      higher_means: more days of work missed for health
      polarity: worse
      basis: anchors
      source: "label of the variable"
    work_days_part_missed_health:
      meaning: Days of work missed in part for a physical or mental health problem, in the last 28 days.
      higher_means: more days of work missed in part for health
      polarity: worse
      basis: anchors
      source: "label of the variable"
    work_days_missed_other:
      meaning: Whole days of work missed for any other reason, in the last 28 days.
      polarity: neutral
    work_days_part_missed_other:
      meaning: Days of work missed in part for any other reason, in the last 28 days.
      polarity: neutral
    work_days_extra:
      meaning: Days of coming early, leaving late or working on a day off, in the last 28 days.
      polarity: neutral
    work_performance_others:
      meaning: Usual performance of most workers in a similar job (0 worst to 10 best).
      higher_means: better performance
      polarity: better
      basis: anchors
      source: "label of the variable: '(0 worst to 10 best)'"
    work_performance_usual:
      meaning: Own usual performance over the last year or two (0 worst to 10 best).
      higher_means: better performance
      polarity: better
      basis: anchors
      source: "label of the variable: '(0 worst to 10 best)'"
    work_performance_28_days:
      meaning: Own performance on the days worked in the last 28 days (0 worst to 10 best).
      higher_means: better performance
      polarity: better
      basis: anchors
      source: "label of the variable: '(0 worst to 10 best)'"
  flags:
    - The schema does not name the questionnaire and gives no reference. No score is computed.
    - "The numbers are typed freely. Impossible values are out of range, and two inconsistencies between questions are kept as typed (days missed adding up to more than 28; hours of 28 days under those of the last 7)."
    - Filled only by the patients who work.

sogs:
  description: South Oaks Gambling Screen, filled by few patients. Kinds of gambling, the largest amount gambled, and yes/no questions on gambling problems and on borrowed money. The total is delivered as stored.
  reference: "Lesieur HR, Blume SB. Am J Psychiatry 1987;144:1184-1188 (PMID 3631315)"
  reference_confidence: Confirmed (abstract)
  respondent: patient
  construct: gambling
  period: "lifetime in the original; questions 4, 5 and 6 are worded for the last 12 months"
  sources: ["schema notes (sz sogs)", "scale_reference_aq_general.md section 8"]
  variables:
    sogs_total:
      meaning: SOGS total as stored (0 to 20), computed by the application. It is not recomputed by the package.
      higher_means: more gambling problems
      polarity: worse
      basis: literature
      source: "section 8: '0 no problem; 1-4 some problems; >= 5 probable pathological gambler', Confirmed (direct)"
      cutoffs:
        - value: "5 or more"
          meaning: "probable pathological gambler (published reading; 1 to 4 some problems, 0 no problem)"
          source: "score sheet of 2003, section 8"
          confidence: "Confirmed (direct). The key of the application differs: item 4 counts 1 for any answer, so every stored total is 1 or more"
    sogs_largest_amount:
      meaning: Largest amount gambled in one day. The unit is not given.
      higher_means: larger amount
      polarity: neutral
      basis: anchors
      source: "label of the variable"
    "sogs01*":
      meaning: "A kind of gambling: 0 never, 1 at least once a week, 2 less than once a week. The codes are not in order of frequency, and the item is not counted in the total."
      polarity: not_applicable
    sogs04:
      meaning: "Went back another day to win back the money lost: 0 never, 1 most of the times I lose, 2 sometimes, 3 every time. The codes are not in order of frequency."
      polarity: not_applicable
    sogs06:
      meaning: "Had a gambling problem in the last 12 months: 0 no, 1 yes some months ago but not now. The answer 'yes' is lost by the export."
      polarity: not_applicable
  flags:
    - "The stored total follows the key of the application, where item 4 counts 1 for any answer, 'never' included. The published form scores item 4 only for 'most of the time' and 'every time' (this rule is partial in the literature notes)."
    - The total is not recomputed while the export loses the answer 'yes' of item 6 and some answers written with an apostrophe.
    - The French version is 'To verify' in the literature notes.

sqol:
  description: Schizophrenia Quality of Life questionnaire, 18-item form, filled by the patient at every visit. Items of 1 to 5, a box 'does not concern me' beside each item, eight dimensions and an index from 0 to 100.
  version: S-QoL 18
  reference: "Boyer L, Simeoni MC, Loundou A, et al. The development of the S-QoL 18. Schizophr Res 2010;121:241-250"
  reference_confidence: "To verify (from memory). The 18 items and 8 dimensions are Confirmed (direct: Boyer 2022, J Clin Med, PMC8836740)"
  respondent: patient
  construct: quality_of_life
  sources: ["schema notes (sz sqol)", "scale_reference_aq_general.md section 30"]
  items:
    higher_means: better quality of life on the item (1 to 5; a dimension is the mean of its items, none reversed)
    polarity: better
    basis: literature
    source: "section 30: 'Each dimension and the index 0-100, higher = better QoL', Confirmed (direct: Boyer 2022); schema notes (sz sqol): a dimension is (mean - 1) x 25"
  scores:
    sqol_sentimental_life:
      meaning: Sentimental life, the mean of items 14 and 15 brought to 0 to 100.
      higher_means: better quality of life in sentimental life
      polarity: better
      basis: literature
      source: "section 30: 'Each dimension and the index 0-100, higher = better QoL', Confirmed (direct: Boyer 2022)"
    sqol_self_esteem:
      meaning: Self-esteem, the mean of items 1 and 4 brought to 0 to 100.
      construct: self_esteem
      higher_means: better self-esteem
      polarity: better
      basis: literature
      source: "section 30: 'Each dimension and the index 0-100, higher = better QoL', Confirmed (direct: Boyer 2022)"
    sqol_family:
      meaning: Relations with the family, the mean of items 10 and 11 brought to 0 to 100.
      higher_means: better quality of life in the relations with the family
      polarity: better
      basis: literature
      source: "section 30: 'Each dimension and the index 0-100, higher = better QoL', Confirmed (direct: Boyer 2022)"
    sqol_friends:
      meaning: Relations with friends, the mean of items 12 and 13 brought to 0 to 100.
      higher_means: better quality of life in the relations with friends
      polarity: better
      basis: literature
      source: "section 30: 'Each dimension and the index 0-100, higher = better QoL', Confirmed (direct: Boyer 2022)"
    sqol_autonomy:
      meaning: Autonomy, the mean of items 5 and 6 brought to 0 to 100.
      higher_means: better autonomy
      polarity: better
      basis: literature
      source: "section 30: 'Each dimension and the index 0-100, higher = better QoL', Confirmed (direct: Boyer 2022)"
    sqol_psychological_wellbeing:
      meaning: Psychological well-being, the mean of items 16, 17 and 18 brought to 0 to 100.
      higher_means: better psychological well-being
      polarity: better
      basis: literature
      source: "section 30: 'Each dimension and the index 0-100, higher = better QoL', Confirmed (direct: Boyer 2022)"
    sqol_physical_wellbeing:
      meaning: Physical well-being, the mean of items 8 and 9 brought to 0 to 100.
      higher_means: better physical well-being
      polarity: better
      basis: literature
      source: "section 30: 'Each dimension and the index 0-100, higher = better QoL', Confirmed (direct: Boyer 2022)"
    sqol_resilience:
      meaning: Resilience, the mean of items 2, 3 and 7 brought to 0 to 100.
      higher_means: better resilience
      polarity: better
      basis: literature
      source: "section 30: 'Each dimension and the index 0-100, higher = better QoL', Confirmed (direct: Boyer 2022)"
    sqol_index:
      meaning: Index, the mean of the eight dimensions (seven at least), from 0 to 100.
      higher_means: better quality of life
      polarity: better
      basis: literature
      source: "section 30: 'Each dimension and the index 0-100, higher = better QoL', Confirmed (direct: Boyer 2022)"
  variables:
    "sqol*_pc":
      meaning: "Box 'does not concern me' beside the item (1 ticked, 0 not ticked). The raw value 'def' is read as not ticked (to confirm with the data managers)."
      polarity: not_applicable
      source: "schema notes (sz sqol); the form autoq_qualite_vie of the application"
  flags:
    - "Items 17 and 18 were read with the wrong labels by the export up to the extraction of 2026-11-17; they, the psychological well-being dimension and the index are delivered from the extraction of 2026-11-21, where the export reads them correctly."
    - A dimension is computed when at most one of its items is missing; the index when at most one dimension is missing.
    - "An answer beside a ticked box 'does not concern me' is delivered as recorded and counts in its dimension, as in the export; the application leaves it out (124 cells)."
    - The period of the questions (last 4 weeks) is 'To verify' in the literature notes. No cut-off is documented.

stori:
  description: Stages of Recovery Instrument. Fifty statements rated by the patient from 0 (not at all true now) to 5 (completely true now), ten for each of the five stages of recovery.
  version: 50 items
  reference: "Andresen R, Caputi P, Oades L. Stages of recovery instrument: development of a measure of recovery from serious mental illness. Aust N Z J Psychiatry 2006;40:972-980"
  reference_confidence: To verify (not read)
  respondent: patient
  construct: recovery
  period: now (the present)
  sources: ["schema notes (sz stori)", "scale_reference_aq_general.md section 28"]
  items:
    higher_means: the statement is more true now (0 not at all true to 5 completely true)
    polarity: neutral
    basis: anchors
    source: "labels of the items: '(0 not at all true to 5 completely true)'"
  scores:
    stori_stage1:
      meaning: Stage 1, moratorium, the sum of items 1, 6, ... 46 (0 to 50).
      higher_means: the statements of the moratorium stage are more true now
      polarity: neutral
      basis: anchors
      source: "labels of the items: '(0 not at all true to 5 completely true)', plain sum"
    stori_stage2:
      meaning: Stage 2, awareness, the sum of items 2, 7, ... 47 (0 to 50).
      higher_means: the statements of the awareness stage are more true now
      polarity: neutral
      basis: anchors
      source: "labels of the items: '(0 not at all true to 5 completely true)', plain sum"
    stori_stage3:
      meaning: Stage 3, preparation, the sum of items 3, 8, ... 48 (0 to 50).
      higher_means: the statements of the preparation stage are more true now
      polarity: neutral
      basis: anchors
      source: "labels of the items: '(0 not at all true to 5 completely true)', plain sum"
    stori_stage4:
      meaning: Stage 4, rebuilding, the sum of items 4, 9, ... 49 (0 to 50).
      higher_means: the statements of the rebuilding stage are more true now
      polarity: neutral
      basis: anchors
      source: "labels of the items: '(0 not at all true to 5 completely true)', plain sum"
    stori_stage5:
      meaning: Stage 5, growth, the sum of items 5, 10, ... 50 (0 to 50).
      higher_means: the statements of the growth stage are more true now
      polarity: neutral
      basis: anchors
      source: "labels of the items: '(0 not at all true to 5 completely true)', plain sum"
  flags:
    - "Five scores, one per stage; no single stage is delivered. In the published use the stage with the highest score is the allocated stage; that rule is 'To verify' in the literature notes."
    - The polarity is left neutral because a stage score says how much the patient is in that stage, not how far the recovery has gone.

yale_brown:
  description: Yale-Brown Obsessive Compulsive Scale, filled about the past week by the patients with obsessions or compulsions. Five items for the obsessions and five for the compulsions (time occupied, interference, distress, resistance, control), each 0 (none) to 4 (extreme).
  version: 10 severity items, self-report form
  reference: "Goodman et al. 1989 (the literature notes give no full citation)"
  reference_confidence: To verify
  respondent: patient
  construct: ocd_symptoms
  period: past week
  sources: ["schema notes (sz yale_brown)", "scale_reference_aq_general.md section 35"]
  items:
    higher_means: more severe (0 none to 4 extreme)
    polarity: worse
    basis: anchors
    source: "labels of the items: '(0 none to 4 extreme)'"
  scores:
    ybocs_obsessions_total:
      meaning: Sum of the five obsession items (0 to 20).
      higher_means: more severe obsessions
      polarity: worse
      basis: anchors
      source: "labels of the items: '(0 none to 4 extreme)', plain sum"
    ybocs_compulsions_total:
      meaning: Sum of the five compulsion items (0 to 20).
      higher_means: more severe compulsions
      polarity: worse
      basis: anchors
      source: "labels of the items: '(0 none to 4 extreme)', plain sum"
    ybocs_total:
      meaning: Sum of the two sub-totals (0 to 40).
      higher_means: more severe obsessions and compulsions
      polarity: worse
      basis: anchors
      source: "labels of the items: '(0 none to 4 extreme)', plain sum"
      cutoffs:
        - value: "0 to 7, 8 to 15, 16 to 23, 24 to 31, 32 to 40"
          meaning: subclinical, mild, moderate, severe, extreme
          source: "section 35"
          confidence: To verify
  flags:
    - Filled only by the patients with obsessions or compulsions, from 2015.
    - The delivered sums add the ten items. On some visits of 2015 and 2016 the stored totals added a summary block typed apart and differ (score_mismatch).
    - The item names are those of the published scale in its order; the dictionary does not name them. The details of the self-report form are 'To verify' in the literature notes.

# ---------------------------------------------------------------- FACE DR

alimentaire:
  description: Food frequency questionnaire. Twenty-three questions (question 9 has two parts) on how much of each food the patient takes per day, per week or per month. Each answer is a class of quantity numbered from 0. No score.
  version: 23 questions
  respondent: patient
  construct: diet
  sources: ["schema notes (dr alimentaire)"]
  items:
    higher_means: a larger class of quantity (the classes differ from one question to the other)
    polarity: neutral
    basis: anchors
    source: "schema notes (dr alimentaire): 'Each answer is a class of quantity, numbered from 0 ... for bread: 0 none, 1 for 30 g, up to 7 for 150 g or more'"
  flags:
    - "The classes are not quantities and differ between questions: the number of classes gives the range of each variable. No score is computed."
    - No reference is given in the project documents.
    - Not in BP. The SZ application has the same form but the SZ extraction does not carry it.

bfi:
  description: Big Five Inventory, French version. Forty-five statements, each rated by the patient from 1 (strongly disagree) to 5 (strongly agree). Five dimensions of personality, each the mean of its items.
  version: BFI-Fr, 45 items
  reference: "Plaisant O, Courtois R, Réveillère C, Mendelsohn GA, John OP. Validation par analyse factorielle du Big Five Inventory français (BFI-Fr). Ann Méd Psychol 2010;168:97-106"
  reference_confidence: "45 items confirmed (extracted: Lignier 2016, abstract); citation confirmed (search result + em-consulte record)"
  respondent: patient
  construct: personality_temperament
  sources: ["schema notes (dr bfi)", "scale_reference_aq_general.md section 23"]
  items:
    higher_means: "more agreement with the statement (1 strongly disagree to 5 strongly agree, as asked); 17 statements describe the opposite pole of their dimension and are reversed in the scores"
    polarity: neutral
    basis: anchors
    source: "schema notes (dr bfi): 'every item is 1 strongly disagree to 5 strongly agree, and the key is in the scores (reverse)'"
  scores:
    bfi_extraversion:
      meaning: Extraversion, the mean of 8 items (1 to 5), three of them reversed.
      higher_means: more extraversion
      polarity: neutral
      basis: stated
      source: "schema notes (dr bfi): 'The published key reverses 17 statements, those that describe the opposite pole of their dimension'; items 1 strongly disagree to 5 strongly agree"
    bfi_agreeableness:
      meaning: Agreeableness, the mean of 10 items (1 to 5), five of them reversed.
      higher_means: more agreeableness
      polarity: neutral
      basis: stated
      source: "schema notes (dr bfi): 'The published key reverses 17 statements, those that describe the opposite pole of their dimension'; items 1 strongly disagree to 5 strongly agree"
    bfi_conscientiousness:
      meaning: Conscientiousness, the mean of 9 items (1 to 5), four of them reversed.
      higher_means: more conscientiousness
      polarity: neutral
      basis: stated
      source: "schema notes (dr bfi): 'The published key reverses 17 statements, those that describe the opposite pole of their dimension'; items 1 strongly disagree to 5 strongly agree"
    bfi_neuroticism:
      meaning: Neuroticism, the mean of 8 items (1 to 5), three of them reversed.
      higher_means: more neuroticism
      polarity: neutral
      basis: stated
      source: "schema notes (dr bfi): 'Direction. Neuroticism rises with depression (r = 0.49 with the QIDS); the four other dimensions fall'; the key reverses the statements of the opposite pole"
    bfi_openness:
      meaning: Openness, the mean of 10 items (1 to 5), two of them reversed.
      higher_means: more openness
      polarity: neutral
      basis: stated
      source: "schema notes (dr bfi): 'The published key reverses 17 statements, those that describe the opposite pole of their dimension'; items 1 strongly disagree to 5 strongly agree"
  flags:
    - "The key reverses 17 statements: the 16 of the English 44-item form and item 45. The French list of reversed items and the dimension of the 45th item are 'To verify' in the literature notes."
    - The form stores the 17 statements already reversed; they are read back to the answer as asked.
    - An older form keyed item 29 the other way on some visits of 2014 or earlier. Which visits is not known, so item 29 is delivered as stored.
    - On 16 visits the stored conscientiousness and neuroticism are swapped. The recomputed scores are delivered.
    - An empty scale after 2018 can be 'not asked' (simplified visit).

detc_cage:
  description: DETC-CAGE for cannabis. Four yes/no questions answered by the patient (need to cut down, remarks of the family, feeling of smoking too much, cannabis in the morning).
  version: 4 questions
  respondent: patient
  construct: cannabis
  period: "lifetime (the questions ask whether it 'ever' happened)"
  sources: ["schema notes (dr detc_cage)", "labels of the items"]
  scores:
    detc_cage_total:
      meaning: Number of yes among the four questions (0 to 4). Computed by the package; the extraction stores none.
      higher_means: more signs of a problem use of cannabis answered yes
      polarity: worse
      basis: anchors
      source: "label of the score: 'DETC-CAGE cannabis: number of yes (0 to 4)'"
  flags:
    - "The totals of 2012 to 2015 and those from 2016 are not comparable. Until 2015 everybody who filled the form answered, and a 0 is mostly a patient who does not use cannabis; from 2016 the items are shown only after a yes to the question on cannabis use."
    - No reference and no cut-off are given in the project documents, and the literature notes have no section on this instrument.
    - Filled on 100 visits only. Whether the scale is still part of the protocol is an open question.

leaps:
  description: Lam Employment Absence and Productivity Scale. The patient gives the kind of work, the hours scheduled and missed over the last two weeks, and, if working, rates seven problems at work from 0 (none of the time) to 4 (all the time).
  reference: "Lam RW, Michalak EE, Yatham LN. BMC Psychiatry 2009;9:78"
  reference_confidence: To verify (not read)
  respondent: patient
  construct: work_productivity
  period: last two weeks
  sources: ["schema notes (dr leaps)", "scale_reference_aq_general.md section 34"]
  items:
    higher_means: the problem at work was felt more of the time (0 none of the time to 4 all the time)
    polarity: worse
    basis: anchors
    source: "labels of the items: '(0 none of the time to 4 all the time)'"
  scores:
    leaps_total:
      meaning: Sum of the seven items (0 to 28).
      higher_means: more impairment at work
      polarity: worse
      basis: stated
      source: "schema notes (dr leaps): 'The sum of the seven items (0 to 28, higher is more impairment at work)'"
  variables:
    leaps_hours_scheduled:
      meaning: Hours of work scheduled in the last two weeks.
      polarity: neutral
    leaps_hours_missed:
      meaning: Hours of work missed in the last two weeks because of how the patient felt.
      higher_means: more hours of work missed
      polarity: worse
      basis: anchors
      source: "label of the variable"
    leaps_not_working:
      meaning: Not working at present (sick leave, disability, retirement); 1 is ticked. The seven items are shown only when it is not ticked.
      polarity: not_applicable
    leaps_work_kind:
      meaning: Kind of paid work, a free text.
      polarity: not_applicable
  flags:
    - "The seven items and the total exist only for the patients who work (168 visits): the total is missing, not 0, for the others."
    - The literature notes describe a published scale of 10 items; the total of the first 7 items (0 to 28) and its severity bands are 'To verify'. A change of 3 points is the minimal important difference (Sachdeva 2026, abstract).
    - The hours missed are above the hours scheduled on some visits and are kept as typed.

paykel:
  description: Paykel list of life events. In an interview, the patient is asked for each of 64 events whether it happened in the 12 months before the visit and the month it started; the interviewer rates how independent of the illness it was and its negative impact.
  version: "64 events (the dictionary announces 61)"
  respondent: clinician
  construct: life_events
  period: the 12 months before the visit
  sources: ["schema notes (dr paykel)"]
  scores:
    paykel_events:
      meaning: Number of the 64 events answered yes (0 to 64). The 64 answers are needed.
      higher_means: more life events in the 12 months before the visit
      polarity: neutral
      basis: anchors
      source: "label of the score: 'Number of Paykel life events answered yes (0 to 64)'"
  variables:
    "paykel*_month":
      meaning: Month of onset of the event, 1 to 12 as printed on the form. Whether it is a calendar month or a number of months before the visit is not told.
      polarity: not_applicable
    "paykel*_independence":
      meaning: Independence of the event from the illness, rated by the interviewer (1 almost entirely independent to 5 almost entirely dependent).
      higher_means: the event depends more on the illness
      polarity: neutral
      basis: anchors
      source: "label of the variable: '(1 almost entirely independent to 5 almost entirely dependent)'"
    "paykel*_impact":
      meaning: Objective negative impact of the event, rated by the interviewer (1 severe to 5 none).
      higher_means: less negative impact
      polarity: better
      basis: anchors
      source: "label of the variable: '(1 severe to 5 none)'"
  flags:
    - "No reference is given: the schema notes cite none, and section 27 of the literature notes describes the Paykel Suicide Scale, which is another instrument."
    - The count mixes events of every kind, wanted ones included (a marriage, a financial improvement), hence the neutral polarity.
    - Each visit asks about the year before it, so the answers of two visits do not add up. Whether the visits of 2 and 4 years meant the interval since the previous visit is an open question.
    - The month, the independence and the impact are filled only after a yes. Values out of the scale (0, above 5, a month above 12) are not delivered.
    - An empty list since 2018 can be 'not asked' (simplified visit).

pcl_s:
  description: PTSD Checklist, specific version. Seventeen symptoms, each rated by the patient from 1 (not at all) to 5 (very often), about a stressful episode. The checklist does not say which event the patient has in mind.
  version: "PCL-S (specific version, DSM-IV), 17 items"
  reference: "Weathers FW, Litz BT, Herman DS, Huska JA, Keane TM. The PTSD Checklist: reliability, validity and diagnostic utility. ISTSS annual meeting, San Antonio, 1993 (conference paper)"
  reference_confidence: Confirmed (ISTSS list, extracted)
  respondent: patient
  construct: ptsd_symptoms
  period: "none printed on the form (the published PCL-S asks about the past month)"
  sources: ["schema notes (dr pcl_s)", "scale_reference_aq_general.md section 6"]
  items:
    higher_means: the symptom is more present (1 not at all to 5 very often)
    polarity: worse
    basis: anchors
    source: "labels of the items: '1 not at all to 5 very often'"
  scores:
    ptsd_total:
      meaning: Sum of the seventeen items (17 to 85).
      higher_means: more post-traumatic stress symptoms
      polarity: worse
      basis: anchors
      source: "labels of the items: '1 not at all to 5 very often', plain sum; schema notes (dr pcl_s): 'Every item rises with the others'"
      cutoffs:
        - value: "44"
          meaning: "French PCLS: separates PTSD from controls (diagnostic efficacy 0.94)"
          source: "Ventureyra 2002, section 6"
          confidence: "Confirmed (abstract: Ventureyra 2002)"
        - value: "44"
          meaning: victims of motor vehicle accidents and of sexual assault (Blanchard 1996)
          source: "ISTSS page, section 6"
          confidence: "Confirmed (extracted: ISTSS)"
        - value: "50"
          meaning: combat veterans (Weathers 1993)
          source: "ISTSS page, section 6"
          confidence: "Confirmed (extracted: ISTSS)"
  flags:
    - The labels give the three clusters of the published checklist (re-experiencing items 1 to 5, avoidance and numbing 6 to 12, hyperarousal 13 to 17). No cluster score is delivered.
    - The form labels the answer 5 'very often'; the published anchor is 'extremely'.
    - Filled on 127 visits only. On half of them no event of the list of traumatic events is answered yes.
    - Not to be confused with the PCL-5 (DSM-5, 20 items).

rosenberg:
  description: Rosenberg self-esteem scale. Ten items on how the patient sees himself in general, each from 1 (strongly disagree) to 4 (strongly agree).
  version: 10 items
  reference: "Rosenberg 1965 (the literature notes give no full citation)"
  reference_confidence: To verify
  respondent: patient
  construct: self_esteem
  period: in general
  sources: ["schema notes (dr rosenberg)", "scale_reference_aq_general.md section 24"]
  items:
    higher_means: "more agreement with the statement (1 strongly disagree to 4 strongly agree, as asked); better self-esteem, except on the five items worded negatively (3, 5, 8, 9, 10), which the total reverses"
    polarity: better
    basis: stated
    source: "schema notes (dr rosenberg): 'The five items are read back to the answer as asked ... the total reverses the same five items'"
  scores:
    rosenberg_total:
      meaning: Sum of the ten items after the reversal of the five negative ones (10 to 40).
      higher_means: better self-esteem
      polarity: better
      basis: stated
      source: "schema notes (dr rosenberg): '10 to 40, higher is a better self-esteem'; section 24: Confirmed (direct)"
  flags:
    - "No official cut-off (literature notes)."
    - The form stores the five negative items already reversed; they are read back to the answer as asked.
    - "The reversed items here are 3, 5, 8, 9 and 10. The literature notes list 2, 5, 6, 8, 9 for the English order and warn that the French item order may differ."
    - An empty scale since 2018 can be 'not asked' (simplified visit). It is missing, never 0.

shaps:
  description: Snaith-Hamilton Pleasure Scale. Fourteen situations that usually give pleasure, rated by the patient about these last days on four levels, stored 0 (strongly disagree) to 3 (strongly agree).
  version: 14 items
  reference: "Snaith RP, Hamilton M, Morley S, et al. Br J Psychiatry 1995;167:99-103 (PMID 7551619)"
  reference_confidence: Confirmed (abstract)
  respondent: patient
  construct: anhedonia
  period: these last days
  sources: ["schema notes (dr shaps)", "scale_reference_aq_general.md section 25"]
  items:
    higher_means: more pleasure (0 strongly disagree to 3 strongly agree); a low value is the answer of anhedonia
    polarity: better
    basis: stated
    source: "schema notes (dr shaps): 'a low value is the answer of anhedonia for every item'"
  scores:
    shaps_total:
      meaning: Number of the fourteen items answered disagree or strongly disagree (0 to 14).
      higher_means: more anhedonia
      polarity: worse
      basis: stated
      source: "label of the score: '0 to 14, higher is more anhedonia'; section 25: Confirmed (direct: Kong 2026)"
      cutoffs:
        - value: "above 2"
          meaning: abnormal (original cut-off)
          source: "Kong 2026, section 25"
          confidence: "Partial (direct: Kong 2026 states 'a cut-off score of 2'; whether abnormal is 2 or more or above 2 is to verify in Snaith 1995; commonly above 2)"
  flags:
    - "The items and the score run in opposite directions: a high item is pleasure, a high score is anhedonia."
    - The stored score is wrong (the export reverses five items before the count) and is not delivered.
    - In the extraction from 2015.

spin:
  description: Social Phobia Inventory. Seventeen items, each rated by the patient from 0 (not at all) to 4 (extremely), on how much the problems bothered the patient during the last weeks.
  version: 17 items
  reference: "Connor KM, Davidson JR, Churchill LE, Sherwood A, Foa E, Weisler RH. Psychometric properties of the Social Phobia Inventory (SPIN). Br J Psychiatry 2000;176:379-386"
  reference_confidence: To verify (not read)
  respondent: patient
  construct: social_anxiety
  period: "the last weeks (the form's own words; the published SPIN says the past week)"
  sources: ["schema notes (dr spin)", "scale_reference_aq_general.md section 26"]
  items:
    higher_means: the problem bothered the patient more (0 not at all to 4 extremely)
    polarity: worse
    basis: anchors
    source: "schema notes (dr spin): 'each 0 (not at all) to 4 (extremely)'"
  scores:
    spin_total:
      meaning: Sum of the seventeen items (0 to 68).
      higher_means: more social anxiety
      polarity: worse
      basis: stated
      source: "schema notes (dr spin): '0 to 68, higher is more social anxiety'"
      cutoffs:
        - value: "19"
          meaning: cut-off of the original paper (Connor 2000)
          source: "section 26"
          confidence: To verify
        - value: "21"
          meaning: separates clinical from subclinical
          source: "Laizane 2026 and Schmidt-Peter 2026, section 26"
          confidence: "Confirmed (direct: Laizane 2026; Schmidt-Peter 2026)"
        - value: "25"
          meaning: used in student samples
          source: "Laizane 2026 and Schmidt-Peter 2026, section 26"
          confidence: "Confirmed (direct: Laizane 2026; Schmidt-Peter 2026)"
  flags:
    - Filled on 147 visits only, by few patients and less and less. Why a third of them are follow-up visits is an open question.
    - The fear, avoidance and physiological sub-scales are 'To verify' in the literature notes and are not delivered. No French version was found.

traumatic_events:
  description: List of seventeen traumatic life events (the sixteen events of the Life Events Checklist and one other). For each, the patient says whether it happened, the age at the event and whether it had a negative impact.
  version: 17 events
  respondent: patient
  construct: life_events
  period: "none printed on the form; the published checklist asks about the whole life and the inclusion answers are read so"
  sources: ["schema notes (dr traumatic_events)"]
  scores:
    trauma_events:
      meaning: Number of the seventeen events answered yes (0 to 17). The seventeen answers are needed.
      higher_means: more kinds of traumatic events reported
      polarity: worse
      basis: anchors
      source: "label of the score: 'Number of traumatic life events answered yes (0 to 17)'"
  variables:
    "trau*_age":
      meaning: Age at the event, in years.
      polarity: neutral
    "trau*_impact":
      meaning: Negative impact box (1 ticked, 0 not ticked). The form also writes 0 where the event did not happen.
      higher_means: a negative impact is ticked
      polarity: worse
      basis: anchors
      source: "label of the variable: 'negative impact box (1 ticked, 0 not ticked; the form also writes 0 where the event did not happen)'"
    trau17_detail:
      meaning: Other very stressful event, a free text.
      polarity: not_applicable
  flags:
    - "At follow-up the answers are not cumulative: most events answered yes at inclusion are not answered yes again, and new events appear. What the follow-up form asks is an open question."
    - "Count the visits of this form with the events, not with the impacts: an impact of 0 is also written where no event is answered (flag derived_doubt)."
    - No reference is given in the project documents. Event 15 differs from the published checklist item and is to verify against the French version used.
    - The PCL-S is another form and does not say which event of this list its items are about.
    - An empty list since 2018 can be 'not asked' (simplified visit).
