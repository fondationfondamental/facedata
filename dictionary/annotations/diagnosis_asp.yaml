substance_use:
  description: >-
    The substance part of the clinician's list of psychiatric comorbidities at inclusion (form 202): a
    first question on any substance use disorder, then nine substances (tobacco, alcohol,
    benzodiazepines, cannabis, psychostimulants, cocaine, hallucinogens, androgenic steroids, solvents),
    each with a level (no, abuse, dependence), an age at onset and a status (past or current).
  version: inclusion form (form 202), delivered on the inclusion visits only; the follow-up form is read and not delivered
  reference: not_applicable
  respondent: clinician
  construct: substance_use
  period: "at inclusion; each substance has a status, past or current"
  sources: ["schema notes (asp substance_use)", "docs/asp/PROGRESS.md D57"]
  items:
    higher_means: "yes: an abuse or a dependence is recorded (1 yes, 0 no)"
    polarity: worse
    basis: stated
    source: "schema notes (asp substance_use): '<substance>_disorder_v0 ... codes 0 no, 1 and 2 yes, so that abuse and dependence are one yes'"
  variables:
    "*_use_disorder_v0":
      meaning: "Level recorded for the substance, in three words: no, abuse or dependence (not known is missing). Missing after a no to the first question; use <substance>_disorder_v0 for a yes/no that is 0 there."
      polarity: not_applicable
    "*_use_status_v0":
      meaning: "The abuse or dependence is past or current. Not the 'in the past month' question of BP."
      polarity: not_applicable
    "*_onset_age_v0":
      meaning: Age at onset of the abuse or dependence, in years (hard limit 0 to 90).
      higher_means: later onset
      polarity: neutral
      basis: anchors
      source: "labels: 'age at onset of the abuse or dependence', unit years"
    smoking_start_age_clinician:
      meaning: Age at the start of smoking as the clinician records it on this form, in years; the same question as smoking_start_age of the tobacco examination.
      higher_means: later start of smoking
      polarity: neutral
      basis: anchors
      source: "label: 'age at the start of smoking, as the clinician records it', unit years"
  flags:
    - "Almost all the answers are those of adults: the first question is yes for 1% of the children and 18% of the adults, and for 0% to 39% by centre."
    - "After a no to the first question the nine yes/no substance variables are 0 (the form hides the substances); a 'not known' stays missing, and the levels, ages and statuses stay missing after a no."
    - "No follow-up variables: the follow-up form holds 70 answers with one yes and is not delivered."
    - "Benzodiazepines are narrower than BP's sedatives, hypnotics and anxiolytics, and solvents are one of BP's 'other substances'; ASP has no question on opiates. Alcohol, cannabis, cocaine, stimulants and hallucinogens ask the same question as BP's abuse or dependence."
    - "smoking_start_age_clinician is not SZ's age at the first cigarette. Steroids have no age and no status."
    - "Few values: 68 tobacco ages, 42 alcohol, 40 cannabis and fewer than 10 for each other substance; 89 of the 263 abuse or dependence answers have no age."
    - "The list is answered on 91% of the inclusions of 2013, 64% to 80% in 2018 to 2022 and 43% to 63% in 2023 to 2026."

suicide_and_self_harm_fu:
  description: >-
    The two questions of suicide_and_self_harm_v0 asked again by the clinician at the follow-up visits
    (form 203): a suicide attempt, with the age at the first and at the most recent attempt, their number
    and whether one was serious; and self-injurious behaviour, with the age at the first one and its kind.
    124 answers, 4 yes for an attempt and 21 for self-injurious behaviour.
  version: form 203 on the follow-up visits; the twin of suicide_and_self_harm_v0
  reference: not_applicable
  respondent: clinician
  construct: suicidal_behaviour
  period: "not settled: the section is titled LIFETIME at every visit and the questions print no period, but the answers do not repeat the inclusion ones (raters read it as since the last visit or as now)"
  sources: ["schema notes (asp suicide_and_self_harm_fu)", "docs/asp/PROGRESS.md D56 and O9"]
  variables:
    isf05_lifetime_fu:
      meaning: "Attempted suicide, asked again at a follow-up visit (1 yes, 0 no; the form says: in the life)."
      higher_means: a suicide attempt is reported
      polarity: worse
      basis: anchors
      source: "label and range 0 to 1"
    n_attempts_fu:
      meaning: Number of suicide attempts, asked again at a follow-up visit; 0 after a no.
      higher_means: more suicide attempts
      polarity: worse
      basis: anchors
      source: "label: 'Number of suicide attempts'; range 0 to 50"
    "*_attempt_age_fu":
      meaning: Age at the first or at the most recent suicide attempt, in years.
      higher_means: older at the attempt
      polarity: neutral
      basis: anchors
      source: "labels: 'Age at the first suicide attempt', 'Age at the most recent suicide attempt', unit years"
    serious_suicide_attempt_fu:
      meaning: "A serious suicide attempt in the clinician's judgement (the form gives no definition); 0 after a no to the attempt question."
      higher_means: a serious attempt is reported (1 yes, 0 no)
      polarity: worse
      basis: anchors
      source: "label and range 0 to 1"
    self_harm_fu:
      meaning: "Self-injurious behaviour, asked again at a follow-up visit (1 yes, 0 no; the form says: in the life)."
      higher_means: self-injurious behaviour is reported
      polarity: worse
      basis: anchors
      source: "label and range 0 to 1"
    self_harm_first_age_fu:
      meaning: Age at the first self-injurious behaviour, in years.
