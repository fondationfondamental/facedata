  period: "the form prints no period; answered at the screening and inclusion visits"
  sources: ["schema notes (asp developmental_disorders_v0)", "docs/asp/PROGRESS.md D49 to D53"]
  items:
    higher_means: "yes: the disorder or the detail asked is present (1 yes, 0 no)"
    basis: anchors
    source: "schema: yes/no items with range 0 to 1; 9 'Non connu' is a missing code"
  variables:
    "*_onset_age_v0":
      meaning: Age at onset or at the first symptoms of the disorder, in years (hard limit 0 to 70).
      higher_means: later onset
