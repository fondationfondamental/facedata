vineland:
  description: >-
    The scores of the Vineland Adaptive Behavior Scales as typed into the medical evaluation (form 119):
    a box 'done', the date and the age in months, a raw score and an age equivalent in months for each
    of eleven sub-domains, the standard score of the four domains (communication, daily living skills,
    socialisation, motor skills), their sum and the adaptive behaviour composite. Nothing is computed by
    the application.
  version: Vineland-II (second edition), identified from the largest raw score of each sub-domain
  reference: "Sparrow SS, Cicchetti DV, Balla DA. Vineland Adaptive Behavior Scales, Second Edition. Pearson/AGS 2005; French: Echelles de comportement adaptatif de Vineland-II (ECPA/Pearson)"
  reference_confidence: "confirmed in source (publisher pages, trial plan); manual unread; French edition year (2015?) to verify"
  construct: adaptive_behaviour
  period: "the date of the Vineland (vineland_date)"
  sources: ["schema notes (asp vineland)", "scale_reference.md section 21", "docs/asp/PROGRESS.md D54 and O31"]
  variables:
    "vineland_*_standard":
      meaning: "Standard score of the domain, typed by the clinician. Published scale: mean 100, standard deviation 15, range 20 to 160."
      higher_means: higher adaptive level
      polarity: better
      basis: literature
      source: "scale_reference.md section 21: 'Five adaptive levels (low to high) exist for both v-scale and standard-score metrics' and range 20 to 160, confirmed in source (trial plan, GW SAP Table 6); manual unread"
    vineland_sum_standard:
      meaning: "Sum of the standard scores of the domains, as typed and not recomputed: communication, daily living skills and socialisation, plus the motor skills for a few young children. The composite is read from this sum."
      higher_means: higher domain standard scores (higher adaptive level)
      polarity: better
      basis: literature
      source: "scale_reference.md section 21: the composite comes from the sum of the domain standard scores, and adaptive levels run low to high on the standard-score metric; confirmed in source (trial plan); manual rule to verify"
    vineland_composite:
      meaning: "Adaptive behaviour composite, typed by the clinician. Published scale: mean 100, standard deviation 15, range 20 to 160; read from the sum of the domain standard scores (the motor domain is in it below 7 years only)."
      higher_means: higher overall adaptive level
      polarity: better
      basis: literature
      source: "scale_reference.md section 21: 'Five adaptive levels (low to high) exist for both v-scale and standard-score metrics' and range 20 to 160, confirmed in source (trial plan, GW SAP Table 6); manual unread"
    "vineland_*_raw":
      meaning: "Raw score of the sub-domain: the points of its items, up to the maximum of the sub-domain in the Vineland-II (the range of the variable). Published, it is converted with the age into a v-scale score, which the form does not hold."
    "vineland_*_age":
      meaning: "Age equivalent of the sub-domain, in months, as typed. Published, age equivalents cannot be added, subtracted or averaged."
    vineland_age_months:
      meaning: "Age at the Vineland, typed in months. 8 values below 40 are an age in years, and 22 differ from the age at the date of the Vineland by more than 2 years."
      higher_means: older at the assessment
      polarity: neutral
      basis: anchors
      source: "label: 'Age at the Vineland, in months'"
    vineland_done:
      meaning: "A Vineland was done (1 yes, 0 no; 9 is read as not known)."
      polarity: not_applicable
  flags:
    - "Nothing is computed: the domain standard scores, their sum and the composite are typed, and the norm tables of the test are not available to check them."
    - "A step with no known cause: in children the raw scores do not move over the years, but the typed standard scores fall in 2018 to 2021 and return in part from 2022 (median socialisation 76 to 2017, 45 in 2018 to 2021, 63 from 2022; composite 74, 57 and 69). Case-mix does not fit; a change of the table or of the rule that converts the raw score is possible."
    - "The standard score 20, the lowest of the scale, is typed for 15% of the socialisation scores (none among the children to 2017)."
    - "The sum holds three domains, or four with the motor domain in young children: the two are not comparable. On 23 visits the stored sum differs from the sum of the domain scores, and on a few visits the sum and the composite were typed in each other's field (6 such composites lie inside 20 to 160 and are delivered)."
    - "The age equivalents are on 463 visits only and the motor domain on 10."
    - "'Done' is yes for 96% of the children and 27% of the adults, and three centres hold almost all the scores: differences by centre are mostly the age mix."
    - "Not documented: which form of the Vineland-II was used (interview or questionnaire of the parent or caregiver), which French norms, and so who answered; the respondent is left blank."
    - "To verify: whether the French composite counts the motor domain for adults over 50."

wais4_indices:
  description: >-
    The four indices (verbal comprehension, perceptual reasoning, working memory, processing speed) and
    the full-scale IQ of the Wechsler Adult Intelligence Scale, fourth edition, as the clinician copied
    them into the medical evaluation (form 119), with a box saying that this edition was used. Typed
    numbers; nothing is computed.
  version: WAIS-IV (the French edition is normed from 16 years)
  reference: "Wechsler 2008 (WAIS-IV); French edition ECPA/Pearson 2011, ages 16:0 to 79:11"
  reference_confidence: "composition, mean/SD and FSIQ range confirmed in source (Canivez 2010 review; ECPA brochure); index ranges to verify"
  respondent: test
