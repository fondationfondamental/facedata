# Annotations of the group diagnosis_asp: the medical evaluation tab of FACE ASP (22 instruments).
# Written from the schema notes, docs/asp/PROGRESS.md (D48 to D60) and local/out/scale_reference.md
# (sections 21, 22 and 24). A field is left out when no document states it.

anxiety_disorders_fu:
  description: >-
    The anxiety part of the clinician's list of psychiatric comorbidities, asked again at the yearly
    follow-up visits (form 348): a first question on any anxiety disorder, then panic disorder with and
    without agoraphobia, agoraphobia, social phobia, specific phobia (five types), separation anxiety,
    obsessive-compulsive disorder, obsessive-compulsive symptoms, generalised anxiety and post-traumatic
    stress, each yes or no with an age at onset and, for most, a remission box.
  version: yearly follow-up form (form 348); the twin of anxiety_disorders_v0
  reference: not_applicable
  respondent: clinician
  construct: psychiatric_comorbidity
  period: "an update given at the visit: the form prints no period; neither the whole life nor strictly the time since the last visit"
  sources: ["schema notes (asp anxiety_disorders_fu)", "docs/asp/PROGRESS.md D49 to D53"]
  items:
    higher_means: "yes: the disorder or the detail asked is present (1 yes, 0 no)"
    basis: anchors
    source: "schema: yes/no items with range 0 to 1; 9 'Non connu' is a missing code"
  scores:
    panic_disorder_fu:
      meaning: Panic disorder, with or without agoraphobia; the highest of the two yes/no boxes, scored only where both are answered.
      higher_means: panic disorder present (1 yes, 0 no)
      polarity: worse
      basis: anchors
      source: "schema notes (asp anxiety_disorders_fu): 'panic_disorder_<edition> is their highest where both are answered'; range 0 to 1"
  variables:
    "*_onset_age_fu":
      meaning: Age at onset of the disorder, in years, as given at the follow-up visit (hard limit 0 to 70).
      higher_means: later onset
      polarity: neutral
      basis: anchors
      source: "labels: 'age at onset' (for the obsessive-compulsive symptoms, the age when the compulsions or the obsessions began), unit years"
    "*_remission_fu":
      meaning: The disorder is in remission now (1 yes, 0 no); missing when the disorder is absent.
      higher_means: in remission now
      polarity: better
      basis: stated
      source: "schema notes (asp anxiety_disorders_fu): 'a 0 on a remission would read disorder present, not in remission'; 'the ASP question is the state now'"
  flags:
    - "Small: 71 follow-up visits answer at least one question (separation anxiety and post-traumatic stress on 11)."
    - "An empty section at a yearly visit means 'no change' (the change question axis1_summary_changed_fu is in mood_disorders_fu) and stays missing; it is never 'no disorder'."
    - "Within patients the follow-up answers do not repeat the inclusion ones (over the comorbidity forms a yes at inclusion is a no at the last later answer for 21% of the pairs). Do not read a follow-up answer as lifetime, and do not join it with the 'since the last visit' variables of BP and SZ."
    - "panic_disorder_fu is not scored when one of the two boxes is empty or 'not known', even if the other is yes (16 visits over the two forms)."
    - "After a no to the first question the eight older disorder questions are 0; separation anxiety and post-traumatic stress (added late) are not, and the ages, remissions and detail boxes stay missing."

anxiety_disorders_v0:
  description: >-
    The anxiety part of the clinician's list of psychiatric comorbidities at the screening and inclusion
    visits (form 202): a first question on any anxiety disorder, then panic disorder with and without
    agoraphobia, agoraphobia, social phobia, specific phobia (five types), separation anxiety,
    obsessive-compulsive disorder, obsessive-compulsive symptoms, generalised anxiety and post-traumatic
    stress, each yes or no with an age at onset and, for most, a remission box.
  version: inclusion form (form 202), read on the screening and inclusion visits; the twin of anxiety_disorders_fu
  reference: not_applicable
  respondent: clinician
  construct: psychiatric_comorbidity
  period: "the life of the patient up to inclusion (schema title; the form prints no period); the remission boxes are the state now"
  sources: ["schema notes (asp anxiety_disorders_v0)", "docs/asp/PROGRESS.md D49 to D53"]
  items:
    higher_means: "yes: the disorder or the detail asked is present (1 yes, 0 no)"
    basis: anchors
    source: "schema: yes/no items with range 0 to 1; 9 'Non connu' is a missing code"
  scores:
    panic_disorder_v0:
      meaning: Panic disorder, with or without agoraphobia; the highest of the two yes/no boxes, scored only where both are answered.
      higher_means: panic disorder present (1 yes, 0 no)
      polarity: worse
      basis: anchors
      source: "schema notes (asp anxiety_disorders_v0): 'panic_disorder_<edition> is their highest where both are answered'; range 0 to 1"
  variables:
    "*_onset_age_v0":
      meaning: Age at onset of the disorder, in years (hard limit 0 to 70).
      higher_means: later onset
      polarity: neutral
      basis: anchors
      source: "labels: 'age at onset' (for the obsessive-compulsive symptoms, the age when the compulsions or the obsessions began), unit years"
    "*_remission_v0":
      meaning: The disorder is in remission now (1 yes, 0 no); missing when the disorder is absent.
      higher_means: in remission now
      polarity: better
      basis: stated
      source: "schema notes (asp anxiety_disorders_v0): 'a 0 on a remission would read disorder present, not in remission'; 'the ASP question is the state now'"
  flags:
    - "Separation anxiety and post-traumatic stress were added late (a few answers to 2020, routine from 2021). Unlike the eight older disorders they are not set to 0 after a no to the first question: they are answered only after a yes."
    - "After a no to the first question the eight older disorder questions are 0; the ages, the remissions, the five types of specific phobia and the SSRI boxes stay missing."
    - "panic_disorder_v0 is not scored when one of the two boxes is empty or 'not known', even if the other is yes (16 visits over the two forms)."
    - "The list is answered on 83% to 85% of the inclusions to 2015 and on 44% to 57% of those of 2023 and 2024, and on 14% to 91% of the inclusions by centre."
    - "Yes rates follow the age and the centre: any anxiety disorder is yes for 45% of the children and 74% of the adults, and for 42% to 84% of the adults by centre (habit of the centre); no step by year."
    - "A first answer yes with no disorder yes on 60 of 899 inclusion visits: delivered as recorded."
    - "Generalised anxiety and the remissions are not the questions of BP (BP asks about the current episode and about the last month): not joined."

asdi:
  description: >-
    The twenty items of the Asperger Syndrome (and high-functioning autism) Diagnostic Interview, each
    answered no, a little or yes, with a box 'ASDI done' before them and a typed conclusion box
    (diagnostic criteria of Asperger syndrome met). Form 198 of the medical evaluation; 423 visits,
    almost all at inclusion.
  version: 20 items in six domains as printed on form 198; answers no, a little, yes
  reference: "Gillberg C, Gillberg IC, Rastam M, Wentz E. The Asperger Syndrome (and high-functioning autism) Diagnostic Interview (ASDI): a preliminary study of a new structured clinical interview. Autism 2001;5:57-66"
  reference_confidence: "confirmed in source (Lund portal abstract); volume/pages from listings only"
  respondent: clinician
  construct: autism_symptoms
  sources: ["schema notes (asp asdi)", "scale_reference.md section 24", "docs/asp/PROGRESS.md D52 and O28"]
  items:
    meaning: "Each item is delivered as a word (no, a_little, yes), not as a number: the stored codes are not in order (1 yes, 2 a little, 0 no; 9 'Non connu' is a missing code)."
    polarity: not_applicable
  variables:
    asdi_criteria_met:
      meaning: "Typed conclusion: diagnostic criteria of Asperger syndrome met according to the ASDI (1 yes, 0 no). Not computed, and no rule on the items reproduces it."
      polarity: not_applicable
    asdi_done:
      meaning: "Box 'ASDI done' (1 yes, 0 no), on the form from December 2017. Items are filled on many visits with no answer to it and on 7 visits where it says no."
      polarity: not_applicable
  flags:
    - "No total exists and none is computed. The form groups the items in six domains with a required number of symptoms (items 1 to 4 at least 2; 5 to 7 at least 1; 8 and 9 at least 2; 10 to 14 at least 3; 15 to 19 at least 1; item 20) and requires all six."
    - "The stored conclusion follows no rule that reproduces it: recomputed with the thresholds of the form it agrees on 199 of 290 inclusion visits when 'a little' counts as a symptom and on 161 when only 'yes' counts."
    - "To verify: the published rule for the routines domain is 'at least one of the two' in secondary sources (the form requires both); the published answer options, how 'a little' counts and the split of the items by domain were not found. The 2001 paper was not read."
    - "The shortcut 'no for all criteria' ticks no on the twenty items and on the conclusion (13 visits have all twenty at no): such a no cannot be told from a typed one."
    - "The ASDI is published as an interview of informants who knew the person as a child (parents, siblings). Who was interviewed in the cohort is not documented; 78% of the inclusion visits with items are adults."
    - "Answered on 79% of the inclusions to 2014 and 9% of those from 2021. Not split into _v0 and _fu (15 follow-up visits)."
    - "The boxes 'ASDI done' and 'criteria met' differ by year and by centre (habit of the centre); the items show no step."

developmental_disorders_fu:
  description: >-
    The developmental part of the clinician's list of psychiatric comorbidities, asked again at the yearly
    follow-up visits (form 348): ADHD, oppositional defiant disorder, conduct disorder, elimination
    disorder (encopresis, enuresis), eating disorder (anorexia, bulimia), chronic tics (motor tics, vocal
    tics, Tourette syndrome), developmental coordination disorder and four communication disorders
    (language, speech sound, stuttering, social communication), each yes or no with an age at onset,
    detail boxes and a remission box.
  version: yearly follow-up form (form 348); the twin of developmental_disorders_v0
  reference: not_applicable
  respondent: clinician
  construct: psychiatric_comorbidity
  period: "an update given at the visit: the form prints no period; neither the whole life nor strictly the time since the last visit"
  sources: ["schema notes (asp developmental_disorders_fu)", "docs/asp/PROGRESS.md D49 to D53"]
  items:
    higher_means: "yes: the disorder or the detail asked is present (1 yes, 0 no)"
    basis: anchors
    source: "schema: yes/no items with range 0 to 1; 9 'Non connu' is a missing code"
  variables:
    "*_onset_age_fu":
      meaning: Age at onset or at the first symptoms of the disorder, in years, as given at the follow-up visit (hard limit 0 to 70).
      higher_means: later onset
      polarity: neutral
      basis: anchors
      source: "labels: 'age at onset' or 'age at the first symptoms', unit years"
    "*_remission_fu":
      meaning: The disorder is in remission (1 yes, 0 no); missing when the disorder is absent.
      higher_means: in remission
      polarity: better
      basis: stated
      source: "schema notes (asp developmental_disorders_fu): 'a 0 on a remission would read disorder present, not in remission'"
  flags:
    - "Small: 70 follow-up visits answer at least one question; the coordination and communication disorders on about 30."
    - "An empty section at a yearly visit means 'no change' (the change question axis1_summary_changed_fu is in mood_disorders_fu) and stays missing; it is never 'no disorder'."
    - "Within patients the follow-up answers do not repeat the inclusion ones. Do not read a follow-up answer as lifetime, and do not join it with the 'since the last visit' variables of BP and SZ."
    - "The three ADHD presentation boxes (combined, inattentive, hyperactive) are those of the old form and stop in 2021; the presentation is missing after that."
    - "Encopresis and enuresis, anorexia and bulimia, and the three tic questions are 0 after a no to their parent question; ages, remissions, types and treatment boxes stay missing."

