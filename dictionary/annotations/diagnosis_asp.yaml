      polarity: neutral
      basis: anchors
      source: "label: 'age at the first one', unit years"
    "self_harm_*_kind_fu":
      meaning: "Kind of the self-injurious behaviour at the first episode and now (biting, hitting oneself, scratching, burning, cutting, amputation)."
      polarity: not_applicable
  flags:
    - "What the raters meant is open. Of the 7 follow-up answers of patients with an attempt at inclusion, 2 say yes and 5 no; of the 45 of patients with self-injurious behaviour at inclusion, 20 say yes and 25 no. Do not read the answers as lifetime, and do not join them with the 'since the last visit' variables of BP and SZ."
    - "An empty follow-up answer means that nothing was asked or typed; a no is an answer. The change question of the form (sleep_self_harm_changed_fu, in sleep_disorders_fu) does not stop the questions."
    - "Very few details: three answers for each age and for the number of attempts."
    - "The ages and the kinds stay missing after a no."

