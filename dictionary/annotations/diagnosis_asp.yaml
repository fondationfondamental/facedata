wisc4_indices:
  description: >-
    The four indices (verbal comprehension, perceptual reasoning, working memory, processing speed) and
    the full-scale IQ of the Wechsler Intelligence Scale for Children, fourth edition, as the clinician
    copied them into the medical evaluation (form 119), with a box saying that this edition was used.
    Typed numbers; nothing is computed.
  version: WISC-IV
  reference: "Wechsler 2003 (WISC-IV); French edition ECPA/Pearson 2005, ages 6:0 to 16:11"
  reference_confidence: "composition confirmed in source (Pearson technical reports; Belgian test list); index range 45-155, FSIQ 40-160 and scaled range: to verify"
  respondent: test
  construct: intellectual_ability
  period: "the date of the assessment (iq_assessment_date in iq_assessment), not the date of the visit"
  sources: ["schema notes (asp wisc4_indices)", "scale_reference.md section 22", "docs/asp/PROGRESS.md D55, O33 and O34"]
  variables:
    wisc4_done:
      meaning: The WISC-IV was used (1 yes, 0 no); the indices are filled only after a yes.
      polarity: not_applicable
    wisc4_icv_index:
      meaning: Verbal comprehension index of the WISC-IV, as typed. Delivered between 45 and 155.
      construct: verbal_ability
    wisc4_irp_index:
      meaning: Perceptual reasoning index of the WISC-IV, as typed. Delivered between 45 and 155.
      construct: visuospatial
    wisc4_imt_index:
      meaning: Working memory index of the WISC-IV, as typed. Delivered between 45 and 155.
      construct: working_memory
    wisc4_ivt_index:
      meaning: Processing speed index of the WISC-IV, as typed. Delivered between 45 and 155.
      construct: processing_speed
    wisc4_qit:
      meaning: Full-scale IQ of the WISC-IV, as typed. Delivered between 40 and 160.
  flags:
    - "The full-scale IQ is missing on 60% of the visits that hold the four indices, and the spread of the indices is larger where it is missing (median 37 points against 24): raters may leave it out of a heterogeneous profile, so the visits with a full-scale IQ are a selected group."
    - "One schema per edition: never pool these indices with those of the WISC-V or the WAIS-IV (other subtests and norms)."
    - "The indices belong to the date of the assessment (iq_assessment_date), not to the visit: the box is ticked on 37 visits of patients aged 18 or more at the visit, 5 of them aged 18 or more at the assessment."
    - "To verify: the hard limits (45 to 155, 40 to 160) are those published for the WISC-V; no source read states the ranges, the mean or the standard deviation for the WISC-IV."
    - "Used mostly to 2017 (138 visits, 67 since 2018); 59 follow-up visits hold an index. The indices differ by year and by centre (age mix and small groups)."

wisc5_indices:
  description: >-
    The five indices (verbal comprehension, visual spatial, fluid reasoning, working memory, processing
    speed) and the full-scale IQ of the Wechsler Intelligence Scale for Children, fifth edition, as the
    clinician copied them into the medical evaluation (form 119), with a box saying that this edition
    was used. Typed numbers; nothing is computed.
  version: WISC-V
  reference: "Wechsler 2014 (WISC-V); French edition ECPA 2016"
  reference_confidence: "confirmed in source (Pearson interpretive report; Canivez & Watkins 2016)"
  respondent: test
  construct: intellectual_ability
  period: "the date of the assessment (iq_assessment_date in iq_assessment), not the date of the visit"
  sources: ["schema notes (asp wisc5_indices)", "scale_reference.md section 22", "docs/asp/PROGRESS.md D55"]
  variables:
    wisc5_done:
      meaning: The WISC-V was used (1 yes, 0 no); the indices are filled only after a yes.
      polarity: not_applicable
    wisc5_icv_index:
      meaning: "Verbal comprehension index of the WISC-V, as typed. Published primary indices: mean 100, standard deviation 15, range 45 to 155."
      construct: verbal_ability
    wisc5_ivs_index:
      meaning: "Visual spatial index of the WISC-V, as typed. Published primary indices: mean 100, standard deviation 15, range 45 to 155."
      construct: visuospatial
    wisc5_irf_index:
      meaning: "Fluid reasoning index of the WISC-V, as typed. Published primary indices: mean 100, standard deviation 15, range 45 to 155."
    wisc5_imt_index:
      meaning: "Working memory index of the WISC-V, as typed. Published primary indices: mean 100, standard deviation 15, range 45 to 155."
      construct: working_memory
    wisc5_ivt_index:
      meaning: "Processing speed index of the WISC-V, as typed. Published primary indices: mean 100, standard deviation 15, range 45 to 155."
      construct: processing_speed
    wisc5_qit:
      meaning: "Full-scale IQ of the WISC-V, as typed. Published: mean 100, standard deviation 15, range 40 to 160; it rests on seven subtests."
  flags:
