sleep_disorders_fu:
  description: >-
    Two questions of the clinician asked again at the yearly follow-up visits (form 203, 'Autres
    troubles associés'): insomnia (difficulty falling asleep, difficulty staying asleep, non-restorative
    sleep) and hypersomnia (prolonged night sleep, prolonged daytime sleep), each with the age at the
    first episode and a remission box; and the change question of the whole form.
  version: form 203 on the yearly follow-up visits; the twin of sleep_disorders_v0
  reference: not_applicable
  respondent: clinician
  construct: sleep_quality
  period: "an update given at the visit: the form prints no period; neither the whole life nor strictly the time since the last visit"
  sources: ["schema notes (asp sleep_disorders_fu)", "docs/asp/PROGRESS.md D48 to D53 and O29"]
  items:
    higher_means: "yes: the sleep disorder or the detail asked is present (1 yes, 0 no)"
    basis: anchors
    source: "schema: yes/no items with range 0 to 1; 9 'Non connu' is a missing code"
  variables:
    sleep_self_harm_changed_fu:
      meaning: "Change since the last visit for the whole of form 203: the sleep part and the self-injury part (suicide_and_self_harm_fu). Mandatory at the yearly visits."
      higher_means: a change since the last visit is declared (1 yes, 0 no)
      polarity: not_applicable
      basis: anchors
      source: "label: 'change since the last visit (0 no, 1 yes)'"
    "*_onset_age_fu":
      meaning: Age at the first episode of insomnia or hypersomnia, in years (hard limit 0 to 70).
      higher_means: later first episode
      polarity: neutral
      basis: anchors
      source: "labels: 'age at the first episode', unit years"
    "*_remission_fu":
      meaning: The sleep disorder is in remission (1 yes, 0 no); missing when the disorder is absent.
      higher_means: in remission
      polarity: better
      basis: stated
      source: "schema notes (asp sleep_disorders_fu): 'a 0 on a remission would read disorder present, not in remission'"
  flags:
    - "Small: 60 follow-up visits answer a sleep question; 184 hold the change question."
    - "An empty yearly sleep section means 'no change' and stays missing; it is never 'no sleep disorder'. A no to the change question does not stop the questions (26 of 150 visits with a no still hold the section)."
    - "A sleep complaint is a state: a yes at inclusion and a no later is not a contradiction (insomnia: 9 of 20 pairs)."
    - "The detail boxes and the remission stay missing after a no."

