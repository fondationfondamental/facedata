    tics, Tourette syndrome), developmental coordination disorder and four communication disorders
    (language, speech sound, stuttering, social communication), each yes or no with an age at onset,
    detail boxes and a remission box.
  version: inclusion form (form 202), read on the screening and inclusion visits; the twin of developmental_disorders_fu
  reference: not_applicable
  respondent: clinician
