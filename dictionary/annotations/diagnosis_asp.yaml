    - "Yes rates follow the age and the centre: ADHD is yes for 44% of the children and 21% of the adults, the social communication disorder for 41% and 9%; among adults ADHD runs from 13% to 80% by centre."
    - "Encopresis and enuresis, anorexia and bulimia, and the three tic questions are 0 after a no to their parent question; ages, remissions, types, treatment boxes and the five blocks added late stay missing."
    - "An eating disorder yes with neither anorexia nor bulimia yes on 40 of 141 inclusion visits: delivered as recorded."
    - "Stuttering here and the stuttering question of the neuropsychology form (learning_disorders) agree on 186 of 196 visits; they are two questions."

dsm_criteria:
  description: >-
    The DSM-5 criteria of autism spectrum disorder ticked by the clinician (form 198): nine yes/no
    criteria (A1 to A3 social communication, B1 to B4 restricted and repetitive behaviours, C early
    onset, D impairment), a typed conclusion that equals the diagnosis of the cohort, five DSM-5
    specifiers and, for each of the two domains, three boxes for the level of support required.
  version: "DSM-5 criteria (form 198, 'Critères DSM 5 autisme'); the DSM-IV criteria of the old form are not exported"
  reference: American Psychiatric Association 2013 (DSM-5)
  reference_confidence: cited in schema notes
  respondent: clinician
  construct: psychiatric_diagnosis
  sources: ["schema notes (asp dsm_criteria)", "scale_reference.md section 24 (application part)", "docs/asp/PROGRESS.md D48, D52 and O27"]
  variables:
    "dsm_criterion_*":
      meaning: "One DSM-5 criterion of autism spectrum disorder (1 yes, 0 no; 9 'Inconnu' is a missing code)."
      higher_means: criterion present
      polarity: worse
      basis: anchors
      source: "labels of the schema (deficits, restricted behaviours, symptoms that impair functioning) and range 0 to 1"
    dsm_asd_conclusion:
      meaning: "Typed conclusion of the criteria (1 yes, 0 no). It equals the diagnosis of the cohort for every patient and is not computed from the criteria."
      polarity: not_applicable
    "specifier_*":
      meaning: "A DSM-5 specifier ticked by the clinician (1 yes, 0 no): intellectual impairment, language impairment, known medical or genetic condition, other disorder, catatonia. On the form from 2017, routine from 2021."
    "severity_*":
      meaning: "One of three separate yes/no boxes per domain (social communication; restricted, repetitive behaviours) for the level of support required: support, substantial support, very substantial support. The name of the variable gives the level; 1 means that this level is ticked."
      polarity: not_applicable
  flags:
    - "The conclusion is typed, not computed. On the 1,831 inclusion visits with all nine criteria it differs on 138 from the published DSM-5 rule (all three A criteria, at least two of the four B criteria, C and D). The instruction at the top of the form is the DSM-IV count and may steer the raters."
    - "To verify: the DSM-5 rule is recalled; the DSM-5 text was not read."
    - "A shortcut box 'no for all criteria' (not exported) ticks no on the nine criteria and on the conclusion: 90 inclusion visits have all nine at 0 and a conclusion of 0, and a no ticked by the shortcut cannot be told from a typed one."
    - "The severity of a domain is three yes/no boxes, not one ordered variable: usually exactly one is yes (1,042 of 1,081 visits for social communication, 965 of 1,071 for the restricted behaviours), sometimes two or none."
    - "The form and the thesaurus number the support levels backwards (their 'level 1' is very substantial support): rely on the names of the variables, not on the level numbers."
    - "The specifiers and the severity boxes are answered on 1,230 inclusions, almost all from 2021."
    - "Criterion B1, the specifier 'other disorder' and the severity boxes differ by age and by centre (age mix and habit of the centre); no step by year."
    - "Not split into _v0 and _fu: 19 follow-up visits hold the boxes too."

iq_assessment:
  description: >-
    The summary of the intellectual assessment that the clinician copies into the medical evaluation
    (form 119, typed numbers): a box 'an IQ was already done', the date of the assessment, the age at the
    assessment in years and months, and the general ability index (IAG). The indices themselves are in
    wisc4_indices, wisc5_indices and wais4_indices.
  reference: not_applicable
  respondent: clinician
  construct: intellectual_ability
  period: "the date of the assessment (iq_assessment_date), which is not the date of the visit"
  sources: ["schema notes (asp iq_assessment)", "scale_reference.md section 22", "docs/asp/PROGRESS.md D55, D58, O32 and O35"]
  variables:
    gai_index:
      meaning: "General ability index (IAG) of a Wechsler scale, typed in one field for the three editions (WISC-IV, WISC-V, WAIS-IV), so it cannot be tied to an edition. Delivered between 40 and 160."
    iq_assessment_done:
      meaning: "Box 'an IQ was already done' of the old form (1 yes, 0 no; 9 is read as not known). It left the form around 2021 and does not tell whether an assessment exists."
      polarity: not_applicable
    iq_assessment_age_years:
      meaning: Age at the intellectual assessment, in whole years.
      higher_means: older at the assessment
      polarity: neutral
      basis: anchors
      source: "label: 'Age at the intellectual assessment, years'"
    iq_assessment_age_months:
      meaning: Months above the whole years of the age at the assessment (0 to 11); to be added to iq_assessment_age_years.
    iq_assessment_date:
      meaning: Date of the assessment; the indices of wisc4_indices, wisc5_indices and wais4_indices belong to this date.
      polarity: not_applicable
  flags:
    - "gai_index is one field for the three editions of the Wechsler scales. The GAI of the WAIS-IV is made of three verbal and three perceptual subtests (Canivez 2010); the composition of the French IAG of the WISC-IV and of the WISC-V was not settled (to verify)."
    - "A step with no known cause: in one centre gai_index holds another number (median 66 against 110 to 116 in the others, and 46 points below the WISC-V full-scale IQ typed at the same visits; almost all from 2023). The values between 40 and 160 are delivered as typed."
    - "gai_index is on 675 visits, all at inclusion and almost all from 2018; the 9 values outside 40 to 160 are removed."
    - "The date is empty (0000-00-00 in the export) on 262 visits, 184 of which hold an index."
    - "iq_assessment_done says no on 268 visits, 205 of which hold an index of one of the three editions: do not use it as a filter."
    - "The edition boxes agree with the age at the assessment only in part (a WISC box ticked for some adults, 10 WAIS-IV assessments dated under 16 years)."

learning_difficulties_fu:
  description: >-
    Four questions of the clinician asked again at the yearly follow-up visits (form 120): a specific
    learning disorder with impairment in reading, in written expression or in mathematics, and
    dysgraphia, each yes or no. After a yes, two boxes: it interfered with school or daily life, and it
    was assessed or re-educated by a professional.
  version: form 120 on the yearly follow-up visits; the twin of learning_difficulties_v0
  reference: not_applicable
  respondent: clinician
  construct: development
  period: "an update given at the visit: the form prints no period; neither the whole life nor strictly the time since the last visit"
  sources: ["schema notes (asp learning_difficulties_fu)", "docs/asp/PROGRESS.md D49 to D53"]
  items:
    higher_means: "yes: the disorder or the detail asked is present (1 yes, 0 no)"
    basis: anchors
    source: "schema: yes/no items with range 0 to 1; 9 'Non connu' is a missing code"
  flags:
    - "Small: 77 follow-up visits answer at least one question."
    - "The form has no change question: an empty yearly answer means that nothing was typed."
    - "Within patients the follow-up answers do not repeat the inclusion ones (a reading disorder yes at inclusion is a no at the last later answer for 4 of 4 patients). Do not read a follow-up answer as lifetime."
    - "The two boxes after a disorder stay missing after a no."
    - "Not the questions of learning_disorders in the neuropsychology tab (dyslexia, dysorthographia, dyscalculia): close, but not joined."

learning_difficulties_v0:
  description: >-
    Four questions of the clinician at the screening and inclusion visits (form 120): a specific
    learning disorder with impairment in reading, in written expression or in mathematics, and
    dysgraphia, each yes or no. After a yes, two boxes: it interfered with school or daily life, and it
    was assessed or re-educated by a professional.
  version: form 120 on the screening and inclusion visits; the twin of learning_difficulties_fu
  reference: not_applicable
  respondent: clinician
  construct: development
  period: "the form prints no period; answered at the screening and inclusion visits"
  sources: ["schema notes (asp learning_difficulties_v0)", "docs/asp/PROGRESS.md D49 to D53"]
  items:
    higher_means: "yes: the disorder or the detail asked is present (1 yes, 0 no)"
    basis: anchors
    source: "schema: yes/no items with range 0 to 1; 9 'Non connu' is a missing code"
  flags:
    - "The current label of the form is the DSM-5 specific learning disorder, with no age window; an older, narrower wording (difficulties between given ages) sits in the other language slot of the form."
    - "Not the questions of learning_disorders in the neuropsychology tab (dyslexia, dysorthographia, dyscalculia): reading and dyslexia agree on 598 of the 630 visits with both, but the names are not shared."
    - "The two boxes after a disorder stay missing after a no."
    - "Answered on 47% to 49% of the inclusions of 2017 to 2019 and on 78% to 83% of those of 2022 to 2025; 49% to 92% by centre."
    - "The re-education boxes differ by age and by centre (age mix, small groups)."

mood_disorders_fu:
  description: >-
    The mood part of the clinician's list of psychiatric comorbidities, asked again at the yearly
    follow-up visits (form 348, the axis I summary 'Résumé diagnostic DSM-5'): eight yes/no questions
    (major depressive, manic, hypomanic and mixed episode; single-episode and recurrent depressive
    disorder, dysthymic disorder, bipolar disorder with type I and type II boxes). After a yes: the
    number of episodes, the age at the first episode, the age at the first treatment and remission now.
    Also the interview used for the summary and the change question of the whole summary form.
  version: yearly follow-up form (form 348); the twin of mood_disorders_v0
  reference: not_applicable
  respondent: clinician
  construct: psychiatric_comorbidity
  period: "an update given at the visit: the form prints no period; neither the whole life nor strictly the time since the last visit"
  sources: ["schema notes (asp mood_disorders_fu)", "docs/asp/PROGRESS.md D48 to D53 and O29"]
  items:
    higher_means: "yes: the episode, the disorder or the detail asked is present (1 yes, 0 no)"
    basis: anchors
    source: "schema: yes/no items with range 0 to 1; 9 'Non connu' is a missing code"
  variables:
    axis1_summary_changed_fu:
      meaning: "Change since the last visit for the whole axis I summary form (not the mood part alone); mandatory at the yearly visits."
      higher_means: a change since the last visit is declared (1 yes, 0 no)
      polarity: not_applicable
      basis: anchors
      source: "label: 'change since the last visit (0 no, 1 yes)'"
    axis1_interview_fu:
      meaning: "Interview used for the axis I summary: DIGS, Kiddie-SADS or MINI."
      polarity: not_applicable
    "*_n_episodes_fu":
      meaning: Number of episodes, the current one included, as given at the follow-up visit; 0 after a no.
      higher_means: more episodes
      polarity: worse
      basis: anchors
      source: "labels: 'number of episodes, including the current episode'; range 0 to 99"
    "*_first_age_fu":
      meaning: Age at the first episode, in years (hard limit 0 to 70).
      higher_means: later first episode
      polarity: neutral
      basis: anchors
      source: "labels: 'age at the first episode', unit years"
    "*_first_treatment_age_fu":
      meaning: Age at the first treatment of the disorder, in years (hard limit 0 to 70).
      higher_means: later first treatment
      polarity: neutral
      basis: anchors
      source: "labels: 'age at the first treatment', unit years"
    "*_remission_fu":
      meaning: The patient is in remission now (1 yes, 0 no); missing when the episode or disorder is absent.
      higher_means: in remission now
      polarity: better
      basis: stated
      source: "schema notes (asp mood_disorders_fu): 'whether the patient is in remission now'; 'a 0 on a remission would read disorder present, not in remission'"
  flags:
    - "Small: 70 follow-up visits answer a mood question; the change question is answered on 212 and the interview on 112."
    - "An empty yearly section means 'no change' and stays missing; it is never 'no disorder'. A no to the change question does not stop the questions: 26 of the 162 visits with a no still hold an answer of the list."
    - "A follow-up answer is an update given at that visit, and within patients it does not repeat the inclusion answer. Do not read it as lifetime, and do not join it with the 'since the last visit' variables of BP and SZ."
    - "The counts include the current episode; they are not known to be the same measure as the lifetime counts of BP (not joined)."
    - "The ages, the remission and the two type boxes of the bipolar disorder stay missing after a no."

mood_disorders_v0:
  description: >-
    The mood part of the clinician's list of psychiatric comorbidities at the screening and inclusion
    visits (form 202, the axis I summary 'Résumé diagnostic DSM-5'): eight yes/no questions (major
    depressive, manic, hypomanic and mixed episode; single-episode and recurrent depressive disorder,
    dysthymic disorder, bipolar disorder with type I and type II boxes). After a yes: the number of
    episodes, the age at the first episode, the age at the first treatment and remission now. Also the
    interview used for the summary (DIGS, Kiddie-SADS or MINI).
  version: inclusion form (form 202), read on the screening and inclusion visits; the twin of mood_disorders_fu
  reference: not_applicable
  respondent: clinician
  construct: psychiatric_comorbidity
  period: "the life of the patient up to inclusion (schema title; the form prints no period); the remission boxes are the state now"
  sources: ["schema notes (asp mood_disorders_v0)", "docs/asp/PROGRESS.md D48 to D53 and O36"]
  items:
    higher_means: "yes: the episode, the disorder or the detail asked is present (1 yes, 0 no)"
    basis: anchors
    source: "schema: yes/no items with range 0 to 1; 9 'Non connu' is a missing code"
  variables:
    axis1_interview_v0:
      meaning: "Interview used for the axis I summary: DIGS, Kiddie-SADS or MINI."
      polarity: not_applicable
    "*_n_episodes_v0":
      meaning: Number of episodes, the current one included; 0 after a no.
      higher_means: more episodes
      polarity: worse
      basis: anchors
      source: "labels: 'number of episodes, including the current episode'; range 0 to 99"
    "*_first_age_v0":
      meaning: Age at the first episode, in years (hard limit 0 to 70).
      higher_means: later first episode
      polarity: neutral
      basis: anchors
      source: "labels: 'age at the first episode', unit years"
    "*_first_treatment_age_v0":
      meaning: Age at the first treatment of the disorder, in years (hard limit 0 to 70); it can be before the first diagnosed episode.
      higher_means: later first treatment
      polarity: neutral
      basis: anchors
      source: "labels: 'age at the first treatment', unit years"
    "*_remission_v0":
      meaning: The patient is in remission now (1 yes, 0 no); missing when the episode or disorder is absent.
      higher_means: in remission now
      polarity: better
      basis: stated
      source: "schema notes (asp mood_disorders_v0): 'whether the patient is in remission now'; 'a 0 on a remission would read disorder present, not in remission'"
  flags:
    - "The list is answered on 83% to 85% of the inclusions to 2015 and on 44% to 57% of those of 2023 and 2024. Among the larger centres the share runs from 16% to 88%, with shifts by period that are not explained."
    - "A step with no known cause: among adults a major depressive episode is yes for 44% to 67% from 2014 to 2022 and for 30% to 40% in 2023 to 2025."
    - "Yes rates follow the age and the centre: a major depressive episode is yes for 10% of the children and 49% of the adults, and for 25% to 87% of the adults by centre (habit of the centre)."
    - "The number of episodes is missing under a yes for 26% of the major depressive episodes and for more of the disorders; a single-episode disorder has a count above 1 on 31 of 124 answered counts. Delivered as recorded."
    - "The counts include the current episode; they are not known to be the same measure as the lifetime counts of BP (not joined). The age at the first treatment is that of the disorder, not BP's age at the first psychotropic."
    - "The interview is filled on 95% to 97% of the inclusions of 2013 and 2014 and on 34% to 67% from 2018."
    - "The ages, the remission and the two type boxes of the bipolar disorder stay missing after a no."

psychotic_symptoms_fu:
  description: >-
    The psychotic part of the clinician's list of psychiatric comorbidities, asked again at the yearly
    follow-up visits (form 348): a first question on psychotic symptoms, then delusions (four
    mechanisms), hallucinations (five senses), disorganisation (three mechanisms) and deficit symptoms
    (three kinds), the onset and the course of the symptoms; and a schizophrenia spectrum disorder with
    five type boxes, ages, a number of episodes and a remission box.
  version: yearly follow-up form (form 348); the twin of psychotic_symptoms_v0
  reference: not_applicable
  respondent: clinician
  construct: psychotic_symptoms
  period: "an update given at the visit: the form prints no period; neither the whole life nor strictly the time since the last visit"
  sources: ["schema notes (asp psychotic_symptoms_fu)", "docs/asp/PROGRESS.md D49 to D53"]
  items:
    higher_means: "yes: the symptom, the disorder or the detail asked is present (1 yes, 0 no)"
    basis: anchors
    source: "schema: yes/no items with range 0 to 1; 9 'Non connu' is a missing code"
  variables:
    psychotic_onset_fu:
      meaning: "Onset of the psychotic symptoms: acute or progressive."
      polarity: not_applicable
    psychotic_course_fu:
      meaning: "Course of the psychotic symptoms: chronic, intermittent or episodic."
      polarity: not_applicable
    schizophrenia_n_episodes_fu:
      meaning: Number of episodes of the schizophrenia spectrum disorder.
      higher_means: more episodes
      polarity: worse
      basis: anchors
      source: "label: 'number of episodes'; range 0 to 99"
    "schizophrenia_first_*_age_fu":
      meaning: Age at the first episode or at the first treatment of the schizophrenia spectrum disorder, in years.
      higher_means: later first episode or first treatment
      polarity: neutral
      basis: anchors
      source: "labels: 'age at the first episode', 'age at the first treatment', unit years"
    schizophrenia_remission_fu:
      meaning: The schizophrenia spectrum disorder is in remission (1 yes, 0 no); missing when the disorder is absent.
      higher_means: in remission
      polarity: better
      basis: anchors
      source: "label: 'in remission'; range 0 to 1"
  flags:
    - "Very small: 68 follow-up visits answer at least one question; psychotic symptoms are yes on 3 and a schizophrenia spectrum disorder on none."
    - "An empty section at a yearly visit means 'no change' (the change question axis1_summary_changed_fu is in mood_disorders_fu) and stays missing; it is never 'no symptom'."
    - "A follow-up answer is an update given at that visit: do not read it as lifetime, and do not join it with the 'since the last visit' variables of BP and SZ."
    - "The four group questions are 0 after a no to the first question; the mechanisms, senses, type boxes and remission stay missing."

