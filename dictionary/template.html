<title>FACE data dictionary</title>
<!--
  FACE data dictionary. One file, no network: open it from the disk.

  For a program or a coding agent: do not parse this page. The whole dictionary is the JSON text of the element
  script#face-dictionary (type application/json) near the end of the page, and the same content is the file

<style>
:root {
  color-scheme: light;
  --bg: #f4f4f1; --surface: #fcfcfb; --surface-2: #f0efec; --line: #e0dfda; --line-2: #cfcec8;

  --accent: #2a78d6; --accent-soft: #e4eefb;
  --bp: #2a78d6; --sz: #eb6834; --dr: #1baf7a; --asp: #eda100;

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #252524; --line: #343431; --line-2: #4a4a46;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #94938a;
    --accent: #3987e5; --accent-soft: #1d2c40;
    --bp: #3987e5; --sz: #d95926; --dr: #199e70; --asp: #c98500;
    --warn-bg: #3a2f10; --warn-text: #f3d48a; --good: #0ca30c; --bad: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #252524; --line: #343431; --line-2: #4a4a46;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #94938a;
  --accent: #3987e5; --accent-soft: #1d2c40;
  --bp: #3987e5; --sz: #d95926; --dr: #199e70; --asp: #c98500;
  --warn-bg: #3a2f10; --warn-text: #f3d48a; --good: #0ca30c; --bad: #e66767;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); display: flex; flex-direction: column; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
code, .mono { font-family: var(--mono); font-size: 0.92em; }

header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; font-weight: 650; white-space: nowrap; }
header .sub { color: var(--text-3); font-size: 12px; white-space: nowrap; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 5px 11px; border-right: 1px solid var(--line); display: inline-flex; align-items: center; gap: 6px; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); font-weight: 600; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.dot.bp { background: var(--bp); } .dot.sz { background: var(--sz); } .dot.dr { background: var(--dr); } .dot.asp { background: var(--asp); }
#search { flex: 1 1 240px; min-width: 180px; max-width: 520px; padding: 7px 11px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); }
.btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; padding: 5px 11px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.small { padding: 2px 8px; font-size: 12px; border-radius: 6px; }
.btn.link { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }

#tabs { display: flex; gap: 2px; padding: 6px 12px 0; background: var(--surface); border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; }
#tabs button { border: 0; background: none; padding: 7px 10px 8px; border-bottom: 3px solid transparent; white-space: nowrap; font-size: 12.5px; color: var(--text-2); }
#tabs button[aria-selected="true"] { border-bottom-color: var(--accent); color: var(--text); font-weight: 650; }
#tabs button .count { color: var(--text-3); font-weight: 400; margin-left: 5px; font-variant-numeric: tabular-nums; }
#tabs button.empty { opacity: 0.45; }

#layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 232px minmax(0, 1fr) minmax(360px, 34vw); }
#filters, #list, #detail { overflow-y: auto; min-height: 0; }
#filters { padding: 12px 14px 30px; border-right: 1px solid var(--line); background: var(--surface); }
#filters h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3); margin: 14px 0 5px; font-weight: 650; }
#filters h2:first-child { margin-top: 0; }
#filters label { display: flex; align-items: center; gap: 7px; padding: 1.5px 0; }
#filters select { width: 100%; padding: 5px 6px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--surface); }
#filters .hint { color: var(--text-3); font-size: 11.5px; margin: 3px 0 0; }

#list { padding: 0 0 60px; }
#summary { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--bg); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
#summary .grow { flex: 1; }
.group { margin: 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.group > .head { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 9px 12px; width: 100%; border: 0; background: none; text-align: left; }
.group > .head:hover { background: var(--surface-2); }
.group .caret { color: var(--text-3); transition: transform 0.12s; margin-top: 1px; }
.group.open .caret { transform: rotate(90deg); }
.group .title { font-weight: 650; }
.group .desc { color: var(--text-2); font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; }
.group .meta { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
.group .side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; color: var(--text-3); font-size: 12px; white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; font-size: 11.5px; color: var(--text-2); background: var(--surface); white-space: nowrap; line-height: 18px; }
.chip.level-score { border-color: var(--text-2); color: var(--text); font-weight: 650; }
.chip.level-subscore { border-color: var(--line-2); color: var(--text); font-weight: 600; }
.chip.warn { background: var(--warn-bg); border-color: transparent; color: var(--warn-text); }
.chip.cohort { padding: 0 6px; font-weight: 600; text-transform: uppercase; font-size: 10.5px; letter-spacing: 0.03em; }
.rows { border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 22px minmax(0, 1fr) 150px 76px 92px 66px; gap: 10px; align-items: center; padding: 5px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--surface-2); }
.row.selected { background: var(--accent-soft); }
.row .name { min-width: 0; }
.row .id { font-family: var(--mono); font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .label { color: var(--text-2); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.lv-subscore .name { padding-left: 14px; } .row.lv-item .name { padding-left: 28px; } .row.lv-companion .name { padding-left: 28px; }
.row .chips { display: flex; gap: 4px; flex-wrap: wrap; }
.row .cohorts { display: flex; gap: 3px; }
.row .num { text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; color: var(--text-2); }
.meter { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin-top: 3px; }
.meter > i { display: block; height: 100%; background: var(--text-3); border-radius: 3px; }
.rowhead { display: grid; grid-template-columns: 22px minmax(0, 1fr) 150px 76px 92px 66px; gap: 10px; padding: 4px 12px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-3); border-bottom: 1px solid var(--line); background: var(--surface-2); }
.rowhead .num { text-align: right; }
.more { padding: 8px 12px; }
.empty { padding: 40px 20px; text-align: center; color: var(--text-3); }

#detail { background: var(--surface); border-left: 1px solid var(--line); padding: 14px 16px 60px; }
#detail .placeholder { color: var(--text-3); padding: 30px 6px; }
#detail h2 { font-size: 17px; margin: 0 0 2px; word-break: break-all; }
#detail h2.plain { word-break: normal; }
#detail h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3); margin: 18px 0 6px; font-weight: 650; border-top: 1px solid var(--line); padding-top: 12px; }
#detail p { margin: 4px 0; }
#detail .lead { color: var(--text-2); }
#detail .actions { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
#detail .close { display: none; float: right; }
dl.kv { display: grid; grid-template-columns: 118px minmax(0, 1fr); gap: 3px 10px; margin: 0; }
dl.kv dt { color: var(--text-3); font-size: 12.5px; }
dl.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.small { font-size: 12px; color: var(--text-3); }
.direction { display: flex; gap: 8px; align-items: baseline; padding: 7px 10px; background: var(--surface-2); border-radius: 8px; }
.direction .arrow { font-weight: 700; }
.direction.worse .arrow { color: var(--bad); } .direction.better .arrow { color: var(--good); }
.missing-note { background: var(--warn-bg); color: var(--warn-text); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; }
.cohortcard { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 8px 0; }
.cohortcard .top { display: flex; align-items: center; gap: 7px; font-weight: 650; margin-bottom: 4px; }
.cohortcard .top .grow { flex: 1; }
.statline { font-size: 12.5px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.chart { margin: 6px 0 2px; }
.chart svg { display: block; width: 100%; height: auto; }
.chart .axis { font-size: 10px; fill: var(--text-3); }
.hbar { display: grid; grid-template-columns: minmax(70px, 42%) minmax(0, 1fr) 56px; gap: 8px; align-items: center; font-size: 12px; padding: 1.5px 0; }
.hbar .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); }
.hbar .track { height: 10px; }
.hbar .track i { display: block; height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; }
.hbar .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-2); }
table.plain { border-collapse: collapse; width: 100%; font-size: 12.5px; }
table.plain th, table.plain td { text-align: left; padding: 3px 8px 3px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.plain th { color: var(--text-3); font-weight: 600; font-size: 11.5px; }
table.plain td.num { text-align: right; font-variant-numeric: tabular-nums; }
details { margin: 6px 0; }
details > summary { cursor: pointer; color: var(--text-2); }
details .notes { white-space: pre-wrap; font-size: 12.5px; color: var(--text-2); margin-top: 6px; }
.links { display: flex; flex-wrap: wrap; gap: 4px; }
.links button { font-family: var(--mono); font-size: 11.5px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 0 6px; line-height: 20px; }
.links button:hover { background: var(--surface-2); }

.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100vw); background: var(--surface); border-left: 1px solid var(--line-2); box-shadow: -12px 0 30px rgba(0,0,0,0.18); z-index: 20; padding: 16px 18px 40px; overflow-y: auto; }
.drawer[hidden] { display: none; }
.drawer h2 { font-size: 17px; margin: 0 0 8px; }
.drawer h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3); margin: 18px 0 6px; }
.drawer textarea { width: 100%; min-height: 84px; font-family: var(--mono); font-size: 12px; border: 1px solid var(--line-2); border-radius: 8px; padding: 8px; background: var(--surface-2); color: var(--text); resize: vertical; }
.basketitem { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--line); }
.basketitem .id { font-family: var(--mono); font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.basketitem .label { color: var(--text-2); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#tooltip { position: fixed; z-index: 40; pointer-events: none; background: var(--text); color: var(--surface); padding: 4px 8px; border-radius: 6px; font-size: 12px; max-width: 320px; display: none; }
#tooltip b { font-variant-numeric: tabular-nums; }
#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--surface); padding: 7px 14px; border-radius: 8px; font-size: 13px; z-index: 50; display: none; }
#filtertoggle { display: none; }
@media (max-width: 1180px) {
  #layout { grid-template-columns: 232px minmax(0, 1fr); }
  #detail { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100vw); z-index: 15; box-shadow: -12px 0 30px rgba(0,0,0,0.18); display: none; }
  #detail.shown { display: block; }
  #detail .close { display: inline-block; }
}
@media (max-width: 780px) {
  #layout { grid-template-columns: minmax(0, 1fr); }
  #filters { display: none; position: fixed; top: 0; left: 0; bottom: 0; width: min(300px, 100vw); z-index: 16; box-shadow: 12px 0 30px rgba(0,0,0,0.18); }
  #filters.shown { display: block; }
  #filtertoggle { display: inline-block; }
  .row, .rowhead { grid-template-columns: 22px minmax(0, 1fr) 76px 60px; }
  .row .chips, .row .cohorts, .rowhead .c3, .rowhead .c4 { display: none; }
  header .sub { display: none; }
}
</style>

<body>
<header>
  <h1>FACE data dictionary</h1>
  <span class="sub" id="subtitle"></span>
  <div class="seg" id="cohortswitch" role="group" aria-label="Cohort"></div>
  <input id="search" type="search" placeholder="Search a name, a label, an instrument, a raw column…  ( / )" aria-label="Search all tabs" autocomplete="off">
  <button class="btn" id="filtertoggle">Filters</button>
  <button class="btn" id="aboutbutton">How to read</button>
  <button class="btn primary" id="basketbutton">Basket (0)</button>
</header>
<nav id="tabs" role="tablist" aria-label="Tabs of the dictionary"></nav>
<div id="layout">
  <aside id="filters" aria-label="Filters"></aside>
  <main id="list"><div id="summary"></div><div id="groups"></div></main>
  <aside id="detail" aria-label="Detail"></aside>
</div>
<div class="drawer" id="basket" hidden></div>
<div class="drawer" id="about" hidden></div>
<div id="tooltip"></div>
<div id="toast"></div>

<script id="face-dictionary" type="application/json">__FACE_DICTIONARY_JSON__</script>
<script>
"use strict";
// ---------------------------------------------------------------- data
const D = JSON.parse(document.getElementById("face-dictionary").textContent);
const V = D.variables, I = D.instruments, COHORTS = Object.keys(D.cohorts);
const LEVELS = [["score", "score"], ["subscore", "sub-score"], ["item", "item"], ["standalone", "single"], ["companion", "companion"], ["key", "key"]];
const LEVEL_NAME = Object.fromEntries(LEVELS);
const KINDS = ["continuous", "ordinal", "binary", "nominal", "date", "text"];
const POLARITY = { worse: "higher is worse", better: "higher is better", neutral: "no good or bad side", not_applicable: "no direction" };
const TIMEPOINTS = [["any", "Any"], ["patient", "Once per patient"], ["screening", "Screening"], ["0", "Inclusion (V0)"], ["6", "6 months"],
  ["12", "1 year"], ["18", "18 months"], ["24", "2 years"], ["36", "3 years"], ["48+", "4 years or later"]];
const ORDER = Object.fromEntries(Object.keys(V).map((id, index) => [id, index]));
const VISIT_MONTH = {};
for (const cohort of COHORTS) { VISIT_MONTH[cohort] = {}; for (const visit of D.cohorts[cohort].visits || []) VISIT_MONTH[cohort][visit.visit] = visit; }

function field(v, cohort, name) { const block = v.cohorts[cohort]; return block && block[name] !== undefined ? block[name] : v[name]; }
function instrumentOf(v, cohort) { return cohort && v.cohorts[cohort] ? field(v, cohort, "instrument") : v.instrument; }
function tabOf(v, cohort) {
  if (cohort === "all") return v.tab || "";
  const instrument = I[instrumentOf(v, cohort)];
  return instrument && instrument.cohorts[cohort] ? instrument.cohorts[cohort].tab : (field(v, cohort, "tab") || "");
}
for (const id in V) {                                   // what the search reads, once
  const v = V[id]; v._cohorts = Object.keys(v.cohorts);
  const parts = [id, v.label, v.meaning, v.instrument, (I[v.instrument] || {}).title, v.tab, v.construct && D.constructs[v.construct].label];
  for (const cohort of v._cohorts) { const b = v.cohorts[cohort]; parts.push(b.label, (b.source.columns || []).join(" "), b.instrument, b.excel && b.excel.label); }
  v._hay = parts.filter(Boolean).join(" \n ").toLowerCase();
}

// ---------------------------------------------------------------- state
const state = { cohort: "all", tab: "all", q: "", level: new Set(), kind: new Set(), instrument: "", construct: "", within: new Set(),
  timepoint: "any", repeated: false, missing: "any", stack: "any", metadata: "any", scope: "baseline", toggled: new Map(), shown: new Map(),
  selected: null, selectedType: null, basket: [] };
try { const kept = JSON.parse(localStorage.getItem("face-dictionary-basket") || "[]"); state.basket = kept.filter(id => V[id]); } catch (error) { /* no storage: the basket lives for the session */ }
function saveBasket() { try { localStorage.setItem("face-dictionary-basket", JSON.stringify(state.basket)); } catch (error) { /* ignore */ } }

// ---------------------------------------------------------------- small helpers
// Children into a parent: lists are opened, text becomes a text node, and null, undefined and false are left out.
function put(parent, ...children) {
  for (const child of children.flat(3)) if (child !== null && child !== undefined && child !== false) parent.appendChild(child.nodeType ? child : document.createTextNode(String(child)));
  return parent;
}
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (value === null || value === undefined || value === false) continue;
    if (key === "class") node.className = value;
    else if (key === "text") node.textContent = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (key === "style") node.style.cssText = value;
    else node.setAttribute(key, value === true ? "" : value);
  }
  return put(node, ...children);
}
function svgEl(tag, attrs) { const node = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const key in attrs) node.setAttribute(key, attrs[key]); return node; }
function num(value) { if (value === null || value === undefined) return "–"; if (value === -1) return "<5"; return Number(value).toLocaleString("en-US", { maximumFractionDigits: 4 }); }
function pct(value) { return value === null || value === undefined ? "–" : value.toFixed(value >= 99.95 || value === 0 ? 0 : 1) + "%"; }
function shortVisit(cohort, visit) {
  if (visit === "screening") return "scr"; if (visit === "V0") return "V0";
  const month = (VISIT_MONTH[cohort][visit] || {}).month; if (month === null || month === undefined) return visit;
  return month % 12 === 0 ? (month / 12) + "y" : month + "m";
}
function toast(text) { const node = document.getElementById("toast"); node.textContent = text; node.style.display = "block"; clearTimeout(toast.timer); toast.timer = setTimeout(() => node.style.display = "none", 1600); }
function copyText(text, what) {
  const done = () => toast((what || "Text") + " copied");
  if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done)); } else fallbackCopy(text, done);
}
function fallbackCopy(text, done) { const area = el("textarea", { style: "position:fixed;left:-999px" }); area.value = text; put(document.body, area); area.select(); try { document.execCommand("copy"); done(); } catch (error) { toast("Copy failed: select the text and copy it"); } area.remove(); }
function download(name, text, type) { const link = el("a", { href: URL.createObjectURL(new Blob([text], { type })), download: name }); put(document.body, link); link.click(); setTimeout(() => { URL.revokeObjectURL(link.href); link.remove(); }, 500); }
const tip = document.getElementById("tooltip");
function showTip(event, strong, rest) { tip.textContent = ""; put(tip, el("b", { text: strong }), rest ? " " + rest : ""); tip.style.display = "block"; const x = Math.min(event.clientX + 12, window.innerWidth - tip.offsetWidth - 8); tip.style.left = x + "px"; tip.style.top = (event.clientY + 14) + "px"; }
function hideTip() { tip.style.display = "none"; }
function cohortChip(cohort) { return el("span", { class: "chip cohort", title: D.cohorts[cohort].title }, el("i", { class: "dot " + cohort }), cohort); }

// ---------------------------------------------------------------- filtering
function scopeCohorts(v) {                             // the cohorts a data filter looks at, and whether all of them must pass
  if (state.cohort !== "all") return [[state.cohort], true];
  if (state.within.size) return [[...state.within], true];
  return [v._cohorts, false];
}
function passes(v, test) { const [cohorts, all] = scopeCohorts(v); const results = cohorts.map(c => v.cohorts[c] ? test(v.cohorts[c], c) : false); return all ? results.every(Boolean) : results.some(Boolean); }
function atTimepoint(block, cohort) {
  if (state.timepoint === "patient") return block.table === "patients";

    ["A variable", "One line per column that facedata delivers. Its name is the column name in the tables returned by load(): result.data (one row per visit), result.patients, result.treatments, result.relatives. The raw column of the extraction is on its card."],
    ["Tabs", "Each cohort has the tabs of its Excel dictionary. \"All cohorts\" gathers the tabs of the same name; an instrument sits in the tab of the first cohort that has it."],
    ["Level", "item: counted in a score. sub-score: a score counted in another score, or built on part of its items. score: a total, an index or a standard score. single: belongs to no score. companion: a censoring column (_cens) or the column that names an edition."],
    ["Type", "continuous, ordinal, binary, nominal, date or text: how to treat the values. The card also gives the type of the schema (number, item, band, category, date, time, text, score)."],
    ["Direction", "What a higher value means. Written by hand from the notes of the schemas and the literature notes, with its source, or derived from the formula of the score. Empty when no document says it: nothing is guessed."],
    ["Baseline", "One row per patient: the inclusion visit, completed by the screening visit when the inclusion visit holds nothing of the instrument (facedata.common.baseline)."],
    ["Missing", "At baseline: patients without a value in the baseline row. All visits: visit rows without a value. When the instrument is filled: among the visits that hold at least one value of the instrument."],
    ["Figures", "Computed on the values as delivered by load(winsorise=False): the tails are not clipped. A count from 1 to 4 is never shown (\"<5\"); a variable with fewer than 5 values has no figures, one with fewer than 20 no chart; the values of a text column are never shown."],
    ["Incomplete", "The amber mark lists the fields that no source gives: meaning, construct, direction, range, answer labels."]];
  put(box, kv(lines.map(([key, text]) => [key, text])));
  const table = el("table", { class: "plain" }, el("tr", {}, ["Cohort", "Patients", "Visits", "Variables", "Extraction", "Figures of"].map(text => el("th", { text }))));
  for (const cohort of COHORTS) { const c = D.cohorts[cohort]; put(table, el("tr", {}, el("td", {}, cohortChip(cohort), " " + c.title), el("td", { class: "num", text: num(c.n_patients) }), el("td", { class: "num", text: num(c.n_visits) }), el("td", { class: "num", text: num(c.n_variables) }), el("td", { class: "mono small", text: c.extraction }), el("td", { class: "small", text: c.computed || "" }))); }
  put(box, el("h3", { text: "The data behind the figures" }), table);
  put(box, el("h3", { text: "For a program" }), el("p", { class: "small" }, "The same content is the file ", el("code", { text: "facedata/dictionary/face_dictionary.json" }), " (one line per variable), and the JSON embedded in this page in the element ", el("code", { text: "script#face-dictionary" }), ". Its fields:"));
  put(box, kv(Object.entries(D.meta.fields).map(([key, text]) => [el("code", { text: key }), text])));
}

// ---------------------------------------------------------------- start
document.getElementById("subtitle").textContent = `${num(D.meta.n_variables)} variables · ${num(D.meta.n_instruments)} instruments · built ${D.meta.generated}`;
let typing = null;
document.getElementById("search").addEventListener("input", event => { clearTimeout(typing); typing = setTimeout(() => { const text = event.target.value.trim().toLowerCase(); const had = state.q; state.q = text ? text.split(/\s+/) : ""; if (text && !had) state.tab = "all"; render(); }, 140); });
document.addEventListener("keydown", event => { if (event.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { event.preventDefault(); document.getElementById("search").focus(); }
  if (event.key === "Escape") { hideTip(); for (const id of ["basket", "about"]) document.getElementById(id).hidden = true; document.getElementById("filters").classList.remove("shown"); } });
document.getElementById("basketbutton").addEventListener("click", () => { const box = document.getElementById("basket"); box.hidden = !box.hidden; document.getElementById("about").hidden = true; if (!box.hidden) renderBasket(); });
document.getElementById("aboutbutton").addEventListener("click", () => { const box = document.getElementById("about"); box.hidden = !box.hidden; document.getElementById("basket").hidden = true; if (!box.hidden) renderAbout(); });
document.getElementById("filtertoggle").addEventListener("click", () => document.getElementById("filters").classList.toggle("shown"));
function openFromHash() { const hash = decodeURIComponent(location.hash.slice(1)); if (hash.startsWith("instrument=") && I[hash.slice(11)]) selectInstrument(hash.slice(11)); else if (V[hash]) selectVariable(hash); }
window.addEventListener("hashchange", openFromHash);
render(); refreshDetail(); openFromHash();
window.faceDictionary = { data: D, state, render, selectVariable, selectInstrument, basketCsv, loadSnippet, matches };   // for tests and for the console
</script>
